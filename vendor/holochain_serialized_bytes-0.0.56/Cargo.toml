# VENDORED — holochain_serialized_bytes 0.0.56, verbatim source, ONE dep-pin change.
#
# See VENDOR-NOTE.md for the full rationale. Short version:
#
#   upstream 0.0.56 pins  serde = "=1.0.219"
#   upstream 0.0.57 pins  serde = "=1.0.228"
#
# holo_hash 0.6.0 (required exactly by the shared sdk domain-types crates, which
# are also consumed by the DNA zome workspaces — the pin is a DNA-hash guard)
# requires hsb =0.0.56, while holochain_client >= 0.9.0-dev.24 requires
# holo_hash 0.7.0-dev.9 -> hsb =0.0.57. serde can only resolve to ONE 1.x
# version, so those two exact pins are mutually exclusive and the client bump is
# unresolvable. This vendored copy harmonises 0.0.56 onto 0.0.57's serde so both
# hsb versions coexist. Every other pin (including rmp-serde = "=1.3.0", which
# 0.0.56 and 0.0.57 already agree on) is byte-identical to upstream, and src/ is
# copied verbatim.
#
# This does NOT loosen the pin discipline: serde stays exactly pinned, to the
# same version the rest of the holochain family already validated.
[package]
name = "holochain_serialized_bytes"
version = "0.0.56"
authors = ["Holochain Core Dev Team <devcore@holochain.org>"]
edition = "2021"
description = "Serialized bytes for Holochain (vendored: serde pin harmonised with 0.0.57)"
documentation = "https://docs.rs/holochain_serialized_bytes"
readme = "README.md"
keywords = ["holochain", "messagepack", "json", "serialization"]
license = "Apache-2.0"
repository = "https://github.com/holochain/holochain-serialization"

[features]
default = ["derive"]
derive = ["dep:holochain_serialized_bytes_derive"]
fuzzing = ["dep:arbitrary", "dep:proptest", "dep:proptest-derive"]
trace = ["dep:tracing"]

[lib]
name = "holochain_serialized_bytes"
path = "src/lib.rs"

[dependencies]
# THE ONE CHANGE: upstream 0.0.56 says `=1.0.219`. Harmonised to 0.0.57's pin so
# hsb 0.0.56 and 0.0.57 can coexist in one graph. Nothing else differs.
serde = { version = "=1.0.228", features = ["serde_derive"] }

serde_json = { version = "1.0.51", features = ["preserve_order"] }
rmp-serde = "=1.3.0"
serde-transcode = "1.1.0"
serde_bytes = "0.11"
thiserror = "2.0"
tracing = { version = "0.1", optional = true }
holochain_serialized_bytes_derive = { version = "=0.0.56", optional = true }
arbitrary = { version = "1.0", features = ["derive"], optional = true }
proptest = { version = "1.2", optional = true }
proptest-derive = { version = "0.5", optional = true }
