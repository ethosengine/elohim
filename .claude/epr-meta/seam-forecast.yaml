# .claude/epr-meta/seam-forecast.yaml — the trajectory-crossed forecast (plan P4.4, surface 6).
#
# WHAT THIS IS. The proactive dual of the cascade: the plan's seeded worklist of spine/roadmap
# rungs crossed with cells that are `unexamined` there, plus the two runners-up. Every row is
# FINGERPRINTED so the calibration ledger (.claude/data/seam-calibration.jsonl) can score it
# hit / miss-of-ranking / miss-of-canon when a spine node flips or a new red lands.
#
# THE INSTRUMENT SHIPS PRE-SEEDED, NOT EMPTY — that is the plan's own requirement, and the reason
# is the success criterion: the next architecture-scale shift should find its walls already ranked
# here, as forecast hits rather than bespoke production discoveries.
#
# ROWS 7 AND 8 ARE `confirmed-live` AND ARE DELIBERATELY *NOT* FILED AS LEDGER HITS. They were
# found by this ceremony's own mining, not predicted — a `hit` means the forecast named a collision
# BEFORE it happened, and back-filing them would inflate the hit rate with work the instrument did
# not do. They are equally not `miss-of-ranking` (the ranking never got a chance) and not
# `miss-of-canon` (both fit existing classes). They predate the instrument; the ledger's first row
# is the spine BASELINE, and the first real outcome will be scored at the first flip after it.
#
# FINGERPRINT RULE (stability is the whole point). fp = sha256("<rung>|<seam>|<classes>")[:12],
# where <classes> is the concern-id list sorted LEXICOGRAPHICALLY (so "C12,C7", not "C7,C12") and
# comma-joined. The PROSE IS DELIBERATELY EXCLUDED: re-wording a prediction must not re-mint its
# row, exactly as the measure tier fingerprints `rule|path` and not the finding's detail text. A
# row whose rung, seam or class set changes IS a different forecast and gets a different
# fingerprint — that is correct, not a bug. `_lib/seam_forecast.py` recomputes every fp at load
# and reports a mismatch LOUD (a hand-edited fingerprint is a silently-broken calibration link).
#
# `rung: none` means the row is not tied to a spine node (the two bridges rows, the steward/node
# runner-up, the obey-path row, and any row whose habit is PARKED). It is a real value, not a
# placeholder — such a row can never be scored by a spine flip, so its calibration trigger must be
# a new red or a mining pass. A row naming a habit that has left the register is NOT a licence to
# invent a rung id: the rung becomes `none` (re-minted per the fingerprint rule) and the parked
# pointer is recorded in prose beside it, so the row returns to its original fingerprint when the
# habit returns to the register.
#
# THE SEED IS A FLOOR, NOT A CEILING. `seeded_rank` 1-10 are the plan's own eight ranked rows plus
# its two runners-up, transcribed at seeding. Rows ABOVE 10 are legitimate later registrations —
# an instrument whose worklist could never grow would be a transcript, not a forecast. A new row
# takes the next free `seeded_rank` and never renumbers a seeded one, because the seeded ordering
# is the human judgment the calibration ledger is measuring. (Row 11 arrived 2026-08-03 as a
# confirmed-live registration of the obey-path wall, and was itself re-minted the same shift when
# its class set was disproven — that re-mint IS the fingerprint rule working.)
#
# WHY THIS HOME. Sibling of seam-catalog.yaml (the matrix's other authored axis input) and of the
# two canon homes; read by the same tooling. No contentHash pin, for the same reason the catalog
# has none: nothing BINDS a forecast row, so there is no pinned dependency to protect. The row's
# fingerprint is its identity and the calibration ledger is its consumer.
#
# SEEDED RANK vs DERIVED RANK. `seeded_rank` is the plan's own ordering, transcribed verbatim in
# substance and never recomputed. `_lib/seam_forecast.py` ALSO computes a derived rank from
# recurrence x severity x rung-proximity (the matrix's ranking function) and renders the two side
# by side. Disagreement between them is a signal worth reading, not an error: the seeded order
# carries human judgment the arithmetic does not have, and the arithmetic carries substrate state
# (which rung is red RIGHT NOW) the seeding did not.

