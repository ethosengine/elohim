  # ── reset measures ────────────────────────────────────────────────────────────────────────
  # A reset is an ordinary structured observation, value 1, subject `.`. It replaces the kit's
  # private `--reset` file mutation with a content-addressed act anyone can read:
  #   epr flow note --kind observation --measure <id>-reset@1 --subject . --value 1
  # `epr flow report` counts a derived lens's folds from the LATEST reset onward. The unit is
  # `reset-marks` rather than a count of anything, because the value is never read — only its
  # position in the fold order is.

  - id: cleanup-pressure-reset
    version: 1
    family: cleanup-pressure
    unit: reset-marks
    procedure: "epr flow note --kind observation --measure cleanup-pressure-reset@1 --subject . --value 1"
    provenance: "replaces .claude/scripts/memory-kit/cleanup-pressure.py --reset (which zeroed five private JSON accumulators)"
    default-authority: observation
    status: active
    established_by: memory-kit-replacement-station-1-2026-09-10

