    compare: at-or-above
    binding: binding-local
    class: inject
    consumes: [mempalace-surfaces-changed@1]
    context: session-headline
    hard: 1
    # DERIVED FROM THE TREE, not from a fold. `mempalace-currency.py` hid this walk as module
    # constants (SURFACE, GRACE_SECONDS, the marker path) that only that script could read; the
    # walk is declared here instead, so the number is re-derivable by anyone and the producer
    # bridge that used to fold it is no longer needed.
    #
    # A MISSING STAMP IS `skipped`, NEVER ZERO. The kit falls back to epoch 0 when nothing is
    # recorded, which makes every file read as newer — maximum staleness asserted from an absence
    # of evidence. `marker-fallback` keeps the kit's real second stamp (the palace config's mtime);
    # with neither, nobody knows when the index was built and the bound says so.
    derive: files-newer-than
    marker: .mempalace/.last-mine
    marker-fallback: .mempalace/config.json
    surfaces:                       # mempalace-currency.py:22-26 SURFACE, verbatim
      - genesis/docs/content/elohim-protocol
      - .claude/memory
      - genesis/data/stories
    suffix: .md
    grace-seconds: 120              # the value mine-grace-seconds@1 declares
    status: active
    established_by: memory-kit-replacement-station-1-2026-09-10

