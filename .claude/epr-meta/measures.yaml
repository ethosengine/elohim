  # Station 3 (2026-09-11): the four ceilings above each read the LATEST journey alone, so one
  # clean journey right after a bad one reads green with no memory of the bad one. This row reads
  # a ROLLING QUARTER instead — the fraction of the last `window_days` worth of JOURNEYS (drawn
  # from both middot above, grouped by the `env:journey` slot `sample`/`judge` write on every
  # fold) that were NOT clean. `derive: rate-over-window` in report.rs; fewer than 3 journeys in
  # the window is `skipped`, never a rate.
  # Station 3 fix round (2026-09-12, F3): `recall-not-reached@1` joined the consumed set. Without
  # it a journey that simply never found the authority folded nothing positive the window reads,
  # so a quarter of pure misses rendered as a clean quarter — the exact failure this bound exists
  # to catch. A journey is positive when ANY consumed fold in its `env:journey` group is > 0, so
  # the miss alone now makes its journey non-clean.
  - id: recall-journey-window-ceiling
    version: 1
    compare: at-or-above
    binding: binding-local
    class: inject
    derive: rate-over-window
    consumes: [recall-mistaken-assertions@1, recall-unmetered-bytes@1, recall-not-reached@1]
    window_days: 91
    context: recall-journey
    hard: 0.2
    status: active
    established_by: governed-discovery-station-3-2026-09-12
