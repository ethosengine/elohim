  - id: sovereignty-landings-ceiling
    version: 1
    compare: at-or-above
    binding: binding-local
    class: inject
    # DERIVED as of station six round (b), 2026-09-11. `sovereignty-guard-signal.py` escalated on
    # a `landings` total it accumulated in a private JSON file under the deleted kit — the
    # last of the six hooks' private JSON tallies. The file is deleted with the kit, so the number
    # the hook's own message escalates on is now the count of landing observations since the last
    # reset, read back with `epr flow report --bound sovereignty-landings-ceiling --json`.
    #
    # ONE DECLARED CHANGE OF MEANING, recorded rather than hidden: the kit SUMMED each edit's
    # `net_new` phrase count; this counts one per LANDING EVENT. They differ only when a single
    # edit lands two or more apex-sovereignty phrases at once, where the kit would cross the
    # threshold in one edit and this crosses it in three. Counting events is the better reading
    # for a drift guard — three separate landings say more about corpus drift than one verbose
    # paragraph does — and `count-since-reset` is the derive the fold plane implements.
    derive: count-since-reset
    reset: sovereignty-landings-reset@1
    consumes: [sovereignty-landings@1]
    context: post-tool-guard
    hard: 3
    status: active
    established_by: memory-kit-replacement-station-1-2026-09-10

  - id: mempalace-surfaces-changed-ceiling
