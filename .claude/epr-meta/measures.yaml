  - id: cleanup-pressure-ceiling
    version: 1
    headline: cleanup
    compare: at-or-above
    binding: binding-local
    class: inject
    # DERIVED, not read: the value is the count of distinct drifted subjects accumulated since the
    # last reset — never a number some script hands over. `cleanup-pressure@1` stays first because
    # it is the lens's identity anchor (headline slot, unit, and the name a `skipped` outcome
    # reports); the five that follow are the accumulators the kit sums.
    derive: distinct-subjects-since-reset
    reset: cleanup-pressure-reset@1
    consumes:
      - cleanup-pressure@1
      - placement-drift-due@1          # placement-drift.json
      - map-currency-drift@1           # map-currency-drift.json
      - claude-md-edit-signal@1        # claude-md-drift.json (claude-md-drift-signal.py:189)
      - claude-md-structural-signal@1  # claude-md-drift.json (claude-md-structural-signal.py:174)
      - memory-coherence-drift@1       # memory-coherence-drift.json
      - memory-index-drift@1           # memory-index-drift.json — no fold producer yet
    context: session-headline
    hard: 120
    status: active
    established_by: memory-kit-replacement-station-1-2026-09-10
    why: >
      Six source measures for five accumulator FILES: claude-md-drift.json is written by two
      hooks that fold two different measures (claude-md-drift-signal.py:189 folds
      claude-md-edit-signal@1; claude-md-structural-signal.py:174 folds
      claude-md-structural-signal@1), so both are consumed. `claude-md-drift-score@1` is
      deliberately NOT a source — it is the derived score, not the accumulator, and consuming it
      would count a summary as an event. memory-index-drift@1 has no fold producer yet and
      contributes 0 until one exists, which is honest rather than absent.
      Parity target is cleanup-pressure.py::activity() (cleanup-pressure.py:53-56 + the
      COLLECTIONS loop): it sums len() over each of the five accumulator files in turn, so
      cardinality is DISTINCT-PER-MEASURE THEN SUMMED — one path drifting in two accumulators is
      two items, the same path drifting twice in one accumulator is one. The native rule matches
      that exactly rather than adopting a tidier global-distinct count, because a different number
      than the gate it replaces is not a replacement.
      ONE DELIBERATE DIVERGENCE, disclosed rather than hidden: the kit's COLLECTIONS tuple
      (cleanup-pressure.py:56) lists files/entries/due/items but NOT `changed`, which is the
      only collection map-currency-drift.json has — so the kit reads 0 from that file by
      omission, while this row consumes map-currency-drift@1 and counts it (3 of today's 94).
      The kit's omission is a defect, not a semantic the replacement should inherit, so this
      row is deliberately HIGHER than the gate it replaces by exactly the map-drift count.
      No `supersedes:` accompanies this: the registry's never-mutate rule binds at FIRST
      LANDING, this row has never landed on dev and is amended in place by its authoring
      session with the contentHash re-pinned, and there is no earlier registry row for it to
      supersede — the constant it replaces is cited in the measures' `provenance:`, which is a
      citation, not lineage. Version stays 1 for the same reason.

