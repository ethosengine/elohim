lenses:
  - id: review-lint-lens
    version: 1
    binding: persuasive
    class: inject
    consumes: [clippy-pedantic@1]
    context: code-review
    status: active
    established_by: deliberated-2026-08-04-operator+claude
    why: >
      Findings are advisory-only — labeled "pedantic-lens (advisory)" in the review output —
      never `-D`, never a push gate (spec §5, §8). The measure it consumes is always
