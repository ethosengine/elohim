# .claude/epr-meta/policies.yaml — the define-once-bind-many policy registry for .epr-meta rules.
#
# Each entry is Precedent-shaped (mishpat_integrity::Precedent is the graduated protocol home:
# binding ladder, scope, full_reasoning, citations, supersession lineage). Here in the dev-tooling
# tier the registry is a repo-local YAML file (operational scaffold, classification C); the
# `policy: <id>@<version>` reference shape in binding manifests is what keeps it liftable — when
# epr-meta graduates into brit/eprfs, rows become Mishpat Precedent entries (CID = entry_hash)
# and bindings become cites, with no manifest rewrite.
#
# Contract:
#   • A manifest rule binds a policy with `policy: <id>@<version>` — the version pin is REQUIRED
#     (which version applies is a DECLARED dependency, never recency; see the lens-version-DAG
#     spec 2026-06-27). Editing a policy = adding a NEW version entry; existing bindings keep
#     the old semantics until each binding re-declares. `status: superseded` + `superseded_by`
#     record lineage; never delete a version that still has bindings. A row not yet landed on
#     `dev` may be amended in place by its authoring session (contentHash re-pinned); the
#     never-mutate rule binds at first landing — ratification is peer acceptance at the branch
#     rung (dev-merge), per the governance-escalation-ladder charter.
#   • The policy owns semantics: class, scope (the default `when`), predicate/measure defaults,
#     and the why. The binding owns placement and local variance: an optional `when` override
#     and `params` (merged over the policy's `measure` defaults).
#   • `binding` maps the Precedent ladder onto the enforcement-class ladder:
#     constitutional/binding-network ≈ deny · binding-local ≈ ask · persuasive ≈ inject ·
#     observation ≈ measure (never blocks; feeds signal ledgers).
#   • deny-class policies carry `established_by` operator provenance (the ratification
#     convention — a deny is constitutional-shaped authority).

epr-meta-policies-version: 1
policies:
  - id: source-file-loc-ceiling
    version: 1
    contentHash: sha256:8982019cf14bd70060399817c82d0d6865853280a6fdc11fd7a4c155a5074be7
    title: Source-file LoC ceiling — architecture-review trigger
    binding: observation
    class: measure
    scope: { write: "*.rs" }
    measure:
      loc-soft: 3000
      loc-hard: 7000
      dispatch-agent: rust-architect
    status: active
    established_by: operator-2026-07-02
    why: >
      A first-party source file past the hard ceiling is a god-file: it corrodes its own
      governance (line-number invariant anchors drift every edit; two-location sync traps
      grow ~1000 lines apart) and outgrows what one context window can review. Soft ceiling
      = edit-time nudge (new logic likely belongs in a module). Hard ceiling = a fingerprinted
      architecture finding: canonicalize a modularization plan into the timeline backlog and
      drive it as bounded work — never refactor mid-edit. Refactor-safety asymmetry the
      reviewer must honor: coordinator zomes hot-swap via update_coordinators (cheap);
      integrity-zome changes move the DNA hash (reinstall/partition trap — ride a deliberate
      DNA-lineage event only); plain native Rust is gated by fmt/clippy/nextest alone.
      Ratchet ceilings DOWN as the tail drains; never up.

  - id: brand-vocabulary-boundary
    version: 1
    contentHash: sha256:e57794fb9a49b28b8fa30b463da87b36ead31df9d829b7eb54457b8f09307c63
    title: Brand vocabulary stays at the brand boundary
    binding: persuasive
    class: inject
    validator: epr:validator-brand-vocabulary-boundary
    status: active
    established_by: deliberated-2026-08-04-operator+codex
    why: >
      Product and architecture prose may use the protocol's domain brands; compilable artifacts
      should name the capability an unfamiliar engineer is actually working with. Prefer identity,
      learning, work, community or collective governance, economy or value flow, and the precise
      governance concept (judgment, decision, policy, commitment, authority, or recovery quorum) in
      symbols, routes, schemas, persistence names, and wire values. The validator is net-new-only and
      ignores documentation, comments, and schema prose, so existing debt can be cleaned incrementally
      without tolling unrelated maintenance. This repository is still pre-compatibility: internal
      package ids, Holochain roles and zomes, persisted discriminators, and wire literals do not earn
      an exception merely because we already use them. Rename those coded references now; add a real
      migration boundary only after an external contract is deliberately ratified. Advisory only:
      teach and inventory; never block authoring.

  - id: memory-frontmatter-at-birth
    version: 1
    contentHash: sha256:a622e4d20e5aa57ab9152e48a082ff437499ad5b498516408f0cc864cce003ee
    title: Memory topic files must be born with projectable frontmatter
    binding: constitutional
    class: deny
    scope: { write: "*.md", new: true }
    require-frontmatter: [name, title, description]
    status: active
    established_by: operator-ratification-pending-2026-07-02
    why: >
      A memory born without name + title + description cannot project into the generated
      MEMORY.md index — it is unrecallable, which defeats the only purpose of writing it.
      Add frontmatter: name (slug), title (<= 60 chars), description (ONE line, <= 160
      chars: what the fact is + when it bites), metadata.type (user|feedback|project|reference).

  - id: capability-governance
    version: 1
    contentHash: sha256:37dc215287585ca66ca4a873e44db6714660bfdae21dc0f6e7e8cabf833ea5b4
    title: Capability package governance — re-import after editing its projection
    binding: observation
    class: measure
    scope: { write: "*.json" }
    measure:
      loc-soft: 200
      loc-hard: 500
    status: active
    established_by: operator-2026-07-10
    why: >
      Packages under `.epr-meta/elohim/packages/{agents,skills}` are the canonical source for
      generated Claude/Codex runtime surfaces (`.claude/{agents,skills}/*`,
      `.codex/{agents,skills}/*`) — edit the package JSON, then re-run
      `node elohim/sdk/domains/elohim-agent/scripts/package-projections.mjs verify` (regenerate
      with `--write-fixtures --write-runtime` when the projections should move) before commit, or
      the runtime surfaces silently drift from their source of truth. Observation tier: never
      blocks a package edit — the projection-drift check itself is the real gate (pre-push /
      verify), this rule only measures. The soft/hard LoC ceiling doubles as a growth signal: a
      package whose embedded instructions body has outgrown one file should split into a
      referenced asset or a second package rather than balloon.

  - id: sovereignty-ontology-guard
    version: 1
    contentHash: sha256:c6194b67110355fdde1b74603f9e64a571b394bca500783bfb8d2d5021ffceef
    title: Sovereignty ontology guard — affirm the frame, never assert the apex
    binding: binding-local
    class: ask
    scope: { write: "*.md", contains-any: ["sovereign", "Sovereign"] }
    validator: epr:validator-sovereignty-ontology-guard
    status: active
    established_by: operator-ratification-pending-2026-07-15
    why: >
      The Elohim ontology REJECTS crypto self-sovereignty as an apex value (canon:
      genesis/docs/architecture/stewardship-over-sovereignty.md — "we do not consider sovereignty
      itself to be the right framing"; values-forward.md Stance II.4 — "sovereignty is not forbidden,
      it is made mechanically expensive"). A human's identity is imago dei — an inviolable right
      BACKSTOPPED by community/institutional expression, not a self-asserted crypto primitive; real
      agency comes from community backstopping the individual. This guard fires on NET-NEW apex framing
      (self-sovereign as the top identity/agency tier; "true/full data sovereignty" as a goal) — it is
      an AFFIRMATION prompt, not a ban. Confirm your usage is one of the three LEGITIMATE frames and
      proceed, or reframe: (1) ADVERSARY — naming what is resisted (surveillance capitalism) or external
      actors ("near-sovereign yet subject to the protocol"); (2) BOUNDED — "sovereign WITHIN higher
      bounds", the collective human floor sovereign over the machine; (3) BRIDGE-LEGIBILITY — a
      self-sovereign wallet making a participant legible to EXTERNAL sovereigns (a credit union/mutual),
      where head/ceiling/authority still flow from the commons governance pool. If your surface's frame
      is already adjudicated (the wallet bridge), declare it once — a `sovereignty-frame:` marker in the
      doc, or a nearest-wins `.epr-meta` override on this rule id — and the guard goes quiet.
      Parallel rules (the story of why, followable): the DESIGN-TIME sibling is the p2p-design-gate skill's
      Identity Ontology Guard (same discipline, fired before you design a tier, not as you write it); the
      LIFE-STAGE companion is genesis/docs/architecture/cradle-to-grave-capability-gradient.md (why
      unqualified self-sovereignty can't model wards/IDD/seniors — the right is exercised WITH/THROUGH
      others). Dismissals aggregate to sovereignty-guard-signal.py so the RULE itself surfaces for drift
      review: the protocol governing the bytes of its own repo.

  - id: ownership-ontology-guard
    version: 1
    contentHash: sha256:986c16321b2f9b2062d854a62af728366ab1e2d082d37c16ab77a26fcd718fa5
    title: Ownership ontology guard — stewardship and custody, never enclosure
    binding: binding-local
    class: ask
    scope: { write: "*.md", contains-any: ["ownership", "Ownership"] }
    validator: epr:validator-ownership-ontology-guard
    status: active
    established_by: operator-ratification-pending-2026-08-05
    why: >
      The sibling drift to sovereignty-ontology-guard, named by the operator on 2026-08-05:
      "ownership is like sovereignty — it might need a guard to help keep us from gravitating into
      it." OWNERSHIP is the enclosure-flavoured apex the protocol subordinates to STEWARDSHIP and
      CUSTODY. ValueFlows already splits the two — `primaryAccountable` (who holds the rights) vs
      `custodianScope` (who physically stewards), with distinct `transferCustody` and
      `transferAllRights` actions — and COLLAPSING them is exactly the enclosure failure the
      Georgist common-inheritance framing exists to prevent: a holon that "owns" the commons it
      stewards has enclosed it. The distinction is load-bearing for holonic land/commons
      stewardship, where the commons holds the rights and a local unit holds custody, and custody
      must be transferable without the rights ever moving. This guard fires on NET-NEW apex framing
      only (bare "own"/"owner" are far too common to gate — the phrase list is deliberately narrow
      and names only assertions that ownership is the RIGHT relationship to a resource). It is an
      AFFIRMATION prompt, not a ban. Confirm your usage is one of the LEGITIMATE frames and proceed,
      or reframe: (1) ADVERSARY — naming what is resisted (enclosure, platform data-ownership
      claims, rent extraction); (2) BOUNDED — ownership WITHIN a commons that retains the rights;
      (3) EXTERNAL-LEGIBILITY — describing an outside legal system's ownership on its own terms
      (a title, a co-op share, a jurisdiction's property register). Declare `stewardship-frame:` in
      the doc (a `sovereignty-frame:` marker also satisfies it — the two frames travel together) and
      the guard goes quiet. Parallel rule, same shape and same escape hatch:
      sovereignty-ontology-guard. Canon: genesis/docs/architecture/stewardship-over-sovereignty.md;
      the Georgist common-inheritance framing; genesis/docs/content/elohim-protocol/hardware-providence-commons.md.

  - id: archetype-resource-alignment
    version: 1
    contentHash: sha256:a62c78e26c81446263e2b6478d45e11d8f9d49685c2e93e82d7a1f98b529b795
    title: Device-archetype resource alignment — one class, one budget
    binding: binding-local
    class: ask
    scope: { write: "deployments.json" }
    validator: epr:validator-archetype-resource-alignment
    status: active
    established_by: operator-ratification-pending-2026-07-16
    why: >
      Per-human conductor resources are a CLASS property (deviceArchetype), not an instance one.
      The floor-only conformance check (validate-deployments.ts, `>= archetype floor`) lets any
      human sit anywhere above its floor, so firefighting drifts the tree: the ONE crashlooping
      instance gets bumped while the rest of its archetype is left behind (2026-07: home-nuc held
      1000m/2000m/3000m across pete/gertrude/eve for the SAME device class). This inverts control
      — the archetype budget in genesis/data/devices/archetype-resource-budgets.json is the
      CANONICAL value each consolidated human derives; a human that differs must say WHY via
      `resourceOverride: { <field>, justification }` (adam, the genesis anchor + doorway-B backend,
      is the model: an explicit role-justified 8000m over the 4000m family-node base). When an
      OBSERVATION says a class needs more, move the budget once (realigns the whole class) rather
      than editing an instance. `ask` tier: surfaces the drift + names each offending human, one
      keystroke (EPR_META_ACK=1) to proceed; dismissals aggregate for drift review. Static
      observation, no live metrics dependency — the value is reasoned once and held by the class.

  - id: test-bench-aggregate-capacity
    version: 1
    contentHash: sha256:a39ac2f8ec21391c60e43bf97cce33c324b526ab54c5d9ca6d5283fff48b4dec
    title: Alpha test-bench aggregate capacity — portfolio within observed envelope
    binding: binding-local
    class: ask
    scope: { write: "*.json" }
    validator: epr:validator-test-bench-aggregate-capacity
    status: active
    established_by: operator-ratification-pending-2026-07-16
    why: >
      A per-human budget can be locally coherent and still make an impossible portfolio. This policy
      composes the archetype rule upward to the operator-promoted Category-C capacity ledger at
      genesis/data/rakia/compute-capacity.json, governed by
      epr:alpha-test-bench-compute-envelope. It replaces the ledger's previously observed human
      allocation with the prospective active deployments, retains non-human commitments, and checks
      aggregate CPU/memory requests AND limits against cluster.totalAllocatable. It evaluates edits
      from either side (deployments or capacity), uses no live kubectl/Prometheus dependency, and is
      deliberately `ask`: arithmetic supplies the substrate evidence while the steward retains local
      agency and explicitly ratifies any intentional overcommit at reach.

  - id: eprfs-meta-domain-neutrality
    version: 1
    contentHash: sha256:97b0cd767d6b8a90acb4035c6f6596aab5b33cdff3b1b6b57a632e944b90ebf2
    title: EPRFS meta evaluator stays policy-domain neutral
    binding: binding-local
    class: ask
    scope: { write: "*.rs" }
    validator: epr:validator-eprfs-meta-domain-neutrality
    status: active
    established_by: operator-direction-2026-07-16
    why: >
      eprfs-meta defines the ontology and execution interfaces for policies; it must not embed
      concrete validator identities or repository-domain evaluation logic. Concrete policy code
      belongs behind ValidatorProvider in the application composition root (and can later be
      replaced by content-addressed EPR/WASM resolution). A net-new concrete epr:validator-* ref in
      this publishable crate therefore requires explicit reach acknowledgement. The crate's Rust
      architecture test independently proves the zero-concrete-reference invariant.

  # ── CONCERN CANON (seam-concern-contract plan, design surface 1) ──────────────────────────────
  # The canon is split across TWO homes by whether an evaluable predicate exists TODAY: a class
  # WITH one is an enforcement row here; the rest are Precedent-shaped rows in the sibling
  # `.claude/epr-meta/concerns.yaml` (its header explains why it is its own file). No canon row
  # names a `validator:` it does not have: that would be the canon's own C7 (advertise/serve)
  # violation. When P4.1 registers a class's validator, that class's row MOVES here as a new
  # version row and its old row is superseded (lineage, never deletion).
  #
  # GRADUATIONS SO FAR (P4.1, 2026-08-02): C2 graduated IN PLACE — @1's predicate was the
  # `dedupe-of` bind-don't-redefine trigger (an unconditional advisory on every matching write);
  # @2 replaces it with the real detector `epr:validator-heal-fills-never-moves`, so the advisory
  # now fires on the shape instead of on the neighbourhood. C6a graduated ACROSS homes: its
  # concerns.yaml row `c6a-bounded-work@1` is superseded by `c6a-bounded-work@2` here, carrying
  # `epr:validator-bounded-work`. A version is a DECLARED dependency, so neither graduation moves
  # a binding: `elohim/elohim-storage/src/.epr-meta` re-pins to @2 deliberately, and any binding
  # still pinned to @1 keeps @1's semantics until it re-declares (the cascade, plan surface 5).
  # A third validator, `epr:validator-dna-hash-neutrality`, is registered with NO row in either
  # home — the ceremony tested DNA-hash-neutrality as a class and declined it ("no runtime
  # predicate… it becomes the third registered validator, not a class"), so it enters as policy
  # machinery bound inline at `elohim/holochain/dna/.epr-meta`. Machinery without canon is
  # legitimate; canon without machinery is what the `validator:` honesty rule forbids.
  #
  # STANDING SHAPES (the brit frame — every canon artifact declares one of record | attestation |
  # fold | pin). A canon ROW is an `attestation`: a Precedent citing content, whose binding force,
  # scope and supersession live on a plane separate from the hashed body — hence `standing:` and
  # `resolution_mode: pinned` as explicit fields here and in concerns.yaml. A `.epr-meta` BINDING is
  # a `pin`, and it declares that shape STRUCTURALLY rather than as a field: `policy: <id>@<version>`
  # IS the sealed reference, re-blessed by judgment at each re-declaration, never auto-blessed by
  # recency. The manifest schema (`elohim/sdk/schemas/v1/objects/epr-meta.schema.json`) is
  # `additionalProperties: false` at both levels and the engine restricts a binding to
  # {id, policy, params, when, why} — so a redundant `standing:` field there is not merely
  # unnecessary, it is two truths about one fact, which is the duplication the two-plane split
  # exists to prevent. Liftability of these bytes to CIDv1(dag-cbor, sha2-256) is proven by fixture:
  # `elohim/epr/tests/concern_canon_liftability.rs` (+ the freshness/anti-mirror half at
  # `.claude/scripts/_lib/__tests__/concern_canon_liftability_test.py`). The P5 lift wraps a codec
  # around the sha256 these rows already carry — a move, never a rewrite.
  - id: c2-monotonic-authority
    version: 1
    contentHash: sha256:a5a4d533a03eac9915d0b132ff374a834954446bad25ffd32e6cc9e8290ca1d9
    concern: C2
    title: C2 monotonic authority — never backwards, and name the clock
    statement: >
      Selection is decided by declared authority tiers and, within a tier, a NAMED NOTARIZED CLOCK
      with a deterministic tiebreak — never a conductor-local clock, never arrival order. A move
      backwards requires proof of forward ordering on that clock; missing ordering evidence refuses
      the move rather than guessing.
    applies_to: >
      Every decision point that selects among competing versions of ONE subject — head election and
      adoption, stamp/heal paths, event-fold "latest" resolution, link-selector ordering, selector
      tiebreaks. Not a placement rule: which PLANE the subject lives on is C0's question, answered
      first.
    binding: binding-local
    class: inject
    scope:
      write: "*.rs"
      contains-any: ["stamp_declared_head", "StampMode", "projection_reconcile", "GapFill"]
    dedupe-of: ".claude/epr-meta/policies.yaml#c2-monotonic-authority@1 (concern class C2 — monotonic authority)"
    standing: attestation
    resolution_mode: pinned
    probe_home: seam-registry
    severity_class: silent-corruption
    dispatch-agent: rust-architect
    findings_namespace: concern:c2-monotonic-authority
    recurrence:
      unit: distinct-shifts
      shifts: 5
      instances:
        - "CI museum #12 (2026-06-02 record) — first-that-matches degenerating to index-0-always-wins"
        - "25921a07a 2026-07-10 zome selector ordered by get_links ARRIVAL until the (timestamp, create_link_hash) tiebreak landed"
        - "8844cd1d6 2026-07-11 storage heal — an unconditional Declare stamp moved a declared head BACKWARDS across 2,838 divergence-queued rows, serially, after every restart"
        - "a83b35079 2026-07-29 epr-cli/REA sidecar — 'latest' by APPEND ORDER vs by occurredAt; the commit body names it 'the exact 8a1c531dc bug, reintroduced via replay'"
        - "2026-08-02 conductor plane — stamp guard provably_newer, selector tiebreak, three-clocks-in-one-column"
    status: superseded
    superseded_by: c2-monotonic-authority@2
    established_by: deliberated-2026-08-02-operator+claude
    why: >
      CROSS-FAMILY STATEMENT (the class is older and wider than the dataplane). A self-healing loop
      whose information source is weaker than the state it overwrites converts every restart into a
      rollback; a fold that reads "latest" as append order re-mints the same defect through replay;
      a selector ordered by arrival makes index-0 always win. All three are ONE guarantee failing:
      selection must name the clock it orders on, that clock must be notarized (comparable across
      the peers that will disagree — a DHT link timestamp, an occurredAt, never a receiving node's
      local clock), and ties must break deterministically (create_link_hash), or two honest peers
      converge to two different answers.
      DATED INCIDENTS. 2026-07-11 (adam-alpha): two minutes after the first-ever cross-conductor
      adoption, the restarted node's heal restamped the OLD head over the adopted canonical row —
      2,838 rows, every restart. The blind first fix keyed the guard on WHO writes and froze forward
      adoption (a C3 liveness hole created by a C2 cure); the real cure made the SOURCE name the
      authority it CARRIES (`canonical`), never the writer's identity. 2026-07-12: elohim-host-landing
      converged at edge #1187's seam-smoke and was healed back to the superseded head by #1188 — a
      conductor that has not yet integrated a newer canonical link answers with the OLD canonical
      record: canonical, yet stale. 2026-07-29 (epr-cli/REA): the same guarantee failing in a
      non-dataplane family, on a projection rather than in DHT truth — which is precisely where C2
      and C0 meet.
      HOW A SEAM ANSWERS THIS ROW. Name the clock; prove the tiebreak is deterministic and
      permutation-invariant (the `Arbitrated` harness); refuse rather than guess when ordering
      evidence is missing (NULL either side = refuse); and never key the guard on the writer's
      identity. This row's `dedupe-of` predicate fires as an ADVISORY at edit time — bind and
      conform, do not re-derive a local ordering rule at a new seam. The class's mechanizable
      detector (`epr:validator-heal-fills-never-moves`: a `StampMode::Declare` call site added
      outside the canonical-channel list, or a stamp-guard edit that cites no contract test) is
      registered by plan task P4.1; when it lands it arrives as version 2 of this row, and each
      binding re-declares its pin — the version pin is a declared dependency, never recency.

  # C2 @2 — the graduation @1's own `why:` promised. Identical guarantee, identical scope; the
  # ONLY semantic change is the predicate: `dedupe-of` (an unconditional bind-don't-redefine
  # advisory on every matching write) becomes `epr:validator-heal-fills-never-moves`, so the
  # advisory now fires on the SHAPE — a net-new `StampMode::Declare` call site outside the
  # canonical-channel list, or a stamp-guard edit citing none of its registered contract tests.
  # One actionable predicate per row is a hard registry rule (a second would silently never be
  # evaluated), which is why the dedupe trigger is replaced rather than kept alongside.
  - id: c2-monotonic-authority
    version: 2
    contentHash: sha256:373c0f803c0e7f2ffb2385dcb1278e2cb59d138b0500e4ab63e9ae578d9b9a34
