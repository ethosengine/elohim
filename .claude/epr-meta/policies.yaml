      adoption (a C3 liveness hole created by a C2 cure); the real cure made the SOURCE name the
      authority it CARRIES (`canonical`), never the writer's identity. 2026-07-12: elohim-host-landing
      converged at edge #1187's seam-smoke and was healed back to the superseded head by #1188 — a
      conductor that has not yet integrated a newer canonical link answers with the OLD canonical
      record: canonical, yet stale. 2026-07-29 (epr-cli/REA): the same guarantee failing in a
      non-dataplane family, on a projection rather than in DHT truth — which is precisely where C2
      and C0 meet.
      HOW A SEAM ANSWERS THIS ROW. Name the clock; prove the tiebreak is deterministic and
      permutation-invariant (the `Arbitrated` harness); refuse rather than guess when ordering
      evidence is missing (NULL either side = refuse); and never key the guard on the writer's
      identity.
      WHAT @2 EVALUATES (the graduation from @1's dedupe advisory). Arm (a): a NET-NEW
      `StampMode::Declare` call site in a `.rs` file outside the canonical-channel list
      (`db/content_diesel.rs` — the deliberate-declare wrapper, the guard arm and their in-file
      contract tests; `services/head_adoption.rs` — the own-conductor act after `adopt_peer` mints
      the link). `Declare` may move a declared head anywhere, including a deliberate revert, so
      WIDENING its call-site set is precisely how the resurrection class returns; a heal carrying a
      canonical answer stamps `HealCanonical` (move only with proof of forward ordering), a
      fallback resolve stamps `GapFill` (fill an empty row only). Arm (b): added lines touching the
      stamp guard (`canonical_move_verdict`, the `HealCanonical`/`GapFill` arms,
      `moving_declared_row`, `SkippedStale`, `stamp_declared_head_mode`) while the file cites NONE
      of the contract tests its `seam-registry.yaml` registers for it — the blind-fix shape, where
      the tests are the only thing that named the difference between the two guards. Arm (b) is
      SKIPPED when the registry registers no test for the file: an uncited decision point is an
      honest gap the CENSUS owns, not a finding this validator may mint. The word boundary is
      load-bearing — `CollectiveStampMode::Declare` is a different enum on the collectives plane
      and must never be counted. Advisory class by construction: a false positive costs one line,
      never a blocked write.

  # C6a @2 — the ACROSS-HOMES graduation. `c6a-bounded-work@1` lives in concerns.yaml (a
  # Precedent row, no predicate); registering `epr:validator-bounded-work` moved the class here
  # as a new version row and superseded the old one in place, lineage intact. The version
  # continues across the move because the ARTIFACT is the same artifact — id is identity, version
  # is its monotonic life — and because two rows keyed `c6a-bounded-work@1` in two files would
  # make a pin ambiguous, which is the one thing a declared dependency may never be.
  - id: c6a-bounded-work
    version: 2
    contentHash: sha256:88b41ea4940d3e461c4727128c2907e0f1f1e47a14f52c132d56e19fda7b6617
    concern: C6a
    title: C6a bounded work — every loop, sweep and retry ladder respects a declared budget
    statement: >
      Every loop, sweep, and retry ladder carries a declared budget it provably respects — and a
      retry policy against an uncancellable call IS a loop even when no `loop` token appears in the
      diff. New pacing binds the existing drain kernel rather than minting a fourth vocabulary.
    applies_to: >
      Sweeps, reconcile passes, retry ladders, responder/requester budget pairs, publish drains,
      per-tick caps. Distinct from C11: C6a asks "does my sweep respect MY budget"; C11 asks "do I
      survive traffic I did not choose".
    binding: binding-local
    class: inject
    scope:
      write: "*.rs"
      contains-any: ["loop {", "retry", "retries", "Retry", "attempts", "backoff", "sweep"]
    validator: epr:validator-bounded-work
    standing: attestation
    resolution_mode: pinned
    probe_home: runbook
    severity_class: loud-fail
    dispatch-agent: rust-architect
    findings_namespace: concern:c6a-bounded-work
    recurrence:
      unit: distinct-shifts
      shifts: 4
      instances:
        - "6369721fd 2026-07-04 view-federation codec — the responder rejected its own oversized reply; cure trims BEFORE signing"
        - "74fbdf2d7 2026-07-29 a retry ladder against an uncancellable call created unbounded work with no loop anywhere in the diff"
        - "1b445b481 2026-08-01 a responder budget compile-asserted strictly below the requester's"
        - "2026-08-02 sweep budgets + per-tick caps across the conductor-plane waves"
    status: active
    established_by: deliberated-2026-08-02-operator+claude
    why: >
      The class's teeth are in its scope clause, not its statement: the expensive instances had NO
      loop token in the diff (a retry policy against an uncancellable call) or asserted a budget in
      the wrong direction (responder below requester). Paced ingest drain has now been solved
      TWICE; the live kernel is `drain_publish_queue` + wait-for-drain, and a third scheme is a
      diagnosis failure, not a design. Live-metered: this class gets a runbook invariant->probe row
      (mint-then-quiet), not a design-time contract test alone.
      WHAT @2 EVALUATES, AND WHAT IT DELIBERATELY DOES NOT. `epr:validator-bounded-work` fires on
      an ADDED line carrying an unambiguous unbounded-work shape (a bare `loop {`; retry-ladder
      config — `max_retries`/`max_attempts`/`retry_count`/`backoff`/`RetryPolicy`/`.retry(`) inside
      a crate that REGISTERS decision points (a `seam-registry.yaml` at some ancestor), when no
      budget vocabulary (budget/deadline/timeout/`Duration::from`/`max_per`/`batch_size`/`.take(`/
      a `MAX_` const/`drain_publish_queue`/`tokio::select`) appears within +/-12 lines. It is
      PRECISION-BIASED on purpose and will miss real instances — a sweep expressed as an iterator
      chain, a ladder assembled from a config struct three files away, the responder/requester
      budget INVERSION (an ordering question no textual scan can see). It is bound advisory and
      may never be promoted to a blocking class on this predicate: the honest use of a fuzzy
      heuristic is to raise the question at the seam, and a fuzzy gate that denies teaches agents
      to route around governance. Declaring the budget in a `bounded-work: <budget>` comment
      satisfies the advisory — the guarantee is a DECLARED budget, so declaring it IS the fix, and
      the declaration is what a reviewer and the runbook probe can then check.

  - id: governance-escalation-ladder
    version: 1
    contentHash: sha256:97008339f53de85e02ff63222f3e521889f538a458e56d05f656cc48ecf75954
    title: Governance escalation ladder — the agency charter
    binding: binding-local
    class: ask
    scope: { write: ".epr-meta" }
    validator: epr:validator-escalation-ladder
    status: active
    established_by: deliberated-2026-07-23-operator+claude
    why: >
      The agency charter: agents self-grant `measure`/`inject` (+ `dispatch` with a named agent
      and prompt) freely — observation and advisory-with-directive cannot harm. `ask`/`deny`
      authorship or promotion is different in kind (it narrows or blocks another agent's future
      writes) and requires ratified authority from the DELIBERATING COMMUNITY — today the
      operator+agents working this tree (the "us" of the pre-p2p era), tomorrow a qahal — never
      agent self-declaration: narrow-never-widen applied to governance itself. Ratification is
      not a solo stamp; it is PEER ACCEPTANCE AT THE BRANCH RUNG: the branch ladder is the repo's
      reach axis (shift/* = self; dev = community; main = commons), a governance rule on a shift
      branch is structurally pending, and the dev-merge acceptance IS the ratification event —
      the CanonizationRef of repo governance (accepting a merge includes accepting the rules we
      govern ourselves by). This validator fires when a `.epr-meta` write INTRODUCES
      an ask|deny rule (a brand-new manifest: any ask|deny rule; an existing one: compared against
      its prior on-disk content, so unrelated edits to an already-governed manifest never
      retrigger) that is not backed by a `policy: <id>@<version>` binding whose registry row's
      `established_by` carries deliberation provenance (`deliberated-*`, or the legacy
      `operator-*` rows predating this convention). An INLINE ask|deny rule with no policy
      binding at all is never backed: the charter requires the deliberated registry pin for
      that class, not a rule authored directly in the manifest. `ask` tier: routes to review
      (refer_reason `escalation-requires-ratification`) rather than hard-blocking, since the gate
      cannot itself adjudicate ratification — only an operator can. Known v1 scope gap: `when`
      patterns match by BASENAME only (`_matches_when` in _lib/epr_meta.py), so this binding's
      `.epr-meta` scope covers the legacy flat manifest form but not the directory form
      (`.epr-meta/manifest.md`, basename `manifest.md`) — tighten if/when that form sees adoption.
      Bound at the repo root (not `.claude/epr-meta/.epr-meta`): `when` patterns are basename-only
      and the cascade is a strict ancestor walk, so a manifest placed anywhere other than the repo
      root can only ever govern writes BENEATH itself — it cannot reach out to unrelated
      directories. A repo-wide charter needs the repo-root anchor.
