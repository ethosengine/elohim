        - "25921a07a 2026-07-10 zome selector ordered by get_links ARRIVAL until the (timestamp, create_link_hash) tiebreak landed"
        - "8844cd1d6 2026-07-11 storage heal — an unconditional Declare stamp moved a declared head BACKWARDS across 2,838 divergence-queued rows, serially, after every restart"
        - "a83b35079 2026-07-29 epr-cli/REA sidecar — 'latest' by APPEND ORDER vs by occurredAt; the commit body names it 'the exact 8a1c531dc bug, reintroduced via replay'"
