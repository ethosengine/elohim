    binding: binding-local
    class: inject
    scope:
      write: "*.rs"
      contains-any: ["stamp_declared_head", "StampMode", "projection_reconcile", "GapFill"]
    validator: epr:validator-heal-fills-never-moves
    standing: attestation
    resolution_mode: pinned
    probe_home: seam-registry
    severity_class: silent-corruption
    dispatch-agent: rust-architect
    findings_namespace: concern:c2-monotonic-authority
    recurrence:
      unit: distinct-shifts
      shifts: 5
      instances:
