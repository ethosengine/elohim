[package]
name = "doorway"
description = "WebSocket gateway for Elohim Holochain - 'Knock and it shall be opened'"
version = "0.1.0"
edition = "2021"
authors = ["Elohim Protocol"]
license = "Apache-2.0"

[dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full", "macros", "sync"] }
futures = "0.3"

# HTTP/WebSocket server
hyper = { version = "1.6", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server", "tokio"] }
hyper-tungstenite = "0.15"
http-body-util = "0.1"

# HTTP client for health probing
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
bytes = "1.10"
tokio-tungstenite = "0.24"
futures-util = "0.3"

# MessagePack for Holochain protocol
rmp-serde = "1.3"
rmpv = "1.3"

# Official Holochain client for typed admin API calls
# No lair_signing needed — doorway doesn't sign zome calls, only admin ops
holochain_client = { version = "0.9.0-dev.5", default-features = false }
# Subcrate types not re-exported by holochain_client
holo_hash = { version = "0.7.0-dev.3", features = ["encoding"] }
holochain_zome_types = { version = "0.7.0-dev.5", default-features = false }
holochain_types = { version = "0.7.0-dev.11", default-features = false }
# Wire format for conductor WebSocket protocol (WireMessage::Authenticate)
# Used by projection subscriber to encode auth exactly as the conductor expects.
# We'd prefer to use holochain_client::AppWebsocket directly, but it requires
# SocketAddr (IP:port) — not hostnames — which doesn't work with k8s headless
# services. When we move to native (non-k8s) deployment, we can drop this
# wrapper and use AppWebsocket::connect() directly.
holochain_websocket = "0.7.0-dev.11"
holochain_conductor_api = { version = "0.7.0-dev.11", default-features = false }
holochain_serialized_bytes = "0.0.56"

# Provide custom getrandom implementation for holochain's wasm-oriented dependencies
getrandom = { version = "0.3", features = ["std"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"

# NATS messaging
async-nats = "0.38"

# MongoDB
mongodb = "3.1"
bson = { version = "2.13", features = ["chrono-0_4"] }

# Authentication
jsonwebtoken = "9.3"
argon2 = "0.5"

# Custodial key encryption
chacha20poly1305 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }

# CLI and configuration
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = "0.8"

# Utilities
uuid = { version = "1.16", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
base64 = "0.22"

# Bootstrap service (agent discovery) + federation signing
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
bs58 = "0.5"
dashmap = "6.1"
rand = "0.8"
hex = "0.4"

# OAuth / URL encoding
urlencoding = "2.1"
serde_urlencoded = "0.7"

# Caching
sha2 = "0.10"
elohim-cache-core = { path = "../../elohim/elohim-cache-core" }

# CID (Content Identifiers) - IPFS-compatible content addressing
cid = "0.11"
multihash-codetable = { version = "0.1", features = ["sha2"] }

# IPLD codecs for EPR Head content-type detection
serde_ipld_dagcbor = "0.6.3"
ipld-core = { version = "0.4.1", features = ["serde"] }

# Zip extraction for HTML5 apps
zip = { version = "2.2", default-features = false, features = ["deflate"] }
async-trait = "0.1"
askama = "0.12"

# Pin to version compatible with Rust 1.83 (base64ct 1.8.1 requires edition 2024)
base64ct = "=1.6.0"

# Shared types with DNAs
doorway-client = { path = "../../crates/doorway-client" }

# Shared wire types with imagodei DNA — compiler enforces agreement
imagodei-types = { path = "../../elohim/sdk/domains/imagodei/types" }

# Shared wire types with infrastructure DNA — compiler enforces agreement
infrastructure-types = { path = "../../elohim/sdk/domains/infrastructure/types" }

# Shared compute reporting types
elohim-compute = { path = "../../elohim/elohim-compute" }

# SSR rendering engine (V8/deno_core — loads Angular SSR bundles)
elohim-render = { path = "../../elohim/elohim-render" }

# Wisdom-as-system-auth gate: fires on every state-changing write path.
# default-features = false excludes ts-rs and the testing shims.
gate-client = { path = "../../elohim/elohim-agent/gate-client", default-features = false }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
wiremock = "0.6"
# Enable gate-client testing shims (mock_decline, __test_set_decision_override)
# in test builds only.  Production builds use default-features = false above.
gate-client = { path = "../../elohim/elohim-agent/gate-client", features = ["testing"] }

[build-dependencies]
chrono = "0.4"

[[bin]]
name = "doorway"
path = "src/main.rs"

[[bin]]
name = "doorway-worker"
path = "src/bin/worker.rs"
