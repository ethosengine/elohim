version: '3.8'

# Development infrastructure for Doorway
# Run: docker-compose -f docker-compose.dev.yml up -d

services:
  # NATS Server with JetStream enabled
  nats:
    image: nats:2.10-alpine
    container_name: doorway-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring
    restart: unless-stopped

  # MongoDB for persistent storage
  mongodb:
    image: mongo:7
    container_name: doorway-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: doorway
    volumes:
      - doorway_mongo_data:/data/db
    restart: unless-stopped

  # MongoDB Express UI (optional, for debugging)
  mongo-express:
    image: mongo-express
    container_name: doorway-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb
    restart: unless-stopped
    profiles:
      - debug

  # Doorway service with pkarr resolver enabled (cutover gate #10).
  # Opt-in via `docker-compose --profile full up -d`.
  doorway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doorway-service
    ports:
      - "8888:8888"
    environment:
      DOORWAY_PKARR_RESOLVER_ENABLED: "true"
      DOORWAY_PKARR_CACHE_CAPACITY: "1000"
      DOORWAY_PKARR_CACHE_DIR: "/var/lib/doorway/pkarr"
      STORAGE_URL: "http://host.docker.internal:8090"
    volumes:
      - doorway_pkarr_cache:/var/lib/doorway/pkarr
    depends_on:
      - nats
      - mongodb
    profiles:
      - full

volumes:
  doorway_mongo_data:
    name: doorway_mongo_data
  doorway_pkarr_cache:
    name: doorway_pkarr_cache
