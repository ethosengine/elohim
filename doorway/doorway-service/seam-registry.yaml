        kind: unit
      - path: doorway/doorway-service/src/render/warm_shell.rs
        testName: broken_fresh_head_preserves_last_working_shell_and_archive
        kind: unit
      - path: doorway/doorway-service/src/render/warm_shell.rs
        testName: unknown_fresh_head_cannot_replace_a_working_shell
        kind: unit
      - path: doorway/doorway-service/src/render/warm_shell.rs
        testName: unknown_first_head_is_unavailable_without_stocking
        kind: unit
      - path: doorway/doorway-service/src/server/http.rs
        testName: missing_asset_reason_survives_the_converging_http_response
        kind: unit
      - path: doorway/doorway-service/src/render/warm_shell.rs
        testName: broken_first_head_is_not_stocked_and_is_unavailable
        kind: unit
      - path: doorway/doorway-service/src/render/warm_shell.rs
        testName: a_confirmed_head_costs_exactly_one_probe_ever
        kind: unit
      - path: doorway/doorway-service/src/render/warm_shell.rs
        testName: an_unreachable_upstream_cannot_un_prove_a_confirmed_head
        kind: unit
      - path: doorway/doorway-service/src/render/warm_shell.rs
        testName: a_never_confirmed_head_with_a_dark_upstream_is_behind_storage_unreachable
        kind: unit
      - path: doorway/doorway-service/src/render/warm_shell.rs
        testName: an_unknown_declared_head_is_behind_head_unknown
        kind: unit
      - path: doorway/doorway-service/src/render/warm_shell.rs
        testName: an_unmarked_doc_at_the_declared_head_is_behind_stale_projection
        kind: unit
