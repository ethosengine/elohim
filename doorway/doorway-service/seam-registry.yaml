    kind: state-transition
    sourceLocation:
      file: src/render/bundle_heads.rs
      modulePath: render::bundle_heads::HeadMove
    summary: >
      How one app's storage-declared heads changed across a reconcile pass:
      {slug, browser_from -> browser_to, server_from -> server_to}, with browser_moved() /
      server_moved() / moved(). Produced by BundleHeadsReconciler::reconcile_slug, which returns
      None both when nothing moved AND when the upstream could not be read — the two are
      distinguished by the head table, which keeps its last state rather than un-declaring it.
      A browser move evicts the warm shell; both moves write through to the doorway's own
      projection (in-memory slug index + durable projected entry).
    concernIds:
      - id: C4
        status: answered
        justification: >
          An unreachable storage peer keeps the last declared head and writes nothing — it never
          reads as "no head" or as "no change".
          an_unreachable_storage_keeps_the_last_declared_head pins it, and
          an_absent_server_head_is_absence_not_an_error pins that a null serverBlobHash (adam's
          row on 2026-09-08) is absence rather than failure.
      - id: C6a
        status: answered
        justification: >
          Bounded per read (BUNDLE_HEADS_READ_TIMEOUT_SECS = 2s) and per pass (the configured
          target list), on a declared BUNDLE_HEADS_TICK_SECS cadence that env can tune or
          disable. The event arm spends NO upstream read for a content row this doorway
          declares no head for (a_content_event_reconciles_only_a_slug_this_doorway_declares).
      - id: C6b
        status: answered
        justification: >
          Replay reasserts storage truth in the projection without a HeadMove or shell eviction.
          A failed Mongo write or later stale projection heals on the next 30s tick,
          without requiring the storage head to move again
          (a_steady_head_repairs_projection_without_reporting_a_head_move).
      - id: C8
        status: answered
        justification: >
