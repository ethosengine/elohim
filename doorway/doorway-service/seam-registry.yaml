  - name: K2Store::put_at (MemK2Store)
    kind: verdict-fn
    sourceLocation:
      file: src/bootstrap/k2.rs
      modulePath: bootstrap::k2::MemK2Store::put_at
      line: 176
    summary: >
      Validates and applies a kitsune2 bootstrap PUT: tombstone bodies remove the entry
      (Removed); otherwise insert-or-overwrite (Stored), evicting an arbitrary victim when the
      per-space cap is reached and the agent is new.
    concernIds:
      - id: C4
        status: answered
        justification: >
          tombstone_removes_entry and put_then_get_round_trips prove Stored vs Removed are
