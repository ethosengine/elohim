  - name: build_receipt
    kind: verdict-fn
    sourceLocation:
      file: src/services/serve_receipt.rs
      modulePath: services::serve_receipt::build_receipt
      line: 308
    summary: >
      Decides what a fair-trade receipt may SAY about one serve, given the three REA clauses a
      caller could read off the ledger (`hosting-agreement`, `project-epr`, `operate-doorway`):
      a clause that is present becomes a credit or an exchange carrying the route that reads its
      record back; a clause that is absent stays null AND has its name pushed into `unrecorded`.
    notes: >
      Authority semantics, hence verdict-fn rather than pure-decision-predicate: this is the one
      place that may attribute economic credit for a serve, and the failure it exists to refuse
      is a doorway crediting ITSELF for a holder's work. It mints nothing — the receipt is a
      Category-C reading of commitments notarized before the request arrived. The per-serve
      serve-blob EconomicEvent the naive shape would write was refused at the design gate
      (10^4-10^6 heads/year against a plane whose measured anchor is ~3,469 heads); the successor
      is one periodic aggregated event fulfilling the hosting agreement, so this function names
      who was CREDITED and never who was SERVED.
    concernIds:
      - id: C4
        status: answered
        justification: >
          A missing record is reported twice — null in its own field and its NAME in
          `unrecorded` — so absence can be neither read as "nothing was owed" nor papered over
          with a synthesized number. a_missing_clause_is_null_and_named_never_invented and
          a_receipt_with_nothing_to_say_names_all_three_absences pin both directions, and
          a_complete_receipt_names_no_absence is the anti-vacuity half.
      - id: C7
        status: answered
        justification: >
          Advertise/serve symmetry: every clause the receipt advertises dereferences to the
          commitment it names. every_credit_reads_back_to_the_record_it_names asserts the record
          route against an independently-written literal prefix, not against the builder's own
          helper.
    contractTests:
      - path: doorway/doorway-service/src/services/serve_receipt.rs
        testName: a_missing_clause_is_null_and_named_never_invented
        kind: unit
      - path: doorway/doorway-service/src/services/serve_receipt.rs
        testName: a_missing_holder_never_becomes_the_doorways_own_credit
        kind: unit
      - path: doorway/doorway-service/src/services/serve_receipt.rs
        testName: a_receipt_with_nothing_to_say_names_all_three_absences
        kind: unit
      - path: doorway/doorway-service/src/services/serve_receipt.rs
        testName: a_complete_receipt_names_no_absence
        kind: unit
      - path: doorway/doorway-service/src/services/serve_receipt.rs
        testName: every_credit_reads_back_to_the_record_it_names
        kind: unit
      - path: doorway/doorway-service/src/services/serve_receipt.rs
        testName: the_holder_and_the_doorway_are_credited_separately
        kind: unit

