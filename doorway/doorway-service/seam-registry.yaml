    notes: >
      THE SUBSTRING TRAP, and why segment matching is not a style choice. The obvious
      implementation is `path.contains("/admin")`, and it classifies
      `/db/content/administration-basics` as Authority — shedding a content read during exactly
      the window this feature exists to keep serving. `read_class_never_substring_matches_a_
      content_slug` drives six real-shaped slugs (administration-basics, heading-styles,
      authority-and-consent, voter-guide, session-planning, identity-formation) through the
      predicate and requires Knowledge for all six. That test is the reason
      `AUTHORITY_SEGMENTS` is matched with whole-segment equality.

      The `/head-record` and `/canonical-head` READ surfaces are floored here even though
      `is_head_declare_write` (the breaker carve-out above) deliberately EXCLUDES them. Those
      are two different questions about the same paths: the carve-out asks "must this reach
      storage so storage's authority refusal can run" (only the write must), and this asks "may
      this be answered without a live witness" (none of the three may).

  - name: should_stock
    kind: pure-decision-predicate
    sourceLocation:
      file: src/routes/freshness.rs
      modulePath: routes::freshness::should_stock
      line: 210
    summary: >
      Decides whether one upstream response may be kept as last-good in the bearer-blind
      freshness pantry: GET, 200, non-floor class, NO Authorization header, response reach
      absent/public/commons, non-empty, within the per-entry ceiling. Every gate is a refusal;
      there is no permissive branch.
    concernIds:
      - id: C12
        status: answered
        justification: >
          This IS the consent gate, and it is the row where a wrong `true` is a disclosure rather
          than a slow page. The pantry is keyed by path+query with NO requester component, so
          anything stocked can be replayed to any caller during a shed — which makes two refusals
          load-bearing: a response fetched under an `Authorization` header is never stocked
          (stock_predicate_refuses_authorized_responses, and end-to-end through the real
          forwarder in an_authorized_response_is_never_stocked), and a response whose body
          declares a reach narrower than commons is never stocked
          (stock_predicate_refuses_reach_gated_bodies + a_reach_gated_body_is_never_stocked). The
          reach gate is fail-closed on an UNRECOGNIZED token, so a future reach vocabulary cannot
          silently widen what this pantry will replay — the list tests `some-future-reach`
          explicitly.
      - id: C6a
        status: answered
        justification: >
          The bounded budget, declared as data and proven as a ceiling. Per-entry 1 MiB, total
          64 MiB, plus an independent 8192-entry guard so a flood of tiny bodies cannot grow the
          map either; total_byte_budget_is_never_exceeded stocks 20 bodies into a 250-byte pantry
          and asserts the running total after EVERY insert, and an_oversize_body_is_refused_
          without_evicting_the_pantry proves an over-ceiling body is refused outright rather than
          evicting the pantry to make room for itself. Both ceilings are read from the
          environment ONCE at construction, not per call — a deliberate departure from the
          sibling `blob_pantry_max_bytes()`, whose read-per-call shape plus a test `set_var` is
          this crate's documented parallel-test flake class.
      - id: C4
        status: answered
        justification: >
          Refusing to stock is how the pantry stays honest about what it holds: a body it may not
          replay is simply never held, so there is no state in which the doorway has bytes it
          cannot account for. The empty-body refusal is part of this — a zero-length 200 is not an
          answer worth replaying as one.
      - id: C6b
        status: answered
        justification: >
          Pure and total over its arguments; the same response always yields the same decision,
          and `FreshnessPantry::stock` is itself idempotent on a repeated key —
          restocking_a_key_replaces_rather_than_double_counts proves a replace reclaims the old
          body's bytes rather than double-counting them, which is exactly the leak that would
          have made the declared ceiling a fiction.
      - id: C11
        status: answered
        justification: >
          The pantry is what makes honoring backpressure compatible with answering. Drawing from
          it issues NO work to the upstream that just returned 429/503, so amber during
          backpressure honors the signal rather than evading it —
          honored_backpressure_is_answered_from_the_pantry_without_touching_storage asserts both
          the amber answer and that the breaker stays CLOSED (a busy upstream is a live one).
      - id: C5
        status: answered
        justification: >
          Every stocked entry carries `served_head`, a CIDv1 (raw codec 0x55, sha2-256) minted
          over the exact body bytes and emitted as `x-elohim-served-head`, so a consumer
          RE-DERIVES the address rather than trusting the doorway's claim about it. This is the
          leg the contract crate's own C5 binding is `partial` on, closed here:
          a_knowledge_read_is_served_amber_while_the_circuit_is_open asserts the advertised
          address equals `mint_served_head` of the bytes actually served.
      - id: C8
        status: answered
        justification: >
          The pantry's occupancy is published as `doorway_freshness_pantry_bytes` on every stock
          and rendered in the `/status.json` freshness block, so the declared budget and its live
          consumption are both observable — a bounded budget nobody can read is a claim, not a
          bound.
      - id: C7
        status: answered
        justification: >
          What the pantry reports is what it holds: status_block_reports_the_live_pantry_
          occupancy drives a real stock and asserts entries/bytes/maxBytes move with it, so
          the advertised occupancy is read from the same counters `stock` maintains rather than
          estimated beside them.
      - id: C0
        status: answered
        justification: >
          Cat C / Ephemeral, decided at the gate and stated in the module doc: no DHT entry type,
          no table, no coordinator fn, no route. Every entry is reconstructable by re-fetching
          the same path, so a restart costs one round trip per path and nothing is anyone's
          source of truth. It passes the swap test — a sibling doorway stocks its OWN last-good
          bytes and the two never need to agree, because each only ever reports what IT witnessed.
      - id: C13
        status: answered
        justification: >
          The stock decision is itself graduated by the same declared stakes the serve decision
          is: a floor class is never stocked (stock_predicate_refuses_floor_classes), so the
          bounded budget is never spent on bytes that could not lawfully be served from it.
      - id: C1
        status: n-a
        justification: >
          No election, and no author identity in any input — the arguments are a method, a
          status, a class, two booleans-worth of request/response properties, and two lengths.
      - id: C2
        status: n-a
        justification: >
          Nothing is ordered or arbitrated. A later stock for the same key simply replaces the
          earlier one, which is a cache semantics question (bounded above), not an authority
          contest — the pantry never claims its entry is canonical.
      - id: C3
        status: n-a
        justification: >
          Not a state machine: a total pure predicate with no reachable non-terminal state and
          nothing to wedge. The liveness question for the FEATURE lives on `verdict` and on
          `read_class`, both of which carry their own C3 bindings.
      - id: C9
        status: n-a
        justification: >
          No identity, key, or lineage is consulted or stored. The pantry is deliberately
          identity-BLIND, which is precisely why the Authorization and reach refusals above have
          to be absolute — the store has no way to scope an entry to a person, so it must only
          ever hold bytes that need no scoping.
      - id: C10
        status: partial
        justification: >
          The reach vocabulary this gate matches against (`public`, `commons`) is a literal list
          here, not a generated projection of the canonical Reach enum
          (elohim/sdk/schemas/v1) — a fourth reach drift, in the class
          project_reach_enum_drift_reconciliation names. It fails CLOSED (an unrecognized token is
          refused and pinned by test), so drift costs stocking opportunities rather than
          disclosure, and that is the only reason this is `partial` rather than `unbound`.
          Reconciling it against the generated enum is the named follow-on.
      - id: C14
        status: answered
        justification: >
          The outcome is a boolean with no error arm and no panic path, and every `false` is
          reached by a NAMED refusal in source order rather than by fall-through — so "why was
          this not stocked" is answerable by reading the first gate that matched, and there is no
          unclassified residual to witness.
    contractTests:
      - path: doorway/doorway-service/src/routes/freshness.rs
        testName: stock_predicate_refuses_authorized_responses
        kind: unit
      - path: doorway/doorway-service/src/routes/freshness.rs
        testName: stock_predicate_refuses_reach_gated_bodies
        kind: unit
        mirrorRisk: false
      - path: doorway/doorway-service/src/routes/freshness.rs
        testName: stock_predicate_refuses_floor_classes
        kind: unit
      - path: doorway/doorway-service/src/routes/freshness.rs
        testName: stock_predicate_refuses_non_get_non_200_and_oversize
        kind: unit
      - path: doorway/doorway-service/src/routes/freshness.rs
        testName: stock_predicate_accepts_the_public_knowledge_case
        kind: unit
      - path: doorway/doorway-service/src/routes/freshness.rs
        testName: total_byte_budget_is_never_exceeded
        kind: unit
        mirrorRisk: false
      - path: doorway/doorway-service/src/routes/freshness.rs
        testName: an_oversize_body_is_refused_without_evicting_the_pantry
        kind: unit
      - path: doorway/doorway-service/src/routes/freshness.rs
        testName: restocking_a_key_replaces_rather_than_double_counts
        kind: unit
      - path: doorway/doorway-service/src/routes/freshness.rs
        testName: stocked_bytes_are_drawable_and_addressed
        kind: unit
      - path: doorway/doorway-service/src/routes/freshness.rs
        testName: status_block_reports_the_live_pantry_occupancy
        kind: unit
      - path: doorway/doorway-service/src/routes/storage_proxy.rs
        testName: an_authorized_response_is_never_stocked
        kind: unit
      - path: doorway/doorway-service/src/routes/storage_proxy.rs
        testName: a_reach_gated_body_is_never_stocked
        kind: unit
      - path: doorway/doorway-service/src/routes/storage_proxy.rs
        testName: a_live_answer_is_tagged_green_and_stocked_as_last_good
        kind: unit
      - path: doorway/doorway-service/src/routes/storage_proxy.rs
        testName: honored_backpressure_is_answered_from_the_pantry_without_touching_storage
        kind: unit
      - path: doorway/doorway-service/src/routes/storage_proxy.rs
        testName: a_knowledge_read_is_served_amber_while_the_circuit_is_open
        kind: unit
    notes: >
      WHY THE REACH GATE IS READ FROM THE RESPONSE, NOT THE REQUEST. The doorway cannot know a
      path's reach before it asks; storage answers with it. So the gate runs on the collected
      body, reusing `cache::reach_aware_serving::extract_reach_from_response` — the same reader
      the registered `should_serve_response` predicate uses, so the two cannot disagree about
      what a body's reach IS. The parse is guarded on a JSON content type and the per-entry
      ceiling, so a large binary body is never handed to serde on the hot path.

      RESIDUE, stated honestly: a non-JSON body yields `reach = None`, which the gate treats as
      permissive, inheriting `should_serve_response`'s own backward-compatible rule. That is
      sound for the bodies the pantry actually holds today (JSON projections and static app
      assets, neither reach-marked) but it is an inherited assumption, not a proof — a future
      binary format that carries reach out-of-band would need the marker threaded from the
      response HEADERS rather than the body. Named here rather than discovered later.

  # ── Transport-manifest bootstrap projection (T0' doorway side, 2026-08-24) ──
  # Cat C ephemeral: no DHT entry, no table. The doorway is the web2 bootstrap
  # seam one layer down from /bootstrap — a PURE-IROH storage node never hears
  # the libp2p `elohim/transport/manifest` gossip, so it announces here and
  # reads the set back.
  - name: TransportManifestStore::accept_at
    kind: verdict-fn
    sourceLocation:
      file: src/routes/p2p_manifests.rs
      modulePath: routes::p2p_manifests::TransportManifestStore::accept_at
      line: 238
    summary: >
      Verifies an announcement's ed25519 signature against its own iroh_node_id, then decides
      Stored / Stale / Full / Expired against the bounded store — or refuses with a typed
      ManifestVerifyError. Takes `now_ms` as a PARAMETER (never an ambient clock read inside the
      store) so every test is hermetic and no env/clock read sits on the hot path.
    concernIds:
      - id: C0
        status: answered
        justification: >
          Names its plane explicitly: transport-discovery PROJECTION, never truth. Every entry is
          reconstructable from the next announce round (storage re-announces on a 30s cadence), so
          a doorway restart costs one announce interval and nothing else. The module docs state
          the Cat-C classification and the reason it is not a DHT entry type.
      - id: C5
        status: answered
        justification: >
          The receiving node RE-DERIVES the claim: the signature is verified over
          signing_bytes() against the announcement's own iroh_node_id (which IS the ed25519
          public key) BEFORE anything is stored, so the store's invariant is that entries come
          only from announcements that verified. agent_cid / libp2p_peer_id are explicitly
          routing hints, never authority — the same clause the storage-side receive arm carries.
      - id: C6a
        status: answered
        justification: >
          Declared budgets it provably respects: MAX_MANIFEST_ENTRIES (64) bounds the store, and
          a full store is only displaced by a NEWER announcement, so a flood of ancient
          announcements cannot evict live peers. MAX_MANIFEST_BODY_BYTES (8 KiB) bounds the
          request body via `Limited` before serde sees it. MANIFEST_TTL_MS prunes lazily on both
          read and write.
      - id: C6b
        status: answered
        justification: >
          Replay against settled state mints nothing: an announcement whose announced_at_ms is
          not strictly newer than the held one for that NodeId returns Stale and the held entry
          is untouched — monotone per NodeId, so a replayed old announcement can never walk a
          peer's advertised addresses backwards.
      - id: C4
        status: partial
        justification: >
          The four accept outcomes are distinct from each other AND from a verify refusal (Err),
          so "ignored as stale" never reads as "stored". What is NOT distinguished is the GET's
          empty array: a cold store after a doorway restart and a mesh where no peer has
          announced are the same `[]` on the wire.
      - id: C8
        status: partial
        justification: >
          Every outcome is logged through the TYPED AcceptOutcome (`outcome = ?outcome`) with the
          node_id, and refusals warn beside acceptances — but no labeled Prometheus counter is
          registered for this decision yet, so the accept/refuse RATIO is not scrapeable.
      - id: C10
        status: partial
        justification: >
          A missing field fails the parse (serde has no defaults on this struct) and any drift in
          signing_bytes() fails LOUDLY as a 400 on every announcement, never silently. The gap is
          the mirror itself: the struct is not `deny_unknown_fields`, so a field ADDED on the
          storage side is silently ignored here until the mirror is updated. Deliberate — an
          additive storage-side field must not 400 every announcement from a newer peer.
      - id: C12
        status: n-a
        justification: >
          The route delegates no authority and the store authorizes no action. An entry is a
          routing HINT; a consumer must still complete its own iroh handshake against the NodeId
          before anything is served. That is why the route needs no auth header — the signature
          is the only claim being made and C5 covers it.
    contractTests:
      - path: doorway/doorway-service/src/routes/p2p_manifests.rs
        testName: post_then_get_round_trips_a_verified_announcement
        kind: unit
      - path: doorway/doorway-service/src/routes/p2p_manifests.rs
        testName: an_announcement_that_does_not_verify_is_never_stored
        kind: unit
      - path: doorway/doorway-service/src/routes/p2p_manifests.rs
        testName: a_stale_announcement_does_not_replace_a_newer_one
        kind: unit
      - path: doorway/doorway-service/src/routes/p2p_manifests.rs
        testName: a_newer_announcement_replaces_the_held_one_in_place
        kind: unit
      - path: doorway/doorway-service/src/routes/p2p_manifests.rs
        testName: the_store_is_bounded_and_evicts_the_oldest_at_capacity
        kind: unit
      - path: doorway/doorway-service/src/routes/p2p_manifests.rs
        testName: a_full_store_is_not_displaced_by_an_older_announcement
        kind: unit
      - path: doorway/doorway-service/src/routes/p2p_manifests.rs
        testName: entries_expire_after_the_ttl
        kind: unit
      - path: doorway/doorway-service/src/routes/p2p_manifests.rs
        testName: an_unreachable_announcement_is_refused
        kind: unit
    gapNote: >
      C4/C8 partials above. Also: the wire type MIRRORS
      elohim/elohim-storage/src/p2p/transport_manifest_gossip.rs because doorway-service cannot
      depend on elohim-storage and no crate both sides already share is a home for a p2p wire
      type. signing_bytes() and verify() are byte-identical copies (verified mechanically at
      authoring time); a shared leaf crate would make that structural rather than asserted.

  - name: TransportManifestStore::is_enabled
    kind: pure-decision-predicate
    sourceLocation:
      file: src/routes/p2p_manifests.rs
      modulePath: routes::p2p_manifests::TransportManifestStore::is_enabled
      line: 231
    summary: >
      Admission gate for the whole public /p2p/manifests surface. Reads
      DOORWAY_MANIFEST_BOARD_ENABLED ONCE at store construction (never on the request path);
      when false BOTH handlers return 404 (indistinguishable from an unknown route). Default
      OFF, because the board admits any self-signed announcement (the signature verifies
      against the announcement's own NodeId — no identity COST), which makes it Sybil-floodable
      on a public doorway: an attacker mints 64 keypairs and evicts every real peer. accept_at's
      C6a bound only defends against STALE floods; a fresh-Sybil flood is a different threat
      shape, and full resistance is the deferred design in
      genesis/data/timeline/backlog/2026-08-24-manifest-board-sybil-resistance.md.
    concernIds:
      - id: C0
        status: answered
        justification: >
          Names its plane: a runtime enablement flag on a Category-C projection, read once at
          AppState construction, not a truth surface and not a per-request env read.
      - id: C6a
        status: partial
        justification: >
          The gate is the STOPGAP that keeps accept_at's C6a claim honest on a public doorway:
          accept_at bounds the store size and refuses stale-flood eviction, but NOT fresh-Sybil
          eviction, so until the Sybil-resistance design lands the surface stays 404 off the
          fleet (which runs dual, not pure-iroh) and is enabled only in localdev where the peer
          set is trusted. The residual (fresh-Sybil resistance when the board IS on) is the
          named backlog design, not this predicate's job.
      - id: C12
        status: answered
        justification: >
          The 404 is byte-identical to an unknown route, so flipping the flag is not a
          reconnaissance signal — a prober cannot tell the feature exists on a doorway that has
          it disabled.
    contractTests:
      - path: doorway/doorway-service/src/routes/p2p_manifests.rs
        testName: the_board_is_disabled_by_default_and_the_flag_enables_it
        kind: unit
      - path: doorway/doorway-service/src/routes/p2p_manifests.rs
        testName: a_disabled_board_answers_404_indistinguishable_from_an_unknown_route
        kind: unit
    gapNote: >
      Enablement is a stopgap, not the fix: the CRITICAL it mitigates (Sybil-flood peer-directory
      poisoning) is only truly closed by an identity-cost admission design (lead candidate:
      accept only manifests whose agent_cid already resolves via the bootstrap/kitsune2 layer).
      Tracked as needs-brainstorm in the backlog row above.

  - name: AcceptOutcome
    kind: reason-outcome-enum
    sourceLocation:
      file: src/routes/p2p_manifests.rs
      modulePath: routes::p2p_manifests::AcceptOutcome
      line: 206
    summary: Stored / Stale / Full / Expired — what the bounded store did with a VERIFIED announcement.
    notes: >
      Deliberately four values, not a bool: "we already hold something newer", "we are at capacity
      and you are not newer than the oldest", and "you arrived already older than the TTL" are
      three different reasons an announcement is not held, and a peer debugging why it cannot be
      dialled needs to tell them apart. Surfaced verbatim on the 202 body as `outcome`.
    concernIds:
      - id: C4
        status: answered
        justification: >
          The type IS the honest-outcome split: not-stored is never collapsed into stored, and
          each not-stored reason is distinct. A verify refusal is a separate Err channel
          (ManifestVerifyError), so "refused" is distinguishable from all four.
      - id: C8
        status: partial
        justification: >
          The enum gives the log a typed reason (`?outcome`) rather than a raw string, but no
          labeled counter consumes it yet — same gap as accept_at's C8 row.
    contractTests:
      - path: doorway/doorway-service/src/routes/p2p_manifests.rs
        testName: a_stale_announcement_does_not_replace_a_newer_one
        kind: unit
      - path: doorway/doorway-service/src/routes/p2p_manifests.rs
        testName: a_full_store_is_not_displaced_by_an_older_announcement
        kind: unit
      - path: doorway/doorway-service/src/routes/p2p_manifests.rs
        testName: entries_expire_after_the_ttl
        kind: unit

  - name: ManifestVerifyError
    kind: reason-outcome-enum
    sourceLocation:
      file: src/routes/p2p_manifests.rs
      modulePath: routes::p2p_manifests::ManifestVerifyError
      line: 129
    summary: >
      BadNodeId / BadSignatureEncoding / SignatureMismatch / Unreachable / BadDirectAddr — why an
      announcement confers nothing. Mirrors the storage-side enum variant-for-variant.
    concernIds:
      - id: C5
        status: answered
        justification: >
          The refusal vocabulary of the re-derivation: a claim that cannot be evaluated
          (BadNodeId, BadSignatureEncoding) is distinguished from one that evaluates to false
          (SignatureMismatch) and from one that verifies but is useless (Unreachable,
          BadDirectAddr). Unevaluable evidence confers nothing in either direction.
      - id: C8
        status: answered
        justification: >
          Every variant carries its own `#[error(...)]` string, and the refusal is warned beside
          the accepted case with the node_id — a refusal is never a silent drop.
    contractTests:
      - path: doorway/doorway-service/src/routes/p2p_manifests.rs
        testName: an_announcement_that_does_not_verify_is_never_stored
        kind: unit
      - path: doorway/doorway-service/src/routes/p2p_manifests.rs
        testName: an_unreachable_announcement_is_refused
        kind: unit
      - path: doorway/doorway-service/src/routes/p2p_manifests.rs
        testName: the_signing_bytes_carry_the_versioned_domain_prefix
        kind: unit
