# doorway/doorway-service/seam-registry.yaml
#
# Conforms to elohim/sdk/schemas/v1/manifest/seam-registry.schema.json. Doorway's decision
# surface: HTTP dispatch classification, SSR-vs-bundle serving, EPR projection-pool fallback,
# kitsune2 bootstrap PUT outcome, and the reach-gated response-serving predicate.
#
# Every symbol below was grepped and read at authoring time (2026-08-02). Where no direct test
# exists, contractTests is explicit `null` with a gapNote.

seamRegistryVersion: 1
crate: doorway
crateRoot: doorway/doorway-service
seamLocus: >
  Doorway HTTP dispatch classification (src/server/http.rs: classify_dispatch/Disposition,
  epr_should_serve_ssr, SsrFallbackReason), the SSR-bundle-head reconcile decision
  (src/render/registry.rs: decide_reconcile/ReconcileDecision), the EPR projection-pool
  primary/peer/empty/unreachable fallback classifier (src/projection/epr_router.rs:
  fetch_projections_with_fallback/FallbackOutcome), the kitsune2 bootstrap PUT outcome
  (src/bootstrap/k2.rs: K2Store::put_at/K2PutOutcome), and the reach-gated response-serving
  predicate (src/cache/reach_aware_serving.rs: should_serve_response).

decisionPoints:
  - name: decide_reconcile
    kind: pure-decision-predicate
    sourceLocation:
      file: src/render/registry.rs
      modulePath: render::registry::decide_reconcile
      line: 1104
    summary: >
      Compares the currently-materialized SSR bundle head against a freshly-resolved declared
      head: Err (read failure) safe-degrades to Unreachable; equal is UpToDate; different is
      Stale (needs re-materialize + swap).
    concernIds:
      - id: C4
        status: answered
        justification: >
          decide_reconcile_read_failure_is_unreachable_safe_degrade proves a read FAILURE is
          classified distinctly from both UpToDate and Stale — a read error never silently reads
          as "no change needed."
    contractTests:
      - path: doorway/doorway-service/src/render/registry.rs
        testName: decide_reconcile_equal_is_up_to_date
        kind: unit
      - path: doorway/doorway-service/src/render/registry.rs
        testName: decide_reconcile_different_is_stale
        kind: unit
      - path: doorway/doorway-service/src/render/registry.rs
        testName: decide_reconcile_read_failure_is_unreachable_safe_degrade
        kind: unit

  - name: ReconcileDecision
    kind: boundary-answer-type
    sourceLocation:
      file: src/render/registry.rs
      modulePath: render::registry::ReconcileDecision
      line: 1092
    summary: Unreachable(String) / UpToDate(String) / Stale(String) — the decide_reconcile outcome.
    notes: >
      An independent THIRD derivation of the honest-absence type, alongside elohim-storage's
      LocalResolve and steward/node's ConsensusOutcome — the same C4 shape rediscovered bespoke
      at a third seam, exactly the recurrence pattern this whole plan exists to stop.
    concernIds:
      - id: C4
        status: answered
        justification: Same evidence as decide_reconcile; the type IS the three-way honest outcome.
    contractTests:
      - path: doorway/doorway-service/src/render/registry.rs
        testName: decide_reconcile_equal_is_up_to_date
        kind: unit
      - path: doorway/doorway-service/src/render/registry.rs
        testName: decide_reconcile_different_is_stale
        kind: unit
      - path: doorway/doorway-service/src/render/registry.rs
        testName: decide_reconcile_read_failure_is_unreachable_safe_degrade
        kind: unit

  - name: classify_dispatch
    kind: verdict-fn
    sourceLocation:
      file: src/server/http.rs
      modulePath: server::http::classify_dispatch
      line: 76
    summary: >
      Classifies how an unmatched request should be dispatched by consulting the RouteRegistry:
      StorageProxy / SsrRoute / RegistryUnhandled / NotFound. Deterministic given (registry
      state, method, path); no wildcard path-prefix guards.
    concernIds:
      - id: C7
        status: answered
        justification: >
          arbitrary_new_prefix_reaches_registry pins the durable contract this fn exists FOR:
          "if the registry has any compiled route matching (method, path), the registry decides"
          — no hand-maintained prefix list can silently diverge from what the registry actually
          advertises. blob_path_dispatches_to_storage_proxy is the direct regression test for
          the recurring bug where a route WAS registered but dispatch fell through to the SPA
          bootstrap anyway (advertised != served).
    contractTests:
      - path: doorway/doorway-service/src/server/http.rs
        testName: blob_path_dispatches_to_storage_proxy
        kind: unit
      - path: doorway/doorway-service/src/server/http.rs
        testName: arbitrary_new_prefix_reaches_registry
        kind: unit
      - path: doorway/doorway-service/src/server/http.rs
        testName: unregistered_get_returns_not_found
        kind: unit
      - path: doorway/doorway-service/src/server/http.rs
        testName: unregistered_post_returns_not_found
        kind: unit
      - path: doorway/doorway-service/src/server/http.rs
        testName: classify_dispatch_returns_ssr_route_when_render_spec_set
        kind: unit
      - path: doorway/doorway-service/src/server/http.rs
        testName: gated_writes_classify_as_storage_proxy_not_ssr
        kind: unit
      - path: doorway/doorway-service/src/server/http.rs
        testName: landing_routes_that_epr_router_also_serves_still_classify_ssr
        kind: unit

