        kind: unit

  - name: due_from_responsive_reach
    kind: pure-decision-predicate
    sourceLocation:
      file: src/services/owed_response.rs
      modulePath: services::owed_response::due_from_responsive_reach
      line: 131
    summary: >
      Computes the instant a challenged party's answer comes due, from the WINDOW the challenged
      contract declared (`responsiveReach.withinHours`) and the moment the challenge was
      received. Returns None when the term allows no time at all or the arithmetic would
      overflow.
    notes: >
      The window is the collective's declaration on its own contract, whose created_at and
      dhtAnchorHash predate any challenge against it — which is what makes "a due window declared
      before the visitor sent it" checkable rather than asserted. The date itself is arithmetic a
      reader can redo from the commitment's own hasBeginning and the contract's own term, so the
      doorway is never the authority for it. `due` is structurally immutable on the substrate
      (handle_update_state reconciles only state/finished/metadata), so a witnessed window moves
      only by supersession.
    concernIds:
      - id: C4
        status: answered
        justification: >
          An un-computable due date is reported ABSENT rather than rounded into one the doorway
          made up: a_window_of_no_time_yields_no_due_date_rather_than_this_instant and
          an_uncomputable_window_is_absent_never_rounded pin both arms. The sibling
          owed_from_contract answers the same way for the party — a contract that declared
          nobody owes nobody, and the doorway names no substitute.
      - id: C6b
        status: answered
        justification: >
          Idempotent effect: the challenge id this window is witnessed under is an agent-scoped
          composite over (challenger, action, contract, reference), so re-sending the same
          challenge mints nothing twice. the_same_challenge_sent_twice_is_the_same_record pins
          the repeat application, and two_people_challenging_the_same_contract_are_two_records
          is the anti-collapse half — an id that deduped across PEOPLE would silently drop the
          second person's challenge.
