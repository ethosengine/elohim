  - name: owed_from_contract
    kind: verdict-fn
    sourceLocation:
      file: src/services/owed_response.rs
      modulePath: services::owed_response::owed_from_contract
      line: 103
    summary: >
      Decides WHO a doorway may name as owing an answer to a challenge — and the answer is always
      and only the party the challenged contract's own `responsiveReach` declares. A contract
      that declares no term, names nobody, or allows no time yields None, and the refusal then
      offers a challenge that names no party rather than one the doorway chose.
    notes: >
      Authority semantics, hence verdict-fn: this is the one place a doorway could have
      substituted its own judgement for a collective's, and the whole design of the slice is that
      it cannot. The party is copied VERBATIM onto the minted commitment (`provider`), and
      `carriedBy` records the doorway separately — that the two differ IS the record that no
      doorway answered on a collective's behalf.
    concernIds:
      - id: C4
        status: answered
        justification: >
          a_contract_with_no_term_owes_nothing_and_the_doorway_names_nobody and
          a_term_that_names_nobody_or_allows_no_time_is_not_a_term pin that absence stays absence.
          The route then answers ChallengeOutcome::NothingOwed with `owed` present-and-null —
          nothing_owed_says_owed_null_out_loud_rather_than_omitting_it (routes/challenge.rs) —
          so a chrome can tell "nobody was declared" from "the doorway forgot to say".
      - id: C7
        status: answered
        justification: >
          Advertise/serve symmetry between the refusal and the witness: the term a refusal
          advertises (`Refusal.owed`) and the term a challenge is witnessed under come from this
          one function reading one record, and `declaredBy` points back at that record.
          a_refusal_carries_the_contracts_own_redress_term asserts the advertised window and its
          record route on the refusal side.
    contractTests:
      - path: doorway/doorway-service/src/services/owed_response.rs
        testName: the_owed_party_comes_from_the_contract_and_reads_back_to_it
        kind: unit
      - path: doorway/doorway-service/src/services/owed_response.rs
        testName: a_contract_with_no_term_owes_nothing_and_the_doorway_names_nobody
        kind: unit
      - path: doorway/doorway-service/src/services/owed_response.rs
        testName: a_term_that_names_nobody_or_allows_no_time_is_not_a_term
        kind: unit
