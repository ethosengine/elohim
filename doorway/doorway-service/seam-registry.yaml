      modulePath: routes::auth_routes::closed_identifier_tombstone
    summary: >
      The name a closed credential row answers to instead of the one it released.
      `closed:<close-instant-millis>:<identifier>`, chosen so the row stays findable as
      history, so a tombstone is unmistakable on sight, and so two closings of the same
      name can never collide on the `identifier_unique` index.
    concernIds:
      - id: C2
        status: answered
        justification: >
          Pure in (identifier, close instant) — the instant is supplied by the caller, never
          read from the writing process's clock inside this function, so the same close
          produces the same tombstone wherever it is replayed.
      - id: C4
        status: answered
        justification: >
          A tombstoned row is still PRESENT and still carries `closed_identifier`; the name
          becomes unclaimed, which is a different fact from the account never having
          existed. Nothing is deleted to make room.
      - id: C6b
        status: answered
        justification: >
          tombstones_are_distinct_per_closing pins that distinct closings yield distinct
          handles, so the close update can never fail the unique index it is trying to free.
      - {
          id: C13,
          status: n-a,
          justification: "Releases a name; it grants no authority and serves no lower social tier.",
