# doorway/doorway-service/seam-registry.yaml
#
# Conforms to elohim/sdk/schemas/v1/manifest/seam-registry.schema.json. Doorway's decision
# surface: HTTP dispatch classification, SSR-vs-bundle serving, EPR projection-pool fallback,
# kitsune2 bootstrap PUT outcome, and the reach-gated response-serving predicate.
#
# Every symbol below was grepped and read at authoring time (2026-08-02). Where no direct test
# exists, contractTests is explicit `null` with a gapNote.

seamRegistryVersion: 1
crate: doorway
crateRoot: doorway/doorway-service
seamLocus: >
  Doorway HTTP dispatch classification (src/server/http.rs: classify_dispatch/Disposition,
  select_route, epr_should_serve_ssr, SsrFallbackReason), the SSR-bundle-head reconcile decision
  (src/render/registry.rs: decide_reconcile/ReconcileDecision), the EPR projection-pool
  primary/peer/empty/unreachable fallback classifier (src/projection/epr_router.rs:
  fetch_projections_with_fallback/FallbackOutcome), the kitsune2 bootstrap PUT outcome
  (src/bootstrap/k2.rs: K2Store::put_at/K2PutOutcome), the reach-gated response-serving
  predicate (src/cache/reach_aware_serving.rs: should_serve_response), and the ephemeral
  transport-manifest bootstrap projection (src/routes/p2p_manifests.rs:
  TransportManifestStore::accept_at/AcceptOutcome/ManifestVerifyError).

decisionPoints:
  - name: decide_reconcile
    kind: pure-decision-predicate
    sourceLocation:
      file: src/render/registry.rs
      modulePath: render::registry::decide_reconcile
      line: 1493
    summary: >
      Compares the currently-materialized SSR bundle head against a freshly-resolved declared
      head: Err (read failure) safe-degrades to Unreachable; equal is UpToDate; different is
      Stale (needs re-materialize + swap).
    concernIds:
      - id: C4
        status: answered
        justification: >
          decide_reconcile_read_failure_is_unreachable_safe_degrade proves a read FAILURE is
          classified distinctly from both UpToDate and Stale — a read error never silently reads
          as "no change needed."
    contractTests:
      - path: doorway/doorway-service/src/render/registry.rs
        testName: decide_reconcile_equal_is_up_to_date
        kind: unit
      - path: doorway/doorway-service/src/render/registry.rs
        testName: decide_reconcile_different_is_stale
        kind: unit
      - path: doorway/doorway-service/src/render/registry.rs
        testName: decide_reconcile_read_failure_is_unreachable_safe_degrade
        kind: unit

  - name: ReconcileDecision
    kind: boundary-answer-type
    sourceLocation:
      file: src/render/registry.rs
      modulePath: render::registry::ReconcileDecision
      line: 1414
    summary: Unreachable(String) / UpToDate(String) / Stale(String) — the decide_reconcile outcome.
    notes: >
      An independent THIRD derivation of the honest-absence type, alongside elohim-storage's
      LocalResolve and steward/node's ConsensusOutcome — the same C4 shape rediscovered bespoke
      at a third seam, exactly the recurrence pattern this whole plan exists to stop.
    concernIds:
      - id: C4
        status: answered
        justification: Same evidence as decide_reconcile; the type IS the three-way honest outcome.
    contractTests:
      - path: doorway/doorway-service/src/render/registry.rs
        testName: decide_reconcile_equal_is_up_to_date
        kind: unit
      - path: doorway/doorway-service/src/render/registry.rs
        testName: decide_reconcile_different_is_stale
        kind: unit
      - path: doorway/doorway-service/src/render/registry.rs
        testName: decide_reconcile_read_failure_is_unreachable_safe_degrade
        kind: unit

  - name: adoption_targets
    kind: pure-decision-predicate
    sourceLocation:
      file: src/render/registry.rs
      modulePath: render::registry::adoption_targets
      line: 1226
    summary: >
      Names the CONFIGURED SSR app slugs this serving node holds no bundle head for — the slugs
      whose server head was not yet declared upstream when boot materialize ran, and which the
      heads-keyed reconcile walk therefore cannot see. Each named slug gets a declared-head
      re-check on the reconcile tick and is materialized + loaded (adopted) the moment the
      declaration appears — a head declared at ANY time converges without a process restart
      (wave-2 2026-08-22: servedBundleHeads stayed [] until an operator restart).
    concernIds:
      - id: C4
        status: answered
        justification: >
          A missing head is treated as honest absence, never concluded: the slug stays a named
          adoption target every tick until its declared head resolves, and a still-undeclared
          head produces an "undeclared" outcome (no head fabricated) rather than silence.
    contractTests:
      - path: doorway/doorway-service/src/render/registry.rs
        testName: adoption_targets_names_only_unserved_configured_slugs
        kind: unit
      - path: doorway/doorway-service/src/render/registry.rs
        testName: late_declared_head_is_adopted_and_served
        kind: unit
      - path: doorway/doorway-service/src/render/registry.rs
        testName: non_default_adoption_does_not_touch_the_default_renderer
        kind: unit

  - name: classify_dispatch
    kind: verdict-fn
    sourceLocation:
      file: src/server/http.rs
      modulePath: server::http::classify_dispatch
      line: 76
    summary: >
      Classifies how an unmatched request should be dispatched by consulting the RouteRegistry:
      StorageProxy / SsrRoute / RegistryUnhandled / NotFound. Deterministic given (registry
      state, method, path); no wildcard path-prefix guards.
    concernIds:
      - id: C7
        status: answered
        justification: >
          arbitrary_new_prefix_reaches_registry pins the durable contract this fn exists FOR:
          "if the registry has any compiled route matching (method, path), the registry decides"
          — no hand-maintained prefix list can silently diverge from what the registry actually
          advertises. blob_path_dispatches_to_storage_proxy is the direct regression test for
          the recurring bug where a route WAS registered but dispatch fell through to the SPA
          bootstrap anyway (advertised != served).
    contractTests:
      - path: doorway/doorway-service/src/server/http.rs
        testName: blob_path_dispatches_to_storage_proxy
        kind: unit
      - path: doorway/doorway-service/src/server/http.rs
        testName: arbitrary_new_prefix_reaches_registry
        kind: unit
      - path: doorway/doorway-service/src/server/http.rs
        testName: unregistered_get_returns_not_found
        kind: unit
      - path: doorway/doorway-service/src/server/http.rs
        testName: unregistered_post_returns_not_found
        kind: unit
      - path: doorway/doorway-service/src/server/http.rs
        testName: classify_dispatch_returns_ssr_route_when_render_spec_set
        kind: unit
      - path: doorway/doorway-service/src/server/http.rs
        testName: gated_writes_classify_as_storage_proxy_not_ssr
        kind: unit
      - path: doorway/doorway-service/src/server/http.rs
        testName: landing_routes_that_epr_router_also_serves_still_classify_ssr
        kind: unit

  - name: select_route
    kind: pure-decision-predicate
    sourceLocation:
      file: src/server/http.rs
      modulePath: server::http::select_route
      line: 115
    summary: >
      Picks WHICH of the registry's matches serves this request — one target, never a fan-out. For
      content-addressed `/blob/` paths ONLY, walks the declared steward-peer priority order and
      takes the first endpoint that is not currently shedding; every other path keeps
      `matches.first()`. When the whole pool sheds, the declared primary is kept so the caller
      lands on the existing guarded-shed path. Availability is READ (`UpstreamBreakers::would_shed`),
      never gated — a planner that gated would consume the one half-open trial with nothing to
      record its outcome.
    concernIds:
      - id: C7
        status: answered
        justification: >
          The registry ADVERTISES every steward peer that holds `/blob/:hash`; before this
          predicate, dispatch SERVED a 503 for the primary's whole 30 s cooldown while advertised
          siblings held the identical content-addressed bytes — advertise != serve at the
          dispatch seam. blob_read_rides_past_a_shedding_primary_to_a_holder_that_serves pins the
          symmetry, and projections_never_float_between_peers_even_when_the_primary_sheds pins its
          limit: only content-addressed reads may float, because only they are the same answer
          from any advertised holder.
    contractTests:
      - path: doorway/doorway-service/src/server/http.rs
        testName: blob_read_stays_on_the_primary_while_it_is_serving
        kind: unit
      - path: doorway/doorway-service/src/server/http.rs
        testName: blob_read_rides_past_a_shedding_primary_to_a_holder_that_serves
        kind: unit
      - path: doorway/doorway-service/src/server/http.rs
        testName: blob_read_falls_back_to_the_primary_when_the_whole_pool_sheds
        kind: unit
      - path: doorway/doorway-service/src/server/http.rs
        testName: projections_never_float_between_peers_even_when_the_primary_sheds
        kind: unit
      - path: doorway/doorway-service/src/server/http.rs
        testName: selection_never_consumes_the_half_open_trial
        kind: unit
    notes: >
      End-to-end proof of this predicate lives in the a2o story, not in this row: the scenario
      "A blob rides through its primary's bad hour" in
      genesis/a2o/features/dataplane/doorway-failover.feature. It was briefly cited as a
      contractTest and could never resolve — the census verifies a citation by grepping
      `fn <testName>(` in the cited file, so a .feature path reads as a missing test, and a
      feature-level `@concern:` tag names a whole ten-scenario story rather than this one row.
      The join it belongs to already exists at the right altitude: `@concern:doorway-failover`
      -> the `doorway-failover` habit's `checks:` in genesis/manifests/habits.yaml -> seam S3.9's
      `habits:` in the seam catalog. This pointer is context; the five unit tests above are the pin.

  - name: Disposition
    kind: boundary-answer-type
    sourceLocation:
      file: src/server/http.rs
      modulePath: server::http::Disposition
      line: 49
    summary: StorageProxy{endpoint} / SsrRoute{spec,endpoint} / RegistryUnhandled / NotFound.
    concernIds:
      - id: C7
        status: answered
        justification: Same evidence as classify_dispatch; the type IS the advertise-vs-serve outcome.
    contractTests:
