  - name: ShellProvenance
    kind: reason-outcome-enum
    sourceLocation:
      file: src/render/warm_shell.rs
      modulePath: render::warm_shell::ShellProvenance
      line: 155
    summary: >
      LastReconciled / DeclaredHead — WHY a served shell carries (or does not carry) the
      x-elohim-bundle staleness marker. LastReconciled means the doorway served its own
      projection of the last reconciled bundle with no upstream read this request; DeclaredHead
      means the upstream confirmed it, so no marker is emitted and the marker DROPS the moment
      the upstream answers again.
    concernIds:
      - id: C7
        status: answered
        justification: >
          What the response advertises equals what it serves: a possibly-one-behind bundle
          declares itself as such on the wire rather than passing as the declared head.
          Pinned by warm_shell_serve_is_marked_and_a_confirmed_head_drops_the_marker.
      - id: C8
        status: partial
        justification: >
          The reason is typed and observable per-response on the wire, but is not aggregated
          into a labeled counter.
    contractTests:
      - path: doorway/doorway-service/src/server/http.rs
        testName: warm_shell_serve_is_marked_and_a_confirmed_head_drops_the_marker
        kind: unit

