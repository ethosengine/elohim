        kind: unit
      - path: doorway/doorway-service/src/server/http.rs
        testName: malformed_present_host_returns_400_before_wildcard_relay
        kind: integration
      - path: doorway/doorway-service/src/services/name_routing.rs
        testName: exact_commitment_reference_requires_one_coherent_current_holder
        kind: unit
      - path: doorway/doorway-service/src/routes/coherence.rs
