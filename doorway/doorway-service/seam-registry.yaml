      is a pass-through and tolerated it silently; elohim-storage's compute-grant surface does
      `AgentPubKey::try_from(recipient)` and refused with "recipient must be a Holochain agent
      key", so every hosted registration's promise leg 500'd while nothing else complained.
      Bare base64 is the drift; the canonical form is the protocol's. Tolerance runs one way
      only — a legacy spelling is repaired on read, and a string that is not a key in any
      encoding (the dev-mode `uhCAk-dev-mode-agent-key` placeholder) is never rewritten,
      because turning an honest miss into a plausible-looking wrong match is the worse failure.
    concernIds:
      - id: C9
        status: answered
        justification: >
          Identity-lineage continuity across a change of string form. A row persisted under the
          pre-canonical spelling still resolves to the same agent rather than being orphaned:
          any_spelling_of_a_key_finds_the_conductor_and_deprovisions_it stores ONLY the legacy
          form and then resolves it by the canonical one, and
          bare_base64_is_normalized_onto_the_canonical_form proves the repaired string
          satisfies the exact parse the grant surface makes. The two string-holding readers
          follow the same rule through `lookup_forms_of` and `decode_key_bytes`, which are
          defined as normalize-then-read so they cannot disagree with this predicate about
          what a string means: force_graduation_finds_a_pre_canonical_row_from_the_canonical_key
          and the_steward_flag_update_reaches_a_canonical_row_from_the_legacy_key pin the admin
