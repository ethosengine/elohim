  - name: BehindReason
    kind: reason-outcome-enum
    sourceLocation:
      file: src/render/coherence.rs
      modulePath: render::coherence::BehindReason
    summary: >
      Why a served shell is not confirmed at the declared head:
      MissingAsset(file) / HeadUnknown / StorageUnreachable / StaleProjection. Rendered on the
      wire as `x-elohim-bundle: behind;<reason>`, ADDITIVELY beside the existing
      `last-reconciled` (coherent but unconfirmed this request) and `slug-resolved` values, both
      of which keep their exact 2026-09-04 meanings because a2o reads them.
    concernIds:
      - id: C4
        status: answered
        justification: >
          The enum EXISTS to keep the four non-confirmed conditions distinguishable on the wire.
          Before it, a shell naming a 404'd script and a healthy one were the same 200 with the
          same header for 15 hours — that indistinguishability is what let the incident run.
      - id: C8
        status: answered
        justification: >
          `class()` is the bounded metrics/log label (the segment before the first `:`), so a
          reason carrying an unbounded build-time asset name can be counted without unbounded
          label cardinality — the same discipline elohim-storage's deliverability counter uses.
    contractTests:
      - path: doorway/doorway-service/src/render/coherence.rs
        testName: reason_tokens_are_the_declared_vocabulary
        kind: unit
      - path: doorway/doorway-service/src/render/coherence.rs
        testName: storages_own_reason_is_carried_through_not_re_derived
        kind: unit
      - path: doorway/doorway-service/src/server/http.rs
        testName: an_unconfirmed_head_names_its_reason_on_the_wire
