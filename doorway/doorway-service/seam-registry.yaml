        testName: a_refusal_carries_the_contracts_own_redress_term
        kind: unit
      - path: doorway/doorway-service/src/services/serve_eligibility.rs
        testName: a_refusal_with_no_declared_term_says_owed_null_rather_than_naming_anybody
