  # ── Bounded DHT self-registration (2026-09-21) ────────────────────────────
  # Born from a measured liveness defect on the household mesh: registration was
  # ONE attempt 5s after boot, and its failure (`CellDisabled` — the conductor's
  # interfaces accept calls while its cells are still initialising) was a WARN
  # and nothing more. `gamma-elohim-host` was then absent from every doorway's
  # /api/v1/federation/doorways for the whole life of the process, so no sibling
  # could discover it and it could never be a holder in anyone's name-route fold
  # (logs/doorway-c.log, 2026-09-21T03:22:42.239908Z).
  - name: registration_retry_delay_secs
    kind: pure-decision-predicate
    sourceLocation:
      file: src/services/federation.rs
      modulePath: services::federation::registration_retry_delay_secs
      line: 233
    summary: >
      The gap before retry `attempt` (1-based; attempt 0 is the boot try) of this doorway's own
      DHT self-registration, or `None` once the bounded budget is spent. Exponential from
      REGISTRATION_RETRY_BASE_SECS (15) doubling to a REGISTRATION_RETRY_MAX_SECS (300) cap,
      REGISTRATION_MAX_RETRIES (12) retries, ~42 minutes of total patience — deliberately longer
      than this conductor line's ~11-minute cell-startup window and deliberately finite. Pure:
      the schedule is the decision, the sleeping belongs to the caller
      (`drive_registration_with_retry`, which injects `sleep` so the schedule is testable without
      a 42-minute test).
    concernIds:
      - id: C0
        status: answered
        justification: >
          Ephemeral (C). The schedule is in-process arithmetic; the only durable artifact is the
          DoorwayRegistration entry the infrastructure zome validates, which this predicate does
          not author — it only decides WHEN to ask.
      - id: C1
        status: n-a
        justification: >
          Nothing is elected. The doorway registers itself under its own agent key and the
          integrity zome is the validator; a retry cannot widen what a single attempt could claim.
      - id: C2
        status: answered
        justification: >
          A retry cannot regress authority: `register_doorway_in_dht` treats "already exists" as
          an update, so a late-succeeding retry converges the SAME id's record forward and never
          replaces a newer one with a boot-time snapshot.
      - id: C3
        status: answered
        justification: >
          This IS the liveness cure, in the strict sense: from the reachable state
          "conductor cells not yet initialised at T+5s" the old code had NO legal move to the
          registered state for the rest of the process's life. registration_retries_through_the_
          conductor_startup_window replays that exact `CellDisabled` sequence and reaches
          Registered; the_retry_schedule_is_monotonic_capped_and_bounded proves the patience
          outlasts the window that caused it.
      - id: C4
        status: answered
        justification: >
          Exhaustion is a NAMED verdict, never silence: RegistrationOutcome::GaveUp carries the
          attempt count and the last error, and the caller logs it at ERROR naming the consequence
          ("no sibling can discover it or relay a name to it"). Pinned by
          registration_gives_up_after_the_bounded_budget.
      - id: C5
        status: n-a
        justification: >
          No evidence is weighed here. The predicate reads an attempt counter, nothing a peer said.
      - id: C6a
        status: answered
        justification: >
          Bounded on both axes: a capped per-gap delay and a finite retry count, with exactly ONE
          call in flight (the driver awaits sequentially). registration_gives_up_after_the_bounded_
          budget pins the count; the_retry_schedule_is_monotonic_capped_and_bounded pins the cap.
      - id: C6b
        status: answered
        justification: >
          Retrying is safe because the effect is idempotent: register_doorway_in_dht falls back to
          update_doorway on an "already exists" error, so a retry after a call the conductor
          actually completed (the uncancellable case) converges rather than duplicating.
      - id: C7
        status: partial
        justification: >
          GAP. A doorway that exhausted its budget still answers /health 200 and still serves
          content while being absent from /api/v1/federation/doorways — nothing on its own surface
          advertises "I am not registered". The ERROR log is the only signal. A registration-state
          field on the coherence manifest or /admin/self-healing would close this.
      - id: C8
        status: partial
        justification: >
          Every attempt logs at WARN with attempt/retry_in_secs/error, and exhaustion at ERROR;
          the three driver tests pin the decision sequence (which attempts run, which gaps are
          slept). GAP: there is no counter or gauge for "this doorway is not in the registry", so
          the condition is greppable but not scrapeable.
      - id: C9
        status: n-a
        justification: >
          No lineage decision. The doorway_id and agent key are fixed for the process; a retry
          re-presents the same identity, never a successor.
      - id: C10
        status: n-a
        justification: >
          No wire contract. RegisterDoorwayInput is unchanged by this work; only the retry
          cadence around the same call is new.
      - id: C11
        status: answered
        justification: >
          This is the externally-imposed-backpressure response. A conductor that is up but whose
          cells are still initialising is precisely backpressure the doorway cannot influence, and
          the answer is bounded exponential backoff with a cap — NOT a caller-side timeout around
          the zome call, which `conductor-call-is-uncancellable` forbids (abandoning the call does
          not stop the conductor, it only loses the answer).
      - id: C12
        status: n-a
        justification: >
          No authorization decision: the doorway is registering itself, and the infrastructure
          zome's own validation is the gate.
      - id: C13
        status: n-a
        justification: >
          No graduated authority. Registration is a single flat declaration of existence; the
          retry does not accrue standing.
      - id: C14
        status: partial
        justification: >
          GAP (same residual C7 names from the other side). The residual of exhaustion — an
          undiscoverable doorway — is witnessed only in that doorway's own log, by nobody who
          could act on it. No peer and no operator surface observes the absence.
    contractTests:
      - path: doorway/doorway-service/src/services/federation.rs
        testName: the_retry_schedule_is_monotonic_capped_and_bounded
        kind: unit
      - path: doorway/doorway-service/src/services/federation.rs
        testName: registration_retries_through_the_conductor_startup_window
        kind: unit
      - path: doorway/doorway-service/src/services/federation.rs
        testName: registration_that_succeeds_at_boot_never_retries
        kind: unit
      - path: doorway/doorway-service/src/services/federation.rs
        testName: registration_gives_up_after_the_bounded_budget
        kind: unit

  - name: RegistrationOutcome
    kind: reason-outcome-enum
    sourceLocation:
      file: src/services/federation.rs
      modulePath: services::federation::RegistrationOutcome
      line: 246
    summary: >
      How a bounded DHT self-registration run ended — Registered{attempts} or
      GaveUp{attempts,last_error}. Closed, two-member set: there is no third "still trying" member
      because `drive_registration_with_retry` only returns once the loop is over, so an
      in-progress run is represented by the task still running, never by a value.
    concernIds:
      - id: C0
        status: answered
        justification: Ephemeral (C) — an in-process return value, never persisted or gossiped.
      - id: C1
        status: n-a
        justification: Not an election outcome.
      - id: C2
        status: n-a
        justification: Carries no authority stamp and cannot move a head.
      - id: C3
        status: answered
        justification: >
          Both members are TERMINAL, which is what makes the driver's loop provably finite: every
          run ends in one of them (registration_gives_up_after_the_bounded_budget reaches the
          second, the two success tests reach the first).
      - id: C4
        status: answered
        justification: >
          GaveUp is the honest-absence member: failure is a value the caller must match on, not a
          swallowed Err or a bare `bool`, so the ERROR log naming the consequence cannot be
          forgotten by a future caller.
      - id: C5
        status: n-a
        justification: Weighs no evidence.
      - id: C6a
        status: answered
        justification: >
          `attempts` on both members makes the bound observable rather than merely intended — the
          budget test asserts it equals REGISTRATION_MAX_RETRIES + 1.
      - id: C6b
        status: n-a
        justification: A verdict value has no effect to make idempotent.
      - id: C7
        status: partial
        justification: >
          GAP (shared with registration_retry_delay_secs C7). Neither member is projected onto any
          serving surface, so what this doorway advertises about itself is silent about which
          member it reached.
      - id: C8
        status: partial
        justification: >
          Each member has exactly one log site with distinct severity (INFO / ERROR). GAP: no
          metric label is derived from the member, so the two outcomes are not scrapeable.
      - id: C9
        status: n-a
        justification: Carries no identity or lineage.
      - id: C10
        status: answered
        justification: >
          Not a wire type — it never crosses a process boundary, so adding a member later is free
          and cannot break a peer. Deliberately kept internal for that reason.
      - id: C11
        status: answered
        justification: >
          GaveUp is precisely "externally-imposed backpressure outlasted our bounded patience",
          distinguished from success rather than collapsed into it.
      - id: C12
        status: n-a
        justification: No authorization decision.
      - id: C13
        status: n-a
        justification: No graduated authority.
      - id: C14
        status: partial
        justification: >
          GAP. GaveUp names a residual (this doorway is undiscoverable) that no peer witnesses;
          the value is consumed locally and dropped.
    contractTests:
      - path: doorway/doorway-service/src/services/federation.rs
        testName: registration_gives_up_after_the_bounded_budget
        kind: unit
      - path: doorway/doorway-service/src/services/federation.rs
        testName: registration_that_succeeds_at_boot_never_retries
        kind: unit

  - name: CoherenceDoorbell
    kind: boundary-answer-type
    sourceLocation:
      file: src/routes/coherence.rs
      modulePath: routes::coherence::CoherenceDoorbell
      line: 155
    summary: >
      {doorwayId, digest} — story 4.2 slice 1. Sits next to CoherenceManifest and is NOT a
      new authority: it carries no heads, so a receiver can never install anything from the
      doorbell body itself. It is evidence that the sender's digest changed, triggering a
      pull of the sender's own GET /api/v1/federation/coherence at a URL the receiver already
      holds in peer_cache, never a URL taken from the body.
    concernIds:
      - id: C0
        status: answered
        justification: >
          Federation plane (doorway<->doorway HTTP). Substrate truth stays in the DHT
          project-epr commitment; this message carries no truth of its own.
      - id: C1
        status: answered
        justification: >
          A pull installs only the manifest's own heads, under its own doorwayId. See
          pull_and_install_holder's IdMismatch arm (services::federation) for the anti-self-
          election check this message's receiver runs before ever installing anything.
      - id: C2
        status: answered
        justification: >
          The message carries no head-set and stamps no head — monotonicity is entirely the
          RECEIVER's job (NameRouteTable::replace_all_at), not this type's.
      - id: C3
        status: n-a
        justification: Carries no liveness claim.
      - id: C4
        status: answered
        justification: >
          An unknown doorwayId 404s (routes::coherence::handle_doorbell); the household "deaf"
          fixture answers 202 {"pulled":false,"reason":"deaf"} rather than silently dropping.
      - id: C5
        status: answered
        justification: >
          THE WHOLE POINT of this type: it carries no heads, so it cannot BE authority — only
          the pulled GET .../coherence, fetched by the receiver from its own peer_cache URL,
          can install anything.
      - id: C6a
        status: answered
        justification: >
          Every field is a String — cheap to parse and bounded by the route's own body-read
          path (server/http.rs's req.collect()).
      - id: C6b
        status: answered
        justification: >
          A digest equal to the held one is a no-op (NameRouteTable::held_digest check in
          receive_doorbell) — re-ringing the same digest costs one comparison, no re-install.
      - id: C7
        status: answered
        justification: >
          The sibling installs exactly what the holder's own GET serves — the doorbell never
          advertises anything the coherence endpoint would not also answer.
      - id: C8
        status: answered
        justification: >
          doorway_federation_doorbell_total{side,outcome} records every ring and every
          receive, pre-touched over the closed outcome vocabulary
          (services::federation_doorbell::ALL_OUTCOMES).
      - id: C9
        status: answered
        justification: >
          doorwayId is the federation namespace, resolved only through peer_cache (the
          signed-registry-seeded discovery cache) — never a cross-namespace compare.
      - id: C10
        status: answered
        justification: >
          A new route: an older sibling answers 404/405 and the sender mutes that peer for
          OLD_SIBLING_MUTE (10 min). CoherenceManifest's own wire shape is unchanged by this
          addition (additive: a new sibling route, not a field on an existing message).
      - id: C11
        status: answered
        justification: >
          A 503 from the receiver is dropped by the sender's ring loop; its Retry-After
          (clamped 5-300s via clamp_retry_after, reusing name_routing::SHED_WINDOW_MIN/MAX_SECS)
          mutes that peer. The poll backstops any lost ring.
      - id: C12
        status: answered
        justification: >
          No auth, deliberately — the message confers nothing (see C5). An eager SIGNED
          payload is deferred to slice 2 (design §4).
      - id: C13
        status: n-a
        justification: No authority is granted or graduated by this message.
      - id: C14
        status: answered
        justification: >
          Every dropped, muted, or failed ring is counted (OUTCOME_UNREACHABLE,
          OUTCOME_MUTED_BACKPRESSURE, OUTCOME_MUTED_OLD_SIBLING, OUTCOME_REFUSED,
          OUTCOME_SKIPPED_MUTED) — the residual is visible on /metrics, and the 60s poll heals
          it regardless.
    contractTests:
      - path: doorway/doorway-service/src/routes/coherence.rs
        testName: router_fingerprint_is_deterministic_cid_and_camel_case
        kind: unit
      - path: doorway/doorway-service/src/services/federation_doorbell.rs
        testName: clamp_retry_after_honours_a_declared_window_within_bounds
        kind: unit
      - path: doorway/doorway-service/src/services/federation_doorbell.rs
        testName: clamp_retry_after_defaults_an_absent_header_to_the_no_window_named_default
        kind: unit
    notes: >
      genesis/a2o/features/federation/projection-index-doorbell.feature scenario 1's "doorway
      beta logged a doorbell pull from doorway alpha naming the digest that holds garden"
      exercises the message end-to-end over a live household mesh (no unit test constructs
      CoherenceDoorbell's JSON wire shape directly — it is a plain two-field struct with
      #[serde(rename_all = "camelCase")], the same pattern CoherenceManifest's own tests
      already pin).

  - name: handle_doorbell
    kind: verdict-fn
    sourceLocation:
      file: src/routes/coherence.rs
      modulePath: routes::coherence::handle_doorbell
      line: 175
    summary: >
      POST /api/v1/federation/doorbell (story 4.2 slice 1). Gates on the household "deaf"
      fixture first, parses the body, then delegates the receive decision to
      services::federation_doorbell::receive_doorbell (DoorbellReceipt) and maps it to the
      HTTP response. Answers 202 in every non-404 case — the sender is never held for the
      pull itself.
    concernIds:
      - id: C0
        status: answered
        justification: Federation plane, doorway-local dispatch only.
      - id: C1
        status: answered
        justification: >
          Delegated to services::federation::pull_and_install_holder's IdMismatch arm, which
          receive_doorbell's spawned pull consults before ever installing anything.
      - id: C2
        status: answered
        justification: >
          The install this route triggers goes through NameRouteTable::replace_holder, which
          stamps holder_installed_at — the guard a later, slower poll round respects (see
          NameRouteTable's own entry, or replace_all_at directly).
      - id: C3
        status: partial
        justification: >
          A successful pull marks the holder Serving (via install_holder_snapshot's liveness
          arg). A failed pull never demotes here — GAP is shared with the wider name-routing
          liveness model: only the discovery poll and a live relay attempt (note_shed) demote.
      - id: C4
        status: answered
        justification: >
          Unknown doorwayId -> 404 {"error":"unknown-doorway"}. Deaf -> 202
          {"pulled":false,"reason":"deaf"}. Digest already held -> 202 {"pulled":false}.
          Pinned by the deaf-gate and DoorbellReceipt::UnknownDoorway/NoOp match arms.
      - id: C5
        status: answered
        justification: >
          The handler never installs anything itself — it only calls receive_doorbell, which
          spawns a pull of the SENDER's own GET (never trusts the doorbell body as authority).
      - id: C6a
        status: answered
        justification: >
          services::federation_doorbell::DoorbellReceiver bounds the receiver to at most one
          in-flight pull per holder plus one dirty bit — pinned by
          a_burst_of_doorbells_for_the_same_holder_still_collapses_to_one_follow_up_pull.
      - id: C6b
        status: answered
        justification: >
          NameRouteTable::held_digest equality check answers 202 {"pulled":false} with no
          pull spawned when the digest already matches.
      - id: C7
        status: answered
        justification: >
          The pull installs exactly the manifest the holder's own coherence GET serves — the
          same relay a sibling would hit.
      - id: C8
        status: answered
        justification: >
          Every branch records doorway_federation_doorbell_total{side="receive",outcome=...},
          and a successful pull logs one INFO "doorbell pull" line naming doorway_id + digest
          + outcome — the exact line projection-index-doorbell.feature's a2o steps grep for.
      - id: C9
        status: answered
        justification: >
          doorwayId is resolved through peer_cache only (the signed-registry-seeded discovery
          cache), never accepted as a bare claim from an unregistered caller.
      - id: C10
        status: answered
        justification: >
          A brand-new route: an older sibling that has not shipped it answers 404/405, which
          the SENDER's ring loop (not this handler) mutes for OLD_SIBLING_MUTE.
      - id: C11
        status: answered
        justification: >
          A 503 from THIS handler (e.g. under admission shedding upstream of routing) is a
          genuine backpressure signal a caller can read the same way any other doorway route's
          503 is read; this route itself never emits one deliberately (it always answers
          202/404/400).
      - id: C12
        status: answered
        justification: >
          Deliberately no auth (design §3, C12 "no auth, deliberately: the message confers
          nothing"). A signed payload is a slice-2 deferral.
      - id: C13
        status: n-a
        justification: No authority is granted or graduated by this route.
      - id: C14
        status: answered
        justification: >
          Every outcome (installed, id_mismatch, garbage_body, unreachable, unknown_doorway,
          noop, deaf, queued) is counted and logged — nothing is silently dropped.
    contractTests:
      - path: doorway/doorway-service/src/services/federation_doorbell.rs
        testName: a_second_doorbell_while_the_first_pull_is_running_sets_the_dirty_bit_instead
        kind: unit
      - path: doorway/doorway-service/src/services/federation_doorbell.rs
        testName: finishing_with_no_dirty_bit_releases_the_holder_so_a_fresh_doorbell_begins_again
        kind: unit
      - path: doorway/doorway-service/src/services/name_routing.rs
        testName: a_slower_poll_round_cannot_overwrite_a_newer_doorbell_install
        kind: unit
    notes: >
      The full HTTP handler (deaf-gate -> body-parse -> receive_doorbell -> status mapping) is
