  - name: ring_doorbell
    kind: state-transition
    sourceLocation:
      file: src/services/federation_doorbell.rs
      modulePath: services::federation_doorbell::spawn_doorbell_ringer
      line: 246
    summary: >
      Story 4.2 slice 1's sender loop. Wakes on EprRouter::changed() (one coalesced permit
      per Notify — bounded, lossy), debounces 250ms, mints the self coherence digest, skips
      re-ringing an unchanged digest, then POSTs CoherenceDoorbell to at most MAX_RING_PEERS
      (32) registered peers, each under a 2s timeout with no retry, muting a peer on 503
      (clamped Retry-After) or 404/405 (an older sibling) rather than hammering it every
      round.
    concernIds:
      - id: C0
        status: answered
        justification: Federation plane, one outbound POST per registered peer per round.
      - id: C1
        status: n-a
        justification: The sender elects nothing — it only rings; the receiver decides.
      - id: C2
        status: n-a
        justification: The ringer stamps no head and carries no monotonic ordering itself.
      - id: C3
        status: n-a
        justification: The ringer observes no liveness of its own — it only records outcomes.
      - id: C4
        status: answered
        justification: >
          A peer answering non-2xx is recorded honestly (OUTCOME_REFUSED /
          OUTCOME_UNREACHABLE / the two mute outcomes), never silently swallowed.
      - id: C5
        status: answered
        justification: >
          The ringer never installs anything on the receiving end — it only signals "I
          changed"; C5 is enforced entirely by the message shape (CoherenceDoorbell) and the
          receiver, not by this loop.
      - id: C6a
        status: answered
        justification: >
          Bounded on every axis: MAX_RING_PEERS=32 peers, RING_TIMEOUT=2s per ring, no retry,
          and a single coalesced Notify permit means a burst of local changes rings at most
          once per RING_DEBOUNCE window, for the LAST digest.
      - id: C6b
        status: answered
        justification: >
          last_rung short-circuits a ring whose digest is unchanged from the last one sent —
          the no-op periodic-refetch-bumps-generation-without-changing-digest case the design
          calls out explicitly (§3.1 step 3).
      - id: C7
        status: answered
        justification: >
          The ringer advertises nothing beyond {doorwayId, digest} — what it rings with is a
          strict subset of what GET .../coherence would answer.
      - id: C8
        status: answered
        justification: >
          One INFO "doorbell: ring round complete" line per round (peers, accepted, digest)
          plus a doorway_federation_doorbell_total{side="ring",outcome} increment per peer
          per round.
      - id: C9
        status: answered
        justification: >
          Rings by the doorwayId/URL peer_cache already resolved via the signed doorway
          registry — never a caller-supplied target.
      - id: C10
        status: answered
        justification: >
          A 404/405 (older sibling, route not yet shipped) mutes that peer for
          OLD_SIBLING_MUTE (10 min) rather than treating it as a hard failure every round —
          pinned by the RingMutes tests.
      - id: C11
        status: answered
        justification: >
          A 503 mutes the peer for its clamped Retry-After (clamp_retry_after, [5,300]s,
          defaulting to SHED_WINDOW_DEFAULT_SECS when absent/unparseable) — pinned by
          clamp_retry_after_* tests.
      - id: C12
        status: n-a
        justification: No authorization decision — the ringer only notifies.
      - id: C13
        status: n-a
        justification: No graduated authority is exercised by ringing.
      - id: C14
        status: answered
        justification: >
          Every skipped-because-muted, refused, and unreachable ring is counted
          (OUTCOME_SKIPPED_MUTED / OUTCOME_REFUSED / OUTCOME_UNREACHABLE) — the residual is
          witnessed on /metrics, and the 60s discovery poll heals it regardless of whether any
          ring ever lands.
    contractTests:
      - path: doorway/doorway-service/src/services/federation_doorbell.rs
        testName: a_muted_peer_is_muted_until_the_window_named_elapses
        kind: unit
      - path: doorway/doorway-service/src/services/federation_doorbell.rs
        testName: a_fresh_mute_replaces_the_standing_one_rather_than_extending_it
        kind: unit
      - path: doorway/doorway-service/src/services/federation_doorbell.rs
        testName: all_outcomes_has_no_duplicate_label
        kind: unit
    notes: >
      The ring loop's timing and debounce behavior (Notify coalescing, 250ms debounce,
      last_rung skip) is exercised only end-to-end by
      genesis/a2o/features/federation/projection-index-doorbell.feature scenario 1 against a
      live household mesh — no unit test drives spawn_doorbell_ringer's loop body directly (it
      is a tokio::spawn'd infinite loop over live network I/O; the pure per-decision pieces it
      calls, RingMutes and clamp_retry_after, ARE unit-tested above).
