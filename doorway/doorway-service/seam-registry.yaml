          alphabets really did disagree, so the round-trip proves a fix rather than a
          tautology.
      - id: C10
        status: answered
        justification: >
          Contract-evolution honesty — an unrecognized input is passed through unchanged, never
          defaulted or coerced into a key-shaped guess.
          a_non_key_string_is_passed_through_untouched and
          a_wrong_length_decode_is_not_treated_as_a_key pin both halves; the length check is
          what stops a cleanly-decodable 32-byte string from being re-emitted as a 39-byte key.
      - id: C7
