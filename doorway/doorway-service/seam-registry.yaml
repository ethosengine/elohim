  - name: should_serve_response
    kind: pure-decision-predicate
    sourceLocation:
      file: src/cache/reach_aware_serving.rs
      modulePath: cache::reach_aware_serving::should_serve_response
      line: 50
    summary: >
      Gates serving cached response bytes by extracted reach level, requester authentication,
      and requester identity (for private reach). No reach specified -> allow (documented
      backward-compat default).
    notes: >
      This IS the fail-open no-reach branch named in this plan's own seeded forecast row 1
      (reach-enforced-everywhere x doorway egress): re-exported from cache/mod.rs but with ZERO
      production call sites anywhere in this crate (grep-verified 2026-08-02 — the only
      references are the re-export and this file's own #[cfg(test)] module). Registering it now
      means the future enforcement task (wiring a real call site into the serving path) lands on
      a row the census already tracks, rather than a rediscovery.
    concernIds:
      - id: C7
        status: partial
        justification: >
          The predicate's OWN logic correctly gates serve-vs-deny by reach when called directly
          in tests — but with zero production call sites, the advertise/serve symmetry it
          computes is never actually enforced on a live request. Quoting this plan's own
          forecast row 1 verbatim: "enforcement will land on a dead predicate and read green
          while serving unauthorized."
      - id: C12
        status: partial
        justification: >
          Structurally verifies requester identity/authentication against the extracted reach
          level when invoked — but is never invoked in the live request path, so no action is
          actually authorized or denied by it today.
      - id: C4
        status: answered
        justification: >
          The no-reach-specified branch is an EXPLICIT, tested, documented "allow (backward
          compat)" default, not a silent one — the gap here is C7/C12 binding (dead code), not
          honesty about absence.
    contractTests:
      - path: doorway/doorway-service/src/cache/reach_aware_serving.rs
        testName: test_should_serve_commons_content_unauthenticated
        kind: unit
      - path: doorway/doorway-service/src/cache/reach_aware_serving.rs
        testName: test_should_not_serve_private_content_to_non_owner
        kind: unit
      - path: doorway/doorway-service/src/cache/reach_aware_serving.rs
        testName: test_should_serve_private_content_to_owner
        kind: unit

  - name: discovery_verdict
    kind: pure-decision-predicate
    sourceLocation:
      file: src/services/discovery.rs
      modulePath: services::discovery::discovery_verdict
      line: 347
    summary: >
      Judges one conductor-discovery attempt as Ready (role map populated — signal readiness
      and STOP retrying) or Retry (back off and try again). The stop condition for the
      boot-order self-heal loop in spawn_discovery_task_with_signal, which retries on a
      bounded-exponential ladder (1s..30s) until the role map is non-empty. Replaces a
      ONE-SHOT attempt that, when the conductor was not yet listening, logged
      "readiness NOT signaled" and EXITED — leaving zome_configs empty for the life of the
      process so every hosted registration failed HTTP 500 AGENT_KEY_ERROR until an operator
      restarted the doorway (reproduced on the local mesh 2026-08-21; same shape as the
      storage-side conductor-bridge fix 77dd6b7b6).
    concernIds:
      - id: C11
        status: answered
        justification: >
          The retry is bounded and self-terminating in both directions: the ladder caps at
          DISCOVERY_RETRY_MAX (the_retry_ladder_is_bounded), and Ready stops the loop so the
          self-heal cannot become its own flap (a_populated_role_map_stops_the_retry_loop).
          A partial discovery is deliberately Retry rather than Ready
          (a_partial_discovery_is_not_ready) — a half-filled role map reproduces the same
          AGENT_KEY_ERROR with a harder-to-read cause.
      - id: C2
        status: n-a
        justification: >
          Discovery reads the conductor's own cell list over the admin interface and maps
          role names to agent keys. It adjudicates no authority and admits no caller; the
          agent keys it records are the conductor's, used to ADDRESS zome calls, never to
          decide who may make one.
    contractTests:
      - path: doorway/doorway-service/src/services/discovery.rs
        testName: a_conductorless_attempt_retries_rather_than_giving_up
        kind: unit
      - path: doorway/doorway-service/src/services/discovery.rs
        testName: a_populated_role_map_stops_the_retry_loop
        kind: unit
      - path: doorway/doorway-service/src/services/discovery.rs
        testName: a_partial_discovery_is_not_ready
        kind: unit
      - path: doorway/doorway-service/src/services/discovery.rs
        testName: the_retry_ladder_is_bounded
        kind: unit
      - path: doorway/doorway-service/src/routes/health.rs
        testName: health_does_not_claim_a_conductor_it_cannot_call
        kind: unit
      - path: doorway/doorway-service/src/routes/health.rs
        testName: serving_probe_503s_while_the_role_map_is_empty
        kind: unit
      - path: doorway/doorway-service/src/routes/health.rs
        testName: a_read_replica_is_never_judged_conductor_blind
        kind: unit

  - name: is_diagnostic_probe
    kind: pure-decision-predicate
    sourceLocation:
      file: src/routes/catching_up.rs
      modulePath: routes::catching_up::is_diagnostic_probe
      line: 162
    summary: >
      Exact-path match for the two read-only diagnostic probes the substrate-trust-contract
      runbook names as the authority (/p2p/status, /db/p2p/conductor-diagnostics). Used by
      storage_proxy::forward_to_storage to make these a PURE PASS-THROUGH: the breaker is
      neither consulted (is_open) nor fed (record), read_class returns None so no freshness
      hook fires, and an upstream 429/503 is relayed with its own status and body rather than
      being re-minted as the doorway's catching-up envelope. The platform must not blind its
      own probes during exactly the incident they exist to explain.
    concernIds:
      - id: C11
        status: answered
        justification: >
          Every doorway-side self-protection path is bounded to NOT apply to these two paths.
          diagnostic_probe_paths (catching_up.rs) pins the exact-path match;
          read_class_is_none_for_diagnostic_probes + a_diagnostic_probe_carries_no_freshness_at_all
          pin the freshness bypass; diagnostic_probe_relays_upstream_503_verbatim
          (storage_proxy.rs) pins that a REAL upstream answer survives the honor-backpressure
          branch intact, and non_diagnostic_read_still_honors_upstream_503 pins that the
          carve-out is scoped to these paths rather than relaxing backpressure generally.
      - id: C2
        status: n-a
        justification: >
          The probes carry no authority decision. Their payloads are either already public via
          the shared bootstrap table (agent infos) or node-local operational state the node
          itself owns (its own connection list) — elohim-storage's handle_conductor_diagnostics
          states that trust model. This predicate only decides whether the doorway is allowed
          to substitute its own answer for storage's, never who may read.
    contractTests:
      - path: doorway/doorway-service/src/routes/catching_up.rs
        testName: diagnostic_probe_paths
        kind: unit
