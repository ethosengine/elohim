  - name: CoherenceVerdict
    kind: boundary-answer-type
    sourceLocation:
      file: src/render/coherence.rs
      modulePath: render::coherence::CoherenceVerdict
    summary: >
      The CoherenceOracle's answer for one head: Coherent, or Incoherent(BehindReason). Its
      `is_permanent()` predicate is what makes the memo asymmetric — a head is content-addressed,
      so a confirmation holds forever, while a missing asset can still be extracted and an
      unreachable peer can return.
    concernIds:
      - id: C5
        status: answered
        justification: >
          The verdict is EVIDENCE about a head, never an authority over it. A confirmation is
          permanent because it is a statement about immutable content-addressed bytes; every
          negative is provisional and re-asked, so an unreachable peer's silence never hardens
          into a permanent judgement about the head.
      - id: C14
        status: answered
        justification: >
          The outcome set closes: anything the oracle cannot positively confirm falls into an
          Incoherent arm carrying a witnessed reason — there is no silent pass-through, which is
          exactly the arm 2026-09-08 lacked.
    contractTests:
      - path: doorway/doorway-service/src/render/coherence.rs
        testName: only_a_confirmation_may_be_memoised_forever
        kind: unit
