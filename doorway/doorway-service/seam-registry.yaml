      - id: C3
        status: answered
        justification: >
          This is the liveness cure, and the defect it closes was a liveness violation in the
          strict sense: no legal move existed from the reachable HalfOpen state. The sibling
          gate `is_open` CONSUMES the one half-open trial, and two `/`-path planners called it
          with no BreakerTrial guard, so no outcome was ever recorded and the circuit re-latched
          on every stale re-admit (2026-08-20, both doorways). would_shed_never_consumes_the_
          half_open_trial proves a planner may ask a hundred times and the guarded caller behind
          it still receives the trial; would_shed_does_not_advance_across_the_cooldown_boundary
          proves the same across the cooldown edge with an injected tick. The raw gate is now
          #[cfg(test)], so a production caller cannot re-enter this state a fourth time
          (fixed 2026-07-21 f5e22baa2, reintroduced 2026-08-18 f0b908660, re-fixed 2026-08-21).
      - id: C7
        status: answered
        justification: >
