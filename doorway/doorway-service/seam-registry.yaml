  # ── Blob-pantry credential-aware stocking (2026-08-24 security fix) ──
  # The blob tier's sibling of `should_stock` above. `ContentCache` is keyed by
  # blob hash ALONE, so anything stocked replays to every later caller — the
  # same identity-blind hazard, one pantry over. Before this predicate the blob
  # pantry stocked on status+size only.
  - name: blob_should_stock
    kind: pure-decision-predicate
    sourceLocation:
      file: src/routes/storage_proxy.rs
      modulePath: routes::storage_proxy::blob_should_stock
      line: 164
    summary: >
      Decides whether one upstream blob response may be kept in the bearer-blind blob pantry:
      200 only, request NOT credentialed (no Authorization header AND no doorway-resolved
      agent_cid), non-empty, within the per-entry ceiling. Every gate is a refusal; there is no
      permissive branch.
    concernIds:
      - id: C12
        status: answered
        justification: >
          This IS the blob-plane consent gate, sibling to freshness `should_stock`. The pantry is
          keyed by blob hash with NO requester component, so anything stocked can be replayed to
          any later caller including an anonymous one. The load-bearing refusal is
          `request_was_credentialed` — a response fetched under an Authorization header OR a
          doorway-resolved X-Agent-Cid is never stocked
          (stock_predicate_refuses_a_credentialed_response, and end-to-end through the real
          forwarder in credentialed_fetch_is_not_stocked). The soundness of stocking an
          un-credentialed 200 rests on the storage-side `blob_reach` gate: storage refuses an
          un-credentialed request for reach-gated bytes, so a 200 answered with no credential is
          storage asserting the bytes are public. The two changes are one cure and ship together.
      - id: C6a
        status: answered
        justification: >
          Bounded by the same per-entry ceiling the pre-existing predicate used
          (`blob_pantry_max_bytes()`), unchanged by this fix: an over-ceiling body is refused
          (stock_predicate_refuses_empty_and_oversized). The predicate adds no new work — it is a
          four-argument boolean evaluated once per fetched blob.
      - id: C7
        status: answered
        justification: >
          The advertise/serve-symmetry class this whole fix is about, on the doorway half. The
          pantry now never holds bytes it could not have served to the caller who filled it under
          an anonymous key, so a later anonymous draw cannot receive what a credentialed fetch
          fetched. The storage-side `blob_reach` decision point carries the same class for the
          byte route itself.
      - id: C8
        status: answered
        justification: >
          A credentialed 200 that is refused stocking increments
          `doorway_blob_pantry_skipped_credentialed` (crate::metrics::inc_blob_pantry), so the
          rate at which the pantry declines to stock a caller-shaped answer is observable rather
          than silent.
      - id: C4
        status: answered
        justification: >
          Refusing to stock keeps the pantry honest about what it holds: a body it may not replay
          is simply never held, and the empty-body refusal drops a zero-length 200 rather than
          replaying it as an answer.
      - id: C6b
        status: answered
        justification: >
          Pure and total over its four arguments; the same inputs always yield the same decision.
          `ContentCache::set` on a repeated key replaces rather than double-counts (existing
          pantry behaviour, unchanged).
      - id: C14
        status: answered
        justification: >
          A boolean with no error arm and no panic path; every `false` is a NAMED refusal in
          source order (non-200, credentialed, empty, oversize), so "why was this not stocked" is
          answerable by the first gate that matched.
      - id: C0
        status: answered
        justification: >
          Cat C / Ephemeral: the blob pantry is a local cache, no DHT entry, no table, no source
          of truth. A restart costs a re-fetch per hash. Passes the swap test — each doorway
          stocks only what it witnessed.
      - id: C1
        status: n-a
        justification: No election and no author identity in any input — a status, a bool, two lengths.
      - id: C2
        status: n-a
        justification: Nothing ordered or arbitrated; a later stock replaces the earlier entry (cache semantics).
      - id: C3
        status: n-a
        justification: A total pure predicate, no reachable non-terminal state.
      - id: C5
        status: n-a
        justification: >
          The blob address IS content-derived (the hash is the key and the bytes verify against
          it by construction), so there is no separate claimed-address to re-derive at this gate.
      - id: C9
        status: n-a
        justification: >
          The pantry is identity-BLIND by design, which is exactly why the credentialed refusal
          is absolute — the store cannot scope an entry to a person, so it must only hold bytes
          that need no scoping.
      - id: C10
        status: answered
        justification: >
          Unlike freshness `should_stock`, this predicate matches NO reach vocabulary — it reads
          only "was the request credentialed", a doorway-local fact independent of the reach enum
          drift. So the C10 partial that row carries does not apply here.
      - id: C11
        status: n-a
        justification: >
          Backpressure (429/503) is handled on the forward path above this predicate and is never
          a 200, so it never reaches the stock decision.
      - id: C13
        status: n-a
        justification: >
          No graduated-authority tiering in the stock decision itself; the reach grading lives on
          the storage-side `blob_reach` gate that makes the un-credentialed-200-is-public
          inference sound.
    contractTests:
      - path: doorway/doorway-service/src/routes/storage_proxy.rs
        testName: stock_predicate_refuses_a_credentialed_response
        kind: unit
        mirrorRisk: false
      - path: doorway/doorway-service/src/routes/storage_proxy.rs
        testName: stock_predicate_accepts_an_anonymous_public_200
        kind: unit
      - path: doorway/doorway-service/src/routes/storage_proxy.rs
        testName: stock_predicate_refuses_non_200
        kind: unit
      - path: doorway/doorway-service/src/routes/storage_proxy.rs
        testName: stock_predicate_refuses_empty_and_oversized
        kind: unit
      - path: doorway/doorway-service/src/routes/storage_proxy.rs
        testName: credentialed_fetch_is_not_stocked
        kind: unit
        mirrorRisk: false
      - path: doorway/doorway-service/src/routes/storage_proxy.rs
        testName: pantry_hit_carries_nosniff
        kind: unit
    notes: >
      WHY CREDENTIAL-PRESENCE, NOT A RESPONSE REACH HEADER. The blob response carries no reach
      marker (reach lives on the content row; `PUT /blob` stamps manifests "commons"
      unconditionally), so unlike freshness `should_stock` this gate cannot read reach from the
      body. It does not need to: with the storage-side `blob_reach` gate in place, an
      un-credentialed 200 is storage asserting public reach. Deliberately NOT a reach header —
      putting the audience decision on the wire would let a compromised upstream widen it;
      "did this caller present anything?" is answerable from the doorway's own state.

  - name: require_seed_authority
    kind: pure-decision-predicate
    sourceLocation:
      file: src/routes/seed.rs
      modulePath: routes::seed::require_seed_authority
      line: 56
    summary: >
      Gates PUT /admin/seed/blob and the four /admin/cache/* mutation routes. Admits a caller
      three ways: an on-the-box (loopback socket peer) caller or the fleet's declared seed
      authority (API_KEY_SEED) while the DECLARED stage is pre-coordination, or this doorway's
      own operator identity (Admin JWT / API_KEY_ADMIN) at any stage. Refuses 401 when nothing
      resolved above Public and 403 when a real identity resolved below Admin.
    notes: >
      Registered 2026-08-25 when the predicate stopped deriving from DEV_MODE. It now keys on
      AppState::network_stage (ELOHIM_NETWORK_STAKES, resolved once at boot, fail-closed to
      Bootstrap) — the same seam_contracts::freshness::NetworkStage elohim-storage declares in
      trust/stage.rs, whose type doc names THIS crate's config.rs as a flag a stage must never
      derive from. Canon home for the whole posture:
      genesis/docs/content/elohim-protocol/architecture/2026-08-25-doorway-auth-posture-declared-stage.md.
      The helper fleet_seed_authority_presented (same file) is deliberately NOT a separate
      decision point: it is a credential comparison feeding this predicate's arm (2), with no
      outcome of its own.
    concernIds:
      - id: C0
        status: answered
        justification: >
          Plane named explicitly: this is the web2 projection plane (a deploy pipeline pushing
          SPA bytes to a DNS-fronted host), NOT the notary or head plane. The distinction is
          load-bearing here — the sibling canonical-head declare route is on the head plane and
          is deliberately NOT gated by this predicate, which is filed as a gap rather than
          silently unified.
      - id: C1
        status: answered
        justification: >
          The doorway no longer crowns its own authority. DEV_MODE was self-election in the
          literal sense — a flag the deployment sets about itself, true on every deployed
          manifest, granting the gate away. Both remaining pre-coordination affordances now
          require something the doorway cannot assert about itself: a kernel-observed loopback
          peer address (never X-Forwarded-For), or an operator-declared key.
      - id: C4
        status: answered
        justification: >
          Three absences stay distinct. 401 (nothing resolved above Public) is separated from
          403 (a real identity resolved below Admin). An UNDECLARED seed key yields NO authority
          rather than an empty one an empty header would match — pinned by
          an_undeclared_fleet_seed_key_admits_nobody and
          a_blank_fleet_seed_key_is_not_an_authority, the latter existing precisely because
          Some("") is a different fact from None.
      - id: C12
        status: partial
        justification: >
          Authority IS verified structurally at the acting node — constant-time credential
          comparison, socket-derived peer address, signed-JWT level — and
          fleet_seed_key_never_grants_general_admin pins that the fleet key cannot climb the
          permission ladder, so it is strictly narrower than the Admin identity it replaces on
          this path. PARTIAL because a standing bearer secret is not a structurally verified
          authority in the peer-native sense: it proves possession, not a bounded, revocable
          grant. The successor that closes this is named in C13.
      - id: C13
        status: answered
        justification: >
          The scaffold names its successor AT THE GATE, and expires by itself rather than by
          being remembered: both pre-coordination affordances switch off once a doorway declares
          `coordinated` (pinned by
          coordinated_stage_retires_both_pre_coordination_affordances, with
          admin_identity_still_seeds_at_coordinated_stage pinning that identity is
          stage-independent). The gate comment and the canon doc name the successors in reach
          order — chaperoned seed actor (doorway-seed-ensure.sh already does this for genesis),
          then the delegates-compute Mishpat::Commitment already shadow-running behind
          DELEGATES_COMPUTE_OP_GATE, then self-authorizing bytes where a notarized head plus
          content addressing IS the authority.
      - id: C8
        status: unbound
        justification: >
          No labeled counter is incremented per outcome. A refusal is observable only as an HTTP
          status in a caller's log, which is exactly how the apex spent app #1672 and #1673
          stale without anything on the doorway side naming the cause. The four arms
          (loopback-admitted, fleet-key-admitted, identity-admitted, refused-with-reason) are
          already typed by construction, so binding a counter is additive.
    gapNote: >
      C8 unbound — the four outcome arms are typed but uncounted; a refusal names its cause to
      the caller and to nothing else. C12 partial until the delegates-compute successor named in
      C13 replaces the standing key. Neither is a defect in this predicate's logic; both are
      binding gaps, declared rather than papered over.
    contractTests:
      - path: doorway/doorway-service/src/routes/seed.rs
