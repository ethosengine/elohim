  - name: should_serve_response
    kind: pure-decision-predicate
    sourceLocation:
      file: src/cache/reach_aware_serving.rs
      modulePath: cache::reach_aware_serving::should_serve_response
      line: 50
    summary: >
      Gates serving cached response bytes by extracted reach level, requester authentication,
      and requester identity (for private reach). No reach specified -> allow (documented
      backward-compat default).
    notes: >
      This IS the fail-open no-reach branch named in this plan's own seeded forecast row 1
      (reach-enforced-everywhere x doorway egress): re-exported from cache/mod.rs but with ZERO
      production call sites anywhere in this crate (grep-verified 2026-08-02 — the only
      references are the re-export and this file's own #[cfg(test)] module). Registering it now
      means the future enforcement task (wiring a real call site into the serving path) lands on
      a row the census already tracks, rather than a rediscovery.
    concernIds:
      - id: C7
        status: partial
        justification: >
          The predicate's OWN logic correctly gates serve-vs-deny by reach when called directly
          in tests — but with zero production call sites, the advertise/serve symmetry it
          computes is never actually enforced on a live request. Quoting this plan's own
          forecast row 1 verbatim: "enforcement will land on a dead predicate and read green
          while serving unauthorized."
      - id: C12
        status: partial
        justification: >
          Structurally verifies requester identity/authentication against the extracted reach
          level when invoked — but is never invoked in the live request path, so no action is
          actually authorized or denied by it today.
      - id: C4
        status: answered
        justification: >
          The no-reach-specified branch is an EXPLICIT, tested, documented "allow (backward
          compat)" default, not a silent one — the gap here is C7/C12 binding (dead code), not
          honesty about absence.
    contractTests:
      - path: doorway/doorway-service/src/cache/reach_aware_serving.rs
        testName: test_should_serve_commons_content_unauthenticated
        kind: unit
      - path: doorway/doorway-service/src/cache/reach_aware_serving.rs
        testName: test_should_not_serve_private_content_to_non_owner
        kind: unit
      - path: doorway/doorway-service/src/cache/reach_aware_serving.rs
        testName: test_should_serve_private_content_to_owner
        kind: unit

  - name: is_head_declare_write
    kind: pure-decision-predicate
    sourceLocation:
      file: src/routes/catching_up.rs
      modulePath: routes::catching_up::is_head_declare_write
      line: 154
    summary: >
      Exact-shape match for the notary HEAD-declare write (POST /db/content/{id}/head),
      mirroring elohim-storage's own is_head_declare_write byte-for-byte (excludes
      /head-record and /canonical-head). Used by storage_proxy::forward_to_storage to carve
      this one route out of the per-upstream circuit breaker's "shed without calling storage"
      branch — a confirmed-open breaker (accumulated failures while a peer is catching up) no
      longer blind-sheds this route; the call always reaches storage so its own auth-first
      ordering (elohim-storage ab316cad7) can refuse a non-author 401/403 instead of the
      refusal being masked behind an opaque doorway-side 503.
    concernIds:
      - id: C11
        status: answered
        justification: >
          Externally-imposed backpressure (the breaker's circuit-open shed) is bounded to NOT
          apply to this route: is_head_declare_write_matches_post_head +
          is_head_declare_write_excludes_* (catching_up.rs) pin the exact-shape match, and
          head_declare_write_bypasses_open_breaker_and_reaches_storage (storage_proxy.rs) pins
          that a call is still attempted when the breaker is open.
      - id: C2
        status: n-a
        justification: >
          Doorway carries no authority logic of its own (route registry auth_required is
          declared but unenforced — genesis/data/timeline/backlog/
          doorway-auth-required-metadata-unenforced.md). This predicate only ensures the
          request reaches the place monotonic authority IS decided (elohim-storage's
          handle_content_head auth-first block); it does not itself adjudicate authorship.
    contractTests:
      - path: doorway/doorway-service/src/routes/catching_up.rs
        testName: head_declare_write_matches_post_head
        kind: unit
      - path: doorway/doorway-service/src/routes/catching_up.rs
        testName: head_declare_write_excludes_get
        kind: unit
      - path: doorway/doorway-service/src/routes/catching_up.rs
        testName: head_declare_write_excludes_head_record
        kind: unit
      - path: doorway/doorway-service/src/routes/catching_up.rs
        testName: head_declare_write_excludes_canonical_head
        kind: unit
      - path: doorway/doorway-service/src/routes/catching_up.rs
        testName: head_declare_write_excludes_unrelated_write_route
        kind: unit
      - path: doorway/doorway-service/src/routes/storage_proxy.rs
        testName: head_declare_write_bypasses_open_breaker_and_reaches_storage
        kind: unit
      - path: doorway/doorway-service/src/routes/storage_proxy.rs
        testName: content_get_still_shed_when_breaker_open
        kind: unit

  - name: install_steward_routes
    kind: state-transition
    sourceLocation:
      file: src/services/route_registry.rs
      modulePath: services::route_registry::RouteRegistry::install_steward_routes
      line: 705
    summary: >
      Installs a steward peer's manifest-compiled routes into the registry,
      REPLACING that peer's previous routes (idempotent per storage_url). This
      is the primitive that makes the boot-time retry-until-registered loop in
      main.rs safe: the previous append-only install meant any re-registration
      duplicated routes, so registration had to be boot-once — and a storage
      peer that was down at doorway boot left the registry empty until an
      operator restarted doorway (reproduced 2026-08-16 on the local mesh:
      registered:0/3, totalRoutes 0, every /db/* 404).
    concernIds:
      - id: C4
        status: answered
        justification: >
          test_install_steward_routes_is_idempotent_per_peer proves re-install
          replaces rather than duplicates, and that one peer's re-install never
          disturbs another peer's routes — so repeated registration (retry loop,
          future periodic manifest refresh) converges instead of accreting.
    contractTests:
      - path: doorway/doorway-service/src/services/route_registry.rs
        testName: test_install_steward_routes_is_idempotent_per_peer
        kind: unit

  - name: ProxyOutcome::classify
    kind: pure-decision-predicate
    sourceLocation:
      file: src/routes/storage_proxy.rs
      modulePath: routes::storage_proxy::ProxyOutcome::classify
      line: 59
    summary: >
      Classifies an upstream HTTP status for breaker accounting: 2xx Ok, 4xx
      (incl. 404 blob miss) Neutral, 429/503 Neutral (honored backpressure —
      a LIVE upstream's flow control must not open the liveness breaker; the
      pre-2026-08-16 Failure mapping amplified every storage catching-up
      window into a full doorway shed), 500/502/504 Failure. Transport
      errors/timeouts are recorded as failures at the call sites' Err arms —
      the breaker protects against dead/hanging upstreams only. Mirrors the
      storage-side conductor error classifier (f76378b2e): busy is a signal,
      never-answered trips the circuit.
    concernIds:
      - id: C4
        status: answered
        justification: >
          proxy_outcome_classifies_failures pins every class boundary,
          including that backpressure statuses are Neutral (with the
          amplification rationale in the assertion messages) and that
          502/504 remain Failure.
    contractTests:
      - path: doorway/doorway-service/src/routes/storage_proxy.rs
        testName: proxy_outcome_classifies_failures
        kind: unit

  - name: decide_shell_serve
    kind: pure-decision-predicate
    sourceLocation:
      file: src/render/warm_shell.rs
      modulePath: render::warm_shell::decide_shell_serve
      line: 205
    summary: >
      The warm-boot shell cache's hot-path decision (Task 3.4): given how the cached shell
      relates to the locally-declared head (AtHead / Behind / Cold) and whether the storage
      upstream can answer at all, choose ServeWarm (no upstream read), UpgradeThenWarm (bounded
      re-read, fall back to what we hold), Fetch (cold but answerable), or Shed (cold and
      unanswerable — the existing 503 catching-up contract, immediately). The load-bearing arm
      is (AtHead, _) -> ServeWarm: a warm shell NEVER pays a per-request upstream fetch, which
      is what stops `/` riding a doomed 10s stall through a post-deploy catch-up window.
    concernIds:
      - id: C4
        status: answered
        justification: >
          "we hold nothing and cannot ask" (Shed) is classified distinctly from "we hold
          something one-behind" (ServeWarm/UpgradeThenWarm) and from "we hold nothing but can
          ask" (Fetch) — an unreachable upstream never reads as an absent shell, and a
          one-behind shell never reads as a confirmed head.
      - id: C6a
        status: answered
        justification: >
          Each fetching arm declares its budget through FetchBudget — Upgrade gets
          SHELL_UPGRADE_TIMEOUT_SECS because it already holds a serviceable answer, Full gets
          EPR_DISPATCH_TIMEOUT_SECS because nothing else can be served. Pinned by
          an_upgrade_fetch_gets_the_tight_budget_a_cold_fetch_gets_the_full_one.
      - id: C8
        status: partial
        justification: >
          Every arm is typed and logged (tracing at the two http.rs serve sites, plus the
          x-elohim-bundle wire marker), but no labeled counter increments per arm yet — a
          warm-serve rate is not currently countable in Prometheus.
    contractTests:
      - path: doorway/doorway-service/src/render/warm_shell.rs
        testName: shell_serve_decision_matrix_is_cache_first
        kind: unit
      - path: doorway/doorway-service/src/render/warm_shell.rs
        testName: upstream_unavailable_with_a_cold_cache_sheds_immediately
        kind: unit
      - path: doorway/doorway-service/src/render/warm_shell.rs
        testName: an_upgrade_fetch_gets_the_tight_budget_a_cold_fetch_gets_the_full_one
        kind: unit

  - name: ShellOutcome
    kind: boundary-answer-type
    sourceLocation:
      file: src/render/warm_shell.rs
      modulePath: render::warm_shell::ShellOutcome
      line: 240
    summary: >
      Warm(WarmShell) / Fresh(WarmShell) / Unavailable — the terminal answer of resolve_shell,
      consumed by http.rs to choose between a composed SSR serve, a warm bundle serve, and the
      existing catching-up shed.
    concernIds:
      - id: C4
        status: answered
        justification: >
          Warm (served without asking) and Fresh (served after the upstream answered) are
          distinct answers, and Unavailable is neither — the caller can never mistake a
          cache-served shell for a confirmed head.
      - id: C11
        status: partial
        justification: >
          The breaker-open (backpressure) path degrades by a DECLARED policy — serve the last
          reconciled bundle, or shed immediately — but the degradation is not yet counted;
          only the pre-existing breaker/admission counters observe it.
    contractTests:
      - path: doorway/doorway-service/src/render/warm_shell.rs
