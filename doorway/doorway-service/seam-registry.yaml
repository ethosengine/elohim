  - name: websocket::extract_permission
    kind: verdict-fn
    sourceLocation:
      file: src/server/websocket.rs
      modulePath: server::websocket::extract_permission
      line: 424
    summary: >
      The conductor-socket permission ladder, and now the SINGLE authorization decision for the
      Holochain admin WebSocket: a valid bearer JWT (query ?token= or Authorization), then a
      presented X-API-Key, then the native-local-first grant (native_local_first_operator) —
      otherwise Err, which handle_admin_upgrade renders as 401 naming POST /hc/connect. Unlike
      the HTTP ladder it REFUSES rather than falling through to Public, because the conductor
      admin interface has no meaningful anonymous surface.
    notes: >
      Registered 2026-08-27 when it stopped deriving from DEV_MODE. Two credential-free arms had
      to close together: the `dev_mode` fallthrough, and a `|| !api_validator.is_configured()`
      disjunct that returned Ok(Public) to a caller presenting nothing whenever no API keys were
      configured — the devspace/mesh shape, and live even with dev_mode off. Because DEV_MODE is
      "true" on all five deployed manifests, the route gate (http.rs /hc/admin), this ladder, and
      proxy/{admin,pool,nats}.rs message filtering were ALL ungated, so an anonymous caller from
      the open internet reached an UNFILTERED conductor admin socket. The route gate and the
      proxy passthrough were deleted; this function is now the only decision point, and proxy
      filtering is unconditional defence in depth. Canon:
      genesis/docs/content/elohim-protocol/architecture/2026-08-25-doorway-auth-posture-declared-stage.md.
    concernIds:
      - id: C0
        status: answered
        justification: >
          Conductor-socket plane only — the substrate admin interface, distinct from the web2
          HTTP ladder (auth::http_permission::extract_http_permission). The two are deliberately
          NOT unified: this one refuses on absence, that one floors to Public, because their
          downstream surfaces differ. The JWT here is a browser SESSION carrier over a
          DHT-authoritative agent key, never the identity itself.
      - id: C1
        status: answered
        justification: >
          No self-election. native_local_first_operator requires a kernel-observed loopback peer
          (never X-Forwarded-For) AND a pre-coordination declared stage AND the ABSENCE of a
          configured JWT_SECRET. The last conjunct is what a deployment cannot fake: all five
          deployed manifests populate JWT_SECRET from a secretKeyRef, so none can claim to be a
          developer's box. The replaced arm was a self-asserted flag, true everywhere.
      - id: C2
        status: answered
        justification: >
          Monotonic: stronger credentials short-circuit first. The grant is Admin, which is
          higher than the HTTP ladder's Authenticated and deliberately so — on your own box,
          with no identity system, you ARE that conductor's operator — but it is unreachable
          off-box, and every frame is still filtered by is_operation_allowed downstream.
      - id: C4
        status: answered
        justification: >
          Absence is refusal, not a floor. An invalid or forged token falls THROUGH to the
          refusal rather than erroring differently, so a forged credential is worth exactly what
          no credential is worth. An unparseable admin frame is likewise never forwarded
          (FilterResult::PassThrough denies): an operation we cannot name is one we cannot
          authorize.
      - id: C13
        status: answered
        justification: >
          The affordance expires by itself in two independent ways, neither needing a flag
          unset: declaring `coordinated`, or configuring a JWT_SECRET. Giving the workspace its
          own doorway identity is therefore the same act as retiring its local-first grant.
          Successor is the chaperone (POST /hc/connect), already built.
      - id: C12
        status: partial
        justification: >
          Same standing-secret limit as the HTTP ladder: a bearer JWT and an API key are
          verified structurally at the acting node, and the loopback conjunct by the kernel, but
          possession of a standing secret is not a bounded, revocable grant. The delegates-compute
          Mishpat::Commitment is the named successor.
      - id: C8
        status: unbound
        justification: >
          No labeled counter per outcome arm. The local-first grant logs at info and refusals at
          warn, so "how often is an anonymous conductor-socket attempt refused" is answerable
          only from logs. Arms are typed by construction, so binding a counter is additive.
    gapNote: >
      C8 unbound — arms typed but uncounted. C12 partial until delegates-compute replaces
      standing secrets. Separately declared: handle_app_upgrade (/hc/app/{port}) performs NO
      doorway-side permission check at all, relying on the conductor's own app-interface
      authentication; that is a different surface from this one and is NOT closed by this row.
    contractTests:
      - path: doorway/doorway-service/src/server/websocket.rs
        testName: native_local_first_requires_all_three_conjuncts
        kind: unit
        mirrorRisk: false
      - path: doorway/doorway-service/src/server/websocket.rs
        testName: the_grant_does_not_depend_on_dev_mode
        kind: unit
      - path: doorway/doorway-service/src/server/websocket.rs
        testName: anonymous_remote_caller_is_refused_even_with_dev_mode
        kind: unit
      - path: doorway/doorway-service/src/server/websocket.rs
        testName: anonymous_loopback_on_a_declared_doorway_is_refused
        kind: unit
      - path: doorway/doorway-service/src/server/websocket.rs
        testName: anonymous_loopback_on_a_bare_dev_box_is_the_conductor_operator
        kind: unit
      - path: doorway/doorway-service/src/server/websocket.rs
        testName: a_keyless_doorway_no_longer_grants_public_to_a_remote_anonymous_caller
        kind: unit

  - name: extract_http_permission
    kind: verdict-fn
    sourceLocation:
      file: src/auth/http_permission.rs
      modulePath: auth::http_permission::extract_http_permission
      line: 30
    summary: >
      The shared HTTP permission ladder: resolves what level a request carries, in order — a
      valid bearer JWT, an X-API-Key, then an on-the-box (loopback socket peer) caller while the
      DECLARED stage is pre-coordination — falling through to Public. Returns a level, never an
      Err; the caller decides whether Public suffices. Its two consumers are the elohim-agent
      invocation gate (the crate's ONLY Authenticated gate) and require_seed_authority's arm (3).
    notes: >
      Registered 2026-08-25 when the final fallthrough stopped deriving from DEV_MODE — the same
      birth-rule reason require_seed_authority was registered: the predicate changed what it
      decides on. DEV_MODE is "true" on every deployed manifest, so the old arm promoted EVERY
      anonymous caller on the open web to Authenticated. It now keys on AppState::network_stage
      conjoined with a kernel-observed loopback peer, mirroring authority (1) of
      require_seed_authority. Canon:
      genesis/docs/content/elohim-protocol/architecture/2026-08-25-doorway-auth-posture-declared-stage.md.
      validate_jwt_token (same file) is deliberately NOT a separate decision point: it is a
      signature check feeding this function's first arm, with no outcome of its own.
    concernIds:
      - id: C0
        status: answered
        justification: >
          Web2 projection plane only. This ladder answers what a BROWSER-shaped caller carries;
          it is not the notary or head plane, and it is not the WebSocket ladder
          (server/websocket.rs::extract_permission), which is a separate function with its own
          fallthrough and is deliberately left untouched here rather than silently unified.
      - id: C1
        status: answered
        justification: >
          No self-election. The removed arm was a flag the deployment set about itself, true
          everywhere, granting a permission level away. The replacement requires a peer address
          taken from the ACCEPTED SOCKET — a fact the caller cannot assert and the doorway
          cannot fake on its own behalf — never X-Forwarded-For.
      - id: C4
        status: answered
        justification: >
          Absence stays absence: an unresolved caller yields Public, the floor, rather than a
          borrowed identity. An invalid or unparseable bearer token falls THROUGH rather than
          erroring, so a forged credential is worth exactly what no credential is worth —
          pinned by invalid_bearer_non_dev_is_public.
      - id: C2
        status: answered
        justification: >
          The ladder is monotonic in the authority it will honour: a stronger credential is
          checked first and short-circuits, and the pre-coordination arm can only ever yield
          Authenticated, never Admin. PermissionLevel derives Ord over explicit discriminants
          (Public=0 < Authenticated=1 < Admin=2), so Public is STRICTLY refused at an
          Authenticated gate rather than silently passing.
      - id: C13
        status: answered
        justification: >
          The affordance expires by itself: declaring `coordinated` retires the on-the-box arm
          with no flag to unset, pinned by coordinated_stage_retires_the_loopback_grant. Its
          successor is the same one require_seed_authority names — a real identity (chaperoned
          actor, then a delegates-compute Mishpat::Commitment) rather than a positional
          affordance.
      - id: C12
        status: partial
        justification: >
          A bearer JWT and an API key are verified structurally (signature / constant-time
          compare) at the acting node, and the loopback arm is verified by the kernel. PARTIAL
          for the same reason as require_seed_authority: possession of a standing secret is not
          a bounded, revocable grant in the peer-native sense.
      - id: C8
        status: unbound
        justification: >
          No labeled counter per outcome arm. A promotion to Authenticated logs at info; a
          fallthrough to Public is silent, so "how often does a remote anonymous caller get
          refused downstream" is answerable only from a consumer's HTTP status. The arms are
          typed by construction, so binding a counter is additive.
    gapNote: >
      C8 unbound — the arms are typed but uncounted. C12 partial until the delegates-compute
      successor replaces standing secrets. Neither is a defect in this function's logic; both
      are binding gaps, declared rather than papered over.
    contractTests:
      - path: doorway/doorway-service/src/auth/http_permission.rs
        testName: remote_anonymous_is_public_even_with_dev_mode
        kind: unit
        mirrorRisk: false
      - path: doorway/doorway-service/src/auth/http_permission.rs
        testName: loopback_anonymous_pre_coordination_is_authenticated
        kind: unit
      - path: doorway/doorway-service/src/auth/http_permission.rs
        testName: loopback_grant_does_not_depend_on_dev_mode
        kind: unit
      - path: doorway/doorway-service/src/auth/http_permission.rs
        testName: coordinated_stage_retires_the_loopback_grant
        kind: unit
      - path: doorway/doorway-service/src/auth/http_permission.rs
        testName: no_auth_non_dev_is_public
        kind: unit
      - path: doorway/doorway-service/src/auth/http_permission.rs
        testName: invalid_bearer_non_dev_is_public
        kind: unit
      - path: doorway/doorway-service/src/auth/http_permission.rs
        testName: admin_jwt_resolves_admin
        kind: unit
      - path: doorway/doorway-service/src/auth/http_permission.rs
        testName: authenticated_jwt_resolves_authenticated
        kind: unit

  # Registered at birth 2026-08-28 per the seam birth rule: a new route may not
  # be born unregistered. Two placement decisions carry its security properties —
  # see `notes`.
  - name: handle_auth_discovery
    kind: boundary-answer-type
    sourceLocation:
      file: src/routes/auth_discovery.rs
      modulePath: routes::auth_discovery::handle_auth_discovery
      line: 101
    summary: >
      GET /.well-known/elohim-auth — the unauthenticated document an app reads INSTEAD of
      carrying auth configuration. Answers two things from the origin a page was already
      served from: the sign-in portal, and the endpoints it talks to afterwards (including
      session-token/exchange-session, the cross-app handoff pair a client cannot invent).
      Every value is an origin-RELATIVE path.
    notes: >
      (1) `/.well-known/` rather than `/auth/config`: AUTH_OWNED_PATHS is exact-match, so an
      unowned `/auth/*` path falls through to the EPR router and answers 200 text/html with
      the SPA shell — measured — handing a client a JSON parse error instead of a branchable
      absence. `/.well-known/` is already in `is_service_path`, so an unknown path there 404s
      honestly; fail-open here is worse than absence. (2) Relative paths only: a discovery
      document that could name another origin is an open-redirect primitive, and this one
      cannot express one. `portalHostUrl` is deliberately excluded — per-human session state
      that must be attested in that human's own record, not advertised publicly. The client
      half of this class is live and filed in
      genesis/data/timeline/backlog/security-client-doorway-origin-synthesis-credential-exfil.md
      The honest-absence behaviour is additionally covered end-to-end by the a2o scenario "An
      unknown well-known path is refused rather than answered with the app shell"
      (genesis/a2o/features/auth/auth-discovery.feature); it is not listed under contractTests
      because that schema field takes an identifier, not a scenario title.
    concernIds:
      - id: C0
        status: answered
        justification: >
          Web2 projection plane. It describes THIS doorway's own HTTP auth surface and nothing
          about the notary or head plane. Configuration discovery, not substrate truth — no DHT
          read, no entity.
      - id: C4
        status: answered
        justification: >
          Honest absence is the whole reason for the path choice. An unknown `/.well-known/*`
          path 404s rather than being answered with the app shell, so a client can branch on
          absence instead of failing to parse HTML. Pinned by the a2o scenario "An unknown
          well-known path is refused rather than answered with the app shell".
      - id: C6a
        status: answered
        justification: >
          Bounded by construction: a pure serialization of compile-time constants plus one
          Option<String> clone. No I/O, no conductor call, nothing that scales.
      - id: C7
        status: answered
        justification: >
          Advertise/serve symmetry is the live risk here — every path it advertises is an exact
          entry in AUTH_OWNED_PATHS, so advertising a route that answers with the SPA shell
          would BE the defect. No longer hand-synced residue: `every_advertised_endpoint_is_an_owned_auth_path`
          asserts `AuthEndpoints::current()` is a subset of AUTH_OWNED_PATHS at `cargo test`, and the a2o
          scenario re-checks it against a running doorway by content type. Detector-controlled — injecting an
          unowned path fails the guard by name.
      - id: C12
        status: answered
        justification: >
          Unauthenticated BY DESIGN: it names public endpoints and no secrets, and a human who
          cannot yet authenticate is exactly who needs to read it. The authorization question it
          does carry — can this document redirect anyone anywhere — is answered structurally:
          relative paths only, so no foreign origin is expressible.
      - id: C2
        status: n-a
        justification: >
          Establishes no authority ordering; it is a read-only description of endpoints.
      - id: C5
        status: partial
        justification: >
          The document is evidence-shaped but UNSIGNED, so it is self-asserted by whoever answers
          the DNS name. The Ed25519 key is already published at /.well-known/doorway-keys
          (routes/federation.rs:173); signing the body and verifying against that JWKS is what
          closes a MITM or stale-DNS rewrite. The relative-path constraint bounds the damage — a
          rewritten document still cannot name another origin — but does not eliminate it.
      - id: C8
        status: partial
        justification: >
          Un-metered: no counter distinguishes a client that found the document from one that
          fell back. Deliberate while it has no in-tree consumer — a meter with no reader is the
          instrument-with-no-reader anti-pattern. Wire it when the client module lands.
    contractTests:
      - path: doorway/doorway-service/src/routes/auth_discovery.rs
        testName: every_advertised_location_is_origin_relative
        kind: unit
      - path: doorway/doorway-service/src/routes/auth_discovery.rs
        testName: the_relative_location_guard_catches_an_escaping_document
        kind: unit
      - path: doorway/doorway-service/src/server/http.rs
        testName: every_advertised_endpoint_is_an_owned_auth_path
        kind: unit
      - path: doorway/doorway-service/tests/schema_contract.rs
        testName: auth_discovery_schema_refuses_a_foreign_origin
        kind: integration
      - path: doorway/doorway-service/src/routes/auth_discovery.rs
        testName: the_document_carries_the_endpoints_a_client_cannot_guess
        kind: unit

  - name: judge_coherence
    kind: verdict-fn
    sourceLocation:
      file: src/render/warm_shell.rs
      modulePath: render::warm_shell::WarmShellStore::judge_coherence
    summary: >
      The second proof behind AtHead (2026-09-08): is the head this doorway is about to serve as
      current actually DELIVERABLE through this doorway? Returns None (nothing here says
      otherwise) or Some(BehindReason). Consults a per-head memo first, asks the CoherenceOracle
      only on a miss with a readable upstream, and never probes a peer already judged unable to
      answer. A store with no oracle returns None — byte-for-byte the 2026-09-04 behaviour, so
      an unwired doorway is never worse than today.
    concernIds:
      - id: C4
        status: answered
        justification: >
          "the head cannot boot" (MissingAsset), "there is no head to judge" (HeadUnknown), "the
          bytes are not proof of the head" (StaleProjection) and "we could not ask" 
          (StorageUnreachable) are four DISTINCT answers, none of which reads as confirmed.
          a_never_confirmed_head_with_a_dark_upstream_is_behind_storage_unreachable and
          an_unreachable_upstream_cannot_un_prove_a_confirmed_head pin the two halves: an
          unreachable peer is honest absence, and it can never un-prove what it already proved.
      - id: C6a
        status: answered
        justification: >
          Bounded on both axes: COHERENCE_PROBE_TIMEOUT_SECS (2s) per probe, and the asymmetric
          memo caps a confirmed head at ONE probe for the life of the pod
          (a_confirmed_head_costs_exactly_one_probe_ever) while a negative verdict stands for
          COHERENCE_RECHECK_SECS before it is re-asked — so an incoherent head can never buy a
          probe per request.
      - id: C8
        status: partial
        justification: >
          Every non-confirmed arm is logged with its bounded reason CLASS and rides the wire as
          `x-elohim-bundle: behind;<reason>`, so it is observable per request. No labeled
          Prometheus counter increments per arm yet — the same gap decide_shell_serve carries.
    contractTests:
      - path: doorway/doorway-service/src/render/warm_shell.rs
        testName: a_head_whose_entry_script_is_missing_is_never_at_head
        kind: unit
      - path: doorway/doorway-service/src/render/warm_shell.rs
