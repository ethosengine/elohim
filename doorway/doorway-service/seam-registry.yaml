        kind: unit
      - path: doorway/doorway-service/src/conductor/registry.rs
        testName: distinct_agents_partitions_by_conductor
        kind: unit
      - path: doorway/doorway-service/src/conductor/registry.rs
        testName: distinct_agents_handles_empty_and_default_app_id_rows
        kind: unit
