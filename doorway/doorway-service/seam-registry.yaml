  - name: close_account_row_update
    kind: state-transition
    sourceLocation:
      file: src/routes/auth_routes.rs
      modulePath: routes::auth_routes::close_account_row_update
      line: 367
    summary: >
      The $set that ENDS a credential row: is_active false, metadata.is_deleted true,
      closed_at stamped, the hosting promise nulled — and (Task 17c) the LIVE identifier
      RELEASED to a tombstone while `closed_identifier` keeps the name the human used. Its
      registrable claim is the shape of the effect — a settled terminal state written by
      assignment, never an accreting log — so a repeated close converges on the same row
      rather than double-applying. The release is what makes "a closed row is not an
      account" true of the unique index and not merely of a filter: without it, registering
      a closed identifier again passes the duplicate check (MongoCollection::find_one
      already excludes soft-deleted rows) and then dies E11000 at insert, AFTER a
      hosted-cell grant has been notarized for an agent whose row never lands.
    concernIds:
      - id: C6b
        status: answered
        justification: >
          closed_row_cannot_log_in reads the update document itself and pins the three
          terminal fields. Every field is an assignment to a fixed value, so replaying the
          update against an already-closed row is a no-op on the row's meaning.
      - id: C2
        status: answered
        justification: >
          a_closed_identifier_is_released_so_it_can_be_registered_again pins that the
          released handle is derived from the caller-supplied close instant, so the update
          document is a pure function of its inputs rather than of the writing process.
      - id: C9
        status: partial
        justification: >
          closed_at is stamped distinctly from metadata.deleted_at so "I left" and "I was
          removed by an operator" stay separable in the record. What the closure does NOT yet
          do is carry that distinction onto the substrate as lineage; the notarized
          account-closed self-revocation (S2 Task 13) is the successor that does.
    contractTests:
      - path: doorway/doorway-service/src/routes/auth_routes.rs
        testName: closed_row_cannot_log_in
        kind: unit
      - path: doorway/doorway-service/src/routes/auth_routes.rs
        testName: a_closed_identifier_is_released_so_it_can_be_registered_again
        kind: unit

