    kind: pure-decision-predicate
    sourceLocation:
      file: src/conductor/agent_key.rs
      modulePath: conductor::agent_key::normalize_agent_key
      line: 89
    summary: >
      Maps any recognizable encoding of a 39-byte Holochain agent key onto the canonical
      HoloHash multibase form (`u` + base64url-nopad, i.e. `uhCAk…`), and passes anything it
      does not recognize through byte-for-byte. Sibling `canonical_agent_key` is the
      producer-side half: the one answer for a caller holding raw key bytes.
