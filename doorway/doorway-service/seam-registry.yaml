  - name: ChallengeOutcome
    kind: reason-outcome-enum
    sourceLocation:
      file: src/services/serve_receipt.rs
      modulePath: services::serve_receipt::ChallengeOutcome
      line: 220
    summary: >
      The closed vocabulary of what a visitor's challenge to a standing BECAME — witnessed (201),
      heard but nothing owed because the contract declares no responsive-reach term (200), replay
      of a challenge already standing (200), anonymous (401), a different challenge under the
      same reference (409), or shed (503) — each carrying its own status and its own reason in
      words.
    notes: >
      Closed at birth deliberately: a reader can enumerate every arm POST /api/v1/challenge can
      take without running one. The two 200s are the interesting pair — a replay STANDS on the
      ledger and a nothing-owed names nobody as owing, and collapsing them would let a doorway
      appear to have witnessed a challenge the collective never agreed to answer.
    concernIds:
      - id: C4
        status: answered
        justification: >
          NothingOwed is a first-class outcome rather than a silent empty field, and
          nothing_owed_is_not_witnessed_and_a_replay_is pins that it is NOT reported as
          witnessed. An anonymous challenge is a named 401, never attribution to nobody.
      - id: C6b
        status: partial
        justification: >
          The enum NAMES the idempotent outcome (Replay), but the ensure-not-create that PRODUCES
          it lives in routes/challenge.rs and its replay-mints-nothing-twice property is pinned
          there, not here. This row claims only the vocabulary.
