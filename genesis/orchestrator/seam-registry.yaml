- name: planCarry
  kind: pure-decision-predicate
  sourceLocation: { file: gate-carry.mjs, modulePath: planCarry }
  summary: Decide which of a push's selected gate steps run inline in the loop and which step is offered to which
    carrier, from the steps (manifest run block, resolved build jobs, cargo slot, recorded p90) and each carrier's
    declared terms only; every step not offered carries the first refusing carrier's reason and its owner. Capacity is
    not decided here; the carrier asks `berth room cargo` at offer time. Switch GATE_CARRY=off|shadow|on, default shadow.
  concernIds:
  - { id: C0, status: n-a, justification: "A local scheduling decision over this device's own gate processes; no custody, reach or head plane." }
  - { id: C1, status: n-a, justification: "Nothing is elected; the plan only places work the push already selected." }
  - { id: C2, status: answered, justification: "Order is declared: largest recorded p90 first, a tie keeps the given (cost-sorted) order; no clock or arrival order decides." }
  - { id: C3, status: answered, justification: "Liveness: every step not offered runs inline; an offer refused or failed leaves it inline; an overlap-only carrier always leaves one step inline; a carried step can always be collected or withdrawn, and the hook's exit trap withdraws it." }
  - { id: C4, status: answered, justification: "Honest absence: no recorded run, undeclared build jobs and an unknown project are named refusals, never zero; an unreadable `berth room` refuses on the device's own line (self); a carried step whose end was not recorded collects as exit unknown, status 1, never a pass." }
  - { id: C5, status: answered, justification: "Evidence, not authority: recorded p90 and guard lines only decide whether to offer; the push's verdict is the carried gate's own exit status, collected unchanged and accounted exactly as an inline gate's." }
  - { id: C6a, status: answered, justification: "Bounded work: the plan is linear in the selected steps; one `berth room` query with a 15 s deadline per offer; withdraw is SIGTERM to the step's process group, 5 s, then SIGKILL, 2 s; collect waits only on this device's own process, as the inline loop waits on its gate." }
  - { id: C6b, status: answered, justification: "Withdraw after collect, or twice, finds no process and does nothing; collect re-reads the recorded exit." }
  - { id: C7, status: answered, justification: "The terms planCarry reads are the terms the carrier's admit re-checks before it asks for room, so a step outside them is refused at offer too." }
  - { id: C8, status: partial, justification: "Every step not offered has a reason and owner (the `plan` verb prints them all) and the hook prints `not carried: <reason> (<owner>)` or `carried: …`, plus the seconds the overlap saved; no counter or flow measure records carry outcomes yet." }
  - { id: C9, status: n-a, justification: "No agent identity is referenced." }
  - { id: C10, status: answered, justification: "An unknown GATE_CARRY value reads as shadow and says so; a berth room answer with no admit|refuse verdict refuses." }
  - { id: C11, status: answered, justification: "Externally-imposed backpressure: under load this push did not schedule, `berth room cargo` refuses on the axis it measured (seats:cargo operator, host-floor:memory self, host-floor:io self) and the step declines to the inline loop; nothing queues. The verdict's own tests are berth_test.py CargoRoomTest (Python, outside this registry's test kinds)." }
  - { id: C12, status: answered, justification: "May-act: work moves only under GATE_CARRY=on set by the person pushing; the default shadow changes nothing; the carrier acts only on this device's own process, under no remote grant." }
  - { id: C13, status: n-a, justification: "No social authority tier; a sibling carrier, when built, needs its own row and grant." }
  - { id: C14, status: partial, justification: "An offer that throws prints one line and leaves every step inline; a withdraw that leaves a process names its pids; no diagnostic capsule is written." }
  contractTests:
  - { path: genesis/orchestrator/gate-carry.test.mjs, testName: plan_one_step_stays_inline, kind: unit }
  - { path: genesis/orchestrator/gate-carry.test.mjs, testName: plan_carries_long_one_job_cargo, kind: unit }
  - { path: genesis/orchestrator/gate-carry.test.mjs, testName: plan_refuses_each_term, kind: unit }
  - { path: genesis/orchestrator/gate-carry.test.mjs, testName: plan_largest_p90_then_order, kind: unit }
  - { path: genesis/orchestrator/gate-carry.test.mjs, testName: plan_keeps_one_inline, kind: unit }
  - { path: genesis/orchestrator/gate-carry.test.mjs, testName: carry_mode_switch, kind: unit }
  - { path: genesis/orchestrator/gate-carry.test.mjs, testName: contract_in_memory_carrier, kind: unit }
  - { path: genesis/orchestrator/gate-carry.test.mjs, testName: contract_second_seat, kind: integration }
  - { path: genesis/orchestrator/gate-carry.test.mjs, testName: second_seat_refusals, kind: unit }
  - { path: genesis/orchestrator/prepush-carry.test.mjs, testName: carry_off_equals_nothing_carried, kind: integration }
  - { path: genesis/orchestrator/prepush-carry.test.mjs, testName: carry_on_overlaps, kind: integration }
  - { path: genesis/orchestrator/prepush-carry.test.mjs, testName: carry_interrupt_withdraws, kind: integration }
  - { path: genesis/orchestrator/prepush-carry.test.mjs, testName: carry_red_under_stop_stops_the_loop, kind: integration }
- name: resolveGateInputs
  kind: pure-decision-predicate
  sourceLocation: { file: gate-inputs.mjs, modulePath: resolveGateInputs }
  summary: Decide, once per run, the input class a device gate selects and keys a BORROWED step on, and whether its
    shadow compares the narrower class. Two implementors, LEGACY_ALL (today's flag-omitted bytes) and SOURCES (a
    step's sources minus its own buildProcess); a gate project's own inputs block is never narrowed and CI dispatch
    never reads the policy. GATE_INPUTS=shadow|off, default shadow, and deliberately no `on` yet, so the class
    decided is always LEGACY_ALL. Shadow runs when the resolved brit's `build affected --help` and
    `build fingerprint --help` both name `--inputs`, and prints, once per push, the borrowed steps all selects and
    sources would not, and per gate when, since the integration base, the step fingerprints moved under all and are
    unchanged under sources (the rest of the key is not compared).
  concernIds:
  - { id: C0, status: n-a, justification: "A local choice over this device's own gate selection and key; nothing is written but a per-push state file in the OS temporary directory." }
  - { id: C1, status: n-a, justification: "Mints nothing: shadow only reads fingerprints and prints." }
  - { id: C2, status: n-a, justification: "No ordering is introduced." }
  - { id: C3, status: answered, justification: "Liveness: a failed, unknown or timed-out probe, a probe cut by the shadow budget, a missing brit, and an unreadable, unwritable or mismatched state file all mean no shadow, or a probe of the child's own; the decided class is LEGACY_ALL in every case." }
  - { id: C4, status: answered, justification: "Honest absence: an incapable brit prints `[gate] inputs: --inputs unavailable; selection and keys use legacy all` once per push when the state handoff holds, else once per process that probes; a refusal of the flag during shadow ends shadow's printing with one line naming brit's error; a spent budget says so once per process." }
  - { id: C5, status: answered, justification: "Evidence, not authority: a capability is read from the binary's own help text and bound to its realpath, device, inode, size and mtime; the state file carries only mode, that identity and the answer, and is accepted only when all three match." }
  - { id: C6a, status: answered, justification: "Bounded work: two `--help` probes of at most 2 s each, killed at it, once per push when the state handoff holds and once per process when it does not. Past them the shadow spawns no brit unless a changed path is a step's own buildProcess file (decided from the change set and at most two git reads per gate process), and then fingerprints only the touched borrowed steps; all of it runs inside a per-process budget of 10 s of the shadow's own elapsed time, each subprocess given min(what remains, 5 s) with SIGKILL at it; synchronous JS is not preempted; the gate's own timed span excludes it." }
  - { id: C6b, status: answered, justification: "Resolving twice in a process returns the same frozen policy; the state file is written by rename, so a child reads a whole answer or none." }
  - { id: C7, status: answered, justification: "Selection, propagation and the key read the class from the one policy, and the reuse selector is asked under the class its key was computed under; with no `on` that class is always LEGACY_ALL." }
  - { id: C8, status: partial, justification: "Shadow prints its per-push and per-gate lines; no flow measure counts them yet." }
  - { id: C9, status: n-a, justification: "No agent identity is referenced." }
  - { id: C10, status: answered, justification: "Any GATE_INPUTS value but off, `on` included, reads as shadow; a state file that is not version 1 JSON for this mode and brit is ignored." }
  - { id: C11, status: n-a, justification: "No load is shed or queued." }
  - { id: C12, status: answered, justification: "May-act: nothing acts; shadow decides, records and times as off, and `on` waits on the four items in gate-inputs.mjs's header." }
  - { id: C13, status: n-a, justification: "No social authority tier." }
  - { id: C14, status: partial, justification: "A probe failure prints the generic unavailable line, not its cause (the cause is kept in the policy's `why`); a refusal of the flag names brit's error; a failed state handoff is silent and costs a probe per child; no diagnostic capsule is written." }
