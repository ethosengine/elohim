seamRegistryVersion: 1
crate: gate-runner
crateRoot: genesis/orchestrator
seamLocus: Local gate evidence reused by input closure, read and written as brit build attestations.
decisionPoints:
- name: reusableHit
  kind: pure-decision-predicate
  sourceLocation:
    file: gate-evidence.mjs
    modulePath: reusableHit
  summary: Under GATE_EVIDENCE=reuse, for a project listed in pool-policy gate_reuse, retain the
    existing newest-green self-signed path or accept a green crossing verdict from a roster-admitted
    sibling device when no local or sibling red exists and the declared inputs and read set are clean;
    otherwise run the gate and say why. Sibling evidence is labelled and never counts in k-of-n.
  concernIds:
  - id: C0
    status: answered
    justification: Local brit notes remain Private B; the sibling form is a B2 gate-verdict@1 record in
      one steward's admitted device channel. Neither is a release head or DHT fact; there is no DHT head cost.
  - id: C1
    status: answered
    justification: Only a run of the gate recipe records an attestation (recordEvidence after the run);
      a lookup or a reuse never mints one.
  - id: C2
    status: answered
    justification: Local-only reuse retains newest-by-builtAt behavior. Cross-device verdicts are never
      clock-ordered; any sibling red, or any local red when considering a sibling green, forces a local run.
  - id: C3
    status: answered
    justification: Every refusal, an absent attestation and any thrown read run the gate; a red or dirty
      run can never suppress the next gate.
  - id: C4
    status: answered
    justification: An unavailable closure (missing brit, fingerprint, manifest, recipe, tree, or an
      unclean native eprfs closure) has no key and cannot be reused.
  - id: C5
    status: answered
    justification: The runner recomputes the whole closure key at the pushed commit (inputs, manifest,
      recipe, runner, project tree, cargo config, rustc, gitlinks, packages, read set, native eprfs
      closure) and needs an exact inputs-hash match.
  - id: C6a
    status: answered
    justification: brit-build-ref find/put and git reads run with sixty-second deadlines; the native sibling
      read has a five-second deadline. A timeout runs the gate.
  - id: C6b
    status: answered
    justification: Attestations are content-addressed brit nodes; recording the same verdict twice
      stores one node.
  - id: C7
    status: n-a
    justification: No peer advertisement, network inventory or server capability is introduced.
  - id: C8
    status: answered
    justification: >-
      Each gate prints its evidence line, its closure scope, and either `reused` or
      `not reused: <why>`; self reuse records run-kind=reused and sibling reuse records
      run-kind=sibling-reused with `independence: sibling` on the visible line.
  - id: C9
    status: answered
    justification: Local rows still require this workspace's brit key. Sibling rows enter only through
      `epr peer verdicts`, which keeps folded via provenance from roster-admitted non-self devices.
  - id: C10
    status: answered
    justification: Closure key v3 cannot collide with v1 or v2 keys; evidence recorded under an older key
      is never read as a match.
  - id: C11
    status: answered
    justification: One bounded find per gate run; nothing queues or retries evidence requests.
  - id: C12
    status: n-a
    justification: Operator-enabled local validation only; no remote grant, role assignment or publication
      occurs.
  - id: C13
    status: n-a
    justification: A sibling verdict is explicitly independence=sibling and refused in every k-of-n count;
      CI still runs every pipeline and local reuse does not replace a remote attestation.
  - id: C14
    status: partial
    justification: Unexpected read errors run the gate and print one line; no cross-device diagnostic
      capsule is created.
  contractTests:
  - path: genesis/orchestrator/gate-evidence.test.mjs
    testName: reuse_accepts_only_self_signed_newest_green
    kind: unit
  - path: genesis/orchestrator/gate-evidence.test.mjs
    testName: reuse_never_overrules_a_newer_red
    kind: unit
  - path: genesis/orchestrator/gate-evidence.test.mjs
    testName: reuse_accepts_admitted_sibling_green
    kind: unit
  - path: genesis/orchestrator/gate-evidence.test.mjs
    testName: sibling_red_forces_local_run
    kind: unit
- name: siblingGovernanceChange
  kind: pure-decision-predicate
  sourceLocation:
    file: gate-evidence.mjs
    modulePath: siblingGovernanceChange
  summary: Refuse sibling reuse when HEAD changes the gate, its crossing/admission substrate, pool policy,
    or measure declaration from the origin/dev (falling back to dev) merge base; an unavailable comparison
    also refuses. D5's rule is that the space never rides what it upgrades.
  concernIds:
  - id: C0
    status: answered
    justification: Local git comparison only; it protects the B2 sibling verdict read without minting a fact.
  - id: C1
    status: answered
    justification: The candidate gate bytes cannot elect their own sibling evidence path; a match forces execution.
  - id: C2
    status: answered
    justification: Compares named trees from a merge base to HEAD; no timestamp or mutable latest value decides.
  - id: C3
    status: answered
    justification: Refusal runs the local gate, preserving progress without sibling availability.
  - id: C4
    status: answered
    justification: Missing integration refs, merge base or diff are explicit fail-closed refusals.
  - id: C5
    status: answered
    justification: The predicate is evidence about changed governance paths, never authority to skip a gate.
  - id: C6a
    status: answered
    justification: Two merge-base attempts and one bounded local diff; no unbounded walk or network call.
  - id: C6b
    status: n-a
    justification: Pure read; it writes nothing.
  - id: C7
    status: n-a
    justification: No advertised or served capability.
  - id: C8
    status: answered
    justification: The first governance path, or unavailable comparison, is printed as the reuse refusal.
  - id: C9
    status: n-a
    justification: Compares repository lineage, not participant identity lineage.
  - id: C10
    status: answered
    justification: The protected path list is one exported constant and includes its own implementation.
  - id: C11
    status: n-a
    justification: No externally supplied work queue or pressure source.
  - id: C12
    status: n-a
    justification: Narrows local reuse only; it grants no capability.
  - id: C13
    status: answered
    justification: Governance-class bytes always pay a local run; sibling evidence cannot lower that bar.
  - id: C14
    status: partial
    justification: A failed comparison leaves only the visible refusal; no diagnostic capsule is retained.
  contractTests:
  - path: genesis/orchestrator/gate-evidence.test.mjs
    testName: sibling_governance_class_fails_closed
    kind: unit
  - path: genesis/orchestrator/gate-evidence.test.mjs
    testName: governance_change_runs_gate
    kind: unit
- name: reuseSelector
  kind: pure-decision-predicate
  sourceLocation:
    file: gate-runner.mjs
    modulePath: reuseSelector
  summary: Refuse reuse when a file changed between the attested commit and the pushed commit would
    itself select this gate, or when the rakia oracle did not answer.
  concernIds:
  - id: C0
    status: answered
    justification: Reads git and the local selection oracle only; no network head cost.
  - id: C1
    status: n-a
    justification: Decides refusal only; it never mints or records evidence.
  - id: C2
    status: answered
    justification: Compares two named commits; no timestamp is consulted.
  - id: C3
    status: answered
    justification: An unreadable diff, an unknown commit or a fallen-back oracle refuses reuse, so the
      gate runs.
  - id: C4
    status: answered
    justification: A missing oracle answer is a refusal, never an empty selection.
  - id: C5
    status: answered
    justification: Selection is the same projectsForChanges the push uses to choose gates.
  - id: C6a
    status: answered
    justification: The oracle call carries rakia's own deadline; a timeout refuses reuse.
  - id: C6b
    status: n-a
    justification: Writes nothing.
  - id: C7
    status: n-a
    justification: No peer advertisement, network inventory or server capability is introduced.
  - id: C8
    status: answered
    justification: The refusal names the first selecting file or the absent oracle.
  - id: C9
    status: n-a
    justification: Identifies changed paths, not human or device identity.
  - id: C10
    status: n-a
    justification: No stored format is read.
  - id: C11
    status: answered
    justification: One diff and one oracle call per reuse decision.
  - id: C12
    status: n-a
    justification: Local validation only.
  - id: C13
    status: n-a
    justification: No social-tier authority gate.
  - id: C14
    status: partial
    justification: Errors refuse reuse and print one line; no diagnostic capsule.
  contractTests:
  - path: genesis/orchestrator/gate-evidence.test.mjs
    testName: reuse_selector_requires_the_oracle
    kind: unit
