seamRegistryVersion: 1
crate: gate-runner
crateRoot: genesis/orchestrator
seamLocus: Local gate evidence reused by input closure, read and written as brit build attestations.
decisionPoints:
- name: reusableHit
  kind: pure-decision-predicate
  sourceLocation:
    file: gate-evidence.mjs
    modulePath: reusableHit
  summary: Under GATE_EVIDENCE=reuse, for a project listed in pool-policy gate_reuse, retain the
    existing newest-green self-signed path or accept a green crossing verdict from a roster-admitted
    sibling device when no local or sibling red exists and the declared inputs and read set are clean;
    otherwise run the gate and say why. Sibling evidence is labelled and never counts in k-of-n.
  concernIds:
  - id: C0
    status: answered
    justification: Local brit notes remain Private B; the sibling form is a B2 gate-verdict@1 record in
      one steward's admitted device channel. Neither is a release head or DHT fact; there is no DHT head cost.
  - id: C1
    status: answered
    justification: Only a run of the gate recipe records an attestation (recordEvidence after the run);
      a lookup or a reuse never mints one.
  - id: C2
    status: answered
    justification: Local-only reuse retains newest-by-builtAt behavior. Cross-device verdicts are never
      clock-ordered; any sibling red, or any local red when considering a sibling green, forces a local run.
  - id: C3
    status: answered
    justification: Every refusal, an absent attestation and any thrown read run the gate; a red or dirty
      run can never suppress the next gate.
  - id: C4
    status: answered
    justification: An unavailable closure (missing brit, fingerprint, manifest, recipe, tree, or an
      unclean native eprfs closure) has no key and cannot be reused.
  - id: C5
    status: answered
    justification: The runner recomputes the whole closure key at the pushed commit (inputs, manifest,
      recipe, runner, project tree, cargo config, rustc, gitlinks, packages, read set, native eprfs
      closure) and needs an exact inputs-hash match.
  - id: C6a
    status: answered
    justification: brit-build-ref find/put and git reads run with sixty-second deadlines; the native sibling
      read has a five-second deadline. A timeout runs the gate.
  - id: C6b
    status: answered
    justification: Attestations are content-addressed brit nodes; recording the same verdict twice
      stores one node.
  - id: C7
    status: n-a
    justification: No peer advertisement, network inventory or server capability is introduced.
  - id: C8
    status: answered
    justification: >-
      Each gate prints its evidence line, its closure scope, and either `reused` or
      `not reused: <why>`; self reuse records run-kind=reused and sibling reuse records
      run-kind=sibling-reused with `independence: sibling` on the visible line.
  - id: C9
    status: answered
    justification: Local rows still require this workspace's brit key. Sibling rows enter only through
      `epr peer verdicts`, which keeps folded via provenance from roster-admitted non-self devices.
  - id: C10
    status: answered
    justification: Closure key v3 cannot collide with v1 or v2 keys; evidence recorded under an older key
      is never read as a match.
  - id: C11
    status: answered
    justification: One bounded find per gate run; nothing queues or retries evidence requests.
  - id: C12
    status: n-a
    justification: Operator-enabled local validation only; no remote grant, role assignment or publication
      occurs.
  - id: C13
    status: n-a
    justification: A sibling verdict is explicitly independence=sibling and refused in every k-of-n count;
      CI still runs every pipeline and local reuse does not replace a remote attestation.
  - id: C14
    status: partial
    justification: Unexpected read errors run the gate and print one line; no cross-device diagnostic
      capsule is created.
  contractTests:
  - path: genesis/orchestrator/gate-evidence.test.mjs
    testName: reuse_accepts_only_self_signed_newest_green
    kind: unit
  - path: genesis/orchestrator/gate-evidence.test.mjs
    testName: reuse_never_overrules_a_newer_red
    kind: unit
  - path: genesis/orchestrator/gate-evidence.test.mjs
    testName: reuse_accepts_admitted_sibling_green
    kind: unit
  - path: genesis/orchestrator/gate-evidence.test.mjs
    testName: sibling_red_forces_local_run
    kind: unit
- name: siblingGovernanceChange
  kind: pure-decision-predicate
  sourceLocation:
    file: gate-evidence.mjs
    modulePath: siblingGovernanceChange
  summary: Refuse sibling reuse when HEAD changes the gate, its crossing/admission substrate, pool policy,
    or measure declaration from the origin/dev (falling back to dev) merge base; an unavailable comparison
    also refuses. D5's rule is that the space never rides what it upgrades.
  concernIds:
  - id: C0
    status: answered
    justification: Local git comparison only; it protects the B2 sibling verdict read without minting a fact.
  - id: C1
    status: answered
    justification: The candidate gate bytes cannot elect their own sibling evidence path; a match forces execution.
  - id: C2
    status: answered
    justification: Compares named trees from a merge base to HEAD; no timestamp or mutable latest value decides.
  - id: C3
    status: answered
    justification: Refusal runs the local gate, preserving progress without sibling availability.
  - id: C4
    status: answered
    justification: Missing integration refs, merge base or diff are explicit fail-closed refusals.
  - id: C5
    status: answered
    justification: The predicate is evidence about changed governance paths, never authority to skip a gate.
  - id: C6a
    status: answered
    justification: Two merge-base attempts and one bounded local diff; no unbounded walk or network call.
  - id: C6b
    status: n-a
    justification: Pure read; it writes nothing.
  - id: C7
    status: n-a
    justification: No advertised or served capability.
  - id: C8
    status: answered
    justification: The first governance path, or unavailable comparison, is printed as the reuse refusal.
  - id: C9
    status: n-a
    justification: Compares repository lineage, not participant identity lineage.
  - id: C10
    status: answered
    justification: The protected path list is one exported constant and includes its own implementation.
  - id: C11
    status: n-a
    justification: No externally supplied work queue or pressure source.
  - id: C12
    status: n-a
    justification: Narrows local reuse only; it grants no capability.
  - id: C13
    status: answered
    justification: Governance-class bytes always pay a local run; sibling evidence cannot lower that bar.
  - id: C14
    status: partial
    justification: A failed comparison leaves only the visible refusal; no diagnostic capsule is retained.
  contractTests:
  - path: genesis/orchestrator/gate-evidence.test.mjs
    testName: sibling_governance_class_fails_closed
    kind: unit
  - path: genesis/orchestrator/gate-evidence.test.mjs
    testName: governance_change_runs_gate
    kind: unit
- name: reuseSelector
  kind: pure-decision-predicate
  sourceLocation:
    file: gate-runner.mjs
    modulePath: reuseSelector
  summary: Refuse reuse when a file changed between the attested commit and the pushed commit would
    itself select this gate, or when the rakia oracle did not answer.
  concernIds:
  - id: C0
    status: answered
    justification: Reads git and the local selection oracle only; no network head cost.
  - id: C1
    status: n-a
    justification: Decides refusal only; it never mints or records evidence.
  - id: C2
    status: answered
    justification: Compares two named commits; no timestamp is consulted.
  - id: C3
    status: answered
    justification: An unreadable diff, an unknown commit or a fallen-back oracle refuses reuse, so the
      gate runs.
  - id: C4
    status: answered
    justification: A missing oracle answer is a refusal, never an empty selection.
  - id: C5
    status: answered
    justification: Selection is the same projectsForChanges the push uses to choose gates.
  - id: C6a
    status: answered
    justification: The oracle call carries rakia's own deadline; a timeout refuses reuse.
  - id: C6b
    status: n-a
    justification: Writes nothing.
  - id: C7
    status: n-a
    justification: No peer advertisement, network inventory or server capability is introduced.
  - id: C8
    status: answered
    justification: The refusal names the first selecting file or the absent oracle.
  - id: C9
    status: n-a
    justification: Identifies changed paths, not human or device identity.
  - id: C10
    status: n-a
    justification: No stored format is read.
  - id: C11
    status: answered
    justification: One diff and one oracle call per reuse decision.
  - id: C12
    status: n-a
    justification: Local validation only.
  - id: C13
    status: n-a
    justification: No social-tier authority gate.
  - id: C14
    status: partial
    justification: Errors refuse reuse and print one line; no diagnostic capsule.
  contractTests:
  - path: genesis/orchestrator/gate-evidence.test.mjs
    testName: reuse_selector_requires_the_oracle
    kind: unit
- name: changeClass
  kind: pure-decision-predicate
  sourceLocation: { file: gate-change-class.mjs, modulePath: changeClass }
  summary: Classify a candidate from its integration-base diff without allowing candidate gate bytes to judge themselves.
  concernIds:
  - { id: C0, status: n-a, justification: Local git reads only. }
  - { id: C1, status: answered, justification: Governance paths re-execute the merge-base judge and rename pairs are both visible. }
  - { id: C2, status: n-a, justification: No event ordering. }
  - { id: C3, status: answered, justification: An absent merge base fails closed with a fetch cure. }
  - { id: C4, status: answered, justification: Unreadable input is governance. }
  - { id: C5, status: answered, justification: Every reader re-derives class from the diff. }
  - { id: C6a, status: answered, justification: The git read set is bounded. }
  - { id: C6b, status: answered, justification: Equal inputs return equal classifications. }
  - { id: C7, status: n-a, justification: No discovery surface. }
  - { id: C8, status: answered, justification: Why names the first path at the top class. }
  - { id: C9, status: n-a, justification: No identity lineage. }
  - { id: C10, status: answered, justification: Pool policy parse failure is governance. }
  - { id: C11, status: n-a, justification: No work queue. }
  - { id: C12, status: n-a, justification: No capability grant. }
  - { id: C13, status: n-a, justification: No social tier. }
  - { id: C14, status: n-a, justification: Classification does not diagnose a failed gate. }
  contractTests:
  - { path: genesis/orchestrator/gate-change-class.test.mjs, testName: classifier_change_is_governance, kind: unit }
  - { path: genesis/orchestrator/gate-change-class.test.mjs, testName: governance_covers_the_runner_import_closure, kind: unit }
- name: CHANGE_CLASSES
  kind: reason-outcome-enum
  sourceLocation: { file: gate-change-class.mjs, modulePath: CHANGE_CLASSES }
  summary: Frozen strictness order and effects for landing changes.
  concernIds:
  - { id: C0, status: n-a, justification: No network cost. }
  - { id: C1, status: answered, justification: Governance and higher classes break inheritance. }
  - { id: C2, status: n-a, justification: No ordering of events. }
  - { id: C3, status: n-a, justification: Pure enum. }
  - { id: C4, status: n-a, justification: Pure enum. }
  - { id: C5, status: answered, justification: Consumers use the frozen order. }
  - { id: C6a, status: n-a, justification: Constant-size enum. }
  - { id: C6b, status: answered, justification: Frozen values are stable. }
  - { id: C7, status: n-a, justification: No discovery. }
  - { id: C8, status: answered, justification: CLASS_EFFECTS names every outcome. }
  - { id: C9, status: n-a, justification: No identity. }
  - { id: C10, status: answered, justification: Unknown values fail closed at the picker. }
  - { id: C11, status: n-a, justification: No queue. }
  - { id: C12, status: n-a, justification: No authority grant. }
  - { id: C13, status: n-a, justification: No social tier. }
  - { id: C14, status: n-a, justification: No diagnostic capsule. }
  contractTests:
  - { path: genesis/orchestrator/gate-change-class.test.mjs, testName: flags_union_not_top_class, kind: unit }
- name: pickLandingBase
  kind: pure-decision-predicate
  sourceLocation: { file: gate-landing-base.mjs, modulePath: pickLandingBase }
  summary: Pick a locally reachable landing chain from validated intent rows and base pointers.
  concernIds:
  - { id: C0, status: answered, justification: Head cost is bounded by the cap. }
  - { id: C1, status: answered, justification: The walk never chains behind governance or higher. }
  - { id: C2, status: answered, justification: Base pointers and the windowed tiebreak define order. }
  - { id: C3, status: answered, justification: Breaks retain a reachable base and reason. }
  - { id: C4, status: answered, justification: Unreadable queue and absent bytes are explicit. }
  - { id: C5, status: answered, justification: Local git re-derives reachability and refs. }
  - { id: C6a, status: answered, justification: Chains cap at four. }
  - { id: C6b, status: answered, justification: Duplicate intent CIDs fold once. }
  - { id: C7, status: n-a, justification: No discovery promise. }
  - { id: C8, status: answered, justification: Every break is printed. }
  - { id: C9, status: n-a, justification: Device identity is authority input not lineage. }
  - { id: C10, status: answered, justification: Malformed sibling rows are excluded. }
  - { id: C11, status: answered, justification: Cap bounds queue work. }
  - { id: C12, status: answered, justification: Advisory entries cannot act for the announcer. }
  - { id: C13, status: n-a, justification: No social tier. }
  - { id: C14, status: partial, justification: Dismiss capsule construction is delegated to dismissTargets. }
  contractTests:
  - { path: genesis/orchestrator/gate-landing-base.test.mjs, testName: chain_follows_base_pointers, kind: unit }
  - { path: genesis/orchestrator/gate-landing-base.test.mjs, testName: fork_tiebreak_is_order_free, kind: unit }
  - { path: genesis/orchestrator/gate-landing-base.test.mjs, testName: never_chains_behind_governance, kind: unit }
- name: phaseLVerdict
  kind: pure-decision-predicate
  sourceLocation: { file: gate-landing-base.mjs, modulePath: phaseLVerdict }
  summary: Separate commit movement from equal-tree evidence reuse at landing.
  concernIds:
  - { id: C0, status: n-a, justification: Constant-time local comparison. }
  - { id: C1, status: n-a, justification: Does not judge gate bytes. }
  - { id: C2, status: n-a, justification: No event order. }
  - { id: C3, status: answered, justification: Every comparison has a verdict. }
  - { id: C4, status: n-a, justification: OIDs are caller-validated. }
  - { id: C5, status: answered, justification: Caller supplies locally read git OIDs. }
  - { id: C6a, status: answered, justification: Constant work. }
  - { id: C6b, status: answered, justification: Pure comparison. }
  - { id: C7, status: n-a, justification: No discovery. }
  - { id: C8, status: answered, justification: Verdict names ff same-tree or moved. }
  - { id: C9, status: n-a, justification: No identity. }
  - { id: C10, status: n-a, justification: No stored format. }
  - { id: C11, status: n-a, justification: No queue. }
  - { id: C12, status: n-a, justification: No authority. }
  - { id: C13, status: n-a, justification: No social tier. }
  - { id: C14, status: n-a, justification: No failure diagnosis. }
  contractTests:
  - { path: genesis/orchestrator/gate-landing-base.test.mjs, testName: phase_l_compares_commit_then_tree, kind: unit }
  - { path: genesis/orchestrator/gate-evidence.test.mjs, testName: equal_trees_share_a_closure_key, kind: unit }
- name: dismissTargets
  kind: verdict-fn
  sourceLocation: { file: gate-landing-base.mjs, modulePath: dismissTargets }
  summary: Dismiss the complete predicted chain with a shell-safe diagnostic capsule.
  concernIds:
  - { id: C0, status: n-a, justification: Pure bounded formatting. }
  - { id: C1, status: n-a, justification: Does not judge itself. }
  - { id: C2, status: n-a, justification: No event order. }
  - { id: C3, status: answered, justification: Non-diagnostic inputs return no targets. }
  - { id: C4, status: n-a, justification: Inputs are explicit. }
  - { id: C5, status: answered, justification: Caller supplies measured red and green outcomes. }
  - { id: C6a, status: answered, justification: Work is linear in the capped chain. }
  - { id: C6b, status: answered, justification: Pure output. }
  - { id: C7, status: n-a, justification: No discovery. }
  - { id: C8, status: answered, justification: Capsule names the evidence. }
  - { id: C9, status: n-a, justification: No identity lineage. }
  - { id: C10, status: answered, justification: Capsule keys and string encoding are fixed. }
  - { id: C11, status: n-a, justification: No queue. }
  - { id: C12, status: answered, justification: Caller applies raiser-device authority. }
  - { id: C13, status: n-a, justification: No social tier. }
  - { id: C14, status: answered, justification: Whole chain and six evidence fields are retained. }
  contractTests:
  - { path: genesis/orchestrator/gate-landing-base.test.mjs, testName: dismiss_targets_whole_chain, kind: unit }
- name: changeIdFor
  kind: pure-decision-predicate
  sourceLocation: { file: gate-change-id.mjs, modulePath: changeIdFor }
  summary: Mint stable change lineage from the final stripped commit message and git identity material.
  concernIds:
  - { id: C0, status: n-a, justification: Local hash only. }
  - { id: C1, status: answered, justification: Minting is confined to the commit-message path. }
  - { id: C2, status: n-a, justification: No event order. }
  - { id: C3, status: answered, justification: Git failures skip without refusing the commit. }
  - { id: C4, status: answered, justification: Malformed trailers are reported and untouched. }
  - { id: C5, status: answered, justification: Tree and identities are read from git at commit time. }
  - { id: C6a, status: answered, justification: Fixed git calls and one hash. }
  - { id: C6b, status: answered, justification: Existing trailers are never reminted. }
  - { id: C7, status: n-a, justification: No discovery. }
  - { id: C8, status: answered, justification: Every skip has a reason. }
  - { id: C9, status: answered, justification: Change-Id survives commit OID rekeys. }
  - { id: C10, status: answered, justification: Trailer grammar is centralized. }
  - { id: C11, status: n-a, justification: No queue. }
  - { id: C12, status: n-a, justification: No authority grant. }
  - { id: C13, status: n-a, justification: No social tier. }
  - { id: C14, status: n-a, justification: No gate failure diagnosis. }
  contractTests:
  - { path: genesis/orchestrator/gate-change-id.test.mjs, testName: stamp_mints_once_over_final_message, kind: unit }
  - { path: genesis/orchestrator/gate-change-id.test.mjs, testName: amend_and_rebase_keep_one_trailer, kind: unit }
