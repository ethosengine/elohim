# Elohim Cross-Environment Isolation NetworkPolicies
#
# Prevents pods in one environment from communicating with pods in another.
# Each namespace gets:
#   1. Default deny all ingress from other elohim namespaces
#   2. Allow ingress from within the same namespace
#   3. Allow ingress from ingress controller (external traffic)
#   4. Allow DNS resolution (kube-system)
#
# Apply per cluster:
#   kubectl apply -f genesis/orchestrator/manifests/network-policies.yaml
#
# Prerequisites:
#   - CNI plugin must support NetworkPolicy (Calico, Cilium, etc.)
#   - Namespaces must have labels: elohim/environment: alpha|staging|prod
#     (defined in namespaces.yaml)

---
# ============================================================================
# Alpha Environment
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-cross-env
  namespace: elohim-alpha
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: manual
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from within the same namespace
    - from:
        - podSelector: {}
    # Allow traffic from ingress controller (microk8s-bundled, ns is "ingress")
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
    # Allow DNS resolution
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow Jenkins runners (CI/CD operator surface) to reach storage + doorway
    # + conductor WS. Jenkins is shared infra, not an environment — the cross-env
    # policy's intent is to isolate envs from each other, not block trusted
    # operator namespaces.
    # Conductor bridge pod ports (8444 admin / 8445 app — Service maps
    # 4444→8444, 4445→8445; NetworkPolicy matches the post-DNAT POD port) were
    # opened 2026-06-10: the genesis pipeline's seed stages (conductor
    # identities, agent peer bindings, household formation) exist solely to
    # perform admin-WS seeding, so jenkins is already a trusted admin surface
    # by design; blocking the ports just made those stages permanently
    # UNSTABLE (conductor-readiness.json 0/3 in every retained build).
    # SCOPED BOOTSTRAP DEBT: network-position auth on conductor admin is a
    # bypass of the delegates-compute grant pattern. Retirement condition
    # (re-close 8444/8445 once seeding goes through a commitment-gated
    # doorway deputy) is tracked in genesis/data/timeline/backlog/
    # security-ci-substrate-authorization-grant-coherence.md.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: jenkins
      ports:
        - protocol: TCP
          port: 8090
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8444
        - protocol: TCP
          port: 8445

---
# ============================================================================
# Staging Environment
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-cross-env
  namespace: elohim-staging
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: manual
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from within the same namespace
    - from:
        - podSelector: {}
    # Allow traffic from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
    # Allow DNS resolution
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# ============================================================================
# P2P Cross-Namespace Rules (alpha <-> staging on port 9876)
# ============================================================================

# Allow P2P traffic: staging → alpha
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-p2p-from-staging
  namespace: elohim-alpha
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: manual
spec:
  podSelector:
    matchLabels:
      app: elohim-edgenode
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              elohim/environment: staging
          podSelector:
            matchLabels:
              app: elohim-edgenode
      ports:
        - protocol: TCP
          port: 9876

---
# Allow P2P traffic: alpha → staging
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-p2p-from-alpha
  namespace: elohim-staging
