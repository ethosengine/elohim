# Elohim Cross-Environment Isolation NetworkPolicies
#
# Prevents pods in one environment from communicating with pods in another.
# Each namespace gets:
#   1. Default deny all ingress from other elohim namespaces
#   2. Allow ingress from within the same namespace
#   3. Allow ingress from ingress controller (external traffic)
#   4. Allow DNS resolution (kube-system)
#
# Apply per cluster:
#   kubectl apply -f genesis/orchestrator/manifests/network-policies.yaml
#
# CROSS-NODE INGRESS (2026-07-03, supersedes the 2026-06-10 drift warning):
#    when a cross-node source reaches an elohim pod, Calico (VXLAN Always,
#    default-ipv4-ippool 10.1.0.0/16) can rewrite the source to a node tunnel
#    address that no namespaceSelector can match, so the traffic is dropped
#    unless an ipBlock admits it. The LIVE policies carried 7 hand-patched
#    node-specific tunnel /32s that were deliberately uncommitted ("go stale as
#    nodes change") — which meant a blind `kubectl apply -f` of this file
#    stripped the fix, and every node change was a silent re-break risk. The
#    rule is now committed DURABLY as the whole pool range (ipBlock
#    10.1.0.0/16, verified against the live IPPool 2026-07-03): node churn
#    can't invalidate it and apply no longer strips it.
#
#    NAMED TRADEOFF: tunnel addresses and pod addresses share the one Calico
#    pool, so admitting the range also admits any in-cluster pod IP — the
#    cross-env deny below becomes documentation-of-intent rather than hard
#    isolation for in-pool sources. Accepted (operator decision 2026-07-03):
#    these namespaces are one dev cluster wearing environment costumes; the
#    protocol-truth isolation story belongs to the doorway/p2p membrane, not
#    k8s netpol (see feedback memory: k8s is dev scaffold — doorway is the
#    eventual ingress/LB over the p2p dataplane).
#
#    Live objects may still carry other hand-patches (generation > 1). Diff
#    the live object before any apply: kubectl get netpol default-deny-cross-env
#    -n <ns> -o yaml.
#
# Prerequisites:
#   - CNI plugin must support NetworkPolicy (Calico, Cilium, etc.)
#   - Namespaces must have labels: elohim/environment: alpha|staging|prod
#     (defined in namespaces.yaml)

---
# ============================================================================
# Alpha Environment
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-cross-env
  namespace: elohim-alpha
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: manual
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from within the same namespace
    - from:
        - podSelector: {}
    # Allow traffic from ingress controller (microk8s-bundled, ns is "ingress")
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
    # Allow DNS resolution
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow Jenkins runners (CI/CD operator surface) to reach storage + doorway
    # + conductor WS. Jenkins is shared infra, not an environment — the cross-env
    # policy's intent is to isolate envs from each other, not block trusted
    # operator namespaces.
    # Conductor bridge pod ports (8444 admin / 8445 app — Service maps
    # 4444→8444, 4445→8445; NetworkPolicy matches the post-DNAT POD port) were
    # opened 2026-06-10: the genesis pipeline's seed stages (conductor
    # identities, agent peer bindings, household formation) exist solely to
    # perform admin-WS seeding, so jenkins is already a trusted admin surface
    # by design; blocking the ports just made those stages permanently
    # UNSTABLE (conductor-readiness.json 0/3 in every retained build).
    # SCOPED BOOTSTRAP DEBT: network-position auth on conductor admin is a
    # bypass of the delegates-compute grant pattern. Retirement condition
    # (re-close 8444/8445 once seeding goes through a commitment-gated
    # doorway deputy) is tracked in genesis/data/timeline/backlog/
    # security-ci-substrate-authorization-grant-coherence.md.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: jenkins
      ports:
        - protocol: TCP
          port: 8090
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8444
        - protocol: TCP
          port: 8445
    # Cross-node sources whose address Calico rewrote to a node tunnel IP —
    # admit the whole pool range so node churn can't strand a node (see the
    # CROSS-NODE INGRESS header note, incl. the named isolation tradeoff).
    - from:
        - ipBlock:
            cidr: 10.1.0.0/16

---
# ============================================================================
# Staging Environment
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-cross-env
  namespace: elohim-staging
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: manual
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from within the same namespace
    - from:
        - podSelector: {}
    # Allow traffic from ingress controller (microk8s-bundled, ns is "ingress" —
    # one cluster serves all three envs; "ingress-nginx" matched nothing live)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
    # Allow DNS resolution
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Cross-node tunnel-rewritten sources (see CROSS-NODE INGRESS header note)
    - from:
        - ipBlock:
            cidr: 10.1.0.0/16

---
# ============================================================================
# P2P Cross-Namespace Rules (alpha <-> staging on port 9876)
# ============================================================================

# Allow P2P traffic: staging → alpha
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-p2p-from-staging
  namespace: elohim-alpha
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: manual
spec:
  podSelector:
    matchLabels:
      app: elohim-edgenode
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              elohim/environment: staging
          podSelector:
            matchLabels:
              app: elohim-edgenode
      ports:
        - protocol: TCP
          port: 9876

---
