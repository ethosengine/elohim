# Adam — Genesis Peer (alpha), CONDUCTOR workload.
#
# Hand-baked twin of _edgenode-conductor.template.yaml, byte-parallel in
# structure: adam carries an explicit manifest (deployments.json
# `conductorManifest`) rather than sed-rendering the shared template, exactly
# as adam-firstman.yaml is his explicit storage manifest. Keep the two files in
# lockstep — the genesis pair (adam + matthew) must move together or they land
# on different DNA hashes and partition the DHT.
#
# adam-specific and DELIBERATE: hard node-type=remote pin, the ARC-CONVERGENCE
# k2Gossip revert in the ConfigMap below, and the probe shape (no startupProbe)
# that adam-firstman.yaml already uses.
#
# BUDGET: adam's share of his ONE declared envelope (deployments.json
# adam.edgenode* = 2Gi/8Gi, 1500m/8000m), hand-baked exactly as the shared
# template's conductorShare would compute it — memory 5/8, CPU 1/2:
#   memory request 1280Mi + adam-firstman.yaml's  768Mi = 2048Mi = 2Gi
#   memory limit   5120Mi + adam-firstman.yaml's 3072Mi = 8192Mi = 8Gi
#   cpu request      750m + adam-firstman.yaml's   750m = 1500m
#   cpu limit       4000m + adam-firstman.yaml's  4000m = 8000m
# The split never adds load; validate-deployments.ts check (3) asserts that sum.
#
# OPEN, OPERATOR-OWNED: adam's 8000m single-pod limit was chosen 2026-07-07 so
# the conductor detected 8 cores and its SQLite read pool max(2*cpus, 8) reached
# 16 readers. At a neutral 4000m conductor share it detects 4 and floors at 8.
# Restoring 16 readers is arithmetically incompatible with neutrality (it needs
# the whole 8000m on this pod), so it is a raise of adam's edgenode* envelope —
# a portfolio decision the test-bench-aggregate-capacity validator must ratify,
# NOT something to smuggle in as a conductorCpuLimit override. Countervailing
# evidence: pre-split the conductor was `nice`d to 10 to LOSE the CPU race to
# storage inside the shared cgroup, so its 4000m is now uncontended where the
# 8000m never was. Measure before raising.
#
# ── WHY THIS FILE EXISTS ────────────────────────────────────────────────────
# Before rung 2, storage + conductor shared one container, so EVERY
# storage/doorway-adjacent commit rollout-restarted all 7 conductors: full-arc
# re-gossip surge, ~20min restart churn, hours of catch-up. The conductor now
# has its own workload with its own restart cadence: storage rolls per commit,
# conductors roll only on a conductor-fork bump, a DNA (hApp digest) move, or
# an explicit `[conductor-roll]` / CONDUCTOR_ROLL request.
#
# ── PVC CONTINUITY (the load-bearing trick) ─────────────────────────────────
# This StatefulSet has NO volumeClaimTemplates. It mounts the ALREADY-EXISTING
# `holochain-data-<resourcePrefix>-0` PVC by explicit claimName. That PVC was
# minted by the storage StatefulSet's old `holochain-data` volumeClaimTemplate
# and is Retained (persistentVolumeClaimRetentionPolicy on the storage STS), so
# the migration is zero re-genesis: the lair keystore + source chains stay put
# and the agent keys survive. openebs-hostpath PVs carry node affinity, so the
# conductor pod is co-scheduled onto the node that already holds the bytes —
# no data move, no new key, no DHT churn from a re-key.
#
# Single-writer is guaranteed by ORDERING, not by locking: the Jenkinsfile
# rolls the storage STS to external mode FIRST (which kills the embedded
# conductor and releases the PVC) and only then applies this StatefulSet.
#
# ── ROLLBACK ────────────────────────────────────────────────────────────────
# Delete this StatefulSet and flip the storage STS back to EMBEDDED_CONDUCTOR
# =true with its `holochain-data` volumeClaimTemplate restored. That is exactly
# today's pre-rung-2 shape and it re-adopts the same PVC by the same name.
# PVCs are untouched in both directions.
#
# ── WHY socat AND NOT THE RUST FORWARDER ────────────────────────────────────
# elohim-storage's built-in forwarder (src/forwarder.rs) can only be reached
# through the `if let Some(admin_url)` branch in main.rs — the same branch that
# starts the HcClientRegistry, the bridge supervisor, the signal subscribers
# and the PeerStatus heartbeat. Setting HOLOCHAIN_ADMIN_URL here would give
# this human TWO heartbeats writing `record_peer_status` for the SAME agent,
# and this pod's DefaultProbe measures the disk under its own blob path (an
# emptyDir) — it would publish wrong capacity over the storage pod's real
# numbers every 60s. So the conductor pod runs with NO admin_url at all and
# the localhost→pod-network bridge is a socat sidecar: exactly the legacy
# ws-proxy shape still in genesis/orchestrator/manifests/edgenode/alpha.yaml,
# with the same 8444/8445 external ports the whole fleet already speaks.
#
# ── PORTS ───────────────────────────────────────────────────────────────────
#   - 4444/4445: conductor admin/app WS, 127.0.0.1 only (Holochain's default)
#   - 8444/8445: socat-bridged admin/app WS on the pod network (containerPort)
#   - 8090:      elohim-storage HTTP — probe surface ONLY, no Service port.
#                In embedded mode main() awaits conductor-ready + hApp install
#                BEFORE starting the HTTP server, so a 200 on /health here
#                means "conductor up and hApp installed" — the honest readiness
#                signal for this pod, and the reason the generous cold-install
#                probe budgets below are copied verbatim from the storage STS.
#
# ── POD-TEMPLATE STABILITY (do not break this) ──────────────────────────────
# NOTHING that changes on an ordinary commit may appear in `.spec.template`.
# `app.kubernetes.io/version: DEPLOY_VERSION_PLACEHOLDER` is therefore on the
# OBJECT metadata only, never on the pod-template labels — a git-SHA label in
# the pod template is precisely the staggered-fleet-restart root cause
# (genesis/docs/superpowers/specs/2026-08-06-staggered-conductor-restart-mitigation-design.md).
# The hApp content digest annotation DOES belong in the pod template: a DNA
# move must reach the conductors, and that is the only channel that says so.
---
# ConfigMap for conductor configuration — MOVED here from adam-firstman.yaml
# in rung 2, byte-identical apart from the component label. adam's
# ARC-CONVERGENCE k2Gossip revert and his omission of target_arc_factor are
# deliberate and host-specific; do not "normalise" them to the shared template.
apiVersion: v1
kind: ConfigMap
metadata:
  name: RESOURCE_PREFIX_PLACEHOLDER-config
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: elohim-edgenode
    elohim-human: adam-firstman
    environment: ENV_PLACEHOLDER
    app.kubernetes.io/name: edgenode
    app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: conductor
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
data:
  # hApp version to fetch from Harbor (dev-latest for dev environments, explicit version for prod)
  happ-version: "HAPP_TAG_PLACEHOLDER"
  conductor-config.yaml: |
    # Holochain Conductor Configuration for Elohim Protocol
    # Conductor binds to 127.0.0.1:4444/4445 (Holochain's safe default).
    # elohim-storage's forwarder bridges pod-network:4444/4445 → 127.0.0.1,
    # so doorway reaches admin via the pod-IP without Holochain itself
    # exposing externally. See peer-policy ConfigMap in this manifest.
    admin_interfaces:
      - driver:
          type: websocket
          port: 4444
          allowed_origins: "*"
    network:
      # Bootstrap served by Doorway gateway
      bootstrap_url: "BOOTSTRAP_URL_PLACEHOLDER"
      # Signal served on dedicated subdomain (tx5/SBD protocol requires path = pubkey)
      signal_url: "SIGNAL_URL_PLACEHOLDER"
      # REQUIRED field at holochain 0.6.3+ (single NetworkConfig struct; inert while the
      # build compiles tx5-only). Hand-rendered (this manifest is not sed-templated for
      # relay_url): adam is node-type=remote, so deployHumanManifest's primaryDoorway
      # selection (mirroring signal_url above) resolves him to doorway B — shem/apex,
      # elohim.host — whose relay is https://relay.elohim.host (Wave 2 relay-sovereignty
      # design, D2: relay is a per-doorway concern, doorway A -> relay.alpha.elohim.host,
      # doorway B -> relay.elohim.host). Must be live before any transport-iroh build
      # ships; never fall back to n0's public relay default.
      relay_url: "https://relay.elohim.host"
      webrtc_config:
        iceServers:
          - urls: ["stun:stun.cloudflare.com:3478"]
          - urls: ["stun:stun.l.google.com:19302"]
          # Sovereign TURN relay — see the edgenode template's comment. adam is
          # the shem-side genesis anchor, the exact peer whose fetches toward the
          # household fail. The prior diagnostic relay (openrelay.metered.ca)
          # went globally dead 2026-07-13; replaced by our own coturn pair
          # (`genesis/orchestrator/manifests/infra/alpha-coturn-operations.yaml`,
          # `alpha-coturn-shem.yaml`). Keep the credential in sync with those
          # ConfigMaps' `user=`.
          # Dual-WAN ICE failover: operations (on-prem, alpha.elohim.host) relay
          # primary, shem (the apex — adam's own premises) redundant — either
          # works, ICE gathers candidates from both. Role-named DNS (2026-07-28):
          # no node names in public DNS; each name is beacon-managed and
          # dynamic-IP-safe. turns:5349 TLS is a later phase; 3478-first.
          - urls:
              - "turn:alpha.elohim.host:3478?transport=udp"
              - "turn:alpha.elohim.host:3478?transport=tcp"
            username: "elohim"
            credential: "alpha-turn-commons-2026"
          - urls:
              - "turn:elohim.host:3478?transport=udp"
              - "turn:elohim.host:3478?transport=tcp"
            username: "elohim"
            credential: "alpha-turn-commons-2026"
      # ARC-CONVERGENCE tuning — REVERTED TO UPSTREAM DEFAULTS for adam only
      # (2026-07-29). This host previously carried the household slow-WAN
      # profile (roundTimeoutMs 60000, maxConcurrentAcceptedRounds 4, added
      # 2026-07-20 for a slow-link node whose SQLite write guard was saturated
      # by concurrent gossip rounds). That profile is WRONG for a multi-tenant
      # conductor, and it is still correct for households — it stays in
      # `_edgenode-consolidated.template.yaml`; do not propagate this revert
      # there.
      #
      # Why: a cell is only an authority for a hash when its CURRENT storage arc
      # covers it, and kitsune2 resets every local agent's current arc to Empty
      # on join — i.e. on every conductor restart (kitsune2_core
      # factories/core_space.rs `local_agent_join`). The arc is promoted to FULL
      # only when a gossip round completes with zero mismatched sectors
      # (kitsune2_gossip storage_arc.rs). Until then, `target_arc_factor: 1`
      # notwithstanding, every zome get/get_links leaves the box and dies on
      # `request_timeout_s`. Probed on adam 2026-07-29: ONE "Updating storage arc
      # to full" line in the 44 minutes after a 10:57Z boot, across ~28 hosted
      # agents — arc convergence, not corpus size, is this node's bottleneck.
      #
      # The household profile actively slowed that convergence here: a stalled
      # round held its slot 4× longer (60s vs 15s) while inbound accept slots
      # were cut 10 → 4, on the one host in the fleet with the most cells
      # sharing a single per-space gossip initiate slot.
      advanced:
        k2Gossip:
          roundTimeoutMs: 15000
          maxConcurrentAcceptedRounds: 10
    # NOTE — `request_timeout_s` was CONSIDERED AND DROPPED here (2026-07-29).
    # Lowering it from the 60s default was proposed to keep the conductor's own
    # give-up under elohim-storage's 15s heal deadline. Rejected on review: this
    # key is CONDUCTOR-WIDE, and tx5 first-contact alone can burn 45-60s in
    # WebRTC connect, so a 10s cap would fast-fail the declare paths we
    # deliberately keep on the Network strategy, plus every other DNA's network
    # gets across all of adam's hosted agents. With the heal read path now Local
    # (`resolve_content_head_local`), the cap has no remaining purpose. The
    # convergence-relevant knobs are the k2Gossip ones above. Do not re-propose
    # this without a per-call timeout mechanism rather than a conductor-wide one.
    data_root_path: "/var/local/lib/holochain"
    keystore:
      type: lair_server_in_proc
      lair_root: "/var/local/lib/holochain/ks"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: RESOURCE_PREFIX_PLACEHOLDER-conductor
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: elohim-edgenode
    elohim-human: adam-firstman
    environment: ENV_PLACEHOLDER
    elohim-workload: conductor
    app.kubernetes.io/name: edgenode
    app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
    # OBJECT metadata only — never the pod template. See POD-TEMPLATE STABILITY.
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: conductor
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  serviceName: RESOURCE_PREFIX_PLACEHOLDER-conductor-headless
  replicas: 1
  # No volumeClaimTemplates here (the chain PVC is referenced by claimName), but
  # keep Retain so a future forbidden-field orphan-delete + reapply can never
  # take the chain data with it.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: elohim-edgenode
      elohim-human: adam-firstman
      environment: ENV_PLACEHOLDER
      # The discriminator that keeps this StatefulSet and the storage one from
      # adopting each other's pods, and keeps each Service selecting only its
      # own workload. StatefulSet .spec.selector is immutable, so this label was
      # ADDED to the storage pod template (whose selector already matched on the
      # other three labels) rather than the storage selector being rewritten.
      elohim-workload: conductor
  template:
    metadata:
      annotations:
        # Content digest of the hApp behind the floating happ-version tag,
        # resolved at render time (Jenkinsfile resolveHappDigest). The tag is
        # mutable — a DNA-pipeline rebuild moves dev-latest/latest to new hApp
        # bytes with NO edge commit. Stamping the digest into the CONDUCTOR pod
        # template is what makes a DNA move roll the conductors (and only a DNA
        # move): it is the one per-deploy-variable value that legitimately
        # belongs in this pod template.
        # FAIL-SAFE: on resolution failure the Jenkinsfile stamps a unique
        # marker, never empty/stale — the deploy still rolls rather than skew.
        elohim.host/happ-digest: "HAPP_DIGEST_PLACEHOLDER"
      labels:
        app: elohim-edgenode
        elohim-human: adam-firstman
        environment: ENV_PLACEHOLDER
        elohim-workload: conductor
        app.kubernetes.io/name: edgenode
        app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
        app.kubernetes.io/component: conductor
        app.kubernetes.io/part-of: elohim
        app.kubernetes.io/managed-by: jenkins
    spec:
      securityContext:
        fsGroup: 1000
      # Adam: remote-side bootstrap anchor on shem — hard-pinned, no on-prem
      # fallback (mirrors adam-firstman.yaml's storage pod). The
      # openebs-hostpath PV behind holochain-data-<prefix>-0 also carries node
      # affinity, so both constraints resolve to the same node; a mismatch
      # fails loudly as Pending rather than silently starting a second chain.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - remote
      tolerations:
        - key: remote-wan
          operator: Exists
          effect: NoSchedule
      # shem's GFiber router hairpin-intercepts the apex hostnames back to its
      # own WAN IP. Rendered per-human by deployHumanManifest — non-empty only
      # for shem-placed humans whose primary doorway is doorwayB (apex). The
      # conductor is the pod that actually dials signal/relay/TURN, so this
      # alias list belongs here (it is inert on the storage pod now).
      hostAliases: HOST_ALIASES_PLACEHOLDER
      # Init container fetches hApp from Harbor registry using oras
      initContainers:
        - name: happ-fetcher
          image: ghcr.io/oras-project/oras:v1.1.0
          command: ['sh', '-c']
          args:
            - |
              set -e
              echo "Fetching hApp from Harbor registry..."
              echo "Version: ${HAPP_VERSION}"

              # Login to Harbor and pull artifact
              oras pull harbor.ethosengine.com/ethosengine/elohim-happ:${HAPP_VERSION} -o /happ

              if [ -f /happ/elohim.happ ]; then
                echo "hApp downloaded successfully from Harbor"
                ls -lh /happ/elohim.happ
              else
                echo "Failed to download hApp from Harbor"
                exit 1
              fi
          env:
            - name: HAPP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: RESOURCE_PREFIX_PLACEHOLDER-config
                  key: happ-version
          volumeMounts:
            - name: happ-volume
              mountPath: /happ
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      containers:
        # elohim-conductor: the SAME elohim-storage image artifact as the
        # storage StatefulSet, run in embedded-conductor mode with every
        # storage feature off. One image, two pin cadences — this container's
        # tag is CONDUCTOR_WORKLOAD_IMAGE_PLACEHOLDER, which the Jenkinsfile
        # resolves to the image ALREADY running on this StatefulSet unless a
        # conductor roll is warranted (see resolveConductorWorkloadImage).
        # Storage's tag keeps moving per commit; this one does not.
        - name: elohim-conductor
          image: CONDUCTOR_WORKLOAD_IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          env:
            - name: HUMAN_ID
              value: "human-adam-firstman"
            - name: ELOHIM_DISPLAY_NAME
              value: "adam-firstman"
            - name: RUST_LOG
              value: "info,elohim_storage=debug,kitsune2_core=debug,kitsune2_bootstrap_client=debug"
            # --- Embedded conductor mode ---
            # This is the ONLY pod in the human that spawns holochain. It also
            # owns hApp install and DNA/coordinator reconciliation:
            # happ_manager::ensure_happ_installed + sync_coordinators are called
            # from the embedded-conductor boot loop in main.rs and run nowhere
            # else, which is exactly why the conductor keeps this mode rather
            # than the storage pod driving an external conductor's install.
            - name: EMBEDDED_CONDUCTOR
              value: "true"
            - name: CONDUCTOR_CONFIG_PATH
              value: "/etc/holochain/conductor-config.yaml"
            - name: CONDUCTOR_DATA_DIR
              value: "/var/local/lib/holochain"
            - name: HAPP_PATH
              value: "/opt/holochain/elohim.happ"
            # Admin-WS request timeout (seconds) for the embedded conductor.
            # Must cover the cold FIRST hApp install — a single-threaded wasm
            # compile + genesis. Operator-tunable here WITHOUT a rebuild; keep
            # it under the deploy rollout-status timeout (600s). Code default: 180.
            - name: HAPP_INSTALL_TIMEOUT_SECS
              value: "180"
            # Gate for happ_manager DNA-content drift auto-reinstall, and (by
            # inheritance) for the coordinator-zome hot-swap. Reads only in the
            # embedded boot loop, so it lives on THIS pod and nowhere else.
            # Rendered per-env by deployHumanManifest: true for alpha/staging
            # (ephemeral, re-seeded), false for prod (DNA upgrades need
            # migration/lineage, not a blind reinstall that mints a new key).
            # 2026-09-02: "false" after the alpha incident — see the template's
            # note; a reinstall on a node holding data needs DNA_MIGRATION_INTENT,
            # an app-absent conductor first-installs without any flag.
            - name: ALLOW_DNA_REINSTALL
              value: "false"
            - name: ALLOW_COORDINATOR_UPDATE
              value: "true"
            # Cooperative-cgroup CPU lever, now a no-op: storage and conductor
            # no longer share a container cgroup, so there is no intra-cgroup
            # CPU race for niceness to arbitrate. Explicitly "0" (disabled) so
            # the conductor is not gratuitously de-prioritised against nothing.
            # The k8s-native lever for this concern is resources/PriorityClass.
            - name: ELOHIM_CONDUCTOR_NICE
              value: "0"
            # --- Storage features: ALL OFF ---
            # These are clap bool flags (main.rs Args) with ValueParser::bool(),
            # so "false" is parsed as false and an unparseable value hard-errors
            # at startup rather than silently defaulting.
            # Deliberately ABSENT from this pod: HOLOCHAIN_ADMIN_URL and
            # ELOHIM_STORAGE_PEER_POLICY_PATH. Setting admin_url here would
            # start a SECOND PeerStatus heartbeat, bridge supervisor and signal
            # subscriber set for this human — see the socat note in the header.
            - name: ENABLE_CONTENT_DB
              value: "false"
            - name: ENABLE_IMPORT_API
              value: "false"
            - name: ENABLE_P2P
              value: "false"
          ports:
            # elohim-storage HTTP — probe surface only, no Service port.
            - name: storage-http
              containerPort: 8090
              protocol: TCP
          resources:
            requests:
              memory: "1280Mi"
              cpu: "750m"
            limits:
              memory: "5120Mi"
              cpu: "4000m"
          volumeMounts:
            - name: holochain-data
              mountPath: /var/local/lib/holochain
            - name: conductor-config
              mountPath: /etc/holochain/conductor-config.yaml
              subPath: conductor-config.yaml
            - name: happ-volume
              mountPath: /opt/holochain
            # The image's CMD passes `--storage-dir /data` unconditionally, and
            # BlobStore creates it at boot. With ENABLE_CONTENT_DB=false nothing
            # durable is written there, so a scratch emptyDir satisfies the
            # binary without giving this pod a second real PVC. Do NOT mount the
            # storage-data PVC here — it is ReadWriteOnce and owned by the
            # storage pod.
            - name: storage-scratch
              mountPath: /data
          # Probe budgets copied verbatim from the pre-split storage StatefulSet
          # because they were tuned for exactly this workload: the embedded
          # conductor compiles WASM ribosomes during install_app on cold start,
          # and post-restart DHT resync can leave the process unresponsive for
          # minutes even with CPU headroom. startupProbe grants a 10-min grace
          # (40x15s) before liveness engages at all.
          # Why /health is the right signal HERE: in embedded mode main() awaits
          # conductor-ready + ensure_happ_installed BEFORE http_server.run(), so
          # the port only answers once the conductor is genuinely serving. (A
          # tcpSocket probe on 8444 would be a lie — socat listens immediately,
          # regardless of whether holochain is up behind it.)
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
        # ws-proxy: localhost→pod-network bridge for the conductor's admin/app
        # WebSockets. Identical to the legacy edgenode ws-proxy sidecar still in
        # genesis/orchestrator/manifests/edgenode/{alpha,prod}.yaml, and it keeps
        # the fleet-wide 8444/8445 external port convention so doorway, the
        # genesis seeder and elohim-storage's external mode all speak one shape.
        # External ports differ from internal because 0.0.0.0:4444 would
        # EADDRINUSE against the conductor's own 127.0.0.1:4444 bind in this
        # pod's netns.
        - name: ws-proxy
          image: alpine/socat:latest
          command: ['sh', '-c']
          args:
            - |
              socat TCP-LISTEN:8444,fork,reuseaddr TCP:127.0.0.1:4444 &
              socat TCP-LISTEN:8445,fork,reuseaddr TCP:127.0.0.1:4445 &
              wait
          ports:
            - name: admin-ws-fwd
              containerPort: 8444
              protocol: TCP
            - name: app-ws-fwd
              containerPort: 8445
              protocol: TCP
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "200m"
      volumes:
        # Shared volume for hApp (fetched by init container)
        - name: happ-volume
          emptyDir: {}
        # Conductor config from ConfigMap
        - name: conductor-config
          configMap:
            name: RESOURCE_PREFIX_PLACEHOLDER-config
        # Scratch for the image's unconditional `--storage-dir /data`
        - name: storage-scratch
          emptyDir: {}
        # THE MIGRATION HINGE: the chain/keystore PVC minted by the storage
        # StatefulSet's retired `holochain-data` volumeClaimTemplate, adopted
        # here by its existing name. StatefulSet PVC naming is
        # <template>-<statefulset>-<ordinal>, hence holochain-data-<prefix>-0.
        # NOT a volumeClaimTemplate: a template would mint a NEW, EMPTY PVC
        # named holochain-data-<prefix>-conductor-0 and re-genesis the node.
        - name: holochain-data
          persistentVolumeClaim:
            claimName: holochain-data-RESOURCE_PREFIX_PLACEHOLDER-0
---
# Headless service for pod-direct conductor DNS.
# Pod DNS: RESOURCE_PREFIX_PLACEHOLDER-conductor-0.RESOURCE_PREFIX_PLACEHOLDER-conductor-headless.NAMESPACE_PLACEHOLDER.svc.cluster.local
# Doorway (computeConductorUrls) and elohim-storage's external mode both use
# this pod-direct name, which bypasses Service port mapping — so they name the
# CONTAINER ports 8444/8445, not the Service ports 4444/4445.
apiVersion: v1
kind: Service
metadata:
  name: RESOURCE_PREFIX_PLACEHOLDER-conductor-headless
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: elohim-edgenode
    elohim-human: adam-firstman
    environment: ENV_PLACEHOLDER
    elohim-workload: conductor
    app.kubernetes.io/name: edgenode
    app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: conductor
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  clusterIP: None
  selector:
    app: elohim-edgenode
    elohim-human: adam-firstman
    environment: ENV_PLACEHOLDER
    elohim-workload: conductor
  ports:
    # Conductor admin WebSocket (via socat bridge 8444 → 127.0.0.1:4444)
    - name: admin-ws
      port: 4444
      targetPort: 8444
      protocol: TCP
    # Conductor app WebSocket (via socat bridge 8445 → 127.0.0.1:4445)
    - name: app-ws
      port: 4445
      targetPort: 8445
      protocol: TCP
---
# ClusterIP service for the conductor's admin/app WS.
# This is the name the genesis seeder resolves (genesis/Jenkinsfile
# getConductorAppUrls → ws://<prefix>-conductor:4445, admin derived as app-1).
# Before rung 2 those ports lived on the RESOURCE_PREFIX_PLACEHOLDER Service;
# they moved here because a Service selects ONE pod set and the storage Service
# must keep selecting the storage pod for :8090 and :9876.
apiVersion: v1
kind: Service
metadata:
  name: RESOURCE_PREFIX_PLACEHOLDER-conductor
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: elohim-edgenode
    elohim-human: adam-firstman
    environment: ENV_PLACEHOLDER
    elohim-workload: conductor
    app.kubernetes.io/name: edgenode
    app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: conductor
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  type: ClusterIP
  ports:
    - name: admin-ws
      port: 4444
      targetPort: 8444
      protocol: TCP
    - name: app-ws
      port: 4445
      targetPort: 8445
      protocol: TCP
  selector:
    app: elohim-edgenode
    elohim-human: adam-firstman
    environment: ENV_PLACEHOLDER
    elohim-workload: conductor
