# Adam — Genesis Peer (alpha)
# Stewards: all content at network birth, relaxes to commons after replication
# Trust topology: bootstraps to all five other conductors
# Resource profile: ELEVATED — handles initial content seed write before P2P replication kicks in
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: elohim-adam-alpha-peer-policy
  namespace: elohim-alpha
  labels:
    app: elohim-edgenode
    elohim-human: adam-firstman
    environment: alpha
    app.kubernetes.io/component: policy
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
data:
  peer-policy.toml: |
    [pool]
    accept_general_traffic = "auto"
    min_free_storage_pct = 20
    require_conductor_healthy = true

    [stewardship]
    accept_new_reserves = "auto"
    max_storage_pct = 80

    [network]
    # Spawns the two localhost→pod-network forwarders for conductor
    # admin (4444) and app (4445) WebSocket ports. Doorway reaches the
    # conductor exclusively through these forwarded ports; Holochain
    # itself stays on 127.0.0.1 (its safe default). elohim-storage is
    # the auth boundary for external traffic.
    # External ports 8444/8445 differ from internal ports 4444/4445
    # intentionally. The conductor binds 127.0.0.1:4444 and :4445 inside
    # the pod netns; a forwarder bind on 0.0.0.0:4444 would hit EADDRINUSE
    # because 0.0.0.0 overlaps with localhost. So the forwarder listens on
    # 8444/8445 externally and bridges to 4444/4445 on localhost — matching
    # the socat convention that legacy-pattern humans use.
    expose_conductor_externally = true
    conductor_external_bind = "0.0.0.0:8445"
    conductor_internal_port = 4445
    conductor_admin_external_bind = "0.0.0.0:8444"
    conductor_admin_internal_port = 4444
---
# ConfigMap for conductor configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: RESOURCE_PREFIX_PLACEHOLDER-config
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: elohim-edgenode
    elohim-human: adam-firstman
    environment: ENV_PLACEHOLDER
    app.kubernetes.io/name: edgenode
    app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
data:
  # hApp version to fetch from Harbor (dev-latest for dev environments, explicit version for prod)
  happ-version: "HAPP_TAG_PLACEHOLDER"
  conductor-config.yaml: |
    # Holochain Conductor Configuration for Elohim Protocol
    # Conductor binds to 127.0.0.1:4444/4445 (Holochain's safe default).
    # elohim-storage's forwarder bridges pod-network:4444/4445 → 127.0.0.1,
    # so doorway reaches admin via the pod-IP without Holochain itself
    # exposing externally. See peer-policy ConfigMap in this manifest.
    admin_interfaces:
      - driver:
          type: websocket
          port: 4444
          allowed_origins: "*"
    network:
      # Bootstrap served by Doorway gateway
      bootstrap_url: "BOOTSTRAP_URL_PLACEHOLDER"
      # Signal served on dedicated subdomain (tx5/SBD protocol requires path = pubkey)
      signal_url: "SIGNAL_URL_PLACEHOLDER"
      enable_mdns: false
      enable_relaying: true
      webrtc_config:
        iceServers:
          - urls: ["stun:stun.cloudflare.com:3478"]
          - urls: ["stun:stun.l.google.com:19302"]
          # Sovereign TURN relay — see the edgenode template's comment. adam is
          # the shem-side genesis anchor, the exact peer whose fetches toward the
          # household fail. The prior diagnostic relay (openrelay.metered.ca)
          # went globally dead 2026-07-13; replaced by our own coturn pair
          # (`genesis/orchestrator/manifests/infra/alpha-coturn-operations.yaml`,
          # `alpha-coturn-shem.yaml`). Keep the credential in sync with those
          # ConfigMaps' `user=`.
          # Dual-WAN ICE failover: operations (on-prem, alpha.elohim.host) relay
          # primary, shem (the apex — adam's own premises) redundant — either
          # works, ICE gathers candidates from both. Role-named DNS (2026-07-28):
          # no node names in public DNS; each name is beacon-managed and
          # dynamic-IP-safe. turns:5349 TLS is a later phase; 3478-first.
          - urls:
              - "turn:alpha.elohim.host:3478?transport=udp"
              - "turn:alpha.elohim.host:3478?transport=tcp"
            username: "elohim"
            credential: "alpha-turn-commons-2026"
          - urls:
              - "turn:elohim.host:3478?transport=udp"
              - "turn:elohim.host:3478?transport=tcp"
            username: "elohim"
            credential: "alpha-turn-commons-2026"
      # ARC-CONVERGENCE tuning — REVERTED TO UPSTREAM DEFAULTS for adam only
      # (2026-07-29). This host previously carried the household slow-WAN
      # profile (roundTimeoutMs 60000, maxConcurrentAcceptedRounds 4, added
      # 2026-07-20 for a slow-link node whose SQLite write guard was saturated
      # by concurrent gossip rounds). That profile is WRONG for a multi-tenant
      # conductor, and it is still correct for households — it stays in
      # `_edgenode-consolidated.template.yaml`; do not propagate this revert
      # there.
      #
      # Why: a cell is only an authority for a hash when its CURRENT storage arc
      # covers it, and kitsune2 resets every local agent's current arc to Empty
      # on join — i.e. on every conductor restart (kitsune2_core
      # factories/core_space.rs `local_agent_join`). The arc is promoted to FULL
      # only when a gossip round completes with zero mismatched sectors
      # (kitsune2_gossip storage_arc.rs). Until then, `target_arc_factor: 1`
      # notwithstanding, every zome get/get_links leaves the box and dies on
      # `request_timeout_s`. Probed on adam 2026-07-29: ONE "Updating storage arc
      # to full" line in the 44 minutes after a 10:57Z boot, across ~28 hosted
      # agents — arc convergence, not corpus size, is this node's bottleneck.
      #
      # The household profile actively slowed that convergence here: a stalled
      # round held its slot 4× longer (60s vs 15s) while inbound accept slots
      # were cut 10 → 4, on the one host in the fleet with the most cells
      # sharing a single per-space gossip initiate slot.
      advanced:
        k2Gossip:
          roundTimeoutMs: 15000
          maxConcurrentAcceptedRounds: 10
    # Fail FAST rather than hang (2026-07-29). Top-level conductor key (NOT under
    # `network:`) — holochain_p2p registers a sender-drop timer per outbound
    # request at this value. At the 60s default, elohim-storage's 15s per-attempt
    # heal deadline could never win: every projection-reconcile call was abandoned
    # while the conductor kept executing it, so heal reported healed=0 forever and
    # doorway B stayed `catching-up`. 10s puts the conductor's own give-up UNDER
    # the heal deadline, so a cold-arc read surfaces as a fast, countable failure
    # the circuit breaker can shed instead of a wedge.
    request_timeout_s: 10
    data_root_path: "/var/local/lib/holochain"
    keystore:
      type: lair_server_in_proc
      lair_root: "/var/local/lib/holochain/ks"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: RESOURCE_PREFIX_PLACEHOLDER
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: elohim-edgenode
    elohim-human: adam-firstman
    environment: ENV_PLACEHOLDER
    app.kubernetes.io/name: edgenode
    app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  serviceName: RESOURCE_PREFIX_PLACEHOLDER-headless
  replicas: 1
  # Retain PVCs across StatefulSet delete/recreate — needed when a forbidden-field
  # change (e.g. volumeClaimTemplates, selector) forces orphan-delete + reapply.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: elohim-edgenode
      elohim-human: adam-firstman
      environment: ENV_PLACEHOLDER
  template:
    metadata:
      annotations:
        # Content digest of the hApp behind the floating happ-version tag,
        # resolved at render time (Jenkinsfile resolveHappDigest). The tag is
        # mutable — a DNA-pipeline rebuild moves dev-latest/latest to new hApp
        # bytes with NO edge commit, leaving the rest of this pod template
        # byte-identical. Stamping the digest here makes such a move change the
        # StatefulSet spec, so `kubectl apply` reports "configured" and Adam's
        # genesis-peer surge guard lets the conductor rollout restart proceed —
        # keeping the bootstrap pair (adam + matthew) on the same DNA hash rather
        # than skipping the restart on "unchanged" → DNA-hash divergence → DHT
        # partition. FAIL-SAFE: on resolution failure the Jenkinsfile stamps a
        # unique marker, never empty/stale, so the deploy still restarts.
        # (Adam + the consolidated template must carry this in lockstep — the
        # genesis pair moves together.)
        elohim.host/happ-digest: "HAPP_DIGEST_PLACEHOLDER"
        # Force a rolling restart on next apply so Adam's pod picks up the
        # Phase A elohim-storage image published by edge #901. Holochain
        # #1125 deployed Adam's peer-policy ConfigMap before edge finished
        # publishing the new image, so the running pod has the ConfigMap
        # mounted but no forwarder code to honor it. Bump this timestamp
        # to force another rollout whenever the running image lags the
        # latest dev-latest.
        kubectl.kubernetes.io/restartedAt: "2026-04-21T07:30:00Z"
      labels:
        app: elohim-edgenode
        elohim-human: adam-firstman
        environment: ENV_PLACEHOLDER
        app.kubernetes.io/name: edgenode
        app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
        app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
        app.kubernetes.io/component: data
        app.kubernetes.io/part-of: elohim
        app.kubernetes.io/managed-by: jenkins
    spec:
      securityContext:
        fsGroup: 1000
      # Adam: remote-side bootstrap anchor on shem — mirrors Matthew's role across WireGuard
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - remote
      # Tolerate the WAN/remote-zone taint: shem is tainted remote-wan=true:NoSchedule
      # by the operator to keep cluster infra + dev tooling off the ISP-latency node.
      # Adam is node-type=remote (shem bootstrap anchor), so he must tolerate it to be
      # schedulable there after a reinit. Pairs with the node-type affinity above.
      tolerations:
        - key: remote-wan
          operator: Exists
          effect: NoSchedule
      # shem's GFiber router hairpin-intercepts the apex hostnames (elohim.host,
      # signal.elohim.host) back to its own WAN IP instead of routing to shem's
      # own ingress — the router answers with its self-signed web UI cert
      # (ssl_verify_result=18) rather than proxying through. Rendered by
      # deployHumanManifest via the same HOST_ALIASES_PLACEHOLDER token as the
      # consolidated template — non-empty only when this env has a doorwayB
      # split (alpha today); empty ([]) otherwise, so a future non-alpha
      # placement for adam never bakes in shem's alpha-specific IP. See
      # genesis/data/timeline/backlog/shem-conductors-signal-hairpin-suspect-dht-silent.md.
      hostAliases: HOST_ALIASES_PLACEHOLDER
      # Init container fetches hApp from Harbor registry using oras
      initContainers:
        - name: happ-fetcher
          image: ghcr.io/oras-project/oras:v1.1.0
          command: ['sh', '-c']
          args:
            - |
              set -e
              echo "Fetching hApp from Harbor registry..."
              echo "Version: ${HAPP_VERSION}"

              # Login to Harbor and pull artifact
              oras pull harbor.ethosengine.com/ethosengine/elohim-happ:${HAPP_VERSION} -o /happ

              if [ -f /happ/elohim.happ ]; then
                echo "hApp downloaded successfully from Harbor"
                ls -lh /happ/elohim.happ
              else
                echo "Failed to download hApp from Harbor"
                exit 1
              fi
          env:
            - name: HAPP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: RESOURCE_PREFIX_PLACEHOLDER-config
                  key: happ-version
          volumeMounts:
            - name: happ-volume
              mountPath: /happ
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      containers:
        # elohim-node: unified conductor + storage + P2P
        # Manages holochain conductor as embedded child process.
        # Replaces: edgenode + ws-proxy + elohim-storage + happ-installer
        - name: elohim-node
          image: harbor.ethosengine.com/ethosengine/elohim-storage:STORAGE_TAG_PLACEHOLDER
          imagePullPolicy: Always
          env:
            - name: HUMAN_ID
              value: "human-adam-firstman"
            # Genesis self-heal (OPERATOR-AUTHORIZED bootstrap) — same as the consolidated template:
            # the pod populates its own human's agent_pub_key from its own cell key (uhCAk),
            # NULL-only, + mints a session so the provide-rows seeder's /auth/me returns 200.
            - name: GENESIS_SELF_HEAL_IDENTITY
              value: "1"
            - name: SELF_HUMAN_ID
              value: "human-adam-firstman"
            - name: RUST_LOG
              value: "info,elohim_storage=debug"
            # --- Embedded conductor mode ---
            - name: EMBEDDED_CONDUCTOR
              value: "true"
            - name: CONDUCTOR_CONFIG_PATH
              value: "/etc/holochain/conductor-config.yaml"
            - name: CONDUCTOR_DATA_DIR
              value: "/var/local/lib/holochain"
            - name: HAPP_PATH
              value: "/opt/holochain/elohim.happ"
            # Admin-WS request timeout (seconds) for the embedded conductor. Covers
            # the cold FIRST hApp install (single-threaded wasm compile + genesis),
            # which on shem's per-core speed exceeds holochain_client's 60s default
            # → `install_app ... Websocket error: Timeout` → crash-loop. adam runs
            # warm today, but a genesis self-heal wipe re-triggers a cold install,
            # so the apex needs the wider budget too. Tunable here without a
            # rebuild; keep < the deploy rollout-status timeout (600s). Default 180.
            - name: HAPP_INSTALL_TIMEOUT_SECS
              value: "180"
            # Path to the peer-policy mount — enables conductor forwarders.
            - name: ELOHIM_STORAGE_PEER_POLICY_PATH
              value: "/etc/elohim/peer-policy.toml"
            # --- Storage config (unchanged) ---
            - name: HOLOCHAIN_ADMIN_URL
              value: "ws://localhost:4444"
            - name: HOLOCHAIN_APP_URL
              value: "ws://localhost:4445"
            - name: HOLOCHAIN_APP_ID
              value: "elohim"
            # Hand-rendered manifest (no template sed): set the DNA-drift
            # auto-reinstall gate directly. adam is alpha (ephemeral, re-seeded)
            # and the genesis pair with matthew — both MUST land the same DNA
            # hash or they partition onto different DHTs, so adam needs this too.
            - name: ALLOW_DNA_REINSTALL
              value: "true"
            - name: ENABLE_IMPORT_API
              value: "true"
            - name: ENABLE_CONTENT_DB
              value: "true"
            # Storage r2d2 read pool over content.db (elohim-storage init_pool;
            # compiled default 10). matthew runs 20 (deployments.json
            # edgenodeDbPoolSize) for read contention; adam — the HEAVIER
            # doorway-B (elohim.host) backend — was on the unset default 10.
            # Match matthew (2026-07-07, adam read-saturation relief).
            - name: STORAGE_DB_POOL_SIZE
              value: "20"
            - name: IMPORT_CHUNK_SIZE
              value: "50"
            - name: IMPORT_CHUNK_DELAY_MS
              value: "300"
            - name: ENABLE_P2P
              value: "true"
            - name: P2P_PORT
              value: "9876"
            - name: DISABLE_MDNS
              value: "true"
            # Peer mesh — computed by deployHumanManifest from topology
            - name: P2P_BOOTSTRAP_NODES
              value: "P2P_BOOTSTRAP_NODES_PLACEHOLDER"
            - name: RELAY_MODE
              value: "server"
            # Node-shape self-registration at boot (Task C7)
            - name: DEVICE_ARCHETYPE
              value: "family-node-base"
            - name: HOUSEHOLD_ID
              value: "household-adam"
            - name: NODE_ROLE
              value: "archival"
            - name: REGION
              value: "us-central"
          ports:
            # Conductor admin WebSocket — exposed via elohim-storage forwarder
            # on 8444 (bridges to conductor's 127.0.0.1:4444). Port 4444 on
            # the pod network is unreachable because 0.0.0.0:4444 would
            # collide with the conductor's localhost bind in the same netns.
            - name: admin-ws-fwd
              containerPort: 8444
              protocol: TCP
            # Conductor app WebSocket — exposed via forwarder on 8445
            # (bridges to conductor's 127.0.0.1:4445). Same rationale as admin.
            - name: app-ws-fwd
              containerPort: 8445
              protocol: TCP
            # elohim-storage HTTP API
            - name: storage-http
              containerPort: 8090
              protocol: TCP
            # P2P libp2p transport
            - name: p2p
              containerPort: 9876
              protocol: TCP
          # Cooperative memory pool — conductor + storage share one cgroup.
          # Sized ABOVE matthew (device-family-node-base baseline): adam is the
          # shem-side member of the genesis pair (deployments.json adam.
          # $genesisPeerComment) AND, since 2026-05-27, the storage backend
          # behind doorway-B (elohim.host) AND the primary /account/import seed
          # target — three concurrent read-heavy roles vs matthew's single doorway.
          # $cpuBumpComment (2026-07-07): cpu limit 3000m→8000m, request 1000m→1500m.
          # ROOT CAUSE: adam's conductor SQLite read pool = max(2*cpus, 8); at the
          # old 3000m limit it detected 3 cores → floored at 8 readers, which
          # sustained-saturated (Util 650-3300%; EPR router failed over off adam
          # for hours — backlog adam-genesis-anchor-sustained-saturation-post-storm).
          # 8000m → 8 detected cores → max_readers=16 (2x the pool) + doorway-B
          # request-serving headroom. The 2026-06-15 matthew bump to 4000m/pool-20
          # never propagated here (adam uses THIS explicit manifest, not the
          # template) — this closes that drift and then some. Keep limit >4000m to
          # hold max_readers above the 8 floor; restore toward the archetype floor
          # once the anchor read-load is measured settled.
          resources:
            requests:
              memory: "2Gi"
              cpu: "1500m"
            limits:
              memory: "8Gi"
              cpu: "8000m"
          volumeMounts:
            - name: holochain-data
              mountPath: /var/local/lib/holochain
            - name: storage-data
              mountPath: /data
            - name: conductor-config
              mountPath: /etc/holochain/conductor-config.yaml
              subPath: conductor-config.yaml
            - name: happ-volume
              mountPath: /opt/holochain
            - name: peer-policy
              mountPath: /etc/elohim/peer-policy.toml
              subPath: peer-policy.toml
              readOnly: true
          # Generous-probe pattern (2026-05-27) — mirrors the consolidated
          # template; see _edgenode-consolidated.template.yaml for the
          # full rationale (install_app + CFS-throttling tolerance).
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
      volumes:
        # Shared volume for hApp (fetched by init container)
        - name: happ-volume
          emptyDir: {}
        # Conductor config from ConfigMap
        - name: conductor-config
          configMap:
            name: RESOURCE_PREFIX_PLACEHOLDER-config
        - name: peer-policy
          configMap:
            name: elohim-adam-alpha-peer-policy
  # Per-pod persistent volumes — each StatefulSet replica gets its own PVCs
  # Named volumes are referenced in volumeMounts above
  volumeClaimTemplates:
    - metadata:
        name: holochain-data
      spec:
        accessModes: [ReadWriteOnce]
        # Node-local storage — P2P dataplane is the replication layer, not k8s
        storageClassName: "STORAGE_CLASS_PLACEHOLDER"
        resources:
          requests:
            storage: 20Gi
    - metadata:
        name: storage-data
      spec:
        accessModes: [ReadWriteOnce]
        # Node-local storage — P2P dataplane is the replication layer, not k8s
        storageClassName: "STORAGE_CLASS_PLACEHOLDER"
        resources:
          requests:
            storage: 20Gi
---
# Headless service for StatefulSet DNS-based peer discovery
# Pod gets stable DNS name: RESOURCE_PREFIX_PLACEHOLDER-0.RESOURCE_PREFIX_PLACEHOLDER-headless.NAMESPACE_PLACEHOLDER.svc.cluster.local
# Doorway uses these DNS names in CONDUCTOR_URLS for per-conductor routing
apiVersion: v1
kind: Service
metadata:
  name: RESOURCE_PREFIX_PLACEHOLDER-headless
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: elohim-edgenode
    elohim-human: adam-firstman
    environment: ENV_PLACEHOLDER
    app.kubernetes.io/name: edgenode
    app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  clusterIP: None
  selector:
    app: elohim-edgenode
    elohim-human: adam-firstman
    environment: ENV_PLACEHOLDER
  ports:
    # Conductor admin WebSocket (via forwarder bridge 8444→127.0.0.1:4444)
    - name: admin-ws
      port: 4444
      targetPort: 8444
      protocol: TCP
    # Conductor app WebSocket (via forwarder bridge 8445→127.0.0.1:4445)
    - name: app-ws
      port: 4445
      targetPort: 8445
      protocol: TCP
    - name: p2p
      port: 9876
      targetPort: 9876
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: RESOURCE_PREFIX_PLACEHOLDER
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: elohim-edgenode
    elohim-human: adam-firstman
    environment: ENV_PLACEHOLDER
    app.kubernetes.io/name: edgenode
    app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  type: ClusterIP
  ports:
    # Conductor admin WebSocket (via elohim-storage forwarder bridge
    # 0.0.0.0:8444 → 127.0.0.1:4444 — same external port convention as
    # legacy socat humans, so doorway can hit :4444 uniformly)
    - name: admin-ws
      port: 4444
      targetPort: 8444
      protocol: TCP
    # Conductor app WebSocket (via forwarder bridge 8445 → 4445)
    - name: app-ws
      port: 4445
      targetPort: 8445
      protocol: TCP
    # elohim-storage HTTP API
    - name: storage-db
      port: 8090
      targetPort: 8090
      protocol: TCP
    # P2P libp2p transport
    - name: p2p
      port: 9876
      targetPort: 9876
      protocol: TCP
  selector:
    app: elohim-edgenode
    elohim-human: adam-firstman
    environment: ENV_PLACEHOLDER
