# Adam — Genesis Peer (alpha), STORAGE workload.
#
# Hand-baked twin of _edgenode-consolidated.template.yaml. Its conductor half
# lives in adam-firstman-conductor.yaml (rung 2 of the upgrade-velocity debt
# snowball) — see that file and the shared templates' headers for the PVC
# continuity trick, the two-cadence image pin, the deploy ordering and the
# rollback. Keep this file and the shared storage template in lockstep.
#
# Stewards: all content at network birth, relaxes to commons after replication
# Trust topology: bootstraps to all five other conductors
# Resource profile: ELEVATED — handles initial content seed write before P2P replication kicks in
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: elohim-adam-alpha-runtime-config
  namespace: elohim-alpha
  labels:
    app: elohim-edgenode
    elohim-human: adam-firstman
    environment: alpha
    app.kubernetes.io/component: runtime-config
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
data:
  runtime-config.toml: |
    # Rung 4 — config as runtime surface (upgrade-propagation-p2p-design-arc).
    # Keys here OVERRIDE the node's boot env WITHOUT any restart: kubelet
    # propagates edits to the mounted file and src/runtime_config.rs applies
    # hot-reloadable settings within its poll interval, logging old -> new.
    # Removing a key restores the boot value. GET /admin/runtime-config on the
    # node shows effective values + provenance. Example:
    #   ELOHIM_OBEY_CARRIED_ELECTION = "true"
    # Per-human overrides render from deployments.json `runtimeConfig` (a map of
    # KEY -> string) as TOML lines on the next line; a human without the field
    # renders this ConfigMap byte-identical to the comment-only body (the line
    # is deleted, not blanked). This is the fleet's canary knob: e.g.
    #   "runtimeConfig": { "ELOHIM_RELEASE_CHANNELS": "runtime:coordinators:elohim:<channel>=canary" }
    RUNTIME_CONFIG_BODY_PLACEHOLDER
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: elohim-adam-alpha-peer-policy
  namespace: elohim-alpha
  labels:
    app: elohim-edgenode
    elohim-human: adam-firstman
    environment: alpha
    app.kubernetes.io/component: policy
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
data:
  peer-policy.toml: |
    [pool]
    accept_general_traffic = "auto"
    min_free_storage_pct = 20
    require_conductor_healthy = true

    [stewardship]
    accept_new_reserves = "auto"
    max_storage_pct = 80

    [network]
    # Spawns the two localhost→pod-network forwarders for conductor
    # admin (4444) and app (4445) WebSocket ports. Doorway reaches the
    # conductor exclusively through these forwarded ports; Holochain
    # itself stays on 127.0.0.1 (its safe default). elohim-storage is
    # the auth boundary for external traffic.
    # External ports 8444/8445 differ from internal ports 4444/4445
    # intentionally. The conductor binds 127.0.0.1:4444 and :4445 inside
    # the pod netns; a forwarder bind on 0.0.0.0:4444 would hit EADDRINUSE
    # because 0.0.0.0 overlaps with localhost. So the forwarder listens on
    # 8444/8445 externally and bridges to 4444/4445 on localhost — matching
    # the socat convention that legacy-pattern humans use.
    # OFF since rung 2 — no conductor in THIS pod to forward to; the bridge is
    # the socat ws-proxy sidecar in adam-firstman-conductor.yaml. Keys kept
    # (PolicyConfig requires the section) but inert while this is false.
    expose_conductor_externally = false
    conductor_external_bind = "0.0.0.0:8445"
    conductor_internal_port = 4445
    conductor_admin_external_bind = "0.0.0.0:8444"
    conductor_admin_internal_port = 4444
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: RESOURCE_PREFIX_PLACEHOLDER
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: elohim-edgenode
    elohim-human: adam-firstman
    environment: ENV_PLACEHOLDER
    app.kubernetes.io/name: edgenode
    app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  serviceName: RESOURCE_PREFIX_PLACEHOLDER-headless
  replicas: 1
  # Retain PVCs across StatefulSet delete/recreate — needed when a forbidden-field
  # change (e.g. volumeClaimTemplates, selector) forces orphan-delete + reapply.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: elohim-edgenode
      elohim-human: adam-firstman
      environment: ENV_PLACEHOLDER
  template:
    metadata:
      annotations:
        # Force a rolling restart on next apply so Adam's pod picks up the
        # Phase A elohim-storage image published by edge #901. Holochain
        # #1125 deployed Adam's peer-policy ConfigMap before edge finished
        # publishing the new image, so the running pod has the ConfigMap
        # mounted but no forwarder code to honor it. Bump this timestamp
        # to force another rollout whenever the running image lags the
        # latest dev-latest.
        kubectl.kubernetes.io/restartedAt: "2026-04-21T07:30:00Z"
      labels:
        app: elohim-edgenode
        elohim-human: adam-firstman
        environment: ENV_PLACEHOLDER
        # Workload discriminator (rung 2) — additive; .spec.selector above is
        # immutable and keeps matching on the original three labels.
        elohim-workload: storage
        app.kubernetes.io/name: edgenode
        app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
        app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
        app.kubernetes.io/component: data
        app.kubernetes.io/part-of: elohim
        app.kubernetes.io/managed-by: jenkins
    spec:
      securityContext:
        fsGroup: 1000
      # Adam: remote-side bootstrap anchor on shem — mirrors Matthew's role across WireGuard
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - remote
      # Tolerate the WAN/remote-zone taint: shem is tainted remote-wan=true:NoSchedule
      # by the operator to keep cluster infra + dev tooling off the ISP-latency node.
      # Adam is node-type=remote (shem bootstrap anchor), so he must tolerate it to be
      # schedulable there after a reinit. Pairs with the node-type affinity above.
      tolerations:
        - key: remote-wan
          operator: Exists
          effect: NoSchedule
      # shem's GFiber router hairpin-intercepts the apex hostnames (elohim.host,
      # signal.elohim.host) back to its own WAN IP instead of routing to shem's
      # own ingress — the router answers with its self-signed web UI cert
      # (ssl_verify_result=18) rather than proxying through. Rendered by
      # deployHumanManifest via the same HOST_ALIASES_PLACEHOLDER token as the
      # consolidated template — non-empty only when this env has a doorwayB
      # split (alpha today); empty ([]) otherwise, so a future non-alpha
      # placement for adam never bakes in shem's alpha-specific IP. See
      # genesis/data/timeline/backlog/shem-conductors-signal-hairpin-suspect-dht-silent.md.
      hostAliases: HOST_ALIASES_PLACEHOLDER
      # No initContainers: the happ-fetcher moved to
      # adam-firstman-conductor.yaml with the hApp bundle it fetches (rung 2).
      containers:
        # elohim-node: unified conductor + storage + P2P
        # Manages holochain conductor as embedded child process.
        # Replaces: edgenode + ws-proxy + elohim-storage + happ-installer
        - name: elohim-node
          image: STORAGE_IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          env:
            - name: HUMAN_ID
              value: "human-adam-firstman"
            # Genesis self-heal (OPERATOR-AUTHORIZED bootstrap) — same as the consolidated template:
            # the pod populates its own human's agent_pub_key from its own cell key (uhCAk),
            # NULL-only, + mints a session so the provide-rows seeder's /auth/me returns 200.
            - name: GENESIS_SELF_HEAL_IDENTITY
              value: "1"
            - name: SELF_HUMAN_ID
              value: "human-adam-firstman"
            - name: RUST_LOG
              # kitsune2 debug targets: temporary diagnosis instrument for the
              # iroh-lane bootstrap-publish silence (PUT failures log at debug!
              # in kitsune2_bootstrap_client) — remove after
              # backlog/iroh-lane-bootstrap-publish-dark closes.
              value: "info,elohim_storage=debug,kitsune2_core=debug,kitsune2_bootstrap_client=debug"
            # --- External conductor mode (rung 2) ---
            # EMBEDDED_CONDUCTOR is a clap bool flag with ValueParser::bool(),
            # so "false" parses as false and a typo hard-errors at startup.
            # External mode = this flag false AND HOLOCHAIN_ADMIN_URL set;
            # main.rs then runs HcClientRegistry::connect + the bridge
            # supervisor, which owns retry/reconnect and token re-minting.
            # CONDUCTOR_CONFIG_PATH / CONDUCTOR_DATA_DIR / HAPP_PATH /
            # HAPP_INSTALL_TIMEOUT_SECS / ALLOW_DNA_REINSTALL moved to
            # adam-firstman-conductor.yaml (install-time knobs). The coordinator
            # hot-swap gate stays HERE as ALLOW_COORDINATOR_UPDATE (below).
            - name: EMBEDDED_CONDUCTOR
              value: "false"
            # Path to the peer-policy mount. Still required: [pool] /
            # [stewardship] gate the PeerStatus heartbeat and the signal
            # subscribers. Its [network] block is now inert.
            - name: ELOHIM_STORAGE_PEER_POLICY_PATH
              value: "/etc/elohim/peer-policy.toml"
            # --- Conductor attachment ---
            # Pod-direct headless DNS of adam's conductor StatefulSet, naming
            # the socat-bridged CONTAINER ports (8444 admin / 8445 app).
            # Pod-direct names bypass Service port mapping, so 4444/4445 would
            # be wrong here even though the conductor ClusterIP Service
            # publishes them. Rendered from CONDUCTOR_WS_HOST_PLACEHOLDER, the
            # same value doorway gets from computeConductorUrls.
            - name: HOLOCHAIN_ADMIN_URL
              value: "ws://CONDUCTOR_WS_HOST_PLACEHOLDER:8444"
            - name: HOLOCHAIN_APP_URL
              value: "ws://CONDUCTOR_WS_HOST_PLACEHOLDER:8445"
            - name: HOLOCHAIN_APP_ID
              value: "elohim"
            # Adopt-before-author gate — hand-rendered (adam is alpha). See the
            # template's inline comment; adam is a supplier peer, so the
            # both-sides-missing exit needs him on.
            - name: ELOHIM_ADOPT_BEFORE_AUTHOR
              value: "true"
            # Coordinator hot-swap gate — read by the STORAGE process
            # (happ_manager::coordinator_update_allowed). The conductor split
            # moved ALLOW_DNA_REINSTALL to adam-firstman-conductor.yaml, so this
            # guard fell closed here (holochain #1414, 2026-09-02: adam 403
            # "coordinator hot-swap is not permitted on this node", rollout 0/7).
            # alpha is non-prod: true, mirroring the conductor's ALLOW_DNA_REINSTALL.
            - name: ALLOW_COORDINATOR_UPDATE
              value: "true"
            # Ghost-declaration decay — hand-rendered like the gate above (adam
            # is alpha; see the template's inline comment for the evidence
            # discipline and the 2026-08-10 batch-3 diagnosis).
            - name: ELOHIM_GHOST_DECLARATION_DECAY
              value: "true"
            # Carry-the-election — hand-rendered like the gates above (adam is
            # alpha; see the template's inline comment). adam is the peer whose
            # sweep measured 2,603/2,619 divergent-refused per sweep on
            # 2026-08-31 — this flag is that freeze's exit.
            - name: ELOHIM_OBEY_CARRIED_ELECTION
              value: "true"
            # Rung 4: where the runtime-config watcher reads (mounted from the
            # elohim-adam-alpha-runtime-config ConfigMap; see its header).
            - name: ELOHIM_RUNTIME_CONFIG_PATH
              value: "/etc/elohim/runtime-config.toml"
            # Evidence-absent backoff — same conservative 6h bake as the
            # template (see its inline comment).
            - name: ELOHIM_EVIDENCE_ABSENT_BACKOFF_SECS
              value: "21600"
            # T5 head-plane requester digest — same flip as the template
            # (2026-08-08, see its inline comment). Hand-rendered here like
            # the gates above; adam is a supplier peer with the largest
            # corpus, where digest-match enumeration skips matter most.
            - name: ELOHIM_HEAD_CORPUS_DIGEST
              value: "true"
            - name: ENABLE_IMPORT_API
              value: "true"
            - name: ENABLE_CONTENT_DB
              value: "true"
            # Storage r2d2 read pool over content.db (elohim-storage init_pool;
            # compiled default 10). matthew runs 20 (deployments.json
            # edgenodeDbPoolSize) for read contention; adam — the HEAVIER
            # doorway-B (elohim.host) backend — was on the unset default 10.
            # Match matthew (2026-07-07, adam read-saturation relief).
            - name: STORAGE_DB_POOL_SIZE
              value: "20"
            - name: IMPORT_CHUNK_SIZE
              value: "50"
            - name: IMPORT_CHUNK_DELAY_MS
              value: "300"
            - name: ENABLE_P2P
              value: "true"
            - name: P2P_PORT
              value: "9876"
            - name: DISABLE_MDNS
              value: "true"
            # Peer mesh — computed by deployHumanManifest from topology
            - name: P2P_BOOTSTRAP_NODES
              value: "P2P_BOOTSTRAP_NODES_PLACEHOLDER"
            - name: RELAY_MODE
              value: "server"
            # Node-shape self-registration at boot (Task C7)
            - name: DEVICE_ARCHETYPE
              value: "family-node-base"
            - name: HOUSEHOLD_ID
              value: "household-adam"
            - name: NODE_ROLE
              value: "archival"
            - name: REGION
              value: "us-central"
            # Dataplane transport backend (storage layer, NOT the conductor transport).
            # "dual" runs libp2p + iroh side-by-side — campaign Wave-2 E3, decision 2026-08-04.
            # Boot sentinel: "Dual: DualGossipPublisher wired into P2PNode". Rollback: "libp2p".
            - name: ELOHIM_TRANSPORT_BACKEND
              value: "dual"
          ports:
            # Conductor admin/app WS (8444/8445) are NOT served here since
            # rung 2 — they belong to the conductor StatefulSet's ws-proxy.
            # elohim-storage HTTP API
            - name: storage-http
              containerPort: 8090
              protocol: TCP
            # P2P libp2p transport
            - name: p2p
              containerPort: 9876
              protocol: TCP
          # Storage's SHARE of adam's one declared envelope since rung 2.
          # BUDGET NEUTRALITY: this block plus adam-firstman-conductor.yaml's
          # sums EXACTLY to deployments.json adam.edgenode* (2Gi/8Gi,
          # 1500m/8000m) — the split re-partitions, it never adds load:
          #   memory request 2048Mi = 1280Mi (conductor 5/8) +  768Mi (here)
          #   memory limit   8192Mi = 5120Mi (conductor 5/8) + 3072Mi (here)
          #   cpu request     1500m =   750m (conductor 1/2) +   750m (here)
          #   cpu limit       8000m =  4000m (conductor 1/2) +  4000m (here)
          # validate-deployments.ts check (3) asserts that SUM against the
          # deployments.json record, so the two files can neither drift apart
          # nor quietly inflate adam's real footprint.
          #
          # The pre-split rationale for the 8000m single-pod limit (2026-07-07,
          # genesis anchor + doorway-B + seed target: 8 detected cores → the
          # conductor's SQLite read pool max(2*cpus,8) → 16 readers) now belongs
          # to the CONDUCTOR side, which is where that pool lives — see the
          # OPERATOR-OWNED note in adam-firstman-conductor.yaml's header for the
          # open question it raises. This side keeps 4000m of dedicated,
          # UNCONTENDED CPU: pre-split the storage handlers had to win a race
          # against conductor churn inside one cgroup (hence ELOHIM_CONDUCTOR_NICE
          # =10, now retired as a no-op).
          resources:
            requests:
              memory: "768Mi"
              cpu: "750m"
            limits:
              memory: "3072Mi"
              cpu: "4000m"
          volumeMounts:
            # holochain-data / conductor-config / happ-volume moved to
            # adam-firstman-conductor.yaml (rung 2).
            - name: storage-data
              mountPath: /data
            - name: peer-policy
              mountPath: /etc/elohim/peer-policy.toml
              subPath: peer-policy.toml
              readOnly: true
            # Rung 4 (config as runtime surface): a watched config file the
            # RUNNING node re-reads — kubelet propagates ConfigMap edits to
            # this mount without a pod restart, and the in-process watcher
            # (src/runtime_config.rs, ELOHIM_RUNTIME_CONFIG_PATH) applies
            # hot-reloadable settings in seconds. A flag flip is a ConfigMap
            # edit + apply, never a roll.
            - name: runtime-config
              mountPath: /etc/elohim/runtime-config.toml
              subPath: runtime-config.toml
              readOnly: true
          # Generous-probe pattern (2026-05-27) — mirrors the consolidated
          # template; see _edgenode-consolidated.template.yaml for the
          # full rationale (install_app + CFS-throttling tolerance).
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
      volumes:
        - name: peer-policy
          configMap:
            name: elohim-adam-alpha-peer-policy
        - name: runtime-config
          configMap:
            name: elohim-adam-alpha-runtime-config
  # Per-pod persistent volumes — each StatefulSet replica gets its own PVCs
  # Named volumes are referenced in volumeMounts above
  # The `holochain-data` template was RETIRED here in rung 2. Its already-minted
  # PVC (holochain-data-<prefix>-0) is Retained and is now mounted by
  # adam-firstman-conductor.yaml via explicit claimName — no rename, no
  # re-genesis, adam's agent key survives. Removing a volumeClaimTemplate is a
  # Forbidden StatefulSet spec update, so the first deploy after this change
  # takes deployHumanManifest's orphan-delete + reapply path (pods and PVCs
  # retained by name).
  volumeClaimTemplates:
    - metadata:
        name: storage-data
      spec:
        accessModes: [ReadWriteOnce]
        # Node-local storage — P2P dataplane is the replication layer, not k8s
        storageClassName: "STORAGE_CLASS_PLACEHOLDER"
        resources:
          requests:
            storage: 20Gi
---
# Headless service for StatefulSet DNS-based peer discovery
# Pod gets stable DNS name: RESOURCE_PREFIX_PLACEHOLDER-0.RESOURCE_PREFIX_PLACEHOLDER-headless.NAMESPACE_PLACEHOLDER.svc.cluster.local
# Doorway uses these DNS names in CONDUCTOR_URLS for per-conductor routing
apiVersion: v1
kind: Service
metadata:
  name: RESOURCE_PREFIX_PLACEHOLDER-headless
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: elohim-edgenode
    elohim-human: adam-firstman
    environment: ENV_PLACEHOLDER
    app.kubernetes.io/name: edgenode
    app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  clusterIP: None
  selector:
    app: elohim-edgenode
    elohim-human: adam-firstman
    environment: ENV_PLACEHOLDER
    elohim-workload: storage
  ports:
    # Conductor admin/app WS moved to <prefix>-conductor-headless (rung 2).
    - name: p2p
      port: 9876
      targetPort: 9876
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: RESOURCE_PREFIX_PLACEHOLDER
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: elohim-edgenode
    elohim-human: adam-firstman
    environment: ENV_PLACEHOLDER
    app.kubernetes.io/name: edgenode
    app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  type: ClusterIP
  ports:
    # Conductor admin/app WS (4444/4445) moved to the <prefix>-conductor
    # Service in rung 2 — a Service selects ONE pod set, and this one must keep
    # selecting the storage pod for :8090 and :9876.
    # elohim-storage HTTP API
    - name: storage-db
      port: 8090
      targetPort: 8090
      protocol: TCP
    # P2P libp2p transport
    - name: p2p
      port: 9876
      targetPort: 9876
      protocol: TCP
  selector:
    app: elohim-edgenode
    elohim-human: adam-firstman
    environment: ENV_PLACEHOLDER
    elohim-workload: storage
