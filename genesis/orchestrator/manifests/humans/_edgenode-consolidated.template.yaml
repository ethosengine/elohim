# Storage workload — one StatefulSet per human (elohim-node), sharing the
# human with the conductor StatefulSet rendered from
# _edgenode-conductor.template.yaml.
#
# Per-human values are injected by deployHumanManifest in
# elohim/holochain/Jenkinsfile, driven by
# genesis/orchestrator/data/deployments.json. This template is NOT applied
# directly; it's rendered through sed into a per-human manifest before
# kubectl apply.
#
# ── RUNG 2: THE CONDUCTOR MOVED OUT ─────────────────────────────────────────
# Until 2026-08, storage + conductor + happ-manager ran in ONE container, so
# every storage/doorway-adjacent commit rollout-restarted all 7 conductors
# (full-arc re-gossip surge, ~20min churn, hours of catch-up). The conductor
# now runs in its own StatefulSet, `<resourcePrefix>-conductor`, and this pod
# attaches to it over the WS bridge using elohim-storage's proven external
# mode (`--admin-url` / HOLOCHAIN_ADMIN_URL, main.rs: HcClientRegistry::connect
# + spawn_bridge_supervisor, which owns retry/reconnect).
#
# Deliberately UNCHANGED by that split, and load-bearing:
#   · this StatefulSet's NAME (so its Service DNS, its storage-data PVC and
#     the doorway/seed/coordswap rosters all stay byte-identical),
#   · the storage-data PVC (no reseed),
#   · the elohim-node container name + resources (validate-deployments.ts
#     asserts adam's manifest resources against the declared budget by that
#     container name).
# What DID change: the holochain-data volumeClaimTemplate is gone (the
# conductor STS adopts that PVC by explicit claimName), and the pod template
# gained `elohim-workload: storage` so the two workloads' Services and
# StatefulSet selectors can tell them apart. Removing a volumeClaimTemplate is
# a Forbidden StatefulSet spec update — the migration relies on the
# orphan-delete + reapply fallback already in deployHumanManifest, which
# retains PVCs by name (persistentVolumeClaimRetentionPolicy: Retain below).
#
# BUDGET NEUTRALITY (invariant, not a convention): the split never adds
# aggregate load to a node — it RE-PARTITIONS the existing envelope. This pod's
# resources and the conductor pod's sum EXACTLY to the human's declared
# `edgenode{Cpu,Memory}{Request,Limit}`, which stays the unit of account for the
# archetype floor, the explicit-manifest match, and the
# `test-bench-aggregate-capacity` portfolio validator (that validator sums
# edgenode* only — it cannot see conductor*/storage* fields, so a non-neutral
# split would double this human's real footprint invisibly). Re-size only with
# measured evidence PER SIDE, by moving edgenode*.
#
# ROLLBACK: delete the conductor StatefulSet, restore the holochain-data
# volumeClaimTemplate + volumeMount here and flip EMBEDDED_CONDUCTOR back to
# "true" with HOLOCHAIN_ADMIN_URL/APP_URL back on ws://localhost:444{4,5}.
# That is exactly the pre-rung-2 shape and re-adopts the same PVCs by name.
#
# Architecture:
#   Doorway / seeder → <prefix>-conductor Service :4444/:4445
#                    → socat ws-proxy 8444/8445 → 127.0.0.1:4444/:4445
#   Storage          → <prefix>-conductor-0.<prefix>-conductor-headless:8444/8445
#   P2P: elohim-node peers discover each other via headless service DNS.
#
# Ports (this workload):
#   - 8090: elohim-storage HTTP API
#   - 9876: P2P libp2p transport (cross-namespace via NetworkPolicy)
#   Conductor admin/app WS (4444/4445 → 8444/8445) live on the conductor
#   StatefulSet's own Services now; they are NOT served here.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: RESOURCE_PREFIX_PLACEHOLDER-runtime-config
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: elohim-edgenode
    elohim-human: HUMAN_LABEL_PLACEHOLDER
    environment: ENV_PLACEHOLDER
    app.kubernetes.io/component: runtime-config
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
data:
  runtime-config.toml: |
    # Rung 4 — config as runtime surface (upgrade-propagation-p2p-design-arc).
    # Keys here OVERRIDE the node's boot env WITHOUT any restart: kubelet
    # propagates edits to the mounted file and src/runtime_config.rs applies
    # hot-reloadable settings within its poll interval, logging old -> new.
    # Removing a key restores the boot value. GET /admin/runtime-config on the
    # node shows effective values + provenance. Example:
    #   ELOHIM_OBEY_CARRIED_ELECTION = "true"
    # Per-human overrides render from deployments.json `runtimeConfig` (a map of
    # KEY -> string) as TOML lines on the next line; a human without the field
    # renders this ConfigMap byte-identical to the comment-only body (the line
    # is deleted, not blanked). This is the fleet's canary knob: e.g.
    #   "runtimeConfig": { "ELOHIM_RELEASE_CHANNELS": "runtime:coordinators:elohim:<channel>=canary" }
    RUNTIME_CONFIG_BODY_PLACEHOLDER
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: RESOURCE_PREFIX_PLACEHOLDER-peer-policy
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: elohim-edgenode
    elohim-human: HUMAN_LABEL_PLACEHOLDER
    environment: ENV_PLACEHOLDER
    app.kubernetes.io/component: policy
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
data:
  peer-policy.toml: |
    [pool]
    accept_general_traffic = "auto"
    min_free_storage_pct = 20
    require_conductor_healthy = true

    [stewardship]
    accept_new_reserves = "auto"
    max_storage_pct = 80

    [network]
    # OFF since rung 2: there is no conductor in THIS pod to forward to.
    # elohim-storage's forwarder (src/forwarder.rs) hardcodes a 127.0.0.1
    # upstream, so leaving it enabled here would bind 8444/8445 and pipe
    # every connection into nothing. The admin/app WS bridge now lives in
    # the conductor StatefulSet as a socat ws-proxy sidecar
    # (_edgenode-conductor.template.yaml). The remaining keys are kept —
    # PolicyConfig requires the section — but are inert while
    # expose_conductor_externally is false.
    expose_conductor_externally = false
    conductor_external_bind = "0.0.0.0:8445"
    conductor_internal_port = 4445
    conductor_admin_external_bind = "0.0.0.0:8444"
    conductor_admin_internal_port = 4444
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: RESOURCE_PREFIX_PLACEHOLDER
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: elohim-edgenode
    elohim-human: HUMAN_LABEL_PLACEHOLDER
    environment: ENV_PLACEHOLDER
    app.kubernetes.io/name: edgenode
    app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  serviceName: RESOURCE_PREFIX_PLACEHOLDER-headless
  replicas: 1
  # Retain PVCs across StatefulSet delete/recreate — needed when a forbidden-field
  # change (e.g. volumeClaimTemplates, selector) forces orphan-delete + reapply.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: elohim-edgenode
      elohim-human: HUMAN_LABEL_PLACEHOLDER
      environment: ENV_PLACEHOLDER
  template:
    metadata:
      annotations:
        # Continuous CPU profiling — Grafana Alloy discovers pods by these
        # annotations and scrapes the Go-compatible pprof endpoint elohim-storage
        # serves on the storage-http port (env-gated by ELOHIM_PPROF_ENABLED
        # below; the binary defaults OFF so non-alpha deployments stay silent).
        # port_name (not port) so the target follows the named containerPort.
        profiles.grafana.com/cpu.scrape: "true"
        profiles.grafana.com/cpu.port_name: "storage-http"
        profiles.grafana.com/cpu.path: "/debug/pprof/profile"
      labels:
        app: elohim-edgenode
        elohim-human: HUMAN_LABEL_PLACEHOLDER
        environment: ENV_PLACEHOLDER
        # Workload discriminator (rung 2). The StatefulSet .spec.selector above
        # is IMMUTABLE, so it keeps matching on the original three labels and
        # this one is additive; the Services below narrow on it so they select
        # the storage pod and never the conductor pod.
        elohim-workload: storage
        app.kubernetes.io/name: edgenode
        app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
        app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
        app.kubernetes.io/component: data
        app.kubernetes.io/part-of: elohim
        app.kubernetes.io/managed-by: jenkins
    spec:
      securityContext:
        fsGroup: 1000
      # AFFINITY_COMMENT_PLACEHOLDER
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-type
                    operator: In
                    values: NODE_TYPE_VALUES_PLACEHOLDER
      # Tolerate the WAN/remote-zone taint so node-type=remote humans can land on
      # shem, which the operator taints remote-wan=true:NoSchedule to keep cluster
      # infra + dev tooling off the ISP-latency node (a CoreDNS/che-gateway replica
      # there added a WAN hop to everything). Inert for operations/edge/performance
      # humans — their node affinity keeps them off shem, so this is never exercised;
      # it's the "opt-in to the remote zone" half that pairs with the node-type
      # affinity above.
      tolerations:
        - key: remote-wan
          operator: Exists
          effect: NoSchedule
      # shem's GFiber router hairpin-intercepts the apex hostnames (elohim.host,
      # signal.elohim.host) back to its own WAN IP instead of routing to shem's
      # own ingress — the router answers with its self-signed web UI cert
      # (ssl_verify_result=18) rather than proxying through. Rendered per-human
      # by deployHumanManifest: non-empty ([{ip:"10.99.0.2", hostnames:[...]}])
      # only for shem-placed humans whose primary doorway is doorwayB (apex);
      # empty ([]) for on-prem humans (matthew/jessica/james) and for envs with
      # no doorwayB split (staging/prod). See
      # genesis/data/timeline/backlog/shem-conductors-signal-hairpin-suspect-dht-silent.md.
      # CAVEAT: 10.99.0.2 is shem's NODE IP hardcoded into the pod spec —
      # correct while these pods stay shem-pinned (nodeAffinity). If one ever
      # schedules elsewhere the alias goes SLOW-BUT-ROUTABLE over WireGuard
      # rather than failing loudly — hard to spot later; check here first when
      # a shem-placed conductor gets mysteriously slow after a reschedule.
      # NEVER alias alpha.elohim.host: it rides the other WAN (not hairpinned)
      # AND gossip peer URLs are minted on wss://signal.alpha.elohim.host —
      # aliasing it shem-local would break live gossip sessions, not just TURN.
      hostAliases: HOST_ALIASES_PLACEHOLDER
      # No initContainers: the happ-fetcher moved to the conductor
      # StatefulSet with the hApp bundle it fetches (rung 2).
      containers:
        # elohim-node: unified conductor + storage + P2P
        # Manages holochain conductor as embedded child process.
        # Replaces: edgenode + ws-proxy + elohim-storage + happ-installer
        - name: elohim-node
          image: STORAGE_IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          env:
            - name: HUMAN_ID
              value: "HUMAN_ID_PLACEHOLDER"
            # Genesis self-heal (OPERATOR-AUTHORIZED bootstrap): each pod populates its own
            # human's agent_pub_key from its own conductor cell key (uhCAk), NULL-only, and mints
            # a local session so the provide-rows seeder's /auth/me returns 200 — lights every
            # household resilience card. SELF_HUMAN_ID reuses the per-human HUMAN_ID_PLACEHOLDER
            # so each pod heals only its OWN identity. Household_id is left to the seeder (the
            # deploy HOUSEHOLD_ID differs from the seeded one). Superseded later by the
            # cross-signed coherent-transport-identity-resolver (this heal rotates over cleanly).
            - name: GENESIS_SELF_HEAL_IDENTITY
              value: "1"
            - name: SELF_HUMAN_ID
              value: "HUMAN_ID_PLACEHOLDER"
            - name: RUST_LOG
              # kitsune2 debug targets: temporary diagnosis instrument for the
              # iroh-lane bootstrap-publish silence (PUT failures log at debug!
              # in kitsune2_bootstrap_client) — remove after
              # backlog/iroh-lane-bootstrap-publish-dark closes.
              value: "info,elohim_storage=debug,kitsune2_core=debug,kitsune2_bootstrap_client=debug"
            # --- External conductor mode (rung 2) ---
            # EMBEDDED_CONDUCTOR is a clap bool flag with ValueParser::bool()
            # (main.rs Args), so "false" parses as false and a typo hard-errors
            # at startup rather than silently defaulting to embedded. External
            # mode is selected by this flag being false AND HOLOCHAIN_ADMIN_URL
            # being set: main.rs then runs HcClientRegistry::connect plus
            # spawn_bridge_supervisor, which owns retry/reconnect and re-mints
            # the app-interface token — the mechanism this split rides on.
            #
            # NOT set here any more, because they only read in embedded mode
            # and now live on the conductor StatefulSet:
            #   CONDUCTOR_CONFIG_PATH, CONDUCTOR_DATA_DIR, HAPP_PATH,
            #   HAPP_INSTALL_TIMEOUT_SECS, ALLOW_DNA_REINSTALL,
            #   ELOHIM_CONDUCTOR_NICE.
            - name: EMBEDDED_CONDUCTOR
              value: "false"
            # Path to the peer-policy mount. Still required here: it carries
            # [pool] / [stewardship] and gates the PeerStatus heartbeat and the
            # signal subscribers. Its [network] block is now inert (forwarders
            # off — see the peer-policy ConfigMap above).
            - name: ELOHIM_STORAGE_PEER_POLICY_PATH
              value: "/etc/elohim/peer-policy.toml"
            # --- Conductor attachment ---
            # Pod-direct headless DNS of the conductor StatefulSet, naming the
            # socat-bridged CONTAINER ports (8444 admin / 8445 app). Pod-direct
            # names bypass Service port mapping, so 4444/4445 would be wrong
            # here even though the conductor's ClusterIP Service does publish
            # them. CONDUCTOR_WS_HOST_PLACEHOLDER renders to
            # <prefix>-conductor-0.<prefix>-conductor-headless.<ns>.svc.cluster.local
            # — the same shape doorway gets from computeConductorUrls.
            - name: HOLOCHAIN_ADMIN_URL
              value: "ws://CONDUCTOR_WS_HOST_PLACEHOLDER:8444"
            - name: HOLOCHAIN_APP_URL
              value: "ws://CONDUCTOR_WS_HOST_PLACEHOLDER:8445"
            - name: HOLOCHAIN_APP_ID
              value: "elohim"
            # Gate for the deterministic /admin/seed/shard-manifest lever
            # (elohim-storage/src/http.rs, seed_shard_manifest.rs) — writes a
            # shard manifest + agent-keyed shard_locations for blob-backed
            # content WITHOUT waiting on full P2P gossip, so the blob-durability
            # a2o suite + the resilience card's "stewarding" column can light
            # deterministically on household-nodes. Off (403) by default so a
            # real deployment can never fabricate distribution; rows it writes
            # are stamped status="seeded" (never confused with runtime
            # distribute_shards rows). Same per-env rendering as
            # ALLOW_DNA_REINSTALL: true for alpha/staging (ephemeral,
            # test/demo-seeded), false for prod.
            - name: ALLOW_SEED_SHARD_MANIFEST
              value: "ALLOW_SEED_SHARD_MANIFEST_PLACEHOLDER"
            # Gate for the declared network-stakes seed lever
            # (PUT /admin/seed/network-stakes, seed_network_stakes.rs) — the
            # genesis seeder PUTs the corpus-declared trustBootstrap grant
            # (corpus.json, e.g. simulacra scoped to genesis-lamad, granted by
            # human-adam-firstman) so ManifestStakesResolver prices adoption
            # ceremony from the MODELED trust relationship instead of full
            # bootstrap scrutiny. Off (403) by default; the endpoint itself
            # also refuses stage=simulacra unless environment=preproduction.
            # Same per-env rendering as ALLOW_SEED_SHARD_MANIFEST: true for
            # alpha/staging, false for prod.
            - name: ALLOW_SEED_NETWORK_STAKES
              value: "ALLOW_SEED_NETWORK_STAKES_PLACEHOLDER"
            # Gate for the delegates-compute grant seed lever
            # (POST /admin/seed/delegates-compute, seed_delegates_compute.rs) —
            # the fixture writer for commitment-gated operator verbs (habit
            # operator-runtime-surface: a2o @concern:operator-runtime-surface
            # seeds/revokes an operator-reconcile grant through it). Off (403)
            # by default; same per-env rendering as its seed-lever siblings:
            # true for alpha/staging (preproduction fixtures), false for prod.
            - name: ALLOW_SEED_DELEGATES_COMPUTE
              value: "ALLOW_SEED_DELEGATES_COMPUTE_PLACEHOLDER"
            # Corpus-key -> h_app_id bridge for the stakes resolver
            # (trust/manifest_resolver.rs leg 3): a grant is scoped by corpus
            # id (genesis-lamad) but the adoption hot path resolves by
            # h_app_id (lamad). Only the DOCUMENTED mappings — aliases are
            # explicit declarations, never derived (genesis-humans' h_app_id
            # is imagodei, so prefix arithmetic is wrong in general). Static
            # across envs: without a seeded grant manifest the alias leg
            # resolves nothing, and the resolver stays fail-closed Bootstrap.
            - name: ELOHIM_NETWORK_STAKES_SCOPE_ALIASES
              value: "genesis-lamad=lamad,genesis-humans=imagodei"
            # Adopt-before-author gate (head_adoption): lets a node with NO
            # local chain for a content id declare a canonical head from a
            # carried record the zome fully re-proves in wasm (signature +
            # entry↔action + target-id binding). The both-sides-missing
            # residual's only automated exit — dominant for genesis-seeded
            # corpora whose fixture authors never had live chains. Same
            # per-env rendering as ALLOW_DNA_REINSTALL: true for
            # alpha/staging, false for prod (prod participation is a
            # governance decision, not a default). Storage logs a boot WARN
            # when enabled; unset/false is behavior-identical to pre-flag.
            - name: ELOHIM_ADOPT_BEFORE_AUTHOR
              value: "ADOPT_BEFORE_AUTHOR_PLACEHOLDER"
            # Ghost-declaration decay (head_adoption): lets the witness sweeps
            # author a fresh provable head over a declaration whose evidence is
            # POSITIVELY dead — own conductor observed empty this sweep AND the
            # advertising peer's responder stated no record exists (the
            # evidence-absent backoff above). The batch-3 phantom-declaration
            # exit (2026-08-10 live diagnosis: ~2000 declared heads per
            # household pod outlived every conductor incarnation; every
            # adopt/contest/obey path starves byte-less, ghost-witness sweeps
            # run all-held forever). Deliberately REUSES the adopt-before-
            # author placeholder: same per-env policy (alpha/staging true,
            # prod false — participation is a governance decision), and the
            # edge Jenkinsfile's global sed renders both from one variable.
            # A later real canonical declaration outranks any decayed-in root.
            # Decay additionally requires a LIVE advertising hint this sweep
            # and the stated-no-record verdict to have STOOD the decay dwell
            # (ELOHIM_GHOST_DECAY_MIN_DWELL_SECS, code default 3600) — one
            # peer's local-cache answer is never read as a fleet fact.
            - name: ELOHIM_GHOST_DECLARATION_DECAY
              value: "ADOPT_BEFORE_AUTHOR_PLACEHOLDER"
            # Carry-the-election (head_adoption, 2026-08-31): when the own
            # conductor sees NO election for a divergent declared row, the obey
            # arm may fetch the advertising peer's canonical-head declaration
            # LINK record over view-federation and re-derive it in wasm
            # (verify_carried_election: self-binding, author signature, anchor
            # binding, tier) before obeying the merged election under the
            # ordinary monotonic stamp guard. The election-visibility wall's
            # supply-side exit (2026-08-31 fleet read: every agent-info at
            # storageArc None ⇒ election links never gossip in ⇒ both doorways
            # frozen on divergent declared heads). Deliberately REUSES the
            # adopt-before-author placeholder: same per-env policy
            # (alpha/staging true, prod false — participation is a governance
            # decision), one variable in the edge Jenkinsfile's global sed.
            # Unset/false is behavior- and allocation-identical to pre-flag;
            # storage logs a boot WARN when enabled. Mesh proof:
            # genesis/a2o/scripts/carried-election-mesh-proof.ts (exit 0).
            - name: ELOHIM_OBEY_CARRIED_ELECTION
              value: "ADOPT_BEFORE_AUTHOR_PLACEHOLDER"
            # Rung 4: where the runtime-config watcher reads (mounted from the
            # <prefix>-runtime-config ConfigMap; see that ConfigMap's header).
            - name: ELOHIM_RUNTIME_CONFIG_PATH
              value: "/etc/elohim/runtime-config.toml"
            # Evidence-absent contest backoff (head_adoption): ids whose
            # advertiser's conductor cleanly holds NO record defer this long
            # before re-contesting (phantom-load relief). Conservative initial
            # bake at 6h — a clean no-record can also mean not-yet-gossiped
            # (full-arc law), so we hold below the 24h code default until
            # no_record→carried recovery data accumulates. Raise by editing
            # this literal; 0 restores the ordinary 3600s window.
            - name: ELOHIM_EVIDENCE_ABSENT_BACKOFF_SECS
              value: "21600"
            # T5 head-plane requester digest leg (flipped 2026-08-08).
            # Content-inventory requests carry a corpus digest once every
            # distribution-safe local row is anchored; a responder whose
            # corpus already matches answers in_sync and both sides skip
            # enumeration. Responder half confirmed deployed fleet-wide by
            # edge #1326 (all peers restarted onto ecc840eb); the digest
            # branches are structurally unreachable until a requester flips,
            # and every non-match/abstain branch falls back to the legacy
            # inventory enumeration. Revert = "false" (pre-T5 wire).
            - name: ELOHIM_HEAD_CORPUS_DIGEST
              value: "true"
            - name: ENABLE_IMPORT_API
              value: "true"
            - name: ENABLE_CONTENT_DB
              value: "true"
            # SQLite read/write pool size over content.db (elohim-storage
            # init_pool). Per-node tunable: deployments.json edgenodeDbPoolSize
            # renders this; rendered "10" when unset (the code default).
            - name: STORAGE_DB_POOL_SIZE
              value: "STORAGE_DB_POOL_SIZE_PLACEHOLDER"
            - name: IMPORT_CHUNK_SIZE
              value: "50"
            - name: IMPORT_CHUNK_DELAY_MS
              value: "300"
            - name: ENABLE_P2P
              value: "true"
            - name: P2P_PORT
              value: "9876"
            - name: DISABLE_MDNS
              value: "true"
            # Peer mesh — computed by deployHumanManifest from topology
            - name: P2P_BOOTSTRAP_NODES
              value: "P2P_BOOTSTRAP_NODES_PLACEHOLDER"
            - name: RELAY_MODE
              value: "server"
            # Node-shape self-registration at boot (Task C7)
            - name: DEVICE_ARCHETYPE
              value: "DEVICE_ARCHETYPE_PLACEHOLDER"
            - name: HOUSEHOLD_ID
              value: "HOUSEHOLD_ID_PLACEHOLDER"
            - name: NODE_ROLE
              value: "NODE_ROLE_PLACEHOLDER"
            - name: REGION
              value: "REGION_PLACEHOLDER"
            # Display name for cluster_view topology UI
            - name: ELOHIM_DISPLAY_NAME
              value: "HUMAN_LABEL_PLACEHOLDER"
            # Blob storage path for filesystem capacity calculations
            - name: ELOHIM_BLOB_PATH
              value: "/data/blobs"
            # Dataplane transport backend (storage layer, NOT the conductor transport).
            # "dual" runs libp2p + iroh side-by-side — campaign Wave-2 E3, decision 2026-08-04.
            # Boot sentinel: "Dual: DualGossipPublisher wired into P2PNode". Rollback: "libp2p".
            - name: ELOHIM_TRANSPORT_BACKEND
              value: "dual"
            # Storage-side iroh relay — distinct from the conductor's network.relay_url
            # above; read by p2p_iroh/config.rs and, until now, set by nothing (the
            # dead-config note in scripts/ci/dead-config-lint.sh). Without it the iroh
            # half of "dual" is direct-only: pod IPs, unreachable from any peer outside
            # the namespace (measured 2026-08-30 — a workspace peer's iroh 0.92 attached
            # to this relay in 3 s; the fleet could not dial back). One relay per premises,
            # the same value the conductor gets.
            - name: ELOHIM_IROH_RELAY_URL
              value: "RELAY_URL_PLACEHOLDER"
            # Doorway ORIGIN for the storage-side iroh bootstrap: the transport-manifest
            # announcer POSTs to, and the joiner reads, `${ELOHIM_DOORWAY_URL}/p2p/manifests`
            # (p2p_iroh/doorway_bootstrap.rs). Unset, doorway_base_url() is None and the
            # storage never announces — measured 2026-08-30 with the board open: its only
            # entry was an outside workspace peer's. Rendered from the bootstrap URL's origin
            # (elohim/holochain/Jenkinsfile) so bootstrap and board always name one doorway.
            # NOT DOORWAY_CAPABILITY_URL — that env also drives the SSR render-capability
            # fetch (main.rs) and must stay pointed at the capability document.
            - name: ELOHIM_DOORWAY_URL
              value: "DOORWAY_ORIGIN_PLACEHOLDER"
            # CPU profiling exposition — arms GET /debug/pprof/profile?seconds=N
            # on the storage-http port for the Alloy/Pyroscope scraper (see the
            # profiles.grafana.com/cpu.* annotations on this pod template).
            # Default OFF in the binary; ON here because the alpha fleet IS the
            # profiling target — the profile is what discriminates the shem
            # host-starvation remedy (gossip-n² vs corpus-size vs write-backlog).
            # Sampling is 100Hz for the requested window only, no steady-state cost.
            - name: ELOHIM_PPROF_ENABLED
              value: "true"
          ports:
            # Conductor admin/app WS (8444/8445) are NOT served here since
            # rung 2 — they belong to the conductor StatefulSet's ws-proxy.
            # elohim-storage HTTP API
            - name: storage-http
              containerPort: 8090
              protocol: TCP
            # P2P libp2p transport
            - name: p2p
              containerPort: 9876
              protocol: TCP
          # Storage's SHARE of this human's one declared envelope — the exact
          # remainder after the conductor's share (Jenkinsfile storageShare /
          # conductorShare). BUDGET NEUTRALITY: the rung-2 split never adds
          # aggregate load to a node, it re-partitions the existing envelope;
          # conductor + storage sum EXACTLY to the human's deployments.json
          # edgenode{Cpu,Memory}{Request,Limit} on all four dimensions.
          # Today's ratios: memory 3/8 here (the conductor is the RAM consumer,
          # RSS ∝ corpus at full arc), CPU 1/2 here. Re-size only with measured
          # evidence PER SIDE, and do it by moving edgenode* — the field the
          # test-bench-aggregate-capacity validator actually sums — never by
          # inflating one pod's share behind the ledger's back.
          resources:
            requests:
              memory: "STORAGE_MEMORY_REQUEST_PLACEHOLDER"
              cpu: "STORAGE_CPU_REQUEST_PLACEHOLDER"
            limits:
              memory: "STORAGE_MEMORY_LIMIT_PLACEHOLDER"
              cpu: "STORAGE_CPU_LIMIT_PLACEHOLDER"
          volumeMounts:
            # holochain-data / conductor-config / happ-volume moved to the
            # conductor StatefulSet (rung 2).
            - name: storage-data
              mountPath: /data
            - name: peer-policy
              mountPath: /etc/elohim/peer-policy.toml
              subPath: peer-policy.toml
              readOnly: true
            # Rung 4 (config as runtime surface): a watched config file the
            # RUNNING node re-reads — kubelet propagates ConfigMap edits to
            # this mount without a pod restart, and the in-process watcher
            # (src/runtime_config.rs, ELOHIM_RUNTIME_CONFIG_PATH) applies
            # hot-reloadable settings in seconds. A flag flip is a ConfigMap
            # edit + apply, never a roll.
            - name: runtime-config
              mountPath: /etc/elohim/runtime-config.toml
              subPath: runtime-config.toml
              readOnly: true
          # Generous-probe pattern (2026-05-27): the embedded Holochain
          # conductor compiles WASM ribosomes during install_app on cold
          # start; under CPU contention this regularly blows past a 1s
          # default probe timeout. timeoutSeconds: 15 absorbs CFS throttling
          # spikes; readiness initialDelaySeconds: 120 keeps the probe out
          # of the install_app window entirely. Failure modes seen on alpha
          # 2026-05-27: install_app timeout under CPU starvation (exit 1)
          # and SIGKILL from kubelet liveness misses (exit 137) on healthy
          # pods that just couldn't answer /health inside 1s during gossip.
          # startupProbe (2026-07-16): post-restart / post-power-outage DHT
          # resync can leave /health unresponsive for minutes even WITH CPU
          # headroom (observed: eve SIGKILLed exit137/Error while using only
          # ~1.1 of 3 cores). This grants a 10-min cold-start grace (40x15s)
          # before liveness engages at all, so a slow-but-healthy conductor is
          # not killed mid-resync. Liveness/readiness also loosened below
          # (timeout 15->20s; liveness failureThreshold 5->10 ~= 5min).
          startupProbe:
            httpGet:
              path: /health
              port: 8090
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 40
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 20
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 10
      volumes:
        - name: peer-policy
          configMap:
            name: RESOURCE_PREFIX_PLACEHOLDER-peer-policy
        - name: runtime-config
          configMap:
            name: RESOURCE_PREFIX_PLACEHOLDER-runtime-config
  # Per-pod persistent volumes — each StatefulSet replica gets its own PVCs
  # Named volumes are referenced in volumeMounts above
  # The `holochain-data` template was RETIRED here in rung 2. Its already-minted
  # PVCs (holochain-data-<prefix>-0) are Retained and are now mounted by the
  # conductor StatefulSet via explicit claimName — no rename, no re-genesis.
  # Removing a volumeClaimTemplate is a Forbidden StatefulSet spec update, so
  # the first deploy after this change takes deployHumanManifest's
  # orphan-delete + reapply path (pods and PVCs retained by name).
  volumeClaimTemplates:
    - metadata:
        name: storage-data
      spec:
        accessModes: [ReadWriteOnce]
        # Node-local storage — P2P dataplane is the replication layer, not k8s
        storageClassName: "STORAGE_CLASS_PLACEHOLDER"
        resources:
          requests:
            storage: 20Gi
---
# Headless service for StatefulSet DNS-based peer discovery
# Pod gets stable DNS name: RESOURCE_PREFIX_PLACEHOLDER-0.RESOURCE_PREFIX_PLACEHOLDER-headless.NAMESPACE_PLACEHOLDER.svc.cluster.local
# Doorway uses these DNS names in CONDUCTOR_URLS for per-conductor routing
apiVersion: v1
kind: Service
metadata:
  name: RESOURCE_PREFIX_PLACEHOLDER-headless
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: elohim-edgenode
    elohim-human: HUMAN_LABEL_PLACEHOLDER
    environment: ENV_PLACEHOLDER
    app.kubernetes.io/name: edgenode
    app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  clusterIP: None
  selector:
    app: elohim-edgenode
    elohim-human: HUMAN_LABEL_PLACEHOLDER
    environment: ENV_PLACEHOLDER
    elohim-workload: storage
  ports:
    # Conductor admin/app WS moved to <prefix>-conductor-headless (rung 2).
    - name: p2p
      port: 9876
      targetPort: 9876
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: RESOURCE_PREFIX_PLACEHOLDER
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: elohim-edgenode
    elohim-human: HUMAN_LABEL_PLACEHOLDER
    environment: ENV_PLACEHOLDER
    app.kubernetes.io/name: edgenode
    app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  type: ClusterIP
  ports:
    # Conductor admin/app WS (4444/4445) moved to the <prefix>-conductor
    # Service in rung 2 — a Service selects ONE pod set, and this one must keep
    # selecting the storage pod for :8090 and :9876. Consumers that resolved
    # <prefix>:4445 (genesis/Jenkinsfile getConductorAppUrls) now resolve
    # <prefix>-conductor:4445.
    # elohim-storage HTTP API
    - name: storage-db
      port: 8090
      targetPort: 8090
      protocol: TCP
    # P2P libp2p transport
    - name: p2p
      port: 9876
      targetPort: 9876
      protocol: TCP
  selector:
    app: elohim-edgenode
    elohim-human: HUMAN_LABEL_PLACEHOLDER
    environment: ENV_PLACEHOLDER
    elohim-workload: storage
