    - name: storage-db
      port: 8090
      targetPort: 8090
      protocol: TCP
    # P2P libp2p transport
    - name: p2p
      port: 9876
      targetPort: 9876
      protocol: TCP
  selector:
    app: elohim-edgenode
    elohim-human: HUMAN_LABEL_PLACEHOLDER
    environment: ENV_PLACEHOLDER
