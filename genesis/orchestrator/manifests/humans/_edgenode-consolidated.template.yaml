# Consolidated single-container pattern — shared by all consolidated humans.
#
# Per-human values are injected by deployHumanManifest in
# elohim/holochain/Jenkinsfile, driven by
# genesis/orchestrator/data/deployments.json. This template is NOT applied
# directly; it's rendered through sed into a per-human manifest before
# kubectl apply.
#
# Architecture:
#   Doorway Deployment → Service :4444/:4445 → targetPort 8444/8445
#                       → elohim-storage forwarder
#                       → 127.0.0.1:4444/:4445 (Holochain conductor)
#   P2P: elohim-node peers discover each other via headless service DNS.
#   Storage, conductor, happ installer are one container; cgroup-shared
#   memory pool; no socat sidecar — but external ports match the socat
#   convention (8444/8445) because 0.0.0.0:8444 would EADDRINUSE against
#   the conductor's localhost bind in the same pod netns.
#
# Ports:
#   - 4444: Conductor Admin WebSocket (Service name, targetPort 8444 forwarder)
#   - 4445: Conductor App WebSocket (Service name, targetPort 8445 forwarder)
#   - 8444: Forwarder-exposed admin WS on pod network (containerPort)
#   - 8445: Forwarder-exposed app WS on pod network (containerPort)
#   - 8090: elohim-storage HTTP API
#   - 9876: P2P libp2p transport (cross-namespace via NetworkPolicy)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: RESOURCE_PREFIX_PLACEHOLDER-peer-policy
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: elohim-edgenode
    elohim-human: HUMAN_LABEL_PLACEHOLDER
    environment: ENV_PLACEHOLDER
    app.kubernetes.io/component: policy
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
data:
  peer-policy.toml: |
    [pool]
    accept_general_traffic = "auto"
    min_free_storage_pct = 20
    require_conductor_healthy = true

    [stewardship]
    accept_new_reserves = "auto"
    max_storage_pct = 80

    [network]
    # Spawns the two localhost→pod-network forwarders for conductor
    # admin (4444) and app (4445) WebSocket ports. Doorway reaches the
    # conductor exclusively through these forwarded ports; Holochain
    # itself stays on 127.0.0.1 (its safe default). elohim-storage is
    # the auth boundary for external traffic.
    expose_conductor_externally = true
    conductor_external_bind = "0.0.0.0:8445"
    conductor_internal_port = 4445
    conductor_admin_external_bind = "0.0.0.0:8444"
    conductor_admin_internal_port = 4444
---
# ConfigMap for conductor configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: RESOURCE_PREFIX_PLACEHOLDER-config
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: elohim-edgenode
    elohim-human: HUMAN_LABEL_PLACEHOLDER
    environment: ENV_PLACEHOLDER
    app.kubernetes.io/name: edgenode
    app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
data:
  # hApp version to fetch from Harbor (dev-latest for dev environments, explicit version for prod)
  happ-version: "HAPP_TAG_PLACEHOLDER"
  conductor-config.yaml: |
    # Holochain Conductor Configuration for Elohim Protocol
    # Conductor binds to 127.0.0.1:4444/4445 (Holochain's safe default).
    # elohim-storage's forwarder bridges pod-network:4444/4445 → 127.0.0.1,
    # so doorway reaches admin via the pod-IP without Holochain itself
    # exposing externally. See peer-policy ConfigMap in this manifest.
    admin_interfaces:
      - driver:
          type: websocket
          port: 4444
          allowed_origins: "*"
    network:
      # Bootstrap served by Doorway gateway
      bootstrap_url: "BOOTSTRAP_URL_PLACEHOLDER"
      # Signal served on dedicated subdomain (tx5/SBD protocol requires path = pubkey)
      signal_url: "SIGNAL_URL_PLACEHOLDER"
      # REQUIRED field at holochain 0.6.3+ (single NetworkConfig struct; inert while
      # the build compiles tx5-only). Value is the planned SOVEREIGN self-hosted
      # iroh-relay — it must be live before any transport-iroh build ships; never
      # fall back to n0's public relay default.
      relay_url: "https://relay.elohim.host"
      # Authority arc factor: 1 = full DHT authority (kitsune2 default), 0 = leecher.
      # Per-node via deployments.json edgenodeArcFactor (default 1). Set 0 to relieve a
      # NON-ANCHOR node OOM-crash-looping on the full-arc working set (conductor RAM is
      # proportional to corpus at factor 1; fractional is upstream-blocked at {0,1}).
      # The runtime arc_actuator can NOT change this at runtime (this configMap is a
      # read-only subPath mount) — the lever lives here, baked at deploy.
      target_arc_factor: TARGET_ARC_FACTOR_PLACEHOLDER
      webrtc_config:
        iceServers:
          - urls: ["stun:stun.cloudflare.com:3478"]
          - urls: ["stun:stun.l.google.com:19302"]
          # Sovereign TURN relay (Tier-A transport commons). The genesis pair
          # straddles shem(cloud NAT) ↔ on-prem(home NAT); srflx↔srflx pairing
          # fails silently with STUN only, and app #1604 proved the DHT fetch
          # stays down even with fully CONVERGED peer stores — the data channel
          # itself is the seam. The prior diagnostic relay
          # (openrelay.metered.ca) went GLOBALLY DEAD 2026-07-13 (i/o timeout
          # from adam, matthew, AND a third network). Replaced by our own coturn
          # pair — `genesis/orchestrator/manifests/infra/alpha-coturn-operations.yaml`,
          # `alpha-coturn-shem.yaml`. Keep the credential in sync with those
          # ConfigMaps' `user=`.
          # Dual-WAN ICE failover: operations (on-prem, alpha.elohim.host) relay
          # primary, shem (the apex — adam's premises) redundant — either works,
          # ICE gathers candidates from both. Role-named DNS (2026-07-28): no
          # node names in public DNS; each name is beacon-managed and
          # dynamic-IP-safe. turns:5349 TLS is a later phase; 3478-first.
          - urls:
              - "turn:alpha.elohim.host:3478?transport=udp"
              - "turn:alpha.elohim.host:3478?transport=tcp"
            username: "elohim"
            credential: "alpha-turn-commons-2026"
          - urls:
              - "turn:elohim.host:3478?transport=udp"
              - "turn:elohim.host:3478?transport=tcp"
            username: "elohim"
            credential: "alpha-turn-commons-2026"
      # Slow-WAN peer resilience (2026-07-20): a production node on a slow
      # link was timing out kitsune2 gossip rounds at the 15s default and
      # thrash-retrying, while up to 10 concurrently accepted rounds piled up
      # write pressure on the conductor's SQLite write guard (PTxnGuard held
      # 500-1500ms at ~45/min, a ~50% write-guard duty cycle). Let slow
      # rounds run to completion instead of retrying, and bound concurrent
      # accepted rounds so gossip write pressure stays sane. Do not
      # "clean up" these away from their upstream defaults without
      # re-checking WAN conditions on the affected nodes. Leave initiate
      # intervals at defaults — only round completion and accepted-round
      # concurrency need tuning here.
      advanced:
        k2Gossip:
          roundTimeoutMs: 60000
          maxConcurrentAcceptedRounds: 4
    data_root_path: "/var/local/lib/holochain"
    keystore:
      type: lair_server_in_proc
      lair_root: "/var/local/lib/holochain/ks"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: RESOURCE_PREFIX_PLACEHOLDER
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: elohim-edgenode
    elohim-human: HUMAN_LABEL_PLACEHOLDER
    environment: ENV_PLACEHOLDER
    app.kubernetes.io/name: edgenode
    app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  serviceName: RESOURCE_PREFIX_PLACEHOLDER-headless
  replicas: 1
  # Retain PVCs across StatefulSet delete/recreate — needed when a forbidden-field
  # change (e.g. volumeClaimTemplates, selector) forces orphan-delete + reapply.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: elohim-edgenode
      elohim-human: HUMAN_LABEL_PLACEHOLDER
      environment: ENV_PLACEHOLDER
  template:
    metadata:
      annotations:
        # Content digest of the hApp behind the floating happ-version tag,
        # resolved at render time (Jenkinsfile resolveHappDigest). The tag itself
        # is mutable — a DNA-pipeline rebuild moves dev-latest/latest to new hApp
        # bytes with NO edge commit, leaving the rest of this pod template
        # byte-identical. Stamping the digest here makes such a move change the
        # StatefulSet spec, so `kubectl apply` reports "configured" and the
        # genesis-peer surge guard lets the conductor rollout restart proceed
        # (otherwise the bootstrap pair skips the restart on "unchanged" while
        # other peers pull the new DNA → DNA-hash divergence → DHT partition).
        # FAIL-SAFE: on resolution failure the Jenkinsfile stamps a unique marker,
        # never empty/stale — the deploy still restarts rather than silently skew.
        elohim.host/happ-digest: "HAPP_DIGEST_PLACEHOLDER"
      labels:
        app: elohim-edgenode
        elohim-human: HUMAN_LABEL_PLACEHOLDER
        environment: ENV_PLACEHOLDER
        app.kubernetes.io/name: edgenode
        app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
        app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
        app.kubernetes.io/component: data
        app.kubernetes.io/part-of: elohim
        app.kubernetes.io/managed-by: jenkins
    spec:
      securityContext:
        fsGroup: 1000
      # AFFINITY_COMMENT_PLACEHOLDER
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-type
                    operator: In
                    values: NODE_TYPE_VALUES_PLACEHOLDER
      # Tolerate the WAN/remote-zone taint so node-type=remote humans can land on
      # shem, which the operator taints remote-wan=true:NoSchedule to keep cluster
      # infra + dev tooling off the ISP-latency node (a CoreDNS/che-gateway replica
      # there added a WAN hop to everything). Inert for operations/edge/performance
      # humans — their node affinity keeps them off shem, so this is never exercised;
      # it's the "opt-in to the remote zone" half that pairs with the node-type
      # affinity above.
      tolerations:
        - key: remote-wan
          operator: Exists
          effect: NoSchedule
      # shem's GFiber router hairpin-intercepts the apex hostnames (elohim.host,
      # signal.elohim.host) back to its own WAN IP instead of routing to shem's
      # own ingress — the router answers with its self-signed web UI cert
      # (ssl_verify_result=18) rather than proxying through. Rendered per-human
      # by deployHumanManifest: non-empty ([{ip:"10.99.0.2", hostnames:[...]}])
      # only for shem-placed humans whose primary doorway is doorwayB (apex);
      # empty ([]) for on-prem humans (matthew/jessica/james) and for envs with
      # no doorwayB split (staging/prod). See
      # genesis/data/timeline/backlog/shem-conductors-signal-hairpin-suspect-dht-silent.md.
      # CAVEAT: 10.99.0.2 is shem's NODE IP hardcoded into the pod spec —
      # correct while these pods stay shem-pinned (nodeAffinity). If one ever
      # schedules elsewhere the alias goes SLOW-BUT-ROUTABLE over WireGuard
      # rather than failing loudly — hard to spot later; check here first when
      # a shem-placed conductor gets mysteriously slow after a reschedule.
      # NEVER alias alpha.elohim.host: it rides the other WAN (not hairpinned)
      # AND gossip peer URLs are minted on wss://signal.alpha.elohim.host —
      # aliasing it shem-local would break live gossip sessions, not just TURN.
      hostAliases: HOST_ALIASES_PLACEHOLDER
      # Init container fetches hApp from Harbor registry using oras
      initContainers:
        - name: happ-fetcher
          image: ghcr.io/oras-project/oras:v1.1.0
          command: ['sh', '-c']
          args:
            - |
              set -e
              echo "Fetching hApp from Harbor registry..."
              echo "Version: ${HAPP_VERSION}"

              # Login to Harbor and pull artifact
              oras pull harbor.ethosengine.com/ethosengine/elohim-happ:${HAPP_VERSION} -o /happ

              if [ -f /happ/elohim.happ ]; then
                echo "hApp downloaded successfully from Harbor"
                ls -lh /happ/elohim.happ
              else
                echo "Failed to download hApp from Harbor"
                exit 1
              fi
          env:
            - name: HAPP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: RESOURCE_PREFIX_PLACEHOLDER-config
                  key: happ-version
          volumeMounts:
            - name: happ-volume
              mountPath: /happ
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      containers:
        # elohim-node: unified conductor + storage + P2P
        # Manages holochain conductor as embedded child process.
        # Replaces: edgenode + ws-proxy + elohim-storage + happ-installer
        - name: elohim-node
          image: harbor.ethosengine.com/ethosengine/elohim-storage:STORAGE_TAG_PLACEHOLDER
          imagePullPolicy: Always
          env:
            - name: HUMAN_ID
              value: "HUMAN_ID_PLACEHOLDER"
            # Genesis self-heal (OPERATOR-AUTHORIZED bootstrap): each pod populates its own
            # human's agent_pub_key from its own conductor cell key (uhCAk), NULL-only, and mints
            # a local session so the provide-rows seeder's /auth/me returns 200 — lights every
            # household resilience card. SELF_HUMAN_ID reuses the per-human HUMAN_ID_PLACEHOLDER
            # so each pod heals only its OWN identity. Household_id is left to the seeder (the
            # deploy HOUSEHOLD_ID differs from the seeded one). Superseded later by the
            # cross-signed coherent-transport-identity-resolver (this heal rotates over cleanly).
            - name: GENESIS_SELF_HEAL_IDENTITY
              value: "1"
            - name: SELF_HUMAN_ID
              value: "HUMAN_ID_PLACEHOLDER"
            - name: RUST_LOG
              value: "info,elohim_storage=debug"
            # --- Embedded conductor mode ---
            - name: EMBEDDED_CONDUCTOR
              value: "true"
            - name: CONDUCTOR_CONFIG_PATH
              value: "/etc/holochain/conductor-config.yaml"
            - name: CONDUCTOR_DATA_DIR
              value: "/var/local/lib/holochain"
            - name: HAPP_PATH
              value: "/opt/holochain/elohim.happ"
            # Admin-WS request timeout (seconds) for the embedded conductor. Must
            # cover the cold FIRST hApp install — a single-threaded wasm compile +
            # genesis. On slower per-core nodes (e.g. the shem apex) that compile
            # exceeds holochain_client's 60s default → `install_app ... Websocket
            # error: Timeout` → the node crash-loops forever (its wasm cache never
            # warms). Warm-cache installs are sub-second, so this only bounds the
            # first cold install. Operator-tunable here WITHOUT a rebuild; keep it
            # under the deploy rollout-status timeout (600s). Code default: 180.
            - name: HAPP_INSTALL_TIMEOUT_SECS
              value: "180"
            # Path to the peer-policy mount — enables conductor forwarders.
            - name: ELOHIM_STORAGE_PEER_POLICY_PATH
              value: "/etc/elohim/peer-policy.toml"
            # --- Storage config (unchanged) ---
            - name: HOLOCHAIN_ADMIN_URL
              value: "ws://localhost:4444"
            - name: HOLOCHAIN_APP_URL
              value: "ws://localhost:4445"
            - name: HOLOCHAIN_APP_ID
              value: "elohim"
            # Gate for happ_manager DNA-content drift auto-reinstall. The
            # conductor data dir is a persistent PVC, so an installed app keeps
            # its OLD DNA across restarts/resets even when the bundle's DNA
            # changes (same roles → not "stale"). With this set true, the
            # embedded conductor reinstalls when bundle DNA ≠ installed DNA.
            # Rendered per-env by deployHumanManifest: true for alpha/staging
            # (ephemeral, re-seeded), false for prod (DNA upgrades need
            # migration/lineage, not a blind reinstall).
            #
            # NOTE: the DNA hash covers ONLY integrity zomes + modifiers, so a
            # coordinator-zome-only change never trips this reinstall. That
            # class is healed separately via the conductor's
            # update_coordinators HOT-SWAP (no re-key, no DHT churn), gated by
            # ALLOW_COORDINATOR_UPDATE — which defaults to this flag's value
            # and may be set explicitly to enable coordinator updates on prod
            # without enabling re-key reinstalls.
            - name: ALLOW_DNA_REINSTALL
              value: "ALLOW_DNA_REINSTALL_PLACEHOLDER"
            # Gate for the deterministic /admin/seed/shard-manifest lever
            # (elohim-storage/src/http.rs, seed_shard_manifest.rs) — writes a
            # shard manifest + agent-keyed shard_locations for blob-backed
            # content WITHOUT waiting on full P2P gossip, so the blob-durability
            # a2o suite + the resilience card's "stewarding" column can light
            # deterministically on household-nodes. Off (403) by default so a
            # real deployment can never fabricate distribution; rows it writes
            # are stamped status="seeded" (never confused with runtime
            # distribute_shards rows). Same per-env rendering as
            # ALLOW_DNA_REINSTALL: true for alpha/staging (ephemeral,
            # test/demo-seeded), false for prod.
            - name: ALLOW_SEED_SHARD_MANIFEST
              value: "ALLOW_SEED_SHARD_MANIFEST_PLACEHOLDER"
            # Adopt-before-author gate (head_adoption): lets a node with NO
            # local chain for a content id declare a canonical head from a
            # carried record the zome fully re-proves in wasm (signature +
            # entry↔action + target-id binding). The both-sides-missing
            # residual's only automated exit — dominant for genesis-seeded
            # corpora whose fixture authors never had live chains. Same
            # per-env rendering as ALLOW_DNA_REINSTALL: true for
            # alpha/staging, false for prod (prod participation is a
            # governance decision, not a default). Storage logs a boot WARN
            # when enabled; unset/false is behavior-identical to pre-flag.
            - name: ELOHIM_ADOPT_BEFORE_AUTHOR
              value: "ADOPT_BEFORE_AUTHOR_PLACEHOLDER"
            # Evidence-absent contest backoff (head_adoption): ids whose
            # advertiser's conductor cleanly holds NO record defer this long
            # before re-contesting (phantom-load relief). Conservative initial
            # bake at 6h — a clean no-record can also mean not-yet-gossiped
            # (full-arc law), so we hold below the 24h code default until
            # no_record→carried recovery data accumulates. Raise by editing
            # this literal; 0 restores the ordinary 3600s window.
            - name: ELOHIM_EVIDENCE_ABSENT_BACKOFF_SECS
              value: "21600"
            - name: ENABLE_IMPORT_API
              value: "true"
            - name: ENABLE_CONTENT_DB
              value: "true"
            # SQLite read/write pool size over content.db (elohim-storage
            # init_pool). Per-node tunable: deployments.json edgenodeDbPoolSize
            # renders this; rendered "10" when unset (the code default).
            - name: STORAGE_DB_POOL_SIZE
              value: "STORAGE_DB_POOL_SIZE_PLACEHOLDER"
            - name: IMPORT_CHUNK_SIZE
              value: "50"
            - name: IMPORT_CHUNK_DELAY_MS
              value: "300"
            - name: ENABLE_P2P
              value: "true"
            - name: P2P_PORT
              value: "9876"
            - name: DISABLE_MDNS
              value: "true"
            # Peer mesh — computed by deployHumanManifest from topology
            - name: P2P_BOOTSTRAP_NODES
              value: "P2P_BOOTSTRAP_NODES_PLACEHOLDER"
            - name: RELAY_MODE
              value: "server"
            # Node-shape self-registration at boot (Task C7)
            - name: DEVICE_ARCHETYPE
              value: "DEVICE_ARCHETYPE_PLACEHOLDER"
            - name: HOUSEHOLD_ID
              value: "HOUSEHOLD_ID_PLACEHOLDER"
            - name: NODE_ROLE
              value: "NODE_ROLE_PLACEHOLDER"
            - name: REGION
              value: "REGION_PLACEHOLDER"
            # Display name for cluster_view topology UI
            - name: ELOHIM_DISPLAY_NAME
              value: "HUMAN_LABEL_PLACEHOLDER"
            # Blob storage path for filesystem capacity calculations
            - name: ELOHIM_BLOB_PATH
              value: "/data/blobs"
          ports:
            # Conductor admin WS — exposed via elohim-storage forwarder on
            # 8444 (bridges to 127.0.0.1:4444). See top-of-file Architecture
            # note for why the forwarder can't bind 4444 directly.
            - name: admin-ws-fwd
              containerPort: 8444
              protocol: TCP
            # Conductor app WS — exposed via forwarder on 8445 → 4445.
            - name: app-ws-fwd
              containerPort: 8445
              protocol: TCP
            # elohim-storage HTTP API
            - name: storage-http
              containerPort: 8090
              protocol: TCP
            # P2P libp2p transport
            - name: p2p
              containerPort: 9876
              protocol: TCP
          # Cooperative memory pool — conductor + storage share one cgroup
          resources:
            requests:
              memory: "EDGENODE_MEMORY_REQUEST_PLACEHOLDER"
              cpu: "EDGENODE_CPU_REQUEST_PLACEHOLDER"
            limits:
              memory: "EDGENODE_MEMORY_LIMIT_PLACEHOLDER"
              cpu: "EDGENODE_CPU_LIMIT_PLACEHOLDER"
          volumeMounts:
            - name: holochain-data
              mountPath: /var/local/lib/holochain
            - name: storage-data
              mountPath: /data
            - name: conductor-config
              mountPath: /etc/holochain/conductor-config.yaml
              subPath: conductor-config.yaml
            - name: happ-volume
              mountPath: /opt/holochain
            - name: peer-policy
              mountPath: /etc/elohim/peer-policy.toml
              subPath: peer-policy.toml
              readOnly: true
          # Generous-probe pattern (2026-05-27): the embedded Holochain
          # conductor compiles WASM ribosomes during install_app on cold
          # start; under CPU contention this regularly blows past a 1s
          # default probe timeout. timeoutSeconds: 15 absorbs CFS throttling
          # spikes; readiness initialDelaySeconds: 120 keeps the probe out
          # of the install_app window entirely. Failure modes seen on alpha
          # 2026-05-27: install_app timeout under CPU starvation (exit 1)
          # and SIGKILL from kubelet liveness misses (exit 137) on healthy
          # pods that just couldn't answer /health inside 1s during gossip.
          # startupProbe (2026-07-16): post-restart / post-power-outage DHT
          # resync can leave /health unresponsive for minutes even WITH CPU
          # headroom (observed: eve SIGKILLed exit137/Error while using only
          # ~1.1 of 3 cores). This grants a 10-min cold-start grace (40x15s)
          # before liveness engages at all, so a slow-but-healthy conductor is
          # not killed mid-resync. Liveness/readiness also loosened below
          # (timeout 15->20s; liveness failureThreshold 5->10 ~= 5min).
          startupProbe:
            httpGet:
              path: /health
              port: 8090
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 40
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 20
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 10
      volumes:
        # Shared volume for hApp (fetched by init container)
        - name: happ-volume
          emptyDir: {}
        # Conductor config from ConfigMap
        - name: conductor-config
          configMap:
            name: RESOURCE_PREFIX_PLACEHOLDER-config
        - name: peer-policy
          configMap:
            name: RESOURCE_PREFIX_PLACEHOLDER-peer-policy
  # Per-pod persistent volumes — each StatefulSet replica gets its own PVCs
  # Named volumes are referenced in volumeMounts above
  volumeClaimTemplates:
    - metadata:
        name: holochain-data
      spec:
        accessModes: [ReadWriteOnce]
        # Node-local storage — P2P dataplane is the replication layer, not k8s
        storageClassName: "STORAGE_CLASS_PLACEHOLDER"
        resources:
          requests:
            storage: 20Gi
    - metadata:
        name: storage-data
      spec:
        accessModes: [ReadWriteOnce]
        # Node-local storage — P2P dataplane is the replication layer, not k8s
        storageClassName: "STORAGE_CLASS_PLACEHOLDER"
        resources:
          requests:
            storage: 20Gi
---
# Headless service for StatefulSet DNS-based peer discovery
# Pod gets stable DNS name: RESOURCE_PREFIX_PLACEHOLDER-0.RESOURCE_PREFIX_PLACEHOLDER-headless.NAMESPACE_PLACEHOLDER.svc.cluster.local
# Doorway uses these DNS names in CONDUCTOR_URLS for per-conductor routing
apiVersion: v1
kind: Service
metadata:
  name: RESOURCE_PREFIX_PLACEHOLDER-headless
  namespace: NAMESPACE_PLACEHOLDER
  labels:
