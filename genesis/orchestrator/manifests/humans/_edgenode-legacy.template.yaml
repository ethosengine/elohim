# Legacy 4-container edgenode template — shared by all humans on the pre-consolidation pattern.
#
# Per-human values are injected by deployHumanManifest in elohim/holochain/Jenkinsfile,
# driven by genesis/orchestrator/data/deployments.json. This template is NOT applied
# directly; it's rendered through sed into a per-human manifest before kubectl apply.
#
# Architecture:
#   Doorway Deployment -> ClusterIP service -> ws-proxy (socat) -> Conductor (localhost)
#   P2P: elohim-storage nodes discover each other via headless service DNS
#
# Ports:
#   - 4444: Conductor Admin WebSocket (localhost only, bridged via socat :8444)
#   - 4445: Conductor App WebSocket (localhost only, bridged via socat :8445)
#   - 8090: elohim-storage HTTP API
#   - 9876: P2P libp2p transport (cross-namespace via NetworkPolicy)
#
# When the consolidated elohim-node pattern is verified (0.0.0.0 binding proven),
# humans migrate to _edgenode-consolidated.template.yaml one at a time by flipping
# their `pattern` field in deployments.json. Adam is the current reference impl.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: RESOURCE_PREFIX_PLACEHOLDER-config
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: elohim-edgenode
    elohim-human: HUMAN_LABEL_PLACEHOLDER
    environment: ENV_PLACEHOLDER
    app.kubernetes.io/name: edgenode
    app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
data:
  happ-version: "HAPP_TAG_PLACEHOLDER"
  conductor-config.yaml: |
    # Holochain Conductor Configuration for Elohim Protocol
    admin_interfaces:
      - driver:
          type: websocket
          port: 4444
          # Allow any origin - conductor only binds to localhost anyway
          # Doorway gateway handles external authentication
          allowed_origins: "*"
    network:
      # Bootstrap served by Doorway gateway
      bootstrap_url: "BOOTSTRAP_URL_PLACEHOLDER"
      # Signal served on dedicated subdomain (tx5/SBD protocol requires path = pubkey)
      signal_url: "SIGNAL_URL_PLACEHOLDER"
      enable_mdns: false
      enable_relaying: true
      webrtc_config:
        ice_servers:
          - urls: ["stun:stun.cloudflare.com:3478"]
          - urls: ["stun:stun.l.google.com:19302"]
    data_root_path: "/var/local/lib/holochain"
    keystore:
      type: lair_server_in_proc
      lair_root: "/var/local/lib/holochain/ks"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: RESOURCE_PREFIX_PLACEHOLDER
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: elohim-edgenode
    elohim-human: HUMAN_LABEL_PLACEHOLDER
    environment: ENV_PLACEHOLDER
    app.kubernetes.io/name: edgenode
    app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  serviceName: RESOURCE_PREFIX_PLACEHOLDER-headless
  replicas: 1
  # Retain PVCs across StatefulSet delete/recreate — needed when a forbidden-field
  # change (e.g. volumeClaimTemplates, selector) forces orphan-delete + reapply.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: elohim-edgenode
      elohim-human: HUMAN_LABEL_PLACEHOLDER
      environment: ENV_PLACEHOLDER
  template:
    metadata:
      labels:
        app: elohim-edgenode
        elohim-human: HUMAN_LABEL_PLACEHOLDER
        environment: ENV_PLACEHOLDER
        app.kubernetes.io/name: edgenode
        app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
        app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
        app.kubernetes.io/component: data
        app.kubernetes.io/part-of: elohim
        app.kubernetes.io/managed-by: jenkins
    spec:
      securityContext:
        fsGroup: 1000
      # AFFINITY_COMMENT_PLACEHOLDER
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-type
                    operator: In
                    values: NODE_TYPE_VALUES_PLACEHOLDER
      initContainers:
        # Fetches hApp from Harbor registry using oras
        - name: happ-fetcher
          image: ghcr.io/oras-project/oras:v1.1.0
          command: ['sh', '-c']
          args:
            - |
              set -e
              echo "Fetching hApp from Harbor registry..."
              echo "Version: ${HAPP_VERSION}"
              oras pull harbor.ethosengine.com/ethosengine/elohim-happ:${HAPP_VERSION} -o /happ
              if [ -f /happ/elohim.happ ]; then
                echo "hApp downloaded successfully from Harbor"
                ls -lh /happ/elohim.happ
              else
                echo "Failed to download hApp from Harbor"
                exit 1
              fi
          env:
            - name: HAPP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: RESOURCE_PREFIX_PLACEHOLDER-config
                  key: happ-version
          volumeMounts:
            - name: happ-volume
              mountPath: /happ
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      containers:
        # Main Holochain conductor — resources sized per human device archetype.
        # Placeholders below are substituted from deployments.json at render time
        # (see elohim/holochain/Jenkinsfile EDGENODE_*_PLACEHOLDER sed args). The
        # per-human values in deployments.json ARE the source of truth for the
        # archetype's validated minimum runtime budget — not this template.
        - name: edgenode
          image: harbor.ethosengine.com/ethosengine/elohim-edgenode:EDGENODE_TAG_PLACEHOLDER
          env:
            - name: CONDUCTOR_MODE
              value: "true"
          resources:
            requests:
              memory: "EDGENODE_MEMORY_REQUEST_PLACEHOLDER"
              cpu: "EDGENODE_CPU_REQUEST_PLACEHOLDER"
            limits:
              memory: "EDGENODE_MEMORY_LIMIT_PLACEHOLDER"
              cpu: "EDGENODE_CPU_LIMIT_PLACEHOLDER"
          volumeMounts:
            - name: holochain-data
              mountPath: /data
            # Mount to template path - entrypoint.sh copies this to /etc/holochain/
            - name: conductor-config
              mountPath: /usr/local/share/holochain/conductor-config.template.yaml
              subPath: conductor-config.yaml
            - name: happ-volume
              mountPath: /opt/holochain
          # Exec probe since conductor binds to localhost (bash needed for /dev/tcp)
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - "echo > /dev/tcp/127.0.0.1/4444"
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - "echo > /dev/tcp/127.0.0.1/4444"
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
        # Socat proxy — bridges localhost-bound conductor ports to pod network
        # Doorway Deployment connects via ClusterIP service -> these bridged ports
        - name: ws-proxy
          image: alpine/socat:latest
          command: ['sh', '-c']
          args:
            - |
              socat TCP-LISTEN:8444,fork,reuseaddr TCP:127.0.0.1:4444 &
              socat TCP-LISTEN:8445,fork,reuseaddr TCP:127.0.0.1:4445 &
              wait
          ports:
            - name: admin-ws-int
              containerPort: 8444
              protocol: TCP
            - name: app-ws-int
              containerPort: 8445
              protocol: TCP
          resources:
            requests:
              memory: "8Mi"
              cpu: "5m"
            limits:
              memory: "32Mi"
              cpu: "50m"
          readinessProbe:
            tcpSocket:
              port: 8444
            initialDelaySeconds: 5
            periodSeconds: 5
        # elohim-storage — blob storage, import processing, P2P relay
        - name: elohim-storage
          image: harbor.ethosengine.com/ethosengine/elohim-storage:STORAGE_TAG_PLACEHOLDER
          imagePullPolicy: Always
          env:
            - name: HUMAN_ID
              value: "HUMAN_ID_PLACEHOLDER"
            - name: RUST_LOG
              value: "info,elohim_storage=debug"
            - name: HOLOCHAIN_ADMIN_URL
              value: "ws://localhost:4444"
            - name: HOLOCHAIN_APP_URL
              value: "ws://localhost:4445"
            - name: HOLOCHAIN_APP_ID
              value: "elohim"
            - name: ENABLE_IMPORT_API
              value: "true"
            - name: ENABLE_CONTENT_DB
              value: "true"
            - name: IMPORT_CHUNK_SIZE
              value: "50"
            - name: IMPORT_CHUNK_DELAY_MS
              value: "300"
            - name: ENABLE_P2P
              value: "true"
            - name: P2P_PORT
              value: "9876"
            - name: DISABLE_MDNS
              value: "true"
            # Peer mesh — computed by deployHumanManifest from topology
            - name: P2P_BOOTSTRAP_NODES
              value: "P2P_BOOTSTRAP_NODES_PLACEHOLDER"
            # K8s pods act as relay servers for desktop stewards behind NAT
            - name: RELAY_MODE
              value: "server"
          ports:
            - name: storage-http
              containerPort: 8090
              protocol: TCP
            - name: p2p
              containerPort: 9876
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          volumeMounts:
            - name: storage-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 30
        # hApp Installer — installs the hApp once conductor is ready, then sleeps
        - name: happ-installer
          image: harbor.ethosengine.com/ethosengine/elohim-happ-installer:HAPP_INSTALLER_TAG_PLACEHOLDER
          imagePullPolicy: Always
          env:
            - name: CONDUCTOR_URL
              value: "ws://localhost:4444"
            - name: APP_ID
              value: "elohim"
            - name: MAX_RETRIES
              value: "60"
            - name: RETRY_DELAY_MS
              value: "2000"
            - name: HAPP_PATH
              value: "/opt/holochain/elohim.happ"
          volumeMounts:
            - name: happ-volume
              mountPath: /opt/holochain
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: happ-volume
          emptyDir: {}
        - name: conductor-config
          configMap:
            name: RESOURCE_PREFIX_PLACEHOLDER-config
  # Per-pod persistent volumes — each StatefulSet replica gets its own PVCs
  volumeClaimTemplates:
    - metadata:
        name: holochain-data
      spec:
        accessModes: [ReadWriteOnce]
        # Node-local storage — P2P dataplane is the replication layer, not k8s
        storageClassName: "STORAGE_CLASS_PLACEHOLDER"
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: storage-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: "STORAGE_CLASS_PLACEHOLDER"
        resources:
          requests:
            storage: 5Gi
---
# Headless service for StatefulSet DNS-based peer discovery
# Pod gets stable DNS name: RESOURCE_PREFIX_PLACEHOLDER-0.RESOURCE_PREFIX_PLACEHOLDER-headless.NAMESPACE_PLACEHOLDER.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: RESOURCE_PREFIX_PLACEHOLDER-headless
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: elohim-edgenode
    elohim-human: HUMAN_LABEL_PLACEHOLDER
    environment: ENV_PLACEHOLDER
    app.kubernetes.io/name: edgenode
    app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  clusterIP: None
  selector:
    app: elohim-edgenode
    elohim-human: HUMAN_LABEL_PLACEHOLDER
    environment: ENV_PLACEHOLDER
  ports:
    - name: admin-ws
      port: 4444
      targetPort: 8444
      protocol: TCP
    - name: app-ws
      port: 4445
      targetPort: 8445
      protocol: TCP
    - name: p2p
      port: 9876
      targetPort: 9876
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: RESOURCE_PREFIX_PLACEHOLDER
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: elohim-edgenode
    elohim-human: HUMAN_LABEL_PLACEHOLDER
    environment: ENV_PLACEHOLDER
    app.kubernetes.io/name: edgenode
    app.kubernetes.io/instance: INSTANCE_PLACEHOLDER
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  type: ClusterIP
  ports:
    # Conductor admin WebSocket (via socat bridge 8444->4444)
    - name: admin-ws
      port: 4444
      targetPort: 8444
      protocol: TCP
    # Conductor app WebSocket (via socat bridge 8445->4445)
    - name: app-ws
      port: 4445
      targetPort: 8445
      protocol: TCP
    # elohim-storage HTTP API
    - name: storage-db
      port: 8090
      targetPort: 8090
      protocol: TCP
    # P2P libp2p transport
    - name: p2p
      port: 9876
      targetPort: 9876
      protocol: TCP
  selector:
    app: elohim-edgenode
    elohim-human: HUMAN_LABEL_PLACEHOLDER
    environment: ENV_PLACEHOLDER
