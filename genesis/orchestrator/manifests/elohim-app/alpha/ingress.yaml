apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: elohim-site-alpha-ingress
  namespace: elohim-alpha
  labels:
    app.kubernetes.io/name: elohim-site
    app.kubernetes.io/instance: elohim-site-alpha
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    # 1 MB nginx default rejects the 9.6 MB SPA blob PUT from stageSpaBlob
    # (App pipeline Upload SPA Blob stage — HTTP 413 in elohim app #1458).
    # 100m mirrors the elohim-doorway-alpha ingress (doorway/alpha.yaml ~L361).
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    # REMOVED 2026-05-30 (/deliver: the-landing-page-loads). The stale
    # `configuration-snippet` below 302-redirected bare `GET /` to
    # `/apps/elohim-host-landing/index.html`. That changed the browser URL, so the
    # landing SPA's Angular router booted at `/apps/elohim-host-landing` (which has
    # no route) and rendered its own in-app 404 ("...drifted into uncharted space").
    # The 200-OK pre-hydration HTML masked it; the bug only shows after hydration.
    #
    # The redirect is a ROOT_APP_SLUG-era vestige. The doorway's EPR router now
    # serves url_path="/" INLINE — verified live:
    #   GET https://doorway-alpha.elohim.host/  (the doorway's own ingress, no snippet)
    #   → HTTP 200, x-epr-router: dispatched, 6866b landing index, <base href="/">.
    # The `path: /` → elohim-doorway-alpha rule below already routes bare `/` to the
    # doorway, so dropping the snippet lets `/` reach the EPR router and the SPA
    # router match the home route. Assets (relative to base href "/") resolve via
    # the root projection's longest-prefix dispatch (e.g. /main-*.js → doorway →
    # /apps/elohim-host-landing/main-*.js).
    #
    # Reversal: restore the `configuration-snippet` annotation block from git
    # history (this file @ aeec00029) if the EPR-router root-serve regresses.
spec:
  ingressClassName: public
  rules:
  - host: alpha.elohim.host
    http:
      paths:
      - backend:
          service:
            name: elohim-doorway-alpha
            port:
              number: 8080
        path: /apps
        pathType: Prefix
      - backend:
          service:
            name: elohim-doorway-alpha
            port:
              number: 8080
        path: /blob
        pathType: Prefix
      # Topology + domain APIs (cluster, peer-topology, reciprocity, etc.)
      # land at /api/v1/* — same-origin proxy via ingress avoids CORS.
      # Mirrors /apps and /blob: alpha.elohim.host/api/v1/X → elohim-doorway-alpha:8080.
      - backend:
          service:
            name: elohim-doorway-alpha
            port:
              number: 8080
        path: /api/v1
        pathType: Prefix
      # SSR-eligible routes — keep in sync with storage's build_manifest()
      # in elohim/elohim-storage/src/http.rs (search for `render("angular-ssr")`).
      # These paths are routes that storage declares with render="angular-ssr".
      # They must reach doorway, not the static SPA pod, so doorway's in-process
      # elohim-render engine can produce a full HTML document for non-JS clients
      # (search crawlers, AI design tools, social-card crawlers, accessibility
      # without JS, AI agents observing the live system). The SPA pod (catch-all
      # below) still serves the SPA bundle and the client-side hydration takes
      # over after first paint.
      #
      # Storage manifest as of 2026-05-07 declares four SSR-eligible groups:
      #   /lamad/concept/{id}         — covered by /lamad/concept Prefix
      #   /lamad/path/{slug}          — covered by /lamad/path Prefix
      #   /lamad/path/{slug}/step/{n} — covered by /lamad/path Prefix
      #   /                           — left on the catch-all for now (SPA shell);
      #                                 graduating root-route SSR is a follow-up.
      - backend:
          service:
            name: elohim-doorway-alpha
            port:
              number: 8080
        path: /lamad/concept
        pathType: Prefix
      - backend:
          service:
            name: elohim-doorway-alpha
            port:
              number: 8080
        path: /lamad/path
        pathType: Prefix
      # Root-route dogfood: serve elohim-host-landing ContentNode via doorway.
      # The doorway exposes html5-app content at /apps/<slug>/<entry>. The
      # `nginx.ingress.kubernetes.io/configuration-snippet` annotation above
      # 302-redirects bare GET / to /apps/elohim-host-landing/index.html, which
      # doorway then serves from the html5-app bundle blob.
      #
      # Reversal: revert this commit to restore elohim-site-alpha-service:80 as
      # the static SPA fallback. The pod and service must remain deployed.
      - backend:
          service:
            name: elohim-doorway-alpha
            port:
              number: 8080
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - alpha.elohim.host
    secretName: alpha-elohim-site-tls-cert
