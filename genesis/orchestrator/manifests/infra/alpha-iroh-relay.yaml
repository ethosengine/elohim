# Self-hosted iroh-relay — the conductor fleet's home relay (Wave 2, alpha).
#
# WHY THIS EXISTS
# ----------------
# At Holochain 0.6.3 the conductor's kitsune2 transport can be iroh instead of
# tx5. iroh replaces STUN/TURN + SBD signalling with QUIC hole-punching plus its
# OWN relay protocol — and when `network.relay_url` is unset the endpoint is
# built with `RelayMode::Default`, i.e. n0's PUBLIC relay fleet. That default is
# silent and green: peers connect, gossip flows, nothing logs an error, and every
# NAT-traversed conductor-to-conductor byte transits a third party's box.
#
# Bootstrap and signal are already self-hosted. This is the last outsourced
# transport leg — the same argument the coturn manifests make for TURN, one
# transport generation later. A relay sees only encrypted QUIC bytes: it relays,
# it does not read. It IS an availability + traffic-metadata dependency, which is
# exactly why the community holds it.
#
# Design: genesis/docs/content/elohim-protocol/architecture/2026-08-05-wave2-relay-sovereignty-design.md
# Campaign: genesis/docs/superpowers/plans/2026-08-04-holochain-iroh-convergence-upgrade-campaign.md (Wave 2, Task E1)
# Config-mapping evidence: genesis/docs/content/elohim-protocol/history/2026-08-04-holochain-iroh-dep-verification-pack.md (verdict 3)
#
# ⚠ INERT UNTIL APPLIED. Cluster ops are operator-owned; the repo is the
#   reconcile surface. Nothing here takes effect from a dev session.
#
# ─ VERSION CONTRACT (do not bump casually) ──────────────────────────────────
# Conductor 0.6.3 -> kitsune2 0.4.1 -> kitsune2_transport_iroh 0.4.1 ->
# iroh-holochain 0.95.1 -> iroh-relay-holochain 0.95.1 (the relay CLIENT).
# The server pinned below is STOCK iroh-relay 0.95.1 from crates.io. That is the
# right pairing on four independent lines of evidence:
#   1. iroh-relay-0.95.1/src/http.rs is BYTE-IDENTICAL to
#      iroh-relay-holochain-0.95.1/src/http.rs (same RELAY_PROTOCOL_VERSION
#      "iroh-relay-v1", same RELAY_PATH "/relay", same client-auth header).
#   2. holochain_p2p 0.6.3 and holochain 0.6.3 themselves dev-depend on stock
#      iroh-relay 0.95.1 with features ["server","test-utils"].
#   3. Upstream's own conductor rendezvous harness spawns that stock server and
#      points transport-iroh conductors at it
#      (crates/holochain/src/sweettest/sweet_conductor_config_rendezvous.rs).
#   4. iroh-relay 0.95.1 publishes a Cargo.lock whose crypto chain
#      (curve25519-dalek 5.0.0-pre.1 / ed25519-dalek 3.0.0-pre.1 /
#      digest 0.11.0-rc.3 / sha2 0.11.0-rc.2) is identical to the conductor's
#      resolution, which we have already compiled green.
# The iroh 0.92 storage dataplane can share THIS SAME INSTANCE: the relay wire is
# identical 0.92<->0.95.1 (frame tags 0-12, handshake structs, protocol string,
# QAD ALPN all unchanged; the diff is a Node*->Endpoint* rename plus an
# error-library swap). Sharing the INSTANCE is fine; sharing the CONFIG KEY is
# not — the conductor's relay is `network.relay_url` in conductor-config, the
# dataplane's is a separate IrohConfig field. Two keys, one hostname.
#
# ─ OPERATOR DEPLOY-TIME ACTIONS (irreducible, cluster/network-owned) ────────┐
# │ 1. HARBOR MIRROR. Build + push the image (recipe below). The fleet pulls  │
# │    Harbor; we deliberately do NOT pull a third-party registry for the one │
# │    component whose purpose is removing a third-party dependency.          │
# │                                                                            │
# │      # Dockerfile (follow relay-addr-beacon/Dockerfile's shape: own build  │
# │      # context, no path-deps, crates.io direct — NOT through Nexus, per    │
# │      # the 2026-07-30 decision recorded in that file):                     │
# │      #   FROM rust:1-slim-bookworm AS builder                              │
# │      #   ENV RUSTFLAGS=""            # clear the Holochain WASM getrandom  │
# │      #   RUN apt-get update && apt-get install -y --no-install-recommends \│
# │      #         pkg-config && rm -rf /var/lib/apt/lists/*                   │
# │      #   RUN cargo install iroh-relay --version 0.95.1 --locked \          │
# │      #         --features server --root /out                               │
# │      #   FROM debian:bookworm-slim AS runtime                              │
# │      #   RUN apt-get update && apt-get install -y --no-install-recommends \│
# │      #         ca-certificates && rm -rf /var/lib/apt/lists/*              │
# │      #   COPY --from=builder /out/bin/iroh-relay /usr/local/bin/iroh-relay │
# │      #   ENTRYPOINT ["/usr/local/bin/iroh-relay"]                          │
# │                                                                            │
# │    --locked IS LOAD-BEARING, not hygiene: iroh-base 0.95.1 exact-pins       │
# │    curve25519-dalek =5.0.0-pre.1, the pre-release whose published source    │
# │    carries the digest::crypto_common path bug that froze the storage         │
# │    dataplane on iroh 0.92. The bug is resolution-conditional; the published  │
# │    lock pins the digest 0.11.0-rc.3 that works. Unlocked is a coin flip.     │
# │                                                                            │
# │      nerdctl -n k8s.io build -t iroh-relay:0.95.1 -f <Dockerfile> <ctx>    │
# │      nerdctl -n k8s.io tag  iroh-relay:0.95.1 \                            │
# │        harbor.ethosengine.com/ethosengine/iroh-relay:0.95.1-dev-latest     │
# │      nerdctl -n k8s.io push \                                              │
# │        harbor.ethosengine.com/ethosengine/iroh-relay:0.95.1-dev-latest     │
# │                                                                            │
# │ 2. DNS. Create `relay.elohim.host` as a CNAME -> `alpha.elohim.host`       │
# │    (Cloudflare, proxied:false — the relay-addr-beacon hard-writes its      │
# │    owned records unproxied and would fight a proxied flag).                │
# │    WHY A CNAME: alpha.elohim.host is the beacon-maintained A record for    │
# │    the operations WAN, whose IP is DYNAMIC (residential Google Fiber). A   │
# │    CNAME inherits the beacon's drift-healing for free — no second record   │
# │    to keep synced. See project_two_premises_dns_beacon_owned.              │
# │                                                                            │
# │ 3. NETWORKPOLICY. elohim-alpha runs `default-deny-cross-env`. Ingress has  │
# │    a lane (so the relay is reachable), but the PodMonitor below will read  │
# │    DOWN until port 9090 is added to `allow-metrics-from-observability` in  │
# │    genesis/orchestrator/manifests/infra/alpha-metrics-networkpolicy.yaml.  │
# │    Shipped-with-a-known-gap rather than omitted, so the gap is closeable.  │
# │                                                                            │
# │ 4. APPLY PATH. Confirm which pipeline applies infra/*.yaml. As of the      │
# │    alpha-doorway-podmonitor.yaml header (2026-06-17) this was an OPEN gap. │
# │    A relay that exists only in the repo blocks the whole wave.             │
# │                                                                            │
# │ 5. NO ROUTER PORT-FORWARD NEEDED for this phase — the relay rides the      │
# │    existing HTTPS ingress. Phase B (QAD, below) would need UDP 7842.       │
# └────────────────────────────────────────────────────────────────────────────┘
#
# ─ WHY TLS TERMINATES AT THE INGRESS, NOT IN THE RELAY ──────────────────────
# With no [tls] section the relay registers ALL its services on the single
# http_bind_addr listener: /relay (websocket plane), /ping (the Https latency
# probe), /generate_204 (captive-portal probe), /, /robots.txt. One Service port,
# one Ingress rule — exactly the doorway pattern. If the relay held TLS itself,
# /generate_204 would move to a SEPARATE plain-HTTP listener and we would need
# two ports and two ingress paths for no benefit.
# The one cost, verified: the relay client's fast-path auth uses TLS exported
# keying material, which cannot be verified behind a terminating proxy. It does
# NOT break — the server-side handshake explicitly falls back to a
# challenge/response round trip ("Verification not succeeding is part of normal
# operation: The TLS exporter isn't required to match",
# iroh-relay-0.95.1/src/protos/handshake.rs serverside()). Cost is one extra RTT
# per CONNECTION, not per frame.
#
# ─ WHY QAD (QUIC ADDRESS DISCOVERY) IS OFF IN THIS PHASE ────────────────────
# iroh 0.9x has NO STUN — net_report probes are exactly Https + QadIpv4 +
# QadIpv6. The NAT-assist mechanism is QAD: a QUIC connection to UDP 7842 with
# ALPN /iroh-qad/0, which needs the relay to hold its OWN certificate and a raw
# UDP path. ingress-nginx cannot proxy that, and this cluster has no
# LoadBalancer/MetalLB (see the coturn manifests' hostNetwork rationale).
# QAD-absent is a SUPPORTED topology, not a broken one: upstream's own conductor
# rendezvous harness runs relay.tls=None AND quic=None and conductors work.
# The cost is real but measurable: conductors still probe UDP 7842 (kitsune2
# builds the relay map via RelayMap::from_iter([url]), and From<RelayUrl> for
# RelayConfig sets quic: Some(port 7842) unconditionally), those probes fail
# benignly, endpoints do not learn their observed public address from the relay,
# so hole-punching has fewer candidates and more traffic stays relayed.
# THE METER: Loki, container=elohim-node, `Connection established ... direct=`.
# Phase B is justified by that ratio, not by theory. Phase B shape: cert-manager
# Certificate -> secret -> mounted PEM pair -> [tls] cert_mode="reloading" ->
# enable_quic_addr_discovery=true -> a raw UDP:7842 path (hostNetwork/hostPort —
# this is the ONE place the coturn hostNetwork pattern is the RIGHT model). Note
# Phase B also moves /generate_204 onto a second listener, so it is a real second
# design pass, not a toggle.
#
# ─ POSTURE: UNAUTHENTICATED (deliberate, ratified) ──────────────────────────
# Doorway's custom k2 bootstrap implements neither /authenticate nor
# /relay/register, so `base64_auth_material_relay` must stay UNSET in the
# conductor config — setting it against a base that lacks those endpoints makes
# the endpoint fail to come up, it does not degrade. Accordingly the relay runs
# access="everyone". Exposure: anyone who learns the hostname can forward their
# own iroh traffic through it. They cannot read ours, cannot join our DHT, and
# cannot enumerate our peers from the relay. Two cheap bounds exist without a
# client change: `access` can move to an allowlist of endpoint ids, or to
# access="http" (the relay POSTs each connecting endpoint id to a URL we control
# — doorway could answer that from the bootstrap store without implementing the
# kitsune2 auth protocol at all). Evaluate the http mode before the full
# authenticated-relay path.
#
# ─ WHY replicas: 1 (a CORRECTNESS choice, not a cost choice) ────────────────
# Relay clients hold a long-lived connection and TWO PEERS MUST BE ON THE SAME
# RELAY INSTANCE for it to forward between them. Round-robining two replicas
# would silently break relaying for every pair that lands on different pods.
# Replicas would need session affinity on endpoint id, which the ingress cannot
# express. Also note this is a SINGLE relay where coturn deliberately ran a
# DUAL-WAN pair — a known resilience regression accepted for one wave, forced by
# kitsune2 0.4.1 exposing relay_url as a singular Option<String>. The named
# follow-up is upstream: make it a list, so the N-node federated relay commons in
# genesis/data/timeline/backlog/sovereign-turn-relay-transport-commons.md becomes
# expressible on iroh.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: iroh-relay-config
  namespace: elohim-alpha
  labels:
    app: iroh-relay
    environment: alpha
    app.kubernetes.io/name: iroh-relay
    app.kubernetes.io/instance: iroh-relay-alpha
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
data:
  # iroh-relay 0.95.1 server config (TOML). Keys verified against
  # iroh-relay-0.95.1/src/main.rs `struct Config`.
  relay.toml: |
    # Relay the byte plane. This is the whole point of the deployment.
    enable_relay = true

    # Plain HTTP; nginx terminates TLS (see header). 3340 is upstream's own
    # dev-mode port — chosen over the :80 default so the container needs no
    # NET_BIND_SERVICE capability. With no [tls] section this ONE listener
    # serves /relay, /ping, /generate_204, / and /robots.txt.
    http_bind_addr = "[::]:3340"

    # OFF this phase — needs relay-held TLS + a raw UDP:7842 path. See header.
    enable_quic_addr_discovery = false

    # Sized for a fleet of ~7, not upstream's 1M-client default (which would
    # reserve ~56 MB). 8192 entries costs ~450 KB.
    key_cache_capacity = 8192

    # Explicit rather than defaulted, so the posture is a RECORDED decision.
    access = "everyone"

    enable_metrics = true
    metrics_bind_addr = "[::]:9090"

    # [limits] DELIBERATELY UNSET. Per-client rx byte/burst caps are available
    # (limits.client.rx.bytes_per_second / max_burst_bytes) but a cap set below
    # gossip's real burst profile does not ERROR — it silently slows the DHT and
    # reads as a transport fault. Set it after a bytes/sec baseline exists on
    # the /metrics surface, not before.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iroh-relay
  namespace: elohim-alpha
  labels:
    app: iroh-relay
    environment: alpha
    app.kubernetes.io/name: iroh-relay
    app.kubernetes.io/instance: iroh-relay-alpha
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two relay pods alive at once means peers can
  # land on different instances and silently fail to reach each other (see the
  # replicas:1 rationale in the header). A brief relay gap is the safer failure.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: iroh-relay
      environment: alpha
  template:
    metadata:
      annotations:
        # Bump when relay.toml changes — the relay reads its config only at
        # startup, so a ConfigMap edit without a pod restart never lands.
        elohim.host/conf-revision: "2026-08-05-phase-a-no-qad"
      labels:
        app: iroh-relay
        environment: alpha
        app.kubernetes.io/name: iroh-relay
        app.kubernetes.io/instance: iroh-relay-alpha
        app.kubernetes.io/component: infra
        app.kubernetes.io/part-of: elohim
        app.kubernetes.io/managed-by: jenkins
    spec:
      # HARD-PINNED to the operations node (Intel-NUC, node-type=operations) —
      # the always-on on-prem infra node where mongodb / nats / doorway-A also
      # hard-pin. NOT shem: shem is the capability the scope gate turns off
      # (feedback_household_nodes_is_the_stable_floor), and this is the fleet's
      # SINGLE relay. Pinning it to the leg that gets suspended would make relay
      # availability track the least reliable premise. The pin also keeps the
      # pod coherent with the `relay.elohim.host -> alpha.elohim.host` CNAME,
      # which points at THIS premise's WAN.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - operations
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: iroh-relay
          # Mirrored into Harbor from crates.io — see OPERATOR ACTION 1.
          image: harbor.ethosengine.com/ethosengine/iroh-relay:0.95.1-dev-latest
          imagePullPolicy: Always
          args:
            - "--config-path"
            - "/etc/iroh-relay/relay.toml"
          env:
            # info is the right floor: the relay logs client connect/disconnect
            # at info, which is the census we read during the soak.
            - name: RUST_LOG
              value: "iroh_relay=info,info"
          ports:
            - name: relay-http
              containerPort: 3340
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Generous-probe pattern (2026-05-27): timeoutSeconds: 15.
          # /robots.txt is registered on the relay builder UNCONDITIONALLY
          # (iroh-relay-0.95.1/src/server.rs:383), unlike /generate_204 which
          # exists on this listener only while TLS is off. Probing robots.txt
          # keeps the probe correct if Phase B ever enables relay-side TLS.
          readinessProbe:
            httpGet:
              path: /robots.txt
              port: 3340
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /robots.txt
              port: 3340
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: relay-config
              mountPath: /etc/iroh-relay
              readOnly: true
      volumes:
        - name: relay-config
          configMap:
            name: iroh-relay-config
---
apiVersion: v1
kind: Service
metadata:
  name: iroh-relay
  namespace: elohim-alpha
  labels:
    app: iroh-relay
    environment: alpha
    app.kubernetes.io/name: iroh-relay
    app.kubernetes.io/instance: iroh-relay-alpha
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  type: ClusterIP
  ports:
    - name: relay-http
      port: 3340
      targetPort: relay-http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app: iroh-relay
    environment: alpha
---
# Public Ingress — relay.elohim.host. Follows the doorway ingress pattern
# (ingress-nginx + cert-manager letsencrypt-production + the websocket
# annotation set), NOT the coturn hostNetwork pattern: this is an HTTPS/WSS
# plane, not a raw UDP one.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iroh-relay
  namespace: elohim-alpha
  labels:
    app: iroh-relay
    environment: alpha
    app.kubernetes.io/name: iroh-relay
    app.kubernetes.io/instance: iroh-relay-alpha
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
  annotations:
    # WebSocket support for /relay. The relay connection is long-lived BY
    # DESIGN — a short read timeout produces a reconnect storm that reads as
    # relay instability.
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "iroh-relay"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    # LOAD-BEARING. iroh's captive-portal probe is issued as
    # http://{host}/generate_204 (iroh net_report reportgen.rs). A 301 to https
    # is not a 204 — forcing redirect makes every conductor believe it is behind
    # a captive portal. Do NOT "tidy" this to true.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    # The relay wire caps a frame at 1 MiB (iroh-relay protos/relay.rs
    # MAX_FRAME_SIZE). This does not gate post-upgrade websocket frames, but
    # costs nothing as headroom on the upgrade request itself.
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    # NO upstream-hash-by: there is exactly one backend pod by design
    # (see replicas:1 in the header) and a hash annotation would imply otherwise.
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: public
  tls:
    - hosts:
        - relay.elohim.host
      secretName: iroh-relay-alpha-tls
  rules:
    - host: relay.elohim.host
      http:
        paths:
          # Whole host to the relay: /relay (wss), /ping (Https latency probe),
          # /generate_204 (captive-portal probe), /, /robots.txt all live on the
          # single relay listener while TLS is terminated upstream.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iroh-relay
                port:
                  number: 3340
---
# PodMonitor — scrape the relay's /metrics.
#
# ⚠ THIS TARGET READS **DOWN** until the operator adds port 9090 to
#   `allow-metrics-from-observability` in
#   genesis/orchestrator/manifests/infra/alpha-metrics-networkpolicy.yaml —
#   elohim-alpha runs `default-deny-cross-env`, which gives the observability
#   namespace no lane to app /metrics ports. Shipped WITH the known gap rather
#   than omitted, so the gap is visible and closeable instead of forgotten.
#   Same operator preconditions as alpha-doorway-podmonitor.yaml: the Prometheus
#   Operator's podMonitorSelector must admit `release: kube-prom-stack`, its
#   podMonitorNamespaceSelector must admit elohim-alpha, and some pipeline must
#   apply infra/*.yaml.
#
# What it is for: the relay-side census. Connected-client count should equal the
# flipped conductor count — a short count names WHICH peer never found the relay,
# which no conductor-side probe can tell you.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: iroh-relay
  namespace: elohim-alpha
  labels:
    app: iroh-relay
    environment: alpha
    release: kube-prom-stack
    app.kubernetes.io/name: iroh-relay
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  namespaceSelector:
    matchNames:
      - elohim-alpha
  selector:
    matchLabels:
      app: iroh-relay
  podMetricsEndpoints:
    - port: metrics # containerPort 9090
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: false
