# MongoDB for Doorway Alpha — projection cache, identity store, conductor registry
#
# Single-node MongoDB 7 for dev/alpha use.
# Data persists via PVC across pod restarts.
# No auth — cluster-internal only (ClusterIP).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data
  namespace: elohim-alpha
  labels:
    app: mongodb
    environment: alpha
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: mongodb-alpha
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: elohim-alpha
  labels:
    app: mongodb
    environment: alpha
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: mongodb-alpha
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
      environment: alpha
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mongodb
        environment: alpha
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/instance: mongodb-alpha
        app.kubernetes.io/component: infra
        app.kubernetes.io/part-of: elohim
        app.kubernetes.io/managed-by: jenkins
    spec:
      securityContext:
        fsGroup: 999
      # HARD-pin to the operations node (intel-nuc). MongoDB's data lives on a
      # node-local openebs-hostpath PVC, so the pod MUST always schedule where that
      # data physically is. The previous soft `preferredDuringScheduling` affinity
      # (operations > edge > performance) let the pod drift onto an edge node
      # (thinkc-p0h) when the PVC was re-provisioned — stranding the hostpath data
      # there and losing identity data (incident 2026-06-13). A hard nodeSelector
      # keeps the pod and its hostpath PVC co-located on intel-nuc.
      nodeSelector:
        node-type: operations
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
              protocol: TCP
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 15
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 15
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-data
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: elohim-alpha
  labels:
    app: mongodb
    environment: alpha
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: mongodb-alpha
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP
  selector:
    app: mongodb
    environment: alpha
