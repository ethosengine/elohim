# MongoDB for Doorway Staging — projection cache, identity store, conductor registry
#
# Single-node MongoDB 7 for staging use.
# Data persists via PVC across pod restarts.
# No auth — cluster-internal only (ClusterIP).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data
  namespace: elohim-staging
  labels:
    app: mongodb
    environment: staging
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: mongodb-staging
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: elohim-staging
  labels:
    app: mongodb
    environment: staging
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: mongodb-staging
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
      environment: staging
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mongodb
        environment: staging
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/instance: mongodb-staging
        app.kubernetes.io/component: infra
        app.kubernetes.io/part-of: elohim
        app.kubernetes.io/managed-by: jenkins
    spec:
      securityContext:
        fsGroup: 999
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - operations
            - weight: 70
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - edge
            - weight: 60
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - performance
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
              protocol: TCP
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-data
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: elohim-staging
  labels:
    app: mongodb
    environment: staging
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: mongodb-staging
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP
  selector:
    app: mongodb
    environment: staging
