# Standalone dynamic-WAN DNS beacons for alpha's two premises.
#
# This is the Wave-2 relay-sovereignty §6.2 retirement prerequisite. The same
# Cloudflare ownership lanes currently run as sidecars in the two coturn pods;
# keeping them there makes coturn removal stale the entire elohim.host zone on
# the next residential WAN-IP change. These Deployments deliberately own DNS
# freshness only: no coturn sink, config volume, process-namespace sharing, or
# CAP_KILL survives the re-home.
#
# APPLY/RETIRE ORDER (operator-owned; never reconcile the live cluster by hand
# from a development environment):
#   1. Apply this file while both coturn beacons still run.
#   2. Observe each standalone beacon publish its exclusive record and keep the
#      shared doorways.elohim.host contribution fresh for at least one cycle.
#   3. Exercise the drift gate from design §6.2: each beacon must log
#      `exclusive record DRIFTED` and restore its record within 30 seconds.
#   4. Only then remove the beacon containers from the coturn manifests. Coturn
#      itself remains until every tx5 conductor has retired.
#
# The two documents are intentionally separate one-replica Deployments rather
# than one homogeneous two-replica Deployment: each premise owns a different
# exclusive record and a different shared-record owner slug.
#
# PARKED (branch sprint/apex-multi-a-ingress, 2026-09-12 operator ruling —
# doorway/doorway-service/.epr-meta/doorway-failover.habit.md, RULING line;
# WS3 + Task 3.1 of genesis/docs/superpowers/plans/2026-07-31-doorway-federation-failover-sprint-plan.md).
# Both legs below now contribute elohim.host (the apex) as a SECOND shared
# lane, alongside the existing doorways.elohim.host lane, using the
# repeatable `--shared-record <name>=<owner>` flag (relay-addr-beacon
# commit 906d7b159, "feat(beacon): repeatable shared-record lanes" — already
# on dev at this branch's base 9792af2e1, so the `:dev-latest` image tag
# already accepts this flag; no beacon rebuild is required, only the
# operator's ingress-class prerequisite above). Each `--shared-record` is
# reconciled independently by the SAME join/leave-hysteresis loop as the
# doorways.elohim.host lane — same probe, exact-owner writes (see
# relay-addr-beacon/src/config.rs `shared_record_lanes`).
#
# This REPLACES the shem leg's former exclusive `--record-name elohim.host`
# ownership (the pre-2026-09-12 apex re-home) — elohim.host is no longer
# single-owner, it is shared by both legs same as doorways.elohim.host
# already was. The shem leg keeps an EXCLUSIVE diagnostic name so its own
# WAN identity is still independently checkable outside the shared lane:
# `turn-shem.elohim.host` (the name the dual-WAN TURN design already
# expected — see doorway/alpha.yaml's historical apex-rehome comment and
# genesis/docs/superpowers/specs/2026-07-16-dual-wan-utility-plane-failover-design.md).
# The operations leg's exclusive name (alpha.elohim.host) is unchanged.
#
# ROLLBACK (Task 3.1's spec ask): revert each leg's args to a single
# `--shared-record-name doorways.elohim.host --record-owner <leg>` pair (the
# legacy flags relay-addr-beacon still accepts) and restore the shem leg's
# `--record-name elohim.host` exclusive ownership — that is exactly the
# state this diff replaces. No image change is needed either direction.
#
# Do not apply until the operator's per-premise ingress classes exist (see
# manifests/doorway/alpha.yaml + alpha-b.yaml headers) — the shared apex
# lane is safe to reconcile on its own, but doorway ingress would 404/refuse
# elohim.host traffic on an unserved ingressClassName until that lands.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-addr-beacon-operations
  namespace: elohim-alpha
  labels:
    app: relay-addr-beacon
    beacon-leg: operations
    environment: alpha
    app.kubernetes.io/name: relay-addr-beacon
    app.kubernetes.io/instance: relay-addr-beacon-operations-alpha
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: relay-addr-beacon
      beacon-leg: operations
      environment: alpha
  template:
    metadata:
      labels:
        app: relay-addr-beacon
        beacon-leg: operations
        environment: alpha
        app.kubernetes.io/name: relay-addr-beacon
        app.kubernetes.io/instance: relay-addr-beacon-operations-alpha
        app.kubernetes.io/component: infra
        app.kubernetes.io/part-of: elohim
        app.kubernetes.io/managed-by: jenkins
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - operations
      # Preserve premise-local egress: the public-IP echo must observe the
      # operations WAN, never a cluster-routed egress on another node.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: beacon
          image: harbor.ethosengine.com/ethosengine/relay-addr-beacon:dev-latest
          imagePullPolicy: Always
          args:
            - "--interval-secs"
            - "30"
            - "--sink"
            - "cloudflare"
            - "--record-name"
            - "alpha.elohim.host"
            - "--cf-zone"
            - "elohim.host"
            - "--state-file"
            - "/var/lib/relay-addr-beacon/state.json"
            # Two shared lanes, repeatable-flag form (see header): the
            # existing doorway-set name, plus the apex as a SECOND shared
            # lane (2026-09-12 operator ruling) — PARKED until the operator's
            # ingress classes exist.
            - "--shared-record"
            - "doorways.elohim.host=operations"
            - "--shared-record"
            - "elohim.host=operations"
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: relay-addr-beacon-cloudflare
                  key: token
          volumeMounts:
            - name: beacon-state
              mountPath: /var/lib/relay-addr-beacon
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: beacon-state
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-addr-beacon-shem
  namespace: elohim-alpha
  labels:
    app: relay-addr-beacon
    beacon-leg: shem
    environment: alpha
    app.kubernetes.io/name: relay-addr-beacon
    app.kubernetes.io/instance: relay-addr-beacon-shem-alpha
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: relay-addr-beacon
      beacon-leg: shem
      environment: alpha
  template:
    metadata:
      labels:
        app: relay-addr-beacon
        beacon-leg: shem
        environment: alpha
        app.kubernetes.io/name: relay-addr-beacon
        app.kubernetes.io/instance: relay-addr-beacon-shem-alpha
        app.kubernetes.io/component: infra
        app.kubernetes.io/part-of: elohim
        app.kubernetes.io/managed-by: jenkins
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - remote
      tolerations:
        - key: remote-wan
          operator: Exists
          effect: NoSchedule
      # Preserve premise-local egress so the echo service observes shem's WAN.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: beacon
          image: harbor.ethosengine.com/ethosengine/relay-addr-beacon:dev-latest
          imagePullPolicy: Always
          args:
            - "--interval-secs"
            - "30"
            - "--sink"
            - "cloudflare"
            # Exclusive diagnostic name (2026-09-12 operator ruling —
            # PARKED, see header): was elohim.host; the apex is now a
            # SHARED lane below, contributed by both legs, so this leg
            # keeps its own independently-checkable identity under the
            # TURN-plane name the dual-WAN design already expected.
            - "--record-name"
            - "turn-shem.elohim.host"
            - "--cf-zone"
            - "elohim.host"
            - "--state-file"
            - "/var/lib/relay-addr-beacon/state.json"
            # Two shared lanes, repeatable-flag form (see header): the
            # existing doorway-set name, plus the apex as a SECOND shared
            # lane (2026-09-12 operator ruling) — PARKED until the operator's
            # ingress classes exist.
            - "--shared-record"
            - "doorways.elohim.host=shem"
            - "--shared-record"
            - "elohim.host=shem"
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: relay-addr-beacon-cloudflare
                  key: token
          volumeMounts:
            - name: beacon-state
              mountPath: /var/lib/relay-addr-beacon
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: beacon-state
          emptyDir: {}
