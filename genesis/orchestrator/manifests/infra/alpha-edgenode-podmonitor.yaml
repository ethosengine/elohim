# PodMonitor — scrape the elohim-node /metrics surface (design-decision toolkit P0)
#
# elohim-storage now exposes a durable Prometheus app-metrics surface at
# :8090/metrics (container port name `storage-http`): the memory-attribution
# gauges (anon/file leak-vs-cache split, per-process RSS), the identity-namespace
# violation counter, and the RCA instrument suite as they land. Before this, the
# ONLY app-signal surface was tracing→Loki, which 502-storms (it died mid-decision
# on 2026-06-17). This PodMonitor makes those signals graphable/alertable/historical
# in the same Prometheus that already scrapes cadvisor/kube-state.
#
# ⚠ OPERATOR CONFIRMS (cluster is operator-owned — repo is the surface, pipeline
#    reconciles; never kubectl from dev):
#   1. The Prometheus Operator (kube-prom-stack) `podMonitorSelector` admits this —
#      the `release: kube-prom-stack` label is the kube-prometheus-stack default
#      selector; verify the live release name (metric labels show `kube-prom-stack-*`).
#   2. `podMonitorNamespaceSelector` admits namespace `elohim-alpha` (or the Operator
#      watches all namespaces).
#   3. Some pipeline applies genesis/orchestrator/manifests/infra/*.yaml (same path as
#      alpha-nats.yaml / alpha-mongodb.yaml).
# Until (1)-(3) hold, /metrics is still reachable (port-forward / manual scrape); this
# manifest only wires the automatic scrape.
#
# Plan: genesis/docs/superpowers/plans/2026-06-17-design-decision-toolkit-plan.md
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: elohim-edgenode
  namespace: elohim-alpha
  labels:
    app: elohim-edgenode
    environment: alpha
    release: kube-prom-stack
    app.kubernetes.io/name: edgenode
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  namespaceSelector:
    matchNames:
      - elohim-alpha
  selector:
    matchLabels:
      app: elohim-edgenode
  podMetricsEndpoints:
    - port: storage-http # containerPort 8090 — elohim-storage HTTP API (/metrics)
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      # The leak-vs-cache verdict + identity-violation counter are the first
      # metrics; the RCA instrument suite registers into the same /metrics body.
      honorLabels: false
