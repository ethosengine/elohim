# PodMonitor — scrape the doorway-service /metrics surface (design-decision toolkit P2)
#
# doorway-service now exposes a durable Prometheus app-metrics surface at
# :8080/metrics (container port name `gateway-ws` — the MAIN request listener,
# NOT the watchdog `health-wd`/8079). It is the COMPLEMENT of storage's surface:
# doorway sees the conductor only over the wire, so it owns the signals storage
# cannot — the watchdog wedge that precedes a doorway self-kill, conductor
# reconnect/close-code churn, conductor session duration + live fan-out, and how
# much load doorway sheds (admission/breaker/backpressure) and absorbs (projection
# cache, blob pantry). The `up == 0` of THIS target during a fatal main-runtime
# wedge IS the wedge-time signal (alert on it) — the main listener can't answer
# /metrics mid-wedge, by design (the watchdog port stays minimal).
#
# ⚠ OPERATOR CONFIRMS (cluster is operator-owned — repo is the surface, pipeline
#    reconciles; never kubectl from dev):
#   1. The Prometheus Operator (kube-prom-stack) `podMonitorSelector` admits this —
#      the `release: kube-prom-stack` label is the kube-prometheus-stack default
#      selector; verify the live release name (metric labels show `kube-prom-stack-*`).
#   2. `podMonitorNamespaceSelector` admits namespace `elohim-alpha` (or the Operator
#      watches all namespaces).
#   3. Some pipeline applies genesis/orchestrator/manifests/infra/*.yaml (same path as
#      alpha-edgenode-podmonitor.yaml / alpha-nats.yaml).
# Until (1)-(3) hold, /metrics is still reachable (port-forward / manual scrape); this
# manifest only wires the automatic scrape.
#
# Plan: genesis/docs/superpowers/plans/2026-06-17-design-decision-toolkit-plan.md
# Handoff: .claude/handoffs/HANDOFF-2026-06-17-doorway-metrics.md
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: elohim-doorway
  namespace: elohim-alpha
  labels:
    app: elohim-doorway
    environment: alpha
    release: kube-prom-stack
    app.kubernetes.io/name: doorway
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  namespaceSelector:
    matchNames:
      - elohim-alpha
  selector:
    # BOTH doorways, not just A. matchLabels is an exact match, so `app: elohim-doorway`
    # silently excluded doorway B, whose pods label themselves `app: elohim-doorway-b`
    # (genesis/orchestrator/manifests/doorway/alpha-b.yaml:85,90). MEASURED 2026-08-20:
    # `up{pod=~"elohim-doorway-alpha-b-.*"}` returned EMPTY — B had no scrape target at
    # all, so every breaker/shed/backpressure series existed for A only. That is half of
    # the doorway-projection lane dark, and it made a B-side diagnosis curl-only during
    # the 2026-08-20 availability investigation (backlog/alpha-a-projector-chronic-catchup-flap).
    # Still NOT elohim-edgenode — that is the storage pod, scraped by its own PodMonitor.
    matchExpressions:
      - key: app
        operator: In
        values:
          - elohim-doorway
          - elohim-doorway-b
  podMetricsEndpoints:
    - port: gateway-ws # containerPort 8080 — the MAIN listener (/metrics lives here, NOT health-wd/8079)
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      # The complement set (watchdog wedge, reconnect-reason + close-code, session
      # duration histogram, proxy/cache/pantry hit-miss, breaker/backpressure/shed
      # counters, live session fan-out) registers into the same /metrics body.
      honorLabels: false
