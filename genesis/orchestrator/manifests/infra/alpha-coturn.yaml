# Sovereign TURN relay (coturn) — Tier-A transport commons for the genesis pair.
#
# WHY THIS EXISTS
# ---------------
# The genesis conductor pair straddles shem (cloud NAT) ↔ on-prem (home NAT).
# Holochain's conductor↔conductor transport is tx5/WebRTC; with STUN-only ICE a
# srflx↔srflx pair across two NATs never forms a candidate pair, so the DHT
# `get` of a peer-authored action fails ("target action ... is not retrievable")
# and notary canonical heads never converge (elohim.host serves a stale head;
# the projection-reconcile content arm re-flags the same divergent set every
# sweep — divergentAnchor pinned, conductor saturated, doorway breaker open).
#
# The 2026-07-11 diagnostic cure wired a THIRD-PARTY relay
# (staticauth.openrelay.metered.ca, TCP:80/443). As of 2026-07-13 that relay is
# GLOBALLY DEAD: adam (shem/cloud), matthew (on-prem/home) AND a third network
# (dev env) all get identical `i/o timeout` on :80 and :443 — three disjoint
# networks failing the same way ⇒ the relay is down, not any local egress.
# Evidence: adam/matthew conductor logs `tx5_go_pion_sys: failed to get server
# reflexive address ... openrelay.metered.ca ... i/o timeout` + `Failed to ping
# without candidate pairs`. This manifest is the sovereign replacement, closing
# backlog `sovereign-turn-relay-transport-commons` and dht-unity T5's first
# concrete artifact.
#
# TRUST NOTE: a TURN relay sees only encrypted DTLS bytes — it relays, it does
# not read. It IS an availability + traffic-metadata dependency, which is
# exactly why the domain owns it (bootstrap + signal are already sovereign;
# this is the last outsourced transport leg).
#
# ┌─ OPERATOR DEPLOY-TIME ACTIONS (the irreducible cluster-owned residual) ────┐
# │ These are facts/actions only the cluster operator can supply — no repo     │
# │ change bypasses them. The manifest is structurally complete; fill these.   │
# │                                                                            │
# │ 1. DNS: create A record  turn.elohim.host → 136.50.16.133  (shem's OWN     │
# │    dedicated public IP, distinct from the .49 nginx-ingress IP; TLS cert +  │
# │    ice_servers URLs resolve here). If you prefer the ethosengine.com zone,  │
# │    a shem.ethosengine.com A record to the same IP works — but then rename   │
# │    the 3 references (this cert dnsName + both iceServers URLs) to match.    │
# │ 2. Cloud firewall / security group on shem's .133: OPEN inbound            │
# │       3478/udp, 3478/tcp   (STUN/TURN)                                      │
# │       443/tcp              (turns / TLS — see 443 note below)               │
# │       49160-49200/udp      (relay media port range, matches coturn.conf)   │
# │ 3. external-ip: if .133 is a cloud-mapped public IP (shem's host interface  │
# │    holds a private IP), set EXTERNAL_IP in the ConfigMap to                 │
# │    136.50.16.133/<private-ip> so coturn advertises the right relay address. │
# │    If .133 IS the host interface, leave it commented (auto-detected).       │
# │                                                                            │
# │ 443 is now CLEAN: it lives on shem's dedicated .133, NOT the .49 ingress    │
# │ nginx owns — no conflict. This honors the backlog's "turns on 443           │
# │ mandatory" (UDP-blocked / 443-only household egress still traverses).       │
# └────────────────────────────────────────────────────────────────────────────┘
#
# After deploy, the measure (dht-unity §5 DoD): the per-deploy declare-
# propagation probe prints `✓ canonical head propagated to https://elohim.host`
# and notary-authority scenario 2 goes green ×2 fresh edge builds.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn-config
  namespace: elohim-alpha
  labels:
    app: coturn
    environment: alpha
    app.kubernetes.io/name: coturn
    app.kubernetes.io/instance: coturn-alpha
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
data:
  turnserver.conf: |
    # coturn — sovereign Tier-A TURN relay for the genesis conductor pair.
    listening-port=3478
    # turns on 443 (shem's dedicated .133; the .49 ingress is untouched) so
    # UDP-blocked / 443-only household egress can still relay.
    tls-listening-port=443
    # hostNetwork=true, so coturn binds the shem host interface directly.
    # Relay media port range — MUST match the firewall opening (see header).
    min-port=49160
    max-port=49200
    # Long-term-credential mechanism with a static realm user. tx5 takes a
    # static username/credential (it cannot do the time-limited REST flow),
    # so use LTC, not use-auth-secret.
    lt-cred-mech
    realm=turn.elohim.host
    # Static user. Alpha idiom = inline dev credential (mirrors the doorway
    # dev secret + the retired openrelayproject creds); harden via the pipeline
    # secret path for prod. Keep in sync with the iceServers credential in
    # _edgenode-consolidated.template.yaml + adam-firstman.yaml.
    user=elohim:alpha-turn-commons-2026
    # TLS material — mounted from the cert-manager Certificate below.
    cert=/etc/coturn/tls/tls.crt
    pkey=/etc/coturn/tls/tls.key
    # OPERATOR: uncomment + set if shem is a cloud-NAT host (see header §3).
    # external-ip=EXTERNAL_IP
    fingerprint
    stale-nonce=600
    no-cli
    no-multicast-peers
    # Do not relay to private/link-local ranges (SSRF hygiene on a public relay).
    denied-peer-ip=10.0.0.0-10.255.255.255
    denied-peer-ip=172.16.0.0-172.31.255.255
    denied-peer-ip=192.168.0.0-192.168.255.255
    denied-peer-ip=169.254.0.0-169.254.255.255
    denied-peer-ip=127.0.0.0-127.255.255.255
    allowed-peer-ip=0.0.0.0-9.255.255.255
    log-file=stdout
    simple-log
    verbose
---
# TLS certificate for turns:5349 — issued by cert-manager for turn.elohim.host.
# OPERATOR: confirm the ClusterIssuer name matches the one the app/doorway
# ingresses already use (grep 'cluster-issuer' in the ingress manifests); the
# placeholder below is the common letsencrypt-prod name.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: coturn-tls
  namespace: elohim-alpha
  labels:
    app: coturn
    environment: alpha
    app.kubernetes.io/name: coturn
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  secretName: coturn-tls
  dnsNames:
    - turn.elohim.host
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
  namespace: elohim-alpha
  labels:
    app: coturn
    environment: alpha
    app.kubernetes.io/name: coturn
    app.kubernetes.io/instance: coturn-alpha
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  replicas: 1
  # Single relay; recreate rather than run two binding the same host ports.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: coturn
      environment: alpha
  template:
    metadata:
      labels:
        app: coturn
        environment: alpha
        app.kubernetes.io/name: coturn
        app.kubernetes.io/instance: coturn-alpha
        app.kubernetes.io/component: infra
        app.kubernetes.io/part-of: elohim
        app.kubernetes.io/managed-by: jenkins
    spec:
      # Pinned to shem (node-type=remote) — the public-IP node the pair reaches.
      # Mirrors doorway-B / adam placement; REQUIRED so hostNetwork binds the
      # correct public interface.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - remote
      tolerations:
        # shem carries the WAN/remote-zone taint (see adam-firstman.yaml).
        - key: node-type
          operator: Equal
          value: remote
          effect: NoSchedule
      # Raw UDP/TCP + a media port range cannot ride the HTTP nginx ingress and
      # this cluster has no LoadBalancer/MetalLB — bind the shem host directly.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: coturn
          image: coturn/coturn:4.6.2
          args: ["-c", "/etc/coturn/turnserver.conf"]
          ports:
            - name: turn-udp
              containerPort: 3478
              protocol: UDP
              hostPort: 3478
            - name: turn-tcp
              containerPort: 3478
              protocol: TCP
              hostPort: 3478
            - name: turns-tcp
              containerPort: 443
              protocol: TCP
              hostPort: 443
          volumeMounts:
            - name: config
              mountPath: /etc/coturn
              readOnly: true
            - name: tls
              mountPath: /etc/coturn/tls
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # turns binds :443 (privileged <1024) under hostNetwork.
              add: ["NET_BIND_SERVICE"]
      volumes:
        - name: config
          configMap:
            name: coturn-config
        - name: tls
          secret:
            secretName: coturn-tls
            optional: true
