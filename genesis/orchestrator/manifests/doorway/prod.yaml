# Doorway Production Deployment — Agency On-Ramp
#
# ============================================================================
# PAUSED 2026-05-22 — focused on dev-branch doorway federation proof.
# ============================================================================
# The prod pipeline has not been pushed in some time and the prod environment
# has been dormant. We are deliberately staying on the dev/alpha pipeline to
# prove the doorway-federation surface (two doorways in elohim-alpha — see
# manifests/doorway/alpha.yaml + alpha-b.yaml) before resuming multi-branch
# merges to main.
#
# The apex hostname `doorway.elohim.host` will be left bound to this manifest
# until federation lands; `elohim.host` (which used to be the elohim-app prod
# frontend at this same apex) has been re-bound to elohim-alpha/doorway-alpha-b.
#
# Operator must `kubectl delete ingress -n elohim-prod elohim-doorway-prod`
# on the live cluster once after the federation proof lands if you want to
# free `doorway.elohim.host` too — currently that hostname is still claimed
# by this prod doorway and was not displaced.
# ============================================================================
#
# Five roles in one process:
#   1. DNS/TLS gateway (stateless HTTP routing)
#   2. Bootstrap/Signal (agent discovery + WebRTC relay)
#   3. Projection cache (HTTP API for DHT content)
#   4. Identity host (custodial agent keys for hosted users)
#   5. Recovery registrar (relationship-based identity recovery)
#
# Never owns data — connects to P2P StatefulSet via ClusterIP service.
# Scaling is via the conductor pool behind doorway, not doorway replicas.
# See doorway/SCALING.md for the full model.
#
# Architecture:
#   Browser -> Ingress -> Doorway (auth + routing) -> edgenode service (conductor/storage)
#   Doorway-app (operator dashboard) served from same pod via localhost
#
# Ports:
#   - 8080: Doorway Gateway (public, authenticated)
#   - 80:   Operator Dashboard (nginx, pod-internal)
---
# Secret for Doorway Gateway API keys
apiVersion: v1
kind: Secret
metadata:
  name: elohim-doorway-prod-secrets
  namespace: elohim-prod
  labels:
    app: elohim-doorway
    environment: prod
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-prod
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
type: Opaque
stringData:
  # IMPORTANT: These MUST be changed before production deployment!
  # Use strong, unique keys generated with: openssl rand -hex 32
  api-key-authenticated: "CHANGE-ME-prod-elohim-auth-2024"
  api-key-admin: "CHANGE-ME-prod-elohim-admin-2024"
  jwt-secret: "CHANGE-ME-prod-jwt-secret-use-openssl-rand-hex-32"
---
# The prod doorway's OWN Ed25519 node identity (story 5.1, commit a9910d11c).
# Full rationale on alpha.yaml's twin block; the staging-specific note about soft node
# affinity (the first consumer fixes the node, the hostpath PV's own nodeAffinity keeps
# the rollout there, losing that node leaves the doorway Pending) applies here too.
#
# On prod this key is load-bearing beyond hygiene: it is what a doorway's DID document
# and JWKS entry mean. Deleting this claim is a deliberate identity rotation, not a
# cache flush — every peer that cached this doorway's key must re-fetch.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elohim-doorway-prod-node-key
  namespace: elohim-prod
  labels:
    app: elohim-doorway
    environment: prod
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-prod
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      # One 32-byte file; must never change (hostpath PVCs cannot be expanded).
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elohim-doorway-prod
  namespace: elohim-prod
  labels:
    app: elohim-doorway
    environment: prod
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-prod
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  replicas: 1
  # EXPLICIT for the same reason as alpha.yaml's twin: the node-key PVC's safety rests
  # on maxUnavailable:0 (the serving pod is never terminated before the surge pod is
  # Ready), so a doorway that cannot mount or write its key file fails the rollout
  # without interrupting serving.
  # Covers the ROLLOUT path only — not eviction, node loss, or a pod that turns Ready
  # and fails later. Never `Recreate`.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: elohim-doorway
      environment: prod
  template:
    metadata:
      labels:
        app: elohim-doorway
        environment: prod
        app.kubernetes.io/name: doorway
        app.kubernetes.io/instance: doorway-prod
        app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: elohim
        app.kubernetes.io/managed-by: jenkins
    spec:
      # uid/gid 1000 (`USER doorway`) must be able to write the node-key volume on
      # first boot — see alpha.yaml's twin comment.
      securityContext:
        fsGroup: 1000
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - operations
            - weight: 70
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - edge
            - weight: 60
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - performance
      containers:
        # Doorway Gateway - Rust WebSocket gateway with auth, worker pool
        - name: doorway
          image: harbor.ethosengine.com/ethosengine/elohim-doorway:DOORWAY_TAG_PLACEHOLDER
          imagePullPolicy: Always
          args:
            - "--listen"
            - "0.0.0.0:8080"
            - "--conductor-url"
            - "ws://elohim-frank-prod:4445"
          ports:
            - name: gateway-ws
              containerPort: 8080
              protocol: TCP
          env:
            - name: DEV_MODE
              value: "true"
            - name: RUST_LOG
              value: "warn,doorway=info"
            - name: PROJECTION_WRITER
              value: "true"
            # Prod hosts Frank (farmer) — independent economy node
            - name: CONDUCTOR_URLS
              value: "CONDUCTOR_URLS_PLACEHOLDER"
            - name: CONDUCTOR_ADMIN_URL
              value: "ws://elohim-frank-prod-conductor:4444"
            - name: STORAGE_URL
              value: "http://elohim-frank-prod.elohim-prod.svc.cluster.local:8090"
            - name: STORAGE_URLS
              value: "STORAGE_URLS_PLACEHOLDER"
            - name: THRESHOLD_URL
              value: "http://localhost:80"
            - name: NATS_URL
              value: "nats://nats.elohim-prod:4222"
            - name: MONGODB_URI
              value: "mongodb://mongodb.elohim-prod:27017"
            - name: MONGODB_DB
              value: "doorway-prod"
            - name: DOORWAY_ID
              value: "prod-elohim-host"
            - name: DOORWAY_URL
              value: "https://doorway.elohim.host"
            - name: BOOTSTRAP_URL
              value: "https://doorway.elohim.host/bootstrap"
            - name: SIGNAL_URL
              value: "wss://signal.doorway.elohim.host"
            - name: INSTALLED_APP_ID
              value: "elohim"
            - name: HAPP_BUNDLE_PATH
              value: "/opt/holochain/elohim.happ"
            - name: FEDERATION_PEERS
              value: "https://doorway-alpha.elohim.host,https://doorway-staging.elohim.host"
            # This doorway's OWN persistent node identity — a FILE path inside its own
            # claim. Story 5.1 semantics and the household's shape: see alpha.yaml's
            # twin comment and app/elohim-app/scripts/hc-mesh.sh.
            - name: DOORWAY_NODE_KEY_FILE
              value: "/var/lib/doorway/node/doorway-node.key"
            - name: API_KEY_AUTHENTICATED
              valueFrom:
                secretKeyRef:
                  name: elohim-doorway-prod-secrets
                  key: api-key-authenticated
            - name: API_KEY_ADMIN
              valueFrom:
                secretKeyRef:
                  name: elohim-doorway-prod-secrets
                  key: api-key-admin
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: elohim-doorway-prod-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Generous-probe pattern (2026-05-27): timeoutSeconds: 15.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          volumeMounts:
            - name: node-key
              mountPath: /var/lib/doorway/node
        # Doorway Operator Dashboard - Angular app for node operators
        # Provides: federated OAuth, node metrics, configuration UI
        - name: doorway-app
          image: harbor.ethosengine.com/ethosengine/doorway-app:DOORWAY_APP_TAG_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: operator-ui
              containerPort: 80
              protocol: TCP
          env:
            - name: DOORWAY_API_URL
              value: "http://localhost:8080"
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          # Generous-probe pattern (2026-05-27): timeoutSeconds: 15.
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
      volumes:
        - name: node-key
          persistentVolumeClaim:
            claimName: elohim-doorway-prod-node-key
---
apiVersion: v1
kind: Service
metadata:
  name: elohim-doorway-prod
  namespace: elohim-prod
  labels:
    app: elohim-doorway
    environment: prod
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-prod
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  type: ClusterIP
  ports:
    # Doorway Gateway (for Ingress -> doorway)
    - name: gateway-ws
      port: 8080
      targetPort: 8080
      protocol: TCP
    # Doorway Operator Dashboard
    - name: operator-ui
      port: 8081
      targetPort: 80
      protocol: TCP
  selector:
    app: elohim-doorway
    environment: prod
---
# Public Ingress - routes all traffic through authenticated Doorway Gateway
# Supports: /admin, /app/*, /bootstrap/*, /api/v1/*, /operator/*
# Signal subdomain: signal.doorway.elohim.host (tx5/SBD protocol)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: elohim-doorway-prod
  namespace: elohim-prod
  labels:
    app: elohim-doorway
    environment: prod
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-prod
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
  annotations:
    # WebSocket support for /admin, /app/*, signal subdomain
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$binary_remote_addr"
    nginx.ingress.kubernetes.io/websocket-services: "elohim-doorway-prod"
    # Default 1 MB rejects HTML5-app ZIPs and bulk content/relationship POSTs.
    # 100m covers current 6.75 MB ZIP + 3424-item bulk content with headroom.
    # Companion: 16k proxy-buffer-size handles large response headers from
    # holochain admin/app responses (cell info, route registry dumps).
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    # Required for WebSocket upgrade headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: public
  tls:
    - hosts:
        - doorway.elohim.host
        - signal.doorway.elohim.host
      secretName: doorway-prod-tls
  rules:
    - host: doorway.elohim.host
      http:
        paths:
          # All traffic through doorway gateway
          # Doorway handles routing: /threshold/* -> doorway-app, /hc/* -> conductor
          - path: /
            pathType: Prefix
            backend:
              service:
                name: elohim-doorway-prod
                port:
                  number: 8080
    - host: signal.doorway.elohim.host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: elohim-doorway-prod
                port:
                  number: 8080
