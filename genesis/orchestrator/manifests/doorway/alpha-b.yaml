# Doorway Alpha-B Deployment — Federation Peer of doorway-alpha
#
# Second doorway in the elohim-alpha namespace, deployed alongside the primary
# doorway-alpha from the same dev-branch alpha pipeline. Exists to prove the
# doorway-federation surface end-to-end (FEDERATION_PEERS discovery, DHT
# self-registration, cross-doorway account registration, multi-doorway
# content delivery) end-to-end across two distinct genesis-peer backends.
#
# Topology (2026-05-27 realignment — adam-as-operator for doorway-B):
#   Browser → alpha.elohim.host  → elohim-doorway-alpha    → elohim-matthew-alpha
#                                  (on-prem placement)        (on-prem storage)
#   Browser → elohim.host        → elohim-doorway-alpha-b  → elohim-adam-alpha
#                                  (shem placement)           (shem storage)
#
# Adam + Matthew are the genesis pair (deployments.json humans[0..1]). Pairing
# each doorway with its co-located genesis peer means federation flows actually
# cross between two real backends with two real projection caches — not the
# previous "both doorways read matthew" pseudo-federation where the only
# difference was the MONGODB_DB. Cross-cluster gossip, two storage backends,
# two operator identities — the federation test surface that matters.
#
# Doorway-A's DOORWAY_ID is "alpha-elohim-host"; this one's is
# "apex-elohim-host". They federate via the FEDERATION_PEERS env var
# (each lists the other) and register themselves in the infrastructure
# zome as content publishers with overlapping but distinct capabilities.
#
# MongoDB:
#   doorway-A uses MONGODB_DB=doorway-alpha (existing projection state)
#   doorway-B uses MONGODB_DB=doorway-alpha-b (independent projection state) —
#   so projection cache divergence is observable, not hidden by shared state.
#
# Apex hostname (elohim.host) was previously bound to elohim-prod via the
# main-branch pipeline. The prod pipeline is paused; see manifests/doorway/
# prod.yaml and manifests/elohim-app/prod/ingress.yaml for the parking notes.
# Operator must `kubectl delete ingress` the elohim-prod claims before the
# first alpha-b deploy can succeed (cert-manager reissues elohim-host-tls-cert
# in elohim-alpha on first ingress reconcile).
#
# Ports:
#   - 8080: Doorway Gateway (public, authenticated)
#   - 80:   Operator Dashboard (nginx, pod-internal)
---
# Secret for Doorway-B Gateway API keys
apiVersion: v1
kind: Secret
metadata:
  name: elohim-doorway-alpha-b-secrets
  namespace: elohim-alpha
  labels:
    app: elohim-doorway-b
    environment: alpha
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-alpha-b
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
type: Opaque
stringData:
  # Federation peer of doorway-alpha — distinct keys so cross-doorway auth
  # exercises real JWT-validation rather than shared-secret fallthroughs.
  api-key-authenticated: "dev-elohim-auth-b-2024"
  api-key-admin: "dev-elohim-admin-b-2024"
  # The FLEET's seed authority — the deploy pipeline's credential for staging
  # bytes and declaring heads on the doorways it operates. Deliberately a
  # SEPARATE slot from api-key-admin: one App pipeline drives several doorways
  # whose own operator identities are deliberately distinct, and it authorizes
  # the seed + admin-cache routes ONLY (never the permission ladder), so it is
  # strictly narrower than the admin key it replaces on that path.
  #
  # Same value on every doorway of this fixture fleet — that IS the point, and
  # it is what makes the apex deployable with the ONE Jenkins credential that
  # already exists (`storage-api-key-admin` / `doorway-admin-bootstrap-key`).
  # It currently equals doorway-A's admin fixture, so no operator action is
  # needed; giving the pipeline a value of its own is a one-line change here
  # plus one new Jenkins credential.
  #
  # The doorway honours it only while its DECLARED stage is pre-coordination
  # (ELOHIM_NETWORK_STAKES, fail-closed to bootstrap). prod.yaml declares no
  # seed key at all, so this cannot become a production posture by accident.
  api-key-seed: "dev-elohim-admin-2024"
  jwt-secret: "dev-jwt-secret-b-change-in-production-2024"
  anthropic-api-key: "REPLACE_WITH_REAL_KEY"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elohim-doorway-alpha-b
  namespace: elohim-alpha
  labels:
    app: elohim-doorway-b
    environment: alpha
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-alpha-b
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elohim-doorway-b
      environment: alpha
  template:
    metadata:
      labels:
        app: elohim-doorway-b
        environment: alpha
        app.kubernetes.io/name: doorway
        app.kubernetes.io/instance: doorway-alpha-b
        app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: elohim
        app.kubernetes.io/managed-by: jenkins
    spec:
      # doorway-B is the apex doorway (elohim.host). Per the 2026-05-27
      # persona/doorway placement directive, doorway-B lives on shem
      # (node-type=remote) with NO fallback. If shem is unhealthy this pod
      # sits Pending — that's the intended fail-loud behavior so the apex
      # ingress's degradation is visible rather than masked by silent
      # rescheduling onto the on-prem cluster (which doorway-A already
      # serves via doorway-alpha.elohim.host).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - remote
      # Tolerate the WAN/remote-zone taint: shem is tainted
      # remote-wan=true:NoSchedule by the operator to keep cluster infra +
      # dev tooling off the ISP-latency node. doorway-B is shem-pinned by the
      # affinity above, so it must opt in to the remote zone or every rollout
      # sits Pending while the old pod keeps serving (observed 2026-06-10:
      # the storm-fix rollout stalled exactly this way). Pairs with the same
      # toleration on node-type=remote humans (adam, edgenode template).
      tolerations:
        - key: remote-wan
          operator: Exists
          effect: NoSchedule
      # shem's GFiber router hairpin-intercepts the apex hostnames
      # (elohim.host, signal.elohim.host — this doorway's own DOORWAY_URL /
      # SIGNAL_URL below) back to its own WAN IP instead of routing to shem's
      # own ingress — the router answers with its self-signed web UI cert
      # (ssl_verify_result=18) rather than proxying through. Route straight to
      # shem's own ingress+coturn node (10.99.0.2) instead of out through the
      # WAN and back. This file is alpha-only (no template sharing across
      # envs), so the alias is hardcoded rather than placeholder-driven — see
      # the consolidated-template/adam-firstman render path in
      # elohim/holochain/Jenkinsfile (deployHumanManifest) for the per-human
      # equivalent on the shem conductors. See
      # genesis/data/timeline/backlog/shem-conductors-signal-hairpin-suspect-dht-silent.md.
      hostAliases:
        - ip: "10.99.0.2"
          hostnames: ["elohim.host", "signal.elohim.host"]
      containers:
        # Doorway Gateway - Rust WebSocket gateway with auth, worker pool
        - name: doorway
          image: harbor.ethosengine.com/ethosengine/elohim-doorway:DOORWAY_TAG_PLACEHOLDER
          imagePullPolicy: Always
          # Capture last log lines into the termination message on crash — see
          # alpha.yaml for rationale (SIGKILL forensics when promtail misses it).
          terminationMessagePolicy: FallbackToLogsOnError
          args:
            - "--listen"
            - "0.0.0.0:8080"
            - "--conductor-url"
            # 2026-05-27 realignment: doorway-B (on shem) now reads its
            # co-located genesis peer adam, not matthew (on-prem). Matches
            # the placement directive's intent — two doorways, two genesis
            # peers, two clusters — and removes the cross-WireGuard hop on
            # every read.
            - "ws://elohim-adam-alpha:4445"
          ports:
            - name: gateway-ws
              containerPort: 8080
              protocol: TCP
          env:
            # DEV_MODE: A-to-B federation comms are in active dev scope
            # (operator decision 2026-06-27). Sibling: alpha.yaml.
            #
            # ITS SEED JUSTIFICATION IS DISCHARGED. This flag was set to open
            # the seed/admin gate "so the CI admin key lands the SPA blob
            # without a per-host credential", carrying its own TODO to remove it
            # "when doorway-B federation auth hardens". That bypass was closed
            # by the loopback conjunct (62b658784) — which left the apex with no
            # seed path at all and stranded elohim.host on a stale bundle from
            # app #1672. The per-host credential it stood in for now exists as
            # API_KEY_SEED above, and seed authority derives from the DECLARED
            # stage rather than from this flag (doorway routes/seed.rs).
            #
            # What DEV_MODE still does here is unrelated to seeding: it grants
            # every anonymous caller PermissionLevel::Authenticated in
            # auth/http_permission.rs. That is a separate, live posture question
            # tracked in security-doorway-devmode-auth-bypass.md — do not read
            # this flag as load-bearing for deploys any more.
            - name: DEV_MODE
              value: "true"
            # delegates-compute op-gate — SHADOW mode (observe).
            # Fires the pre-dispatch call to storage's authorize-operation on
            # POST /db/content(/bulk), LOGS the verdict, and ALWAYS forwards
            # (AllowWithWarn) — zero blast radius. This lights the REA
            # compute-commitment substrate (already merged, was defaulting off)
            # to gather real-traffic verdict telemetry before any enforce flip.
            # A storage error/404 here just logs a warn; the request still
            # forwards. CHE_FACING stays unset (enforce is gated behind it).
            - name: DELEGATES_COMPUTE_OP_GATE
              value: "observe"
            - name: RUST_LOG
              value: "info,doorway=debug"
            - name: PROJECTION_WRITER
              value: "true"
            - name: ORCHESTRATOR_ENABLED
              value: "true"
            # Full alpha conductor pool (matthew, jessica, james, adam, terrance, …)
            # injected from the Jenkins pipeline as a reach-fallback list.
            # Primary singular backend is adam (see CONDUCTOR_ADMIN_URL /
            # STORAGE_URL below) so doorway-B's projection cache + admin
            # writes hit the shem-side genesis peer first; the pool is only
            # consulted for reach when the primary can't satisfy a request.
            #
            # ALSO the ZomeCaller failover pool (2026-08-06). This is the SPOF
            # this doorway actually hit: adam under sqlite write-guard pressure
            # took GET /api/v1/federation/doorways down for 5.5h because the
            # ZomeCaller was pinned to adam alone. Agent-agnostic DHT reads now
            # fall back through this list (per-conductor credential
            # authorization; identity-binding writes stay pinned to adam).
            # Trimming this list silently removes federation read failover.
            - name: CONDUCTOR_URLS
              value: "CONDUCTOR_URLS_PLACEHOLDER"
            - name: CONDUCTOR_ADMIN_URL
              value: "ws://elohim-adam-alpha:4444"
            - name: STORAGE_URL
              value: "http://elohim-adam-alpha.elohim-alpha.svc.cluster.local:8090"
            - name: STORAGE_URLS
              value: "STORAGE_URLS_PLACEHOLDER"
            # Auto-register doorway-B's storage as a publisher in the
            # infrastructure zome (wildcard content_hash="*"; capabilities
            # [blob, html5_app]). Combined with doorway-A's identical
            # registration, the DHT will list two distinct doorway
            # publishers for the alpha cluster — surface area for the
            # multi-doorway-content-delivery validation.
            - name: ELOHIM_STORAGE_AUTO_REGISTER
              value: "true"
            # Root "/" is now served by whichever EPR commitment declares urlPath="/"
            # in the projection. ROOT_APP_SLUG is gone — the router consults live
            # projection data from storage (B14: drop ROOT_APP_SLUG).
            - name: ELOHIM_AGENT_URL
              value: "http://localhost:8095"
            - name: THRESHOLD_URL
              value: "http://localhost:80"
            - name: NATS_URL
              value: "nats://nats.elohim-alpha:4222"
            - name: MONGODB_URI
              value: "mongodb://mongodb.elohim-alpha:27017"
            # Distinct projection DB — divergence between doorway-A and
            # doorway-B caches is observable rather than hidden by shared
            # mongo. Federation reconciliation is the test surface.
            - name: MONGODB_DB
              value: "doorway-alpha-b"
            # Shared kitsune2 bootstrap table — IDENTICAL value to doorway-A so
            # the genesis pair (matthew/A, adam/B) discover each other in ONE
            # table instead of disjoint per-pod islands. Distinct from the
            # per-doorway MONGODB_DB projection cache above (the whole point:
            # bootstrap is shared even though projection state is divergent).
            - name: BOOTSTRAP_MONGODB_DB
              value: "elohim-bootstrap"
            # Identifier doorway-A sees when this peer registers itself in
            # the DHT + federation peer cache. Must differ from doorway-A's
            # "alpha-elohim-host".
            - name: DOORWAY_ID
              value: "apex-elohim-host"
            - name: DOORWAY_URL
              value: "https://elohim.host"
            - name: BOOTSTRAP_URL
              value: "https://elohim.host/bootstrap"
            - name: SIGNAL_URL
              value: "wss://signal.elohim.host"
            - name: INSTALLED_APP_ID
              value: "elohim"
            - name: HAPP_BUNDLE_PATH
              value: "/opt/holochain/elohim.happ"
            # SSR bundle baked into the doorway image at build time.
            # init_renderer silently None's on load failure so the pod
            # stays healthy and SSR routes fall through to the storage
            # proxy. Same behavior as doorway-A.
            - name: SSR_BUNDLE_PATH
              value: "/opt/elohim-render/main.server.mjs"
            - name: SSR_BUNDLE_SLUG
              value: "elohim-host-landing"
            # Multi-app SSR (RendererRegistry) — same contract as doorway-A:
            # per-slug server bundles from the substrate, first slug = default,
            # unseeded slugs skip-with-warn (app stays CSR until the blob ships).
            - name: SSR_BUNDLE_SLUGS
              value: "elohim-host-landing,lamad-spa"
            # Tokio worker threads — set EXPLICITLY, never CPU-derived. The pod has
            # limits.cpu: 1, so the default runtime spun up a SINGLE worker thread;
            # the 2026-06-13 freeze was one synchronously-blocked await on that lone
            # worker wedging the whole gateway (10 threads in futex_wait, /health
            # included). A futex-blocked worker costs no CPU, so 4 workers break the
            # single-blocked-await wedge even at cpu: 1 — this is the direct antidote
            # and does NOT require raising limits.cpu. (See the resources block: cpu
            # stays at 1000m; raise to 2000m only if SSR render latency under
            # concurrency demands it.) Default in-binary is 4 if unset.
            - name: DOORWAY_WORKER_THREADS
              value: "4"
            # Conductor-call hard deadline (ms). Bounds every zome/admin call so an
            # intermittent cluster NXDOMAIN or a never-settling record_heartbeat can
            # never park the caller forever (the freeze root contributor). Default
            # in-binary is 10000 if unset.
            - name: DOORWAY_ZOME_CALL_TIMEOUT_MS
              value: "10000"
            # Hosted-agent ceiling per conductor. Kitsune2 budgets gossip per SPACE,
            # not per agent: one outbound initiate round at a time, and a single local
            # agent still below its target storage arc holds the whole space in the slow
            # initiate path. Every cell's arc resets to Empty on conductor start, so
            # arc-convergence cost scales with the hosted-agent count while the
            # convergence budget does NOT. adam (this doorway's apex conductor) sat at
            # ~35 hosted agents and converged exactly ONE agent's arc in 14.5h — the
            # storage projection never reaches caught_up, and elohim.host serves 503
            # {"status":"catching-up"} behind it. 32 ≈ the current population: it stops
            # further growth WITHOUT evicting anyone (provision_agent short-circuits on
            # find_existing_app before the capacity check, so already-hosted humans keep
            # logging in; only NEW hosted-agent provisioning is refused, cleanly, with
            # 503 on the registration path). Doorway-A (alpha.yaml) and the household
            # edgenode template intentionally do NOT set this — they carry 1-2 agents
            # and the in-binary default of 50 is correct there.
            # See genesis/data/timeline/backlog/
            #   self-heal-adam-projection-catchup-exhaustion-full-arc.md
            - name: DOORWAY_MAX_AGENTS_PER_CONDUCTOR
              value: "32"
            # DOORWAY_HEALTH_PORT (dedicated probe listener) intentionally LEFT
            # UNSET: that listener shares the main tokio runtime, so a killer probe
            # pointed at it would stay green during a PARTIAL wedge — defeating
            # restart-on-hang. Probes below stay on 8080 (the real request path).
            # Federation: point at doorway-A on its user-facing surface
            # (alpha.elohim.host), symmetric with alpha.yaml's pointer at
            # elohim.host. doorway-alpha.elohim.host is still a valid alias
            # for the same backend service, but using the user-facing host
            # keeps the federation pair legible: alpha.elohim.host ↔
            # elohim.host. Discovery loop in
            # services::federation::spawn_peer_discovery_task will GET this
            # peer's /admin/capabilities, register both doorways in the DHT,
            # and run a heartbeat keeping the peer cache fresh.
            - name: FEDERATION_PEERS
              value: "https://alpha.elohim.host"
            - name: API_KEY_AUTHENTICATED
              valueFrom:
                secretKeyRef:
                  name: elohim-doorway-alpha-b-secrets
                  key: api-key-authenticated
            - name: API_KEY_ADMIN
              valueFrom:
                secretKeyRef:
                  name: elohim-doorway-alpha-b-secrets
                  key: api-key-admin
            # Fleet seed authority — see the api-key-seed comment on the
            # Secret above. Honoured only pre-coordination, seed/cache routes
            # only, never the permission ladder.
            - name: API_KEY_SEED
              valueFrom:
                secretKeyRef:
                  name: elohim-doorway-alpha-b-secrets
                  key: api-key-seed
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: elohim-doorway-alpha-b-secrets
                  key: jwt-secret
          resources:
            requests:
              # Same V8/Angular SSR working-set story as doorway-A —
              # see alpha.yaml for the build #953/#954 cache-miss notes.
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          # Generous-probe pattern (2026-05-27): timeoutSeconds: 15.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 15
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            # Widen liveness window so a brief /health stall under load doesn't
            # SIGKILL a healthy pod — see alpha.yaml for the full rationale.
            timeoutSeconds: 15
            failureThreshold: 5
          volumeMounts:
            - name: ssr-render-bundle
              mountPath: /opt/elohim-render
        - name: doorway-app
          image: harbor.ethosengine.com/ethosengine/doorway-app:DOORWAY_APP_TAG_PLACEHOLDER
          imagePullPolicy: Always
          terminationMessagePolicy: FallbackToLogsOnError
          ports:
            - name: operator-ui
              containerPort: 80
              protocol: TCP
          env:
            - name: DOORWAY_API_URL
              value: "http://localhost:8080"
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          # Generous-probe pattern (2026-05-27): timeoutSeconds: 15.
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
        - name: elohim-agent-sdk
          image: harbor.ethosengine.com/ethosengine/elohim-agent-sdk:AGENT_SDK_TAG_PLACEHOLDER
          imagePullPolicy: Always
          terminationMessagePolicy: FallbackToLogsOnError
          ports:
            - name: agent-sdk
              containerPort: 8095
              protocol: TCP
          env:
            - name: ELOHIM_AGENT_PORT
              value: "8095"
            - name: ELOHIM_BUDGET_LIMIT
              value: "10"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: elohim-doorway-alpha-b-secrets
                  key: anthropic-api-key
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          # Generous-probe pattern (2026-05-27): timeoutSeconds: 15.
          readinessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
      volumes:
        - name: ssr-render-bundle
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: elohim-doorway-alpha-b
  namespace: elohim-alpha
  labels:
    app: elohim-doorway-b
    environment: alpha
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-alpha-b
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  type: ClusterIP
  ports:
    - name: gateway-ws
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: operator-ui
      port: 8081
      targetPort: 80
      protocol: TCP
  selector:
    app: elohim-doorway-b
    environment: alpha
---
# Public Ingress on apex hostname elohim.host (re-bound from prod, see
# manifests/doorway/prod.yaml + manifests/elohim-app/prod/ingress.yaml
# for the parking notes). Signal subdomain hosts the tx5/SBD WebRTC
# relay.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: elohim-doorway-alpha-b
  namespace: elohim-alpha
  labels:
    app: elohim-doorway-b
    environment: alpha
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-alpha-b
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
  annotations:
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$binary_remote_addr"
    nginx.ingress.kubernetes.io/websocket-services: "elohim-doorway-alpha-b"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: public
  tls:
    - hosts:
        - elohim.host
        - signal.elohim.host
      secretName: elohim-host-apex-tls
  rules:
    - host: elohim.host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: elohim-doorway-alpha-b
                port:
                  number: 8080
    - host: signal.elohim.host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: elohim-doorway-alpha-b
                port:
                  number: 8080
---
# ─────────────────────────────────────────────────────────────────────────
# Iroh Relay (doorway-B leg) — relay.elohim.host
# ─────────────────────────────────────────────────────────────────────────
# Mirror of the iroh-relay-alpha section in alpha.yaml — read that file for
# the full rationale (relay = the doorway's signal-function successor for the
# iroh transport generation; version contract; Harbor build recipe; TLS/QAD/
# posture/replicas design choices; the 2026-08-05 "relay is a doorway
# concern" ruling). This leg mirrors the EXISTING signal topology on the
# shem/apex premise, same as doorway-B mirrors doorway-A: conductors homed to
# doorway-B (adam) use THIS relay as their home instance, peers dial through
# each other's home relay to cross premises, and this leg's availability
# tracks signal.elohim.host's contract the same way doorway-A's leg tracks
# signal.alpha.elohim.host's. Pulls the SAME Harbor image as alpha.yaml — no
# second build recipe, and (per alpha.yaml's "HARBOR MIRROR" header) that
# image is now CI-built+pushed by the edge pipeline, not operator-mirrored.
#
# DNS (operator action, beacon-healed): relay.elohim.host CNAME ->
# elohim.host (shem/apex anchor, proxied:false) — inherits the shem-leg
# beacon's drift-healing, same reasoning as every other elohim.host-anchored
# name post the 2026-07-28 apex re-home.
#
# NETWORKPOLICY (operator action, same gap as the alpha leg): the PodMonitor
# below reads DOWN until port 9090 is added to
# `allow-metrics-from-observability` in
# genesis/orchestrator/manifests/infra/alpha-metrics-networkpolicy.yaml.
#
# Design: genesis/docs/content/elohim-protocol/architecture/2026-08-05-wave2-relay-sovereignty-design.md
# Campaign: genesis/docs/superpowers/plans/2026-08-04-holochain-iroh-convergence-upgrade-campaign.md (Wave 2, Task E1)
apiVersion: v1
kind: ConfigMap
metadata:
  name: iroh-relay-config-alpha-b
  namespace: elohim-alpha
  labels:
    app: iroh-relay-alpha-b
    environment: alpha
    app.kubernetes.io/name: iroh-relay
    app.kubernetes.io/instance: iroh-relay-alpha-b
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
data:
  # iroh-relay 0.95.1 server config (TOML). Keys verified against
  # iroh-relay-0.95.1/src/main.rs `struct Config`.
  relay.toml: |
    # Relay the byte plane. This is the whole point of the deployment.
    enable_relay = true

    # Plain HTTP; nginx terminates TLS (see alpha.yaml's header). 3340 is
    # upstream's own dev-mode port — chosen over the :80 default so the
    # container needs no NET_BIND_SERVICE capability. With no [tls] section
    # this ONE listener serves /relay, /ping, /generate_204, / and /robots.txt.
    http_bind_addr = "[::]:3340"

    # OFF this phase — needs relay-held TLS + a raw UDP:7842 path.
    enable_quic_addr_discovery = false

    # Sized for a fleet of ~7, not upstream's 1M-client default (which would
    # reserve ~56 MB). 8192 entries costs ~450 KB.
    key_cache_capacity = 8192

    # Explicit rather than defaulted, so the posture is a RECORDED decision.
    access = "everyone"

    enable_metrics = true
    metrics_bind_addr = "[::]:9090"

    # [limits] DELIBERATELY UNSET. Per-client rx byte/burst caps are available
    # (limits.client.rx.bytes_per_second / max_burst_bytes) but a cap set below
    # gossip's real burst profile does not ERROR — it silently slows the DHT and
    # reads as a transport fault. Set it after a bytes/sec baseline exists on
    # the /metrics surface, not before.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iroh-relay-alpha-b
  namespace: elohim-alpha
  labels:
    app: iroh-relay-alpha-b
    environment: alpha
    app.kubernetes.io/name: iroh-relay
    app.kubernetes.io/instance: iroh-relay-alpha-b
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two relay pods alive at once means peers can
  # land on different instances and silently fail to reach each other (see
  # the replicas:1 rationale in alpha.yaml's header). A brief relay gap is
  # the safer failure.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: iroh-relay-alpha-b
      environment: alpha
  template:
    metadata:
      annotations:
        # Bump when relay.toml changes — the relay reads its config only at
        # startup, so a ConfigMap edit without a pod restart never lands.
        elohim.host/conf-revision: "2026-08-05-phase-a-no-qad"
      labels:
        app: iroh-relay-alpha-b
        environment: alpha
        app.kubernetes.io/name: iroh-relay
        app.kubernetes.io/instance: iroh-relay-alpha-b
        app.kubernetes.io/component: infra
        app.kubernetes.io/part-of: elohim
        app.kubernetes.io/managed-by: jenkins
    spec:
      # Same premise pin as doorway-B above: shem (node-type=remote), NO
      # fallback. If shem is unhealthy this pod sits Pending — fail-loud so
      # the apex relay's degradation is visible rather than silently
      # rescheduled onto the on-prem cluster (which the alpha leg already
      # serves via relay.alpha.elohim.host). Keeps the pod coherent with the
      # `relay.elohim.host -> elohim.host` CNAME, which points at shem's WAN.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - remote
      # Tolerate the WAN/remote-zone taint — same as doorway-B above; without
      # this the pod sits Pending forever since the affinity pins it onto the
      # tainted shem node.
      tolerations:
        - key: remote-wan
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: iroh-relay
          # Mirrored into Harbor from crates.io — see alpha.yaml's HARBOR
          # BUILD RECIPE. Same image, no second build.
          image: harbor.ethosengine.com/ethosengine/iroh-relay:0.95.1-dev-latest
          imagePullPolicy: Always
          args:
            - "--config-path"
            - "/etc/iroh-relay/relay.toml"
          env:
            # info is the right floor: the relay logs client connect/disconnect
            # at info, which is the census we read during the soak.
            - name: RUST_LOG
              value: "iroh_relay=info,info"
          ports:
            - name: relay-http
              containerPort: 3340
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Generous-probe pattern (2026-05-27): timeoutSeconds: 15.
          # /robots.txt is registered on the relay builder UNCONDITIONALLY
          # (iroh-relay-0.95.1/src/server.rs:383), unlike /generate_204 which
          # exists on this listener only while TLS is off. Probing robots.txt
          # keeps the probe correct if Phase B ever enables relay-side TLS.
          readinessProbe:
            httpGet:
              path: /robots.txt
              port: 3340
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /robots.txt
              port: 3340
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: relay-config
              mountPath: /etc/iroh-relay
              readOnly: true
      volumes:
        - name: relay-config
          configMap:
            name: iroh-relay-config-alpha-b
---
apiVersion: v1
kind: Service
metadata:
  name: iroh-relay-alpha-b
  namespace: elohim-alpha
  labels:
    app: iroh-relay-alpha-b
    environment: alpha
    app.kubernetes.io/name: iroh-relay
    app.kubernetes.io/instance: iroh-relay-alpha-b
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  type: ClusterIP
  ports:
    - name: relay-http
      port: 3340
      targetPort: relay-http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app: iroh-relay-alpha-b
    environment: alpha
---
# SEPARATE Ingress object — deliberately NOT merged into
# elohim-doorway-alpha-b's ingress above. The relay needs ssl-redirect:false
# (see the LOAD-BEARING comment below); merging would leak that flag onto the
# doorway hosts. Follows the doorway ingress pattern (ingress-nginx +
# cert-manager letsencrypt-production + the websocket annotation set), NOT
# the coturn hostNetwork pattern: this is an HTTPS/WSS plane, not a raw UDP
# one.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iroh-relay-alpha-b
  namespace: elohim-alpha
  labels:
    app: iroh-relay-alpha-b
    environment: alpha
    app.kubernetes.io/name: iroh-relay
    app.kubernetes.io/instance: iroh-relay-alpha-b
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
  annotations:
    # WebSocket support for /relay. The relay connection is long-lived BY
    # DESIGN — a short read timeout produces a reconnect storm that reads as
    # relay instability.
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "iroh-relay-alpha-b"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    # LOAD-BEARING. iroh's captive-portal probe is issued as
    # http://{host}/generate_204 (iroh net_report reportgen.rs). A 301 to https
    # is not a 204 — forcing redirect makes every conductor believe it is behind
    # a captive portal. Do NOT "tidy" this to true.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    # The relay wire caps a frame at 1 MiB (iroh-relay protos/relay.rs
    # MAX_FRAME_SIZE). This does not gate post-upgrade websocket frames, but
    # costs nothing as headroom on the upgrade request itself.
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    # NO upstream-hash-by: there is exactly one backend pod by design
    # (see replicas:1 in alpha.yaml's header) and a hash annotation would
    # imply otherwise.
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: public
  tls:
    - hosts:
        - relay.elohim.host
      secretName: iroh-relay-alpha-b-tls
  rules:
    - host: relay.elohim.host
      http:
        paths:
          # Whole host to the relay: /relay (wss), /ping (Https latency probe),
          # /generate_204 (captive-portal probe), /, /robots.txt all live on the
          # single relay listener while TLS is terminated upstream.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iroh-relay-alpha-b
                port:
                  number: 3340
---
# PodMonitor — scrape the relay's /metrics.
#
# ⚠ THIS TARGET READS **DOWN** until the operator adds port 9090 to
#   `allow-metrics-from-observability` in
#   genesis/orchestrator/manifests/infra/alpha-metrics-networkpolicy.yaml —
#   elohim-alpha runs `default-deny-cross-env`, which gives the observability
#   namespace no lane to app /metrics ports. Shipped WITH the known gap rather
#   than omitted, so the gap is visible and closeable instead of forgotten.
#   Same operator preconditions as alpha-doorway-podmonitor.yaml: the Prometheus
#   Operator's podMonitorSelector must admit `release: kube-prom-stack`, its
#   podMonitorNamespaceSelector must admit elohim-alpha.
#
# What it is for: the relay-side census. Connected-client count should equal
# the flipped conductor count for THIS premise — a short count names WHICH
# peer never found its home relay, which no conductor-side probe can tell you.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: iroh-relay-alpha-b
  namespace: elohim-alpha
  labels:
    app: iroh-relay-alpha-b
    environment: alpha
    release: kube-prom-stack
    app.kubernetes.io/name: iroh-relay
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  namespaceSelector:
    matchNames:
      - elohim-alpha
  selector:
    matchLabels:
      app: iroh-relay-alpha-b
  podMetricsEndpoints:
    - port: metrics # containerPort 9090
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: false
