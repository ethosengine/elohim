# Doorway Alpha-B Deployment — Federation Peer of doorway-alpha
#
# Second doorway in the elohim-alpha namespace, deployed alongside the primary
# doorway-alpha from the same dev-branch alpha pipeline. Exists to prove the
# doorway-federation surface end-to-end (FEDERATION_PEERS discovery, DHT
# self-registration, cross-doorway account registration, multi-doorway
# content delivery) without standing up a second conductor pool.
#
# Topology:
#   Browser → alpha.elohim.host  → elohim-doorway-alpha    ─┐
#   Browser → elohim.host        → elohim-doorway-alpha-b  ─┴→ shared alpha
#                                                              conductor pool
#                                                              (matthew/jessica/…)
#
# Doorway-A's DOORWAY_ID is "alpha-elohim-host"; this one's is
# "apex-elohim-host". They federate via the FEDERATION_PEERS env var
# (each lists the other) and register themselves in the infrastructure
# zome as content publishers with overlapping but distinct capabilities.
#
# MongoDB:
#   doorway-A uses MONGODB_DB=doorway-alpha (existing projection state)
#   doorway-B uses MONGODB_DB=doorway-alpha-b (independent projection state) —
#   so projection cache divergence is observable, not hidden by shared state.
#
# Apex hostname (elohim.host) was previously bound to elohim-prod via the
# main-branch pipeline. The prod pipeline is paused; see manifests/doorway/
# prod.yaml and manifests/elohim-app/prod/ingress.yaml for the parking notes.
# Operator must `kubectl delete ingress` the elohim-prod claims before the
# first alpha-b deploy can succeed (cert-manager reissues elohim-host-tls-cert
# in elohim-alpha on first ingress reconcile).
#
# Ports:
#   - 8080: Doorway Gateway (public, authenticated)
#   - 80:   Operator Dashboard (nginx, pod-internal)
---
# Secret for Doorway-B Gateway API keys
apiVersion: v1
kind: Secret
metadata:
  name: elohim-doorway-alpha-b-secrets
  namespace: elohim-alpha
  labels:
    app: elohim-doorway-b
    environment: alpha
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-alpha-b
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
type: Opaque
stringData:
  # Federation peer of doorway-alpha — distinct keys so cross-doorway auth
  # exercises real JWT-validation rather than shared-secret fallthroughs.
  api-key-authenticated: "dev-elohim-auth-b-2024"
  api-key-admin: "dev-elohim-admin-b-2024"
  jwt-secret: "dev-jwt-secret-b-change-in-production-2024"
  anthropic-api-key: "REPLACE_WITH_REAL_KEY"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elohim-doorway-alpha-b
  namespace: elohim-alpha
  labels:
    app: elohim-doorway-b
    environment: alpha
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-alpha-b
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elohim-doorway-b
      environment: alpha
  template:
    metadata:
      labels:
        app: elohim-doorway-b
        environment: alpha
        app.kubernetes.io/name: doorway
        app.kubernetes.io/instance: doorway-alpha-b
        app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: elohim
        app.kubernetes.io/managed-by: jenkins
    spec:
      # doorway-B is the apex doorway (elohim.host). Per the 2026-05-27
      # persona/doorway placement directive, doorway-B lives on shem
      # (node-type=remote) with NO fallback. If shem is unhealthy this pod
      # sits Pending — that's the intended fail-loud behavior so the apex
      # ingress's degradation is visible rather than masked by silent
      # rescheduling onto the on-prem cluster (which doorway-A already
      # serves via doorway-alpha.elohim.host).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - remote
      containers:
        # Doorway Gateway - Rust WebSocket gateway with auth, worker pool
        - name: doorway
          image: harbor.ethosengine.com/ethosengine/elohim-doorway:DOORWAY_TAG_PLACEHOLDER
          imagePullPolicy: Always
          args:
            - "--listen"
            - "0.0.0.0:8080"
            - "--conductor-url"
            - "ws://elohim-matthew-alpha:4445"
          ports:
            - name: gateway-ws
              containerPort: 8080
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info,doorway=debug"
            - name: PROJECTION_WRITER
              value: "true"
            # Shared alpha conductor pool — matthew (founder) + jessica (household)
            # are the same backends doorway-A uses, so federation proves the
            # multi-projection surface without doubling backend cost.
            - name: CONDUCTOR_URLS
              value: "CONDUCTOR_URLS_PLACEHOLDER"
            - name: CONDUCTOR_ADMIN_URL
              value: "ws://elohim-matthew-alpha:4444"
            - name: STORAGE_URL
              value: "http://elohim-matthew-alpha.elohim-alpha.svc.cluster.local:8090"
            - name: STORAGE_URLS
              value: "STORAGE_URLS_PLACEHOLDER"
            # Auto-register doorway-B's storage as a publisher in the
            # infrastructure zome (wildcard content_hash="*"; capabilities
            # [blob, html5_app]). Combined with doorway-A's identical
            # registration, the DHT will list two distinct doorway
            # publishers for the alpha cluster — surface area for the
            # multi-doorway-content-delivery validation.
            - name: ELOHIM_STORAGE_AUTO_REGISTER
              value: "true"
            # Root "/" is now served by whichever EPR commitment declares urlPath="/"
            # in the projection. ROOT_APP_SLUG is gone — the router consults live
            # projection data from storage (B14: drop ROOT_APP_SLUG).
            - name: ELOHIM_AGENT_URL
              value: "http://localhost:8095"
            - name: THRESHOLD_URL
              value: "http://localhost:80"
            - name: NATS_URL
              value: "nats://nats.elohim-alpha:4222"
            - name: MONGODB_URI
              value: "mongodb://mongodb.elohim-alpha:27017"
            # Distinct projection DB — divergence between doorway-A and
            # doorway-B caches is observable rather than hidden by shared
            # mongo. Federation reconciliation is the test surface.
            - name: MONGODB_DB
              value: "doorway-alpha-b"
            # Identifier doorway-A sees when this peer registers itself in
            # the DHT + federation peer cache. Must differ from doorway-A's
            # "alpha-elohim-host".
            - name: DOORWAY_ID
              value: "apex-elohim-host"
            - name: DOORWAY_URL
              value: "https://elohim.host"
            - name: BOOTSTRAP_URL
              value: "https://elohim.host/bootstrap"
            - name: SIGNAL_URL
              value: "wss://signal.elohim.host"
            - name: INSTALLED_APP_ID
              value: "elohim"
            - name: HAPP_BUNDLE_PATH
              value: "/opt/holochain/elohim.happ"
            # SSR bundle baked into the doorway image at build time.
            # init_renderer silently None's on load failure so the pod
            # stays healthy and SSR routes fall through to the storage
            # proxy. Same behavior as doorway-A.
            - name: SSR_BUNDLE_PATH
              value: "/opt/elohim-render/main.server.mjs"
            # Federation: point at doorway-A on its user-facing surface
            # (alpha.elohim.host), symmetric with alpha.yaml's pointer at
            # elohim.host. doorway-alpha.elohim.host is still a valid alias
            # for the same backend service, but using the user-facing host
            # keeps the federation pair legible: alpha.elohim.host ↔
            # elohim.host. Discovery loop in
            # services::federation::spawn_peer_discovery_task will GET this
            # peer's /admin/capabilities, register both doorways in the DHT,
            # and run a heartbeat keeping the peer cache fresh.
            - name: FEDERATION_PEERS
              value: "https://alpha.elohim.host"
            - name: API_KEY_AUTHENTICATED
              valueFrom:
                secretKeyRef:
                  name: elohim-doorway-alpha-b-secrets
                  key: api-key-authenticated
            - name: API_KEY_ADMIN
              valueFrom:
                secretKeyRef:
                  name: elohim-doorway-alpha-b-secrets
                  key: api-key-admin
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: elohim-doorway-alpha-b-secrets
                  key: jwt-secret
          resources:
            requests:
              # Same V8/Angular SSR working-set story as doorway-A —
              # see alpha.yaml for the build #953/#954 cache-miss notes.
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
        - name: doorway-app
          image: harbor.ethosengine.com/ethosengine/doorway-app:DOORWAY_APP_TAG_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: operator-ui
              containerPort: 80
              protocol: TCP
          env:
            - name: DOORWAY_API_URL
              value: "http://localhost:8080"
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
        - name: elohim-agent-sdk
          image: harbor.ethosengine.com/ethosengine/elohim-agent-sdk:AGENT_SDK_TAG_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: agent-sdk
              containerPort: 8095
              protocol: TCP
          env:
            - name: ELOHIM_AGENT_PORT
              value: "8095"
            - name: ELOHIM_BUDGET_LIMIT
              value: "10"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: elohim-doorway-alpha-b-secrets
                  key: anthropic-api-key
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: elohim-doorway-alpha-b
  namespace: elohim-alpha
  labels:
    app: elohim-doorway-b
    environment: alpha
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-alpha-b
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  type: ClusterIP
  ports:
    - name: gateway-ws
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: operator-ui
      port: 8081
      targetPort: 80
      protocol: TCP
  selector:
    app: elohim-doorway-b
    environment: alpha
---
# Public Ingress on apex hostname elohim.host (re-bound from prod, see
# manifests/doorway/prod.yaml + manifests/elohim-app/prod/ingress.yaml
# for the parking notes). Signal subdomain hosts the tx5/SBD WebRTC
# relay.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: elohim-doorway-alpha-b
  namespace: elohim-alpha
  labels:
    app: elohim-doorway-b
    environment: alpha
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-alpha-b
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
  annotations:
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$binary_remote_addr"
    nginx.ingress.kubernetes.io/websocket-services: "elohim-doorway-alpha-b"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: public
  tls:
    - hosts:
        - elohim.host
        - signal.elohim.host
      secretName: elohim-host-apex-tls
  rules:
    - host: elohim.host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: elohim-doorway-alpha-b
                port:
                  number: 8080
    - host: signal.elohim.host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: elohim-doorway-alpha-b
                port:
                  number: 8080
