# Doorway Staging Deployment — Agency On-Ramp
#
# Five roles in one process:
#   1. DNS/TLS gateway (stateless HTTP routing)
#   2. Bootstrap/Signal (agent discovery + WebRTC relay)
#   3. Projection cache (HTTP API for DHT content)
#   4. Identity host (custodial agent keys for hosted users)
#   5. Recovery registrar (relationship-based identity recovery)
#
# Never owns data — connects to P2P StatefulSet via ClusterIP service.
# Scaling is via the conductor pool behind doorway, not doorway replicas.
# See doorway/SCALING.md for the full model.
#
# Architecture:
#   Browser -> Ingress -> Doorway (auth + routing) -> edgenode service (conductor/storage)
#   Doorway-app (operator dashboard) served from same pod via localhost
#
# Ports:
#   - 8080: Doorway Gateway (public, authenticated)
#   - 80:   Operator Dashboard (nginx, pod-internal)
---
# Secret for Doorway Gateway API keys
apiVersion: v1
kind: Secret
metadata:
  name: elohim-doorway-staging-secrets
  namespace: elohim-staging
  labels:
    app: elohim-doorway
    environment: staging
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-staging
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
type: Opaque
stringData:
  # IMPORTANT: Change these in production!
  api-key-authenticated: "dev-elohim-auth-2024"
  api-key-admin: "dev-elohim-admin-2024"
  jwt-secret: "dev-jwt-secret-change-in-production-2024"
---
# The staging doorway's OWN Ed25519 node identity (story 5.1, commit a9910d11c).
# Full rationale on alpha.yaml's twin block. Staging-specific note: this pod's node
# affinity is `preferred`, not hard-pinned, so it is the FIRST consumer that decides
# which node the node-local volume lands on; from then on the openebs-hostpath PV's
# own nodeAffinity keeps the pod (and the rollout's surge pod) on that node — which is
# exactly what makes ReadWriteOnce safe here, and also means losing that node leaves
# this doorway Pending. That is the same exposure every staging edgenode PVC already
# carries (edgenode/staging.yaml), not a new class.
#
# The `staging-read` replica fleet deliberately gets NO node key: it runs replicas:2
# across soft affinity, so a node-local RWO claim could not be mounted by both pods,
# and PROJECTION_WRITER=false readers are not the federation identity holder. See
# staging-read.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elohim-doorway-staging-node-key
  namespace: elohim-staging
  labels:
    app: elohim-doorway
    environment: staging
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-staging
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      # One 32-byte file; must never change (hostpath PVCs cannot be expanded).
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elohim-doorway-staging
  namespace: elohim-staging
  labels:
    app: elohim-doorway
    environment: staging
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-staging
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  replicas: 1
  # EXPLICIT for the same reason as alpha.yaml's twin: the node-key PVC's safety rests
  # on maxUnavailable:0 (the serving pod is never terminated before the surge pod is
  # Ready), so a doorway that cannot mount or write its key file fails the rollout
  # without interrupting serving.
  # Covers the ROLLOUT path only — not eviction, node loss, or a pod that turns Ready
  # and fails later. Never `Recreate`.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: elohim-doorway
      environment: staging
  template:
    metadata:
      labels:
        app: elohim-doorway
        environment: staging
        app.kubernetes.io/name: doorway
        app.kubernetes.io/instance: doorway-staging
        app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: elohim
        app.kubernetes.io/managed-by: jenkins
    spec:
      # uid/gid 1000 (`USER doorway`) must be able to write the node-key volume on
      # first boot — see alpha.yaml's twin comment.
      securityContext:
        fsGroup: 1000
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - operations
            - weight: 70
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - edge
            - weight: 60
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - performance
      containers:
        # Doorway Gateway - Rust WebSocket gateway with auth, worker pool
        - name: doorway
          image: harbor.ethosengine.com/ethosengine/elohim-doorway:DOORWAY_TAG_PLACEHOLDER
          imagePullPolicy: Always
          args:
            - "--listen"
            - "0.0.0.0:8080"
            - "--conductor-url"
            - "ws://elohim-pete-staging:4445"
          ports:
            - name: gateway-ws
              containerPort: 8080
              protocol: TCP
          env:
            - name: DEV_MODE
              value: "true"
            - name: RUST_LOG
              value: "info,doorway=debug"
            - name: PROJECTION_WRITER
              value: "true"
            # Staging hosts Pete (pastor) + Terrance (tutor)
            - name: CONDUCTOR_URLS
              value: "CONDUCTOR_URLS_PLACEHOLDER"
            - name: CONDUCTOR_ADMIN_URL
              value: "ws://elohim-pete-staging-conductor:4444"
            - name: STORAGE_URL
              value: "http://elohim-pete-staging.elohim-staging.svc.cluster.local:8090"
            - name: STORAGE_URLS
              value: "STORAGE_URLS_PLACEHOLDER"
            - name: THRESHOLD_URL
              value: "http://localhost:80"
            - name: NATS_URL
              value: "nats://nats.elohim-staging:4222"
            - name: MONGODB_URI
              value: "mongodb://mongodb.elohim-staging:27017"
            - name: MONGODB_DB
              value: "doorway-staging"
            - name: DOORWAY_ID
              value: "staging-elohim-host"
            - name: DOORWAY_URL
              value: "https://doorway-staging.elohim.host"
            - name: BOOTSTRAP_URL
              value: "https://doorway-staging.elohim.host/bootstrap"
            - name: SIGNAL_URL
              value: "wss://signal.doorway-staging.elohim.host"
            - name: INSTALLED_APP_ID
              value: "elohim"
            - name: HAPP_BUNDLE_PATH
              value: "/opt/holochain/elohim.happ"
            - name: FEDERATION_PEERS
              value: "https://doorway-alpha.elohim.host,https://doorway.elohim.host"
            # This doorway's OWN persistent node identity — a FILE path inside its own
            # claim. Story 5.1 semantics and the household's shape: see alpha.yaml's
            # twin comment and app/elohim-app/scripts/hc-mesh.sh.
            - name: DOORWAY_NODE_KEY_FILE
              value: "/var/lib/doorway/node/doorway-node.key"
            - name: API_KEY_AUTHENTICATED
              valueFrom:
                secretKeyRef:
                  name: elohim-doorway-staging-secrets
                  key: api-key-authenticated
            - name: API_KEY_ADMIN
              valueFrom:
                secretKeyRef:
                  name: elohim-doorway-staging-secrets
                  key: api-key-admin
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: elohim-doorway-staging-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          # Generous-probe pattern (2026-05-27): timeoutSeconds: 15.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          volumeMounts:
            - name: node-key
              mountPath: /var/lib/doorway/node
        # Doorway Operator Dashboard - Angular app for node operators
        # Provides: federated OAuth, node metrics, configuration UI
        - name: doorway-app
          image: harbor.ethosengine.com/ethosengine/doorway-app:DOORWAY_APP_TAG_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: operator-ui
              containerPort: 80
              protocol: TCP
          env:
            - name: DOORWAY_API_URL
              value: "http://localhost:8080"
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          # Generous-probe pattern (2026-05-27): timeoutSeconds: 15.
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
      volumes:
        - name: node-key
          persistentVolumeClaim:
            claimName: elohim-doorway-staging-node-key
---
apiVersion: v1
kind: Service
metadata:
  name: elohim-doorway-staging
  namespace: elohim-staging
  labels:
    app: elohim-doorway
    environment: staging
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-staging
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  type: ClusterIP
  ports:
    # Doorway Gateway (for Ingress → doorway)
    - name: gateway-ws
      port: 8080
      targetPort: 8080
      protocol: TCP
    # Doorway Operator Dashboard
    - name: operator-ui
      port: 8081
      targetPort: 80
      protocol: TCP
  selector:
    app: elohim-doorway
    environment: staging
---
# Public Ingress - routes all traffic through authenticated Doorway Gateway
# Supports: /admin, /app/*, /bootstrap/*, /api/v1/*, /operator/*
# Signal subdomain: signal.doorway-staging.elohim.host (tx5/SBD protocol)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: elohim-doorway-staging
  namespace: elohim-staging
  labels:
    app: elohim-doorway
    environment: staging
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-staging
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
  annotations:
    # WebSocket support for /admin, /app/*, signal subdomain
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$binary_remote_addr"
    nginx.ingress.kubernetes.io/websocket-services: "elohim-doorway-staging"
    # Default 1 MB rejects HTML5-app ZIPs and bulk content/relationship POSTs.
    # 100m covers current 6.75 MB ZIP + 3424-item bulk content with headroom.
    # Companion: 16k proxy-buffer-size handles large response headers from
    # holochain admin/app responses (cell info, route registry dumps).
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    # Required for WebSocket upgrade headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: public
  tls:
    - hosts:
        - doorway-staging.elohim.host
        - signal.doorway-staging.elohim.host
      secretName: doorway-staging-tls
  rules:
    - host: doorway-staging.elohim.host
      http:
        paths:
          # Read-heavy paths → read replica service (PROJECTION_WRITER=false)
          - path: /api/v1/cache
            pathType: Prefix
            backend:
              service:
                name: elohim-doorway-read-staging
                port:
                  number: 8080
          - path: /store
            pathType: Prefix
            backend:
              service:
                name: elohim-doorway-read-staging
                port:
                  number: 8080
          - path: /api/blob
            pathType: Prefix
            backend:
              service:
                name: elohim-doorway-read-staging
                port:
                  number: 8080
          - path: /api/stream
            pathType: Prefix
            backend:
              service:
                name: elohim-doorway-read-staging
                port:
                  number: 8080
          # Everything else → writer service (identity host, admin, bootstrap, etc.)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: elohim-doorway-staging
                port:
                  number: 8080
    - host: signal.doorway-staging.elohim.host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: elohim-doorway-staging
                port:
                  number: 8080
