# Doorway Alpha Deployment — Agency On-Ramp
#
# Five roles in one process:
#   1. DNS/TLS gateway (stateless HTTP routing)
#   2. Bootstrap/Signal (agent discovery + WebRTC relay)
#   3. Projection cache (HTTP API for DHT content)
#   4. Identity host (custodial agent keys for hosted users)
#   5. Recovery registrar (relationship-based identity recovery)
#
# Never owns data — connects to P2P StatefulSet via ClusterIP service.
# Scaling is via the conductor pool behind doorway, not doorway replicas.
# See doorway/SCALING.md for the full model.
#
# Architecture:
#   Browser -> Ingress -> Doorway (auth + routing) -> edgenode service (conductor/storage)
#   Doorway-app (operator dashboard) served from same pod via localhost
#
# Ports:
#   - 8080: Doorway Gateway (public, authenticated)
#   - 80:   Operator Dashboard (nginx, pod-internal)
---
# Secret for Doorway Gateway API keys
apiVersion: v1
kind: Secret
metadata:
  name: elohim-doorway-alpha-secrets
  namespace: elohim-alpha
  labels:
    app: elohim-doorway
    environment: alpha
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-alpha
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
type: Opaque
stringData:
  # IMPORTANT: Change these in production!
  api-key-authenticated: "dev-elohim-auth-2024"
  api-key-admin: "dev-elohim-admin-2024"
  # The FLEET's seed authority — the deploy pipeline's credential for staging
  # bytes and declaring heads on the doorways it operates. Deliberately a
  # SEPARATE slot from api-key-admin: one App pipeline drives several doorways
  # whose own operator identities are deliberately distinct, and it authorizes
  # the seed + admin-cache routes ONLY (never the permission ladder), so it is
  # strictly narrower than the admin key it replaces on that path.
  #
  # Same value on every doorway of this fixture fleet — that IS the point, and
  # it is what makes the apex deployable with the ONE Jenkins credential that
  # already exists (`storage-api-key-admin` / `doorway-admin-bootstrap-key`).
  # It currently equals doorway-A's admin fixture, so no operator action is
  # needed; giving the pipeline a value of its own is a one-line change here
  # plus one new Jenkins credential.
  #
  # The doorway honours it only while its DECLARED stage is pre-coordination
  # (ELOHIM_NETWORK_STAKES, fail-closed to bootstrap). prod.yaml declares no
  # seed key at all, so this cannot become a production posture by accident.
  api-key-seed: "dev-elohim-admin-2024"
  jwt-secret: "dev-jwt-secret-change-in-production-2024"
  # Anthropic API key for elohim-agent-sdk sidecar (set via sealed-secret in production)
  anthropic-api-key: "REPLACE_WITH_REAL_KEY"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elohim-doorway-alpha
  namespace: elohim-alpha
  labels:
    app: elohim-doorway
    environment: alpha
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-alpha
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elohim-doorway
      environment: alpha
  template:
    metadata:
      labels:
        app: elohim-doorway
        environment: alpha
        app.kubernetes.io/name: doorway
        app.kubernetes.io/instance: doorway-alpha
        app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: elohim
        app.kubernetes.io/managed-by: jenkins
    spec:
      # doorway-A is the alpha doorway (doorway-alpha.elohim.host). Per the
      # 2026-07-16 update, doorway-A is HARD-PINNED to node-type=operations
      # (intel-nuc) — the WAN-facing runtime node that holds both the ingress
      # fronting it and the STUN/TURN (coturn) relay. doorway-A is stateless
      # cattle (no PVC), so it reaches the matthew/jessica/james conductors
      # purely via cluster service DNS regardless of where those pods run —
      # node co-location is NOT required, only network reachability. Required-
      # during-scheduling so it cannot drift onto shem (remote), a flaky edge
      # node, or performance; if operations is down the ingress is down too,
      # so the pin costs no extra availability. doorway-B carries the shem-
      # side mirror via elohim.host.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - operations
      containers:
        # Doorway Gateway - Rust WebSocket gateway with auth, worker pool
        - name: doorway
          image: harbor.ethosengine.com/ethosengine/elohim-doorway:DOORWAY_TAG_PLACEHOLDER
          imagePullPolicy: Always
          # On a SIGKILL/crash, copy the container's last stdout/stderr lines into
          # the termination message so the cause survives in containerStatus
          # (kubectl describe / KSM) even when promtail didn't capture them — the
          # gap that left build #1075's crash unconfirmed. FallbackToLogsOnError
          # only populates the message on non-zero exit, so it's free on clean exits.
          terminationMessagePolicy: FallbackToLogsOnError
          args:
            - "--listen"
            - "0.0.0.0:8080"
            - "--conductor-url"
            - "ws://elohim-matthew-alpha:4445"
          ports:
            - name: gateway-ws
              containerPort: 8080
              protocol: TCP
            # Dedicated liveness-watchdog port (own OS-thread runtime) — see
            # DOORWAY_HEALTH_PORT below and the livenessProbe.
            - name: health-wd
              containerPort: 8079
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info,doorway=debug"
            - name: PROJECTION_WRITER
              value: "true"
            - name: ORCHESTRATOR_ENABLED
              value: "true"
            # Alpha is the fixture/dev environment: enables the FIXTURE_ONLY
            # steward-grant surface (admin_users.rs fixture_only_gate) so the
            # @elohim-visually-validated portal-handoff scenarios can exercise
            # the real flow in local renders. NEVER set on staging/prod —
            # is_steward without key-proof invites deprovisioning there.
            # (Operator-approved scope exception, shift honest-held 2026-06-06.)
            - name: DEV_MODE
              value: "true"
            # Transport-manifest bulletin board (GET/POST /p2p/manifests) — the
            # ONLY peer-supply path for an iroh storage peer outside the namespace
            # (pod-to-pod is policy-isolated; measured 2026-08-30 from the Che
            # workspace: timeouts to 10.1.19.176:9876/8090). Default OFF fleet-wide
            # as a Sybil-flood trade-off (commit 8965987f8): entries are signature-
            # verified and the board is ephemeral + bounded, so a flood evicts real
            # peers from the board — it cannot forge them. ON for alpha only (the
            # fixture/dev doorway; apex stays off) so workspace/device peers can
            # join the storage plane; Sybil-resistance design tracked in backlog
            # 2026-08-24-manifest-board-sybil-resistance.md.
            - name: DOORWAY_MANIFEST_BOARD_ENABLED
              value: "true"
            # delegates-compute op-gate — SHADOW mode (observe).
            # Fires the pre-dispatch call to storage's authorize-operation on
            # POST /db/content(/bulk), LOGS the verdict, and ALWAYS forwards
            # (AllowWithWarn) — zero blast radius. This lights the REA
            # compute-commitment substrate (already merged, was defaulting off)
            # to gather real-traffic verdict telemetry before any enforce flip.
            # A storage error/404 here just logs a warn; the request still
            # forwards. CHE_FACING stays unset (enforce is gated behind it).
            - name: DELEGATES_COMPUTE_OP_GATE
              value: "observe"
            # Alpha hosts Matthew (founder) + Jessica (household)
            #
            # ALSO the ZomeCaller failover pool (2026-08-06). The doorway's
            # federation/DHT-read caller pins CONDUCTOR_ADMIN_URL below as its
            # primary, and uses this list as its ordered fallback when that peer
            # cannot answer — signing credentials are re-authorized per-conductor,
            # so each entry must be a real conductor with the `elohim` hApp.
            # Trimming this list silently removes federation read failover.
            - name: CONDUCTOR_URLS
              value: "CONDUCTOR_URLS_PLACEHOLDER"
            - name: CONDUCTOR_ADMIN_URL
              value: "ws://elohim-matthew-alpha-conductor:4444"
            - name: STORAGE_URL
              value: "http://elohim-matthew-alpha.elohim-alpha.svc.cluster.local:8090"
            - name: STORAGE_URLS
              value: "STORAGE_URLS_PLACEHOLDER"
            # Auto-register doorway's storage as a publisher of html5-app
            # content on boot. storage_registration.rs reads this env var
            # and calls register_content_server on the infrastructure zome
            # with wildcard content_hash="*" and capabilities
            # [blob, html5_app] — making the alpha doorway discoverable as
            # a publisher of the elohim-host-landing bundle. Value MUST be
            # the string "true" (matches `v == "true" || v == "1"`).
            - name: ELOHIM_STORAGE_AUTO_REGISTER
              value: "true"
            # Root "/" is now served by whichever EPR commitment declares urlPath="/"
            # in the projection. ROOT_APP_SLUG is gone — the router consults live
            # projection data from storage (B14: drop ROOT_APP_SLUG).
            # Elohim Agent SDK sidecar (runs in same pod)
            - name: ELOHIM_AGENT_URL
              value: "http://localhost:8095"
            - name: THRESHOLD_URL
              value: "http://localhost:80"
            - name: NATS_URL
              value: "nats://nats.elohim-alpha:4222"
            - name: MONGODB_URI
              value: "mongodb://mongodb.elohim-alpha:27017"
            - name: MONGODB_DB
              value: "doorway-alpha"
            # Shared kitsune2 bootstrap table — IDENTICAL on both doorways so
            # the genesis pair (matthew/A, adam/B) discover each other in ONE
            # table instead of disjoint per-pod islands. Independent of the
            # per-doorway MONGODB_DB projection cache above.
            - name: BOOTSTRAP_MONGODB_DB
              value: "elohim-bootstrap"
            - name: DOORWAY_ID
              value: "alpha-elohim-host"
            - name: DOORWAY_URL
              value: "https://doorway-alpha.elohim.host"
            - name: BOOTSTRAP_URL
              value: "https://doorway-alpha.elohim.host/bootstrap"
            - name: SIGNAL_URL
              value: "wss://signal.alpha.elohim.host"
            - name: INSTALLED_APP_ID
              value: "elohim"
            - name: HAPP_BUNDLE_PATH
              value: "/opt/holochain/elohim.happ"
            # Server-side rendering — points to the elohim-app server bundle
            # baked into the doorway image at build time (see the Dockerfile's
            # ssr-bundle stage). Set safely even if the bundle hasn't shipped
            # yet: doorway's `init_renderer` (server/http.rs:239) silently
            # returns None when the file fails to load, so the pod stays
            # healthy and SSR routes fall through to the storage proxy.
            #
            # Spec § Smallest first slice (line 396-422) — line 411 graduates
            # SSR to real content routes once the engine is wired.
            - name: SSR_BUNDLE_PATH
              value: "/opt/elohim-render/main.server.mjs"
            - name: SSR_BUNDLE_SLUG
              value: "elohim-host-landing"
            # Multi-app SSR (RendererRegistry): every slug listed here gets its
            # server bundle materialized from the substrate (the EPR node's
            # serverBlobHash) and its own renderer isolate; the FIRST is the
            # default app at SSR_BUNDLE_PATH. A slug whose serverBlobHash isn't
            # seeded yet is skipped with a warn — the app just stays CSR
            # (x-ssr-skipped: renderer-app-mismatch) until the blob ships.
            - name: SSR_BUNDLE_SLUGS
              value: "elohim-host-landing,lamad-spa"
            # Tokio worker threads — set EXPLICITLY, never CPU-derived. The pod has
            # limits.cpu: 1, so the default runtime spun up a SINGLE worker thread;
            # the 2026-06-13 freeze was one synchronously-blocked await on that lone
            # worker wedging the whole gateway (10 threads in futex_wait, /health
            # included). A futex-blocked worker costs no CPU, so 4 workers break the
            # single-blocked-await wedge even at cpu: 1 — this is the direct antidote
            # and does NOT require raising limits.cpu for the single-blocked-await
            # class. (UPDATE 2026-06-14: limits.cpu WAS raised 1→2 anyway — see the
            # resources block — for a DIFFERENT class: warm_stream projection bursts
            # starving the /health task off the runtime on a 1-core quota → liveness
            # SIGKILL. The 2nd core buys burst headroom; band-aid, not the pacing fix.)
            # Default in-binary is 4 if unset.
            - name: DOORWAY_WORKER_THREADS
              # 4→8 (2026-06-15 RCA): the cpu 1→2 + warm_stream pacing cure removed
              # the CFS-CPU-starvation class — post-cure metrics show ZERO CFS throttle
              # and CPU ~0.05 core — yet the matthew-side doorway still liveness-
              # SIGKILLs (exit 137 "Error", not OOM; 12 restarts vs adam-side 0 on the
              # SAME image c6243f34). The residual is a NON-CPU runtime stall:
              # concurrent blocked awaits (warm_stream Mongo replay at ~5× adam's
              # volume + the conductor-reconnect storm) park the workers so /health
              # misses the 150s probe window. A parked worker costs no CPU, so doubling
              # workers buys direct /health headroom at cpu:2 — same lever as the
              # 1→4 single-blocked-await fix, now for the N-concurrent-parked case.
              # BAND-AID; durable fix = watchdog-isolated liveness (see
              # project_doorway_wedge_unbounded_mongo_await).
              value: "8"
            # Conductor-call hard deadline (ms). Bounds every zome/admin call so an
            # intermittent cluster NXDOMAIN or a never-settling record_heartbeat can
            # never park the caller forever (the freeze root contributor). Default
            # in-binary is 10000 if unset.
            - name: DOORWAY_ZOME_CALL_TIMEOUT_MS
              value: "10000"
            # warm_stream inter-batch pace (ms), applied every 64 projected entries
            # (warm_stream.rs WARMUP_PACE_MS). 8ms default → 50ms (2026-06-15): caps
            # the cold-start corpus-replay duty cycle harder so warm_stream yields the
            # runtime more often, widening the scheduling gaps /health needs during
            # the burst. ~2.8s added over a ~3.6k-doc corpus, well inside the 75s warm
            # budget. Band-aid paired with DOORWAY_WORKER_THREADS=8; durable fix =
            # watchdog liveness. Targets the matthew side specifically (5× adam's replay).
            - name: WARMUP_PACE_MS
              value: "50"
            # DOORWAY_HEALTH_PORT — the dedicated liveness WATCHDOG (2026-06-15).
            # The doorway now serves this port from its OWN OS-thread tokio runtime
            # (server/http.rs spawn_health_listener), NOT a tokio::spawn on the main
            # runtime — so a full main-worker-pool stall (e.g. the blocking
            # getaddrinfo during a conductor DNS flap that was the crashloop root,
            # now also fixed in conductor::resolve_host_port) can no longer silence
            # the probe. The /health verdict here is HEARTBEAT-GATED: it returns 503
            # only when the MAIN runtime stops making progress (stale > 15s, override
            # DOORWAY_HEALTH_STALE_MS), so a genuine wedge still restarts the pod
            # (restart-on-hang preserved) while a transient park no longer false-
            # kills — curing the old shared-runtime footgun. ORDERING INVARIANT:
            # this only works with the image that contains the watchdog code; it
            # ships in the SAME branch/deploy so the pipeline builds+applies them
            # together — never set this against an older image. livenessProbe → 8079;
            # readiness/startup stay on 8080 (the real request path) on purpose.
            - name: DOORWAY_HEALTH_PORT
              value: "8079"
            # Federation peer: doorway-alpha-b in the same elohim-alpha namespace,
            # apex hostname (elohim.host). Both doorways back onto the shared alpha
            # conductor pool — this surfaces multi-projection federation without
            # standing up a second conductor pool. See alpha-b.yaml for the peer's
            # full config. Staging + prod were dropped from this list when prod
            # pipeline was paused; restore them only when those environments are
            # live again.
            - name: FEDERATION_PEERS
              value: "https://elohim.host"
            - name: API_KEY_AUTHENTICATED
              valueFrom:
                secretKeyRef:
                  name: elohim-doorway-alpha-secrets
                  key: api-key-authenticated
            - name: API_KEY_ADMIN
              valueFrom:
                secretKeyRef:
                  name: elohim-doorway-alpha-secrets
                  key: api-key-admin
            # Fleet seed authority — see the api-key-seed comment on the
            # Secret above. Honoured only pre-coordination, seed/cache routes
            # only, never the permission ladder.
            - name: API_KEY_SEED
              valueFrom:
                secretKeyRef:
                  name: elohim-doorway-alpha-secrets
                  key: api-key-seed
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: elohim-doorway-alpha-secrets
                  key: jwt-secret
          resources:
            requests:
              # SSR enabled: doorway loads a 51MB Angular server bundle into a
              # V8 isolate at startup. V8 parsing reserves ~200MB working set
              # during AST construction; steady-state holds ~150MB for the
              # parsed bundle + module loader cache. 256Mi was a coin-toss
              # OOM; build #953 squeaked through, #954 didn't.
              memory: "256Mi"
              # cpu request 100m→500m (2026-06-14): a guaranteed scheduled share, not
              # just burst. The projection warm_stream replays the Content/scenario
              # corpus in tight bursts (operator cluster-read: ~8.6k log lines/60s,
              # mostly projection::store; avg ~0.25 core but bursty); on cpu:1 those
              # bursts starved the /health task → liveness SIGKILL (137) → CrashLoop
              # (109 restarts/15h on aa6debe6). doorway-alpha-b at adam stayed 3/3.
              cpu: "500m"
            limits:
              memory: "1Gi"
              # cpu limit 1→2 (2026-06-14): a 2nd core of BURST headroom so a
              # warm_stream projection burst can't starve the latency-sensitive
              # /health task off the runtime. BAND-AID for burst-starvation, NOT the
              # fix — warm_stream has no backpressure/yield (the real "can't pace
              # itself" gap; durable fix = warm_stream pacing + /health isolation,
              # see .claude/data/doorway-freeze-incident-2026-06-13/WARM-STREAM-RESIDUAL-DIAGNOSIS.md).
              # Debug logging kept ON deliberately to keep studying the pacing failure.
              cpu: "2000m"
          # V8 + Angular bundle parse takes 10–60s on cold start (varies by
          # cluster CPU contention). Use a startupProbe with a long failure
          # tolerance so liveness/readiness can stay aggressive once the pod
          # is up. Without this, livenessProbe's 10s initial delay killed the
          # pod before doorway's HTTP server bound :8080.
          # Generous-probe pattern (2026-05-27): timeoutSeconds: 15 absorbs
          # /health latency spikes under CFS throttling so the kubelet
          # doesn't SIGKILL a pod that's healthy but momentarily slow.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 15
            failureThreshold: 24  # 24 × 5s = 120s total budget
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 5
          # Liveness now targets the dedicated WATCHDOG port (8079, own OS-thread
          # runtime, heartbeat-gated — see DOORWAY_HEALTH_PORT above). It answers
          # instantly even when the main worker pool is fully stalled, and returns
          # 503 ONLY when the MAIN runtime stops making progress (heartbeat stale
          # >15s). That removes the false-kill class the old 8080 probe had to widen
          # around (build #1075: a healthy-but-slow /health on the shared runtime).
          # The watchdog answer is sub-ms, so timeoutSeconds:5 is ample.
          #
          # 2026-06-15 flap RCA (genesis/docs/content/elohim-protocol/history/2026-06-15-matthew-edge-resiliency-rca-fanout-synthesis.md
          # experiment 8): the matthew doorway self-kills HERE during RECOVERABLE
          # main-runtime parks driven by the matthew conductor's app-ws session-close
          # storm + co-location memory pressure on ethosengine (the conductor sawtooths
          # to its 8 GiB OOM ceiling). Proof it is recoverable, not a genuine wedge:
          # ~14 restarts here while doorway-alpha-b (adam, on shem, SAME image) holds 0.
          # The 30s budget was too tight for a conductor stall, so the watchdog churned
          # the pod instead of riding it out. Widen 3→12 = 120s. The ROOT (conductor
          # OOM + DHT-read saturation) is upstream-blocked (fractional arc) / capacity-
          # gated (matthew RAM) — this is the proximate stabilizer, revert to 3 to undo.
          livenessProbe:
            httpGet:
              path: /health
              port: 8079
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12  # 12 × 10s = 120s (was 3 = 30s; see RCA note above)
          volumeMounts:
            - name: ssr-render-bundle
              mountPath: /opt/elohim-render
        # Doorway Operator Dashboard - Angular app for node operators
        # Provides: federated OAuth, node metrics, configuration UI
        - name: doorway-app
          image: harbor.ethosengine.com/ethosengine/doorway-app:DOORWAY_APP_TAG_PLACEHOLDER
          imagePullPolicy: Always
          terminationMessagePolicy: FallbackToLogsOnError
          ports:
            - name: operator-ui
              containerPort: 80
              protocol: TCP
          env:
            - name: DOORWAY_API_URL
              value: "http://localhost:8080"
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          # Generous-probe pattern (2026-05-27): timeoutSeconds: 15.
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
        # Elohim Agent SDK - TypeScript sidecar for Claude-powered constitutional reasoning
        # Calls Anthropic API with constitutional prompts, 10-call budget cap
        - name: elohim-agent-sdk
          image: harbor.ethosengine.com/ethosengine/elohim-agent-sdk:AGENT_SDK_TAG_PLACEHOLDER
          imagePullPolicy: Always
          terminationMessagePolicy: FallbackToLogsOnError
          ports:
            - name: agent-sdk
              containerPort: 8095
              protocol: TCP
          env:
            - name: ELOHIM_AGENT_PORT
              value: "8095"
            - name: ELOHIM_BUDGET_LIMIT
              value: "10"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: elohim-doorway-alpha-secrets
                  key: anthropic-api-key
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          # Generous-probe pattern (2026-05-27): timeoutSeconds: 15.
          readinessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
      volumes:
        - name: ssr-render-bundle
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: elohim-doorway-alpha
  namespace: elohim-alpha
  labels:
    app: elohim-doorway
    environment: alpha
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-alpha
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  type: ClusterIP
  ports:
    # Doorway Gateway (for Ingress → doorway)
    - name: gateway-ws
      port: 8080
      targetPort: 8080
      protocol: TCP
    # Doorway Operator Dashboard
    - name: operator-ui
      port: 8081
      targetPort: 80
      protocol: TCP
  selector:
    app: elohim-doorway
    environment: alpha
---
# Public Ingress - routes all traffic through authenticated Doorway Gateway
# Supports: /admin, /app/*, /bootstrap/*, /api/v1/*, /operator/*
# Signal subdomain: signal.alpha.elohim.host (tx5/SBD protocol; the legacy
# signal.doorway-alpha.elohim.host host is kept serving for transition compat)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: elohim-doorway-alpha
  namespace: elohim-alpha
  labels:
    app: elohim-doorway
    environment: alpha
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-alpha
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
  annotations:
    # WebSocket support for /admin, /app/*, signal subdomain
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$binary_remote_addr"
    nginx.ingress.kubernetes.io/websocket-services: "elohim-doorway-alpha"
    # Default 1 MB rejects HTML5-app ZIPs and bulk content/relationship POSTs.
    # 100m covers current 6.75 MB ZIP + 3424-item bulk content with headroom.
    # Companion: 16k proxy-buffer-size handles large response headers from
    # holochain admin/app responses (cell info, route registry dumps).
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    # Required for WebSocket upgrade headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    cert-manager.io/cluster-issuer: letsencrypt-production
# doorways.elohim.host — shared doorway-set name (added 2026-07-22).
# Multi-A: relay-addr-beacon's shared-record contribution mode maintains this
# name with one A record per owner (operations + shem), so it resolves to
# BOTH alpha WANs instead of the single-WAN front door every other hostname
# here has today (verified 2026-07-22 by live probe: doorway-alpha.elohim.host,
# elohim.host, doorway.elohim.host all resolve to 136.51.77.49/operations
# only; turn-shem.elohim.host is the sole shem-WAN-resolving name).
# (Superseded 2026-07-28: the apex is now the shem-leg beacon's owned record —
# elohim.host resolves to the SHEM WAN; matthew's names re-homed onto
# alpha.elohim.host. Sequencing + rationale: the coturn manifests' operator
# blocks and the feat(dns) commit message.)
# ACME HTTP-01 works unmodified for this multi-A name because both WANs
# terminate at the SAME shared ingress-nginx controller (shem is WireGuard-
# joined into the one cluster, and already answers 443 with the identical
# LE cert for elohim.host) — the usual multi-origin cert-issuance failure
# mode (challenge landing on a peer that doesn't hold the cert) does not
# apply on this single-cluster bench. It WOULD apply across genuinely
# separate clusters, which is why the durable answer is DNS-01 or
# pkarr-native naming, not more multi-A entries — see the exit-doctrine
# ledger and the 2026-07-22 addendum in the dual-WAN utility-plane spec.
# EXACTLY ONE ingress object may claim this host — same rule as the
# doorway.elohim.host apex collision hazard documented in prod.yaml's
# 2026-05-22 migration comment (two ingress objects racing for one
# hostname is an unresolved-owner failure mode, not a load-balance).
# k8s is the TEST BENCH here, not the architecture: this Ingress host entry
# is bench wiring for the address-set-contribution primitive, which later
# graduates to a pkarr-resolved doorway set / DoorwayRegistration
# multi-address (peer-native, deliberately not designed on this bench).
spec:
  ingressClassName: public
  tls:
    - hosts:
        - doorway-alpha.elohim.host
        - signal.alpha.elohim.host
        - signal.doorway-alpha.elohim.host
        - doorways.elohim.host
      secretName: doorway-alpha-tls
  rules:
    - host: doorway-alpha.elohim.host
      http:
        paths:
          # All traffic through doorway gateway
          # Doorway handles routing: /threshold/* -> doorway-app, /hc/* -> conductor
          - path: /
            pathType: Prefix
            backend:
              service:
                name: elohim-doorway-alpha
                port:
                  number: 8080
    - host: doorways.elohim.host
      http:
        paths:
          # Shared doorway-set name — same routing as doorway-alpha.elohim.host.
          # All traffic through doorway gateway
          # Doorway handles routing: /threshold/* -> doorway-app, /hc/* -> conductor
          - path: /
            pathType: Prefix
            backend:
              service:
                name: elohim-doorway-alpha
                port:
                  number: 8080
    - host: signal.alpha.elohim.host
      http:
        paths:
          # Role-named signal endpoint (2026-07-28) — matches SIGNAL_URL above
          # and the operations premises' alpha.elohim.host A record.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: elohim-doorway-alpha
                port:
                  number: 8080
    - host: signal.doorway-alpha.elohim.host
      http:
        paths:
          # Legacy signal host — transition compat while peers/config migrate
          # to signal.alpha.elohim.host; remove after the fleet stops using it.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: elohim-doorway-alpha
                port:
                  number: 8080
---
# ─────────────────────────────────────────────────────────────────────────
# Iroh Relay (doorway-A leg) — relay.alpha.elohim.host
# ─────────────────────────────────────────────────────────────────────────
# The relay is a DOORWAY concern, not standalone infra (2026-08-05 ruling,
# superseding the earlier infra/alpha-iroh-relay.yaml). Doorway already
# consolidates bootstrap + signal + gateway for the tx5/SBD transport
# generation; the iroh-relay IS that same signal function's successor for the
# iroh transport generation — SBD retires, relay refills the slot. It rides
# in the doorway manifest set and mirrors the EXISTING signal topology 1:1:
# each conductor homes to its primaryDoorway's relay (matthew/A here), peers
# dial through each other's HOME relay to cross premises, so relay-premise
# redundancy tracks the same availability contract signal.alpha.elohim.host
# already gives. This leg lives with doorway-A on the operations premise; the
# shem/apex mirror (iroh-relay-alpha-b / relay.elohim.host) is in alpha-b.yaml.
#
# Still its OWN pod, deliberately not folded into the doorway container: a
# doorway redeploy must never bounce every conductor's long-lived relay
# connection (see the replicas:1 correctness note below — session state lives
# in exactly one instance).
#
# Design: genesis/docs/content/elohim-protocol/architecture/2026-08-05-wave2-relay-sovereignty-design.md
# Campaign: genesis/docs/superpowers/plans/2026-08-04-holochain-iroh-convergence-upgrade-campaign.md (Wave 2, Task E1)
# Config-mapping evidence: genesis/docs/content/elohim-protocol/history/2026-08-04-holochain-iroh-dep-verification-pack.md (verdict 3)
#
# ⚠ INERT UNTIL APPLIED, same as every manifest here — but the apply-path gap
#   the standalone infra/alpha-iroh-relay.yaml carried (no confirmed pipeline
#   applied infra/*.yaml) is CLOSED by this move: elohim/holochain/Jenkinsfile's
#   deployDoorwayManifest already applies this file on every edge deploy.
#
# ─ VERSION CONTRACT (do not bump casually) ──────────────────────────────────
# Conductor 0.6.3 -> kitsune2 0.4.1 -> kitsune2_transport_iroh 0.4.1 ->
# iroh-holochain 0.95.1 -> iroh-relay-holochain 0.95.1 (the relay CLIENT).
# The server pinned below is STOCK iroh-relay 0.95.1 from crates.io. That is
# the right pairing on four independent lines of evidence:
#   1. iroh-relay-0.95.1/src/http.rs is BYTE-IDENTICAL to
#      iroh-relay-holochain-0.95.1/src/http.rs (same RELAY_PROTOCOL_VERSION
#      "iroh-relay-v1", same RELAY_PATH "/relay", same client-auth header).
#   2. holochain_p2p 0.6.3 and holochain 0.6.3 themselves dev-depend on stock
#      iroh-relay 0.95.1 with features ["server","test-utils"].
#   3. Upstream's own conductor rendezvous harness spawns that stock server
#      and points transport-iroh conductors at it
#      (crates/holochain/src/sweettest/sweet_conductor_config_rendezvous.rs).
#   4. iroh-relay 0.95.1 publishes a Cargo.lock whose crypto chain
#      (curve25519-dalek 5.0.0-pre.1 / ed25519-dalek 3.0.0-pre.1 /
#      digest 0.11.0-rc.3 / sha2 0.11.0-rc.2) is identical to the conductor's
#      resolution, which we have already compiled green.
# The iroh 0.92 storage dataplane can share a relay INSTANCE with this one
# (the relay wire is identical 0.92<->0.95.1 — frame tags, handshake structs,
# protocol string, QAD ALPN all unchanged); sharing the CONFIG KEY is not —
# the conductor's relay is `network.relay_url` in conductor-config, the
# dataplane's is a separate IrohConfig field. Two keys, one hostname per
# premise.
#
# ─ HARBOR MIRROR (CI-BUILT+PUSHED — operator action retired) ──────────────
#   The image is built + pushed by the edge pipeline (elohim/holochain/
#   Jenkinsfile, mirroring the relay-addr-beacon pattern): iroh-relay/Dockerfile
#   + scripts/ci/build-iroh-relay.sh build the SHORT-named local image,
#   scripts/ci/push-iroh-relay.sh tags + pushes
#   harbor.ethosengine.com/ethosengine/iroh-relay:0.95.1-<commit-hash> always,
#   and the :0.95.1-dev-latest alias (the tag pinned below) once the branch
#   reaches dev. Both steps are catchError-isolated (UNSTABLE, non-critical
#   delivery) — a relay-image build/push failure never blocks the edge deploy.
#   The recipe below is RETAINED for local/emergency rebuilds; do NOT pull a
#   third-party registry for the one component whose purpose is removing a
#   third-party dependency:
#   # Dockerfile (own build context, no path-deps, crates.io direct — NOT
#   # through Nexus, per relay-addr-beacon/Dockerfile's 2026-07-30 decision):
#   #   FROM rust:1-slim-bookworm AS builder
#   #   ENV RUSTFLAGS=""            # clear the Holochain WASM getrandom flag
#   #   RUN apt-get update && apt-get install -y --no-install-recommends \
#   #         pkg-config && rm -rf /var/lib/apt/lists/*
#   #   RUN cargo install iroh-relay --version 0.95.1 --locked \
#   #         --features server --root /out
#   #   FROM debian:bookworm-slim AS runtime
#   #   RUN apt-get update && apt-get install -y --no-install-recommends \
#   #         ca-certificates && rm -rf /var/lib/apt/lists/*
#   #   COPY --from=builder /out/bin/iroh-relay /usr/local/bin/iroh-relay
#   #   ENTRYPOINT ["/usr/local/bin/iroh-relay"]
#   # --locked IS LOAD-BEARING, not hygiene: iroh-base 0.95.1 exact-pins
#   # curve25519-dalek =5.0.0-pre.1, the pre-release whose published source
#   # carries the digest::crypto_common path bug that froze the storage
#   # dataplane on iroh 0.92. The bug is resolution-conditional; the
#   # published lock pins the working digest 0.11.0-rc.3. Unlocked is a coin
#   # flip.
#   #   nerdctl -n k8s.io build -t iroh-relay:0.95.1 -f <Dockerfile> <ctx>
#   #   nerdctl -n k8s.io tag  iroh-relay:0.95.1 \
#   #     harbor.ethosengine.com/ethosengine/iroh-relay:0.95.1-dev-latest
#   #   nerdctl -n k8s.io push \
#   #     harbor.ethosengine.com/ethosengine/iroh-relay:0.95.1-dev-latest
#   # (alpha-b.yaml's mirror relay pulls this SAME image — no second recipe.)
#
# ─ DNS (operator action, beacon-healed) ─────────────────────────────────────
#   relay.alpha.elohim.host CNAME -> alpha.elohim.host (operations anchor,
#   proxied:false). Inherits the operations-leg beacon's drift-healing for
#   free — no second record to keep synced — same reasoning as every other
#   alpha.elohim.host-anchored name.
#
# ─ POSTURE + DESIGN CHOICES CARRIED FROM THE ORIGINAL DESIGN (unchanged) ───
#   - TLS terminates at the Ingress, not the relay: with no [tls] section the
#     relay registers ALL its services (/relay, /ping, /generate_204, /,
#     /robots.txt) on ONE listener. The client's TLS-exporter fast-path auth
#     can't see through the terminating proxy, so it falls back to a
#     challenge/response handshake — one extra RTT per CONNECTION, not per
#     frame ("Verification not succeeding is part of normal operation",
#     iroh-relay-0.95.1/src/protos/handshake.rs serverside()).
#   - QUIC Address Discovery (QAD) is OFF this phase: no LoadBalancer/MetalLB
#     to carry a raw UDP:7842 path, and ingress-nginx cannot proxy QUIC.
#     Endpoints don't learn their observed public address from the relay, so
#     hole-punching has fewer candidates and more traffic stays relayed — a
#     SUPPORTED topology (upstream's own rendezvous harness runs
#     relay.tls=None AND quic=None). Meter: Loki `container=elohim-node,
#     "Connection established ... direct="`. Phase B = cert-manager TLS +
#     hostNetwork UDP:7842, a real second design pass, not a toggle.
#   - access="everyone" (deliberate, ratified): doorway's k2 bootstrap
#     implements neither /authenticate nor /relay/register, so
#     base64_auth_material_relay must stay UNSET — setting it against a base
#     that lacks those endpoints fails the endpoint, it does not degrade.
#     Exposure is bounded to availability/traffic-metadata: the relay cannot
#     read our payloads, join our DHT, or enumerate our peers.
#   - replicas: 1 is a CORRECTNESS choice, not a cost choice: relay clients
#     hold a long-lived connection and TWO PEERS MUST BE ON THE SAME relay
#     INSTANCE for it to forward between them; kitsune2 0.4.1 exposes
#     relay_url as a singular Option<String> (no list, no session affinity
#     the ingress could express). Named upstream follow-up:
#     genesis/data/timeline/backlog/sovereign-turn-relay-transport-commons.md.
#
# ─ NETWORKPOLICY (operator action) ──────────────────────────────────────────
#   elohim-alpha runs default-deny-cross-env; the PodMonitor below reads DOWN
#   until port 9090 is added to `allow-metrics-from-observability` in
#   genesis/orchestrator/manifests/infra/alpha-metrics-networkpolicy.yaml.
#   Shipped with the known gap rather than omitted, so it stays closeable.
apiVersion: v1
kind: ConfigMap
metadata:
  name: iroh-relay-config-alpha
  namespace: elohim-alpha
  labels:
    app: iroh-relay-alpha
    environment: alpha
    app.kubernetes.io/name: iroh-relay
    app.kubernetes.io/instance: iroh-relay-alpha
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
data:
  # iroh-relay 0.95.1 server config (TOML). Keys verified against
  # iroh-relay-0.95.1/src/main.rs `struct Config`.
  relay.toml: |
    # Relay the byte plane. This is the whole point of the deployment.
    enable_relay = true

    # Plain HTTP; nginx terminates TLS (see header). 3340 is upstream's own
    # dev-mode port — chosen over the :80 default so the container needs no
    # NET_BIND_SERVICE capability. With no [tls] section this ONE listener
    # serves /relay, /ping, /generate_204, / and /robots.txt.
    http_bind_addr = "[::]:3340"

    # OFF this phase — needs relay-held TLS + a raw UDP:7842 path. See header.
    enable_quic_addr_discovery = false

    # Sized for a fleet of ~7, not upstream's 1M-client default (which would
    # reserve ~56 MB). 8192 entries costs ~450 KB.
    key_cache_capacity = 8192

    # Explicit rather than defaulted, so the posture is a RECORDED decision.
    access = "everyone"

    enable_metrics = true
    metrics_bind_addr = "[::]:9090"

    # [limits] DELIBERATELY UNSET. Per-client rx byte/burst caps are available
    # (limits.client.rx.bytes_per_second / max_burst_bytes) but a cap set below
    # gossip's real burst profile does not ERROR — it silently slows the DHT and
    # reads as a transport fault. Set it after a bytes/sec baseline exists on
    # the /metrics surface, not before.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iroh-relay-alpha
  namespace: elohim-alpha
  labels:
    app: iroh-relay-alpha
    environment: alpha
    app.kubernetes.io/name: iroh-relay
    app.kubernetes.io/instance: iroh-relay-alpha
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two relay pods alive at once means peers can
  # land on different instances and silently fail to reach each other (see the
  # replicas:1 rationale in the header). A brief relay gap is the safer failure.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: iroh-relay-alpha
      environment: alpha
  template:
    metadata:
      annotations:
        # Bump when relay.toml changes — the relay reads its config only at
        # startup, so a ConfigMap edit without a pod restart never lands.
        elohim.host/conf-revision: "2026-08-05-phase-a-no-qad"
      labels:
        app: iroh-relay-alpha
        environment: alpha
        app.kubernetes.io/name: iroh-relay
        app.kubernetes.io/instance: iroh-relay-alpha
        app.kubernetes.io/component: infra
        app.kubernetes.io/part-of: elohim
        app.kubernetes.io/managed-by: jenkins
    spec:
      # Same premise pin as doorway-A above: HARD-PINNED to node-type=operations
      # (Intel-NUC, the always-on on-prem infra node where mongodb / nats /
      # doorway-A also hard-pin). Keeps the pod coherent with the
      # `relay.alpha.elohim.host -> alpha.elohim.host` CNAME, which points at
      # THIS premise's WAN, and keeps relay availability off the leg the scope
      # gate suspends (shem/remote).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - operations
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: iroh-relay
          # Mirrored into Harbor from crates.io — see the HARBOR BUILD RECIPE
          # in the header above.
          image: harbor.ethosengine.com/ethosengine/iroh-relay:0.95.1-dev-latest
          imagePullPolicy: Always
          args:
            - "--config-path"
            - "/etc/iroh-relay/relay.toml"
          env:
            # info is the right floor: the relay logs client connect/disconnect
            # at info, which is the census we read during the soak.
            - name: RUST_LOG
              value: "iroh_relay=info,info"
          ports:
            - name: relay-http
              containerPort: 3340
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Generous-probe pattern (2026-05-27): timeoutSeconds: 15.
          # /robots.txt is registered on the relay builder UNCONDITIONALLY
          # (iroh-relay-0.95.1/src/server.rs:383), unlike /generate_204 which
          # exists on this listener only while TLS is off. Probing robots.txt
          # keeps the probe correct if Phase B ever enables relay-side TLS.
          readinessProbe:
            httpGet:
              path: /robots.txt
              port: 3340
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /robots.txt
              port: 3340
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: relay-config
              mountPath: /etc/iroh-relay
              readOnly: true
      volumes:
        - name: relay-config
          configMap:
            name: iroh-relay-config-alpha
---
apiVersion: v1
kind: Service
metadata:
  name: iroh-relay-alpha
  namespace: elohim-alpha
  labels:
    app: iroh-relay-alpha
    environment: alpha
    app.kubernetes.io/name: iroh-relay
    app.kubernetes.io/instance: iroh-relay-alpha
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  type: ClusterIP
  ports:
    - name: relay-http
      port: 3340
      targetPort: relay-http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app: iroh-relay-alpha
    environment: alpha
---
# SEPARATE Ingress object — deliberately NOT merged into elohim-doorway-alpha's
# ingress above. The relay needs ssl-redirect:false (see the LOAD-BEARING
# comment below); merging would leak that flag onto the doorway hosts.
# Follows the doorway ingress pattern (ingress-nginx + cert-manager
# letsencrypt-production + the websocket annotation set), NOT the coturn
# hostNetwork pattern: this is an HTTPS/WSS plane, not a raw UDP one.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iroh-relay-alpha
  namespace: elohim-alpha
  labels:
    app: iroh-relay-alpha
    environment: alpha
    app.kubernetes.io/name: iroh-relay
    app.kubernetes.io/instance: iroh-relay-alpha
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
  annotations:
    # WebSocket support for /relay. The relay connection is long-lived BY
    # DESIGN — a short read timeout produces a reconnect storm that reads as
    # relay instability.
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "iroh-relay-alpha"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    # LOAD-BEARING. iroh's captive-portal probe is issued as
    # http://{host}/generate_204 (iroh net_report reportgen.rs). A 301 to https
    # is not a 204 — forcing redirect makes every conductor believe it is behind
    # a captive portal. Do NOT "tidy" this to true.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    # The relay wire caps a frame at 1 MiB (iroh-relay protos/relay.rs
    # MAX_FRAME_SIZE). This does not gate post-upgrade websocket frames, but
    # costs nothing as headroom on the upgrade request itself.
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    # NO upstream-hash-by: there is exactly one backend pod by design
    # (see replicas:1 in the header) and a hash annotation would imply otherwise.
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: public
  tls:
    - hosts:
        - relay.alpha.elohim.host
      secretName: iroh-relay-alpha-tls
  rules:
    - host: relay.alpha.elohim.host
      http:
        paths:
          # Whole host to the relay: /relay (wss), /ping (Https latency probe),
          # /generate_204 (captive-portal probe), /, /robots.txt all live on the
          # single relay listener while TLS is terminated upstream.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iroh-relay-alpha
                port:
                  number: 3340
---
# PodMonitor — scrape the relay's /metrics.
#
# ⚠ THIS TARGET READS **DOWN** until the operator adds port 9090 to
#   `allow-metrics-from-observability` in
#   genesis/orchestrator/manifests/infra/alpha-metrics-networkpolicy.yaml —
#   elohim-alpha runs `default-deny-cross-env`, which gives the observability
#   namespace no lane to app /metrics ports. Shipped WITH the known gap rather
#   than omitted, so the gap is visible and closeable instead of forgotten.
#   Same operator preconditions as alpha-doorway-podmonitor.yaml: the Prometheus
#   Operator's podMonitorSelector must admit `release: kube-prom-stack`, its
#   podMonitorNamespaceSelector must admit elohim-alpha.
#
# What it is for: the relay-side census. Connected-client count should equal
# the flipped conductor count for THIS premise — a short count names WHICH
# peer never found its home relay, which no conductor-side probe can tell you.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: iroh-relay-alpha
  namespace: elohim-alpha
  labels:
    app: iroh-relay-alpha
    environment: alpha
    release: kube-prom-stack
    app.kubernetes.io/name: iroh-relay
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  namespaceSelector:
    matchNames:
      - elohim-alpha
  selector:
    matchLabels:
      app: iroh-relay-alpha
  podMetricsEndpoints:
    - port: metrics # containerPort 9090
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: false
