# Doorway Alpha Deployment — Agency On-Ramp
#
# Five roles in one process:
#   1. DNS/TLS gateway (stateless HTTP routing)
#   2. Bootstrap/Signal (agent discovery + WebRTC relay)
#   3. Projection cache (HTTP API for DHT content)
#   4. Identity host (custodial agent keys for hosted users)
#   5. Recovery registrar (relationship-based identity recovery)
#
# Never owns data — connects to P2P StatefulSet via ClusterIP service.
# Scaling is via the conductor pool behind doorway, not doorway replicas.
# See doorway/SCALING.md for the full model.
#
# Architecture:
#   Browser -> Ingress -> Doorway (auth + routing) -> edgenode service (conductor/storage)
#   Doorway-app (operator dashboard) served from same pod via localhost
#
# Ports:
#   - 8080: Doorway Gateway (public, authenticated)
#   - 80:   Operator Dashboard (nginx, pod-internal)
---
# Secret for Doorway Gateway API keys
apiVersion: v1
kind: Secret
metadata:
  name: elohim-doorway-alpha-secrets
  namespace: elohim-alpha
  labels:
    app: elohim-doorway
    environment: alpha
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-alpha
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
type: Opaque
stringData:
  # IMPORTANT: Change these in production!
  api-key-authenticated: "dev-elohim-auth-2024"
  api-key-admin: "dev-elohim-admin-2024"
  jwt-secret: "dev-jwt-secret-change-in-production-2024"
  # Anthropic API key for elohim-agent-sdk sidecar (set via sealed-secret in production)
  anthropic-api-key: "REPLACE_WITH_REAL_KEY"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elohim-doorway-alpha
  namespace: elohim-alpha
  labels:
    app: elohim-doorway
    environment: alpha
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-alpha
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elohim-doorway
      environment: alpha
  template:
    metadata:
      labels:
        app: elohim-doorway
        environment: alpha
        app.kubernetes.io/name: doorway
        app.kubernetes.io/instance: doorway-alpha
        app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: elohim
        app.kubernetes.io/managed-by: jenkins
    spec:
      # doorway-A is the alpha doorway (doorway-alpha.elohim.host). Per the
      # 2026-05-27 persona/doorway placement directive, doorway-A stays on
      # the on-prem cluster (operations/edge/performance node-types) and
      # does NOT fall back to shem (remote). Required-during-scheduling so
      # the scheduler refuses to land it on a remote node — keeps the
      # Dowell-household ingress co-located with matthew/jessica/james
      # while doorway-B carries the shem-side mirror via elohim.host.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - operations
                      - edge
                      - performance
      containers:
        # Doorway Gateway - Rust WebSocket gateway with auth, worker pool
        - name: doorway
          image: harbor.ethosengine.com/ethosengine/elohim-doorway:DOORWAY_TAG_PLACEHOLDER
          imagePullPolicy: Always
          # On a SIGKILL/crash, copy the container's last stdout/stderr lines into
          # the termination message so the cause survives in containerStatus
          # (kubectl describe / KSM) even when promtail didn't capture them — the
          # gap that left build #1075's crash unconfirmed. FallbackToLogsOnError
          # only populates the message on non-zero exit, so it's free on clean exits.
          terminationMessagePolicy: FallbackToLogsOnError
          args:
            - "--listen"
            - "0.0.0.0:8080"
            - "--conductor-url"
            - "ws://elohim-matthew-alpha:4445"
          ports:
            - name: gateway-ws
              containerPort: 8080
              protocol: TCP
            # Dedicated liveness-watchdog port (own OS-thread runtime) — see
            # DOORWAY_HEALTH_PORT below and the livenessProbe.
            - name: health-wd
              containerPort: 8079
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info,doorway=debug"
            - name: PROJECTION_WRITER
              value: "true"
            - name: ORCHESTRATOR_ENABLED
              value: "true"
            # Alpha is the fixture/dev environment: enables the FIXTURE_ONLY
            # steward-grant surface (admin_users.rs fixture_only_gate) so the
            # @elohim-visually-validated portal-handoff scenarios can exercise
            # the real flow in local renders. NEVER set on staging/prod —
            # is_steward without key-proof invites deprovisioning there.
            # (Operator-approved scope exception, shift honest-held 2026-06-06.)
            - name: DEV_MODE
              value: "true"
            # Alpha hosts Matthew (founder) + Jessica (household)
            - name: CONDUCTOR_URLS
              value: "CONDUCTOR_URLS_PLACEHOLDER"
            - name: CONDUCTOR_ADMIN_URL
              value: "ws://elohim-matthew-alpha:4444"
            - name: STORAGE_URL
              value: "http://elohim-matthew-alpha.elohim-alpha.svc.cluster.local:8090"
            - name: STORAGE_URLS
              value: "STORAGE_URLS_PLACEHOLDER"
            # Auto-register doorway's storage as a publisher of html5-app
            # content on boot. storage_registration.rs reads this env var
            # and calls register_content_server on the infrastructure zome
            # with wildcard content_hash="*" and capabilities
            # [blob, html5_app] — making the alpha doorway discoverable as
            # a publisher of the elohim-host-landing bundle. Value MUST be
            # the string "true" (matches `v == "true" || v == "1"`).
            - name: ELOHIM_STORAGE_AUTO_REGISTER
              value: "true"
            # Root "/" is now served by whichever EPR commitment declares urlPath="/"
            # in the projection. ROOT_APP_SLUG is gone — the router consults live
            # projection data from storage (B14: drop ROOT_APP_SLUG).
            # Elohim Agent SDK sidecar (runs in same pod)
            - name: ELOHIM_AGENT_URL
              value: "http://localhost:8095"
            - name: THRESHOLD_URL
              value: "http://localhost:80"
            - name: NATS_URL
              value: "nats://nats.elohim-alpha:4222"
            - name: MONGODB_URI
              value: "mongodb://mongodb.elohim-alpha:27017"
            - name: MONGODB_DB
              value: "doorway-alpha"
            # Shared kitsune2 bootstrap table — IDENTICAL on both doorways so
            # the genesis pair (matthew/A, adam/B) discover each other in ONE
            # table instead of disjoint per-pod islands. Independent of the
            # per-doorway MONGODB_DB projection cache above.
            - name: BOOTSTRAP_MONGODB_DB
              value: "elohim-bootstrap"
            - name: DOORWAY_ID
              value: "alpha-elohim-host"
            - name: DOORWAY_URL
              value: "https://doorway-alpha.elohim.host"
            - name: BOOTSTRAP_URL
              value: "https://doorway-alpha.elohim.host/bootstrap"
            - name: SIGNAL_URL
              value: "wss://signal.doorway-alpha.elohim.host"
            - name: INSTALLED_APP_ID
              value: "elohim"
            - name: HAPP_BUNDLE_PATH
              value: "/opt/holochain/elohim.happ"
            # Server-side rendering — points to the elohim-app server bundle
            # baked into the doorway image at build time (see the Dockerfile's
            # ssr-bundle stage). Set safely even if the bundle hasn't shipped
            # yet: doorway's `init_renderer` (server/http.rs:239) silently
            # returns None when the file fails to load, so the pod stays
            # healthy and SSR routes fall through to the storage proxy.
            #
            # Spec § Smallest first slice (line 396-422) — line 411 graduates
            # SSR to real content routes once the engine is wired.
            - name: SSR_BUNDLE_PATH
              value: "/opt/elohim-render/main.server.mjs"
            - name: SSR_BUNDLE_SLUG
              value: "elohim-host-landing-ssr"
            # Tokio worker threads — set EXPLICITLY, never CPU-derived. The pod has
            # limits.cpu: 1, so the default runtime spun up a SINGLE worker thread;
            # the 2026-06-13 freeze was one synchronously-blocked await on that lone
            # worker wedging the whole gateway (10 threads in futex_wait, /health
            # included). A futex-blocked worker costs no CPU, so 4 workers break the
            # single-blocked-await wedge even at cpu: 1 — this is the direct antidote
            # and does NOT require raising limits.cpu for the single-blocked-await
            # class. (UPDATE 2026-06-14: limits.cpu WAS raised 1→2 anyway — see the
            # resources block — for a DIFFERENT class: warm_stream projection bursts
            # starving the /health task off the runtime on a 1-core quota → liveness
            # SIGKILL. The 2nd core buys burst headroom; band-aid, not the pacing fix.)
            # Default in-binary is 4 if unset.
            - name: DOORWAY_WORKER_THREADS
              # 4→8 (2026-06-15 RCA): the cpu 1→2 + warm_stream pacing cure removed
              # the CFS-CPU-starvation class — post-cure metrics show ZERO CFS throttle
              # and CPU ~0.05 core — yet the matthew-side doorway still liveness-
              # SIGKILLs (exit 137 "Error", not OOM; 12 restarts vs adam-side 0 on the
              # SAME image c6243f34). The residual is a NON-CPU runtime stall:
              # concurrent blocked awaits (warm_stream Mongo replay at ~5× adam's
              # volume + the conductor-reconnect storm) park the workers so /health
              # misses the 150s probe window. A parked worker costs no CPU, so doubling
              # workers buys direct /health headroom at cpu:2 — same lever as the
              # 1→4 single-blocked-await fix, now for the N-concurrent-parked case.
              # BAND-AID; durable fix = watchdog-isolated liveness (see
              # project_doorway_wedge_unbounded_mongo_await).
              value: "8"
            # Conductor-call hard deadline (ms). Bounds every zome/admin call so an
            # intermittent cluster NXDOMAIN or a never-settling record_heartbeat can
            # never park the caller forever (the freeze root contributor). Default
            # in-binary is 10000 if unset.
            - name: DOORWAY_ZOME_CALL_TIMEOUT_MS
              value: "10000"
            # warm_stream inter-batch pace (ms), applied every 64 projected entries
            # (warm_stream.rs WARMUP_PACE_MS). 8ms default → 50ms (2026-06-15): caps
            # the cold-start corpus-replay duty cycle harder so warm_stream yields the
            # runtime more often, widening the scheduling gaps /health needs during
            # the burst. ~2.8s added over a ~3.6k-doc corpus, well inside the 75s warm
            # budget. Band-aid paired with DOORWAY_WORKER_THREADS=8; durable fix =
            # watchdog liveness. Targets the matthew side specifically (5× adam's replay).
            - name: WARMUP_PACE_MS
              value: "50"
            # DOORWAY_HEALTH_PORT — the dedicated liveness WATCHDOG (2026-06-15).
            # The doorway now serves this port from its OWN OS-thread tokio runtime
            # (server/http.rs spawn_health_listener), NOT a tokio::spawn on the main
            # runtime — so a full main-worker-pool stall (e.g. the blocking
            # getaddrinfo during a conductor DNS flap that was the crashloop root,
            # now also fixed in conductor::resolve_host_port) can no longer silence
            # the probe. The /health verdict here is HEARTBEAT-GATED: it returns 503
            # only when the MAIN runtime stops making progress (stale > 15s, override
            # DOORWAY_HEALTH_STALE_MS), so a genuine wedge still restarts the pod
            # (restart-on-hang preserved) while a transient park no longer false-
            # kills — curing the old shared-runtime footgun. ORDERING INVARIANT:
            # this only works with the image that contains the watchdog code; it
            # ships in the SAME branch/deploy so the pipeline builds+applies them
            # together — never set this against an older image. livenessProbe → 8079;
            # readiness/startup stay on 8080 (the real request path) on purpose.
            - name: DOORWAY_HEALTH_PORT
              value: "8079"
            # Federation peer: doorway-alpha-b in the same elohim-alpha namespace,
            # apex hostname (elohim.host). Both doorways back onto the shared alpha
            # conductor pool — this surfaces multi-projection federation without
            # standing up a second conductor pool. See alpha-b.yaml for the peer's
            # full config. Staging + prod were dropped from this list when prod
            # pipeline was paused; restore them only when those environments are
            # live again.
            - name: FEDERATION_PEERS
              value: "https://elohim.host"
            - name: API_KEY_AUTHENTICATED
              valueFrom:
                secretKeyRef:
                  name: elohim-doorway-alpha-secrets
                  key: api-key-authenticated
            - name: API_KEY_ADMIN
              valueFrom:
                secretKeyRef:
                  name: elohim-doorway-alpha-secrets
                  key: api-key-admin
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: elohim-doorway-alpha-secrets
                  key: jwt-secret
          resources:
            requests:
              # SSR enabled: doorway loads a 51MB Angular server bundle into a
              # V8 isolate at startup. V8 parsing reserves ~200MB working set
              # during AST construction; steady-state holds ~150MB for the
              # parsed bundle + module loader cache. 256Mi was a coin-toss
              # OOM; build #953 squeaked through, #954 didn't.
              memory: "256Mi"
              # cpu request 100m→500m (2026-06-14): a guaranteed scheduled share, not
              # just burst. The projection warm_stream replays the Content/scenario
              # corpus in tight bursts (operator cluster-read: ~8.6k log lines/60s,
              # mostly projection::store; avg ~0.25 core but bursty); on cpu:1 those
              # bursts starved the /health task → liveness SIGKILL (137) → CrashLoop
              # (109 restarts/15h on aa6debe6). doorway-alpha-b at adam stayed 3/3.
              cpu: "500m"
            limits:
              memory: "1Gi"
              # cpu limit 1→2 (2026-06-14): a 2nd core of BURST headroom so a
              # warm_stream projection burst can't starve the latency-sensitive
              # /health task off the runtime. BAND-AID for burst-starvation, NOT the
              # fix — warm_stream has no backpressure/yield (the real "can't pace
              # itself" gap; durable fix = warm_stream pacing + /health isolation,
              # see .claude/data/doorway-freeze-incident-2026-06-13/WARM-STREAM-RESIDUAL-DIAGNOSIS.md).
              # Debug logging kept ON deliberately to keep studying the pacing failure.
              cpu: "2000m"
          # V8 + Angular bundle parse takes 10–60s on cold start (varies by
          # cluster CPU contention). Use a startupProbe with a long failure
          # tolerance so liveness/readiness can stay aggressive once the pod
          # is up. Without this, livenessProbe's 10s initial delay killed the
          # pod before doorway's HTTP server bound :8080.
          # Generous-probe pattern (2026-05-27): timeoutSeconds: 15 absorbs
          # /health latency spikes under CFS throttling so the kubelet
          # doesn't SIGKILL a pod that's healthy but momentarily slow.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 15
            failureThreshold: 24  # 24 × 5s = 120s total budget
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 5
          # Liveness now targets the dedicated WATCHDOG port (8079, own OS-thread
          # runtime, heartbeat-gated — see DOORWAY_HEALTH_PORT above). It answers
          # instantly even when the main worker pool is fully stalled, and returns
          # 503 ONLY when the MAIN runtime stops making progress (heartbeat stale
          # >15s). That removes the false-kill class the old 8080 probe had to widen
          # around (build #1075: a healthy-but-slow /health on the shared runtime).
          # The watchdog answer is sub-ms, so timeoutSeconds:5 is ample.
          #
          # 2026-06-15 flap RCA (.claude/data/matthew-edge-resiliency-rca-fanout-2026-06-15.md
          # experiment 8): the matthew doorway self-kills HERE during RECOVERABLE
          # main-runtime parks driven by the matthew conductor's app-ws session-close
          # storm + co-location memory pressure on ethosengine (the conductor sawtooths
          # to its 8 GiB OOM ceiling). Proof it is recoverable, not a genuine wedge:
          # ~14 restarts here while doorway-alpha-b (adam, on shem, SAME image) holds 0.
          # The 30s budget was too tight for a conductor stall, so the watchdog churned
          # the pod instead of riding it out. Widen 3→12 = 120s. The ROOT (conductor
          # OOM + DHT-read saturation) is upstream-blocked (fractional arc) / capacity-
          # gated (matthew RAM) — this is the proximate stabilizer, revert to 3 to undo.
          livenessProbe:
            httpGet:
              path: /health
              port: 8079
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12  # 12 × 10s = 120s (was 3 = 30s; see RCA note above)
          volumeMounts:
            - name: ssr-render-bundle
              mountPath: /opt/elohim-render
        # Doorway Operator Dashboard - Angular app for node operators
        # Provides: federated OAuth, node metrics, configuration UI
        - name: doorway-app
          image: harbor.ethosengine.com/ethosengine/doorway-app:DOORWAY_APP_TAG_PLACEHOLDER
          imagePullPolicy: Always
          terminationMessagePolicy: FallbackToLogsOnError
          ports:
            - name: operator-ui
              containerPort: 80
              protocol: TCP
          env:
            - name: DOORWAY_API_URL
              value: "http://localhost:8080"
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          # Generous-probe pattern (2026-05-27): timeoutSeconds: 15.
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
        # Elohim Agent SDK - TypeScript sidecar for Claude-powered constitutional reasoning
        # Calls Anthropic API with constitutional prompts, 10-call budget cap
        - name: elohim-agent-sdk
          image: harbor.ethosengine.com/ethosengine/elohim-agent-sdk:AGENT_SDK_TAG_PLACEHOLDER
          imagePullPolicy: Always
          terminationMessagePolicy: FallbackToLogsOnError
          ports:
            - name: agent-sdk
              containerPort: 8095
              protocol: TCP
          env:
            - name: ELOHIM_AGENT_PORT
              value: "8095"
            - name: ELOHIM_BUDGET_LIMIT
              value: "10"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: elohim-doorway-alpha-secrets
                  key: anthropic-api-key
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          # Generous-probe pattern (2026-05-27): timeoutSeconds: 15.
          readinessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
      volumes:
        - name: ssr-render-bundle
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: elohim-doorway-alpha
  namespace: elohim-alpha
  labels:
    app: elohim-doorway
    environment: alpha
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-alpha
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  type: ClusterIP
  ports:
    # Doorway Gateway (for Ingress → doorway)
    - name: gateway-ws
      port: 8080
      targetPort: 8080
      protocol: TCP
    # Doorway Operator Dashboard
    - name: operator-ui
      port: 8081
      targetPort: 80
      protocol: TCP
  selector:
    app: elohim-doorway
    environment: alpha
---
# Public Ingress - routes all traffic through authenticated Doorway Gateway
# Supports: /admin, /app/*, /bootstrap/*, /api/v1/*, /operator/*
# Signal subdomain: signal.doorway-alpha.elohim.host (tx5/SBD protocol)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: elohim-doorway-alpha
  namespace: elohim-alpha
  labels:
    app: elohim-doorway
    environment: alpha
    app.kubernetes.io/name: doorway
    app.kubernetes.io/instance: doorway-alpha
    app.kubernetes.io/version: "DEPLOY_VERSION_PLACEHOLDER"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
  annotations:
    # WebSocket support for /admin, /app/*, signal subdomain
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$binary_remote_addr"
    nginx.ingress.kubernetes.io/websocket-services: "elohim-doorway-alpha"
    # Default 1 MB rejects HTML5-app ZIPs and bulk content/relationship POSTs.
    # 100m covers current 6.75 MB ZIP + 3424-item bulk content with headroom.
    # Companion: 16k proxy-buffer-size handles large response headers from
    # holochain admin/app responses (cell info, route registry dumps).
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    # Required for WebSocket upgrade headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: public
  tls:
    - hosts:
        - doorway-alpha.elohim.host
        - signal.doorway-alpha.elohim.host
      secretName: doorway-alpha-tls
  rules:
    - host: doorway-alpha.elohim.host
      http:
        paths:
          # All traffic through doorway gateway
          # Doorway handles routing: /threshold/* -> doorway-app, /hc/* -> conductor
          - path: /
            pathType: Prefix
            backend:
              service:
                name: elohim-doorway-alpha
                port:
                  number: 8080
    - host: signal.doorway-alpha.elohim.host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: elohim-doorway-alpha
                port:
                  number: 8080
