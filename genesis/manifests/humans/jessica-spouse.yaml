# Jessica — Household Partner
# Stewards: family learning content, household governance
# Trust topology: bootstraps to Matthew (spouse) + Timothy (tutor)
# Resource profile: medium — household node with moderate resources
---
# ConfigMap for conductor configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: elohim-jessica-alpha-config
  namespace: elohim-alpha
  labels:
    app: elohim-jessica
    environment: alpha
    elohim-human: jessica-spouse
    app.kubernetes.io/name: jessica
    app.kubernetes.io/instance: jessica-alpha
    app.kubernetes.io/version: DEPLOY_VERSION_PLACEHOLDER
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
data:
  happ-version: "HAPP_TAG_PLACEHOLDER"
  conductor-config.yaml: |
    # Holochain Conductor Configuration for Elohim Protocol
    admin_interfaces:
      - driver:
          type: websocket
          port: 4444
          allowed_origins: "*"
    network:
      bootstrap_url: "https://doorway-alpha.elohim.host/bootstrap"
      signal_url: "wss://signal.doorway-alpha.elohim.host"
      enable_mdns: false
      enable_relaying: true
      webrtc_config:
        ice_servers:
          - urls: ["stun:stun.cloudflare.com:3478"]
          - urls: ["stun:stun.l.google.com:19302"]
    data_root_path: "/var/local/lib/holochain"
    keystore:
      type: lair_server_in_proc
      lair_root: "/var/local/lib/holochain/ks"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elohim-jessica-alpha
  namespace: elohim-alpha
  labels:
    app: elohim-jessica
    environment: alpha
    elohim-human: jessica-spouse
    app.kubernetes.io/name: jessica
    app.kubernetes.io/instance: jessica-alpha
    app.kubernetes.io/version: DEPLOY_VERSION_PLACEHOLDER
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  serviceName: elohim-jessica-alpha-headless
  replicas: 1
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: elohim-jessica
      environment: alpha
  template:
    metadata:
      labels:
        app: elohim-jessica
        environment: alpha
        elohim-human: jessica-spouse
        app.kubernetes.io/name: jessica
        app.kubernetes.io/instance: jessica-alpha
        app.kubernetes.io/version: DEPLOY_VERSION_PLACEHOLDER
        app.kubernetes.io/component: data
        app.kubernetes.io/part-of: elohim
        app.kubernetes.io/managed-by: jenkins
    spec:
      securityContext:
        fsGroup: 1000
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - operations
            - weight: 70
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - performance
      initContainers:
        - name: happ-fetcher
          image: ghcr.io/oras-project/oras:v1.1.0
          command: ['sh', '-c']
          args:
            - |
              set -e
              echo "Fetching hApp from Harbor registry..."
              echo "Version: ${HAPP_VERSION}"

              oras pull harbor.ethosengine.com/ethosengine/elohim-happ:${HAPP_VERSION} -o /happ

              if [ -f /happ/elohim.happ ]; then
                echo "hApp downloaded successfully from Harbor"
                ls -lh /happ/elohim.happ
              else
                echo "Failed to download hApp from Harbor"
                exit 1
              fi
          env:
            - name: HAPP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: elohim-jessica-alpha-config
                  key: happ-version
          volumeMounts:
            - name: happ-volume
              mountPath: /happ
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      containers:
        - name: edgenode
          image: harbor.ethosengine.com/ethosengine/elohim-edgenode:EDGENODE_TAG_PLACEHOLDER
          env:
            - name: CONDUCTOR_MODE
              value: "true"
          resources:
            requests:
              memory: "768Mi"
              cpu: "400m"
            limits:
              memory: "1536Mi"
              cpu: "2000m"
          volumeMounts:
            - name: holochain-data
              mountPath: /data
            - name: conductor-config
              mountPath: /usr/local/share/holochain/conductor-config.template.yaml
              subPath: conductor-config.yaml
            - name: happ-volume
              mountPath: /opt/holochain
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - "echo > /dev/tcp/127.0.0.1/4444"
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - "echo > /dev/tcp/127.0.0.1/4444"
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
        - name: ws-proxy
          image: alpine/socat:latest
          command: ['sh', '-c']
          args:
            - |
              socat TCP-LISTEN:8444,fork,reuseaddr TCP:127.0.0.1:4444 &
              socat TCP-LISTEN:8445,fork,reuseaddr TCP:127.0.0.1:4445 &
              wait
          ports:
            - name: admin-ws-int
              containerPort: 8444
              protocol: TCP
            - name: app-ws-int
              containerPort: 8445
              protocol: TCP
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          readinessProbe:
            tcpSocket:
              port: 8444
            initialDelaySeconds: 5
            periodSeconds: 5
        - name: elohim-storage
          image: harbor.ethosengine.com/ethosengine/elohim-storage:STORAGE_TAG_PLACEHOLDER
          imagePullPolicy: Always
          env:
            - name: RUST_LOG
              value: "info,elohim_storage=debug"
            - name: HOLOCHAIN_ADMIN_URL
              value: "ws://localhost:4444"
            - name: HOLOCHAIN_APP_URL
              value: "ws://localhost:4445"
            - name: HOLOCHAIN_APP_ID
              value: "elohim"
            - name: HUMAN_ID
              value: "human-jessica-spouse"
            - name: ENABLE_IMPORT_API
              value: "true"
            - name: ENABLE_CONTENT_DB
              value: "true"
            - name: IMPORT_CHUNK_SIZE
              value: "50"
            - name: IMPORT_CHUNK_DELAY_MS
              value: "300"
            - name: ENABLE_P2P
              value: "true"
            - name: P2P_PORT
              value: "9876"
            - name: DISABLE_MDNS
              value: "true"
            - name: P2P_BOOTSTRAP_NODES
              value: "/dns4/elohim-matthew-alpha-0.elohim-matthew-alpha-headless.elohim-alpha.svc.cluster.local/tcp/9876,/dns4/elohim-timothy-alpha-0.elohim-timothy-alpha-headless.elohim-alpha.svc.cluster.local/tcp/9876"
            - name: RELAY_MODE
              value: "server"
          ports:
            - name: storage-http
              containerPort: 8090
              protocol: TCP
            - name: p2p
              containerPort: 9876
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: storage-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 30
        - name: happ-installer
          image: harbor.ethosengine.com/ethosengine/elohim-happ-installer:HAPP_INSTALLER_TAG_PLACEHOLDER
          imagePullPolicy: Always
          env:
            - name: CONDUCTOR_URL
              value: "ws://localhost:4444"
            - name: APP_ID
              value: "elohim"
            - name: MAX_RETRIES
              value: "60"
            - name: RETRY_DELAY_MS
              value: "2000"
            - name: HAPP_PATH
              value: "/opt/holochain/elohim.happ"
          volumeMounts:
            - name: happ-volume
              mountPath: /opt/holochain
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: happ-volume
          emptyDir: {}
        - name: conductor-config
          configMap:
            name: elohim-jessica-alpha-config
  volumeClaimTemplates:
    - metadata:
        name: holochain-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: storage-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
# Headless service for StatefulSet DNS-based peer discovery
apiVersion: v1
kind: Service
metadata:
  name: elohim-jessica-alpha-headless
  namespace: elohim-alpha
  labels:
    app: elohim-jessica
    environment: alpha
    elohim-human: jessica-spouse
    app.kubernetes.io/name: jessica
    app.kubernetes.io/instance: jessica-alpha
    app.kubernetes.io/version: DEPLOY_VERSION_PLACEHOLDER
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  clusterIP: None
  selector:
    app: elohim-jessica
    environment: alpha
  ports:
    - name: admin-ws
      port: 4444
      targetPort: 8444
      protocol: TCP
    - name: app-ws
      port: 4445
      targetPort: 8445
      protocol: TCP
    - name: p2p
      port: 9876
      targetPort: 9876
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: elohim-jessica-alpha
  namespace: elohim-alpha
  labels:
    app: elohim-jessica
    environment: alpha
    elohim-human: jessica-spouse
    app.kubernetes.io/name: jessica
    app.kubernetes.io/instance: jessica-alpha
    app.kubernetes.io/version: DEPLOY_VERSION_PLACEHOLDER
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: elohim
    app.kubernetes.io/managed-by: jenkins
spec:
  type: ClusterIP
  ports:
    - name: admin-ws
      port: 4444
      targetPort: 8444
      protocol: TCP
    - name: app-ws
      port: 4445
      targetPort: 8445
      protocol: TCP
    - name: storage-db
      port: 8090
      targetPort: 8090
      protocol: TCP
    - name: p2p
      port: 9876
      targetPort: 9876
      protocol: TCP
  selector:
    app: elohim-jessica
    environment: alpha
