# Persistent Nix Store for Holochain builds
#
# This PVC stores the /nix directory across builds to avoid re-downloading
# the Holochain toolchain from Cachix on every build.
#
# Storage class: openebs-jiva-csi-default (replicated, network-attached)
#   - Replicated across nodes for availability
#   - Accessible from any node (important: builds run on operations node)
#   - Data stored on storage node (hp-micro10, 4TB)
#   - Slightly higher latency than hostpath, but flexible scheduling
#
# Size: 50Gi
#   - Holochain toolchain: ~15-20GB
#   - Rust target cache: ~5-10GB
#   - Buffer for multiple versions: ~15-20GB
#
# Build node: operations (Intel NUC i5, 8 cores, 16GB RAM)
# Storage node: storage (hp-micro10, 4TB disk)
#
# To apply: kubectl apply -f holochain/manifests/nix-cache-pvc.yaml
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nix-cache-holochain
  namespace: jenkins
  labels:
    app: holochain-build
    purpose: nix-store-cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-jiva-csi-default
  resources:
    requests:
      storage: 50Gi
---
# Cargo cache for Rust builds (smaller, faster churn)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cargo-cache-holochain
  namespace: jenkins
  labels:
    app: holochain-build
    purpose: cargo-cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-jiva-csi-default
  resources:
    requests:
      storage: 20Gi
---
# Sweettest target/ persistence for DNA Integration tests
#
# Without this PVC, every elohim-holochain build recompiles the sweettest
# crate from scratch — observed as 47m 48s of "Compiling …" output in
# elohim-holochain/dev/1210. The sweettest target tree (compiled native
# rust artifacts, not wasm32) lives outside cargo-cache because cargo-cache
# only persists the registry index + downloaded source tarballs.
#
# Setting CARGO_TARGET_DIR=/cargo-target in the Jenkinsfile environment
# block routes both DNA WASM builds AND the native sweettest build into
# this volume; cargo manages the per-target subdirectory layout.
#
# Storage class: openebs-jiva-csi-default (same pattern as nix-cache + cargo-cache)
#   - Backing data on hp-micro10 storage node
#   - Network-mounted into builder pods on operations / edge nodes
#
# Size: 20Gi
#   - Sweettest target/release: ~2-4GB
#   - Multiple Cargo.lock states across active branches: ~10-15GB buffer
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sweettest-target-cache-holochain
  namespace: jenkins
  labels:
    app: holochain-build
    purpose: sweettest-target-cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-jiva-csi-default
  resources:
    requests:
      storage: 20Gi
