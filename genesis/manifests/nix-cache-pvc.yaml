# CI build caches for the Holochain pipelines (nix store, cargo, sweettest target)
#
# Storage class: openebs-jiva-csi-default
#   - Cluster-wide RWO via Jiva CSI. Replication-eligible nodes are bounded by
#     the JivaVolumePolicy (`node-type != remote`) so Jiva will never try to
#     place a replica on shem (the WireGuard remote node). That excludes the
#     class of split-brain we were worried about while still letting build
#     pods schedule on any non-shem node.
#   - Cross-pipeline parallelism is handled at the cache-shape layer:
#     cargo-cache-edge and cargo-cache-holochain are independent PVCs, so the
#     elohim-edge and DNA pipelines don't fight over the same RWO volume
#     (see header on each PVC below).
#
# Why not openebs-hostpath:
#   We tried hostpath here on 2026-05-26 to dodge a Jiva orphan-unmount-loop
#   class of failure, then pinned each pipeline to a fixed host on 2026-05-27
#   so the WaitForFirstConsumer + multi-node nodeAffinity wouldn't pick a
#   contended node (elohim-edge #1010 thrashed 6 pod attempts / ~1h on
#   "volume node affinity conflict" before it cleared). With JivaVolumePolicy
#   now bounding replicas off shem the Jiva path is acceptable again, and
#   cluster-wide RWO removes the static host pin — Jenkinsfiles drop the
#   `kubernetes.io/hostname In [intel-nuc | thinkc-p1s]` blocks in the same
#   change as this revert.
#
# sccache is orthogonal:
#   sccache caches *compiled artifacts* via the Garage/MinIO S3 backend
#   (sccache-credentials Secret + RUSTC_WRAPPER set in flake.nix shellHook).
#   It does not consume these PVCs. These PVCs hold cargo's registry index +
#   downloaded source tarballs (and the sweettest target/ tree).
#
# OPERATOR CUTOVER (one-time, destructive):
#   spec.storageClassName is immutable on existing PVCs. To migrate:
#     1. All warm caches are lost — first build per pipeline rebuilds the
#        registry + sweettest target from scratch.
#     2. Drain in-flight Jenkins builds that hold these PVCs.
#     3. kubectl -n jenkins delete pvc nix-cache-holochain cargo-cache-holochain cargo-cache-edge sweettest-target-cache-holochain
#     4. kubectl apply -f genesis/manifests/nix-cache-pvc.yaml
#     5. Trigger one build per affected pipeline (elohim-edge, elohim-holochain,
#        steward) to seed the new Jiva caches.
#
# Sizes (unchanged):
#   - nix-cache-holochain:              50Gi
#   - cargo-cache-holochain:            20Gi
#   - cargo-cache-edge:                 20Gi
#   - sweettest-target-cache-holochain: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nix-cache-holochain
  namespace: jenkins
  labels:
    app: holochain-build
    purpose: nix-store-cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-jiva-csi-default
  resources:
    requests:
      storage: 50Gi
---
# Cargo cache for Rust builds (smaller, faster churn)
#
# Consumed by:
#   - elohim-holochain (DNA WASM build, elohim/holochain/dna/Jenkinsfile)
#   - elohim-steward  (Tauri device build, steward/device/Jenkinsfile)
# These two pipelines are sequential per the orchestrator dependsOn chain
# (steward dependsOn elohim-holochain), so they coexist on this single PVC.
#
# elohim-edge uses cargo-cache-edge (separate PVC) so edge + DNA can run in
# parallel without RWO contention. Split landed 2026-05-26.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cargo-cache-holochain
  namespace: jenkins
  labels:
    app: holochain-build
    purpose: cargo-cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-jiva-csi-default
  resources:
    requests:
      storage: 20Gi
---
# Cargo cache for the elohim-edge pipeline (elohim/holochain/Jenkinsfile)
#
# Split from cargo-cache-holochain on 2026-05-26 so the edge and DNA
# pipelines can run in parallel without sharing one RWO PVC. Pre-split,
# parallel edge + DNA builds surfaced as FailedMount on whichever pipeline
# tried to attach second.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cargo-cache-edge
  namespace: jenkins
  labels:
    app: holochain-build
    purpose: cargo-cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-jiva-csi-default
  resources:
    requests:
      storage: 20Gi
---
# Sweettest target/ persistence for DNA integration tests
#
# Without this PVC, every elohim-holochain build recompiles the sweettest
# crate from scratch — observed as 47m 48s of "Compiling …" output in
# elohim-holochain/dev/1210. The sweettest target tree (compiled native
# rust artifacts, not wasm32) lives outside cargo-cache because cargo-cache
# only persists the registry index + downloaded source tarballs.
#
# Setting CARGO_TARGET_DIR=/cargo-target in the Jenkinsfile environment
# block routes both DNA WASM builds AND the native sweettest build into
# this volume; cargo manages the per-target subdirectory layout.
#
# Size: 20Gi
#   - Sweettest target/release: ~2-4GB
#   - Multiple Cargo.lock states across active branches: ~10-15GB buffer
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sweettest-target-cache-holochain
  namespace: jenkins
  labels:
    app: holochain-build
    purpose: sweettest-target-cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-jiva-csi-default
  resources:
    requests:
      storage: 20Gi
