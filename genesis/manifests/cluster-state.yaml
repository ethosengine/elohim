# Declared cluster / environment state — the "reality" input to the verification SCOPE gate.
#
# This is NOT auto-derived (no kubectl from the dev env — feedback_no_kubectl_from_dev_env). The operator
# or an agent UPDATES it; the update cascades SCOPE (which tests/stories/gates are runnable right now),
# NOT a regression signal. Partial availability is the STEADY STATE, not a failure (project_seed_whoever_is_ready).
#
# Scope resolver (to wire): a test/gate's `requires_env:` set must be ⊆ the `available: true` resources here.
# Anything requiring an unavailable resource is BLOCKED-BY-ENV → HELD, out of planning scope, NO regression
# cascade. See genesis/docs/PLACEMENT.md § "Availability ≠ regression".

schema_version: 1
updated: 2026-06-04

resources:
