# requires_env vocabulary used by tests/stories/gates (declare on the artifact):
#   shem               — needs the shem multi-tenant canvas (cross-node)
#   alpha-cluster-6peer— needs the stable 6-peer alpha soak cluster
#   harbor             — needs CI image builds (any CI-graded verification)
#   household-nodes    — needs the local household P2P (usually available)
#
# provides_node_types — the deployments.json arm of the scope reconciler. Each resource declares which
# human nodeTypes it can place (deployments.json humans declare `nodeTypes`, the requirement side — same
# pattern as a doc's requires_env / a feature's @requires). scope-reconcile.py derives each human's
# `suspended` flag from this: suspended ⇔ NO nodeType maps to an available resource. Derived flags carry
# `"suspendedBy": "scope-reconcile:<caps>"` provenance (never hand-write; operator-manual suspensions
# without that marker are left alone). Flip a resource → the suspensions cascade with the held tree + env.
