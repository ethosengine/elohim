# Declared cluster / environment state — the "reality" input to the verification SCOPE gate.
#
# This is NOT auto-derived (no kubectl from the dev env — feedback_no_kubectl_from_dev_env). The operator
# or an agent UPDATES it; the update cascades SCOPE (which tests/stories/gates are runnable right now),
# NOT a regression signal. Partial availability is the STEADY STATE, not a failure (project_seed_whoever_is_ready).
#
# Scope resolver (to wire): a test/gate's `requires_env:` set must be ⊆ the `available: true` resources here.
# Anything requiring an unavailable resource is BLOCKED-BY-ENV → HELD, out of planning scope, NO regression
# cascade. See genesis/docs/PLACEMENT.md § "Availability ≠ regression".

schema_version: 1
updated: 2026-06-04

resources:
  household-nodes:
    role: Matthew / Jessica / James household — local P2P          # project_shem_is_p2p_live_canvas
    available: true
    provides_node_types: [operations, edge, performance]

  shem:
    role: multi-tenant live P2P canvas — the cross-node proving ground   # project_shem_is_p2p_live_canvas
    available: true
    provides_node_types: [remote]
    note: offline / inaccessible (operator-declared 2026-06-01). Cross-node P2P scenarios are OUT OF SCOPE
          until it returns — held, NOT regressed.

  alpha-cluster-6peer:
    role: 6-peer alpha soak cluster (adam+matthew bootstrap pair)   # project_alpha_topology_bootstrap_pair
    available: degraded
    note: 10/13 peers CrashLooping (158-168 restarts, failedSince build #1024). Whether this is a CODE
          regression or env-down is UNRESOLVED — needs operator/investigation before it earns a regression
          cascade. Soak gates #7/#11 are BLOCKED-BY-ENV until a stable 6-peer cluster exists.

  harbor-registry:
    role: CI image registry (harbor.ethosengine.com)
    available: true
    note: restored 2026-06-03 — CI pulls images cleanly (genesis #1074 ran every real stage, no
          ErrImagePull/500). Was down 2026-06-01 (#1119 ABORTED). Evidence-backed flip, mirrors the probe.

  observability:
    role: Grafana/Loki/Prometheus/Tempo stack (grafana.ethosengine.com) — playwright↔backend correlation
    available: true
    note: restored 2026-06-04 ~21:00Z (operator repaired grafana.db datasource uids — Grafana 13 makes
          provisioning failures boot-fatal; crashlooped since the ethosengine reboot). Evidence-backed:
          MCP list_datasources returns loki/prometheus/tempo/alertmanager with canonical uids; /api/health
          200. Was connection-refused ≥15:30-20:30Z 2026-06-04. Correlation-dependent diagnostics declare
          requires_env: [observability].

# requires_env vocabulary used by tests/stories/gates (declare on the artifact):
#   shem               — needs the shem multi-tenant canvas (cross-node)
#   alpha-cluster-6peer— needs the stable 6-peer alpha soak cluster
#   harbor             — needs CI image builds (any CI-graded verification)
#   household-nodes    — needs the local household P2P (usually available)
#
# provides_node_types — the deployments.json arm of the scope reconciler. Each resource declares which
# human nodeTypes it can place (deployments.json humans declare `nodeTypes`, the requirement side — same
# pattern as a doc's requires_env / a feature's @requires). scope-reconcile.py derives each human's
# `suspended` flag from this: suspended ⇔ NO nodeType maps to an available resource. Derived flags carry
# `"suspendedBy": "scope-reconcile:<caps>"` provenance (never hand-write; operator-manual suspensions
# without that marker are left alone). Flip a resource → the suspensions cascade with the held tree + env.
