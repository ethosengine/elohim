# spine.yaml — the delivery spine: arc-level invariants, each bound to a runnable check.
#
# WHY THIS EXISTS (2026-07-02, operator directive): cohesion was stored in prose
# (240+ specs/plans, memory files, backlogs) which requires a strong reader every
# session — the selection problem, not the work, is what sessions fail at. The
# spine inverts control: these nodes are the INTERFACES; specs/plans/memories are
# commentary hanging off them; sessions are interchangeable implementations of
# "make the top red green"; CI + the convergence loop is the composition root.
# Sibling of cluster-state.yaml (declared substrate capability) — this file is
# declared delivery truth. Read by .claude/scripts/spine-status.py, which emits
# the session-start headline.
#
# THE COVENANT (anti-pile admission control):
#   1. Max 12 nodes. A candidate node must displace one or wait.
#   2. status: green | red | unwired.
#      - red    = a runnable check EXISTS and fails → this is schedulable work.
#      - unwired = no runnable check yet → NOT schedulable; its ONLY legal first
#        move is writing the red (see first_move). Prose specs do not advance it.
#   3. Max 2 nodes flagged active: true (the WIP fence). Finishing beats starting.
#   4. Status flips require evidence (build #, live probe, test run) — never edit
#      status from memory or intention.
#   5. New specs/plans should cite the spine node they serve; a plan that serves
#      no node is a candidate for held/, not for writing.
#   6. Session contract: (a) move reds toward green with proof, (b) file new reds
#      as runnable checks, (c) one-line delta here. Nothing else is a deliverable.
