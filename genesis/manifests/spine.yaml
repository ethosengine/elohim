    evidence: >
      RED WRITTEN + verified failing 2026-07-25 (integ/resilience-card-governance):
      `cargo test --test sync_scale_honesty` → 0 passed, 2 failed, 0.13s. Both
      assert properties, not mechanisms, so any valid cure flips them.
      (1) the_round_opener_reflects_what_we_already_have — a node holding 2000
      docs and a node holding NONE produce a byte-identical opener
      ({"ListDocuments":{"h_app_id":"elohim","prefix":null,"offset":0,"limit":1000}}),
      so the opener carries no local state and every peer must enumerate its
      whole corpus every tick, converged or not: steady-state cost O(peers x
      corpus) instead of O(changes). (2) a_local_change_is_announced_to_connected_peers
      — 0 announcements for 2 connected peers; SyncRequest::AnnounceChange is
      defined and HANDLED by both transports (p2p/mod.rs, p2p_iroh/sync_backend.rs)
      but nothing in src/ ever constructs one, so the poll is the sole
      propagation path. Both call p2p::sync_round (new, pure) — the production
      planner initiate_sync_round now uses — deliberately NOT a test-local
      mirror: tests/sync_libp2p_convergence.rs re-implements the round in the
      test file, so a red written that way would measure the mirror and could
      sit red while the wire went green. Two adjacent findings surfaced by that
      work are now CURED (2026-07-25, same tree — the node stays red on the two
      invariant checks above, which are untouched by these): (a) the round tick
      was a HARDCODED Duration::from_secs(60) while Config::sync_interval_secs
      existed, was documented, and was read by nothing — now threaded via
      P2PConfig::sync_interval_secs, with sync_round::round_interval guarding the
      zero that would panic tokio's ticker at boot (3 unit tests; 0 is NOT
      "disabled" here, deliberately unlike the archetype broadcast cadences,
      because the round is currently the plane's ONLY propagation path).
      (b) The plane was not just poll-only, it was UNMEASURED — metrics.rs had no
      sync series at all. Now emits elohim_sync_rounds_total,
      elohim_sync_requests_total{kind}, elohim_sync_docs_enumerated_total (the
      enumeration magnitude — rate over rounds is the scaling read; trends to zero
      when cured, tracks corpus x peers today), and
      elohim_sync_request_outcomes_total{result} at the OutboundFailure site that
      was previously a warn! only — that last one is task #9's surface. Labels are
      result-only/bounded, reusing the view-federation vocabulary; peer identity
      stays in the log line, since a peer-id label is a cardinality bomb at mesh
      scale. Note the announce_change series sitting at zero IS check (2)'s red,
      now visible on a dashboard rather than only assertable in a test.
    guard: >
      Fake-green risk on check (2): making announcements_for_local_change return
