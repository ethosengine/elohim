server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    # Angular 19's application builder with SSR enabled emits `index.csr.html`
    # for the client-side path (not `index.html`). Listing both lets the nginx
    # image serve either an older Angular dist (index.html) or an Angular 19
    # SSR-enabled dist (index.csr.html) without a Dockerfile rename step.
    index index.html index.csr.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript application/wasm;

    # SPA routing - serve index.html (or index.csr.html on Angular 19 SSR
    # builds) for all routes that don't match a real file.
    location / {
        try_files $uri $uri/ /index.html /index.csr.html =404;
    }

    # Cache static assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache index.html or index.csr.html (the SPA entry document)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
    location = /index.csr.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Don't cache config.json
    location = /assets/config.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Don't cache version.json (deployment verification)
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        expires 0;
    }

    # Health endpoint for K8s probes
    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"healthy":true,"service":"elohim-app"}';
    }
}
