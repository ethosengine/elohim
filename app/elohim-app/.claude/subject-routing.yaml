version: 1
default_class: protocol-canonical        # matches root; explicit for documentation

# Locus identity — read by tooling/agents. The resolver ignores unknown top-level keys, so this block
# is INERT to merge today (documentary) but is the seat the deep-merge remap will activate from.
locus:
  subject: elohim-app-shell
  role: consumer-delivery                          # multi-pillar delivery locus; truth is NOT self
  # The shell CONSUMES protocol truth; it owns none of it (census row 9 corrected-truth column):
  #   - vocabulary/domains:   elohim/sdk/domains/<pillar>/   (lamad-/qahal-/imagodei-/shefa-/elohim-domain-gospel)
  #   - wire/API boundary:    elohim/elohim-storage/         (elohim-storage-gospel; views.rs camelCase boundary)
  subject_truth_home:
    - elohim/sdk/domains
    - elohim/elohim-storage
  # MULTI-PILLAR: no single pillar pin. Intended remap once deep-merge lands (NOT active today):
  # docs born under src/app/<pillar>/ pin to that pillar's locus; shell-root docs are delivery-layer.
  # Per-pillar TRUE-LOCUS exception (census row 5): src/app/elohim/models/ is canonical for the
  # frontend cross-pillar TS primitives (truth: self for those models; architecture prose is not).
  #
  # docs_island — pending retirement at the consolidated six-pillar operator gate (2026-06-11):
  # recomposition placed; `git rm` + pointer flips await the gate. After the gate these lines flip
  # to "RETIRED <date> — recomposed into <targets>" (see the lamad sub-manifest for the pattern).
