<section class="debug-shell">
  <header class="debug-header">
    <h1>Protocol Debug</h1>
    <p class="debug-subtitle">
      Node-local diagnostics for this device. Read-only. Reflects whichever replica/node answered —
      not a cluster-wide aggregate.
    </p>
    <button
      type="button"
      class="nav-pin-toggle"
      data-testid="debug-nav-pin"
      (click)="toggleNavPin()"
    >
      {{ navPinned() ? '📌 Unpin from navigation' : '📍 Pin to navigation' }}
    </button>
    <span class="nav-pin-hint" *ngIf="navVisible() && !navPinned()">
      (currently shown in nav via dev mode)
    </span>
  </header>

  <nav class="debug-tabs" role="tablist">
    <button
      type="button"
      *ngFor="let lens of lenses"
      role="tab"
      class="debug-tab"
      [attr.data-testid]="'debug-tab-' + lens.id"
      [class.active]="lens.id === activeId()"
      [attr.aria-selected]="lens.id === activeId()"
      (click)="select(lens.id)"
    >
      <span class="tab-icon">{{ lens.icon }}</span>
      {{ lens.title }}
    </button>
  </nav>

  <div class="debug-panel" role="tabpanel">
    <ng-container *ngFor="let lens of lenses">
      <ng-container *ngIf="lens.id === activeId()">
        <ng-container *ngComponentOutlet="lens.component" />
      </ng-container>
    </ng-container>
  </div>
</section>
