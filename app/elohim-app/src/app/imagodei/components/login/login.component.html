<elohim-imagodei-portal-shell
  #shell
  [attr.step]="step"
  [attr.flywheel-hint]="flywheelHint ? '' : null"
  [authority]="authority"
>
  @if (step === 'resolve') {
    <elohim-imagodei-federated-resolver
      #resolver
      slot="primary"
      [attr.remember-key]="authIdentifierKey"
      (resolved)="onResolved($event)"
      (resolve-error)="onResolveError($event)"
    >
      <span slot="help-text">
        Enter your federated identifier — for example, matthew&#64;alpha.elohim.host.
      </span>
    </elohim-imagodei-federated-resolver>
  }

  @if (step === 'login') {
    <elohim-imagodei-login-card
      #loginCard
      slot="primary"
      [attr.remembered-identifier]="identifier"
      allow-password
      (password-submit)="onPasswordSubmit($event)"
      (oauth-start)="onOAuthStart($event)"
    ></elohim-imagodei-login-card>
  }

  @if (errorMessage) {
    <div slot="error-region" role="alert" class="error-region">
      {{ errorMessage }}
      <a routerLink="/identity/recovery">recover account</a>
    </div>
  }
</elohim-imagodei-portal-shell>
