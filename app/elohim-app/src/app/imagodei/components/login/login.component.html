<elohim-imagodei-portal-shell
  #shell
  [attr.step]="step"
  [attr.flywheel-hint]="flywheelHint ? '' : null"
  [authority]="authority"
>
  @if (step === 'resolve') {
    <elohim-imagodei-federated-resolver
      #resolver
      slot="primary"
      [attr.remember-key]="authIdentifierKey"
      (resolved)="onResolved($event)"
      (resolve-error)="onResolveError($event)"
    >
      <span slot="help-text">
        Enter your federated identifier — for example, matthew&#64;alpha.elohim.host. We'll send you
        to your own doorway to sign in.
      </span>
    </elohim-imagodei-federated-resolver>
  }

  @if (step === 'login') {
    <p slot="primary" class="handoff-note" role="status" data-testid="portal-handoff">
      Taking you to your doorway to sign in…
    </p>
  }

  @if (errorMessage) {
    <div slot="error-region" role="alert" class="error-region">
      {{ errorMessage }}
      <a routerLink="/identity/recovery">recover account</a>
    </div>
  }
</elohim-imagodei-portal-shell>
