<section class="hero" data-testid="landing-hero">
  <div class="hero-content">
    <div class="content-container">
      <div class="logo-section" [class.hidden]="isVideoVisible || isDeepDiveVisible">
        <div class="logo-container">
          <img src="/images/elohim_logo_light.png" alt="Elohim Protocol Logo" class="hero-logo" />
        </div>
        <h1>Elohim Protocol</h1>
        <p class="hero-subtitle">
          Technology organized around love — digital infrastructure for human flourishing.
        </p>
        <div class="hero-cta">
          <a
            [href]="protocolHref"
            class="cta-button hero-cta-primary"
            data-testid="landing-cta-start"
          >
            Start the journey
          </a>
          <button
            type="button"
            class="listen-button hero-cta-secondary"
            (click)="toggleDeepDive()"
            data-testid="hero-play-button"
          >
            Watch the vision · 50 min, no code
          </button>
        </div>
      </div>

      <div class="video-section intro-video" [class.visible]="isVideoVisible">
        <div class="hero-video">
          <iframe
            width="560"
            height="315"
            src="https://www.youtube.com/embed/6g6v7ZMEAxk"
            title="The Elohim Protocol: Reimagining Digital Infrastructure for Human Flourishing & the Care Economy"
            allow="
              accelerometer;
              autoplay;
              clipboard-write;
              encrypted-media;
              gyroscope;
              picture-in-picture;
              web-share;
            "
            allowfullscreen
          ></iframe>
        </div>
        <p class="video-subtitle">Summary (~7min)</p>
        <div class="video-buttons">
          <button
            type="button"
            class="back-to-logo-button"
            (click)="hideVideo()"
            data-testid="hero-video-back"
          >
            Back
          </button>
          <button
            type="button"
            class="deep-dive-button"
            (click)="toggleDeepDive()"
            data-testid="hero-deep-dive"
          >
            Deep Dive
          </button>
        </div>
      </div>

      <div class="video-section deep-dive-video" [class.visible]="isDeepDiveVisible">
        <div class="hero-video">
          <iframe
            width="560"
            height="315"
            src="https://www.youtube.com/embed/sVXwZ087ffA"
            title="Elohim Protocol Deep Dive - Technical Overview"
            allow="
              accelerometer;
              autoplay;
              clipboard-write;
              encrypted-media;
              gyroscope;
              picture-in-picture;
              web-share;
            "
            allowfullscreen
          ></iframe>
        </div>
        <p class="video-subtitle">Deep Dive Podcast (~51min)</p>
        <div class="video-buttons">
          <button
            type="button"
            class="back-to-logo-button"
            (click)="hideVideo()"
            data-testid="hero-deep-dive-back"
          >
            Back
          </button>
          <button
            type="button"
            class="intro-video-button"
            (click)="toggleVideo()"
            data-testid="hero-summary"
          >
            Summary
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="scroll-indicator">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M12 16l-6-6h12z" />
    </svg>
  </div>
</section>
<div class="space-atmosphere-transition"></div>
