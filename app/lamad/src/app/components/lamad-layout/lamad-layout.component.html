<div class="lamad-container">
  <!-- Elohim Navigator (unified header — Lit element from elohim-core) -->
  <elohim-navigator
    [attr.context]="'lamad'"
    [attr.show-search]="true"
    [contextApps]="navigatorApps"
    [identityRoutes]="navigatorIdentityRoutes"
    (navigate)="onNavigatorNavigate($event)"
  >
    <!-- Live sync convergence strip (non-blocking; self-hides when caught up) -->
    <app-sync-progress></app-sync-progress>

    <!-- Loading State -->
    <div *ngIf="!isReady" class="loading-state">
      <div class="spinner"></div>
      <p>Loading content...</p>
    </div>

    <!-- Main Content -->
    <div class="lamad-main" *ngIf="isReady">
      <router-outlet></router-outlet>
    </div>
  </elohim-navigator>

  <!-- Footer -->
  <footer class="lamad-footer">
    <p>
      Lamad Learning Platform | Where Understanding is Earned |
      <a href="/" class="footer-link" data-testid="lamad-footer-home-link">Powered by Elohim Protocol</a>
    </p>
  </footer>
</div>
