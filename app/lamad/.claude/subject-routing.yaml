  subject: lamad
  pillar: lamad
  role: reference-client-consumer                 # consumes the lamad subject; does NOT own it
  subject_truth_home: elohim/sdk/domains/lamad     # cited as `lamad-domain-gospel` from app/lamad/CLAUDE.md
