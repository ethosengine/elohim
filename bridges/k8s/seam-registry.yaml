seamRegistryVersion: 1
crate: k8s-bridge
crateRoot: bridges/k8s
seamLocus: S3.6 orchestrator resource render outward; capacity observation; no enforcement or anchoring.
decisionPoints:
- name: render_envelope
  kind: verdict-fn
  sourceLocation:
    file: src/lib.rs
    modulePath: k8s_bridge
  summary: Project declared limits and request floor to Kubernetes quantities with exact conductor/storage shares.
  concernIds:
  - id: C0
    status: answered
    justification: S3.6 outward bridge; pure resource projection of a local CID-pinned declaration, no network writes.
  - id: C1
    status: n-a
    justification: The pure renderer takes one manifest and does not select the applicable head.
  - id: C2
    status: n-a
    justification: No heads or shared state move; verify reads files and returns evidence.
  - id: C3
    status: answered
    justification: Invalid declarations return errors; callers can revise the declaration and render again without
      rollback.
  - id: C4
    status: answered
    justification: absent_envelope_renders_empty_object_and_keeps_live_cid pins absence as empty output, never fabricated
      zeros.
  - id: C5
    status: answered
    justification: Golden tests compare the independent bash arithmetic; ark-core validates declarations and mints
      identity.
  - id: C6a
    status: partial
    justification: Fixed four-field comparison and finite manifest input; serialized file size and fleet count have
      no admission ceiling.
  - id: C6b
    status: answered
    justification: The golden tests exercise pure deterministic rendering without effects or records.
  - id: C7
    status: answered
    justification: cli_render_reports_cid proves render reports its declaration CID; declaration is not enforcement.
  - id: C8
    status: answered
    justification: cli_render_reports_cid pins the manifest CID on render stderr.
  - id: C9
    status: n-a
    justification: No agent keys, control binding, recovery, re-keying, or identity lineage is changed.
  - id: C10
    status: answered
    justification: unknown_schema_or_archetype_and_invalid_requests_refuse rejects guessed versions; absent fields
      preserve the live CID.
  - id: C11
    status: n-a
    justification: No remote receiver, retries, timeout, or network backpressure exists.
  - id: C12
    status: n-a
    justification: The pure renderer has no filesystem, cluster or network authority.
  - id: C13
    status: answered
    justification: Rendering declares resources without quota enforcement; observe promotes only measured capacity.
  - id: C14
    status: partial
    justification: Render errors retain textual schema/archetype/request reasons; no typed reason taxonomy or witness
      is added.
  contractTests:
  - path: bridges/k8s/tests/contracts.rs
    testName: golden_split_matches_bash_for_every_archetype_and_adam
    kind: integration
  - path: bridges/k8s/tests/contracts.rs
    testName: split_floors_odd_values_and_passes_absent_limits_through
    kind: integration
  - path: bridges/k8s/tests/contracts.rs
    testName: absent_envelope_renders_empty_object_and_keeps_live_cid
    kind: integration
  - path: bridges/k8s/tests/contracts.rs
    testName: unknown_schema_or_archetype_and_invalid_requests_refuse
    kind: integration
  - path: bridges/k8s/tests/contracts.rs
    testName: superseding_manifest_pins_request_override_and_archetype_lineage
    kind: integration
  - path: bridges/k8s/tests/contracts.rs
    testName: cli_render_reports_cid
    kind: integration
- name: drift_verdict
  kind: boundary-answer-type
  sourceLocation:
    file: src/lib.rs
    modulePath: k8s_bridge
  summary: Fresh, PinMismatch, RenderDrift or Unpinned evidence; never rewrite the declared head.
  concernIds:
  - id: C0
    status: answered
    justification: S3.6 outward bridge; pure resource projection of a local CID-pinned declaration, no network writes.
  - id: C1
    status: answered
    justification: The deployment CID declares the applicable head; supersedes is lineage, never recency selection.
  - id: C2
    status: n-a
    justification: No heads or shared state move; verify reads files and returns evidence.
  - id: C3
    status: answered
    justification: Refusals name a repairable pin or resource field; callers revise files explicitly, never via
      automatic repair.
  - id: C4
    status: answered
    justification: missing_pin_is_unpinned_and_suspended_humans_are_skipped distinguishes absence from drift.
  - id: C5
    status: answered
    justification: changed_manifest_bytes_are_pin_mismatch re-derives identity with ark-core before comparing rendered
      quantities; evidence never grants authority.
  - id: C6a
    status: partial
    justification: Fixed four-field comparison and finite manifest input; serialized file size and fleet count have
      no admission ceiling.
  - id: C6b
    status: answered
    justification: pinned_fleet_is_fresh checks read-only reproducible verification; pure rendering neither writes
      files nor mints heads.
  - id: C7
    status: answered
    justification: cli_missing_pin_refuses pins the advertised refusal, not runtime quota enforcement.
  - id: C8
    status: answered
    justification: Drift verdicts name human, field and both values, pinned by perturbation and CID mutation tests.
  - id: C9
    status: n-a
    justification: No agent keys, control binding, recovery, re-keying, or identity lineage is changed.
  - id: C10
    status: answered
    justification: quantity_equivalence_is_exact_and_malformed_quantities_refuse proves unit-equivalent comparison
      without silently accepting malformed values.
  - id: C11
    status: n-a
    justification: No remote receiver, retries, timeout, or network backpressure exists.
  - id: C12
    status: answered
    justification: pin_path_cannot_escape_manifest_directory confines manifest reads; the bridge has no cluster
      credentials or mutation capability.
  - id: C13
    status: answered
    justification: '2026-09-05 all active humans pinned: Unpinned refuses at exit 65, pinned by cli_missing_pin_refuses.'
  - id: C14
    status: partial
    justification: Typed drift residuals retain compared values; malformed input and IO errors still use textual
      errors, with no witnessed residual ledger.
  contractTests:
  - path: bridges/k8s/tests/contracts.rs
    testName: pinned_fleet_is_fresh
    kind: integration
  - path: bridges/k8s/tests/contracts.rs
    testName: perturbed_field_is_render_drift
    kind: integration
  - path: bridges/k8s/tests/contracts.rs
    testName: changed_manifest_bytes_are_pin_mismatch
    kind: integration
  - path: bridges/k8s/tests/contracts.rs
    testName: missing_pin_is_unpinned_and_suspended_humans_are_skipped
    kind: integration
  - path: bridges/k8s/tests/contracts.rs
    testName: quantity_equivalence_is_exact_and_malformed_quantities_refuse
    kind: integration
  - path: bridges/k8s/tests/contracts.rs
    testName: pin_path_cannot_escape_manifest_directory
    kind: integration
  - path: bridges/k8s/tests/contracts.rs
    testName: cli_missing_pin_refuses
    kind: integration
- name: fold_observation
  kind: verdict-fn
  sourceLocation:
    file: src/observe.rs
    modulePath: k8s_bridge::observe
  summary: Validate complete known-node evidence before replacing only observed capacity fields; refuse without
    mutation.
  concernIds:
  - id: C0
    status: answered
    justification: Category C operator capacity projection in the S3.6 outward bridge; no substrate heads.
  - id: C1
    status: n-a
    justification: Observation does not select a manifest or elect a declared head.
  - id: C2
    status: n-a
    justification: No canonical channel, shared head or healing operation exists.
  - id: C3
    status: answered
    justification: A refusal leaves the ledger untouched; restore missing evidence and retry explicitly.
  - id: C4
    status: answered
    justification: missing_node_refuses_without_mutation and prometheus_error_status_refuses distinguish missing
      evidence from zero capacity.
  - id: C5
    status: answered
    justification: canned_promotion_changes_only_observed_fields re-derives totals from known nodes; unknown_node_warns_without_adding_or_counting
      prevents self-enrollment.
  - id: C6a
    status: partial
    justification: Three sequential HTTP requests, each with a 30-second timeout and no redirects or retry loop;
      response size has no admission ceiling.
  - id: C6b
    status: partial
    justification: No additive effects; capacities overwrite measurements. Provenance intentionally names the previous
      snapshot on each promotion.
  - id: C7
    status: answered
    justification: cli_missing_prometheus_url_refuses_65 pins explicit endpoint configuration; observe measures
      allocatable, not runtime enforcement.
  - id: C8
    status: partial
    justification: FieldChange retains JSON pointer and old/new values; warning and refusal text names nodes, but
      no metrics counter is emitted.
  - id: C9
    status: n-a
    justification: No identity, key, lineage or agent binding changes.
  - id: C10
    status: answered
    justification: Unknown nodes warn without joining the ledger; status and vector shape are checked; extra Prometheus
      metadata is ignored.
  - id: C11
    status: partial
    justification: HTTP failures and timeout refuse with exit 65 and preserve the ledger; no retry or counted backpressure
      policy.
  - id: C12
    status: answered
    justification: Only explicit CLI invocation writes the supplied ledger; endpoint comes from PROMETHEUS_URL or
      --prometheus-url, never a production default.
  - id: C13
    status: answered
    justification: Operator-promoted Category C evidence; successor is runtime HostPassport allocatable reporting
      per design section 6.
  - id: C14
    status: partial
    justification: ObserveRefusal carries a refusal reason; no durable residual witness or taxonomy is claimed.
  contractTests:
  - path: bridges/k8s/tests/observe.rs
    testName: canned_promotion_changes_only_observed_fields
    kind: integration
  - path: bridges/k8s/tests/observe.rs
    testName: missing_node_refuses_without_mutation
    kind: integration
  - path: bridges/k8s/tests/observe.rs
    testName: zero_and_nonfinite_allocatable_refuse
    kind: integration
  - path: bridges/k8s/tests/observe.rs
    testName: unknown_node_warns_without_adding_or_counting
    kind: integration
  - path: bridges/k8s/tests/observe.rs
    testName: prometheus_error_status_refuses
    kind: integration
  - path: bridges/k8s/tests/observe.rs
    testName: key_order_and_untouched_fields_round_trip_identically
    kind: integration
  - path: bridges/k8s/tests/observe.rs
    testName: cli_missing_prometheus_url_refuses_65
    kind: integration
  - path: bridges/k8s/tests/observe.rs
    testName: not_ready_is_evidence_not_zero_capacity
    kind: integration
