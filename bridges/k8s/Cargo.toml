[workspace]
resolver = "2"
members = ["."]

[package]
name = "k8s-bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Runtime manifest resource rendering and pin verification for the orchestrator"

[dependencies]
elohim-ark-core = { path = "../../elohim/ark/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
