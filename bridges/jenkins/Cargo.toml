[workspace]
resolver = "2"
members = ["."]

[package]
name = "jenkins-bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Consuming-app bridge: Jenkins served by the network, never in control of it — edge builds enter as external-claim observations under a governed offer"

[lib]
name = "jenkins_bridge"
path = "src/lib.rs"

[[bin]]
name = "jenkins-bridge"
path = "src/main.rs"

[dependencies]
# The valueflow vocabulary (Process, FlowEvent, Intent, SidecarFlowStore) — the only record
# shapes this bridge speaks.
elohim-epr-rea = { path = "../../elohim/epr-rea" }
# The one canonical CID codec (`compute_cid` over DAG-CBOR) and the protocol-owned Reach enum.
elohim-epr = { path = "../../elohim/epr" }
# Reused, never re-minted: the recipe registry, the distinct-Steward offer standing (Slice 0's
# affiliations and verdict path), the body CID and the repository agent.
elohim-epr-cli = { path = "../../elohim/eprfs/epr-cli" }
cid = "0.11"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_ipld_dagcbor = "0.6"

[dev-dependencies]
eprfs-agent = { path = "../../elohim/eprfs/eprfs-agent" }
eprfs-core = { path = "../../elohim/eprfs/eprfs-core" }
tempfile = "3"
