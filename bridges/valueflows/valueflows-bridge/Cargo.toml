[package]
name = "valueflows-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "hREA / VF-GraphQL bridge — library mounted by elohim-storage at /api/v1/vf-graphql."

[dependencies]
valueflows-types = { path = "../valueflows-types" }

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
diesel = { workspace = true }

async-graphql = { workspace = true }
hyper = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }

tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# 0.27 + bundled: compiles sqlite3 from source for bridge-local tests.
# elohim-storage uses 0.35 via Diesel — harmless because the valueflows
# workspace is isolated from the elohim workspace; no shared `links`
# conflict. If both workspaces are ever merged, upgrade to match
# elohim-storage's transitive pin.
libsqlite3-sys = { version = "0.27", features = ["bundled"] }
