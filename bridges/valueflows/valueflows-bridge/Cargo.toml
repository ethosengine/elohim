[package]
name = "valueflows-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "hREA / VF-GraphQL bridge — library mounted by elohim-storage at /api/v1/vf-graphql."

[dependencies]
valueflows-types = { path = "../valueflows-types" }

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
diesel = { workspace = true }

async-graphql = { workspace = true }
hyper = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }

tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
# bundled = compile sqlite3 from source; avoids -lsqlite3 system library
# dependency during bridge-local tests where no libsqlite3.so symlink exists.
libsqlite3-sys = { version = "0.27", features = ["bundled"] }
