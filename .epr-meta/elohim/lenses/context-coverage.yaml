# Context-Coverage Manifest — the tuning surface for the memory-stasis / context-coverage tooling.
#
# This is the .coveragerc / codecov.yml of CONTEXT coverage: `placement-audit.py --stasis` and
# `context-ratchet.py` READ this file, so you TUNE here — not in code. Every target carries a `why:`
# methodology block — the reasoning behind the number — so a future tuner adjusts with understanding,
# not guesswork. (A link is a path + explainer; a target is a value + methodology.)

targets:
  benchmark:
    value: 1.0
    why: >
      Full coverage is the ideal, and we benchmark against 1.0 (not a lowered "good enough") so the gap
      to perfect is always visible. The MARGIN — not a lowered benchmark — is where "done" lives, so we
      never quietly redefine the goal down.
  margin:
    value: 0.15
    why: >
      ±15% is the agentic-developer context-capacity tolerance: tight enough that a surface "within
      margin" is one an agent can hold and reason over without burning its window, loose enough that
      transient churn (a doc mid-edit) doesn't trip the gate. Tighten as agent context windows grow;
      loosen if the team tending the surface is smaller than the surface.
  memory_md_budget:
    value: 24000
    why: >
      MEMORY.md is injected into EVERY session, and the harness TRUNCATES the load at ~24.4KB — a
      bigger index silently loses its tail (the 2026-07-02 context-leak). 24000 is the real cap with
      headroom, owned by memory-index-projector.py (HARD_BUDGET_BYTES; soft 20000 starts the
      consolidation signal). Over budget means umbrella-fold or graduate — the index is GENERATED,
      so per-entry trimming happens in topic-file description: frontmatter, never by hand here.
  claude_md_budget:
    value: 12000
    why: >
      A CLAUDE.md gate fires when an agent works in its directory. ~12KB is a gate an agent absorbs in
      passing without derailing the task. Bigger gates get skimmed or skipped — defeating the
      pause-before-tokens purpose.
  ratchet_epsilon:
    value: 0.005
    why: >
      Float-noise tolerance for the must-not-decrease gate: small enough to catch a real one-doc
      regression, large enough that rounding in a ratio doesn't fail CI spuriously.

dimensions:        # weight 0 disables a dimension; weights are relative (normalized in the score)
  capture:
    weight: 1.0
    why: >
      Every spec/plan must be decomposed or we don't even KNOW the remaining work. Highest-leverage in
      spirit because un-captured work is invisible work; equal-weighted for now until evidence says raise it.
  status:
    weight: 1.0
    why: >
      A doc with no machine-readable state is a write-only dump — the original debt. A stateless doc is
      as harmful as an unlinked one, so equal weight.
  well_formed:
    weight: 1.0
    why: >
      An orphan (no inbound/outbound link) is unreachable in the graph — it can't be progressively
      surfaced. The graph is only as good as its connectedness.
  memory_linked:
    weight: 1.0
    why: >
      A memory entry that cites no system can't be verified or warmed by the feedback graph — it's an
      unfalsifiable claim. Currently the lowest dimension (~4%) and the single biggest lift.
  claude_md_rightsized:
    weight: 1.0
    why: >
      An oversized gate burns the very context it's meant to protect. Right-sizing is a direct
      context-capacity guarantee.
  history_bidirectional:
    weight: 1.0
    why: >
      A history record with no canonical back-link is a one-way edge: the lesson exists but the canonical
      doc doesn't point to it, so it won't surface where it's needed.
  traceability:
    weight: 1.0
    why: >
      Each link a path + 1-2 sentence explainer, from code through scenario/archetype to story. This is
      the living chain the whole effort exists to build. Equal-weight now; raise it once the convention
      is rolled out and it's the binding constraint.
  memory_md_budget:
    weight: 1.0
    why: >
      The always-loaded index staying within budget is a hard context-capacity constraint, so it counts
      as a full dimension, not a footnote.
  epr_meta_coverage:
    weight: 1.0
    why: >
      Directory-level governance coverage: the fraction of structurally-substantial regions OWNED by a
      self-responsible `.epr-meta` (one that declares `covers: subtree`). The downward dual of the
      claude_md dimension — CLAUDE.md front-loads init context; `.epr-meta` is edit-time compose-gate
      governance, so its coverage is the "is every governable region thoughtfully considered?" measure.
      Introduced 2026-06-28 at half weight (a scaffold so near-zero coverage wouldn't mask the other
      dimensions before the remediation campaign existed); PROMOTED to full weight 2026-06-28 once the
      in-flight nudge shipped and the campaign began — it is now a first-class peer dimension, equal to
      the other governance/coverage axes, exactly as the concern is framed. The headline token +
      `--epr-meta` queue + the in-flight resolver-hook nudge carry the actionable signal regardless.

hard:              # must be exactly 0 — these GATE the score regardless of the others
  why: >
    A dump is a dump and a non-empty pressure dir is an open wound: no amount of coverage elsewhere
    offsets a dumping ground. These are pass/fail, not graded.
  members:
    - dumps
    - pressure_docs

exclusions:        # no-cover — the `# pragma: no cover` analogue; excluded from the denominator
  why: >
    Some artifacts legitimately need no coverage: generated gates, the state-machine dirs themselves,
    vendored content. Excluding them keeps the denominator honest — coverage measures what SHOULD be covered.
  globs:
    - "**/CLAUDE.md"
    - "genesis/docs/_state/**"

epr_meta_governance:   # tunables for the epr_meta_coverage dimension's subtree-coverage walk
  why: >
    The substantiality thresholds + exclusions for "which directories are governable context". A region
    is a GAP iff it clears these AND no `covers: subtree` .epr-meta owns it. min_exts is 1 (NOT claude-md's
    2): a single-language code dir (pure .rs / pure .ts) is a prime .epr-meta governance target, whereas
    claude-md skips single-ext dirs as needing less doc. Git submodules are excluded automatically
    (from .gitmodules); add only first-party no-govern regions here (generated code, vendored, design raw).
  min_files: 15        # this many direct files makes a dir architecturally real
  min_subdirs: 4       # OR this many subdirs
  min_exts: 1          # AND at least one distinct complexity-extension (code, not pure data/assets)
  exclude:
    - "**/generated"
    - "**/generated/**"
    - "genesis/docs/_state/**"
    - "genesis/graphos/design-assets/**"
