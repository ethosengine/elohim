seamRegistryVersion: 1
crate: elohim-ark-supervisor
crateRoot: elohim/ark/supervisor
seamLocus: Local runtime observation; no release election, adoption grant, or DHT authority.
decisionPoints:
  - name: executable_identity_readiness
    kind: boundary-answer-type
    sourceLocation:
      file: src/driver.rs
      modulePath: ark_supervisor::driver::Driver::running_artifact_sha256
    summary: >
      A current executable digest is an observation; missing observation cannot satisfy
      the executable-identity readiness rung. The native driver opens the kernel executable
      handle rather than reopening a pathname that could have been replaced.
    concernIds:
      - id: C0
        status: answered
        justification: Local runtime observation, separate from head election, readability, and custody.
      - id: C1
        status: n-a
        justification: No candidate is elected or release authored.
      - id: C2
        status: n-a
        justification: No assignment, release head, or authority transition occurs.
      - id: C3
        status: answered
        justification: Failed observation follows the existing readiness timeout and bounded restart machine.
      - id: C4
        status: partial
        justification: Unavailable observations fail closed; Option does not distinguish unsupported from unreadable.
      - id: C5
        status: answered
        justification: Native observation hashes the kernel's current executable, never the remembered spawn digest.
      - id: C6a
        status: partial
        justification: Hashing uses fixed-size buffers and readiness has a deadline; a blocked filesystem read is not cancellable.
      - id: C6b
        status: answered
        justification: Observations write nothing and create no shared records.
      - id: C7
        status: answered
        justification: A configured identity rung cannot advertise ready without a matching observed executable.
      - id: C8
        status: partial
        justification: Existing readiness-rung timeout and death witnesses remain; no identity-specific counter is added.
      - id: C9
        status: n-a
        justification: No agent keys or source chains are accessed or changed.
      - id: C10
        status: answered
        justification: The new probe is an explicit enum variant; old manifests retain their existing shape and CID.
      - id: C11
        status: partial
        justification: Unreadable process images cannot become readiness evidence; filesystem latency remains a local risk.
      - id: C12
        status: n-a
        justification: Observation grants no activation or arc-transition authority.
      - id: C13
        status: n-a
        justification: The measurement has no social-tier gate.
      - id: C14
        status: partial
        justification: Readiness failure uses existing death and incident records; the observed mismatch digest is not persisted.
    contractTests:
      - path: elohim/ark/supervisor/tests/native_reap.rs
        testName: running_identity_reads_the_executed_inode_after_path_replacement
        kind: integration
      - path: elohim/ark/supervisor/tests/supervise_death.rs
        testName: executable_identity_rung_accepts_the_pinned_running_binary
        kind: integration
      - path: elohim/ark/supervisor/tests/supervise_death.rs
        testName: service_readiness_cannot_certify_a_different_executable
        kind: integration
      - path: elohim/ark/supervisor/tests/supervise_death.rs
        testName: missing_driver_identity_never_falls_back_to_the_spawn_digest
        kind: integration
  - name: declared_bin_current
    kind: boundary-answer-type
    sourceLocation:
      file: src/native.rs
      modulePath: ark_supervisor::native::NativeDriver::start
    summary: A bin channel starts the verified local current through device-runtime custody; the passport observes the same registry and per-tool store selection.
    concernIds:
      - { id: C0, status: answered, justification: "Private device custody and ephemeral process observation; no network authority." }
      - { id: C1, status: n-a, justification: "No candidate selection or promotion; only current is resolved." }
      - { id: C2, status: answered, justification: "The selected immutable release path is fixed before spawn and rehashed by the native driver." }
      - { id: C3, status: answered, justification: "Missing custody follows existing bounded restart/readiness policy." }
      - { id: C4, status: answered, justification: "Absent or corrupt current refuses; unknown observation stays null." }
      - { id: C5, status: answered, justification: "The existing device-runtime verifier checks the complete release; no second verifier is added." }
      - { id: C6a, status: answered, justification: "Local release verification only; no build, fetch or network call on the launch path." }
      - { id: C6b, status: answered, justification: "Reading current creates no session pin and moves no head." }
      - { id: C7, status: n-a, justification: "No advertisement." }
      - { id: C8, status: answered, justification: "Passport binds the unchanged manifest CID to the actual executable path, hash and observed tool release." }
      - { id: C9, status: answered, justification: "Non-bin unresolved channels retain the existing explicit refusal." }
      - { id: C10, status: answered, justification: "Pure ark-core stays free of runtime dependencies; the I/O supervisor reuses device-runtime." }
      - { id: C11, status: n-a, justification: "No new scheduling policy." }
      - { id: C12, status: answered, justification: "Only local configured custody is eligible; ambient candidates and session pins cannot replace current." }
      - { id: C13, status: n-a, justification: "No trust-tier grant." }
      - { id: C14, status: answered, justification: "Existing supervisor teardown owns child lifetime and evidence." }
    contractTests:
      - { path: elohim/ark/cli/tests/cli_smoke.rs, testName: bin_channel_runs_verified_device_current_and_passport_observes_it, kind: integration }

  - name: observe_host
    kind: boundary-answer-type
    sourceLocation:
      file: src/host.rs
      modulePath: ark_supervisor::host::observe_host
    summary: >
      Observe private Provides from CPUID and usable vector state, uname, loaded glibc
      and resolving loader paths. Supervisor retains one snapshot, refreshes explicitly,
      and never writes the inventory to a record. CLI printing is local diagnostics only.
    concernIds:
      - {id: C0, status: answered, justification: 'Host compatibility observation lives in supervisor I/O beside the unchanged enforcement Fingerprint.'}
      - {id: C1, status: n-a, justification: 'No release election or head selection.'}
      - {id: C2, status: n-a, justification: 'No authority ordering or version election.'}
      - {id: C3, status: n-a, justification: 'Finite synchronous probes, no retry lifecycle.'}
      - {id: C4, status: answered, justification: 'Known axes begin unobserved; only successful probes replace that state.'}
      - {id: C5, status: answered, justification: 'No manifest, catalogue or device label supplies an observation.'}
      - {id: C6a, status: partial, justification: 'Fixed axes and loader path list; filesystem metadata I/O is not cancellable.'}
      - {id: C6b, status: answered, justification: 'Read-only probes; refresh replaces the in-memory snapshot and emits no records.'}
      - {id: C7, status: answered, justification: 'No host inventory advertisement; local printing does not create records.'}
      - {id: C8, status: partial, justification: 'Operator can print axes locally; no per-probe live metric is introduced.'}
      - {id: C9, status: n-a, justification: 'No agent identities or keys.'}
      - {id: C10, status: answered, justification: 'Canonical contract axis and feature spellings; unsupported probes remain unobserved.'}
      - {id: C11, status: n-a, justification: 'One snapshot per envelope, no external queue.'}
      - {id: C12, status: n-a, justification: 'Observation confers no authority to execute.'}
      - {id: C13, status: n-a, justification: 'No social authority tier.'}
      - {id: C14, status: partial, justification: 'Probe failures remain unobserved; F3 illegal-instruction witnessing is a later slice.'}
    contractTests:
      - {path: elohim/ark/supervisor/src/host.rs, testName: every_supported_axis_is_observed_or_explicitly_unobserved, kind: unit}
      - {path: elohim/ark/supervisor/src/host.rs, testName: versions_are_numeric_and_fail_closed, kind: unit}
      - {path: elohim/ark/supervisor/tests/supervise_death.rs, testName: host_inventory_is_cached_refreshable_and_absent_from_every_written_record, kind: integration}
      - {path: elohim/ark/cli/tests/cli_smoke.rs, testName: host_provides_is_a_local_diagnostic_without_records, kind: integration}
      - {path: elohim/ark/supervisor/src/x86.rs, testName: extractor_names_are_probed_or_explicitly_unprobed, kind: unit}
      - {path: elohim/ark/supervisor/src/x86.rs, testName: synthetic_avx_requires_osxsave_and_vector_state, kind: unit}
      - {path: elohim/ark/supervisor/src/x86.rs, testName: pku_and_fsgsbase_require_os_enablement, kind: unit}

  - name: admit_candidate
    kind: verdict-fn
    sourceLocation:
      file: src/admission.rs
      modulePath: ark_supervisor::admission::admit_candidate
    summary: >
      Reuses host-contract admission locally, recording only requirement-side effects.
      Missing requirements fail closed. Only unmet extracted isa.x86 clauses on this
      device's own, non-withdrawn artifact can receive a named own-build permit.
    concernIds:
    - id: C0
      status: answered
      justification: Supervisor owns the opaque grant and its separate record; core authenticates content only. Host inventory stays in memory.
    - id: C1
      status: n-a
      justification: No release election or head mutation; executable CID is independently supplied.
    - id: C2
      status: n-a
      justification: No competing version selection, clock or authority tier is introduced.
    - id: C3
      status: n-a
      justification: Synchronous evaluation of finite requirements; no lifecycle or retry state.
    - id: C4
      status: answered
      justification: Missing requirement, unknown axis, unobserved axis and unmet predicate refuse distinctly.
    - id: C5
      status: partial
      justification: >
        Local Provides is checked with the contract predicate; only the configured artifact reader
        resolves requirements and same-device Produce provenance. Records cannot construct a grant.
        EPR_BIN and PATH remain trusted local configuration.
    - id: C6a
      status: partial
      justification: >
        One comparison per original clause; no network or retries. Caller-side artifact
        requirement acquisition and size limits remain upstream of this local function.
    - id: C6b
      status: answered
      justification: Deterministic, side-effect-free evaluation; no records are minted by the predicate.
    - id: C7
      status: partial
      justification: >
        An opaque grant is returned only from authenticated content and reader-resolved requirements. Activation and fetch are later consumers;
        this implementation does not advertise compatibility or launch from a verdict.
    - id: C8
      status: partial
      justification: >
        Every original clause has a check witness. Own-build permits name every waiver and its Produce CID,
        refusals carry required axes and values without host values. Live meters await consumers.
    - id: C9
      status: n-a
      justification: Artifact identity uses the existing executable CID; no agent identity is minted.
    - id: C10
      status: answered
      justification: Contract predicates retain open axes; unknown and unobserved axes refuse.
    - id: C11
      status: n-a
      justification: No external queue, concurrency or capacity scheduler.
    - id: C12
      status: n-a
      justification: Compatibility confers no execution authority or wider reach.
    - id: C13
      status: n-a
      justification: No social authority tier is introduced by host compatibility.
    - id: C14
      status: partial
      justification: >
        Caller-supplied artifact withdrawal disables the own-build rule; F3 death classification
        and withdrawal propagation are deliberately not implemented in A3.
    contractTests:
    - path: elohim/ark/supervisor/tests/admission_contract.rs
      testName: authenticated_content_needs_a_matching_admitted_record
      kind: integration
    - path: elohim/ark/supervisor/tests/admission_contract.rs
      testName: reader_gaps_and_output_mismatch_never_admit
      kind: integration
    - path: elohim/ark/supervisor/tests/admission_contract.rs
      testName: observed_requirements_admit_for_the_named_executable
      kind: integration
    - path: elohim/ark/supervisor/tests/admission_contract.rs
      testName: unmet_isa_names_required_axis_without_host_values
      kind: integration
    - path: elohim/ark/supervisor/tests/admission_contract.rs
      testName: unknown_and_unobserved_refuse_even_own_builds
      kind: integration
    - path: elohim/ark/supervisor/tests/admission_contract.rs
      testName: absent_and_empty_native_requirements_refuse
      kind: integration
    - path: elohim/ark/supervisor/tests/admission_contract.rs
      testName: recorded_requirements_never_use_the_own_build_rule
      kind: integration
    - path: elohim/ark/supervisor/tests/admission_contract.rs
      testName: own_build_permit_names_every_waived_clause
      kind: integration
    - path: elohim/ark/supervisor/tests/admission_contract.rs
      testName: declared_proven_non_isa_sibling_and_withdrawn_refuse
      kind: integration
    - path: elohim/ark/supervisor/tests/admission_contract.rs
      testName: native_candidates_require_both_arch_and_os
      kind: integration
    - path: elohim/ark/supervisor/tests/admission_contract.rs
      testName: unprobed_features_refuse_without_an_own_build_waiver
      kind: integration
    - path: elohim/ark/supervisor/tests/admission_contract.rs
      testName: mixed_axis_waives_only_the_failed_extracted_evidence
      kind: integration
    - path: elohim/ark/supervisor/tests/admission_contract.rs
      testName: produce_for_another_executable_cannot_waive
      kind: integration
    - path: elohim/ark/supervisor/tests/admission_contract.rs
      testName: admission_wire_goldens_disclose_effect_and_produce_only
      kind: integration
