# Schema: elohim/sdk/schemas/v1/manifest/seam-registry.schema.json
seamRegistryVersion: 1
crate: elohim-ark-core
crateRoot: elohim/ark
seamLocus: Station 1 envelope declaration and REA projection at S3.3; no enforcement, anchoring or new head-selection
  policy.
decisionPoints:
- name: RuntimeManifest::validate
  kind: pure-decision-predicate
  sourceLocation:
    file: core/src/manifest.rs
    modulePath: ark_core::manifest
  summary: Refuse child memory plus headroom above the declared root and invalid shedding names.
  concernIds:
  - id: C0
    status: answered
    justification: S3.3 pure runtime declaration; manifest is A-class content-addressed bytes, with anchoring deferred.
  - id: C1
    status: n-a
    justification: Neither decision selects or crowns a head or an authority.
  - id: C2
    status: n-a
    justification: Pure reads do not move declared heads or shared state.
  - id: C3
    status: answered
    justification: A refused declaration can be revised to fit its root; no runtime state machine is added.
  - id: C4
    status: partial
    justification: Absent root memory or absent child quotas never refuse the sum; only declared allocations
      contribute to validation.
  - id: C5
    status: answered
    justification: Validation re-derives integer sums; projection carries declarations and confers no enforcement
      authority.
  - id: C6a
    status: partial
    justification: Work is finite over the supplied manifest, but no serialized-input size budget is imposed in
      core.
  - id: C6b
    status: answered
    justification: Repeated pure validation and projection perform no effects and mint no records.
  - id: C7
    status: answered
    justification: Documented declaration-only semantics preserve EffectiveTier None; no runtime quota service is
      advertised.
  - id: C8
    status: partial
    justification: Invalid names and exact sum totals are returned; no labeled counters or typed reason labels exist
      in pure core.
  - id: C9
    status: n-a
    justification: No agent keys, re-keying or identity lineage are introduced.
  - id: C10
    status: partial
    justification: Old absent-field CIDs are pinned and unknown schema is refused; existing serde unknown-field
      acceptance remains.
  - id: C11
    status: n-a
    justification: No external calls or backpressure receiver exists in these pure decisions.
  - id: C12
    status: n-a
    justification: Declaration parsing neither grants authority nor acts on a host.
  - id: C13
    status: answered
    justification: Declaration-only scaffold names future witnessed runtime enforcement; DHT anchoring remains a
      later station.
  - id: C14
    status: partial
    justification: Validation returns Invalid with exact overflowing totals or the offending process name;
      residual reasons remain strings rather than typed or witnessed records.
  contractTests:
  - path: elohim/ark/supervisor/src/native.rs
    testName: the_fingerprint_reads_this_host
    kind: unit
  - path: elohim/ark/core/src/manifest.rs
    testName: live_manifest_cid_is_unmoved_by_absent_envelope
    kind: unit
  - path: elohim/ark/core/src/manifest.rs
    testName: manifest_cid_is_unmoved_by_the_child_spec_rename
    kind: unit
  - path: elohim/ark/core/src/manifest.rs
    testName: memory_sum_plus_headroom_over_root_names_totals
    kind: unit
  - path: elohim/ark/core/src/manifest.rs
    testName: memory_sum_at_root_minus_headroom_passes
    kind: unit
  - path: elohim/ark/core/src/manifest.rs
    testName: undeclared_memory_never_refuses_the_sum
    kind: unit
  - path: elohim/ark/core/src/manifest.rs
    testName: memory_sum_cannot_wrap_past_root
    kind: unit
  - path: elohim/ark/core/src/manifest.rs
    testName: unknown_shed_order_process_is_refused
    kind: unit
  - path: elohim/ark/core/src/manifest.rs
    testName: unknown_protected_process_and_conflicting_lists_are_refused
    kind: unit
  - path: elohim/ark/core/src/manifest.rs
    testName: envelope_json_dag_cbor_round_trip_keeps_cid
    kind: unit
- name: RuntimeManifest::memory_bound
  kind: verdict-fn
  sourceLocation:
    file: core/src/rea.rs
    modulePath: ark_core::rea
  summary: Project child memory plus headroom through the inherited Sum fold, distinct from the declared root ceiling.
  concernIds:
  - id: C0
    status: answered
    justification: S3.3 pure runtime declaration; manifest is A-class content-addressed bytes, with anchoring deferred.
  - id: C1
    status: n-a
    justification: Neither decision selects or crowns a head or an authority.
  - id: C2
    status: n-a
    justification: Pure reads do not move declared heads or shared state.
  - id: C3
    status: answered
    justification: A refused declaration can be revised to fit its root; no runtime state machine is added.
  - id: C4
    status: partial
    justification: Absent root and child quotas remain absent; the requested Option projection conflates invalid
      thresholds with absence.
  - id: C5
    status: answered
    justification: Validation re-derives integer sums; projection carries declarations and confers no enforcement
      authority.
  - id: C6a
    status: partial
    justification: Work is finite over the supplied manifest, but no serialized-input size budget is imposed in
      core.
  - id: C6b
    status: answered
    justification: Repeated pure validation and projection perform no effects and mint no records.
  - id: C7
    status: answered
    justification: Documented declaration-only semantics preserve EffectiveTier None; no runtime quota service is
      advertised.
  - id: C8
    status: partial
    justification: Invalid names and exact sum totals are returned; no labeled counters or typed reason labels exist
      in pure core.
  - id: C9
    status: n-a
    justification: No agent keys, re-keying or identity lineage are introduced.
  - id: C10
    status: partial
    justification: Old absent-field CIDs are pinned and unknown schema is refused; existing serde unknown-field
      acceptance remains.
  - id: C11
    status: n-a
    justification: No external calls or backpressure receiver exists in these pure decisions.
  - id: C12
    status: n-a
    justification: Declaration parsing neither grants authority nor acts on a host.
  - id: C13
    status: answered
    justification: Declaration-only scaffold names future witnessed runtime enforcement; DHT anchoring remains a
      later station.
  - id: C14
    status: partial
    justification: Validator uses existing Invalid errors; Option projection has no witnessed residual reason for
      invalid thresholds.
  contractTests:
  - path: elohim/ark/supervisor/src/native.rs
    testName: the_fingerprint_reads_this_host
    kind: unit
  - path: elohim/ark/core/src/rea.rs
    testName: memory_bound_folds_bytes_and_agrees_with_declared_bands
    kind: unit
  - path: elohim/ark/core/src/rea.rs
    testName: memory_bound_preserves_absence_and_rejects_invalid_thresholds
    kind: unit
  - path: elohim/ark/core/src/rea.rs
    testName: memory_bound_distinguishes_folded_allocation_from_declared_root
    kind: unit
# Added 2026-10-26 (plan "native device floor", section 2): the run act carries its launch.
# Records are device-local: the act is in-memory, the manifest it produces is a Private (B)
# version on the device's own chain, and nothing here mints a DHT head or a route.
- name: RunLaunch::child
  kind: pure-decision-predicate
  sourceLocation:
    file: core/src/declaration.rs
    modulePath: ark_core::declaration::RunLaunch
  summary: A run act's args, ready line and restart become the child's argv, StdoutLine then ExecutableIdentity
    ladder and policy; an act without them declares the historical child byte for byte.
  concernIds:
  - id: C0
    status: answered
    justification: Private (B) device declaration on the offline chain; no DHT entry, head or route.
  - id: C1
    status: n-a
    justification: The act selects no head and confers no authority; only the explicit local act supersedes.
  - id: C4
    status: answered
    justification: Absent launch detail keeps the historical declaration; an empty ready line, a NUL argument
      or launch detail on a stop is refused, never ignored.
  - id: C7
    status: answered
    justification: Declaration is not enforcement; readiness and restart are supervision rules ark already
      runs, and EffectiveTier stays None.
  - id: C9
    status: answered
    justification: The manifest CID of an argument-less run act is pinned against a hand-written historical
      child, so no existing chain version moves.
  - id: C10
    status: answered
    justification: ChildSpec already carried argv, readiness and policy; the wire shape is unchanged and old
      chain versions decode as before.
  contractTests:
  - path: elohim/ark/core/tests/declaration_contract.rs
    testName: a_run_act_without_launch_detail_keeps_its_historical_manifest_cid
    kind: unit
  - path: elohim/ark/core/tests/declaration_contract.rs
    testName: run_launch_appends_args_and_declares_the_readiness_ladder_and_restart
    kind: unit
  - path: elohim/ark/core/tests/declaration_contract.rs
    testName: run_launch_refuses_what_it_cannot_honour
    kind: unit
# Added 2026-10-26 (gate-live, piece 2): a device's own task completes offline. TaskOutcome named a
# provider event string only; a local gate has no provider and must not invent an event reference.
- name: TaskOutcome::new
  kind: pure-decision-predicate
  sourceLocation:
    file: core/src/task.rs
    modulePath: ark_core::task
  summary: A run's outcome keeps a derivation record only for a clean exit whose output and key are the
    outcome's; completion is the provider's event or the device's own local completion; a hit is built
    from the accepted record with no run.
  concernIds:
  - id: C0
    status: answered
    justification: Pure value; a local completion is Private (B) to the device and mints no entry, head or route.
  - id: C1
    status: answered
    justification: The local form names the device and the time only; it claims no provider event and confers
      no authority.
  - id: C4
    status: answered
    justification: A failed run records no derivation, a record keyed elsewhere is refused, and a local
      completion says it has no event rather than carrying an empty or invented one.
  - id: C10
    status: answered
    justification: TaskOutcome had no serialized form before; the provider completion keeps one wire shape,
      pinned, and an unknown field is refused on decode.
  contractTests:
  - path: elohim/ark/core/tests/task_contract.rs
    testName: a_failed_run_records_no_derivation
    kind: unit
  - path: elohim/ark/core/tests/task_contract.rs
    testName: a_local_run_completes_without_a_provider_event
    kind: unit
  - path: elohim/ark/core/tests/task_contract.rs
    testName: completion_forms_have_one_wire_shape_each
    kind: unit
  - path: elohim/ark/core/tests/task_contract.rs
    testName: a_gate_runs_in_its_own_envelope_and_nowhere_else
    kind: unit
# Added 2026-10-26 (gate-live, pieces 3 and 5): the first DerivationIndex, and the verb that runs a
# device's own gate as a Task. brit's attestation stays the one verdict store; nothing here writes it.
- name: brit_index::reusable
  kind: pure-decision-predicate
  sourceLocation:
    file: cli/src/brit_index.rs
    modulePath: ark::brit_index
  summary: Admits a brit build attestation as a derivation record only under gate-evidence.mjs reusableHit's
    rules, in its order and words; an attested commit with another tree is refused rather than judged.
  concernIds:
  - id: C0
    status: answered
    justification: Reads brit's existing notes refs on this device; no entry type, head, route or second store.
  - id: C1
    status: answered
    justification: Only this workspace's own green signature is admitted; another signer is refused by name.
  - id: C4
    status: answered
    justification: Every refusal names its reason; an unreadable brit is IndexUnreachable with come-back and
      run-here, and the gate runs.
  - id: C5
    status: answered
    justification: Stricter than reusableHit where ark cannot consult rakia (changed tree refused), never looser.
  contractTests:
  - path: elohim/ark/cli/src/brit_index.rs
    testName: reuse_follows_reusable_hit_rule_for_rule
    kind: unit
  - path: elohim/ark/cli/src/brit_index.rs
    testName: an_attested_commit_with_another_tree_is_never_reused
    kind: unit
  - path: elohim/ark/cli/tests/cli_smoke.rs
    testName: task_run_reuses_an_admitted_attestation_and_runs_nothing
    kind: integration
- name: task::run
  kind: verdict-fn
  sourceLocation:
    file: cli/src/task.rs
    modulePath: ark::task
  summary: A device's own task is placed through decide_private and the floor against its own offer, answered
    from an admitted derivation with no run, or run under the native driver; the status channel is queued,
    then answered, or unanswered with three parts on interrupt.
  concernIds:
  - id: C0
    status: answered
    justification: Device-local Private (B) run; status lines live under .eprfs/status and are never published.
  - id: C3
    status: answered
    justification: Every run ends answered or unanswered with a named come-back; an interrupt never reads as
      passed.
  - id: C4
    status: answered
    justification: A task that is not the device's own is refused before anything is written; the floor's own
      refusal is carried as not-carried with its come-back and meanwhile.
  - id: C7
    status: answered
    justification: The berth's disk bound is a declaration read from statvfs; EffectiveTier stays None.
  contractTests:
  - path: elohim/ark/cli/tests/cli_smoke.rs
    testName: task_run_passes_the_child_through_and_answers_its_exit
    kind: integration
  - path: elohim/ark/cli/tests/cli_smoke.rs
    testName: task_run_interrupted_is_unanswered_with_three_parts
    kind: integration
  - path: elohim/ark/cli/tests/cli_smoke.rs
    testName: task_run_refuses_a_task_that_is_not_the_devices_own
    kind: integration
