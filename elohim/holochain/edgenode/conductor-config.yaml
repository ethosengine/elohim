
# Holochain Conductor Configuration for Elohim Protocol
#
# This configuration is optimized for web-first development:
# - Admin interface on port 4444 (restricted origins)
# - Uses your existing bootstrap server: holostrap.elohim.host
# - Iroh-only networking with an operator-specific relay

# Admin interface for conductor management
admin_interfaces:
  - driver:
      type: websocket
      port: 4444
      # Restrict to Elohim domains only
      allowed_origins:
        - "https://elohim.host"
        - "https://alpha.elohim.host"
        - "https://staging.elohim.host"
        - "https://doorway.elohim.host"
        - "https://doorway-alpha.elohim.host"
        - "http://localhost:4200"
        - "http://localhost:8080"

# Network configuration
network:
  # Bootstrap served by Doorway gateway
  bootstrap_url: "https://doorway.elohim.host/bootstrap"
  # Per-doorway iroh relay; never fall back to a public default.
  relay_url: "https://relay.elohim.host"
  # Slow-WAN peer resilience (2026-07-20): a production node on a slow link
  # was timing out kitsune2 gossip rounds at the 15s default and
  # thrash-retrying, while up to 10 concurrently accepted rounds piled up
  # write pressure on the conductor's SQLite write guard (PTxnGuard held
  # 500-1500ms at ~45/min, a ~50% write-guard duty cycle). Let slow rounds
  # run to completion instead of retrying, and bound concurrent accepted
  # rounds so gossip write pressure stays sane. Do not "clean up" these away
  # from their upstream defaults without re-checking WAN conditions on the
  # affected nodes. Leave initiate intervals at defaults — only round
  # completion and accepted-round concurrency need tuning here.
  advanced:
    k2Gossip:
      roundTimeoutMs: 60000
      maxConcurrentAcceptedRounds: 4

# Data storage
data_root_path: "/var/local/lib/holochain"

# Keystore (Lair) - manages agent keys
keystore:
  type: lair_server_in_proc
  lair_root: "/var/local/lib/holochain/ks"
