[workspace]
members = [
    "zomes/content_store_integrity",
    "zomes/content_store",
]
resolver = "2"

[workspace.dependencies]
hdi = "=0.8.0"
hdk = "=0.7.0"
holochain_serialized_bytes = "=0.0.57"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
doorway-client = { path = "../../../../crates/doorway-client" }
hc-rna = { path = "../../rna/rust" }
# The one addressing kernel (re-genesis 1): byte CIDs are admitted by full decode
# (`ByteCid::parse`) and minted by `compute_bytes_cid`; no hand-written validator.
elohim-address = { path = "../../../../crates/elohim-address", default-features = false }
