    kind: pure-decision-predicate
    sourceLocation:
      file: src/lib.rs
      modulePath: content_store::batch_deadline_admission
      line: 3699
    summary: >
      T1's admission gate (Head-Plane Trust-Gradient Program L1) for the batched head-plane
      reads: decides whether the id at `next_index` may be STARTED, via a hard ceiling clamp
      (`BATCH_ID_CEILING`) evaluated before a resolved/clamped budget deadline
      (`BATCH_BUDGET_DEFAULT_MS`/`BATCH_BUDGET_CEILING_MS`). Unchanged by the T1b contract
      revision (constants, signature, and body are byte-identical to T1 except for the
      operator's 2026-08-08 backward-wall-clock-step hardening test, which is additive
      coverage, not a behaviour change) — registered NOW because it was never added to this
      file when T1 landed (registration owed).
    concernIds:
      - id: C6a
        status: answered
        justification: >
          A hard ceiling (`BATCH_ID_CEILING`) AND a resolved/clamped budget deadline together
          bound both the NUMBER of ids a single call will ever attempt and the WALL-CLOCK time
          it will spend doing so, independent of caller input (a caller cannot buy more of
          either by asking) — `batch_deadline_admission_tests`' 8 cases (ceiling clamp exactly
          at and past the boundary, small-id-count self-clamping, default-budget fill,
          caller-budget-within/above the ceiling, zero-budget probe-only, and the 2026-08-08
          backward-wall-clock-step hardening) pin every corner of this bound.
      - id: C10
        status: n-a
        justification: >
          `schema_version` is a field on `BatchResolveHeadsOutput`/`BatchResolveElectionsOutput`
          (the OUTPUT type) — a boolean admission predicate has no output shape to version. This
          concern is answered at the output-type level instead
          (`batch_output_wire_contract_tests::schema_version_round_trips_as_the_discriminator`
          plus the old/new decode-failure pins), not by this row; recorded `n-a` rather than
          silently omitted so the matrix does not read this predicate as an unexplained gap on
          C10.
      - id: C11
        status: partial
        justification: >
          Supplies the TIME/CEILING dimension of backpressure-avoidance (a caller cannot buy
          unbounded wall-clock time or unbounded id count from a single call) but has NO notion
          of a SHARED FAILURE mid-batch at all — its return value is a plain bool, not a typed
          stop reason. The STOP-with-tail-preserved-as-`unattempted` decision for a shared
          failure, and the `BudgetExhausted`/`IdCeiling`/`SharedFailure(reason)` distinction a
          caller reads from `stop_reason`, are `run_admitted_batch`'s (it consumes this
          predicate's bool as one input among several) — see the cross-reference in this row's
          `notes` and the sibling `batch_failure_disposition` row.
