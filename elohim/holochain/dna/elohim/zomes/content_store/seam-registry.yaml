# elohim/holochain/dna/elohim/zomes/content_store/seam-registry.yaml
#
# Conforms to elohim/sdk/schemas/v1/manifest/seam-registry.schema.json. Coordinator-zome side of
# the cross-root canonical-head election this shift cured; the storage-side CONSUMER of this
# election's ordering is registered separately in elohim/elohim-storage/seam-registry.yaml
# (canonical_move_verdict).
#
# Every symbol below was grepped and read at authoring time (2026-08-02). Where no direct test
# exists, contractTests is explicit `null` with a gapNote — several rows here are genuinely
# untested today, and recording that honestly is the point of this registry (P3.2's census is
# built specifically to surface exactly these gaps, not to be told they don't exist).

seamRegistryVersion: 1
crate: content_store
crateRoot: elohim/holochain/dna/elohim/zomes/content_store
seamLocus: >
  Cross-root canonical-head election and declare-time authority/evidence gates in the
  content_store coordinator zome: the DHT-side arbiter (select_canonical_winner /
  select_election), the declare-time no-chain / target-id / carried-record gates
  (declare_canonical_head_inner, shared by both the staging and earned declare tiers), the
  election-ahead-of-bytes read path (resolve_canonical_election), the last-mile carried-record
  verifier for a conductor that holds the election but not the target bytes
  (validate_carried_head_record), and the god-mode declare-authority scaffold
  (authorize_canonical_head_declarer).

decisionPoints:
  - name: select_canonical_winner
    kind: pure-decision-predicate
    sourceLocation:
      file: src/lib.rs
      modulePath: content_store::select_canonical_winner
      line: 2945
    summary: >
      HDK ADAPTER (P5b, 2026-08-02) over `seam_contracts::election::select_arbitrated_winner`:
      maps each canonical-head declaration LINK onto an `ArbitrationKey` — provenance tag =>
      tier, DHT link timestamp => clock, create-link action hash => tiebreak — and returns the
      winner the shared ordering elects. The ordering rules are unchanged and now live in the
      contract crate: ANY earned declaration beats ALL staging; within the winning tier, newest
      link timestamp wins; ties break deterministically on the create-link action hash.
    concernIds:
      - id: C1
        status: answered
        justification: >
          Arbitrates on notarized DHT link evidence (tier + link timestamp + link hash) only —
          no branch consults which agent authored a candidate, so no declaring authority can
          win by virtue of being the resolving conductor's own. The extraction did not weaken
          this and is where it is now ENFORCED: the shared predicate has no author/identity
          component to consult at all (its row carries C1 as `partial` for exactly that reason
          — the absence of a channel there, the guarantee here, since THIS adapter is what
          builds the key).
      - id: C2
        status: answered
        justification: >
          This IS the plan's own canonical example of C2's guarantee form ("select_canonical_
          winner's newest-within-tier on the DHT link timestamp, tie-broken on create_link_hash
          — never a conductor-local clock, never arrival order"). equal_timestamps_break_
          deterministically_on_link_hash proves order-independence directly (reversed input
          order still yields the identical winner). Since P5b the guarantee is additionally
          STRUCTURAL rather than only tested: `ArbitrationKey`'s three fields are all required,
          so the pre-`25921a07a` shape (a stable sort on the clock alone) is no longer
          expressible at this call site — and the shared predicate runs under the `Arbitrated`
          property harness over all 24 orderings of a `(tier, clock)`-tied fixture, a
          permutation walk the zome suite could not perform from inside WASM.
    contractTests:
      - path: elohim/holochain/dna/elohim/zomes/content_store/src/lib.rs
        testName: earned_wins_over_newer_staging
        kind: unit
      - path: elohim/holochain/dna/elohim/zomes/content_store/src/lib.rs
        testName: newest_earned_wins_within_tier
        kind: unit
      - path: elohim/holochain/dna/elohim/zomes/content_store/src/lib.rs
        testName: newest_staging_wins_when_no_earned
        kind: unit
      - path: elohim/holochain/dna/elohim/zomes/content_store/src/lib.rs
        testName: equal_timestamps_break_deterministically_on_link_hash
        kind: unit
        mirrorRisk: false
      - path: elohim/holochain/dna/elohim/zomes/content_store/src/lib.rs
        testName: superseding_earned_is_the_sole_winner
        kind: unit
      - path: elohim/holochain/dna/elohim/zomes/content_store/src/lib.rs
        testName: empty_set_has_no_winner
        kind: unit
      - path: elohim/holochain/dna/elohim/zomes/content_store/src/lib.rs
        testName: winner_reports_its_own_clock_and_tier_not_a_losers
        kind: unit
      - path: elohim/holochain/dna/elohim/zomes/content_store/src/lib.rs
        testName: staging_winner_reports_staging_tier
        kind: unit
      - path: elohim/holochain/dna/elohim/zomes/content_store/src/lib.rs
        testName: tied_winners_propagate_an_identical_clock_in_any_input_order
        kind: unit
        mirrorRisk: false
      # The extracted predicate's own proofs (crates/seam-contracts/seam-registry.yaml holds the
      # full row). Cited HERE too because after P5b this adapter's behaviour is decided there:
      # a test that passes only in the zome would no longer be evidence about the ordering.
      - path: crates/seam-contracts/src/election.rs
        testName: real_predicate_is_arbitration_conformant
        kind: unit
        mirrorRisk: false
      - path: crates/seam-contracts/src/election.rs
        testName: tier_precedence_dominates_a_newer_clock
        kind: unit
      - path: crates/seam-contracts/src/election.rs
        testName: equal_timestamps_break_deterministically_on_link_hash
        kind: unit
        mirrorRisk: false
      - path: crates/seam-contracts/src/election.rs
        testName: tied_winners_propagate_an_identical_clock_in_any_input_order
        kind: unit
        mirrorRisk: false
    notes: >
      ADAPTER RELATIONSHIP (P5b, 2026-08-02 — the P3.3 pull-forward). The ordering was extracted
      to `seam_contracts::election::select_arbitrated_winner`
      (crates/seam-contracts/seam-registry.yaml, row `select_arbitrated_winner`); this row is the
      HDK side and keeps its own nine unit tests unchanged, because the mapping it performs —
      `Link` provenance tag / DHT link timestamp / create-link hash onto the key's three fields —
      is real behaviour that only a zome-side test can pin. The crate holds a field-for-field port
      of those nine (same names, same fixture seeds); both suites are green, from opposite sides
      of the extraction, which is the behavioural-identity evidence.

      COORDINATOR-ONLY, HASH-NEUTRAL. The diff touches
      `zomes/content_store/{Cargo.toml,src/lib.rs}` and the workspace `Cargo.lock` — no integrity
      zome file, so the DNA hash (integrity zomes + modifiers) does not move and the change heals
      onto running conductors via `happ_manager::sync_coordinators`' `update_coordinators`
      hot-swap, not a reinstall/re-key. The contract crate is a leaf (zero first-party deps,
      std-only default, `default-features = false` at this dep site), so it adds exactly one
      package to the lock and nothing to the integrity zomes' dependency graph — its own
      `no_heavy_deps_in_dep_tree` boundary test keeps `hdi`/`hdk` out, which is the invariant that
      makes this direction of dependency (zome -> contract crate) safe at all.

  - name: declare_canonical_head_inner
    kind: verdict-fn
    sourceLocation:
      file: src/lib.rs
      modulePath: content_store::declare_canonical_head_inner
      line: 3599
    summary: >
      Shared body for both canonical-head declare tiers (staging + earned): the NO-CHAIN GATE
      (gather_content_chain(id).is_some() — refuses "no content found for id" for a conductor
      with zero local chain), target resolution with declare-carries-Record fallback, and the
      TARGET-ID GATE (the resolved target's own Content.id must equal the declared id).
    concernIds:
      - id: C1
        status: partial
        justification: >
          The FIRST, target-independent check ("declare_canonical_head: no content found for id")
          is the anti-self-election floor beneath both declare tiers — a genuinely chain-less
          conductor cannot declare at all, not even a peer's head. It is real and load-bearing
          in the source, but no sweettest constructs a conductor that holds ZERO local chain for
          the id and asserts on this exact error; see gapNote.
      - id: C5
        status: answered
        justification: >
          TARGET-ID GATE (content.id != id refusal) is directly exercised by
          declare_canonical_rejects_target_id_mismatch; the carried-record branch's
          entry-action-binding and signature proofs (delegated to validate_carried_record) are
          exercised by declare_carries_record_for_unretrievable_target's four negative cases
          (mismatched action, swapped entry, tampered bytes) plus one positive case.
    contractTests:
      - path: elohim/holochain/tests/sweettest/src/tests/lamad.rs
        testName: declare_canonical_head_converges_independent_roots
        kind: sweettest
      - path: elohim/holochain/tests/sweettest/src/tests/lamad.rs
        testName: declare_canonical_rejects_target_id_mismatch
        kind: sweettest
      - path: elohim/holochain/tests/sweettest/src/tests/lamad.rs
        testName: declare_carries_record_for_unretrievable_target
        kind: sweettest
      - path: elohim/holochain/tests/sweettest/src/tests/lamad.rs
        testName: earned_head_guard_and_scaffold_over_scaffold
        kind: sweettest
    gapNote: >
      contractTests is non-null (the function overall IS tested), but the C1 no-chain gate
      specifically is not: declare_canonical_head_converges_independent_roots and
      declare_carries_record_for_unretrievable_target both give the declaring/non-holding
      conductor SOME local root for the id before it declares — the latter test's own doc
      comment says so explicitly ("c2 authors its own independent root for the same id, so c2
      passes the id-exists gate locally — that gate is not what this test is about"). No test
      in this repo (grep-verified 2026-08-02 for "no content found for id" and "no_local_chain")
      exercises a conductor with LITERALLY zero chain for the id attempting to declare.

  - name: resolve_canonical_election
    kind: boundary-answer-type
    sourceLocation:
      file: src/lib.rs
      modulePath: content_store::resolve_canonical_election
      line: 3933
    summary: >
      Reports the DHT election ALONE (link ops only, GetStrategy::Local) without requiring the
      winner's target Content to be retrievable — lets a caller fetch bytes from a peer and
      verify them via validate_carried_head_record instead of waiting on arbitrarily-delayed
      gossip. Option<CanonicalElectionOutput>; None is documented as "no election in my local
      view YET," never authoritative absence.
    concernIds:
      - id: C4
        status: answered
        justification: >
          The doc comment is explicit and matches this plan's C4 guarantee form verbatim: "None
          here means 'no election in my local view YET', never authoritative absence" — same
          honest-absence contract as resolve_content_head_local, GetStrategy::Local chosen
          specifically so this read never awaits the network.
      - id: C6a
        status: answered
        justification: >
          BOUNDED WORK, no network await on the sweep path. One link-set gather on the
          `canonical_head` StringAnchor for ONE id: no target retrieval, no chain walk, no
          update-lineage recursion, and — because select_election is called here with
          GetStrategy::Local — no network fetch at all. holochain_cascade's dht_get_links gates
          its fetch_links call behind `if let GetStrategy::Network`, so the Local gather
          provably never leaves the conductor and cannot reach the 60s p2p request_timeout_s.
          That is the floor: the only cost this extern still imposes is its CALL RATE against a
          shared conductor, which it cannot bound from the inside.
    contractTests: null
    gapNote: >
      No unit test or sweettest calls resolve_canonical_election directly (grep-verified
      2026-08-02: zero references outside its own definition and doc comments). Its underlying
      logic (select_election) is exercised only as a private helper inside select_canonical_
      winner's unit tests, which never go through this extern's own Option<T> boundary.

      NOT UNIT-PINNABLE (2026-08-03): the Local-strategy regression pin was scoped for this row
      and could NOT be honestly written. select_election's strategy is only observable through
      the get_links HOST function, which does not exist outside a wasm/conductor host, and this
      suite has no source-shape/include_str! test pattern to borrow (grep-verified: zero
      matches). A sweettest asserting that a conductor holding the canonical-head links but NOT
      the winner's target still answers Some(...) is the only real home; it remains open and is
      the same gap this note already records.

      FORCING INCIDENT (2026-08-03) — backlog/resolve-canonical-election-get-links-deadline.md,
      forecast fp 836a69cc043c. 34 ribosome errors `Host("deadline has elapsed")` at
      host_fn/get_links.rs:76, fn_name=resolve_canonical_election, on the conductor-missing-side
      pods. Filed as a B2 recurrence (a network-strategy gather uncured at the election-READ
      site). CODE-DISPROVEN: this extern has passed GetStrategy::Local since the commit that
      introduced it (da8975176), select_election performs exactly one get_links and no get, and
      Local provably cannot reach the network (cascade gate above). The residual producer of
      that exact string is DatabaseError::Timeout(tokio::time::error::Elapsed) — Display "deadline
      has elapsed" — from acquire_semaphore_permit's 10s ACQUIRE_TIMEOUT_MS on a LONG-READ
      permit; cascading() holds one permit from EACH of the cache/DHT/authored pools across the
      blocking query and each pool carries only num_read_threads() = max(num_cpus/2, 4). The
      error therefore reports a SATURATED CONDUCTOR READ POOL (backpressure to retry/pace), not
      a GetStrategy defect and not a missing coordinator zome. No coordinator-zome change can
      cure it; select_election now names the class in its error text so the ops signal stops
      mis-reading.

  - name: validate_carried_head_record
    kind: verdict-fn
    sourceLocation:
      file: src/lib.rs
      modulePath: content_store::validate_carried_head_record
      line: 3923
    summary: >
      Last-mile election-obey verifier for a conductor that holds the DHT election but not the
      winner's target bytes: cryptographically validates a CARRIED record against an expected
      action hash (action-hash binding, author signature, entry-action binding) plus a
      restated TARGET-ID GATE, WITHOUT requiring a local chain for the id (deliberately, since
      that is exactly the class this extern exists to serve). Writes nothing — pure verifier.
    concernIds:
      - id: C5
        status: partial
        justification: >
          Runs the SAME validate_carried_record proofs the declare path runs (action-hash
          binding, signature, entry<->action binding — the swap-attack-closing clause), which
          ARE exercised by declare_carries_record_for_unretrievable_target's negative cases —
          but that test calls declare_canonical_content_head, never this extern. This extern's
          own doc comment states its TARGET-ID GATE is DELIBERATELY DUPLICATED here ("this path
          does not go through that function"), and that duplicated restatement, plus this
          extern's own Option<None>-for-honest-absence return, is untested directly.
    contractTests: null
    gapNote: >
      No test calls validate_carried_head_record directly (grep-verified 2026-08-02: zero
      references outside its own definition). The shared validate_carried_record helper it
      delegates to IS exercised, but only through the sibling declare_canonical_content_head
      path — citing that test here would be exactly the anti-mirror/false-coverage hazard P3.2's
      census is designed to catch (a passing test on a shared helper is not proof this extern's
      own boundary and restated gate are correct).

  - name: authorize_canonical_head_declarer
    kind: verdict-fn
    sourceLocation:
      file: src/lib.rs
      modulePath: content_store::authorize_canonical_head_declarer
      line: 3237
    summary: >
      Gates WHO may call declare_canonical_content_head (the staging/scaffold tier). Currently
      unconditional Ok(()) — a labeled DEV-TIME SCAFFOLD, "god-mode open," with a named but
      unbuilt successor (steward allowlist, then reach-cohort edit-membership + signature).
    concernIds:
      - id: C13
        status: unbound
        justification: >
          Doc-labeled scaffold with a named successor criterion — exactly C13's required shape
          in principle — but the label and successor live ONLY in the doc comment, not at a
          structured gate a matrix or birth-rule could check, and no successor has landed. This
          is the precise gap the canon calls out about itself: "Both labels live in docs/backlog
          rather than at the gate sites; this class requires the label and successor at the
          gate." Until C13 gains a structured representation this function can be checked
          against, this row is honestly unbound rather than answered.
    contractTests: null
    gapNote: >
      No test exists for authorize_canonical_head_declarer itself (grep-verified 2026-08-02: no
      #[test]/sweettest references the function name). It unconditionally returns Ok(()), so its
      "authorization" is implicitly exercised only in the sense that every declare sweettest
      succeeds because the gate never refuses — that is not a test of the gate's logic, since it
      currently has none to test.

  - name: classify_chain_gate
    kind: pure-decision-predicate
    sourceLocation:
      file: src/lib.rs
      modulePath: content_store::classify_chain_gate
      line: 3836
    summary: >
      ADOPT-BEFORE-AUTHOR (2026-08-03, operator-reserved, DEFAULT OFF). The declare path's
      target-independent chain gate, extracted as a pure total function of
      (chain_present, adopt_before_author, carried_record_present) -> ChainGate::{LocalChain,
      AdoptOnCarriedEvidence, Refuse}. It is the ONE decision the new
      DeclareCanonicalHeadInput.adopt_before_author field can move, and it moves exactly one of
      its eight corners: no local chain + caller opted in + a carried record present routes to
      AdoptOnCarriedEvidence, where declare_canonical_head_inner runs validate_carried_record
      UNCONDITIONALLY (never local-get-first) and the shared TARGET-ID GATE still applies. Every
      other corner reproduces the pre-flag verdict byte-for-byte, including the verbatim
      "no content found for id" refusal the storage caller classifies on. Exists because that
      gate asks about the DECLARER, not the target — so when BOTH sides of a divergent pair lack
      a chain, neither can mint a candidate and the DHT arbiter never runs (the
      both-sides-missing residual, RCA v3).
    concernIds:
      - id: C1
        status: answered
        justification: >
          Extends the GUARDED LEGITIMATE ARM rather than widening self-election. C1's canon
          admits self-candidacy "exactly when `not_retrievable` itself proves a local chain
          exists" — evidence, not self-preference. This gate is the same shape one class over:
          the bypass opens only when re-derived cryptographic evidence for the DECLARED TARGET
          is in hand, and the declaration it permits is a candidate LINK for
          select_canonical_winner (which has no author/identity component to consult), never a
          crowning. the_bypass_opens_at_exactly_one_corner enumerates the whole 2^3 space and
          pins that opt-in alone (opt_in_without_evidence_still_refuses) and evidence alone
          (evidence_without_opt_in_still_refuses) both still refuse; the earned-head guard,
          authorize_canonical_head_declarer and am_i_bootstrap_steward are all upstream of this
          function and untouched.
      - id: C5
        status: answered
        justification: >
          This is C5's guarantee made structural at a new site. On the AdoptOnCarriedEvidence
          branch declare_canonical_head_inner does NOT fall back to a local `get` — it calls
          validate_carried_record unconditionally, so the declaration's entire license is what
          the receiver re-derives: action-hash equality with the declared target, the author's
          signature over the action, and the entry<->action binding (the swap-attack clause C5
          names explicitly), followed by the shared TARGET-ID GATE requiring the carried
          Content's own id to equal the declared id. Forcing the carried branch is deliberate:
          a conductor just shown to hold no chain for the id must not be able to declare from a
          local view instead of from evidence. Every clause is exercised WITH THE FLAG ON in
          adopt_before_author_declares_without_a_local_chain, whose (g) case is the sharpest —
          a fully genuine, correctly-signed record for a DIFFERENT content id, where checks 1-3
          all pass and only the target-id gate refuses.
      - id: C3
        status: partial
        justification: >
          This gate IS the both-sides-missing residual's automated exit — the transition the
          liveness harness could not find — but it ships DORMANT (default false at both homes:
          the zome field's #[serde(default)] and config::adopt_before_author_enabled()). On a
          default fleet the only exit remains an operator flip, which C3 explicitly refuses to
          count ("a human hand (or a deploy) as the only exit is a liveness hole"). Recorded
          partial rather than answered for exactly that reason, and the honesty is mechanised:
          elohim-storage's both_sides_conductor_missing_is_a_known_open_residual now runs TWO
          legs over the same state table — flag OFF still reports manual_only_exit, flag ON
          finds the automated transition. It graduates to answered if and when the default
          changes.
      - id: C6b
        status: partial
        justification: >
          The gate itself is stateless and total, so classification is idempotent by
          construction (the_gate_is_stateless_so_a_replay_classifies_identically). The EFFECT
          downstream is idempotent in OUTCOME but not in writes: a replayed declaration writes a
          second canonical-head link naming the same target, and select_canonical_winner then
          elects the identical winner (pinned by the sweettest's (j) case, which reads
          resolve_canonical_election before and after a replay). Deduplication of the write is
          deliberately the CALLER's job and lives in storage — the (id, target) candidacy ledger
          plus the declare-storm gate — not in wasm, because the zome cannot know whether a
          repeat call is a retry or a genuinely new nomination.
    contractTests:
      - path: elohim/holochain/dna/elohim/zomes/content_store/src/lib.rs
        testName: flag_off_is_behaviour_identical_to_the_pre_flag_gate
        kind: unit
      - path: elohim/holochain/dna/elohim/zomes/content_store/src/lib.rs
        testName: the_bypass_opens_at_exactly_one_corner
        kind: unit
      - path: elohim/holochain/dna/elohim/zomes/content_store/src/lib.rs
        testName: opt_in_without_evidence_still_refuses
        kind: unit
      - path: elohim/holochain/dna/elohim/zomes/content_store/src/lib.rs
        testName: evidence_without_opt_in_still_refuses
        kind: unit
      - path: elohim/holochain/dna/elohim/zomes/content_store/src/lib.rs
        testName: a_local_chain_always_wins_regardless_of_the_flag
        kind: unit
      - path: elohim/holochain/dna/elohim/zomes/content_store/src/lib.rs
        testName: the_gate_is_stateless_so_a_replay_classifies_identically
        kind: unit
      - path: elohim/holochain/tests/sweettest/src/tests/lamad.rs
        testName: adopt_before_author_declares_without_a_local_chain
        kind: sweettest
        mirrorRisk: false
    gapNote: >
      The unit tests pin the GATE; they cannot pin the CLAUSES the gate's open corner depends
      on (hash_action, verify_signature, hash_entry are HDK host functions with no existence
      outside a wasm/conductor host, and this suite has no source-shape/include_str! pattern to
      borrow). That is why the sweettest is cited alongside them and is the load-bearing test
      here: it is the only place the action-hash, signature, entry<->action and target-id
      clauses are exercised WITH adopt_before_author=true. This also partly closes
      validate_carried_head_record's sibling gapNote about the shared helper being reachable
      only through one declare shape — it is now exercised through two.
