[package]
name = "node_registry_coordinator"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Forwards to the integrity crate — coordinator externs that touch the gated
# NotarizationWitness/EntryToWitness types are gated the same way here.
lineage-witness = ["node_registry_integrity/lineage-witness"]

[dependencies]
hdk = "=0.7.0"
serde = "1"
serde_json = "1"
holochain_serialized_bytes = "=0.0.57"
node_registry_integrity = { path = "../node_registry_integrity" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
overflow-checks = true
