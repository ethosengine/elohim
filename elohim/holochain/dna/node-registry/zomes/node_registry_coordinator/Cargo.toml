[package]
name = "node_registry_coordinator"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Forwards to the integrity crate — coordinator externs that touch the gated
# NotarizationWitness/EntryToWitness types are gated the same way here.
lineage-witness = ["node_registry_integrity/lineage-witness"]

# TEST-ONLY externs, on top of `lineage-witness`. Off by default and NOT passed
# by `just build-witness`, so the deployable successor bundle does not carry
# them. `carry_page_for_test` is the one member: it accepts a hand-built
# `ExportPage`, which is exactly the injection point the G10 refusal has to be
# proven against and exactly what must not be reachable on a running conductor.
# `just build-witness-test` passes both features; the resulting DNA hash is
# IDENTICAL to the deployable one, because the difference is coordinator-only.
lineage-test = []

[dependencies]
hdk = "=0.7.0"
serde = "1"
serde_json = "1"
holochain_serialized_bytes = "=0.0.57"
node_registry_integrity = { path = "../node_registry_integrity" }
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
overflow-checks = true
