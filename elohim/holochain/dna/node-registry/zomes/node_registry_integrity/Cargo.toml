[package]
name = "node_registry_integrity"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Off by default: default build packs BYTE-IDENTICAL to pristine node-registry
# (no DNA-hash move). Landing the witness on the fleet happens through the
# Holochain Evolution Epic's own ceremony, not a CI roll.
lineage-witness = []

[dependencies]
hdi = "=0.8.0"
serde = "1"
holochain_serialized_bytes = "=0.0.57"
# The one byte-CID kernel (re-genesis 1, plan §2.5.1): content_cid fields are
# validated by its full decode, never by a hand-written prefix/length predicate.
elohim-address = { path = "../../../../../../crates/elohim-address", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
overflow-checks = true
