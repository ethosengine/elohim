# Mishpat DNA - Formal Governance & Justice
#
# Manifest hygiene (Wave 1 / §7):
# - manifest_version "1": Holochain 0.6 schema.
# - network_seed "elohim_mishpat_alpha": stability contract. _alpha suffix means
#   "we WILL reset this network on breaking changes; do not treat as production."
# - lineage []: this hash is the genesis ancestor.
# - clone_limit is per-role in happ.yaml (default-deny 0).
#
# Bootstrap-steward: mishpat uses the bootstrap-steward pattern (governance
# needs an accountable founding steward). See happ.yaml modifiers.properties.
---
manifest_version: "1"
name: mishpat
integrity:
  network_seed: "elohim_mishpat_alpha"
  properties: ~
  zomes:
    - name: mishpat_integrity
      path: "target/wasm32-unknown-unknown/release/mishpat_integrity.wasm"

coordinator:
  zomes:
    - name: mishpat
      path: "target/wasm32-unknown-unknown/release/mishpat.wasm"
      dependencies:
        - name: mishpat_integrity

lineage: []
