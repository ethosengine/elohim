# Imago Dei DNA - Identity, Relationships & Attestations
#
# Manifest hygiene (Wave 1 / §7):
# - manifest_version "0": Holochain 0.6 schema.
# - network_seed "elohim_imagodei_alpha": stability contract. _alpha suffix means
#   "we WILL reset this network on breaking changes; do not treat as production."
# - lineage []: this hash is the genesis ancestor. Add previous hashes here on
#   breaking integrity changes per forward-compat policy.
# - clone_limit is per-role in happ.yaml (default-deny 0).
#
# Bootstrap-steward: imagodei IS the reference implementation for the
# bootstrap-steward coordinator pattern. The founding steward's pubkey is carried
# via happ.yaml modifiers.properties.progenitor_pubkey (Holochain's primitive
# name — in our surface we call this "bootstrap steward"). Authority is
# graduated to later-joining stewards per project_stewardship_philosophy.md.
---
manifest_version: "0"
name: imagodei
integrity:
  network_seed: "elohim_imagodei_alpha"
  properties: ~
  zomes:
    - name: imagodei_integrity
      path: "target/wasm32-unknown-unknown/release/imagodei_integrity.wasm"

coordinator:
  zomes:
    - name: imagodei
      path: "target/wasm32-unknown-unknown/release/imagodei.wasm"
      dependencies:
        - name: imagodei_integrity

lineage: []
