[dependencies]
# Holochain runtime — sweettest embeds a real conductor in-process.
# Versions are pinned to match the DNAs (HDK 0.7.0 / HDI 0.8.0).
#
# `datachannel-vendored` is GONE at 0.7.0: tx5 no longer exists, iroh is the
# only transport and needs no feature. The feature set below mirrors the
# conductor's production set (`encryption,wasmer-sys-cranelift`) plus the two
# test-only features, and additionally keeps `schema` — sweettest packs and
# installs DNAs in-process, which the production conductor build does not do.
#
# SECURITY — why `default-features = false`:
# holochain's default set includes `metrics_influxive`, which is NOT required
# by `sweettest`/`test_utils`. It pulls `holochain_metrics/influxive` →
# `influxive 0.0.5` → { `influxdb 0.7.2` → `reqwest 0.11.27` → `rustls 0.21.12`
# → `rustls-webpki 0.101.7`, `influxive-downloader` → `tar` }. That
# `rustls-webpki 0.101.7` copy is affected by RUSTSEC-2026-0098 / -0099 / -0104
# (all fixed only on the 0.103 line — the 0.101 line has no fix), so the
# vulnerable copy cannot be upgraded away — only removed. Dropping the feature
# removes both chains outright. The test harness never reads InfluxDB metrics.
# Keep this set in sync with the conductor's if the holochain pin ever moves.
holochain = { version = "=0.7.0", default-features = false, features = [
  "sweettest",
  "test_utils",
  "encryption",
  "schema",
  "wasmer-sys-cranelift",
] }
holochain_types = "=0.7.0"
hdk = "=0.7.0"
hdi = "=0.8.0"
holo_hash = "=0.7.0"
holochain_serialized_bytes = "=0.0.57"

# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
futures = "0.3"

# Serde for test fixtures
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Test helpers
anyhow = "1"

# Ed25519 verification — used by imagodei_sign_for_agent to verify signatures
# the conductor returns. Already in the dep tree transitively via holochain;
# pinned here so it's an explicit test dependency. Default features include
# the `std` feature needed for `Verifier::verify`.
ed25519-dalek = "2"

# Shared wire types for coordinator I/O — same holo_hash pin (=0.6.0) as the DNA workspace.
qahal-types = { path = "../../../sdk/domains/qahal/types" }

# base64-encode/decode lineage-arm signatures for the mishpat Task 2 tests —
# same pin as the mishpat/imagodei zomes.
base64 = { version = "0.22", default-features = false, features = ["alloc"] }

[dev-dependencies]
# Every integration test shares these — kept in dev-deps so `cargo check --tests` is lean.
