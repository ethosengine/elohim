# Local integrity and fresh-target restore decisions. No CID elects a head.
seamRegistryVersion: 1
crate: eprfs-local
crateRoot: elohim/eprfs/eprfs-local
seamLocus: >
  The legacy projection materializer checks each fetched entry; exact tree restore
  checks the complete closure before fresh-target Linux promotion. Host and trusted
  parent limits remain explicit; neither operation establishes release authority.
decisionPoints:
  - name: capture_tree
    kind: state-transition
    sourceLocation:
      file: src/capture.rs
      modulePath: eprfs_local::capture_tree
    summary: >
      Validate literal selections and disjoint roots, read through pinned Linux descriptors with bounded stability checks, then retain and verify a canonical private tree.
    concernIds:
      - id: C0
        status: answered
        justification: Private local content custody; no reach or head election.
      - id: C1
        status: n-a
        justification: No candidate is elected or accepted.
      - id: C2
        status: n-a
        justification: No mutable authoritative head or ordering clock is written.
      - id: C3
        status: answered
        justification: A bounded attempt returns a result or refusal without retrying unstable input.
      - id: C4
        status: partial
        justification: Tree absence and corruption stay distinct; filesystem errors retain their path, while selection refusals use explanatory strings.
      - id: C5
        status: answered
        justification: Canonical Tree v1 closure and raw leaves are verified locally; this confers no authority.
      - id: C6a
        status: partial
        justification: TreeLimits bound work and retained closure; filesystem or storage syscall duration is not deadline bounded.
      - id: C6b
        status: answered
        justification: Canonical immutable objects and explicit verified writes preserve identical roots across repeated operations.
      - id: C7
        status: answered
        justification: Success verifies the complete closure after synchronized DirectoryStorage writes; filesystem sync semantics bound durability, and publication is never claimed.
      - id: C8
        status: partial
        justification: Errors and selected-scope reports expose outcomes; durable labeled telemetry belongs to the caller.
      - id: C9
        status: n-a
        justification: No actor identity or key lineage is interpreted.
      - id: C10
        status: answered
        justification: Existing Tree v1 and BlobCid codecs remain unchanged; no alternative wire format is added.
      - id: C11
        status: partial
        justification: Per-operation budgets refuse excess work; this local API does not schedule concurrent callers.
      - id: C12
        status: n-a
        justification: Explicit local selection does not authorize publication, remote access, or execution.
      - id: C13
        status: n-a
        justification: No authority tier or scaffold is introduced.
      - id: C14
        status: partial
        justification: Errors propagate with context; failed writes may retain unreferenced objects or reported temporary files, and abrupt process death cannot return a witness.
    contractTests:
      - path: elohim/eprfs/eprfs-local/tests/filesystem_capture.rs
        testName: captures_without_git_and_keeps_candidate_a_after_source_becomes_b
        kind: integration
      - path: elohim/eprfs/eprfs-local/tests/filesystem_capture.rs
        testName: durable_capture_restore_recapture_keeps_the_tree_v1_golden
        kind: integration
      - path: elohim/eprfs/eprfs-local/src/capture/tests.rs
        testName: selection_refusals_leave_store_absent
        kind: unit
      - path: elohim/eprfs/eprfs-local/src/capture/tests.rs
        testName: observed_open_read_and_ancestor_races_refuse_without_store_mutation
        kind: unit
      - path: elohim/eprfs/eprfs-local/src/capture/tests.rs
        testName: concurrent_captures_keep_identical_roots
        kind: unit
      - path: elohim/eprfs/eprfs-local/src/capture/tests.rs
        testName: object_and_expanded_closure_limits_refuse_before_writes
        kind: unit
      - path: elohim/eprfs/eprfs-local/src/capture/tests.rs
        testName: representation_is_canonical_and_hardlink_names_remain_distinct
        kind: unit
      - path: elohim/eprfs/eprfs-local/src/capture/tests.rs
        testName: prepared_write_propagates_failure_and_cancellation_without_touching_prior_objects
        kind: unit
      - path: elohim/eprfs/eprfs-local/src/capture/tests.rs
        testName: exactly_one_object_limit_is_accepted_by_bounded_source_reads
        kind: unit
      - path: elohim/eprfs/eprfs-local/src/capture/tests.rs
        testName: relative_roots_remain_bound_when_process_cwd_changes
        kind: unit
    notes: >
      Private (B) native working material; no DHT entry, coordinator, signal, HTTP route,
      peer transport or head-plane items (zero at one year). All network stages retain
      byte verification and confinement. The worst local holder sees selected bytes and
      names; nothing is indexed or served outside the device by this operation.
  - name: restore_exact_tree
    kind: state-transition
    sourceLocation:
      file: src/exact_tree.rs
      modulePath: eprfs_local::restore_exact_tree
    summary: >
      Verify the complete private tree closure, reject external and host-inexpressible
      entries, then synchronize private staging before Linux RENAME_NOREPLACE and
      synchronize the destination parent. Failures retain staging or the promoted
      destination with typed residue context. This does not elect a head.
    concernIds:
      - id: C0
        status: answered
        justification: Local private content is projected only after CID integrity verification; storage possession grants no head authority.
      - id: C1
        status: n-a
        justification: The caller supplies a root CID; this function does not choose a candidate or release head.
      - id: C2
        status: n-a
        justification: No version ordering or authoritative pointer is changed.
      - id: C3
        status: answered
        justification: Bounded explicit attempts return success or error; pre-promotion failures retain staging and post-promotion sync failures retain the destination. No automatic retry or cleanup obscures uncertain effects.
      - id: C4
        status: partial
        justification: Tree failures, local refusals and I/O failures remain typed; residue() distinguishes retained staging from a promoted but unconfirmed destination. Individual host refusals remain strings.
      - id: C5
        status: partial
        justification: The receiver verifies all fetched bytes and names before writing; standing, signatures, and head election are outside this local projection.
      - id: C6a
        status: partial
        justification: TreeLimits and native ceilings bound work to 64 MiB objects and 1 GiB expanded closure; generic EprfsStorage fetch can allocate before the check, and syscalls have no deadline.
      - id: C6b
        status: answered
        justification: A new destination alone is admitted; Linux no-replace promotion refuses a concurrent occupant instead of overwriting it.
      - id: C7
        status: partial
        justification: The exact closure is restored for Linux native profiles only; external entries, unsupported hosts, and an existing destination are refused.
      - id: C8
        status: partial
        justification: The report counts files, directories, symlinks and bytes; no durable per-reason counters are emitted.
      - id: C9
        status: n-a
        justification: The lane carries no agent identity or key lineage.
      - id: C10
        status: answered
        justification: Raw leaves and DAG-CBOR directory nodes use the core codec and BlobCid verifier; this crate adds no alternate encoding.
      - id: C11
        status: partial
        justification: Staging is sequential and size-limited by the verified closure budget, but there is no concurrency scheduling or fetch deadline.
      - id: C12
        status: n-a
        justification: Restoring private bytes does not authorize publication, execution, or peer action.
      - id: C13
        status: partial
        justification: Linux native same-filesystem promotion and successful filesystem syncs are required; no cross-platform fallback or publication standing is claimed.
      - id: C14
        status: partial
        justification: Returned errors identify retained staging or destination and the underlying failure; abrupt death leaves residue without a returned witness, and no power-loss fault-injection hardware is exercised.
    contractTests:
      - path: elohim/eprfs/eprfs-local/src/exact_tree/durability_tests.rs
        testName: every_write_sync_and_promotion_failure_reports_retained_location
        kind: unit
      - path: elohim/eprfs/eprfs-local/src/exact_tree/durability_tests.rs
        testName: sync_order_is_file_then_bottom_up_directories_then_promotion_then_parent
        kind: unit
      - path: elohim/eprfs/eprfs-local/src/exact_tree/durability_tests.rs
        testName: process_interruption_preserves_stage_or_promoted_tree
        kind: integration
      - path: elohim/eprfs/eprfs-local/tests/filesystem_capture.rs
        testName: restore_preserves_executable_content_without_executing_it
        kind: integration
      - path: elohim/eprfs/eprfs-local/src/exact_tree.rs
        testName: restores_nested_raw_bytes_executable_mode_non_utf8_names_and_symlink_target
        kind: unit
      - path: elohim/eprfs/eprfs-local/src/exact_tree.rs
        testName: corrupt_late_leaf_leaves_absent_destination_and_existing_sibling_unchanged
        kind: unit
      - path: elohim/eprfs/eprfs-local/src/exact_tree.rs
        testName: refuses_existing_destination_even_when_empty
        kind: unit
      - path: elohim/eprfs/eprfs-local/src/exact_tree.rs
        testName: interruption_before_promotion_never_exposes_destination
        kind: unit
      - path: elohim/eprfs/eprfs-local/src/exact_tree.rs
        testName: refuses_symlinked_parent_and_unsafe_tree_name_before_any_write
        kind: unit
      - path: elohim/eprfs/eprfs-local/src/exact_tree.rs
        testName: concurrent_destination_creation_is_never_replaced
        kind: unit
      - path: elohim/eprfs/eprfs-local/src/exact_tree.rs
        testName: expanded_repeated_leaf_bytes_are_bounded_before_staging
        kind: unit
      - path: elohim/eprfs/eprfs-local/src/exact_tree.rs
        testName: external_boundary_and_nul_symlink_target_refuse_exact_restore
        kind: unit
    notes: >
      The destination parent must be owned/trusted against concurrent mutation;
      path-based staging is not an adversarial race containment boundary. The
      implementation rejects symlinked ancestors and uses an opened parent fd
      for final promotion and parent sync. Files are synced after mode application;
      directories are synced bottom-up including literal symlink entries, without
      following targets. Retained stages are private 0700 directories and are never
      silently deleted on failure. Filesystem/device honesty about sync remains required.
  - name: RestoreResidue
    kind: boundary-answer-type
    sourceLocation:
      file: src/exact_tree.rs
      modulePath: eprfs_local::RestoreResidue
    summary: Retained location and promotion state for an incomplete exact restore, carried inside the existing I/O error variant.
    concernIds:
      - { id: C0, status: answered, justification: Private local custody failure context; no reach or authority decision. }
      - { id: C1, status: n-a, justification: No candidate election or acceptance. }
      - { id: C2, status: n-a, justification: No authoritative head or ordering clock. }
      - { id: C3, status: partial, justification: Callers can inspect residue and retry with a fresh destination; this API performs no automatic recovery or cleanup. }
      - { id: C4, status: answered, justification: Preflight has no residue; incomplete staging and unconfirmed promoted destination are distinguished. }
      - { id: C5, status: answered, justification: The context reports observed local effects and never confers success or acceptance. }
      - { id: C6a, status: answered, justification: One retained path and one nested failure per restore attempt. }
      - { id: C6b, status: answered, justification: Inspecting the context has no side effect and retries never consume prior residue. }
      - { id: C7, status: answered, justification: A post-promotion sync error names the destination rather than a nonexistent stage. }
      - { id: C8, status: partial, justification: Typed promotion state and source error are available; no labeled metrics are emitted. }
      - { id: C9, status: n-a, justification: No actor identity is interpreted. }
      - { id: C10, status: answered, justification: Additive residue accessor preserves existing error enum variants and exhaustive consumers; no Tree v1 wire change. }
      - { id: C11, status: n-a, justification: Error context schedules no work or queue. }
      - { id: C12, status: n-a, justification: It grants no cleanup or execution permission. }
      - { id: C13, status: n-a, justification: No authority tier is introduced. }
      - { id: C14, status: partial, justification: Ordinary failures retain their underlying source and location; process death cannot return context and requires caller inspection of the stage prefix. }
    contractTests:
      - path: elohim/eprfs/eprfs-local/src/exact_tree/durability_tests.rs
        testName: every_write_sync_and_promotion_failure_reports_retained_location
        kind: unit
      - path: elohim/eprfs/eprfs-local/tests/filesystem_capture.rs
        testName: restore_error_enum_remains_exhaustively_matchable
        kind: integration
  - name: fetch_verified_blob
    kind: verdict-fn
    sourceLocation:
      file: src/lib.rs
      modulePath: eprfs_local::LocalMaterializer::fetch_verified_blob
    summary: >
      Reject a fetched handle whose CID differs from the request or whose bytes do
      not verify under the requested CID's declared raw or DAG-CBOR codec.
    concernIds:
      - id: C0
        status: answered
        justification: >
          This checks local byte integrity on the custody/projection plane; it never
          selects a release head or turns blob possession into authority.
      - id: C1
        status: n-a
        justification: No candidate or release head is selected by this byte check.
      - id: C2
        status: n-a
        justification: No version or authority ordering is changed.
      - id: C3
        status: n-a
        justification: This is one fetch decision, not a state machine or retry policy.
      - id: C4
        status: partial
        justification: >
          Integrity refusal is distinct from storage missing/unavailable errors, but
          wrong-handle-CID and corrupt bytes share one Storage error; no typed
          public outcome distinguishes those two cases.
      - id: C5
        status: partial
        justification: >
          The receiver re-derives byte integrity and binds bytes to the requested
          CID; this helper does not verify signatures, standing or election.
      - id: C6a
        status: partial
        justification: >
          The helper fetches one requested blob and has no retry ladder, but byte
          fetch and hashing still accept an unbounded blob size with no declared
          memory or time budget in this slice.
      - id: C6b
        status: n-a
        justification: The helper returns a verified handle and writes no shared state.
      - id: C7
        status: partial
        justification: >
          Every file/symlink fetch path uses this check, but complete-tree verified
          restore is not implemented and must not be advertised as served.
      - id: C8
        status: partial
        justification: >
          Integrity refusal returns an error, but this crate has no typed reason
          counter for each decision outcome.
      - id: C9
        status: n-a
        justification: No agent identity or key lineage is referenced.
      - id: C10
        status: answered
        justification: >
          Existing DAG-CBOR-addressed projection blobs and raw-addressed bytes both
          verify by their declared codec; unknown codecs fail closed.
      - id: C11
        status: n-a
        justification: This per-handle integrity check does not schedule load.
      - id: C12
        status: n-a
        justification: It does not authorize publication, execution or peer action.
      - id: C13
        status: n-a
        justification: It is the same integrity floor at every network stage.
      - id: C14
        status: partial
        justification: >
          An unexpected handle is refused with an error, but no durable witness or
          typed residual observation is emitted by this local helper.
    contractTests:
      - path: elohim/eprfs/eprfs-local/tests/materialization_integrity.rs
        testName: wrong_cid_and_corrupt_bytes_leave_file_and_symlink_destinations_unchanged
        kind: integration
      - path: elohim/eprfs/eprfs-local/tests/materialization_integrity.rs
        testName: raw_and_legacy_dag_cbor_cids_materialize_after_verification
        kind: integration
      - path: elohim/eprfs/eprfs-local/tests/materialization_integrity.rs
        testName: fetch_error_propagates_without_touching_destination
        kind: integration
      - path: elohim/eprfs/eprfs-local/tests/materialization_integrity.rs
        testName: unsupported_codec_refuses_materialization_and_drift_verification
        kind: integration
      - path: elohim/eprfs/eprfs-local/tests/materialization_integrity.rs
        testName: corrupt_reply_preserves_existing_native_symlink
        kind: integration
    notes: >
      Contract tests use an independent raw hello-world CID literal. Verification
      before each entry write does not address symlink ancestors, path races,
      directory/mode drift or atomic promotion of a complete tree. A separate
      serialized path-escape regression is registered at the eprfs-core
      ProjectionManifest::validate boundary; it does not change this per-blob verdict.
