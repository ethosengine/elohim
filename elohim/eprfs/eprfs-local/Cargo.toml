[package]
name = "eprfs-local"
version = "0.3.5"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Local filesystem materialization for EPR-governed projections"
publish = ["elohim"]

[dependencies]
eprfs-core = { version = "0.3.3", path = "../eprfs-core", registry = "elohim" }
eprfs-host = { version = "0.3.3", path = "../eprfs-host", registry = "elohim" }
eprfs-storage = { version = "0.3.4", path = "../eprfs-storage", registry = "elohim" }
bytes.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs"] }
thiserror.workspace = true
# Explicit private-directory creation used by durable staging.
tempfile = "3.27"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
async-trait.workspace = true
tokio.workspace = true
