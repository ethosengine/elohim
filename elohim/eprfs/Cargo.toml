[workspace]
resolver = "2"
members = [
    "eprfs-agent",
    "eprfs-core",
    "eprfs-host",
    "eprfs-local",
    "eprfs-meta",
    "eprfs-storage",
    "../sdk/domains/elohim-agent/adapter",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Elohim Protocol"]
repository = "https://github.com/ethosengine/elohim"

[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
