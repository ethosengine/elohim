[workspace]
resolver = "2"
members = [
    "device-runtime",
    "epr-cli",
    "epr-lsp",
    "eprfs-agent",
    "eprfs-cli",
    "eprfs-core",
    "eprfs-host",
    "eprfs-local",
    "eprfs-meta",
    "eprfs-peer",
    "eprfs-serve",
    "eprfs-storage",
    "../sdk/domains/elohim-agent/adapter",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Elohim Protocol"]
repository = "https://github.com/ethosengine/elohim"

[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# The debug `epr` is what the hooks and the gate run. Its recall open SHA-256s up to 20 MB of
# footprint (flow/memory/footprint.rs) and queries the bundled SQLite fold; unoptimized, those
# dependencies pushed it past the SessionStart hooks' 6 s budget as recall receipts grew
# (7.6 s measured 2026-09-26). Optimizing dependencies only keeps the budget, and our own crates'
# debug build, as they are.
[patch.crates-io]
# Mirrors elohim/elohim-storage/Cargo.toml: iroh 0.92 resolves iroh-quinn-proto 0.13.0, whose GSO
# tail-loss-probe path can violate `untracked_bytes <= segment_size`, poison the connection mutex
# and abort the process. The vendored crate carries only Quinn upstream fix 434c3586; see its
# VENDOR-NOTE.md for the evidence and the retirement condition. eprfs-peer pulls iroh 0.92.
iroh-quinn-proto = { path = "../../vendor/iroh-quinn-proto-0.13.0" }

[profile.dev.package."*"]
opt-level = 2
