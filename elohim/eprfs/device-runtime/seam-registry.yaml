  - id: C11
    status: n-a
    justification: No shared compute resource or network backpressure is introduced.
  - id: C12
    status: answered
    justification: The envelope reads steward standing and covenant clauses; it cannot grant either.
  - id: C13
    status: answered
    justification: Absent runtime model stays absent. The view cannot elevate missing tier evidence.
  - id: C14
    status: answered
    justification: Closed bindings and exact covenant snapshots remain private beside the device key.
