seamRegistryVersion: 1
crate: elohim-device-runtime
crateRoot: elohim/eprfs/device-runtime
seamLocus: Local executable custody, session ownership and explicit promotion. The store holds private B records
  and reconstructs ephemeral C status, with no network head-plane cost.
decisionPoints:
- name: path-invalid
  kind: verdict-fn
  sourceLocation:
    file: src/bin_store/files.rs
    modulePath: elohim_device_runtime::bin_store::files::absolute
  summary: 'path-invalid: returns a typed refusal with local context; never promotes an unverified candidate.'
  concernIds:
  - id: C0
    status: answered
    justification: Device-private local custody; status and session identity are rebuilt views. No DHT head or transport.
  - id: C1
    status: answered
    justification: Possession and ingest cannot promote current; only land can validate and promote.
  - id: C2
    status: answered
    justification: Land compares source descent and revalidates current metadata; timestamps never rank heads.
  - id: C3
    status: answered
    justification: PID plus process start time binds liveness; ownerless pins have bounded grace.
  - id: C4
    status: answered
    justification: Refusal kind/detail distinguish unavailable bytes, invalid evidence and an absent session.
  - id: C5
    status: answered
    justification: Attestation cache records witnessed success by repo/SHA/check; claimed evidence cannot land.
  - id: C6a
    status: answered
    justification: Store locks and external commands have finite elapsed-time bounds.
  - id: C6b
    status: answered
    justification: Ingest is content addressed, pins publish under lock, migration checkpoints its mapping.
  - id: C7
    status: n-a
    justification: No peer advertisement or serving surface in this local crate.
  - id: C8
    status: answered
    justification: Typed refusals return to the CLI; landing failures append to existing release evidence.
  - id: C9
    status: answered
    justification: Session module binds owner start time; alias names resolve to registered release files.
  - id: C10
    status: answered
    justification: CID migration is explicit; normal readers reject legacy addresses. Status schema names camelCase
      fields.
  - id: C11
    status: partial
    justification: Build concurrency follows pool policy; cross-device backpressure belongs to slice B.
  - id: C12
    status: n-a
    justification: No new remote authority or consent; operator invokes device-local verbs.
  - id: C13
    status: answered
    justification: Provisional pin is an explicit local choice and never authorizes current.
  - id: C14
    status: partial
    justification: Legacy bytes are retained for running executables; cross-device custody is not implemented in
      slice A.
  contractTests: null
  gapNote: Covered by the command/operation parity suite where exercised; no dedicated per-kind assertion is claimed.
