[package]
name = "elohim-device-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bin-launch"
path = "src/bin/bin-launch.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
eprfs-core = { path = "../eprfs-core" }
# `session_stasis`: the dialogue journal fold reuses the protocol `Decision` and the REA `Bound`.
# Both resolve as sibling crates in the elohim-storage image's flattened layout (../../epr), the
# same way `ark-core` does. epr-rea opts out of its filesystem sidecar, as elohim-storage does.
elohim-epr = { path = "../../epr" }
elohim-epr-rea = { path = "../../epr-rea", default-features = false }
# Wall-clock arithmetic for journal intervals; serde for the JSON the fold prints.
chrono = { version = "0.4", features = ["serde"] }
# The journal's per-session flock (`journal.lock`), as a safe wrapper.
rustix = { version = "1", features = ["fs"] }

ark-core = { package = "elohim-ark-core", path = "../../ark/core" }
elohim-settings = { path = "../../elohim-settings" }

[dev-dependencies]
jsonschema = { version = "0.28", default-features = false }
tempfile = "3"
