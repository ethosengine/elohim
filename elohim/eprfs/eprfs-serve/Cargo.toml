[package]
name = "eprfs-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The serving side of an eprfs tier: reach- and membership-checked batch, read, list and diff answers, and the tier contract harness"
# Not published until the eprfs publish set (scripts/ci/publish_eprfs.py `CRATES`) names it and
# elohim-storage consumes it: a crate marked publishable that no pipeline publishes would read as
# released. Its consumers in this tree take it by path.
publish = false

[features]
# The tier contract harness and its counting doubles (interfaces spec §A.4, A19). Default-off so
# a serving host never links them; implementors turn it on in dev-dependencies (rail R-E3:
# elohim-storage takes it as a dev-dependency, never eprfs-storage or eprfs-local).
testing = ["dep:serde_json"]

[dependencies]
async-trait.workspace = true
bytes.workspace = true
eprfs-core = { version = "0.3.1", path = "../eprfs-core", registry = "elohim" }
elohim-seam-contracts = { version = "0.1.0", path = "../../../crates/seam-contracts", registry = "elohim", features = ["serde"] }
# The outer-tier contract proves no indexical `own` crosses the wire by serializing every answer
# (`TierId::own` refuses to serialize). Harness only.
serde_json = { workspace = true, optional = true }

[dev-dependencies]
async-trait.workspace = true
eprfs-serve = { path = ".", features = ["testing"] }
serde_json.workspace = true
tokio.workspace = true
