seamRegistryVersion: 1
crate: eprfs-storage
crateRoot: elohim/eprfs/eprfs-storage
seamLocus: >
  Explicit private byte custody through the existing EprfsStorage trait.
  The directory adapter is local content storage, not a transport, release
  head, publication record, or authority source.
decisionPoints:
  - name: DirectoryStorage
    kind: boundary-answer-type
    sourceLocation:
      file: src/lib.rs
      modulePath: eprfs_storage::DirectoryStorage
    summary: >
      Open or explicitly create a private flat local content store; verify raw
      or DAG-CBOR bytes against a caller-supplied CID before storing or serving.
      Refuse symlink, public, and corrupt objects. Synchronize the verified object,
      root and parent before successful puts, including existing/concurrent objects.
      Synchronize root and parent on create, including a competing creator.
      Never infer release standing.
    concernIds:
      - id: C0
        status: answered
        justification: This is private local byte custody, not elected reach.
      - id: C1
        status: n-a
        justification: Blob possession elects no release candidate.
      - id: C2
        status: n-a
        justification: No head, authority clock, or version order is changed.
      - id: C3
        status: answered
        justification: Each explicit request returns success or refusal; no retry loop runs.
      - id: C4
        status: partial
        justification: Missing, corrupt, wrong-CID, and inaccessible objects refuse; the shared storage error type still groups several reasons under Storage.
      - id: C5
        status: partial
        justification: Bytes are rehashed on fetch and put, but no signature, lineage, or standing is checked.
      - id: C6a
        status: partial
        justification: Directory reads and writes cap each object at 64 MiB; callers may tighten the bound. Filesystem I/O duration and hostile trusted-path replacement are not bounded here.
      - id: C6b
        status: answered
        justification: Repeated and competing puts verify and synchronize the actual retained inode and containing directories; corrupt existing bytes are refused without clobbering.
      - id: C7
        status: partial
        justification: Local possession is checked but no peer-delivery or availability guarantee follows.
      - id: C8
        status: partial
        justification: Errors expose refusals to callers; metrics and durable observations are caller-owned.
      - id: C9
        status: n-a
        justification: The adapter interprets no agent, identity key, or lineage.
      - id: C10
        status: answered
        justification: Explicit-CID put is additive; legacy put_blob and BlobCid wire bytes remain unchanged.
      - id: C11
        status: n-a
        justification: No network listener, ingress, or background retries are added.
      - id: C12
        status: answered
        justification: Only an explicit caller-selected put writes bytes; custody grants no publication or execution authority.
      - id: C13
        status: n-a
        justification: No authority tier or release fallback is added.
      - id: C14
        status: partial
        justification: Write and sync errors propagate, retaining and naming incomplete temporary objects where present; abrupt process death cannot return context and durable witness recording belongs to the caller.
    contractTests:
      - path: elohim/eprfs/eprfs-storage/src/durability_tests.rs
        testName: new_and_existing_root_sync_failures_refuse_and_preserve_root
        kind: unit
      - path: elohim/eprfs/eprfs-storage/src/durability_tests.rs
        testName: new_existing_and_concurrent_objects_sync_the_actual_inode_before_directories
        kind: unit
      - path: elohim/eprfs/eprfs-storage/src/durability_tests.rs
        testName: every_object_write_sync_and_promotion_failure_refuses_without_losing_candidates
        kind: unit
      - path: elohim/eprfs/eprfs-storage/src/durability_tests.rs
        testName: losing_writer_cannot_succeed_when_winner_sync_fails
        kind: unit
      - path: elohim/eprfs/eprfs-storage/src/durability_tests.rs
        testName: process_interruption_retains_objects_and_allows_verified_retry
        kind: integration
      - path: elohim/eprfs/eprfs-storage/src/lib.rs
        testName: directory_store_verifies_raw_and_dag_cbor_and_never_clobbers_corruption
        kind: unit
      - path: elohim/eprfs/eprfs-storage/src/lib.rs
        testName: directory_store_refuses_public_existing_root_and_object
        kind: unit
      - path: elohim/eprfs/eprfs-storage/tests/tier_chain.rs
        testName: offloaded_directory_passes_the_leaf_contract_on_a_multi_thread_runtime
        kind: integration
      - path: elohim/eprfs/eprfs-storage/tests/walk_directory_storage.rs
        testName: directory_storage_corrupt_spine_object_refuses
        kind: integration
    notes: >
      A stored object that fails its address is the typed EprfsError::Corrupt, which every walk
      reads as integrity. OffloadedDirectory is the same store with each read and write on
      tokio's blocking pool, for a TierChain on a multi-thread runtime and every serving
      adapter (interfaces spec section 4, Blocking I/O).
      This adapter creates no DHT entry, coordinator, route, or release linkage;
      expected head-plane cost is zero at seed and one year. Directory ancestry
      is caller-owned and trusted against concurrent local path replacement.
      Success relies on the filesystem honoring sync_all; reads do not establish
      durable custody. The worst holder sees selected bytes and names locally;
      this adapter creates no remote index or cross-identity join.
