[package]
name = "eprfs-storage"
version = "0.3.6"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Storage-facing adapters for EPR filesystem projections"
publish = ["elohim"]

[dependencies]
async-trait.workspace = true
bytes.workspace = true
eprfs-core = { version = "0.3.3", path = "../eprfs-core", registry = "elohim" }
# The byte profile (re-genesis 1, amended R1): the `fastcdc-2020` chunker and `ByteProfile` a
# tier blob manifest records. Addresses come through eprfs-core's kernel-backed `BlobCid`.
elohim-epr = { version = "0.2", path = "../../epr", registry = "elohim" }
# Incremental complete-artifact digest for byte-profile (BLAKE3) outputs.
blake3 = "1"
serde.workspace = true
serde_json.workspace = true
serde_ipld_dagcbor = "0.6"
# Retained `ext` namespace content (D7), decoded as opaque DAG-CBOR data.
ipld-core = "0.4"
sha2 = "0.10"
# Explicit cleanup control used when retaining failed object writes.
tempfile = "3.27"
tokio = { workspace = true, features = ["sync", "rt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
eprfs-serve = { path = "../eprfs-serve", features = ["testing"] }
