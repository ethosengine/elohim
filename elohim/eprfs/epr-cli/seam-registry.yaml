# elohim/eprfs/epr-cli/seam-registry.yaml
#
# Conforms to elohim/sdk/schemas/v1/manifest/seam-registry.schema.json. FIRST registry for this
# crate, minted with the `epr flow note` write leg (2026-08-13, harness-borrows Task 1) under the
# birth rule: a decision surface is registered when it is created, not when someone notices it.
#
# Extended 2026-08-13 (harness-borrows Task 2) with the `epr flow stocks` equilibrium fold — the
# crate's first REGISTERED verdict surface, and the first row whose red is an exit code.
#
# HONESTY CLAUSE — what is registered here, and what is not. The rows below are the decision
# points minted BY the note leg (Task 1) and the stocks leg (Task 2). The crate's PRE-EXISTING
# decision surface is NOT yet registered and is a declared backlog, not a silent omission:
#
#   - [REGISTERED 2026-09-10, station two] `project::derive_gap_items`' CLAIMED predicate
#     (src/flow/project.rs) — the sole gate between "a plan mentioned this" and "the repo
#     promised this." Registered as `project::derive_doc_stations / project::derive_gap_items`
#     below, when the station-two move changed what its sibling decides (the DOCUMENT now speaks
#     for its own stations; the cache answers only for a doc that could not).
#   - `edges::edge_verdict` (src/flow/edges.rs) — the staleness verdict over sealed contract
#     edges (Ok | Governed | Stale | Held | Dangling); a verdict-fn by any reading, and the one
#     whose red routes real work.
#   - `walk::status`' unfulfilled fold (src/flow/walk.rs) — decides what counts as an open
#     promise across every declared scope, and is the number the whole development system quotes.
#   - `governor::derive_governor` (src/flow/governor.rs) — decides which conformance mechanism an
#     unspecified `--governor` edge is sealed under, from a registry of rules.
#
# Each qualifies and each is pending. They are named here rather than omitted, so the census
# reads a declared backlog instead of an apparently-complete registry — a silent omission is
# exactly the failure this file exists to prevent.
#
# Every symbol below was grepped, read, and test-run at authoring time (2026-08-13).

seamRegistryVersion: 1
crate: elohim-epr-cli
crateRoot: elohim/eprfs/epr-cli
seamLocus: >
  Two loci in the `epr flow` command family, joined by one sidecar. The first is the ADMISSION
  surface — the point at which something outside the repository's derivable state (an authored
  observation, a CLI-supplied target, a governor override) is admitted into the append-only
  `.eprfs/status/` sidecar, or refused; every other leg here DERIVES its records from the tree
  and can be re-run to the same answer, and the note leg is the first that accepts a human's
  assertion. The second is the MEASUREMENT surface over that same log — the derived event view a
  stock is folded from, and the equilibrium verdict that fold produces. They are one registry
  because they are one plane: the note leg decides what may enter the record, and the stocks leg
  decides what the record is allowed to say about the development system. The crate's other fold
  and verdict surfaces (`edge_verdict`, the unfulfilled fold) are named in the honesty clause
  above as pending.

decisionPoints:
  - name: claim::claim / note::note / fulfill::fulfill_on
    kind: state-transition
    sourceLocation:
      file: src/flow/claim.rs
      modulePath: elohim_epr_cli::flow
    summary: >
      Native authoring verbs hold one existing FlowStore transaction across read, semantic
      duplicate checks and append. Same-intent competing workers cannot both claim; exact
      claim/note/fulfillment retries remain no-ops, retaining station-1 historical actor pins.
    concernIds:
      - id: C6b
        status: answered
        justification: >
          Independent OS processes race distinct workers and exact retries. Exactly one
          commitment wins without supersede; exactly one record is appended for identical
          requests. The actor current/check/append operation uses its own existing store lock.
      - id: C3
        status: answered
        justification: >
          Actor lookup uses nonblocking shared locks. A paused actor writer cannot stop
          governance or cause flow-to-actor lock-order deadlock; unavailable attribution
          retains the established fallback without fabricating a historical claim pin.
    contractTests:
      - path: elohim/eprfs/epr-cli/tests/support/concurrent_flows.rs
        testName: competing_same_role_workers_have_one_winner_and_preserve_its_exact_pin
        kind: integration
      - path: elohim/eprfs/epr-cli/tests/support/concurrent_flows.rs
        testName: concurrent_exact_claim_note_and_fulfillment_retries_append_once
        kind: integration
      - path: elohim/eprfs/epr-cli/tests/support/concurrent_actors.rs
        testName: concurrent_actor_retries_are_one_current_claim
        kind: integration
      - path: elohim/eprfs/epr-cli/tests/support/concurrent_actors.rs
        testName: busy_actor_store_does_not_block_governance_or_fabricate_a_claim
        kind: integration
      - path: elohim/eprfs/epr-cli/tests/support/concurrent_actors.rs
        testName: cli_refuses_an_unterminated_actor_record_without_altering_evidence
        kind: integration

  - name: note::resolve_target
    kind: pure-decision-predicate
    sourceLocation:
      file: src/flow/note.rs
      modulePath: elohim_epr_cli::flow::note
      line: 268
    summary: >
      Decides whether a CLI-supplied `--on` argument names something this sidecar can be written
      against — a known atom CID, or a readable path under the repo root — and refuses everything
      else rather than minting a record pointing at nothing.
    concernIds:
      - id: C4
        status: answered
        justification: >
          Unresolvable, unreadable, and escaping-the-root are three distinct refusals, and none
          of them degrades to an append. The CID arm deliberately verifies MEMBERSHIP rather than
          well-formedness: a syntactically valid CID for something never recorded is Absent, not
          Present, and accepting it would mint an observation unreachable from every walk that
          starts at a real record — a note that reads as evidence and is not. Pinned by
          `an_unresolvable_target_appends_nothing_and_is_unknown_resource`, which asserts the
          sidecar line count is unchanged after both refusal arms.
      - id: C6b
        status: answered
        justification: >
          Replay mints nothing: the note's atom CID is fully determined by its fields, so an
          identical note appended twice is one record and the second call reports
          `appended: false` rather than adding a row. Distinct reasons remain distinct records,
          which is the property that keeps dedup from swallowing genuine second observations.
          Pinned by `an_identical_note_appended_twice_is_one_record`, which asserts both halves.
      - id: C0
        status: answered
        justification: >
          Plane located before the interface was drawn: a note is a REPO-PLANE append to the
          offline floor (`.eprfs/status/flows.jsonl`, CID-verified on read, local and
          reprojectable) — not a DHT entity, not a projection table. Nothing is published,
          gossiped, or head-elected, so the head-plane cost is zero. The `run-note` unit is the
          mechanical expression of the same placement: it keeps notes out of every existing
          unit-keyed stock fold by construction rather than by a downstream filter someone must
          remember to write.
      - id: C1
        status: n-a
        justification: >
          Anti-self-election is about a component crowning what it authored. This predicate
          crowns nothing — it admits or refuses a reference, and the note it admits carries no
          authority at all: `fulfills` and `satisfies` stay empty by construction, so a note
          cannot discharge, promote, or retire the promise it is about. The empty-`fulfills`
          invariant is the reason this row can honestly claim n-a rather than partial, and it is
          pinned by `a_note_never_discharges_its_commitment`.
    notes: >
      The leg is two-phase (resolve everything, then append once) mirroring `seal::reseal`'s
      no-partial-write idiom. With one target the phase split is trivially satisfied, but the
      invariant it protects — the sidecar never observes a half-written act — is what the error
      arms are ordered to preserve.
    contractTests:
      - path: elohim/eprfs/epr-cli/tests/flow_note.rs
        testName: an_unresolvable_target_appends_nothing_and_is_unknown_resource
        kind: integration
      - path: elohim/eprfs/epr-cli/tests/flow_note.rs
        testName: a_known_atom_cid_resolves_without_a_path
        kind: integration
      - path: elohim/eprfs/epr-cli/tests/flow_note.rs
        testName: a_target_outside_the_repo_root_is_refused_rather_than_written_against
        kind: integration
      - path: elohim/eprfs/epr-cli/tests/flow_note.rs
        testName: an_identical_note_appended_twice_is_one_record
        kind: integration
      - path: elohim/eprfs/epr-cli/tests/flow_note.rs
        testName: a_note_never_discharges_its_commitment
        kind: integration

  - name: note::NoteKind
    kind: reason-outcome-enum
    sourceLocation:
      file: src/flow/note.rs
      modulePath: elohim_epr_cli::flow::note::NoteKind
      line: 71
    summary: >
      The closed triad of run-scale observation kinds (failed-approach | correction |
      observation) that becomes a record's `classified_as` slot-0 tag — the vocabulary every
      downstream reader uses to re-find a note.
    concernIds:
      - id: C10
        status: answered
        justification: >
          An unrecognised `--kind` FAILS THE PARSE; it is never defaulted to `observation`. That
          is C10's guarantee stated at an argument boundary rather than a wire one, and the
          failure mode it forecloses is this class's type specimen: a defaulted classification
          produces a record that misdescribes itself and does so quietly, exactly as a renamed
          field silently read as absent did. The vocabulary being closed is what makes the
          refusal meaningful — a fourth kind is a spec amendment, not a CLI argument, because the
          tag IS the semantics of every read that follows.
          The same additive discipline applies one crate down: `FlowEvent.classified_as` is
          `#[serde(default, skip_serializing_if = "Vec::is_empty")]`, so declaring this vocabulary
          moved no already-appended record's CID. That matters more here than for a commitment,
          because every sidecar line re-verifies its stored CID on read — a moved encoding would
          turn the whole append-only log into an integrity error rather than a quiet re-address.
          Pinned in the owning crate by
          `elohim_epr_rea::model::tests::an_unclassified_event_keeps_its_pre_classified_cid`,
          whose golden was computed against the pre-`classified_as` struct.
      - id: C4
        status: answered
        justification: >
          The triad has no residual arm that silently absorbs an unknown value, so "a kind we do
          not recognise" and "an observation" stay distinct answers. The refusal names the legal
          set rather than merely rejecting, which is what makes it actionable at the point of
          authorship.
      - id: C14
        status: n-a
        justification: >
          Witnessed residual is about exceptions that fit no class being captured with enough
          context for cross-node RCA. There is no residual here to metabolize: the refusal is
          synchronous and delivered to the human who typed the flag, in the same process, with
          the offending token and the legal set in the message. Nothing is dropped to a `debug!`
          and there is no distributed cause to capsule.
    contractTests:
      - path: elohim/eprfs/epr-cli/src/flow/note.rs
        testName: the_kind_vocabulary_is_closed_and_refuses_a_fourth
        kind: unit
      - path: elohim/eprfs/epr-cli/src/flow/note.rs
        testName: every_kind_mints_a_distinct_run_prefixed_tag
        kind: unit
      - path: elohim/eprfs/epr-cli/src/flow/note.rs
        testName: note_event_cid_is_stable
        kind: unit
      - path: elohim/eprfs/epr-cli/tests/flow_note.rs
        testName: an_empty_reason_is_refused_before_the_store_is_opened
        kind: integration

  # ── Task 2 (2026-08-13): the equilibrium fold. The registry's own reason for existing is to
  # catch inadequate models, and a green/red on "is the development system in equilibrium?" is
  # precisely that class — so both halves are registered at birth: the predicate that decides
  # which events move the stock, and the verdict that decides what the exit code says.

  - name: stocks::classify_record
    kind: pure-decision-predicate
    sourceLocation:
      file: src/flow/stocks.rs
      modulePath: elohim_epr_cli::flow::stocks::classify_record
      line: 171
    summary: >
      Decides, for the commitments stock, whether one sidecar record is inflow (a promise was
      minted), outflow (a promise was discharged), or neither — keyed on the `fulfills`
      fulfillment edge rather than on the event's own REA verb.
    concernIds:
      - id: C0
        status: answered
        justification: >
          Plane located before the arithmetic: this is a REPO-PLANE fold over the offline floor
          (`.eprfs/status/flows.jsonl`), producing a DERIVED view that is never appended and never
          stored. A stock is a pure fold — a stored level would be a second home for a number that
          already has one — so head-plane cost is zero and the truth/projection split stays intact.
          The read-only property is pinned by `the_fold_is_read_only`, which asserts the sidecar is
          byte-identical after a fold.
      - id: C4
        status: answered
        justification: >
          Three absences stay distinct rather than collapsing into "not counted":
          `NotOpenAtMint` (a Revoked/Fulfilled commitment — structurally unreachable today per
          Spec B Q-C, and if it appears it reads as absence, never as an inflow that can never
          drain), `DischargesNothing` (an artifact Produce, a red-run Dismiss, a Cite run-note),
          and `NotAFlowOfThisStock` (the plan and knowledge planes). Separately, a mint or a
          discharge whose instant no git history can date is emitted with an EMPTY `occurred_at` —
          present in the level, absent from every window's rate — and COUNTED as
          `undated_mints`/`undated_discharges` in the readout, because an unmeasured inflow that
          silently reads as zero is the exact direction that would make a filling stock look calm.
          The first shape of this code dropped such records entirely and pushed the level below the
          `unfulfilled_total`; caught by `an_undatable_mint_is_reported_not_guessed`.
      - id: C2
        status: answered
        justification: >
          A promise leaves the stock once, and WHICH discharge dates that drain is decided by
          `occurred_at`, never by position in the append-only log. This crate has shipped the
          append-order-vs-`occurredAt` bug before — `a83b35079` (2026-07-29), whose commit body
          reads "the exact `8a1c531dc` bug, reintroduced via replay" — and the re-fulfillment arm
          plus delayed/backfilled reports make this a genuine second site for it. The dedup sorts
          edges by normalized timestamp with undated edges last and stable append order breaking
          ties, the same `(timestamp, then arrival)` shape the zome selector settled on. Pinned by
          `the_drain_is_dated_by_occurred_at_never_by_append_order`, whose fixture appends the
          later discharge FIRST so a position-keyed dedup reads the stock as undrained.
      - id: C10
        status: answered
        justification: >
          The outflow arm reads the `fulfills` EDGE, not the event's verb — which is why a
          fulfillment minted as `ReaVerb::Produce` (`fulfill.rs:336-352`) counts as discharge
          rather than inverting the sign of the finding, and why adding a REA verb cannot silently
          re-file existing records. Both matches are exhaustive over closed enums (`FlowRecord`,
          `CommitmentState`), so a new variant fails the compile rather than falling into a
          residual arm that defaults. The unit is bound by ONE constant that mints the view and
          names the fold, so the two can never be spelled differently. Pinned by
          `a_produce_fulfillment_is_outflow_not_inflow` and
          `a_produce_shaped_fulfillment_counts_as_discharge_never_as_inflow`.
      - id: C7
        status: answered
        justification: >
          What the readout advertises is what the fold served. The `outflow arm: fulfillment only`
          line is printed on every render precisely because the arm is NARROWER than Spec B §3's
          "(fulfilled + dismissed + revoked)" — `Dismiss` is a regression marker here with empty
          `fulfills`, and no projection path mints a Revoked commitment. Saying "drain" while
          measuring only fulfillment, without saying so, is the asymmetry this class names.
    notes: >
      Identity questions — is the named commitment one this stock holds open, has it already been
      drained — are deliberately NOT in this predicate; they are answered by
      `derive_commitment_view` with the record set in hand, which is what lets this stay a pure
      function over one record. The counts it cannot see (`discharges_of_unheld`,
      `redundant_discharges`) are reported by the view instead of being dropped.
    contractTests:
      - path: elohim/eprfs/epr-cli/src/flow/stocks.rs
        testName: a_produce_fulfillment_is_outflow_not_inflow
        kind: unit
      - path: elohim/eprfs/epr-cli/src/flow/stocks.rs
        testName: a_red_run_dismiss_is_neither_inflow_nor_outflow
        kind: unit
      - path: elohim/eprfs/epr-cli/src/flow/stocks.rs
        testName: a_run_note_moves_the_commitments_stock_in_neither_direction
        kind: unit
      - path: elohim/eprfs/epr-cli/src/flow/stocks.rs
        testName: an_open_commitment_is_inflow_and_a_closed_one_is_absence
        kind: unit
      - path: elohim/eprfs/epr-cli/tests/flow_stocks.rs
        testName: a_produce_shaped_fulfillment_counts_as_discharge_never_as_inflow
        kind: integration
      - path: elohim/eprfs/epr-cli/tests/flow_stocks.rs
        testName: the_drain_is_dated_by_occurred_at_never_by_append_order
        kind: integration
      - path: elohim/eprfs/epr-cli/tests/flow_stocks.rs
        testName: the_level_agrees_with_the_unfulfilled_total_every_other_reader_quotes
        kind: integration
      - path: elohim/eprfs/epr-cli/tests/flow_stocks.rs
        testName: an_undatable_mint_is_reported_not_guessed
        kind: integration

  - name: stocks::equilibrium_verdict
    kind: verdict-fn
    sourceLocation:
      file: src/flow/stocks.rs
      modulePath: elohim_epr_cli::flow::stocks::equilibrium_verdict
      line: 641
    summary: >
      Decides whether one stock is in equilibrium over one declared window — drain rate at or
      above inflow rate — and is the sole determinant of `epr flow stocks --check`'s exit code.
    concernIds:
      - id: C4
        status: answered
        justification: >
          THE reason this row exists. "We cannot see the drain" and "the drain is adequate" both
          arrive as `outflow == 0.0`, and the whole measure is worthless if they share an exit
          code. So the signature takes the observation COUNT beside the fold, and a window that
          observed nothing is `Refused { NoObservations }` — non-zero, never green. A fold that
          refused (`MismatchedPeriods` and the other `StockError` arms) is a distinct
          `FoldRefused { kind, error }` carrying the variant's stable discriminant, and a NaN rate
          — which `divide` mints exactly where an interval declares the answer unknowable, so that
          no comparison silently passes — is a third, `NotComparable`. Pinned by
          `a_window_that_observed_nothing_is_refused_not_passed`,
          `mismatched_periods_refuse_with_a_typed_reason_and_no_verdict`,
          `a_nan_rate_is_refused_rather_than_silently_compared`, and end-to-end by
          `an_empty_window_refuses_with_a_typed_reason_rather_than_greening`.
      - id: C14
        status: answered
        justification: >
          The outcome set is closed and every arm is witnessed. There is no residual that only a
          log line sees: a refusal is rendered with its typed reason on stdout, serialized into
          the `--json` outcome, and carried into the process exit code. `EquilibriumVerdict` and
          `RefusalReason` are total over the inputs — the fold's `Result` and the observation
          count — so no unpredicted case can fall through to a silent pass.
      - id: C8
        status: partial
        justification: >
          Each decision outcome carries a typed reason from an enum rather than a raw string, and
          failures are reported beside the numbers that produced them, which is the readable half
          of this class. What is missing is a COUNTER: there is no metrics plane at a CLI leg, so
          the exit code plus the rendered reason is the entire observation surface and nothing
          aggregates verdicts across runs. Recorded as partial rather than answered because Spec B
          §8 names the successor explicitly — one weekly rate line in the SessionStart headline,
          rendered from THIS fold rather than a parallel implementation. Until that lands, a
          reader sees each verdict and no trend.
      - id: C13
        status: unbound
        justification: >
          A green/red on "is the development system in equilibrium?" is a verdict over shared
          work, and the covenant that would make it authoritative — admission into
          `habits.yaml` — is explicitly the operator's to grant or refuse (harness-borrows plan
          Task 4). Today this leg carries no scaffold label and names no successor criterion at
          the gate site, because it holds no authority yet: nothing consumes its exit code. If it
          is wired into the pre-push gate or the `elohim-eprfs` pipeline, this binding becomes the
          open question — what social tier its red may block, and what graduates it.
      - id: C1
        status: n-a
        justification: >
          Anti-self-election concerns a component crowning what it authored. This function crowns
          nothing and authors nothing: it reads a fold over records other legs minted and returns
          a verdict about the repository's own workload. It cannot elect itself into any set it
          measures — the stock it grades is the set of open promises, and this leg appends none.
    notes: >
      Turnover time is deliberately absent from the signature. `Level ÷ Rate` returns a bare
      `Level` whose period survives only in the `basis` string (`stock.rs:194-207`, spec Q15), so
      `3.0` is three weeks or three years depending on a divisor the type no longer holds. It is
      printed as information with its basis attached and can never gate anything until Q15 closes
      — which is a protocol mint, not an implementer's call.
    contractTests:
      - path: elohim/eprfs/epr-cli/src/flow/stocks.rs
        testName: drain_at_or_above_inflow_is_equilibrium_and_below_it_is_filling
        kind: unit
      - path: elohim/eprfs/epr-cli/src/flow/stocks.rs
        testName: a_window_that_observed_nothing_is_refused_not_passed
        kind: unit
      - path: elohim/eprfs/epr-cli/src/flow/stocks.rs
        testName: mismatched_periods_refuse_with_a_typed_reason_and_no_verdict
        kind: unit
      - path: elohim/eprfs/epr-cli/src/flow/stocks.rs
        testName: a_nan_rate_is_refused_rather_than_silently_compared
        kind: unit
      - path: elohim/eprfs/epr-cli/tests/flow_stocks.rs
        testName: an_empty_window_refuses_with_a_typed_reason_rather_than_greening
        kind: integration
      - path: elohim/eprfs/epr-cli/tests/flow_stocks.rs
        testName: a_filling_window_is_non_equilibrium_and_names_the_stock
        kind: integration
      - path: elohim/eprfs/epr-cli/tests/flow_stocks.rs
        testName: a_draining_window_reads_as_equilibrium_and_checks_clean
        kind: integration

  - name: stocks::RefusalReason
    kind: reason-outcome-enum
    sourceLocation:
      file: src/flow/stocks.rs
      modulePath: elohim_epr_cli::flow::stocks::RefusalReason
      line: 584
    summary: >
      The typed vocabulary explaining WHY no equilibrium verdict was reachable — no observations,
      a refused fold (carrying the `StockError` variant's discriminant), or a NaN rate.
    concernIds:
      - id: C4
        status: answered
        justification: >
          The enum IS the honest-absence distinction, at the one boundary that would otherwise
          collapse it. `NoObservations` (nothing of this unit fell in the window — including the
          unit-typo case, where `count_in`'s exact-string match silently excludes everything) is a
          different answer from `FoldRefused` (the operands were dimensionally incoherent) and
          from `NotComparable` (the arithmetic produced a value no comparison may pass). A single
          "check failed" would make all three unactionable.
      - id: C10
        status: answered
        justification: >
          `FoldRefused.kind` carries a stable discriminant string mapped exhaustively from
          `StockError`, so a caller branches on the variant rather than substring-matching a
          `Display` message that is free to change. Adding a `StockError` variant fails the match
          arm at compile time instead of silently landing in an existing bucket.
      - id: C8
        status: partial
        justification: >
          The vocabulary is exactly the shape a labeled counter wants — a closed reason enum, one
          label per outcome — and it is rendered and serialized on every run. It is not yet
          COUNTED anywhere, for the same reason as the verdict row above: there is no meter at a
          CLI leg. The enum is the half of C8 this layer can own; the aggregation is Spec B §8's
          headline integration.
    contractTests:
      - path: elohim/eprfs/epr-cli/tests/flow_stocks.rs
        testName: a_unit_typo_reports_its_exclusions_and_never_reads_as_drained
        kind: integration
      - path: elohim/eprfs/epr-cli/tests/flow_stocks.rs
        testName: mismatched_periods_refuse_with_no_partial_verdict
        kind: integration
      - path: elohim/eprfs/epr-cli/src/flow/stocks.rs
        testName: a_unit_typo_reads_as_refused_never_as_a_drained_stock
        kind: unit

  # ── Actor plane (2026-08-15) — registered at birth ──────────────────────────────────────────

  - name: note::resolve_attribution
    kind: boundary-answer-type
    sourceLocation:
      file: src/flow/note.rs
      modulePath: elohim_epr_cli::flow::note
      line: 386
    summary: >
      Whose act a note is, in three arms resolved before anything is appended: a named identity
      (`--as`) outright, then a session's registered claim from the actor sidecar, then the
      commit author exactly as this leg always attributed. The agent arms bind the steward
      (git-signing human) beside the identity as one inseparable claim — an agent-provided note
      with no steward is precisely the deniable shape. Session resolution retains the exact
      ActorClaim CID as actor-claim:<CID> before the final steward slot on notes, claims and
      task-report fulfillments. Direct attribution never invents a claim reference.
    concernIds:
      - id: C4
        status: answered
        justification: >
          Every session-arm failure — no sidecar, no claim, an unreadable or tampered log — is
          honest absence with a signal: the note falls through to author-attribution with a
          one-line stderr notice naming the session at the only moment the miss is learnable,
          and exits 0. The sidecar's existence is checked before open so a read never creates
          the identity plane it is asking about.
      - id: C5
        status: answered
        justification: >
          Attribution is evidence riding the note, never authority over it: an enrichment that
          can veto its subject is a dependency in the wrong direction, so the identity plane can
          never cost the durable observation. The single refusal is a MALFORMED `--as` —
          substituting the author for an identity the caller explicitly named would mint a
          record asserting someone else spoke.
    contractTests:
