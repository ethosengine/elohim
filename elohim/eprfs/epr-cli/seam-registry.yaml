        kind: unit
      - path: elohim/eprfs/epr-cli/src/flow/note.rs
        testName: the_author_arm_carries_no_steward_and_the_agent_arms_always_do
        kind: unit
      # The three ARMS end-to-end. This slot previously cited `note_event_cid_is_stable` against
