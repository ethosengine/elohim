[package]
name = "elohim-epr-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native Elohim development coherence and reach-readiness tooling"
publish = false

[lib]
name = "elohim_epr_cli"
path = "src/lib.rs"

[[bin]]
name = "epr"
path = "src/main.rs"

[dependencies]
eprfs-core = { path = "../eprfs-core" }
eprfs-agent = { path = "../eprfs-agent" }
eprfs-host = { path = "../eprfs-host" }
eprfs-meta = { path = "../eprfs-meta" }
elohim-epr-rea = { path = "../../epr-rea" }
# The canonical CID codec. `canon_lift` mints every atom through `elohim_epr::cid::compute_cid`
# — the same function the P0.4 liftability gate proved — never a second implementation.
elohim-epr = { path = "../../epr" }
# The pure parts of an index — chunk rule, terms, ranking, fusion, the embedder boundary, fold
# attestation and (S3) the fold store — shared with elohim-storage, which may not depend on any
# eprfs crate (post-station-4 sprint, ruling R-S1). It names rusqlite without features; this
# crate's `bundled` below is the one SQLite the `epr` binary links.
elohim-epr-index = { path = "../../epr-index" }
# The device key's public name (`device_key::DeviceKey::did_key`). The one `did:key` codec in the
# repository — `core32_to_did_key` / `did_key_to_core32` — consumed exactly as doorway and
# elohim-storage consume it, so a device's did:key here and a did:key those services resolve can
# never be two encodings. Default features keep did:web's HTTP client out.
did-bridge = { path = "../../../bridges/did/did-bridge" }
# OS entropy for the device key's first generation (`AgentKeypair::generate(&mut OsRng)`).
rand_core = { version = "0.6", features = ["getrandom"] }
chrono = "0.4"
cid = "0.11"
glob = "0.3"
# Advisory file locking for the recall executor's session continuation — a safe `flock`
# wrapper, so the lock needs no `unsafe` block in this crate.
rustix = { version = "1", features = ["fs"] }
# The semantic fold's derived store (`.eprfs/status/index/<measure-cid>/fold.sqlite`): chunks,
# their vectors and an FTS5 table the lexical provider shares. `bundled` compiles SQLite with FTS5
# in, so the store does not depend on whichever libsqlite3 a machine happens to carry.
rusqlite = { version = "0.37", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2 = "0.10"
thiserror.workspace = true
# NFKC for the frame classifier's shadow text (`frames.rs`): the fold that lets a compatibility
# form (fullwidth letters, ligatures) meet the frame atoms' lowercase phrases. The same crate and
# version elohim-storage already carries, so this adds no new vetting surface.
unicode-normalization = "0.1.25"

[dev-dependencies]
# The index-parity harness pins the projector's expected bytes by digest, so a fixture that
# silently changes fails loudly rather than re-baselining itself.
sha2 = "0.10"
tempfile = "3"
