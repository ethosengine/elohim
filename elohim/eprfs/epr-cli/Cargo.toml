[package]
name = "elohim-epr-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native Elohim development coherence and reach-readiness tooling"
publish = false

[lib]
name = "elohim_epr_cli"
path = "src/lib.rs"

[[bin]]
name = "epr"
path = "src/main.rs"

[dependencies]
eprfs-core = { path = "../eprfs-core" }
eprfs-host = { path = "../eprfs-host" }
eprfs-meta = { path = "../eprfs-meta" }
elohim-epr-rea = { path = "../../epr-rea" }
# The canonical CID codec. `canon_lift` mints every atom through `elohim_epr::cid::compute_cid`
# — the same function the P0.4 liftability gate proved — never a second implementation.
elohim-epr = { path = "../../epr" }
chrono = "0.4"
cid = "0.11"
glob = "0.3"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2 = "0.10"
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
