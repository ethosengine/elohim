        kind: unit
    notes: "The wire form is provisional until lane S lands objects/item-absence.schema.json."
  - name: forward_blobs
    kind: verdict-fn
    sourceLocation:
      file: src/tier.rs
      modulePath: eprfs_core::tier::TierChain::forward_blobs
      line: 771
    summary: "The tier chain's decision of which tier is asked for which item: own store first without has_blob; local-only stays local; only tiers the injected AskPolicy admits for the root, strictly in order, within the injected ForwardGate; every byte verified and written back before it is returned."
    concernIds:
      - id: C0
        status: answered
        justification: "Reach is injected: a private root's miss never leaves the tiers its reach admits."
      - id: C1
        status: n-a
        justification: "No election."
      - id: C2
        status: n-a
        justification: "No head order."
      - id: C3
        status: answered
        justification: "Each admitted tier is asked each item at most once per call, whatever it answered; a forwarded via is normalized first (repeats and ids outside the outer set dropped), so a wire list can never make the chain ask a tier twice or grow past its outer set. A tier named in NotHeld.tried is never re-asked, and a forwarder's tried counts only the tiers the chain handed it as via."
      - id: C4
        status: answered
        justification: "Refused and OverBudget are final; Unreachable and MembershipUnknown advance; NotHeld only when every tier asked observed it absent."
      - id: C5
        status: answered
        justification: "Bytes are accepted only when they verify against the requested CID; bad bytes are Integrity and never stored, and a later tier's silence never degrades an Integrity or own-store failure to a mere absence."
      - id: C6a
        status: answered
        justification: "The ForwardGate bounds forwards per requester; a refusal names its rule and come-back time. A tier's answers stream through the chain: each is matched by a hash index, verified and delivered on arrival, so the caller's Stop stops the tier; unrequested, repeated or failing answers are never kept, and a tier that sends more unwanted answers than it was asked for is stopped. Each ask carries at most ChainLimits::max_request_items CIDs (the bound a serving endpoint enforces, one default), and verified objects wait for write-back only up to ChainLimits::max_write_back_bytes: past it the chain stops the tier, stores what it holds and asks again for the rest, so the chain holds at most that bound plus one object. The gate gets no byte hint: no item's size is known before it arrives."
      - id: C6b
        status: answered
        justification: "Write-back is verified and idempotent; a failed write-back still delivers."
      - id: C7
        status: answered
        justification: "Tier records keep every source that named a tier, held records and doorways alike (R6a)."
      - id: C8
        status: partial
        justification: "ChainStats counts per dialled tier; there is no metric exporter here."
      - id: C9
        status: n-a
        justification: "Counts are never attribution."
      - id: C10
        status: answered
        justification: "New in this release."
      - id: C11
        status: answered
        justification: "No fan-out: strict order, one tier at a time, bounded by the gate."
      - id: C12
        status: n-a
        justification: "Forwarding authorizes nothing; the serving endpoint judged the requester."
      - id: C13
        status: n-a
        justification: "The same at every stage."
      - id: C14
        status: partial
        justification: "Absences carry the three parts; witnesses are the caller's."
    contractTests:
      - path: elohim/eprfs/eprfs-storage/tests/tier_chain.rs
        testName: tier_chain_passes_the_tier_contract
        kind: integration
      - path: elohim/eprfs/eprfs-core/src/tier.rs
        testName: walk_over_chain_fetches_each_node_from_the_outer_tier_once
