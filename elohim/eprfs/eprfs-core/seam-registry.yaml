  - name: resolve_links
    kind: verdict-fn
    sourceLocation:
      file: src/level_walk.rs
      modulePath: eprfs_core::level_walk::resolve_links
      line: 331
    summary: "Resolve many paths under one root to the links at them, level by level: spine nodes the paths share are fetched in one fetch_blobs per chunk and decoded once, under one Budget, with the walk's verifier and name matcher. It is the membership check a serving tier runs for a batch, so the serving side makes no tree decision of its own."
    concernIds:
      - id: C0
        status: answered
        justification: "Byte custody under a root; reach is judged by the caller before it asks."
      - id: C1
        status: n-a
        justification: "No election."
      - id: C2
        status: n-a
        justification: "No head order."
      - id: C3
        status: answered
        justification: "Depth plus one fetch_blobs per chunk; a tier's silence is named Unreachable by the tier asked, never awaited."
      - id: C4
        status: answered
        justification: "Each path gets the single-path resolver's answer, through the same steps (descend, link_of) and the same node acceptance (accept_node): PathNotFound, NotADirectory and ExternalBoundary are proofs from held nodes; Unanswered leaves membership unestablished; Integrity, Invalid and an own-store Storage failure are errors (B4). Membership::of reads them."
      - id: C5
        status: answered
        justification: "Every spine node is rehashed against its link before it is decoded."
      - id: C6a
        status: answered
        justification: "Path bytes, depth, node bytes, total bytes and total entries share one Budget for the whole call; chunks are bounded by max_pending_entries. Spine nodes are verified, charged and decoded as they arrive, through a hash index; unrequested or repeated answers are never kept, and the tier is stopped once the chunk is answered or it overruns it."
      - id: C6b
        status: answered
        justification: "Read-only; deterministic over immutable CIDs."
      - id: C7
        status: partial
        justification: "It asks one tier interface; which tiers exist is the chain's (or OnBehalf's)."
      - id: C8
        status: n-a
        justification: "No counters; the serving caller counts."
      - id: C9
        status: n-a
        justification: "No lineage."
      - id: C10
        status: answered
        justification: "New in this release; additive."
      - id: C11
        status: answered
        justification: "No fan-out beyond the tier it is given."
      - id: C12
        status: n-a
        justification: "Authorizes nothing; a link is a proof of place, not of reach."
      - id: C13
        status: n-a
        justification: "The same at every stage."
      - id: C14
        status: partial
        justification: "Errors are typed per path; witnesses are the caller's."
    contractTests:
      - path: elohim/eprfs/eprfs-core/src/tier.rs
        testName: a_tampering_outer_tier_is_an_integrity_error_in_every_walk
        kind: unit
