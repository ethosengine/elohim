  - name: Membership
    kind: verdict-fn
    sourceLocation:
      file: src/level_walk.rs
      modulePath: eprfs_core::level_walk::Membership
      line: 440
    summary: "Classify what one requested object's path under a root proves (Member, NotUnderRoot, Unknown, Integrity, OwnFailed) from resolve_links' answer, exhaustively over TreeError inside this crate, and name the serving answer for each verdict (Membership::absence) and what a presence question may say (Membership::presence), both exhaustive here, so a serving tier only calls them and makes no tree or reach decision of its own; check_membership runs it for a whole batch."
    concernIds:
      - id: C0
        status: answered
        justification: "NotUnderRoot is final for the requester (Refused NotUnderRoot), so only proofs from held, verified nodes reach it: a path leading elsewhere, PathNotFound, NotADirectory, ExternalBoundary."
      - id: C1
        status: n-a
        justification: "No election."
      - id: C2
        status: n-a
        justification: "No head order."
      - id: C3
        status: answered
        justification: "Unknown (not held, unanswered, budget spent, no tree) is not final; the requester's chain advances past it."
      - id: C4
        status: answered
        justification: "The classification is one exhaustive match beside the resolver whose errors it reads; a TreeError variant added later must be classified here before the crate compiles, and NotALeaf, which the resolver never yields, proves nothing. The verdict's serving answer and presence answer are exhaustive matches here too, so a Membership variant added later is named before the crate compiles and the serving boundary (eprfs-serve) has no wildcard arm."
      - id: C5
        status: answered
        justification: "Integrity and Invalid for a spine node are Integrity, never Unknown."
      - id: C6a
        status: answered
        justification: "Bounded by resolve_links' one Budget per batch."
      - id: C6b
        status: answered
        justification: "Pure over immutable CIDs."
      - id: C7
        status: n-a
        justification: "Which tiers are asked is the caller's chain."
      - id: C8
        status: n-a
        justification: "The serving caller counts each verdict."
      - id: C9
        status: n-a
        justification: "No lineage."
      - id: C10
        status: answered
        justification: "New in this release; additive, non-exhaustive."
      - id: C11
        status: n-a
        justification: "No fan-out."
      - id: C12
        status: answered
        justification: "A verdict of place, never of reach: reach is the ReachGate's, judged before it."
      - id: C13
        status: n-a
        justification: "The same at every stage."
      - id: C14
        status: partial
        justification: "Typed verdicts; witnesses are the caller's."
