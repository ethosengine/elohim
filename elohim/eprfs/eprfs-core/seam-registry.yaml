# Artifact-neutral byte addressing, canonical private trees, and local closure
# verification. None of these surfaces elects or publishes a release head.
seamRegistryVersion: 1
crate: eprfs-core
crateRoot: elohim/eprfs/eprfs-core
seamLocus: >
  BlobCid addressing and the versioned canonical tree are artifact-neutral
  byte-integrity contracts. They never decide which release is authoritative.
decisionPoints:
  - name: canonical_tree_and_verified_closure
    kind: boundary-answer-type
    sourceLocation:
      file: src/tree.rs
      modulePath: eprfs_core::tree
    summary: >
      Encode version-one byte-name trees canonically, validate links and bounds,
      then fetch and rehash the complete local byte closure before reporting it.
      Opaque external boundaries remain explicit and unverified.
    concernIds:
      - id: C0
        status: answered
        justification: Private content custody and local projection; no reach or election.
      - id: C1
        status: n-a
        justification: No release candidate is elected.
      - id: C2
        status: n-a
        justification: Content CIDs impose no head order or authority clock.
      - id: C3
        status: answered
        justification: One bounded walk returns success or typed refusal, with no retry loop.
      - id: C4
        status: answered
        justification: Missing bytes, integrity failure, schema refusal, and budget refusal are distinct results; external boundaries are separately reported.
      - id: C5
        status: partial
        justification: Every fetched node and leaf is rehashed; neither signatures nor standing are authenticated.
      - id: C6a
        status: partial
        justification: Encoded node, entry, depth, path, pending-frontier, and expanded byte ceilings are enforced; the storage adapter must bound its own fetch allocation and time.
      - id: C6b
        status: answered
        justification: Canonical encoding and immutable CIDs make repeated read-only walks deterministic; no effects are replayed.
      - id: C7
        status: partial
        justification: Opaque external boundaries are reported and never claimed complete, but remote delivery is outside this crate.
      - id: C8
        status: partial
        justification: Typed error variants expose refusals; operational telemetry belongs to callers.
      - id: C9
        status: n-a
        justification: No actor, identity key, or lineage is interpreted.
      - id: C10
        status: answered
        justification: Additive version-one schema rejects unknown fields and noncanonical bytes; prior BlobCid and EprMeta wire formats remain untouched.
      - id: C11
        status: n-a
        justification: No listener, network ingress, or background retry is added.
      - id: C12
        status: answered
        justification: Callers explicitly select local bytes; a tree CID does not authorize publication or execution.
      - id: C13
        status: n-a
        justification: No authority scaffold or fallback tier is introduced.
      - id: C14
        status: partial
        justification: Every refusal returns a Result; durable witnesses belong to callers.
    contractTests:
      - path: elohim/eprfs/eprfs-core/src/tree.rs
        testName: canonical_tree_sorts_raw_names_and_round_trips
        kind: unit
      - path: elohim/eprfs/eprfs-core/src/tree.rs
        testName: closure_verifies_leaf_and_reports_external_boundary
        kind: unit
    notes: >
      Expected head-plane cost is zero at seed and one year. This is content
      storage only, with no DHT type, coordinator, route, or release A2 linkage.
  - name: recompute_for_codec
    kind: pure-decision-predicate
    sourceLocation:
      file: src/address.rs
      modulePath: eprfs_core::address::BlobCid::recompute_for_codec
    summary: >
      Recompute raw or DAG-CBOR CID bytes under the requested CID's codec, returning
      None for every unsupported codec.
    concernIds:
      - id: C0
        status: answered
        justification: >
          This is byte addressing on the local custody/projection plane, not
          reach, release-head selection or standing.
      - id: C1
        status: n-a
        justification: It selects no locally authored candidate or release head.
      - id: C2
        status: n-a
        justification: It imposes no version order or authority clock.
      - id: C3
        status: n-a
        justification: It is a pure byte computation, not a state machine.
      - id: C4
        status: answered
        justification: >
          Unsupported codec returns None; supported codecs return a recomputed CID
          even when its digest does not match the expected CID.
      - id: C5
        status: partial
        justification: >
          It permits local digest re-derivation, but it does not authenticate
          signatures, lineage, standing or any carried authority claim.
      - id: C6a
        status: partial
        justification: >
          Hashing is linear in the supplied bytes but this API declares no maximum
          blob size or execution budget; callers own their input limits.
      - id: C6b
        status: n-a
        justification: The function is pure and has no replayed effect.
      - id: C7
        status: n-a
        justification: It advertises no remote capability or inventory.
      - id: C8
        status: n-a
        justification: It emits no operational decision or metric; caller observes None.
      - id: C9
        status: n-a
        justification: It references no agent or key lineage.
      - id: C10
        status: answered
        justification: >
          Existing DAG-CBOR and raw CIDs retain their declared codec; the
          independent raw golden vector and unsupported-codec test pin the contract.
      - id: C11
        status: n-a
        justification: It schedules no external load or retry.
      - id: C12
        status: n-a
        justification: It authorizes no publication, execution or peer action.
      - id: C13
        status: n-a
        justification: The byte-integrity floor does not vary by authority tier.
      - id: C14
        status: partial
        justification: >
          Unsupported codec is explicit as None, but this pure helper emits no
          durable witness; callers must record their own refusal outcome.
    contractTests:
      - path: elohim/eprfs/eprfs-core/src/address.rs
        testName: recompute_preserves_requested_codec_and_external_raw_vector
        kind: unit
      - path: elohim/eprfs/eprfs-core/src/address.rs
        testName: verifies_fails_closed_on_unknown_codec
        kind: unit
    notes: >
      The method is additive to BlobCid; serde and canonical bytes are unchanged.
      It does not introduce a canonical tree or attest to release authority.
  - name: BlobLink
    kind: boundary-answer-type
    sourceLocation:
      file: src/address.rs
      modulePath: eprfs_core::address::BlobLink
    summary: >
      Represent an existing BlobCid as a DAG-CBOR tag-42 link in canonical
      fields and as a validated CID string on human-readable surfaces.
    concernIds:
      - id: C0
        status: answered
        justification: >
          This is immutable content addressing and byte representation, not
          head selection, transport reach, or publication standing.
      - id: C1
        status: n-a
        justification: It elects no candidate or release head.
      - id: C2
        status: n-a
        justification: It changes no declared head or version order.
      - id: C3
        status: n-a
        justification: Serialization is pure and has no state loop.
      - id: C4
        status: answered
        justification: >
          Malformed JSON CIDs and CBOR text in a link position return decode
          errors; the negative contract test pins both refusals.
      - id: C5
        status: partial
        justification: >
          Tag 42 establishes link structure only. The wrapper does not fetch or
          verify referenced bytes, provenance, signatures, or standing.
      - id: C6a
        status: partial
        justification: >
          CID parsing has a bounded address shape, but this type imposes no
          enclosing CBOR or JSON input-size budget; callers must do so.
      - id: C6b
        status: n-a
        justification: This pure codec has no replayed side effect.
      - id: C7
        status: partial
        justification: >
          Local tag-42 interoperability is pinned by a fixed vector, but the
          wrapper advertises no remote inventory or serve guarantee.
      - id: C8
        status: partial
        justification: >
          Decode failures are returned through serde errors; this type emits no
          aggregate operational metric.
      - id: C9
        status: n-a
        justification: A content CID carries no agent or key lineage.
      - id: C10
        status: answered
        justification: >
          Frozen old BlobCid string CBOR and JSON forms remain unchanged; new
          BlobLink tag-42 CBOR and string JSON forms are explicitly pinned, and
          old CBOR text is refused when a link is required.
      - id: C11
        status: n-a
        justification: The codec schedules no external load or retry.
      - id: C12
        status: n-a
        justification: A parsed CID authorizes no publication, execution, or peer action.
      - id: C13
        status: n-a
        justification: The byte format is the same at every declared network stage.
      - id: C14
        status: partial
        justification: >
          Decode refusal is returned but no durable witness is emitted; the
          enclosing caller must record its own outcome.
    contractTests:
      - path: elohim/eprfs/eprfs-core/src/address.rs
        testName: blob_link_has_explicit_human_and_canonical_forms
        kind: unit
      - path: elohim/eprfs/eprfs-core/src/address.rs
        testName: blob_link_rejects_wrong_cbor_representation_and_invalid_json
        kind: unit
    notes: >
      This is a wire wrapper over BlobCid, not a new persistent entity. It adds
      no DHT entry, head-plane cost, route, transport, or authority. Existing
      BlobCid fields and EprMeta v1 bytes are not migrated by this addition.
  - name: validate
    kind: verdict-fn
    sourceLocation:
      file: src/projection.rs
      modulePath: eprfs_core::projection::ProjectionManifest::validate
    summary: >
      Recheck every projection path with ProjectionPath::new before materialization;
      ProjectionPath deserialization uses that same constructor and retains the
      existing string wire format.
    concernIds:
      - id: C0
        status: answered
        justification: >
          This is local projection lexical-path validation, not content authority
          or filesystem containment.
      - id: C1
        status: n-a
        justification: No head or candidate is selected.
      - id: C2
        status: n-a
        justification: No version order is changed.
      - id: C3
        status: n-a
        justification: Validation is a preflight predicate, not a state machine.
      - id: C4
        status: answered
        justification: Absolute, parent, empty and current-directory paths refuse explicitly.
      - id: C5
        status: partial
        justification: A relative path is checked, but this does not authenticate its manifest.
      - id: C6a
        status: partial
        justification: The pass is linear in entries with no manifest-size budget here.
      - id: C6b
        status: n-a
        justification: Validation has no replayed side effect.
      - id: C7
        status: partial
        justification: One decoded projection is guarded; safe whole-tree restore is unfinished.
      - id: C8
        status: partial
        justification: Invalid paths return an error but no typed aggregate metric.
      - id: C9
        status: n-a
        justification: No agent or key lineage is examined.
      - id: C10
        status: answered
        justification: Valid paths retain their string serialization and round trip.
      - id: C11
        status: n-a
        justification: No external load or retry is scheduled.
      - id: C12
        status: n-a
        justification: No publication, execution or peer action is authorized.
      - id: C13
        status: n-a
        justification: The local path rule does not vary by authority tier.
      - id: C14
        status: partial
        justification: Refusal is explicit but no durable witness is emitted.
    contractTests:
      - path: elohim/eprfs/eprfs-core/src/projection.rs
        testName: serialized_projection_paths_obey_constructor_invariants
        kind: unit
      - path: elohim/eprfs/eprfs-core/src/projection.rs
        testName: manifest_revalidates_paths_before_materialization
        kind: unit
      - path: elohim/eprfs/eprfs-local/tests/materialization_integrity.rs
        testName: serialized_escape_cannot_write_outside_projection_root
        kind: integration
    notes: >
      This closes the serialized traversal bypass only. Existing symlink ancestors
      and filesystem races can still redirect writes; symlink replacement and
      complete-tree promotion are not atomic in this slice.
  - name: walk
    kind: pure-decision-predicate
    sourceLocation:
      file: src/walk.rs
      modulePath: eprfs_core::walk::walk
      line: 867
    summary: "Walk a root under a view, fetching only the spine to each view path and the nodes below it, each verified against its parent's link and bounded by TreeLimits on what it visits; an object no tier gave is a named absence and the walk continues."
    concernIds:
      - id: C0
        status: answered
        justification: "Byte custody of a tree whose root the reader holds; reach is the tier side's, injected."
      - id: C1
        status: n-a
        justification: "No candidate or release head is elected."
      - id: C2
        status: n-a
        justification: "A root CID imposes no head order or clock."
      - id: C3
        status: answered
        justification: "One bounded pull cursor: every frame is visited once, and a missing node ends its branch with a named absence, never a retry loop."
      - id: C4
        status: answered
        justification: "NotHeld only when every tier asked observed it absent; Withheld for refused, over budget, unreachable or membership unknown; NotFound and ThroughLeaf for a held tree; integrity is an error, never an absence."
      - id: C5
        status: partial
        justification: "Every node is rehashed against its link; signatures and standing are not authenticated here."
      - id: C6a
        status: answered
        justification: "Depth, entries, path bytes, pending frontier, node bytes, expanded bytes and kept result paths are charged against TreeLimits before descent."
      - id: C6b
        status: answered
        justification: "Immutable CIDs make a repeated walk deterministic; nothing is written."
      - id: C7
        status: partial
        justification: "External boundaries are reported and never followed; remote delivery is the tier's."
      - id: C8
        status: partial
        justification: "WalkStats counts nodes fetched, reused, bytes and entries; per-tier counters live in the chain."
      - id: C9
        status: n-a
        justification: "No agent or key lineage is read."
      - id: C10
        status: partial
        justification: "The slice-1 names are renamed under decision 12 (Placement to Coverage), a 0.2.0 break recorded beside TreeError's non_exhaustive mark."
      - id: C11
        status: n-a
        justification: "No listener or background retry."
      - id: C12
        status: n-a
        justification: "Walking authorizes nothing."
      - id: C13
        status: n-a
        justification: "The walk is the same at every network stage."
      - id: C14
        status: partial
        justification: "Absences carry ruling 7's three parts; durable witnesses are the caller's."
    contractTests:
      - path: elohim/eprfs/eprfs-core/src/walk.rs
        testName: walk_ten_thousand_entries_three_path_view_fetches_only_spine
        kind: unit
      - path: elohim/eprfs/eprfs-core/src/walk.rs
        testName: walk_missing_subtree_is_named_not_held_and_walk_continues
        kind: unit
      - path: elohim/eprfs/eprfs-core/src/tier.rs
        testName: refused_or_unreachable_tiers_yield_withheld_and_the_walk_continues
        kind: unit
      - path: elohim/eprfs/eprfs-core/src/walk.rs
        testName: absences_of_a_shared_subtrees_missing_children_are_metered
        kind: unit
      - path: elohim/eprfs/eprfs-core/src/walk.rs
        testName: an_absence_cannot_name_one_reason_and_carry_another
        kind: unit
    notes: "The headline check of habit materialize-what-is-read. walk_batched shares this walk's matching and budget through walk.rs expand. walk_collect charges every kept node and absence to result path bytes as it keeps it."
  - name: walk_batched
    kind: pure-decision-predicate
    sourceLocation:
      file: src/level_walk.rs
      modulePath: eprfs_core::level_walk::walk_batched
      line: 277
    summary: "Drive the sans-I/O LevelWalk with one fetch_blobs per tree level chunk, re-sending unseen items once; its result equals the depth-first walk's on every view."
    concernIds:
      - id: C0
        status: answered
        justification: "As walk: byte custody under a root the reader holds."
      - id: C1
        status: n-a
        justification: "No election."
      - id: C2
        status: n-a
        justification: "No head order."
      - id: C3
        status: answered
        justification: "Each level chunk is asked at most twice, then an unseen item is named Unreachable by the tier asked (LevelWalk::unanswered): Withheld from a remote tier, never NotHeld, so a silent tier cannot stall the walk; the own store's silence is an error, as in walk."
      - id: C4
        status: answered
        justification: "The same absence vocabulary as walk; an own-store storage failure and integrity are errors."
      - id: C5
        status: partial
        justification: "Every offered node is rehashed against its link before decoding."
      - id: C6a
        status: answered
        justification: "Level chunks are bounded by max_pending_entries; a whole queued level is charged its retained size (path bytes, a fixed per-component and per-frame charge, no ancestor list) to pending path bytes; what the result keeps is charged as it is kept; bytes and entries as walk. Answers are offered to the walk as they arrive, matched through a hash set; an unrequested or repeated answer is dropped before it is kept, and the tier is stopped once the chunk is answered or it overruns it."
      - id: C6b
        status: answered
        justification: "Order-invariant within a level; deterministic over immutable CIDs."
      - id: C7
        status: partial
        justification: "It asks one tier interface; which tiers exist is the chain's."
      - id: C8
        status: partial
        justification: "WalkStats equal to the depth-first walk's."
      - id: C9
        status: n-a
        justification: "No lineage."
      - id: C10
        status: answered
        justification: "New in this release; additive."
      - id: C11
        status: answered
        justification: "Depth plus one round trips; no background retry beyond the one re-send."
      - id: C12
        status: n-a
        justification: "Authorizes nothing."
      - id: C13
        status: n-a
        justification: "The same at every stage."
      - id: C14
        status: partial
        justification: "Absences carry the three parts; witnesses are the caller's."
    contractTests:
      - path: elohim/eprfs/eprfs-core/src/level_walk.rs
        testName: level_equivalence_on_the_slice_one_views
        kind: unit
      - path: elohim/eprfs/eprfs-core/src/level_walk.rs
        testName: level_batching_costs_one_fetch_blobs_per_level_for_the_headline_view
        kind: unit
      - path: elohim/eprfs/eprfs-core/src/level_walk.rs
        testName: an_item_never_answered_is_withheld_unreachable_never_not_held
        kind: unit
      - path: elohim/eprfs/eprfs-core/src/level_walk.rs
        testName: the_own_store_leaving_an_item_unanswered_is_an_error_not_an_absence
        kind: unit
      - path: elohim/eprfs/eprfs-core/src/tier.rs
        testName: a_tampering_outer_tier_is_an_integrity_error_in_every_walk
        kind: unit
      - path: elohim/eprfs/eprfs-core/src/tier.rs
        testName: the_own_store_failing_a_read_is_a_storage_error_in_every_walk
        kind: unit
      - path: elohim/eprfs/eprfs-core/src/walk.rs
        testName: the_level_walk_meters_the_paths_it_keeps_as_it_keeps_them
        kind: unit
      - path: elohim/eprfs/eprfs-core/src/walk.rs
        testName: queued_frame_charge_covers_the_frame
        kind: unit
    notes: "Interfaces spec \u00a7B.1. The level-batched twin of the headline walk: 3 calls for the 7 spine nodes."
  - name: ItemAbsence
    kind: boundary-answer-type
    sourceLocation:
      file: src/tier.rs
      modulePath: eprfs_core::tier::ItemAbsence
      line: 280
    summary: "The typed reason a tier gives for an item it did not deliver: observed not held (with every tier tried), refused by reach, over budget, unreachable, membership unknown, or failed integrity; always inside Unanswered with when to come back and what is local meanwhile."
    concernIds:
      - id: C0
        status: answered
        justification: "Names who answered by TierId, never as attribution; reach refusals carry no reach value."
      - id: C1
        status: n-a
        justification: "No election."
      - id: C2
        status: n-a
        justification: "No head order; the come-back time is the gate's."
      - id: C3
        status: answered
        justification: "Every absence names its come-back event or time."
      - id: C4
        status: answered
        justification: "Only BlobNotFound or BlobNotLocal map to NotHeld; I/O and storage failures are Unreachable, a corrupt object Integrity."
      - id: C5
        status: n-a
        justification: "A reason, not a verification."
      - id: C6a
        status: n-a
        justification: "A value type."
      - id: C6b
        status: n-a
        justification: "A value type."
      - id: C7
        status: answered
        justification: "NotHeld.tried lists every tier asked, in order, by the dialled ids."
      - id: C8
        status: answered
        justification: "eprfs-serve's ItemAbsenceLabel face passes check_reason_labels, one label per variant."
      - id: C9
        status: n-a
        justification: "A tier id is never read as attribution."
      - id: C10
        status: answered
        justification: "Kind-tagged kebab-case with camelCase fields, pinned by the shared vectors; non_exhaustive."
      - id: C11
        status: n-a
        justification: "No load is scheduled."
      - id: C12
        status: n-a
        justification: "Authorizes nothing."
      - id: C13
        status: n-a
        justification: "The same at every stage."
      - id: C14
        status: partial
        justification: "The three parts are carried; witnesses are the caller's."
    contractTests:
      - path: elohim/eprfs/eprfs-core/src/tier.rs
        testName: item_absence_wire_form_is_kind_tagged_camel_case
        kind: unit
      - path: elohim/eprfs/eprfs-core/src/tier.rs
        testName: from_error_maps_only_not_found_to_not_held
        kind: unit
      - path: elohim/eprfs/eprfs-serve/src/labels.rs
