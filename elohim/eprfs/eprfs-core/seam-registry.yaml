# Artifact-neutral byte addressing, canonical private trees, and local closure
# verification. None of these surfaces elects or publishes a release head.
seamRegistryVersion: 1
crate: eprfs-core
crateRoot: elohim/eprfs/eprfs-core
seamLocus: >
  BlobCid addressing and the versioned canonical tree are artifact-neutral
  byte-integrity contracts. They never decide which release is authoritative.
decisionPoints:
  - name: canonical_tree_and_verified_closure
    kind: boundary-answer-type
    sourceLocation:
      file: src/tree.rs
      modulePath: eprfs_core::tree
    summary: >
      Encode version-one byte-name trees canonically, validate links and bounds,
      then fetch and rehash the complete local byte closure before reporting it.
      Opaque external boundaries remain explicit and unverified.
    concernIds:
      - id: C0
        status: answered
        justification: Private content custody and local projection; no reach or election.
      - id: C1
        status: n-a
        justification: No release candidate is elected.
      - id: C2
        status: n-a
        justification: Content CIDs impose no head order or authority clock.
      - id: C3
        status: answered
        justification: One bounded walk returns success or typed refusal, with no retry loop.
      - id: C4
        status: answered
        justification: Missing bytes, integrity failure, schema refusal, and budget refusal are distinct results; external boundaries are separately reported.
      - id: C5
        status: partial
        justification: Every fetched node and leaf is rehashed; neither signatures nor standing are authenticated.
      - id: C6a
        status: partial
        justification: Encoded node, entry, depth, path, pending-frontier, and expanded byte ceilings are enforced; the storage adapter must bound its own fetch allocation and time.
      - id: C6b
        status: answered
        justification: Canonical encoding and immutable CIDs make repeated read-only walks deterministic; no effects are replayed.
      - id: C7
        status: partial
        justification: Opaque external boundaries are reported and never claimed complete, but remote delivery is outside this crate.
      - id: C8
        status: partial
        justification: Typed error variants expose refusals; operational telemetry belongs to callers.
      - id: C9
        status: n-a
        justification: No actor, identity key, or lineage is interpreted.
      - id: C10
        status: answered
        justification: Additive version-one schema rejects unknown fields and noncanonical bytes; prior BlobCid and EprMeta wire formats remain untouched.
      - id: C11
        status: n-a
        justification: No listener, network ingress, or background retry is added.
      - id: C12
        status: answered
        justification: Callers explicitly select local bytes; a tree CID does not authorize publication or execution.
      - id: C13
        status: n-a
        justification: No authority scaffold or fallback tier is introduced.
      - id: C14
        status: partial
        justification: Every refusal returns a Result; durable witnesses belong to callers.
    contractTests:
      - path: elohim/eprfs/eprfs-core/src/tree.rs
        testName: canonical_tree_sorts_raw_names_and_round_trips
        kind: unit
      - path: elohim/eprfs/eprfs-core/src/tree.rs
        testName: closure_verifies_leaf_and_reports_external_boundary
        kind: unit
    notes: >
      Expected head-plane cost is zero at seed and one year. This is content
      storage only, with no DHT type, coordinator, route, or release A2 linkage.
  - name: recompute_for_codec
    kind: pure-decision-predicate
    sourceLocation:
      file: src/address.rs
      modulePath: eprfs_core::address::BlobCid::recompute_for_codec
    summary: >
      Recompute raw or DAG-CBOR CID bytes under the requested CID's codec, returning
      None for every unsupported codec.
    concernIds:
      - id: C0
        status: answered
        justification: >
          This is byte addressing on the local custody/projection plane, not
          reach, release-head selection or standing.
      - id: C1
        status: n-a
        justification: It selects no locally authored candidate or release head.
      - id: C2
        status: n-a
        justification: It imposes no version order or authority clock.
      - id: C3
        status: n-a
        justification: It is a pure byte computation, not a state machine.
      - id: C4
        status: answered
        justification: >
          Unsupported codec returns None; supported codecs return a recomputed CID
          even when its digest does not match the expected CID.
      - id: C5
        status: partial
        justification: >
          It permits local digest re-derivation, but it does not authenticate
          signatures, lineage, standing or any carried authority claim.
      - id: C6a
        status: partial
        justification: >
          Hashing is linear in the supplied bytes but this API declares no maximum
          blob size or execution budget; callers own their input limits.
      - id: C6b
        status: n-a
        justification: The function is pure and has no replayed effect.
      - id: C7
        status: n-a
        justification: It advertises no remote capability or inventory.
      - id: C8
        status: n-a
        justification: It emits no operational decision or metric; caller observes None.
      - id: C9
        status: n-a
        justification: It references no agent or key lineage.
      - id: C10
        status: answered
        justification: >
          Existing DAG-CBOR and raw CIDs retain their declared codec; the
          independent raw golden vector and unsupported-codec test pin the contract.
      - id: C11
        status: n-a
        justification: It schedules no external load or retry.
      - id: C12
        status: n-a
        justification: It authorizes no publication, execution or peer action.
      - id: C13
        status: n-a
        justification: The byte-integrity floor does not vary by authority tier.
      - id: C14
        status: partial
        justification: >
          Unsupported codec is explicit as None, but this pure helper emits no
          durable witness; callers must record their own refusal outcome.
    contractTests:
      - path: elohim/eprfs/eprfs-core/src/address.rs
        testName: recompute_preserves_requested_codec_and_external_raw_vector
        kind: unit
      - path: elohim/eprfs/eprfs-core/src/address.rs
        testName: verifies_fails_closed_on_unknown_codec
        kind: unit
    notes: >
      The method is additive to BlobCid; serde and canonical bytes are unchanged.
      It does not introduce a canonical tree or attest to release authority.
  - name: BlobLink
    kind: boundary-answer-type
    sourceLocation:
      file: src/address.rs
      modulePath: eprfs_core::address::BlobLink
    summary: >
      Represent an existing BlobCid as a DAG-CBOR tag-42 link in canonical
      fields and as a validated CID string on human-readable surfaces.
    concernIds:
      - id: C0
        status: answered
        justification: >
          This is immutable content addressing and byte representation, not
          head selection, transport reach, or publication standing.
      - id: C1
        status: n-a
        justification: It elects no candidate or release head.
      - id: C2
        status: n-a
        justification: It changes no declared head or version order.
      - id: C3
        status: n-a
        justification: Serialization is pure and has no state loop.
      - id: C4
        status: answered
        justification: >
          Malformed JSON CIDs and CBOR text in a link position return decode
          errors; the negative contract test pins both refusals.
      - id: C5
        status: partial
        justification: >
          Tag 42 establishes link structure only. The wrapper does not fetch or
          verify referenced bytes, provenance, signatures, or standing.
      - id: C6a
        status: partial
        justification: >
          CID parsing has a bounded address shape, but this type imposes no
          enclosing CBOR or JSON input-size budget; callers must do so.
      - id: C6b
        status: n-a
        justification: This pure codec has no replayed side effect.
      - id: C7
        status: partial
        justification: >
          Local tag-42 interoperability is pinned by a fixed vector, but the
          wrapper advertises no remote inventory or serve guarantee.
      - id: C8
        status: partial
        justification: >
          Decode failures are returned through serde errors; this type emits no
          aggregate operational metric.
      - id: C9
        status: n-a
        justification: A content CID carries no agent or key lineage.
      - id: C10
        status: answered
        justification: >
          Frozen old BlobCid string CBOR and JSON forms remain unchanged; new
          BlobLink tag-42 CBOR and string JSON forms are explicitly pinned, and
          old CBOR text is refused when a link is required.
      - id: C11
        status: n-a
        justification: The codec schedules no external load or retry.
      - id: C12
        status: n-a
        justification: A parsed CID authorizes no publication, execution, or peer action.
      - id: C13
        status: n-a
        justification: The byte format is the same at every declared network stage.
      - id: C14
        status: partial
        justification: >
          Decode refusal is returned but no durable witness is emitted; the
          enclosing caller must record its own outcome.
    contractTests:
      - path: elohim/eprfs/eprfs-core/src/address.rs
        testName: blob_link_has_explicit_human_and_canonical_forms
        kind: unit
      - path: elohim/eprfs/eprfs-core/src/address.rs
        testName: blob_link_rejects_wrong_cbor_representation_and_invalid_json
        kind: unit
    notes: >
      This is a wire wrapper over BlobCid, not a new persistent entity. It adds
      no DHT entry, head-plane cost, route, transport, or authority. Existing
      BlobCid fields and EprMeta v1 bytes are not migrated by this addition.
  - name: validate
    kind: verdict-fn
    sourceLocation:
      file: src/projection.rs
      modulePath: eprfs_core::projection::ProjectionManifest::validate
    summary: >
      Recheck every projection path with ProjectionPath::new before materialization;
      ProjectionPath deserialization uses that same constructor and retains the
      existing string wire format.
    concernIds:
      - id: C0
        status: answered
        justification: >
          This is local projection lexical-path validation, not content authority
          or filesystem containment.
      - id: C1
        status: n-a
        justification: No head or candidate is selected.
      - id: C2
        status: n-a
        justification: No version order is changed.
      - id: C3
        status: n-a
        justification: Validation is a preflight predicate, not a state machine.
      - id: C4
        status: answered
        justification: Absolute, parent, empty and current-directory paths refuse explicitly.
      - id: C5
        status: partial
        justification: A relative path is checked, but this does not authenticate its manifest.
      - id: C6a
        status: partial
        justification: The pass is linear in entries with no manifest-size budget here.
      - id: C6b
        status: n-a
        justification: Validation has no replayed side effect.
      - id: C7
        status: partial
        justification: One decoded projection is guarded; safe whole-tree restore is unfinished.
      - id: C8
        status: partial
        justification: Invalid paths return an error but no typed aggregate metric.
      - id: C9
        status: n-a
        justification: No agent or key lineage is examined.
      - id: C10
        status: answered
        justification: Valid paths retain their string serialization and round trip.
      - id: C11
        status: n-a
        justification: No external load or retry is scheduled.
      - id: C12
        status: n-a
        justification: No publication, execution or peer action is authorized.
      - id: C13
        status: n-a
        justification: The local path rule does not vary by authority tier.
      - id: C14
        status: partial
        justification: Refusal is explicit but no durable witness is emitted.
    contractTests:
      - path: elohim/eprfs/eprfs-core/src/projection.rs
        testName: serialized_projection_paths_obey_constructor_invariants
        kind: unit
      - path: elohim/eprfs/eprfs-core/src/projection.rs
        testName: manifest_revalidates_paths_before_materialization
        kind: unit
      - path: elohim/eprfs/eprfs-local/tests/materialization_integrity.rs
        testName: serialized_escape_cannot_write_outside_projection_root
        kind: integration
    notes: >
      This closes the serialized traversal bypass only. Existing symlink ancestors
      and filesystem races can still redirect writes; symlink replacement and
      complete-tree promotion are not atomic in this slice.
