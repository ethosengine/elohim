[package]
name = "eprfs-core"
version = "0.3.4"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Core types and traits for EPR-governed filesystem projections"
publish = ["elohim"]

[dependencies]
async-trait.workspace = true
# `serde` so a served leaf (`ReadLeaf::bytes`) crosses a wire as one byte string.
bytes = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
serde_bytes = "0.11"
serde_ipld_dagcbor = "0.6"
thiserror.workspace = true
# The CID type itself (BlobLink's DAG-CBOR tag-42 form needs `serde-codec`).
cid = { version = "0.11", features = ["serde-codec"] }
# The one Rust addressing kernel (re-genesis 1, amended R1): every BlobCid constructor, the
# fail-closed verifier and the sha2-only short fingerprint delegate here, so eprfs mints no
# address of its own. A wasm-safe leaf (no tokio, no ts-rs, no serde_json), admitted by rail R-E1.
elohim-address = { version = "0.1.0", path = "../../../crates/elohim-address", registry = "elohim" }
# Ruling 7's shared `Unanswered<R>` (interfaces spec §2.0). A std/alloc leaf with zero
# first-party dependencies, admitted by rail R-E1 (`boundary::frozen_dependency_set`).
elohim-seam-contracts = { version = "0.1.0", path = "../../../crates/seam-contracts", registry = "elohim", features = ["serde"] }

[dev-dependencies]
# The byte profile's chunker, read by `tests/vectors.rs` to re-derive the shared chunker section.
# Dev-only: eprfs-core itself never chunks (R-E1 keeps elohim-epr's ts-rs out of the core).
elohim-epr = { path = "../../epr" }
serde_ipld_dagcbor = "0.6"
tokio.workspace = true
