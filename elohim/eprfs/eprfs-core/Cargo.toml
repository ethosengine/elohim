[package]
name = "eprfs-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Core types and traits for EPR-governed filesystem projections"
publish = ["elohim"]

[dependencies]
async-trait.workspace = true
# `serde` so a served leaf (`ReadLeaf::bytes`) crosses a wire as one byte string.
bytes = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
serde_bytes = "0.11"
serde_ipld_dagcbor = "0.6"
thiserror.workspace = true
# The protocol's canonical content-addressing base crates — the SAME ones elohim-epr uses
# (elohim/epr/src/cid.rs: CIDv1, 0x71 dag-cbor, sha2-256). Consuming these keeps eprfs-core lean
# (no crypto/ts-rs from the full atom codec) while making BlobCid a real, verifiable fingerprint.
cid = { version = "0.11", features = ["serde-codec"] }
multihash-codetable = { version = "0.2", features = ["sha2"] }
# Ruling 7's shared `Unanswered<R>` (interfaces spec §2.0). A std/alloc leaf with zero
# first-party dependencies, admitted by rail R-E1 (`boundary::frozen_dependency_set`).
elohim-seam-contracts = { version = "0.1.0", path = "../../../crates/seam-contracts", registry = "elohim", features = ["serde"] }

[dev-dependencies]
serde_ipld_dagcbor = "0.6"
tokio.workspace = true
