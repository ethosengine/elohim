  - name: steward_lease_view
    kind: verdict-fn
    sourceLocation:
      file: src/lease_view.rs
      modulePath: eprfs_peer::steward_lease_view
    summary: "Whether a lease on a steward-scoped resource (StewardScope: dev-integration, jenkins-dispatch, alpha-fleet, lane:<id>) holds across one person's devices, read from the device's one channel store (the flow store epr peer serve projects, recorded in heads.json). Leases are replayed from dev-berth-events@1 records, this device's own in store order and those folded via an admitted device in that device's order (its berth record counter dseq, which a clock step cannot reorder) (a contested device's are ignored entirely; a device the roster does not admit gets no view). Another device's lease precedes this device's when this device's claim was written after it reached the store, or when neither claim saw the other and it wins the tie-break (earlier claimed_at, then lower device did:key); a lease whose claim carries a seen vector reaching the head that carried ours never precedes ours, whatever the clocks. A preceding lease is HeldBy. This device's lease otherwise is Effective once every other admitted device's last folded head acknowledges the first own head that carried the claim (HeadTable.own_log by store position, each entry proven against the store by the CID of the last event it counted), Pending until confirm_wait_s from the claim's write, then Unconfirmed naming the silent device; an offline-ok override record makes it Effective at once and binds the others as an ordinary lease. With no other admitted device a claim is Effective at once."
    concernIds:
      - id: C0
        status: answered
        justification: "Pure over this device's own flow store, head table and roster: nothing is asked over the network; epr peer leases prints it for berth."
      - id: C1
        status: answered
        justification: "Only concurrent claims are settled by the tie-break over values each claim's own device recorded (claimed_at, then device did:key, then session); a claim written after its writer saw the other lease yields, known exactly by the writer from its store order and by the other device from the claim's seen vector. Where the two sides know differently both yield, never both hold."
      - id: C2
        status: answered
        justification: "An acknowledgement counts only for an own head projected from a store already holding the claim (own_log.events >= the claim's store position) and counted over this same store (own_log.last is the store's event at that position); a head announced after the claim's stamp but projected before it reached the store, or counted over a reset store, confirms nothing."
      - id: C3
        status: answered
        justification: "A device that does not acknowledge within confirm_wait_s reads Unconfirmed, naming it and when it was last folded; an absent device is never a free resource."
      - id: C4
        status: answered
        justification: "Effective, Pending, Unconfirmed and HeldBy are distinct verdicts; HeldBy wins over Unconfirmed."
      - id: C5
        status: answered
        justification: "Only folded leases of admitted devices count; a Contest removes the device's leases and its acknowledgement duty together."
      - id: C6a
        status: answered
        justification: "Linear in the berth records of the channel store; the own log keeps the last 1024 new roots (a periodic re-announce adds none)."
      - id: C6b
        status: n-a
        justification: "Reads only; the head table is replaced atomically by the daemon."
      - id: C7
        status: n-a
        justification: "Nothing is advertised."
      - id: C8
        status: answered
        justification: "Every verdict names its device, session and times; berth prints one reason line from it."
      - id: C9
        status: answered
        justification: "A head table written before own_log existed loads with an empty log: claims then read Pending, never Effective, until the next announce."
      - id: C10
        status: answered
        justification: "New; reads the T1 berth record fields and the T5 head table."
      - id: C11
        status: n-a
        justification: "No fan-out."
      - id: C12
        status: answered
        justification: "A view that cannot be computed is a non-zero exit of epr peer leases, which berth refuses on; it is never read as free."
      - id: C13
        status: n-a
        justification: "The same at every stage."
      - id: C14
        status: partial
        justification: "Overrides and refusals are berth records on the flow store; the view itself is not witnessed."
    contractTests:
      - path: elohim/eprfs/eprfs-peer/tests/lease_view.rs
        testName: a_claim_every_other_device_acknowledged_is_effective
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/lease_view.rs
        testName: an_unacknowledged_claim_is_pending_then_unconfirmed_naming_the_device
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/lease_view.rs
        testName: an_ack_of_a_head_projected_before_the_claim_reached_the_store_does_not_confirm_it
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/lease_view.rs
        testName: a_folded_overlapping_lease_is_held_by_its_holder
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/lease_view.rs
        testName: a_concurrent_pair_is_settled_the_same_way_on_both_devices
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/lease_view.rs
        testName: a_contested_devices_leases_are_ignored_and_it_is_not_waited_for
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/lease_view.rs
        testName: with_no_other_admitted_device_a_claim_is_effective_at_once
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/lease_view.rs
        testName: an_own_log_that_counted_another_store_never_confirms_a_claim
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/lease_view.rs
        testName: a_lease_the_claimant_had_already_seen_is_not_overturned_by_its_earlier_clock
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/lease_view.rs
        testName: two_overrides_taken_while_the_link_was_down_are_settled_by_the_tie_break
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/lease_view.rs
        testName: another_devices_records_are_replayed_in_its_order_not_the_order_they_were_folded
        kind: integration
