# A device's iroh peer: its key, its endpoint, and admission of authenticated node ids.
seamRegistryVersion: 1
crate: eprfs-peer
crateRoot: elohim/eprfs/eprfs-peer
seamLocus: "The door between a device and the other devices of its own person: an inbound iroh peer is admitted only when the node id iroh authenticated in the handshake is named by a valid PeerEndpoint row of the same lineage in this device's own roster, and the device's eprfs tier is served on that door's ALPN to admitted devices only. The device's peer key is minted here and never leaves it."
decisionPoints:
  - name: admits
    kind: verdict-fn
    sourceLocation:
      file: src/admission.rs
      modulePath: eprfs_peer::Admission::admits
    summary: "Map an authenticated iroh node id to the device did:key whose valid PeerEndpoint row (highest device-signed seq, same chain_root, device standing on the roster, no conflict, equivocation or contest) names it, as elohim_epr_rea::admitted_endpoints reads the device's own roster; every other node id is refused. reload re-reads the rows, so a Contest written locally takes effect without a pull."
    concernIds:
      - id: C0
        status: answered
        justification: "Admission is a pure read of the roster in this device's own checkout — a repo-plane file that travels by git. Nothing is asked over the network, published or gossiped."
      - id: C1
        status: answered
        justification: "A node id cannot admit itself: only a row signed by a device standing in the lineage names it, and two devices claiming one node id are both refused."
      - id: C2
        status: answered
        justification: "Which endpoint row stands is decided by the device-signed seq inside epr-rea, never by line order, so replaying an old row cannot undo a rotation."
      - id: C3
        status: n-a
        justification: "A local, synchronous lookup; no peer is waited on."
      - id: C4
        status: answered
        justification: "Not admitted is one answer: unknown, superseded, contested and conflicting node ids all read None."
      - id: C5
        status: answered
        justification: "Every row is re-verified (CID recomputed on read, signature checked by the caller's verifier) before it confers admission."
      - id: C6a
        status: answered
        justification: "One pass over the roster rows per reload; admits is a map lookup."
      - id: C6b
        status: answered
        justification: "Read-only; reload replaces the map wholesale."
      - id: C7
        status: n-a
        justification: "Nothing is advertised."
      - id: C8
        status: partial
        justification: "The verdict is returned per call; the tier counts unadmitted requests (TierProtocol::counters); the gossip consumer counts its own (T5)."
      - id: C9
        status: answered
        justification: "Admission is per lineage (chain_root); a device's endpoint rotates by seq under its own signature, and a contested binding revokes it."
      - id: C10
        status: answered
        justification: "A new crate; node ids compare in the roster's canonical 64-lowercase-hex form, computed from the key bytes rather than iroh's Display."
      - id: C11
        status: n-a
        justification: "No fan-out."
      - id: C12
        status: answered
        justification: "Default deny, no admit-on-error path: an absent or empty roster admits nobody, an unreadable or tampered one is an error."
      - id: C13
        status: n-a
        justification: "The same at every stage."
      - id: C14
        status: partial
        justification: "The verdict is the consumer's to witness; this crate records none."
    contractTests:
      - path: elohim/eprfs/eprfs-peer/tests/admission.rs
        testName: admission_maps_node_id_to_device
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/admission.rs
        testName: an_unverifiable_endpoint_row_admits_nobody
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/admission.rs
        testName: reload_takes_a_rotation_and_a_revocation_at_once
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/admission.rs
        testName: roster_rows_come_from_the_devices_own_roster_file
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/endpoint.rs
        testName: an_inbound_peer_is_named_by_its_authenticated_node_id
        kind: integration
    notes: "Spec 2026-10-23-workspaces-cooperate-as-devices-design §3.1. The tier gate (StewardDevicesGate, T4) and gossip neighbour filter (T5) consume it."
  - name: load_or_generate
    kind: state-transition
    sourceLocation:
      file: src/key.rs
      modulePath: eprfs_peer::PeerKey::load_or_generate
    summary: "Load this device's iroh secret key, or mint one: written to an O_EXCL sibling created at mode 0600 and published by hard link (first writer wins). A key file open to group or others, or not 32 bytes, is refused and left as found — never repaired or regenerated, since a new key silently changes the device's node id."
    concernIds:
      - id: C0
        status: answered
        justification: "A device-local secret on the persistent config volume; never committed, copied, sent, printed or logged."
      - id: C1
        status: n-a
        justification: "No election."
      - id: C2
        status: n-a
        justification: "No head order."
      - id: C3
        status: n-a
        justification: "Local filesystem only."
      - id: C4
        status: answered
        justification: "Absent mints; exposed and corrupt are distinct refusals; any other I/O failure is reported with its path."
      - id: C5
        status: n-a
        justification: "No evidence is weighed."
      - id: C6a
        status: answered
        justification: "One 32-byte read or write."
      - id: C6b
        status: answered
        justification: "Concurrent first starts converge on the first published key; later starts only read."
      - id: C7
        status: n-a
        justification: "Nothing is advertised."
      - id: C8
        status: answered
        justification: "Each refusal names the file and why (mode or length); the secret is never in an error."
      - id: C9
        status: answered
        justification: "The node id is stable across restarts; a new key is a new PeerEndpoint row (rotation by seq), never an in-place regeneration."
      - id: C10
        status: answered
        justification: "Same file format as elohim-storage's iroh.key (32 raw ed25519 bytes)."
      - id: C11
        status: n-a
        justification: "No fan-out."
      - id: C12
        status: answered
        justification: "A key another account could read is refused rather than used."
      - id: C13
        status: n-a
        justification: "The same at every stage."
      - id: C14
        status: n-a
        justification: "No act to witness."
    contractTests:
      - path: elohim/eprfs/eprfs-peer/tests/key.rs
        testName: key_generated_once_with_mode_0600
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/key.rs
        testName: key_reused_across_restarts
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/key.rs
        testName: key_never_in_debug_output
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/key.rs
        testName: a_key_file_readable_by_group_or_others_is_refused
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/key.rs
        testName: a_key_file_of_the_wrong_length_is_refused_not_regenerated
        kind: integration
    notes: "Spec §3.1: the key lives at $XDG_CONFIG_HOME/epr/peer/iroh.key; the caller resolves that directory."
  - name: admit
    kind: verdict-fn
    sourceLocation:
      file: src/gate.rs
      modulePath: eprfs_peer::StewardDevicesGate::admit
    summary: "The device tier's ReachGate: a Requester is admitted for any root or object only when it is DeviceHeld and names a device did:key whose node id Admission admits at the moment of the request. StewardDevicesGate::requester builds the Requester from the connection's authenticated remote node id (never from the request); an unadmitted node id becomes Requester::anonymous, which the gate refuses, so eprfs-serve's TierEndpoint answers with its uniform OutsideStanding refusal."
    concernIds:
      - id: C0
        status: answered
        justification: "A stranger receives the same refusal, carrying no standing label, for a held root and an unknown one; its request never reaches the store."
      - id: C1
        status: answered
        justification: "The requester's identity is the node id iroh authenticated in the handshake, mapped through the device's own roster; nothing the peer sends names it."
      - id: C2
        status: n-a
        justification: "No head order."
      - id: C3
        status: answered
        justification: "Synchronous read of the shared admission; a poisoned lock refuses rather than waits."
      - id: C4
        status: answered
        justification: "Not admitted is one refusal (OutsideStanding, no label) whatever the reason: unknown, contested, rotated away or anonymous."
      - id: C5
        status: answered
        justification: "Admission re-verifies every roster row on reload; the gate only reads its verdict."
      - id: C6a
        status: answered
        justification: "Two map reads per request."
      - id: C6b
        status: answered
        justification: "Read-only; reload replaces admission under the write lock."
      - id: C7
        status: n-a
        justification: "Nothing is advertised."
      - id: C8
        status: answered
        justification: "TierProtocol::counters counts unadmitted requests; the stranger cannot tell them apart."
      - id: C9
        status: answered
        justification: "Admission is read on every request, so a reload that contests or rotates a device takes effect at its next request on an already-open connection."
      - id: C10
        status: answered
        justification: "New; implements eprfs-core's ReachGate unchanged."
      - id: C11
        status: n-a
        justification: "No fan-out."
      - id: C12
        status: answered
        justification: "Default deny; no admit-on-error path, and a poisoned lock admits nobody."
      - id: C13
        status: n-a
        justification: "The same at every stage."
      - id: C14
        status: partial
        justification: "Refusals are counted, not witnessed."
    contractTests:
      - path: elohim/eprfs/eprfs-peer/tests/tier_alpn.rs
        testName: admitted_device_reads_and_diffs_a_root
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/tier_alpn.rs
        testName: stranger_gets_uniform_refusal_for_held_and_unknown_roots
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/tier_alpn.rs
        testName: contested_device_refused_after_admission_reload
        kind: integration
    notes: "Spec §3.2. Mirrors eprfs-serve's an_unadmitted_requester_cannot_distinguish_private_and_unknown_roots over the wire."
  - name: tier_frames
    kind: boundary-answer-type
    sourceLocation:
      file: src/tier.rs
      modulePath: eprfs_peer::TierAnswer
    summary: "The tier ALPN's wire: one TierRequest (read, list or diff) per bidirectional stream and one TierAnswer back, each a big-endian u32 length plus canonical DAG-CBOR. One read_frame serves both directions: a length past the cap (requests 1 MiB by default, answers 16 MiB) is refused, and a body is read chunk by chunk as it arrives, never pre-allocated from the claimed length. TierLimits bounds the serving side before any request is read: each frame must arrive or leave within frame_deadline (10 s), at most max_streams_per_connection (8) streams of one connection are answered at once (further streams wait in QUIC flow control), and every connection shares one in_flight semaphore (64) taken at accept before any byte is read; a stream finding no permit is reset unread (shed). An answer past the server's cap is sent as Failed, never truncated. The client checks a Read leaf (path equals the requested path, bytes hash to its CID) and a List listing (path equals the requested path, entries encode to its CID)."
    concernIds:
      - id: C0
        status: answered
        justification: "Only the device's own store is served (no upstream chain), so nothing is forwarded on a peer's behalf."
      - id: C1
        status: n-a
        justification: "No election."
      - id: C2
        status: n-a
        justification: "No head order; T5 orders heads by seq."
      - id: C3
        status: answered
        justification: "Every frame has a deadline, so a header-only or trickling stream is reset and its permits returned; a peer closing its connection ends its streams' tasks."
      - id: C4
        status: answered
        justification: "TreeError::Unanswered crosses whole as Unanswered with ruling 7's three parts; any other tree error is Failed with its message."
      - id: C5
        status: partial
        justification: "The endpoint verifies the leaves it serves. tier_request checks self-consistency and path only: a Read leaf's path must equal the requested path and its bytes hash to its CID; a List listing's path must equal the requested path and its entries encode to its CID; a mismatch is TierLeafIntegrity, an answer of another kind is TierFrame. It does not check that the object lies under the requested root (that needs the spine); Diff answers are not checked."
      - id: C6a
        status: answered
        justification: "Frame lengths are capped in both directions and bodies are read as they arrive, so memory follows bytes received; per-connection and process-wide stream bounds cap concurrent work across all connections."
      - id: C6b
        status: answered
        justification: "The in-flight permit is an owned guard dropped with the stream's task on every path (answer, refusal, timeout, peer close, abort)."
      - id: C7
        status: n-a
        justification: "Nothing is advertised."
      - id: C8
        status: answered
        justification: "Counted: requests, unadmitted, refused frames, timed-out frames, shed streams, oversized answers (TierProtocol::counters), beside the endpoint's own ServeCounters."
      - id: C9
        status: answered
        justification: "The ALPN carries its version (/elohim/eprfs-tier/1.0.0); a wire change is a new ALPN."
      - id: C10
        status: answered
        justification: "The answer types are eprfs-core's own (ReadLeaf, DirListing, TreeChange, Unanswered<ItemAbsence>), serialized in their home crate; no second wire struct."
      - id: C11
        status: n-a
        justification: "No fan-out."
      - id: C12
        status: answered
        justification: "A frame that is oversize or does not decode is refused and its stream reset; the connection keeps serving."
      - id: C13
        status: n-a
        justification: "The same at every stage."
      - id: C14
        status: n-a
        justification: "No act to witness."
    contractTests:
      - path: elohim/eprfs/eprfs-peer/tests/tier_alpn.rs
        testName: an_oversize_request_frame_is_refused_before_it_is_read
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/tier_alpn.rs
        testName: admitted_device_reads_and_diffs_a_root
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/tier_alpn.rs
        testName: a_header_only_stream_is_dropped_at_the_deadline_and_its_permit_returned
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/tier_alpn.rs
        testName: the_in_flight_bound_holds_across_connections
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/tier_alpn.rs
        testName: a_connection_answers_at_most_its_stream_bound_at_once
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/tier_alpn.rs
        testName: an_answer_past_the_frame_cap_is_sent_as_failed
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/tier_alpn.rs
        testName: the_client_rejects_a_leaf_whose_bytes_fail_its_address
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/tier_alpn.rs
        testName: the_client_rejects_a_leaf_for_another_path
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/tier_alpn.rs
        testName: the_client_rejects_a_listing_that_is_not_its_cid
        kind: integration
      - path: elohim/eprfs/eprfs-peer/tests/tier_alpn.rs
        testName: the_client_refuses_an_answer_frame_past_its_cap
        kind: integration
    notes: "Spec §3.2. T5 asks a peer's tier for a channel diff through tier_call / tier_request."
