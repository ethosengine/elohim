[package]
name = "elohim-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JS execution runtime for server-side rendering at the Elohim peer boundary"

[dependencies]
# Light, V8-free home of the served omnibar element bytes/hash/path + inject helper.
# Re-exported through `chrome::element` so serving the static asset never needs deno_core.
elohim-chrome-asset = { path = "../elohim-chrome-asset" }
# The one addressing kernel: SSR bundles are fetched by byte CID and verified against it.
elohim-address = { path = "../../crates/elohim-address" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
tokio = { workspace = true }
deno_core.workspace = true
deno_error.workspace = true
url = "2.5"
zip = "9.0.5"
# Real OS entropy for the WebCrypto `crypto.getRandomValues` shim op. Since zip 9
# (which moved to getrandom 0.4) this direct dependency is the only getrandom 0.3
# edge in this crate's graph, so it costs one small extra compile; moving it to
# 0.4 (same `getrandom::fill` API) would remove that.
# Native builds here run with RUSTFLAGS="" so getrandom uses its default OS
# backend (the Linux `getrandom(2)` syscall) -- the workspace's custom-backend
# cfg (`--cfg getrandom_backend="custom"`, set only for the Holochain WASM
# builds) does NOT apply to this crate.
getrandom = "0.3"

[dev-dependencies]
reqwest.workspace = true
tokio = { workspace = true }
tempfile = "3"
# Example-only: render_url.rs surfaces console.* (routed through tracing) when
# diagnosing a stalling render. Not a runtime/production dependency.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
