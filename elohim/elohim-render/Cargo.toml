[package]
name = "elohim-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JS execution runtime for server-side rendering at the Elohim peer boundary"

[dependencies]
# Light, V8-free home of the served omnibar element bytes/hash/path + inject helper.
# Re-exported through `chrome::element` so serving the static asset never needs deno_core.
elohim-chrome-asset = { path = "../elohim-chrome-asset" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
tokio = { workspace = true }
deno_core.workspace = true
deno_error.workspace = true
url = "2.5"
zip = "2"
# Real OS entropy for the WebCrypto `crypto.getRandomValues` shim op. getrandom
# 0.3 is ALREADY in this crate's native build graph (transitively via `zip` and
# the `tempfile` dev-dep), so this direct dependency adds zero new compile cost.
# Native builds here run with RUSTFLAGS="" so getrandom uses its default OS
# backend (the Linux `getrandom(2)` syscall) -- the workspace's custom-backend
# cfg (`--cfg getrandom_backend="custom"`, set only for the Holochain WASM
# builds) does NOT apply to this crate.
getrandom = "0.3"

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"

[features]
default = []
