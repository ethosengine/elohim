[package]
name = "elohim-epr"
version = "0.1.0"
edition = "2021"
description = "Elohim Protocol canonical EPR codec — CBOR + CIDv1 + Ed25519 for the graph substrate"
license = "CAL-1.0"
repository = "https://github.com/ethosengine/elohim"
readme = "README.md"
keywords = ["elohim", "epr", "cbor", "cid", "p2p"]
categories = ["data-structures", "encoding", "cryptography"]
publish = ["elohim"]

[dependencies]
ipld-core = "0.4"
serde_ipld_dagcbor = "0.6"
cid = { version = "0.11", features = ["serde-codec"] }
multihash-codetable = { version = "0.2", features = ["sha2"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
rand_core = "0.6"
serde = { workspace = true, features = ["derive"] }
serde_bytes = "0.11"
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true, features = ["chrono-impl", "serde-compat"] }
hex.workspace = true

[dev-dependencies]
rand = "0.8"
jsonschema = "0.28"
