[package]
name = "elohim-epr"
version = "0.2.0"
edition = "2021"
description = "Elohim Protocol canonical EPR codec — CBOR + CIDv1 + Ed25519 for the graph substrate"
license = "MPL-2.0"
repository = "https://github.com/ethosengine/elohim"
readme = "README.md"
keywords = ["elohim", "epr", "cbor", "cid", "p2p"]
categories = ["data-structures", "encoding", "cryptography"]
publish = ["elohim"]

[dependencies]
ipld-core = "0.4"
serde_ipld_dagcbor = "0.6"
cid = { version = "0.11", features = ["serde-codec"] }
multihash-codetable = { version = "0.2", features = ["sha2", "blake3"] }
# The addressing kernel: byte, record and citation CIDs and the fail-closed verifier.
# Path for the monorepo, registry for consumers of the published crate (brit).
elohim-address = { path = "../../crates/elohim-address", version = "0.1.0", registry = "elohim" }
# The byte profile's chunker. Pinned exactly: the v2020 gear tables and cut semantics ARE
# the epoch-0 profile (src/profile.rs), and a minor bump must not move a chunk boundary.
fastcdc = "=5.0.0"
# Multikey Display (base58btc `z…`, the did:key method-specific identifier).
bs58 = "0.5"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
rand_core = "0.6"
serde = { workspace = true, features = ["derive"] }
serde_bytes = "0.11"
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true, features = ["chrono-impl", "serde-compat"] }
hex.workspace = true
# Decodes Subresource Integrity digests (npm/pnpm `integrity: sha512-<base64>`) for
# `cid::raw_cid_from_sri`. Already in Cargo.lock at 0.22.1 via other members.
base64 = "0.22"

[dev-dependencies]
rand = "0.8"
jsonschema = "0.28"
