[workspace]
resolver = "2"
members = [
    "constitution",
    "elohim-agent/elohim-agent-service",
    "elohim-agent/gate-client",
    "elohim-agent/gate-types",
    "elohim-agent/gate-client-zome",
    "elohim-agent/specialists/defender",
    "eae",
    "elohim-compute",
    "elohim-render",
    "elohim-token",
    "epr",
]
exclude = [
    "elohim-bitswap",
    "elohim-cache-core",
    "elohim-storage",
    "holochain",
    "rust-ipfs",
    "sdk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Elohim Protocol"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full", "sync"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# HTTP client for LLM backends
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
bytes = "1"

# Crypto for hash verification
sha2 = "0.10"
hex = "0.4"

# Utilities
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
uuid = { version = "1.16", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Streaming
tokio-stream = "0.1"
pin-project-lite = "0.2"

# HTTP server / middleware
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
axum = { version = "0.8" }
http = "1"
http-body-util = "0.1"

# TypeScript bindings
ts-rs = "10.0"

# Concurrent data structures
dashmap = "6.1"
deno_core = "0.339.0"

# Internal crate dependencies
constitution = { path = "constitution" }
elohim-agent = { path = "elohim-agent/elohim-agent-service" }
gate-client = { path = "elohim-agent/gate-client" }
gate-types = { path = "elohim-agent/gate-types" }
gate-client-zome = { path = "elohim-agent/gate-client-zome" }
eae = { path = "eae" }
