[package]
name = "gate-client"
description = "Cross-cutting wisdom-as-system-auth library for the Elohim Protocol gate interface. Called from every relational-impact write path."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Async runtime
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

# Error handling
thiserror.workspace = true

# Observability
tracing.workspace = true

# Time
chrono.workspace = true

# IDs
uuid.workspace = true

# Hashing (for GateContext::to_summary_cid)
sha2.workspace = true

# HTTP middleware
tower.workspace = true
http.workspace = true
bytes.workspace = true

# Internal
elohim-agent.workspace = true

# Optional: TypeScript export
# import-esm makes generated imports use ".js" extensions, compatible with
# NodeNext module resolution in the elohim-agent-sdk TypeScript package.
ts-rs = { workspace = true, optional = true, features = ["import-esm"] }

[features]
default = []
# Note: we deliberately do NOT forward the typescript feature to elohim-agent.
# The gate-client's TS-exported types (GateDecision, RelationalImpactEvent, etc.)
# do not reference any elohim-agent types — ConstitutionalReasoningSummary is a
# local placeholder owned by this crate. Enabling elohim-agent/typescript would
# cascade into constitution/typescript, which has un-bridged DateTime<Utc> fields.
typescript = ["ts-rs"]
# Exposes testing helpers (mock_allow/mock_decline/etc.) and the
# __test_set_decision_override mechanism to integration tests and downstream
# test crates.  Never enable in production builds.
testing = []

[dev-dependencies]
tokio-test = "0.4"
axum.workspace = true
http-body-util.workspace = true
tower = { workspace = true, features = ["util"] }

# Integration test: universal_band_integration requires the "testing" feature
# so that __test_set_decision_override and gate_client::testing are available.
[[test]]
name = "universal_band_integration"
required-features = ["testing"]

# Integration test: configure_runner singleton initialization. Uses a separate
# binary so each test run gets a fresh OnceLock state.
[[test]]
name = "configure_runner"

# Integration test: discernment-gate v1 seven-valence rules, end-to-end.
# Requires the "testing" feature for __test_set_decision_override and
# gate_client::testing helpers used in the override short-circuit test.
[[test]]
name = "discernment_gate_integration"
required-features = ["testing"]

# Integration test: reach-gate v1 attestation-graph reach computation, end-to-end.
# Requires the "testing" feature for __test_set_gate_ctx, __test_set_attestation_resolver,
# __test_set_decision_override, and gate_client::testing helpers.
[[test]]
name = "reach_gate_integration"
required-features = ["testing"]
