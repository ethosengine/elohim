[package]
name = "imagodei-types"
version = "0.1.0"
edition = "2021"
description = "Wire types for imagodei domain coordinator functions"

[dependencies]
holo_hash = { version = "0.7.0-dev.3", features = ["encoding"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
rmp-serde = "1"

[features]
default = []
ts = ["dep:ts-rs"]

[dependencies.ts-rs]
version = "10"
optional = true
