[package]
name = "elohim-bitswap"
version = "0.1.0"
edition = "2021"
description = "Bitswap block exchange protocol for Elohim nodes (forked from rust-ipfs libp2p-bitswap-next)"
license = "MIT OR Apache-2.0"

[dependencies]
# CID (matching elohim-storage)
cid = "0.11"

# P2P
libp2p = { version = "0.54", features = ["request-response"] }

# Async
async-trait = "0.1"
futures = "0.3"

# Utilities
fnv = "1"
tracing = "0.1"
thiserror = "1"
anyhow = "1"
unsigned-varint = { version = "0.8", features = ["futures", "asynchronous_codec"] }

# Metrics
prometheus = "0.13"
lazy_static = "1"
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
multihash-codetable = { version = "0.1", features = ["sha2"] }
