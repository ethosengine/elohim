  - name: FetchWindow
    kind: pure-decision-predicate
    sourceLocation:
      file: src/p2p/sync_round.rs
      modulePath: p2p::sync_round::FetchWindow
      line: 239
    summary: >
      Decides how many SyncChanges requests one peer may have in flight during a sync
      round and which document goes next, re-queueing a document at most once per round
      when the transport refused to carry its request.
    concernIds:
      - { id: C0, status: answered, justification: "Category-C in-memory round scheduling on the transport-neutral sync plane; no DHT entry type and no persisted state." }
      - { id: C1, status: n-a, justification: "Pacing decides only request order and concurrency; it elects no authority and reads no declaration." }
      - { id: C2, status: n-a, justification: "The window never moves content authority — deferring or dropping a fetch leaves every head exactly where it was." }
      - { id: C3, status: answered, justification: "Every issued slot frees on settle, from BOTH terminal paths (every response shape and every OutboundFailure), and the per-round map is dropped at round start (above the no-peers early return), so a lost settle costs one round rather than closing the window forever. The scheduler itself holds no lock; the libp2p call sites must BIND the in-flight-map removal before matching on it, because a MutexGuard left alive as an if-let scrutinee is re-taken by the settle path's re-fill and deadlocks the swarm event loop (review finding, fixed 2026-08-24)." }
      - { id: C4, status: answered, justification: "A configured zero window resolves to the default instead of issuing nothing forever, and every uncertain settle outcome (Ok, Other) frees the slot without a retry." }
      - { id: C5, status: n-a, justification: "The scheduler consumes no evidence; divergence is decided upstream by the caller's local-heads comparison." }
      - { id: C6a, status: answered, justification: "Work per round is bounded by the enumerated divergent set plus at most one re-queue per document; the io re-queue is capped by a per-round seen-set so a peer whose transport keeps refusing cannot create an unbounded round." }
      - { id: C6b, status: answered, justification: "Re-issuing a SyncChanges request is idempotent — have_heads is re-read at issue time and apply_changes converges on replay — so a re-queued document cannot double-apply." }
      - { id: C7, status: n-a, justification: "The window neither advertises nor serves bytes; it only paces requests this node makes." }
      - { id: C8, status: answered, justification: "One debug line per peer per round reports window/enqueued/issued/requeued_io/unreached/in_flight, and elohim_sync_fetch_window_requeued_total publishes the io re-queues against the existing elohim_sync_request_outcomes_total{result=\"io\"} series. The counter is keyed off settle's returned EFFECT (a #[must_use] bool), not off the Io outcome, so a doc that has spent its one re-queue is not published as one." }
      - { id: C9, status: n-a, justification: "Documents are keyed by doc_id inside one namespace already chosen by the caller; no identity namespace is joined or translated." }
      - { id: C10, status: answered, justification: "No wire field or request shape changes — the same SyncChanges requests are sent, only fewer at a time; an unwindowed peer is unaffected in both directions." }
      - { id: C11, status: partial, justification: "The window bounds outbound sub-stream pressure on one connection, but it is a STATIC bound: it does not consume conductor_admission or any live backpressure signal, so a peer under load is paced by the configured constant rather than by what it can actually absorb." }
      - { id: C12, status: n-a, justification: "No custody enrollment occurs; the window volunteers no peer for anything." }
      - { id: C13, status: n-a, justification: "No authority tier is created or graduated." }
      - { id: C14, status: answered, justification: "Whatever a round does not reach stays visibly pending (logged as unreached) and is re-enumerated by the next round — the residual is the round itself, which is the plane's existing backstop." }
    contractTests:
      - { path: elohim/elohim-storage/src/p2p/sync_round.rs, testName: the_window_never_hands_out_more_than_n_at_once, kind: unit }
      - { path: elohim/elohim-storage/src/p2p/sync_round.rs, testName: an_io_settle_requeues_the_doc_exactly_once_per_round, kind: unit }
      - { path: elohim/elohim-storage/src/p2p/sync_round.rs, testName: an_ok_settle_frees_exactly_one_slot, kind: unit }
      - { path: elohim/elohim-storage/src/p2p/sync_round.rs, testName: an_other_settle_frees_the_slot_without_requeueing, kind: unit }
      - { path: elohim/elohim-storage/src/p2p/sync_round.rs, testName: drained_is_true_only_when_nothing_is_pending_or_in_flight, kind: unit }
      - { path: elohim/elohim-storage/src/p2p/sync_round.rs, testName: window_one_is_strictly_sequential, kind: unit }
      - { path: elohim/elohim-storage/src/p2p/sync_round.rs, testName: a_zero_window_is_the_default_not_a_deadlock, kind: unit }
      - { path: elohim/elohim-storage/src/p2p/sync_round.rs, testName: a_settle_with_pending_work_hands_out_the_next_doc, kind: unit }
      - { path: elohim/elohim-storage/src/p2p/sync_round.rs, testName: a_requeued_doc_returns_behind_the_docs_already_queued, kind: unit }
      - { path: elohim/elohim-storage/src/p2p/sync_round.rs, testName: settle_reports_the_requeue_effect_not_the_outcome, kind: unit }
    gapNote: >
      C11 is the honest gap: the window is a static bound (default 32, ELOHIM_SYNC_FETCH_WINDOW)
      and consumes no conductor_admission or live backpressure signal. Separately, the libp2p
      CALL SITES (the DocumentList enqueue, the response settle, and the OutboundFailure settle
      in src/p2p/mod.rs) have no unit harness — handle_sync_response requires a live swarm and
      tests/sync_libp2p_convergence.rs only MIRRORS it — so the two-peer recovery harness on the
      local mesh is the proof for the wiring, and these unit tests are the proof for the decision.
      That absent harness has already cost once: code review, not a test, caught a call-site
      MutexGuard-across-await deadlock the scheduler's own tests could never have seen.

  # ── Blob byte-route reach gate (2026-08-24 security fix) ──
  # Reach is enforced on the content route (`/db/content/{id}`) but was NOT on
  # the byte route (`GET /blob/{hash}`), so the same content leaked by hash.
  # Measured 2026-08-24 (two-peer mesh, full corpus): 38 gated blob-bearing
  # rows, all 38 leaking their CID via /epr-head, 36/38 bytes anonymously
  # retrievable. This is the byte-route half of `http-reach-enforcement-gap`.
  - name: blob_serve_verdict
    kind: verdict-fn
    sourceLocation:
      file: src/blob_reach.rs
      modulePath: blob_reach::blob_serve_verdict
      line: 119
    summary: >
      Given every content row that references a blob and whether the caller resolved to an
      identity, decides Serve / RequireIdentity{required_reach} / Authorize{candidates}. A blob
      serves iff SOME referencing row serves to that caller: an unreferenced blob serves (honest
      absence), any public/commons referencing row serves, otherwise identity is required, and
      above-community rows defer to per-reader authorization. Pure; the wiring
      (`HttpServer::blob_reach_refusal`) feeds it rows and renders 403.
    concernIds:
      - id: C7
        status: answered
        justification: >
          THE class this fix exists for: advertise/serve symmetry between the content route and
          the byte route. The content route (http.rs, `/db/content/{id}` Layer 1) refuses a
          non-public row to an unresolved caller; before this gate the byte route served the same
          bytes to anyone. `blob_serve_verdict` restores symmetry by deriving the byte's audience
          from the SAME reach on the SAME content rows the content route reads, via the shared
          `epr_service::reach_level_index`. Pinned by community_row_refuses_an_anonymous_caller
          and a_shared_blob_serves_when_any_referencing_row_is_public.
      - id: C12
        status: answered
        justification: >
          The consent gate for the byte route. RequireIdentity is returned when every referencing
          row is reach-gated and the caller resolved to no identity (community_row_refuses_an_
          anonymous_caller); above-community rows return Authorize, which the wiring fails CLOSED
          on until per-reader HTTP authz lands (same unblock as http-reach-enforcement-gap), so
          no gated body is disclosed. Identity is the EXPLICIT X-Agent-Cid the doorway injects,
          never header presence.
      - id: C4
        status: answered
        justification: >
          Honest absence is a decided branch, not a fallthrough: a blob with NO referencing
          content row serves (unreferenced_blob_serves_honest_absence), because shard bytes, app
          artifacts and blobs PUT before their content row have no audience to gate and failing
          closed on them would dark every such path. The verdict answers "no row claims these
          bytes" rather than guessing.
      - id: C13
        status: answered
        justification: >
          Graduated by declared reach: public/commons serve to anyone, community serves to any
          resolved identity, above-community defers to per-reader authorization — the same
          gradient the content route applies (index > community triggers Layer 1.5). Unknown
          tiers fail closed via reach_level_index -> u8::MAX (an_unrecognized_reach_fails_closed).
      - id: C10
        status: answered
        justification: >
          Reads reach ONLY through `epr_service::reach_level_index`, the shared ordering the
          content route uses, and canonizes no vocabulary of its own (elohim-storage/CLAUDE.md
          forbids that while the reach vocabulary drift is open). A new tier is fail-closed here
          exactly as it is there, so the two routes cannot diverge on what a tier means.
      - id: C6a
        status: answered
        justification: >
          One indexed SELECT over `content` per blob decision, capped at MAX_REFERENCES (1000) —
          two orders of magnitude above the largest fan-out measured in the corpus (12). No
          conductor call is made (the uncancellable-call hazard does not apply); the verdict
          itself is pure over the loaded rows.
      - id: C8
        status: answered
        justification: >
          Every refusal is `warn!`ed with the hash and the required_reach at the wiring layer
          (`blob_reach_refusal`), and the 403 body names `requiredReach`, so a refused caller and
          an operator reading logs both learn WHY without a code trace.
      - id: C14
        status: answered
        justification: >
          Three named verdict variants with no error arm; the wiring's fail-open on a DB error is
          the single explicitly-named residual (logged, and recorded in the backlog row), so
          there is no unclassified outcome.
      - id: C0
        status: answered
        justification: >
          Places no new truth: reads the existing `content` projection (Cat A/A2 reach lives on
          the content row) and decides serving. No DHT entry, no new table, no coordinator fn —
          a pure gate over existing state on the serving path.
      - id: C1
        status: n-a
        justification: No election; the inputs are content rows and a resolved-identity boolean.
      - id: C2
        status: n-a
        justification: Nothing ordered or arbitrated — a read-time serving decision, not an authority move.
      - id: C3
        status: n-a
        justification: A total pure function over its rows; no state machine, nothing to wedge.
      - id: C5
        status: answered
        justification: >
          The blob address is content-derived (the request hash IS the content address and the
          bytes verify against it), so identity of the bytes needs no separate proof; the verdict
          adds authority to serve, not a claim about what the bytes are.
      - id: C6b
        status: answered
        justification: Pure and total; the same rows and identity bit always yield the same verdict.
      - id: C9
        status: n-a
        justification: >
          Consults no key or lineage; the caller-identity input is a single resolved agent_cid
          string the doorway already validated, matched only for presence here.
      - id: C11
        status: n-a
        justification: No backpressure or externally-imposed load signal participates in the reach decision.
    contractTests:
      - path: elohim/elohim-storage/src/blob_reach.rs
        testName: community_row_refuses_an_anonymous_caller
        kind: unit
        mirrorRisk: false
      - path: elohim/elohim-storage/src/blob_reach.rs
        testName: community_row_serves_a_resolved_identity_without_authorization
        kind: unit
      - path: elohim/elohim-storage/src/blob_reach.rs
        testName: a_shared_blob_serves_when_any_referencing_row_is_public
        kind: unit
        mirrorRisk: false
      - path: elohim/elohim-storage/src/blob_reach.rs
        testName: unreferenced_blob_serves_honest_absence
        kind: unit
      - path: elohim/elohim-storage/src/blob_reach.rs
        testName: above_community_defers_to_the_authorizer
        kind: unit
      - path: elohim/elohim-storage/src/blob_reach.rs
        testName: an_unrecognized_reach_fails_closed
        kind: unit
      - path: elohim/elohim-storage/src/blob_reach.rs
        testName: all_gated_rows_report_the_least_restricted_tier
        kind: unit
    notes: >
      The verdict is pure; the impure shell is `HttpServer::blob_reach_refusal` (http.rs), which
      resolves the caller identity (X-Agent-Cid first, legacy x-agent-id fallback), builds the
      hash candidate set across content.{blob_hash,blob_cid,server_blob_hash}, loads referencing
      rows via `blob_reach::lookup_references`, and renders the 403. The gate runs BEFORE both the
      iroh cutover and the legacy backend so an early return from either cannot bypass it.

      RESIDUE, stated honestly: (1) fail-OPEN on a db-pool/query error — an unreadable projection
      serves rather than darking every public blob; (2) the Authorize (above-community) path
      fails CLOSED pending per-reader HTTP authz, which rides the same humans.agent_pub_key
      unblock as http-reach-enforcement-gap — no above-community blob-bearing row exists in any
      seeded corpus today, so it refuses nothing real. Both are named in the backlog row rather
      than discovered later.
  - name: verify_session_proof
    kind: pure-decision-predicate
    sourceLocation:
      file: src/services/session_proof.rs
      modulePath: services::session_proof::verify_session_proof
      line: 199
    summary: >
      The peer-native session-establishment predicate: does the caller hold the Ed25519
      private key for the canonical `uhCAk…` agent identity they name, demonstrated by a
      domain-separated `verify_strict` signature over a challenge. This is the local-first
      foundation for auth that has no doorway, no DNS and no redirect in the path — a
      runtime you own (self, on your own device) or a runtime you are a guest on under
      shared device custody (a family member's peer, guest-profile shaped). It answers ONLY
      key control at signing time; nonce freshness/single-use is the caller's, social
      identity is HumanityWitness/attestation:*, lineage currency is KeyStewardship, and
      what a proven guest may then DO is imagodei DevicePolicy.
    concernIds:
      - id: C12
        status: answered
        justification: >
          This predicate IS the consent/authorization floor for the native path, replacing
          an ASSERTION with a PROOF. The surfaces it is the foundation for currently accept
          a self-named identity outright: POST /session (handle_create_session) deserializes
          a body naming human_id + agent_pub_key and creates an ACTIVE session with no
          token, cookie or origin check, and extract_agent_key returns X-Agent-Id verbatim.
          A signature over a domain-separated challenge is checkable by the runtime alone,
          which is what the no-doorway case requires — a doorway-minted bearer cannot serve
          where there is no doorway to mint one.
      - id: C4
        status: answered
        justification: >
          Every refusal is a positive, typed observation with its own ProofError arm, and
          crucially an ENCODING fault is never reported as a signature failure. That
          separation is the whole point: handle_add_portal_host compares a hex raw-39
          agent_key_hex() against a `uhCAk…` identity — a comparison that can never succeed
          — and it surfaces as 503 BROWSER_WRITE_PATH_PENDING, an encoding bug wearing an
          authorization costume. Pinned by a_raw_base64_key_is_refused_as_an_encoding_fault
          and a_hex_raw39_key_is_refused_as_an_encoding_fault.
      - id: C6a
        status: answered
        justification: >
          Pure function over three byte slices — no I/O, no conductor call, no retry ladder,
          no allocation beyond one domain-prefixed message buffer. Bounded by construction.
      - id: C2
        status: n-a
        justification: >
          Establishes no authority ordering — it answers one boolean about one signature.
          Monotonicity belongs to whatever consumes the verdict (session lifecycle, and the
          revocation plane on KeyStewardship).
      - id: C8
        status: partial
        justification: >
          The predicate is un-metered: it returns a typed ProofError but increments no
          counter, so a runtime cannot distinguish an encoding-mismatch storm (a
          misconfigured client) from signature failures (a possible attack) without reading
          logs. Deliberate for this slice — the predicate has no call site yet, and a meter
          with no caller is an instrument with no reader. Wire a
          elohim_session_proof_refused_total{reason} over the ProofError vocabulary in the
          same commit that gives it its first caller.
      - id: C9
        status: partial
        justification: >
          A key rotated AWAY still verifies here — the predicate reads the key material
          embedded in the identity and consults no lineage. Correct for a pure signature
          check, but the consuming session surface MUST additionally check lineage currency
          against KeyStewardship, or a revoked device key establishes a session forever.
          Named here so the consumer cannot inherit this gap silently.
    contractTests:
      - path: elohim/elohim-storage/src/services/session_proof.rs
        testName: a_real_signature_over_the_challenge_verifies
        kind: unit
      - path: elohim/elohim-storage/src/services/session_proof.rs
        testName: another_agents_signature_is_refused
        kind: unit
      - path: elohim/elohim-storage/src/services/session_proof.rs
        testName: a_signature_from_another_elohim_domain_is_refused
        kind: unit
      - path: elohim/elohim-storage/src/services/session_proof.rs
        testName: a_raw_base64_key_is_refused_as_an_encoding_fault
        kind: unit
      - path: elohim/elohim-storage/src/services/session_proof.rs
        testName: a_small_order_public_key_is_refused
        kind: unit
  - name: SyncStreamState::caught_up
    kind: pure-decision-predicate
    sourceLocation:
      file: src/p2p/sync_state.rs
      modulePath: p2p::sync_state::SyncStreamState::caught_up
      line: 60
    summary: >
      The sync-state contract's one predicate: is this receiver caught up in this
      publisher's stream? `position >= declared` within the publisher's epoch, and
      `None` (never `true`) while the declared end is unknown. Born from four
      2026-08-29 convergence defects that were one defect — streams with an implicit
      position, no epoch, and a guessed "caught up". Station 1 also puts the
      publisher's boot epoch in the inventory sequence's high 32 bits so a restart is
      strictly ahead on the wire (no heuristic).
    concernIds:
      - id: C0
        status: answered
        justification: >
          Replication plane only: the state is per (receiver, publisher, stream);
          reach and content-head stay their own planes.
      - id: C1
        status: n-a
        justification: No election; a receiver describes its own position.
      - id: C2
        status: answered
        justification: >
          Epoch before position, position monotone per epoch; an older epoch is a
          replay by construction (`PositionClass::OlderEpoch`).
      - id: C3
        status: partial
        justification: >
          Liveness of the stream itself (a publisher that stops) is not judged here;
          the freshness clock on the cursor row is the existing signal.
      - id: C4
        status: answered
        justification: >
          Unknown declared end → `caught_up() == None`; a rollup must publish null.
      - id: C5
        status: n-a
        justification: A position is evidence of what was applied, never authority.
      - id: C6a
        status: answered
        justification: O(1) comparison; the reorder window it serves is bounded per peer.
      - id: C6b
        status: answered
        justification: Pure; re-evaluating a state is idempotent.
      - id: C7
        status: n-a
        justification: Not a serving surface.
      - id: C8
        status: partial
        justification: >
          Epoch/counter are logged on snapshot apply; the per-publisher gauge rollup
          on /p2p/status is station 2 of the spec.
      - id: C9
        status: answered
        justification: >
          Keyed by the publisher's transport peer id as carried in the page; no
          cross-namespace join.
      - id: C10
        status: answered
        justification: >
          No wire field added: the epoch rides the existing u64 `sequence`, so a
          receiver one build behind sees a monotone jump and still applies.
      - id: C11
        status: n-a
        justification: No external backpressure source.
      - id: C12
        status: n-a
        justification: No authorization decision.
      - id: C13
        status: n-a
        justification: No authority graduation.
      - id: C14
        status: n-a
        justification: No residual left unwitnessed; the state is fully local.
    contractTests:
      - path: elohim/elohim-storage/src/p2p/sync_state.rs
        testName: caught_up_is_a_comparison_and_unknown_is_not_true
        kind: unit
      - path: elohim/elohim-storage/src/p2p/sync_state.rs
        testName: positions_classify_by_epoch_before_counter
        kind: unit
      - path: elohim/elohim-storage/src/db/peer_blob_inventory.rs
        testName: an_epoch_carrying_restart_needs_no_gap_heuristic
        kind: unit


  # ── rung 5: the release-adoption controller (observe mode) ────────────────
  # Spec: genesis/docs/superpowers/specs/2026-09-01-runtime-artifacts-elected-content-design.md §6.
  # Registered AT BIRTH per the task atom's design-gate clause — the C8/C6a/C4
  # bindings below are what the module was built to, not what was noticed later.

  - name: release_adoption::verify::verify
    kind: verdict-fn
    sourceLocation:
      file: src/services/release_adoption/verify.rs
      modulePath: services::release_adoption::verify::verify
      line: 546
    summary: >
      The composed verify FLOOR for a runtime release (spec §6.3, floor-protected — never
      stage-priced). Pure: takes the manifest body, this peer's installed reality, the channel's
      L2 lineage evidence, the fetched artifact digests and the attestation count, and returns
      either a VerifiedRelease or one typed AdoptionRefusal. It is the ONLY constructor of
      VerifiedRelease, so "verified" is a type fact rather than a call-order convention. Five
      arms in cheapest-refusal order: manifest shape against T1's schema (patterns serde cannot
      see — a `sha256-<hex>` in a blobCid field is refused), channel identity, the compatibility
      envelope against the runtime passport's INSTALLED reality (the per-role DNA-hash guard
      happ_manager::lineage_mismatch_error enforces at apply time, moved to verify time), the
      lineage parent against the channel's L2 version chain (the body field is a HINT that must
      match), and the attestation threshold via release_attestation::count_qualifying_attestations.
    concernIds:
      - id: C1
        status: answered
        justification: >
          Never re-derived here. The threshold arm can only be reached with an AdoptionDiscipline,
          and the sole constructor of that type (ChannelAdoptionDiscipline::for_release) takes the
          release's builderAgent — so the builder's own attestation is excluded by construction
          before this function is called, not by a remembered WHERE clause.
      - id: C2
        status: n-a
        justification: >
          This function moves no head and stamps no row. Head-plane monotonicity is decided
          upstream by the conductor's own election; verify only judges what that election named.
      - id: C4
        status: answered
        justification: >
          Every input that can be unknown is an Answer<T>, never an Option flattened into a
          verdict. An unreadable runtime passport is `installed_reality_unknown` (transient), NOT
          `dna_lineage_mismatch` — reading a failed conductor inventory as a mismatch would be a
          claim with no evidence, in the direction that looks like diligence. An unreadable L2
          chain is `lineage_unverifiable`, never a pass. Pinned by
          an_unreadable_passport_is_unknown_reality_never_a_mismatch and
          an_unreadable_lineage_chain_is_unverifiable_never_a_pass.
      - id: C5
        status: answered
        justification: >
          Attestations, peer-served bytes and the manifest's self-declared lineage parent are all
          EVIDENCE: each is checked against something this peer resolved itself (its own passport,
          the L2 chain from its own conductor's head declaration, the declared digest). Evidence
          that cannot be evaluated confers nothing in either direction — the
          `threshold_unchecked` / `lineage_unverifiable` arms exist so it cannot silently confer
          consent.
      - id: C6a
        status: answered
        justification: >
          Pure function over already-assembled evidence — no loop, no retry ladder, no I/O, no
          conductor call. The bounded budgets belong to the sweep that feeds it
          (release_adoption::watch), which sizes every call before making it.
      - id: C6b
        status: answered
        justification: >
          Deterministic in its inputs; re-running it on the same (channel, releaseCid, installed
          reality) re-derives the identical verdict. Nothing is written.
      - id: C7
        status: n-a
        justification: Not a serving surface; it consumes fetched bytes, it does not advertise any.
      - id: C8
        status: answered
        justification: >
          Every arm returns an AdoptionRefusal carrying a typed RefusalReason — a ReasonLabel
          implementor, so a duplicate or unstable label is a failing test rather than a silently
          merged metric series. The reason also names the arm it belongs to, so
          elohim_release_adoption_decisions_total{arm,reason} cannot be mislabelled at the call
          site. Pinned by refusal_reason_labels_are_conformant / _are_stable.
      - id: C9
        status: answered
        justification: >
          THE DNA LINE. verify_envelope refuses per-role when the release's dnaHash differs from
          the installed cell's — update_coordinators matches integrity dependencies by NAME, so a
          cross-lineage bundle would splice coordinators onto integrity zomes they were never
          compiled against. Crossing it is rung 6's migration ceremony, structurally refused here.
          A coordinator-generation mismatch is a SEPARATE reason because the cures differ (a
          hot-swap can reach one, only a migration the other).
      - id: C10
        status: answered
        justification: >
          The envelope IS the contract-evolution answer: wireEpochs against this build's
          SUPPORTED_WIRE_EPOCHS, and additiveOnly asserted. The Rust mirror of T1's schema is
          deliberately OPEN (no deny_unknown_fields, every optional field defaulted) so a peer one
          build behind still reads a release that ADDED a field within the lineage window — pinned
          by an_unknown_property_is_tolerated_because_the_wire_floor_is_additive.
      - id: C11
        status: n-a
        justification: >
          No external backpressure source is read here. Scheduling deference belongs to the sweep.
      - id: C12
        status: answered
        justification: >
          The adoptionDiscipline this function gates on is the CHANNEL's constitutional
          declaration carried in the release manifest, not a per-peer preference — consent is
          read from the ceremony's artifact, never assumed from silence.
      - id: C13
        status: answered
        justification: >
          The election tier (earned / staging / none) is carried through to the report unchanged;
          verify judges the release, it never promotes a tier.
      - id: C14
        status: answered
        justification: >
          A refusal is never dropped: it reaches both GET /admin/adoption and the per-decision
          metric, and its `transient` flag says whether a later sweep could cure it.
    contractTests:
      - path: elohim/elohim-storage/src/services/release_adoption/verify.rs
        testName: the_envelope_broken_fixture_refuses_on_the_dna_line
        kind: unit
      - path: elohim/elohim-storage/src/services/release_adoption/verify.rs
        testName: an_unreadable_passport_is_unknown_reality_never_a_mismatch
        kind: unit
      - path: elohim/elohim-storage/src/services/release_adoption/verify.rs
        testName: a_lineage_hint_that_disagrees_with_the_l2_chain_is_refused
        kind: unit
      - path: elohim/elohim-storage/src/services/release_adoption/verify.rs
        testName: an_unreadable_attestation_count_is_unchecked_never_a_pass
        kind: unit
      - path: elohim/elohim-storage/src/services/release_adoption/verify.rs
        testName: the_composed_floor_mints_a_verified_release_only_when_every_arm_passes
        kind: unit
      - path: elohim/elohim-storage/src/services/release_adoption/verify.rs
        testName: release_manifest_mirror_agrees_with_the_rakia_schema
        kind: unit

  - name: release_adoption::RefusalReason
    kind: reason-outcome-enum
    sourceLocation:
      file: src/services/release_adoption/mod.rs
      modulePath: services::release_adoption::RefusalReason
      line: 384
    summary: >
      The adoption controller's closed refusal vocabulary — twenty causes, one per genuinely
      distinct story, projected to the `reason` label of
      elohim_release_adoption_decisions_total{arm,reason}. Paired with DecisionArm (watch / fetch
      / verify / apply) via RefusalReason::arm(), so the metric's arm label is a property of the
      reason rather than of the call site, and with RefusalReason::is_transient(), which is the
      retry axis the backoff ladder reads. `apply` is enumerated (T4 shares the vocabulary) but no
      reason maps to it and it is deliberately NOT pre-touched at registration: this build
      compiles no vehicle, so a measured zero there would claim an arm that has no code.
    concernIds:
      - id: C0
        status: n-a
        justification: A label vocabulary names no plane.
      - id: C1
        status: n-a
        justification: No authority is elected here.
      - id: C2
        status: n-a
        justification: No head moves.
      - id: C3
        status: answered
        justification: >
          is_transient() is the liveness axis: a transient refusal climbs a FINITE ladder and holds
          at its ceiling (never stops asking), a terminal one parks at the ceiling immediately
          (never hammers). Without the split a controller either burns a conductor on a decided
          question or sleeps through a cured substrate.
      - id: C4
        status: answered
        justification: >
          `installed_reality_unknown`, `lineage_unverifiable`, `threshold_unchecked` and
          `conductor_unavailable` exist precisely so unreachability is never spelled as a
          substantive refusal, and `artifact_unavailable` is documented as "not replicated yet",
          never as absence.
      - id: C5
        status: answered
        justification: >
          `threshold_unchecked` is the may-believe clause made countable: evidence that could not
          be evaluated is its own outcome, and explicitly NOT a pass.
      - id: C6a
        status: n-a
        justification: An enum performs no work.
      - id: C6b
        status: answered
        justification: label() is a total, pure match — deterministic across calls by construction.
      - id: C7
        status: n-a
        justification: Not a serving surface.
      - id: C8
        status: answered
        justification: >
          THE binding. ReasonLabel conformance is asserted (distinct, non-empty, metric-safe
          labels) and the label SET is pinned, so a rename is a deliberate act with a failing test
          attached rather than a silently broken dashboard series — the
          inc_contest_failed(&str) failure class, closed by type.
      - id: C9
        status: n-a
        justification: No identity is joined.
      - id: C10
        status: answered
        justification: >
          The vocabulary is closed and pinned; adding a variant requires editing the golden set,
          which is what makes the metric contract legible to a consumer one build behind.
      - id: C11
        status: n-a
        justification: No backpressure decision.
      - id: C12
        status: n-a
        justification: No authorization decision.
      - id: C13
        status: n-a
        justification: No authority graduation.
      - id: C14
        status: answered
        justification: >
          Every refusal is witnessed twice — once on GET /admin/adoption with its evidence string,
          once as a counter increment — so no refused state is left invisible.
    contractTests:
      - path: elohim/elohim-storage/src/services/release_adoption/mod.rs
        testName: refusal_reason_labels_are_conformant
        kind: unit
      - path: elohim/elohim-storage/src/services/release_adoption/mod.rs
        testName: refusal_reason_labels_are_stable
        kind: unit
      - path: elohim/elohim-storage/src/services/release_adoption/mod.rs
        testName: the_dna_line_refusal_is_terminal_and_absence_is_not
        kind: unit
      - path: elohim/elohim-storage/src/services/release_adoption/mod.rs
        testName: every_refusal_names_the_arm_it_can_come_from
        kind: unit

  - name: release_adoption::state::ChannelAdoptionState::record
    kind: state-transition
    sourceLocation:
      file: src/services/release_adoption/state.rs
      modulePath: services::release_adoption::state::ChannelAdoptionState::record
      line: 330
    summary: >
      The per-channel state transition and the backoff ladder it owns. Takes one completed check's
      (head, verdict) and advances the channel: Ok/Idle clear the ladder entirely (a cured channel
      is re-checked at full cadence on the very next sweep); a TRANSIENT refusal climbs the finite
      BACKOFF_LADDER_SECS and holds at its ceiling; a TERMINAL refusal parks at the ceiling
      immediately. The method owns the ladder so a caller cannot forget either to advance it or to
      reset it. AdoptionState is Ephemeral (C) throughout — process-local, reconstructable from one
      sweep, surfaced on the node-local GET /admin/adoption, never notarized and never gossiped as
      authority (spec §5).
    concernIds:
      - id: C0
        status: answered
        justification: >
          Projection plane only, by construction: this state is a record of what this peer's
          controller saw and decided. Authority lives at L2 in the conductor's election; nothing
          here is ever read back as one.
      - id: C1
        status: n-a
        justification: No election.
      - id: C2
        status: n-a
        justification: No head is moved or stamped.
      - id: C3
        status: answered
        justification: >
          The ladder is FINITE and holds rather than growing, so a channel is never abandoned; and
          Ok/Idle reset it to zero, so a cured substrate is noticed on the next tick. Pinned by
          transient_refusals_climb_a_finite_ladder_and_hold_at_the_ceiling and
          success_and_honest_idle_both_clear_the_backoff.
      - id: C4
        status: answered
        justification: >
          Three structurally distinct records: `resolved_head: null` (could not ask),
          `tier: "none"` (asked, no election), and a substantive verdict. Verdict::Idle is its own
          variant rather than a success or a failure, so "no head to judge" can never be read as
          either. HeadTier::from_canonical_earned maps a missing canonical_earned to `none`, never
          to `staging` — the meter must not claim an election it has no evidence for. Pinned by
          head_tier_never_invents_an_election.
      - id: C5
        status: n-a
        justification: Records a decision; evaluates no evidence.
      - id: C6a
        status: answered
        justification: >
          The declared budget IS this ladder: BACKOFF_LADDER_SECS is a fixed 5-rung array with a
          named ceiling, and record() is O(1). The sweep's own per-tick caps
          (MAX_CHANNELS_PER_SWEEP / MAX_THRESHOLD_READS_PER_SWEEP / MAX_ARTIFACT_BYTES_PER_SWEEP)
          are read BEFORE any conductor call is made — never as a caller-side timeout, which would
          only abandon a conductor that keeps running.
      - id: C6b
        status: answered
        justification: >
          Idempotent on (channel, releaseCid): re-recording the same verdict re-derives the same
          state, and a channel SKIPPED for backoff or byte budget has its record left untouched, so
          lastCheckedAt never claims a check that did not happen. The artifact source re-uses
          already-staged bytes (digest re-checked, never assumed) instead of re-fetching.
      - id: C7
        status: n-a
        justification: Not a serving surface.
      - id: C8
        status: answered
        justification: >
          Verdict::reason_label() is the single projection into the metric's reason label, so a
          verdict that reaches the report and not the meter is impossible.
      - id: C9
        status: n-a
        justification: Keyed by channel id; no cross-namespace identity join.
      - id: C10
        status: n-a
        justification: No wire shape.
      - id: C11
        status: partial
        justification: >
          THREE legs, one wired (T4, 2026-09-01). (1) The per-sweep byte budget defers a large
          release to the next tick rather than churning, and deferral is recorded as a SKIP (not a
          refusal) so a healthy channel is never pushed into the ladder for a reason that is about
          us — pinned by a_deferred_channel_is_not_a_refused_one, which drives the single
          outcome->transition function and asserts the deferred channel's recorded state is
          byte-identical (lastCheckedAt untouched, sweeps not ticked, ladder not entered).
          (2) The APPLY arm additionally defers on the conductor admission lane
          (release_adoption::apply::backpressure_signal — in_flight >= capacity), with the typed
          transient reason deferred_backpressure, so a node whose lane is saturated lags within
          window instead of queueing an apply ahead of a person. (3) REMAINING PARTIAL: ram-guard
          and PVC watermarks live in the pre-push/hook layer and quiesce state in the p2p plane;
          neither is readable from this process without new plumbing, and inventing a reader for
          them inside an apply vehicle would be an instrument with no reader. Named here rather
          than forced.
      - id: C12
        status: answered
        justification: >
          Observe is what a bare channel id means, and apply must be asked for BY EXACT NAME per
          channel; an unknown mode in the runtime-config value is REFUSED and reported rather than
          silently downgraded (a peer told to apply must never look compliant while doing something
          else) or silently upgraded (a typo must never start swapping coordinators). Pinned by
          an_illegal_mode_is_refused_and_reported_never_downgraded and
          apply_is_legal_but_only_when_asked_for_by_exact_name, which walks a table of near-misses.
      - id: C13
        status: answered
        justification: >
          The election tier is recorded as observed and never promoted. Applying is bounded by four
          independent conditions, none of them a default: a channel whose config says apply, a
          release that passed the whole floor, a registered vehicle for its DECLARED class, and a
          node not under readable pressure. Above them sits the spec §9 stakes fence — the
          storage-binary vehicle applies only where the declared network stakes are Simulacra, and
          the resolver fails closed to Bootstrap, so fleet binaries are refused by default rather
          than by remembering to configure a refusal.
      - id: C14
        status: answered
        justification: >
          Refused config entries are reported on GET /admin/adoption alongside the channels, so a
          mis-edited ConfigMap line is visible rather than silently dropped.
    contractTests:
      - path: elohim/elohim-storage/src/services/release_adoption/state.rs
        testName: transient_refusals_climb_a_finite_ladder_and_hold_at_the_ceiling
        kind: unit
      - path: elohim/elohim-storage/src/services/release_adoption/state.rs
        testName: a_terminal_refusal_parks_at_the_ceiling_immediately
        kind: unit
      - path: elohim/elohim-storage/src/services/release_adoption/state.rs
        testName: success_and_honest_idle_both_clear_the_backoff
        kind: unit
      - path: elohim/elohim-storage/src/services/release_adoption/state.rs
        testName: head_tier_never_invents_an_election
        kind: unit
      - path: elohim/elohim-storage/src/services/release_adoption/state.rs
        testName: an_illegal_mode_is_refused_and_reported_never_downgraded
        kind: unit
      - path: elohim/elohim-storage/src/services/release_adoption/watch.rs
        testName: a_controller_without_a_conductor_refuses_honestly_and_applies_nothing
        kind: unit
      - path: elohim/elohim-storage/src/services/release_adoption/watch.rs
        testName: a_deferred_channel_is_not_a_refused_one
        kind: unit
      - path: elohim/elohim-storage/src/services/release_adoption/state.rs
        testName: apply_is_legal_but_only_when_asked_for_by_exact_name
        kind: unit
      - path: elohim/elohim-storage/src/services/release_adoption/state.rs
        testName: a_pending_restart_is_never_cleared_by_a_later_sweep
        kind: unit

  # ── rung 5 (T4): the apply vehicles ───────────────────────────────────────
  # Spec §6 step 4 + §9. Registered at birth per the task atom's design-gate
  # clause, same as the observe half above.

  - name: release_adoption::apply::ApplyRegistry::apply
    kind: state-transition
    sourceLocation:
      file: src/services/release_adoption/apply.rs
      modulePath: services::release_adoption::apply::ApplyRegistry::apply
      line: 200
    summary: >
      The single routing point from a VerifiedRelease to a running change. Reads the cheap
      backpressure signal FIRST (a deferral is about the node, not the class it would have
      reached), then routes strictly by the manifest's DECLARED artifactClass to the one vehicle
      that names it — coordinator-bundle to happ_manager::sync_coordinators_report (the exact
      in-process fn behind POST /admin/coordinators/sync), config-epr to the watched
      runtime-config file plus an in-process reload_now(), storage-binary to the exe SLOT (staged,
      never executed), happ-bundle to the same coordinator hot-swap gated on being joined. A class
      with no registered vehicle is no_vehicle_for_class — never a fallback to the closest
      vehicle, because routing by anything but the declared class would apply a release through
      machinery it was never verified against. The module invents no apply mechanics; every
      vehicle composes one that was already proven, which is what makes revert free (the ceremony
      declares a prior head canonical and every controller converges backward through the
      identical loop).
    concernIds:
      - id: C0
        status: answered
        justification: >
          Apply touches the RUNTIME plane only. It never writes an entry, never declares a head,
          never gossips. Authority stays at L2 in the conductor's election; this is the arm that
          obeys it.
      - id: C1
        status: n-a
        justification: >
          Self-election is decided upstream at the threshold arm, which cannot be reached without
          an AdoptionDiscipline naming the release's builder. Nothing here can widen it.
      - id: C2
        status: answered
        justification: >
          APPLY NEVER MOVES A HEAD. There is no declare call, no supersede, no link write on this
          path — the ceremony moves heads and the controller converges toward whatever it elected,
          forward or backward. That is also why revert needs no separate mechanism.
      - id: C3
        status: answered
        justification: >
          A successful apply (and an already_current no-op) clears the backoff ladder entirely, so
          a channel that just converged is re-checked at FULL cadence on the very next sweep —
          which is what makes a revert land in one sweep instead of up to half an hour later.
          Pinned by a_successful_apply_clears_the_backoff_so_a_revert_lands_next_sweep.
      - id: C4
        status: answered
        justification: >
          The hApp-bundle vehicle reads a conductor it cannot ask as UNREACHABLE (apply_failed),
          never as "not joined" — reading unreachable as absence there would send an operator to
          join-peer for a peer that has already joined. Absence (the app genuinely not installed)
          is its own reason, bootstrap_out_of_band.
      - id: C5
        status: answered
        justification: >
          A vehicle is handed a VerifiedRelease and nothing else: it cannot re-read the channel,
          re-fetch bytes, or second-guess the floor. Every input it acts on was already checked
          against something this peer resolved itself.
      - id: C6a
        status: answered
        justification: >
          One vehicle call per applying channel per sweep, inside the sweep's own channel budget,
          and the post-apply soak observer sleeps min(soakSecs, MAX_SOAK_WAIT_SECS = 24h) before
          making exactly one zome call — a discipline may declare any window, this process will not
          hold a task open past a day, because a soak longer than the peer's own uptime attests to
          whatever process happens to be running when the timer fires.
      - id: C6b
        status: answered
        justification: >
          IDEMPOTENT ON (channelId, releaseCid), and the check is placed before the threshold read,
          before staging and before the vehicle — so a re-sweep on a current head costs exactly one
          head resolve and nothing else, which is the atom's literal contract. The exit carries its
          own reason label (already_current) rather than folding into ok, so a converged fleet is
          not metered as a continuously-applying one.
      - id: C7
        status: n-a
        justification: Not a serving surface.
      - id: C8
        status: answered
        justification: >
          Ten typed apply-arm RefusalReasons, one per genuinely distinct CURE — an operator gate,
          a stakes declaration, a bootstrap fact, a boot-only knob, an unwatched config path, an
          unusable payload, an absent vehicle, a pressure deferral, a failed mechanism. Each names
          its own arm, so elohim_release_adoption_decisions_total{arm,reason} cannot be mislabelled
          at the call site, and the apply arm is now pre-touched (T3 asserted it ABSENT while it
          had no code; T4 inverted that assertion deliberately). Partial applies are reported: a
          per-role hot-swap failure lands on the receipt's failedRoles rather than silently
          succeeding.
      - id: C9
        status: answered
        justification: >
          The DNA line is refused upstream at verify (dna_lineage_mismatch) and again per role
          inside sync_coordinators_for_app_info. That is why the happ-bundle vehicle routes to the
          hot-swap rather than to ensure_happ_installed: the install path's stale branch mints a
          NEW agent key, and a rung whose failure mode is "your peer silently got a new identity"
          is not a rung that ships.
      - id: C10
        status: answered
        justification: >
          The config vehicle CARRIES keys the registry does not know rather than refusing them —
          the additive-wire floor applied to config, so a peer one build behind can still take a
          release that added a key. They are reported as ignoredKeys so the silence is legible.
      - id: C11
        status: partial
        justification: >
          backpressure_signal() reads the conductor admission lane (in_flight >= capacity) before
          any routing, and refuses with the transient deferred_backpressure. ram-guard, PVC and
          quiesce remain unread — see the same concern on ChannelAdoptionState::record.
      - id: C12
        status: answered
        justification: >
          The conductor-touching vehicles honour ALLOW_COORDINATOR_UPDATE (inheriting
          ALLOW_DNA_REINSTALL) through happ_manager::coordinator_update_allowed() — the SAME
          predicate the boot path and the HTTP vehicle read, so three call sites cannot drift.
      - id: C13
        status: answered
        justification: >
          Spec §9's fleet fence is enforced on the DECLARED network stakes rather than a hostname
          or an env sniff: the storage-binary vehicle applies only under NetworkStage::Simulacra,
          and StakesResolver fails closed to Bootstrap, so a node that declares nothing refuses.
          Pinned by the_binary_gate_is_closed_by_default_and_opens_only_on_a_simulacra_declaration.
      - id: C14
        status: answered
        justification: >
          A staged binary is reported as pendingRestart on GET /admin/adoption AND as a sidecar
          receipt beside the slot, and the flag is STICKY — never cleared by a later sweep, because
          a slot on disk that the report says is not pending is exactly the residual T6's receipt
          would misread as "the swap already happened". The post-apply soak observer authors a
          FAILING attestation for a pending-restart window rather than a passing one, so the
          residual is witnessed on the DHT too.
