        testName: head_corpus_digest_readiness_abstains_until_distribution_safe_rows_are_witnessed
        kind: unit
        mirrorRisk: false

  - name: advertised_head_corpus_digest
    kind: pure-decision-predicate
    sourceLocation:
      file: src/p2p/projection_reconcile.rs
      modulePath: p2p::projection_reconcile::advertised_head_corpus_digest
      line: 193
    summary: >
      Carries the additive head-corpus digest exactly in the rollout-enabled plus fully-witnessed
      corner; disabled or amber nodes send the byte-identical pre-T5 request.
    concernIds:
      - id: C0
        status: answered
        justification: The predicate gates a head/version-plane equality hint over a projection-derived DHT witness signal.
      - id: C1
        status: n-a
        justification: It neither authors nor chooses a head; equality only skips redundant inventory diffing.
      - id: C2
        status: n-a
        justification: It cannot move authority and the full inventory/heal path remains the only effectful path on mismatch.
      - id: C3
        status: partial
        justification: >
          Once enabled, Amber automatically reaches the Ready corner as the existing witness
          sweep anchors rows. The shipped default is deliberately dormant for rolling-deploy
          safety, so activation still requires the T5 operator flip after fleet responder proof.
      - id: C4
        status: answered
        justification: >
          The predicate consumes the explicit Amber/Ready answer and refuses to serialize a
          partial digest; an amber responder likewise abstains with in_sync=None rather than
          manufacturing a guaranteed false mismatch.
      - id: C5
        status: n-a
        justification: A digest is equality evidence only and confers no head authority or write permission.
      - id: C6a
        status: answered
        justification: >
          Exactly one readiness query is paid per enabled discovery sweep, outside the peer
          loop; every peer reuses the resulting string. A matching responder now returns an
          empty entry list before page enumeration, making the shortcut actually bounded and
          cheaper instead of computing both paths.
      - id: C6b
        status: n-a
        justification: The predicate is pure and replaying the same request applies no effect.
      - id: C7
        status: answered
        justification: >
          Requester readiness, responder readiness, raw digest, and served content inventory all
          reuse the same distribution-safe relation; a match therefore advertises exactly the
          set the peer would otherwise serve.
      - id: C8
        status: partial
        justification: >
          Ready, amber suppression, responder abstention, and successful short-circuit are INFO/
          DEBUG visible, but there is not yet a typed Prometheus outcome series for fleet-wide
          hit-rate and suppression-rate measurement.
      - id: C9
        status: n-a
        justification: Corpus equality is independent of agent-to-transport identity resolution.
      - id: C10
        status: answered
        justification: >
          The flag defaults false, the optional field remains absent byte-for-byte while off or
          amber, and the existing old/new wire fixtures pin unknown-key and missing-key behavior.
      - id: C11
        status: n-a
        justification: The predicate shapes an outbound scheduled request; responder frame caps still own hostile inbound pressure.
      - id: C12
        status: n-a
        justification: It grants no action and broadens no reach; scoped content remains excluded.
      - id: C13
        status: n-a
        justification: The optimization is stage-independent and never lowers constitutional, local-relationship, or counter-evidence floors.
      - id: C14
        status: n-a
        justification: Amber suppression is an expected state with a counted pending value, not a silent unexplained residual.
    contractTests:
      - path: elohim/elohim-storage/src/p2p/projection_reconcile.rs
        testName: digest_advertisement_requires_both_rollout_enablement_and_green_corpus
        kind: unit
        mirrorRisk: false
      - path: elohim/elohim-storage/src/p2p/view_federation.rs
        testName: content_inventory_abstains_from_digest_comparison_during_amber_window
        kind: unit
        mirrorRisk: false
      - path: elohim/elohim-storage/src/p2p/view_federation.rs
        testName: content_inventory_reports_in_sync_true_when_requester_digest_matches
        kind: unit
        mirrorRisk: false

