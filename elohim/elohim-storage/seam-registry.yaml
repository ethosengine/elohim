    summary: >
      Which candidates fill one adopt sweep's fixed per-tick slice, given the eligible and the
      backoff-deferred classes. Eligible holds the front; a tail of (cap / 4).min(deferred.len())
      is RESERVED for the deferred class so re-ordering cannot decay into exclusion when the cap
      binds. Pure and total - no clock, no ledger, no conductor.
    notes: >
      Forcing incident 2026-08-03 (live alpha): candidates 395, attempted 200,
      backoff_deferred 134 - with 261 eligible ids in front, .take(200) truncated ALL 134
      deferred candidates off the end of the slice. The F-B lever's own doc promises "priority,
      not exclusion" precisely because the deferred class is the conductor-missing one whose
      try_obey_visible_election probe is its ONLY converging arm; on a high-volume pod that
      promise had silently inverted for the whole backoff window. The sweep log now also carries
      backoff_deferred_in_slice, so the claim is checkable in a scrape rather than asserted in a
      doc.
    concernIds:
      - id: C3
        status: answered
        justification: >
          A backed-off id is DELAYED, never excluded - the same obligation
          the_contest_backoff_is_never_a_permanent_exclusion witnesses at the ledger layer, now
          held at the SCHEDULING layer too. Before this, both could be true (the backoff always
          expires) while the id still never got a turn on a pod whose eligible class alone
          overfills the cap, which is a liveness-shaped outage no state table sees: the liveness
          contract models whether an arm EXISTS for a row, never whether that arm gets
          scheduled. That scope limit is now stated in liveness_contract.rs's module doc, citing
          this function as the scheduling-layer guarantee.
      - id: C6a
        status: answered
        justification: >
          Bounded work is unchanged and the tests pin it: the slice is still exactly
          WITNESS_MAX_PER_TICK (200), the reserve is a fraction of that same cap (never an
          addition to it), the concurrency bound is still adopt_contest_fanout, and
          WITNESS_SWEEP_BUDGET (120s wall clock) remains authoritative over both. This function
          changes WHICH ids fill a fixed slice, never how big it is -
          the_tail_reservation_never_widens_the_bounded_work_budget asserts that over the
          full shape space.
      - id: C8
        status: partial
        justification: >
          The composition is reported (backoff_deferred_in_slice, returned by this function
          rather than recomputed at the call site so the log is not a mirror of the formula it
          reports on), but on the sweep's tracing::warn! line only - there is no Prometheus
          series for slice composition, so an operator must read logs to see the reservation
          working. Adequate for the sweep log's existing shape; a counter would be the honest
          upgrade if the reserve fraction ever becomes tunable.
