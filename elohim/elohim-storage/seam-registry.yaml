  - name: adopt_before_author_param
    kind: pure-decision-predicate
    sourceLocation:
      file: src/services/head_adoption.rs
      modulePath: services::head_adoption::adopt_before_author_param
      line: 608
    summary: >
      ADOPT-BEFORE-AUTHOR (2026-08-03, operator-reserved, DEFAULT OFF). May this call site ask
      the conductor to bypass its target-independent no-chain gate? The AND of
      (node_flag_enabled, carried_bytes_present) — the storage-side mirror of
      content_store::classify_chain_gate, and the ONE place the two conditions are joined so
      "the flag is on" cannot drift apart from "we hold evidence to send". `carried_bytes_present`
      means the view-federation fetch answered Answer::Present WITH record: Some(_); a hash-only
      answer is not evidence and must not set the param. Both inputs are arguments rather than
      reads of process state, the same discipline as decide_head_action's contest_enabled.
      Consumed by exactly two arms, each only AFTER the classic declare has already been refused
      for "no content found for id": try_adopt_before_author (the CONTEST arm — the residual's
      real site) and declare_peer_head's evidence retry.
    concernIds:
      - id: C1
        status: answered
        justification: >
          Cannot crown, and structurally cannot license an unevidenced declaration: the param is
          false whenever bytes are absent, so a node with no chain and no record is refused
          exactly as before (adopt_before_author_requires_both_the_flag_and_the_evidence pins
          all four corners). What it permits is one CANDIDATE link for the DHT arbiter, which
          has no author component to consult; nothing is stamped on the local row by either arm,
          and the winner still arrives through the ordinary HealCanonical path.
      - id: C5
        status: answered
        justification: >
          The predicate is what guarantees a `true` always travels WITH the evidence that
          justifies it — belief is conferred only by what the receiving CONDUCTOR re-derives
          (validate_carried_record's action-hash / signature / entry<->action clauses plus the
          target-id gate, all run unconditionally on that branch). Storage asserts nothing about
          the record it forwards; the peer is a byte courier, exactly as in
          try_obey_visible_election.
      - id: C3
        status: partial
        justification: >
          These arms ARE the both-sides-missing residual's automated exit, and the exit is real:
          liveness_contract's both_sides_conductor_missing_is_a_known_open_residual now runs two
          legs over one state table, and the flag-ON leg finds an automated transition where the
          harness previously found none. But the capability ships DORMANT
          (config::adopt_before_author_enabled() defaults false), so on a default fleet the only
          exit is still an operator flip — which C3 refuses to count. Partial, not answered,
          until the default changes. The C3 companion property at this seam IS answered: a
          refused attempt releases its (id, target) claim
          (a_refused_adopt_attempt_returns_its_claim), so one failure can never permanently
          exclude a pair.
      - id: C6a
        status: answered
        justification: >
          Bounded and, while dormant, free. Off, adopt_retry_bytes returns None before any
          allocation, so there is no second conductor round-trip and no multi-KB record clone on
          the hottest sweep in the crate (a_dormant_node_reserves_no_adopt_retry_budget). On,
          the budget is at most ONE extra round-trip per (id, target) per process — the
          candidacy ledger bounds the mint count, the contest backoff bounds the re-attempt
          rate, and there is deliberately NO retry ladder: the reconcile sweep is the retry, at
          its own cadence under compose_adopt_slice's cap. No third pacing scheme is introduced
          at a seam that already has two.
      - id: C8
        status: answered
        justification: >
          Every outcome of the new arms is counted and separable. A mint carries
          links_minted{source="adopt_before_author"} (a named const, not a literal, because this
          series IS the flag's live probe — a typo would read as "the operator flip did
          nothing"); a refusal carries the appended typed class
          contest_failed{class="adopt_refused"}, distinct from all four pre-existing classes.
          contest_failed{class="no_local_chain"} is still counted FIRST and unconditionally,
          even when the bypass then succeeds, so it remains the honest DENOMINATOR of the
          convergence reading (minted{adopt_before_author} / contest_failed{no_local_chain} =
          the share of the residual the flip converts). Pinned by
          the_adopt_mint_label_is_separable_from_every_other_source and
          the_adopt_refusal_label_is_additive_and_distinct.
    contractTests:
      - path: elohim/elohim-storage/src/services/head_adoption.rs
        testName: adopt_before_author_requires_both_the_flag_and_the_evidence
        kind: unit
        mirrorRisk: false
      - path: elohim/elohim-storage/src/services/head_adoption.rs
        testName: the_node_flag_defaults_to_off_so_the_capability_ships_dormant
        kind: unit
      - path: elohim/elohim-storage/src/services/head_adoption.rs
        testName: a_dormant_node_reserves_no_adopt_retry_budget
        kind: unit
      - path: elohim/elohim-storage/src/liveness_contract.rs
        testName: both_sides_conductor_missing_is_a_known_open_residual
        kind: unit
        mirrorRisk: false
      - path: elohim/holochain/tests/sweettest/src/tests/lamad.rs
        testName: adopt_before_author_declares_without_a_local_chain
        kind: sweettest
    gapNote: >
      The unit tests pin the PREDICATE and the dormancy; the sweettest pins what the param
      actually buys end-to-end. What no test in this crate covers is the LIVE wiring between
      them — that main.rs's ELOHIM_ADOPT_BEFORE_AUTHOR parse reaches
      config::set_adopt_before_author and thence these arms. That path is a bin-only startup
      sequence with no harness in this crate (the same shape as CONTEST_TWO_WAY_DECLARED, which
      is equally unpinned), so the operator flip's first real proof is the
      links_minted{source="adopt_before_author"} series going non-zero on a live pod. Named here
      rather than left implied: a zero series while the flag is believed on is a WIRING
      question, not evidence that the arm failed.

