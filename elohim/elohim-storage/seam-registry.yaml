      head_adoption::adopt_peer — the per-id election probe and the per-id ContentHeadRecord
      verify RPC — and NEVER touches write authority: declared heads still move only through the
      own conductor's declare_canonical_head extern and content_diesel::stamp_declared_head_mode.
