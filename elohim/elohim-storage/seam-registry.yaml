      skipped it at non-Simulacra stages and handed the pricer fabricated permissive inputs
      (floor None / reach Commons), which a trait-conformant future pricer on the dyn seam could
      have cheapened against. Every PricingInput is now derived from the real row at every stage,
      and VerificationPricer carries a stated STAGE obligation (non-Simulacra => FullChain) pinned
      registry-wide. Every DECISION outside an explicit Simulacra declaration is therefore
      unchanged; the only new cost at those stages is one read-only primary-key SELECT per sweep.
