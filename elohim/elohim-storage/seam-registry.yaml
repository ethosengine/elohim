# elohim/elohim-storage/seam-registry.yaml
#
# Conforms to elohim/sdk/schemas/v1/manifest/seam-registry.schema.json (SOURCE OF TRUTH for
# shape). This file is the SOURCE OF TRUTH for elohim-storage's decision surface; the census
# (placement-audit.py --epr-meta, P3.2) and the concern x seam matrix (P4.3) are derived
# read-models over it — never hand-authored from it.
#
# Every symbol below was grepped and read at authoring time (2026-08-02); every cited test
# name is a real, currently-present #[test]/#[tokio::test] fn in the named file. Where no
# contract test exists, contractTests is explicit `null` with a gapNote — never a silent
# omission (the census is supposed to flag exactly that; honesty here is load-bearing).
#
# "Seam" in this file names elohim-storage's crate/module locus — the P2P projection-reconcile
# + head-adoption decision pipeline — NOT the concern-routing atlas's composition seams or
# participation tracks (those are matrix vocabulary, surface 6, not registry vocabulary).

seamRegistryVersion: 1
crate: elohim-storage
crateRoot: elohim/elohim-storage
seamLocus: >
  Head-election, canonical-move, and reconcile-routing decision surface in the P2P
  projection-reconcile + head-adoption pipeline: src/services/head_adoption.rs (the
  adopt-before-author pre-flight and its HeadDecision rule), src/db/content_diesel.rs (the
  storage-side election-obey verdict), src/p2p/projection_reconcile.rs (gap classification,
  admission routing into the adopt/contest arms, heal-leg liveness and bounded-retry
  bookkeeping), and src/metrics.rs (the contest-failure reason vocabulary). EXTENDED
  (T12, 2026-08-08) to the head-plane trust-gradient program's AIMD batch-pacing +
  corpus-digest fold (src/p2p/reconcile_rails.rs), the batch-extern fallback seam
  (src/services/head_batch_resolver.rs), and the INERT trust-gradient decision surface
  (src/trust/{stage,pricer,snapshot}.rs; plan §3 L5).

decisionPoints:
  - name: ghost_decay_authorizes_author
    kind: pure-decision-predicate
    sourceLocation:
      file: src/services/head_adoption.rs
      modulePath: services::head_adoption::ghost_decay_authorizes_author
      line: 1134
    summary: >
      Operator-flag-gated (ELOHIM_GHOST_DECLARATION_DECAY, default off) downgrade of a
      Hold/ContestPeer decision to Author when the declaration holding the row is POSITIVELY
      falsified: own conductor observed empty for the id this sweep (LocalResolve::Resolved +
      Answer::Absent only) AND a peer is advertising a declared head in THIS sweep's hint
      window AND the advertiser's stated no-record verdict has STOOD the decay dwell
      (contest_backoff::evidence_absent_stood; config::ghost_decay_min_dwell, default 1h —
      one local-cache answer is never a fleet fact under the responder's local-strategy get)
      AND no local canonical election stands. The batch-3 phantom-declaration exit
      (diagnosed live 2026-08-10; hardened same day per review of a9f9d781b).
    concernIds:
      - id: C1
        status: answered
        justification: >
          Authors only over a declaration whose backing has been positively falsified twice
          over (never over a live crown — a visible election is obeyed earlier in the same
          pre-flight, and a local election disqualifies decay); flag-gated per pod so fleet
          participation is an operator decision; a later real canonical declaration (Declare
          mode) outranks the authored root, bounding a wrong decay to one extra election
          candidate.
      - id: C3
        status: answered
        justification: >
          This predicate IS the liveness exit for the phantom-declaration class (all-held
          ghost-witness sweeps, contest_failed{no_local_chain} with byte-less advertisers);
          without it that class holds forever by construction.
      - id: C4
        status: answered
        justification: >
          Every input is a positive observation: Answer::Unreachable and LocalResolve::Probe
          never qualify as local absence; the advertiser evidence is its own STATED no-record
          verdict (never a missing or timed-out answer) AND must have stood the decay dwell
          (a single local-strategy answer can mean not-yet-gossiped — full-arc law); a live
          advertising hint is required this sweep, so stale ledger hearsay alone never fires.
          Pinned by ghost_decay_requires_every_positive_observation and
          contest_backoff::tests::evidence_absent_stands_only_after_the_dwell.
      - id: C6a
        status: answered
        justification: >
          Pure predicate over four booleans — no loop, no retry ladder, no conductor call;
          the sweeps that consume its Author verdict keep their existing per-tick caps and
          wall-clock budgets unchanged.
      - id: C8
        status: answered
        justification: >
          BOTH paths are metered. The positive verdict increments
          elohim_content_ghost_decay_author_total (+ a WARN naming the falsified
          declaration); the refusal increments elohim_content_ghost_decay_blocked_total{leg}
          under a closed typed vocabulary (metrics::GhostDecayBlockedLeg — disabled ·
          local_not_observed_absent · local_election_stands · no_live_advertiser ·
          evidence_not_stood, all pre-touched) plus a per-row DEBUG carrying every leg input.
          Closed 2026-08-11 after the overnight soak: three pods held zero decay-authors for
          17h with no way to separate a missing flag from evidence starvation from a dwell
          still running — four different operator actions behind one silence. The classifier
          is pinned to the predicate over the full 2^5 input space so the meter can never
          explain a behaviour the arm does not have.
    contractTests:
      - path: elohim/elohim-storage/src/services/head_adoption.rs
        testName: ghost_decay_is_dormant_by_default
        kind: unit
      - path: elohim/elohim-storage/src/services/head_adoption.rs
        testName: ghost_decay_requires_every_positive_observation
        kind: unit
      - path: elohim/elohim-storage/src/services/head_adoption.rs
        testName: ghost_decay_blocked_leg_agrees_with_the_predicate
        kind: unit
  - name: select_path
    kind: pure-decision-predicate
    sourceLocation:
      file: src/p2p/transport_paths.rs
      modulePath: p2p::transport_paths::select_path
      line: 183
    summary: >
      Transport self-awareness (spec 2026-08-24 §3.1). Refines canon's
      peer_map::select_transport eligible set (planes BOTH peers support; Track3/NoShared
      never reach here) into a Route: Small ops RACE every eligible plane (the races are
      the probe — each yields an RTT sample per plane); Bulk ops SELECT the lowest-EWMA
      Sampled plane, with a deterministic exploration floor (1 in EXPLORE_EVERY picks) so
      the non-preferred live plane keeps earning samples; Unknown is its own state — in the
      race on Small, the IMMEDIATE Bulk pick until it earns one sample, preferred over
      Degraded, never last;
      Degraded is explored only every 2×EXPLORE_EVERY picks (never twice in a row for a
      large transfer). ELOHIM_TRANSPORT_SELECTION=off restores the static prior
      (labelled selection_off). Consumers: acquisition_dispatch::plan_acquisition_targets_selected
      (pull leg), P2PNode::push_shard_routed (write-time custody push, iroh leg + one fallback).
    concernIds:
      - id: C0
        status: answered
        justification: >
          T2 substrate, both swarms co-resident (TransportBackend::Dual); a route choice is a
          local, reversible, un-witnessed act.
      - id: C3
        status: answered
        justification: >
          Exploration floor keeps a non-preferred live plane sampled; a Degraded plane that
          starts succeeding returns to Sampled through the ring rate and the hint clearing
          on a clean success — no operator action. Test
          c3_degraded_plane_recovers_to_sampled_on_its_own.
      - id: C4
        status: answered
        justification: >
          Unknown never coerces to slow: it races on Small and is the Bulk exploration pick
          within EXPLORE_EVERY picks; with nothing Sampled it beats Degraded. Test
          c4_unknown_races_on_small_and_is_explored_on_bulk_within_n_picks.
      - id: C6a
        status: answered
        justification: >
          Race capped at the eligible set (≤2 planes); ring fixed at RING=16 per key; keys
          bounded by the peer book with a MAX_KEYS backstop; pure predicate, no retries.
      - id: C7
        status: partial
        justification: >
          Advertise/serve symmetry — an advertised plane that fails to serve is recorded
          Degraded (surfaces the drift) but the drift itself is not cured here.
      - id: C8
        status: answered
        justification: >
          Every Route increments elohim_transport_route_total{transport,op_class,reason}
          (closed vocabulary incl. fallback and selection_off); every verified success
          observes elohim_transport_path_rtt_ms{peer,transport,op_class};
          /p2p/status.transportPaths projects the ring.
      - id: C11
        status: answered
        justification: >
          saturation_hint lowers weight (Degraded) and never triggers a retry; the only
          retry is the single push fallback to the OTHER plane, counted as fallback.
    contractTests:
      - path: elohim/elohim-storage/src/p2p/transport_paths.rs
        testName: c4_unknown_races_on_small_and_is_explored_on_bulk_within_n_picks
        kind: unit
      - path: elohim/elohim-storage/src/p2p/transport_paths.rs
        testName: c3_degraded_plane_recovers_to_sampled_on_its_own
        kind: unit
      - path: elohim/elohim-storage/src/p2p/transport_paths.rs
        testName: degraded_is_avoided_and_never_explored_twice_in_a_row
        kind: unit
  - name: decide_head_action
    kind: pure-decision-predicate
    sourceLocation:
      file: src/services/head_adoption.rs
      modulePath: services::head_adoption::decide_head_action
      line: 1132
    summary: >
      Total decision rule choosing AdoptLocal / AdoptPeer / ContestPeer / ContestDivergent /
      Hold / Author from (own-conductor-canonical, peer-declared, local-declared,
      local-has-canonical-election, contest-enabled, peer-divergent-anchor). Presence-based,
      never timestamp-based. ContestDivergent (2026-08-14, SPIN discharge) fires from exactly
      one corner — nothing declared anywhere, no election, live divergence evidence, family
      switch on — and is proven not to change any pre-existing row of the table.
    concernIds:
      - id: C1
        status: answered
        justification: >
          Author is reachable only when nothing is declared anywhere (own_conductor_canonical_
          always_adopts_never_authors + author_is_reachable_only_when_no_head_exists_anywhere
          prove this exhaustively over the 2^5 input space); ContestPeer never crowns local
          authority — it only mints a DHT candidate for the zome's own arbiter to judge.
      - id: C2
        status: answered
        justification: >
          The rule is presence-based, not clock-based — it defers ALL ordering to the DHT
          election (content_store::select_canonical_winner) and the storage-side verdict that
          replays it (canonical_move_verdict). decide_head_action never compares timestamps
          itself.
      - id: C3
        status: answered
        justification: >
          Proven total over its full boolean input space by
          author_is_reachable_only_when_no_head_exists_anywhere (exactly 4 of 32 corners
          author, and only when no head exists anywhere) and
          contest_is_reachable_only_from_the_two_way_declared_corner — every input combination
          maps to exactly one of the five decisions, so no input state is a dead end.
    contractTests:
      - path: elohim/elohim-storage/src/services/head_adoption.rs
        testName: own_conductor_canonical_always_adopts_never_authors
        kind: unit
      - path: elohim/elohim-storage/src/services/head_adoption.rs
        testName: peer_declaration_on_an_undeclared_row_adopts
        kind: unit
      - path: elohim/elohim-storage/src/services/head_adoption.rs
        testName: an_existing_local_declaration_holds
        kind: unit
      - path: elohim/elohim-storage/src/services/head_adoption.rs
        testName: two_way_declared_without_an_election_contests
        kind: unit
      - path: elohim/elohim-storage/src/services/head_adoption.rs
        testName: a_row_obeying_an_election_holds_against_a_peer_advertising_the_loser
        kind: unit
      - path: elohim/elohim-storage/src/services/head_adoption.rs
        testName: contest_disabled_restores_the_old_hold
        kind: unit
      - path: elohim/elohim-storage/src/services/head_adoption.rs
        testName: nothing_declared_anywhere_authors
        kind: unit
      - path: elohim/elohim-storage/src/services/head_adoption.rs
        testName: author_is_reachable_only_when_no_head_exists_anywhere
        kind: unit
      - path: elohim/elohim-storage/src/services/head_adoption.rs
        testName: contest_is_reachable_only_from_the_two_way_declared_corner
        kind: unit
      - path: elohim/elohim-storage/src/services/head_adoption.rs
        testName: contest_divergent_is_reachable_only_from_the_undeclared_divergent_corner
        kind: unit
      - path: elohim/elohim-storage/src/services/head_adoption.rs
        testName: spin_arm_off_leaves_every_existing_row_unchanged
        kind: unit
      - path: elohim/elohim-storage/src/services/head_adoption.rs
        testName: spin_arm_defers_to_a_standing_election
        kind: unit
      - path: elohim/elohim-storage/src/services/head_adoption.rs
        testName: a_peer_declaration_outranks_divergence_evidence
        kind: unit

  - name: canonical_move_verdict
    kind: verdict-fn
    sourceLocation:
      file: src/db/content_diesel.rs
      modulePath: db::content_diesel::canonical_move_verdict
      line: 1321
    summary: >
      May a HealCanonical answer MOVE an already-declared row? Tier first (earned beats
      staging), then election-presence, then notarized clock — antisymmetric and total.
    notes: >
      This IS the "select_canonical_winner consumption side" named in this row's authoring
      task: it does not re-decide the DHT election, it replays the zome arbiter's own ordering
      (tier, then link clock) at the storage projection boundary and refuses any non-forward
      move. See content_store zome's seam-registry.yaml::select_canonical_winner for the
      DHT-side arbiter this obeys.
    concernIds:
      - id: C2
        status: answered
        justification: >
          canonical_move_verdict_is_antisymmetric_and_total proves the ordering is total and
          that no two distinct elections ever displace each other in both directions (the flap
          this exists to prevent).
    contractTests:
      - path: elohim/elohim-storage/src/db/content_diesel.rs
        testName: canonical_move_verdict_is_antisymmetric_and_total
        kind: unit
      - path: elohim/elohim-storage/src/db/content_diesel.rs
        testName: stale_reasons_are_distinct_and_labelled
        kind: unit

  - name: StaleReason
    kind: reason-outcome-enum
    sourceLocation:
      file: src/db/content_diesel.rs
      modulePath: db::content_diesel::StaleReason
      line: 1261
    summary: >
      Why a HealCanonical stamp declined to move a declared row — StoredNull / NotNewer / Tier.
      Label values for elohim_projection_heal_refused_stale_total{reason}.
    concernIds:
      - id: C2
        status: answered
        justification: The three variants correspond exactly to canonical_move_verdict's ordering rules.
      - id: C8
        status: answered
        justification: >
          stale_reasons_are_distinct_and_labelled asserts label() values are pairwise distinct
          — a metric label vocabulary that cannot collapse two different refusals into one
          string.
    contractTests:
      - path: elohim/elohim-storage/src/db/content_diesel.rs
        testName: stale_reasons_are_distinct_and_labelled
        kind: unit

  - name: LocalResolve
    kind: boundary-answer-type
    sourceLocation:
      file: src/services/head_adoption.rs
      modulePath: services::head_adoption::LocalResolve
      line: 244
    summary: >
      What the pre-flight resolved from the OWN conductor: Probe (not yet asked) / Known(Option)
      (observed-or-cached) / Unresolved (asked, timed out — absence NOT observed). The
      Known(None)-vs-Unresolved split closes a documented CONTRACT DEVIATION where both
      provenances used to collapse into one variant.
    concernIds:
      - id: C4
        status: answered
        justification: >
          Split on 2026-08-02 specifically so "observed absent" (Known(None)) and "unknown,
          conductor did not answer" (Unresolved) can never again be silently conflated — named
          directly in this plan's own text as the first seam-contracts adoption target for
          Answer<T> (P1.2).
    contractTests: null
    gapNote: >
      Constructed and consumed at more sites than the type definition alone (grep-verified
      2026-08-02): the two match arms in try_adopt_canonical_head
      (src/services/head_adoption.rs:490,506,509, both of which fold to the SAME `None` today
      per the documented CONTRACT DEVIATION), the adopt-before-author pre-flight in
      witness_ghost_anchors (src/p2p/projection_reconcile.rs:1788), the adopt_deferred_heads
      loop that maps a fetch result onto Known/Unresolved (src/p2p/projection_reconcile.rs:
      3198-3199), and reanchor_backfill's construction (src/services/reanchor_backfill.rs:287).
      The true gap: no unit test asserts on LocalResolve::Known vs LocalResolve::Unresolved
      directly — decide_head_action's tests exercise the downstream bool this degrades to, not
      the enum itself. This is exactly the gap plan task P1.2 closes by retrofitting this type
      onto seam_contracts::Answer<T> with its own contract test.

  - name: ContestFailure (metrics::inc_contest_failed)
    kind: reason-outcome-enum
    sourceLocation:
      file: src/metrics.rs
      modulePath: metrics::ContestFailure
      line: 1524
    summary: >
      Why a contest attempt minted nothing, as a closed typed vocabulary implementing
      seam_contracts::ReasonLabel — "no_local_chain" | "not_retrievable" | "fetch_none" |
      "declare_error" | "adopt_refused". The first four are the original literals, pinned
      BYTE-IDENTICAL because dashboards key on them; the fifth was APPENDED (never inserted)
      by ADOPT-BEFORE-AUTHOR, 2026-08-03.
    notes: >
      This row was registered pre-P1.3 as four stringly-typed &str literals with the typed
      replacement named as the gap. P1.3 landed the ContestFailure enum + ReasonLabel impl, and
      2026-08-03 added AdoptRefused. Updated in place rather than re-registered so the row's
      history stays readable: the gap it was filed to track is closed, and the new variant
      arrived under the same discipline (append-only labels, one variant per genuinely new
      refusal shape).
    concernIds:
      - id: C4
        status: answered
        justification: >
          The honest-absence distinctions are now structural, not doc-only: "no_local_chain"
          (this conductor genuinely holds no chain for the id — a target-INDEPENDENT gate) is a
          separate variant from "not_retrievable" (the chain exists, the target could not be
          resolved, AND we had bytes) and "fetch_none" (same wall, no bytes served) — and
          "adopt_refused" is separate again: it means the evidence branch RAN and the zome
          rejected the record, which is neither an absence nor a fetch problem. The set is
          pinned by the_adopt_refusal_label_is_additive_and_distinct.
      - id: C8
        status: answered
        justification: >
          A closed Rust type with ReasonLabel::ALL, so the compiler enumerates the vocabulary
          and a dashboard can too; inc_contest_failed takes the type, not a &str, so a typo'd
          sixth literal is no longer expressible. The label-set test pins both stability (the
          four original strings, in order) and separability (no duplicates).
      - id: C1
        status: n-a
        justification: >
          This type only NAMES a contest-failure class; it does not itself gate or permit any
          self-election. The C1 guards it observes live upstream at
          content_store::classify_chain_gate / declare_canonical_head_inner (see the
          content_store zome's seam-registry.yaml).
    contractTests:
      - path: elohim/elohim-storage/src/services/head_adoption.rs
        testName: the_adopt_refusal_label_is_additive_and_distinct
        kind: unit
        mirrorRisk: false

  - name: AcquisitionReconcileOutcome
    kind: reason-outcome-enum
    sourceLocation:
      file: src/metrics.rs
      modulePath: metrics::AcquisitionReconcileOutcome
      line: 2074
    summary: >
      Closed operational vocabulary for every scheduled acquisition-reconcile tick:
      completed, sync_paused, db_pool_missing, db_pool_unavailable, pin_load_failed, or
      presence_query_failed. It is the status-honesty seam that distinguishes a completed census
      observing zero active pins from a pull loop that returned before its first census.
    concernIds:
      - id: C0
        status: answered
        justification: >
          Category C projection-plane telemetry over local acquisition_pins × local content
          presence. It neither records nor changes custody truth, reach, or canonical heads.
      - id: C1
        status: n-a
        justification: This vocabulary observes a local reconcile and selects no candidate or crown.
      - id: C2
        status: n-a
        justification: It moves no authority-bearing state and compares no clocks.
      - id: C3
        status: answered
        justification: >
          Every early return leaves the existing fixed-cadence tick enabled; the typed outcome
          exposes which precondition withheld this pass instead of creating a terminal state.
      - id: C4
        status: answered
        justification: >
          pull remains null until a DB-backed reconcile completes. After completion, total=0 and
          active_pins=0 are positive empty observations beside initialized=1, never fabricated
          defaults. The acquisition-state unit test pins both sides of the distinction.
      - id: C5
        status: n-a
        justification: No transferred evidence or peer claim is accepted by this local census.
      - id: C6a
        status: answered
        justification: >
          Adds O(1) counter/gauge emission to the existing fixed 60-second tick and no loop,
          retry, peer request, conductor call, or corpus-proportional work.
      - id: C6b
        status: n-a
        justification: >
          These counters intentionally count scheduled occurrences; the observed reconcile state
          remains a replace-in-place in-memory projection and mints no durable effect.
      - id: C7
        status: answered
        justification: >
          Every advertised label is pre-touched at registration and each variant is returned by a
          real completed, paused, or early-return branch; the contract test asserts the stable set.
      - id: C8
        status: answered
        justification: >
          Every scheduled tick increments exactly one label through a ReasonLabel enum, including
          success. Callers cannot invent raw-string outcome classes.
      - id: C9
        status: n-a
        justification: No identity, key, or lineage state participates in this observation.
      - id: C10
        status: answered
        justification: >
          The existing nullable pull wire shape is unchanged; its schema now states null-until-
          first-reconcile semantics, and schema_contract asserts null is explicitly serialized.
      - id: C11
        status: answered
        justification: >
          Backpressure withholding is a distinct sync_paused outcome rather than an invisible
          skip, while the established pause policy and cadence remain unchanged.
      - id: C12
        status: n-a
        justification: This observation authorizes no action and crosses no consent boundary.
      - id: C13
        status: n-a
        justification: This is production telemetry, not an authority scaffold or temporary gate.
      - id: C14
        status: answered
        justification: >
          The completed arm plus every pre-census failure/skip arm is closed in the enum, counted,
          and warned with branch-specific context; no reconcile early return remains silent.
    contractTests:
      - path: elohim/elohim-storage/src/metrics.rs
        testName: acquisition_reconcile_outcomes_are_stable_pretouched_and_incrementable
        kind: unit
      - path: elohim/elohim-storage/src/p2p/acquisition.rs
        testName: pull_is_null_until_a_reconcile_observes_the_desired_set
        kind: unit
      - path: elohim/elohim-storage/tests/schema_contract.rs
        testName: p2p_status_view_with_null_drain_and_uninitialized_pull
        kind: integration

  - name: declared_divergence_should_route_to_contest
    kind: pure-decision-predicate
    sourceLocation:
      file: src/p2p/projection_reconcile.rs
      modulePath: p2p::projection_reconcile::declared_divergence_should_route_to_contest
      line: 731
    summary: >
      Should a DECLARED row whose divergence heal just refused be handed to the adopt/contest
      arm? Four required conditions: non-canonical answer, local declared, peer advertises a
      DIFFERENT head, and no local canonical election yet (quiescence).
    concernIds:
      - id: C1
        status: answered
        justification: >
          Admits the row into the SAME ContestPeer branch decide_head_action already proves
          never crowns local authority — it supplies a DHT candidate, never a decision.
      - id: C4
        status: answered
        justification: >
          Closes the "no candidate list at all" dead-end (edge #1291) where a declared,
          chain-holding row got SkippedDeclared and vanished from both adopt-candidate paths —
          an honest-absence-adjacent silent-drop class.
      - id: C6b
        status: answered
        justification: >
          The fourth condition (!local_has_canonical_election) is the QUIESCENCE gate — once an
          election stands behind the row, admission_and_the_gapfill_guard_never_both_fire-style
          reasoning applies: re-admitting a settled row would re-mint a link every sweep
          forever.
    contractTests:
      - path: elohim/elohim-storage/src/p2p/projection_reconcile.rs
        testName: declared_divergence_admission_requires_all_four_conditions
        kind: unit
      - path: elohim/elohim-storage/src/p2p/projection_reconcile.rs
        testName: admission_and_the_gapfill_guard_never_both_fire
        kind: unit
        mirrorRisk: false
      - path: elohim/elohim-storage/src/p2p/projection_reconcile.rs
        testName: the_declared_axis_is_now_covered_by_exactly_one_route
        kind: unit

  - name: undeclared_divergence_should_route_to_contest
    kind: pure-decision-predicate
    sourceLocation:
      file: src/p2p/projection_reconcile.rs
