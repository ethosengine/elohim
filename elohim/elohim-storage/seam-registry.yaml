  - name: select_rotation_candidates
    kind: pure-decision-predicate
    sourceLocation:
      file: src/services/custody_rotation.rs
      modulePath: services::custody_rotation::select_rotation_candidates
      line: 260
    summary: >
      Which of this node's ACTIVE `custody-blob` pledges have drifted off the bytes their
      content now points at, and therefore need a successor pledge authored. A pledge is a
      candidate iff its metadata resolves a contentId, that content row's blob column FOR THE
      PLEDGE'S ARTIFACT ROLE (blob_hash vs server_blob_hash) is non-empty, that current blob
      appears in NONE of the pledge's resource_classified_as entries, and the deterministic
      successor id for (provider, receiver, current blob) is not already present. Reads and
      decides only — the acting half (possession gate, notarized author, supersession) is
      run_rotation_pass. Closes the last unwired station in the ch07 custody chain: the
      manifest re-stamps, self-held evidence records, and the fold classifies, but nothing
      authored a successor when a redeploy rotated the blob underneath the promise.
    concernIds:
      - id: C4
        status: answered
        justification: >
          A pledge whose metadata_json is absent, unparseable, or carries no contentId is
          SKIPPED and counted (no_content_id) — never matched to a content row by inference.
          Missing content row and NULL/empty blob column are their own distinct answer
          (content_blob_absent), not folded into "nothing to do". Pinned by
          pledge_without_a_resolvable_content_id_is_skipped_and_counted and
          pledge_for_missing_content_or_empty_blob_is_skipped_and_counted.
      - id: C6a
        status: answered
        justification: >
          One bounded pass over this node's own active custody pledges — chunked eq_any, no
          retry ladder, no conductor call inside the predicate. A failed author or supersede
          is counted and left for the next level-triggered tick, never retried in-loop.
      - id: C6b
        status: answered
        justification: >
          The successor id is deterministic over (provider, receiver, current blob), so a
          replayed pass against settled state mints nothing: an existing successor drops the
          row as successor_exists, and the predecessor's supersession mark is itself
          idempotent (mark_superseded returns success on an already-superseded row). Pinned
          by existing_successor_makes_detection_an_idempotent_no_op and the second-pass leg
          of rotation_pass_authors_the_successor_and_supersedes_first_write_wins.
      - id: C8
        status: answered
        justification: >
          Every examined pledge lands in exactly one counted outcome — the typed
          metrics::CustodyRotationSkip vocabulary beside the
          elohim_custody_rotation_authored_total success series, so a rotation rate is
          readable rather than inferred. All seven label combinations are pre-touched at
          registration; label strings are pinned by rotation_skip_labels_are_stable.
      - id: C10
        status: answered
        justification: >
          A custody pledge is a contract over specific bytes, and this is where that contract
          evolves: the successor is a NEW notarized commitment and the predecessor is retired
          through the documented supersession ceremony (db::rea_commitments::mark_superseded,
          "at most one non-superseded successor per predecessor; first-write-wins") — the old
          promise is never silently mutated in place or defaulted onto new bytes. The
          successor's metadata carries the `supersedes` pointer so the chain stays walkable.
      - id: C12
        status: answered
        justification: >
          Only pledges whose provider is in the caller's self_agent_cids are ever rotated —
          this node re-states its OWN promises and never rewrites a peer's. Pinned by
          non_self_provider_and_non_active_rows_are_invisible.
    contractTests:
      - path: elohim/elohim-storage/src/services/custody_rotation.rs
        testName: divergent_active_pledge_is_a_rotation_candidate
        kind: unit
      - path: elohim/elohim-storage/src/services/custody_rotation.rs
        testName: pledge_without_a_resolvable_content_id_is_skipped_and_counted
        kind: unit
      - path: elohim/elohim-storage/src/services/custody_rotation.rs
        testName: existing_successor_makes_detection_an_idempotent_no_op
        kind: unit
      - path: elohim/elohim-storage/src/services/custody_rotation.rs
        testName: ssr_server_pledge_tracks_the_server_blob_column
        kind: unit
      - path: elohim/elohim-storage/src/services/custody_rotation.rs
        testName: rotation_pass_authors_the_successor_and_supersedes_first_write_wins
        kind: unit
      - path: elohim/elohim-storage/src/services/custody_rotation.rs
        testName: rotation_makes_the_custody_fold_report_stocked
        kind: unit

  - name: sync_gate_effective_sync
    kind: verdict-fn
    sourceLocation:
      file: src/p2p/sync_gate.rs
      modulePath: p2p::sync_gate::effective_sync
      line: 172
    summary: >
      The ONE reason-carrying verdict for "may sync run right now?" — composes the operator
      mode (sync | paused | wifi-only), the device-DECLARED network class (wifi | cellular |
      unknown; never sniffed), and the three pre-existing internal suppression sources
      (ImportInProgress, BulkWriteInProgress, DrainBacklog) as a monotonic OR. Every surface
      reads this gate: the P2P event-loop tick guards (SyncGate::suppressed), /p2p/status
      syncPaused/syncMode/networkClass/syncReasons, GET/POST /p2p/sync-mode, and the doorway
      /health p2p block (proxied syncPaused/syncReasons). Deliberately NO second pause plane —
      the prior shared AtomicBool's call-sites (bulk create, account import, drain
      auto-suppress) route through the gate's counter/flag sources. Design:
      genesis/data/timeline/backlog/p2p-sync-mode-unified-gate-design.md (p2p-design-gate run
      2026-08-22; SyncModeState + SyncModeTransition both Ephemeral/C, SQLite operational,
      history capped at 500).
    concernIds:
      - id: C2
        status: answered
        justification: >
          Suppression is a monotonic OR — no source can un-suppress another; pinned by
          composition_is_monotonic_or_naming_every_active_source.
      - id: C3
        status: answered
        justification: >
          Every suppression source has a release path (operator POST, network-class change,
          RAII guard drop on operation end, drain backlog clearing) and reasons[] names what
          holds it; guard-release pinned by gate_counters_release_only_when_last_operation_ends.
      - id: C4
        status: answered
        justification: >
          network=unknown is honest and does NOT suppress under wifi-only — the cellular guard
          is an opt-in protection and unknown is surfaced, never guessed. Pinned by
          wifi_only_on_unknown_network_does_not_suppress; unrecognized mode/network strings are
          parse rejections (mode_and_network_parse_reject_unknown_strings), never a guess.
      - id: C6b
        status: answered
        justification: >
          POST /p2p/sync-mode is idempotent — a same-mode POST is a no-op that still returns
          200 and appends NO history row; pinned by
          http::sync_mode_control_tests::sync_mode_post_is_idempotent_and_records_history.
      - id: C8
        status: answered
        justification: >
          Every mode/network transition appends a bounded history row with source + reason
          (operator | network-change), pruned at 500 (db::sync_mode::tests::
          transition_history_prunes_to_cap); served newest-first at /p2p/sync-mode/history.
      - id: C12
        status: partial
        justification: >
          The POSTs are operator levers: declared auth_required in build_manifest() so the
          doorway proxy gates them, but there is no finer /p2p admin-auth class on the storage
