    contractTests:
      - path: elohim/elohim-storage/src/p2p/projection_reconcile.rs
        testName: a_conductor_missing_row_routes_to_adopt_exactly_when_a_peer_declares
        kind: unit

  - name: classify_content_gap
    kind: pure-decision-predicate
    sourceLocation:
