    concernIds:
      - id: C1
        status: answered
        justification: >
          gapfill_refuses_to_self_elect_over_a_peers_declaration is the direct regression test
          for the exact live trace this guard exists to stop — a self-authored fallback root
          becoming a PERMANENT, QUIET divergence.
    contractTests:
      - path: elohim/elohim-storage/src/p2p/projection_reconcile.rs
        testName: gapfill_refuses_to_self_elect_over_a_peers_declaration
        kind: unit
      - path: elohim/elohim-storage/src/p2p/projection_reconcile.rs
        testName: gapfill_is_unchanged_without_a_peer_hint
        kind: unit
      - path: elohim/elohim-storage/src/p2p/projection_reconcile.rs
        testName: gapfill_guard_never_fires_on_a_canonical_answer
        kind: unit
      - path: elohim/elohim-storage/src/p2p/projection_reconcile.rs
        testName: gapfill_guard_never_fires_on_an_already_declared_row
        kind: unit
      - path: elohim/elohim-storage/src/p2p/projection_reconcile.rs
        testName: admission_and_the_gapfill_guard_never_both_fire
        kind: unit
        mirrorRisk: false

  - name: timeout_should_route_to_adopt
    kind: pure-decision-predicate
    sourceLocation:
      file: src/p2p/projection_reconcile.rs
      modulePath: p2p::projection_reconcile::timeout_should_route_to_adopt
      line: 690
    summary: >
      Should a FAILED own-conductor resolve be handed to adopt-before-author instead of dropped
      for the sweep? Yes iff the failure was transient (timeout-class) AND a peer advertises a
      declaration.
    concernIds:
      - id: C4
        status: answered
        justification: >
          Closes the drop-forever hole where a timed-out row landed in NEITHER the ghost list
          (needs Ok(None)) nor the adopt list — an unresponsive conductor silently re-dropped
          the id every sweep. Distinguishes transient (unknown) from a genuine decode/logic
          refusal.
    contractTests:
      - path: elohim/elohim-storage/src/p2p/projection_reconcile.rs
        testName: timeout_routes_to_adopt_only_with_a_peer_hint
        kind: unit

  - name: conductor_missing_should_route_to_adopt
    kind: pure-decision-predicate
    sourceLocation:
      file: src/p2p/projection_reconcile.rs
      modulePath: p2p::projection_reconcile::conductor_missing_should_route_to_adopt
      line: 773
    summary: >
      Should a CONDUCTOR-MISSING row (resolve_content_head answered Ok(None)) also be routed to
