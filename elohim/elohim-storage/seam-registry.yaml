      `head_corpus_digest_in_sync` exists (grep-verified); no separate row is registered.
    concernIds:
      - id: C0
        status: answered
        justification: >
          Explicitly lives on the head/version projection plane: NULL anchor presence is the
          local projection's evidence that DHT witness is pending; it says nothing about blob
          custody or audience policy.
      - id: C1
        status: n-a
        justification: The type selects no candidate and authors or crowns no head.
      - id: C2
        status: n-a
        justification: The type observes anchor presence and never permits or applies a move.
      - id: C3
        status: n-a
        justification: This is an observation type, not the witness state machine that advances Amber to Ready.
      - id: C4
        status: answered
        justification: >
          Amber{pending} and Ready{digest,total} are structurally distinct; an incomplete
          relation cannot be mistaken for an empty or complete corpus.
      - id: C5
        status: n-a
        justification: The answer is derived from local SQL and confers no authority from peer evidence.
      - id: C6a
        status: partial
        justification: >
          One SQL snapshot and one linear digest fold replace the former page-query-plus-second-
          digest-query race, and callers invoke it at most once per reconcile request/sweep.
          The whole-corpus fold is inherently O(local distribution-safe rows) and has no explicit
          row ceiling; profiling evidence is sub-ms at ~3,469 rows, but a future unbounded corpus
          would require streaming or an operator budget.
      - id: C6b
        status: n-a
        justification: The type and its constructor query are read-only and mint no effect.
      - id: C7
        status: answered
        justification: >
          The query reuses the exact DISTRIBUTION_SAFE_REACH constant used by
          list_content_anchor_inventory; the contract test proves a scoped NULL-anchor row does
          not hold a cross-peer digest amber while a public one does.
      - id: C8
        status: partial
        justification: >
          Call sites log the pending count and readiness-query failures, but no Prometheus series
          yet exposes amber duration or the ready/amber decision ratio across the fleet.
      - id: C9
        status: n-a
        justification: No agent or transport identity participates in corpus readiness.
      - id: C10
        status: answered
        justification: >
          Readiness changes no wire type; it gates the already-additive optional digest/in_sync
          fields whose old/new MessagePack compatibility fixtures remain pinned in elohim-views.
      - id: C11
        status: n-a
        justification: The query is locally scheduled and does not consume externally imposed traffic directly.
      - id: C12
        status: n-a
        justification: It authorizes no write, disclosure, or custody action.
      - id: C13
        status: n-a
        justification: It prices no authority tier and changes no verification floor.
      - id: C14
        status: n-a
        justification: Amber is expected witness progress, not an unexplained residual or failed branch.
    contractTests:
