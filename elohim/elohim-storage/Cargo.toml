[package]
name = "elohim-storage"
version = "0.1.0"
edition = "2021"
description = "Blob storage sidecar for Elohim nodes - runs alongside Holochain conductor"
authors = ["Elohim Protocol"]
license = "AGPL-3.0"

[dependencies]
# EPR canonical codec (Phase 1 — generalized atom)
elohim-epr = { path = "../epr" }
elohim-ark-core = { path = "../ark/core" }

# Executable seam contracts — the concern canon as compile shapes: Answer<T>
# (C4 honest absence) and ReasonLabel (C8 observability-per-decision). Leaf
# crate, zero first-party deps, std-only default. Versioned like the other
# publishable first-party crates (eprfs-* precedent) because it is published to
# the `elohim` registry; the path wins for in-tree resolution.
# See genesis/docs/superpowers/plans/2026-08-02-seam-concern-contract-architecture-plan.md
elohim-seam-contracts = { version = "0.1.0", path = "../../crates/seam-contracts" }

# SDK boundary types — View types migrate here incrementally from views.rs
elohim-sdk = { path = "../../crates/elohim-sdk" }

# Wire-shape view types (ts-rs-anchored) — atomic migration from views.rs (VIEWS.T2)
elohim-views = { path = "../elohim-views" }

# Pure lens crate — select→fold→aggregate folds over the holder-relation. The
# resiliency facing's folds live here (DB-free); household_resilience.rs is a thin
# adapter that loads the relation and calls them. See 2026-06-19 facings design §11.
elohim-facings = { path = "../elohim-facings" }

# Wave-3 serve-routing: capability-aware peer ranking (score module, pure logic).
# `serve-routing` feature gates only the `score` module; storage never needs `guard`.
# See genesis/docs/superpowers/specs/2026-06-20-doorway-membrane-prosocial-routing-design.md
elohim-peer-fabric = { path = "../elohim-peer-fabric", default-features = false, features = ["serve-routing"] }

# Shefa-types — canonical wire-shape for content_store coordinator function inputs
# (CreateReaCommitmentInput, ReaCommitmentOutput, etc.). Required by the
# services::conductor_writes facade per 2026-05-26-substrate-rea-replication-fix.md
shefa-types = { path = "../sdk/domains/shefa/types" }

# Lamad-types — canonical wire-shape for content_store CONTENT coordinator
# functions (CreateContentInput, UpdateContentInput, ContentOutput). Required
# by services::conductor_writes for the content side of the substrate-correct
# write path (Task 8c).
lamad-types = { path = "../sdk/domains/lamad/types" }

# Server-side rendering via V8 / deno_core (opt-in; most peer hardware can't sustain V8)
elohim-render = { path = "../elohim-render", optional = true }

# Light, V8-free omnibar element asset (bytes/hash/path) for the /chrome route.
# In the DEFAULT feature set — serving the static element must not pull deno_core.
elohim-chrome-asset = { path = "../elohim-chrome-asset" }

# Constitutional layer — principles, boundaries, agent reasoning
constitution = { path = "../constitution" }

# Doorway route registration
doorway-client = { path = "../../crates/doorway-client" }

# Wave 3 — valueflows bridge (hREA / VF-GraphQL interop).
# See genesis/docs/content/elohim-protocol/architecture/2026-05-20-wave3-valueflows-hrea-interop-design.md
valueflows-bridge = { path = "../../bridges/valueflows/valueflows-bridge" }
valueflows-types = { path = "../../bridges/valueflows/valueflows-types" }

# DID bridge (W3C DID 1.1 identity projection). elohim-storage implements the
# `did:elohim` ElohimIdentityStore assembly contract and resolves it.
# See genesis/docs/superpowers/specs/2026-07-17-did-bridge-identity-resolution-design.md
did-bridge = { path = "../../bridges/did/did-bridge" }
did-types = { path = "../../bridges/did/did-types" }

# Protocol cache substrate
elohim-cache-core = { path = "../elohim-cache-core", features = ["native"] }

# Shared compute reporting (BuildInfo, health, counters)
elohim-compute = { path = "../elohim-compute" }

# Async runtime
tokio = { version = "1", features = ["full", "fs"] }
tokio-stream = { version = "0.1", features = ["sync", "time"] }

# HTTP server for shard API
hyper = { version = "1", features = ["full", "http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
http-body-util = "0.1"
bytes = "1"

# WebSocket for Holochain conductor communication
tokio-tungstenite = "0.24"
hyper-tungstenite = "0.15"
futures-util = "0.3"

# MessagePack for Holochain protocol
rmp = "0.8"
rmp-serde = "1.3"
rmpv = "1.3"

# Official Holochain client for signed zome calls
# Holochain 0.6 requires signed calls with nonce, expires_at, and signature
# Use lair_signing for the signer, but not wasmer (we're native, not wasm)
# EXACT PIN (2026-08-08) — the client family is taken from the CONDUCTOR FORK
# ITSELF, as a git dep on an immutable rev. Three constraints pin it there.
#
# 1. THE ADMIN-SEAM CONSTRAINT — why a bare "whatever resolves" pin is banned.
# The conductor emits `relay_url` in the AppManifestV0 wire shape carried inside
# every AppInfo. `AppManifestV0` is `#[serde(deny_unknown_fields)]`, so a client
# whose holochain_types does not KNOW that field rejects EVERY list_apps /
# install_app / enable_app response with
#   Deserialize("unknown field relay_url, expected one of name, description,
#    roles, allow_deferred_memproofs, bootstrap_url, signal_url")
# which takes down `happ_manager::ensure_happ_installed`, `hc_client`'s ping and
# `signing`'s cell discovery — the whole storage<->conductor admin seam,
# fleet-wide (alpha iroh partition, 2026-08-07).
# Guard: tests/happ_manifest_relay_url_compat.rs.
#
# 2. THE holo_hash EXACT-PIN CONSTRAINT — the real reason the previous pin was
# =0.9.0-dev.24, and the reason a published 0.8.3 CANNOT be used. The sdk domain
# -types crates (elohim/sdk/domains/*/types, compiled into integrity WASM) hold
# `holo_hash = "=0.6.0"` as a DNA-hash guard. crates.io `holochain_client 0.8.3`
# requires `holo_hash ^0.6.3`. Both are the same semver-compatible 0.6.x range,
# so cargo UNIFIES them into one package and the two requirements deadlock:
#   error: failed to select a version for `holo_hash`.
#     ... versions that meet the requirements `=0.6.0` are: 0.6.0
#     ... previously selected package `holo_hash v0.6.3`
# The 0.7-dev client family sidestepped this only by living in a semver-
# INCOMPATIBLE holo_hash range (0.7.0-dev.x), which is what let two holo_hash
# packages coexist — and which in turn forced the holochain_serialized_bytes
# 0.0.56/0.0.57 serde deadlock and the vendored [patch.crates-io] below.
# A git dep resolves this properly: cargo treats `holo_hash` from a git source
# as a DISTINCT package from the registry one, so the fork's 0.6.3 and the sdk's
# =0.6.0 coexist exactly the way 0.7.0-dev.9 and 0.6.0 did — same graph shape,
# same single libsqlite3-sys, but now the client matches the conductor.
#
# 3. THE FORK-LINEAGE CONSTRAINT — the point of the exercise. The conductor we
# run is elohim/holochain-conductor, branch `elohim-0.6.3` (6d0814266, pushed to
# github.com/ethosengine/holochain). `git diff --stat holochain-0.6.3..elohim-0.6.3`
# touches only crates/holochain (bin main, an iroh integration test, Cargo.toml),
# crates/holochain_p2p, and the root manifest/lock — NO client-family crate. So
# at this rev the fork's client is byte-identical to upstream 0.8.3, and pinning
# it here costs nothing in wire terms while making the fork the source of record.
# Capabilities added to the fork's app interface — first instance: the Stage-1
# call-deadline patch on branch `elohim-0.6.3-call-deadline` @ 8ee534862 — become
# consumable by bumping `rev` alone, with no version negotiation, no wire skew
# and no API audit. That was structurally impossible across the 0.9.0-dev split.
#
# Note the correction this pin embeds: `relay_url` is NOT exclusive to the 0.7-dev
# line. It is present in upstream 0.6.3 itself, at
#   crates/holochain_types/src/app/app_manifest/app_manifest_v0.rs:70
# (tag `holochain-0.6.3`). The 0.7-dev climb was never required to clear
# constraint 1; it only ever served as a workaround for constraint 2.
#
# Do NOT convert these to a filesystem path dep into elohim/holochain-conductor:
# that clone is untracked, and a new path dep needs COPY+sed wiring in BOTH edge
# Dockerfiles. Keep `rev` (immutable), never `branch`. Move all three together.
holochain_client = { git = "https://github.com/ethosengine/holochain.git", rev = "6d08142662d9c954a1ffac985df6b2fc449a4a10", default-features = false, features = ["lair_signing"] }
holochain_types = { git = "https://github.com/ethosengine/holochain.git", rev = "6d08142662d9c954a1ffac985df6b2fc449a4a10", default-features = false }
# Direct use is limited to Bundle::new in happ_manager's coordinator hot-swap;
# version must stay in the range holochain_types resolves (one shared crate).
mr_bundle = { git = "https://github.com/ethosengine/holochain.git", rev = "6d08142662d9c954a1ffac985df6b2fc449a4a10", default-features = false }

# TOMBSTONE NOTE (2026-08-07, now dormant): `holochain_sqlite` 0.7.0+deprecated is
# not a soft deprecation — it is a tombstone crate whose lib body is a bare
# `compile_error!("the holochain_sqlite crate is deprecated and no longer
# available; use holochain_data instead")`. It hard-FAILS the build.
#
# holochain_sqlite is a transitive dep of holochain_types. On the 0.6.3 family the
# requirement is `^0.6.3`, which cannot reach the 0.7.0 tombstone, so this trap is
# out of range while the pins above hold. It re-arms the moment anything drags the
# 0.7 line back in (a caret `^0.7.0-dev.x` resolves `0.7.0+deprecated` as the
# MAXIMUM match — build metadata does not lower a semver version). If a broad
# `cargo update` ever re-lands it, the build fails in a third-party crate with no
# obvious link to the change; the escape is:
#   cargo update -p holochain_sqlite --precise 0.7.0-dev.24
# This resolves for real when the holochain family migrates to `holochain_data`.

# Provide custom getrandom implementation for holochain's wasm-oriented dependencies
# The custom backend delegates to std on native platforms
getrandom = { version = "0.3", features = ["std"] }

# Async traits
async-trait = "0.1"

# HTTP client for inference providers
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Content-addressed storage
sha2 = "0.10"
hex = "0.4"
# Shamir Secret Sharing over GF(256) — Recovery M4 T21 share-reconstruction primitive.
#
# Crate choice rationale: `sharks 0.5` implements Shamir's Secret Sharing over
# GF(256) with a clean split/combine API, no_std compatible, ~300 lines of
# pure Rust, no heavy crypto deps beyond its own GF(256) arithmetic. It handles
# arbitrary-length secrets by splitting each byte independently (standard SSS
# approach). `vsss-rs` was also evaluated but adds verifiable-share machinery
# (Feldman / Pedersen VSS), extra deps, and a more complex API; the verifiable
# layer is out of scope here because the authorization chain is the DHT
# attestation (the social proof), not the share itself. `sharks` is the
# simpler, more auditable choice for a pure-SSS transport primitive.
sharks = "0.5"
base64 = "0.22"
# Fast hash for pubkey fingerprints (verified_signer_fingerprint — Task A.7)
blake3 = "1"
# Ed25519 verify_strict for resolver-backed EPR signature check (Task A.7)
ed25519-dalek = { version = "2.1", features = ["digest"] }
# Sealed-against-self 2-of-2 crypto (Task T11 — EPR Phase 3.5)
# Pure-Rust libsodium-compatible sealed boxes (X25519/XSalsa20/Poly1305).
# default-features=false strips sodiumoxide compat tests; serde enables
# Serialize/Deserialize on DryocBox types.
dryoc = { version = "0.6", default-features = false, features = ["serde"] }
hostname = "0.4"  # gethostname() for node-shape self-registration at boot
url = "2"  # Query string parsing for HTTP sync API
percent-encoding = "2"  # /db/content/{id} path-segment decoding — seeded ids carry spaces

# CID (Content Identifiers) - IPFS-compatible content addressing
cid = "0.11"
# multihash-codetable 0.2 (not 0.1): every published `core2` version — 0.0.0
# through 0.4.0 — is YANKED, and codetable 0.1.x hard-depends on `core2 ^0.4.0`.
# 0.2.x replaced it with `no_std_io2`. This also unifies with elohim-epr, which
# already declares 0.2, and drops the duplicate digest/sha2/sha3/keccak 0.10 tree.
multihash-codetable = { version = "0.2", features = ["sha2"] }

# IPLD codecs for EPR Head serialization (versions match rust-ipfs workspace)
serde_ipld_dagcbor = "0.6.3"
serde_ipld_dagjson = "0.2.1"
ipld-core = { version = "0.4.1", features = ["serde"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
serde_bytes = "0.11"
ciborium = "0.2"

# TypeScript generation from Rust types
ts-rs = { version = "10.1", features = ["serde-compat"] }

# H3 hexagonal spatial index — maps to constitutional governance layers
h3o = "0.9"

# Local database for metadata
sled = "0.34"

# SQLite via Diesel ORM - compile-time verified queries
# r2d2 for connection pooling (replaces single mutex pattern)
diesel = { version = "2.2", features = ["sqlite", "r2d2"] }
diesel_migrations = "2.2"


# CRDT sync - Automerge for offline-first document sync
automerge = "0.10"

# Concurrent hash map for policy hot cache
dashmap = "5"

# LRU cache for per-agent pubkey timeline hot path (Task A.6)
lru = "0.12"

# Compute-reporting foundation — POSIX sysinfo/getrusage/sysconf primitives
# used by services/system_metrics.rs (memory probes, future CPU/page-size).
# Filesystem-capacity stays on fs4 (heartbeat::measure_free_pct convention).
libc = "0.2"

# Prometheus app-metrics surface — durable /metrics exposition for the
# design-decision toolkit (memory-attribution gauges, identity-namespace
# violation counter, RCA instruments). Matches elohim-bitswap's prometheus 0.14
# + lazy_static idiom; src/metrics.rs registers everything into one Registry.
# 0.14 (not 0.13): prometheus 0.13 pins `protobuf ^2.0`, which resolves the
# unmaintained protobuf 2.28.0; 0.14 requires `protobuf ^3.7.2` (the advisory
# fix line). elohim-bitswap is already on 0.14, so this converges the two.
prometheus = "0.14"
lazy_static = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
dirs = "5"
uuid = { version = "1", features = ["v4"] }

# Reed-Solomon encoding for erasure coding
reed-solomon-erasure = "6"

# Graph-native projection substrate — CozoDB embedded
# Gated under graph-native feature (default-on).
# Using storage-sled backend to avoid sqlite3-src links conflict with
# holochain_types -> rusqlite -> libsqlite3-sys (both declare links = "sqlite3").
# sled 0.34.7 is already a direct dep; no new native lib conflict introduced.
# rayon is an unconditional dep in cozo 0.7 core code (eval.rs); must be enabled
# even without graph-algo. Avoiding graph (and graph_builder) which has rayon API breakage.
cozo = { version = "0.7", default-features = false, features = ["storage-sled", "rayon"], optional = true }

# GraphQL server for the /api/v1/graphql surface (Apollo Federation v2 subgraph SDL).
# Gated under graph-native feature alongside CozoDB. No axum integration — we use
# hyper directly and hand-roll the handler (read body → execute → serialize response).
async-graphql = { version = "7", optional = true }

# CPU profiling — Go-compatible pprof exposition for the Grafana Alloy /
# Pyroscope scraper (`GET /debug/pprof/profile?seconds=N`, env-gated by
# ELOHIM_PPROF_ENABLED, default OFF). See src/pprof_endpoint/.
#
# NO CODEC FEATURE — this is load-bearing, not an oversight. BOTH of pprof's
# protobuf codec features are UNBUILDABLE in this crate, for the same reason:
#
#   This crate compiles under RUSTFLAGS='--cfg getrandom_backend="custom"'
#   (see src/getrandom_custom.rs — the holochain dep family requires it). Cargo
#   applies RUSTFLAGS to BUILD SCRIPTS too when no explicit `--target` is
#   passed, and a build-script binary has no access to our `#[no_mangle]
#   __getrandom_v03_custom` shim (that symbol is linked into the lib/bin, not
#   into host build artifacts). So ANY build-dependency that transitively links
#   `getrandom` fails at link time with:
#       rust-lld: error: undefined symbol: __getrandom_v03_custom
#         >>> referenced by ... libtempfile-*.rlib
#
#   * `protobuf-codec` → build-dep `protobuf-codegen` → `protobuf-parse` →
#     `tempfile` → `getrandom`. Verified failing 2026-08-14.
#   * `prost-codec`    → build-dep `prost-build` → `tempfile` → `getrandom`,
#     AND it pins `prost 0.12`/`prost-build 0.12` against this tree's 0.14.1,
#     forking a second prost. Doubly rejected.
#   * The `_protobuf` gate cannot be reached without one of those two features
#     (pprof's `protos` module is `cfg(prost-codec)` / `cfg(protobuf-codec)`).
#
# The escape hatch that DOES work — `cargo build --target x86_64-unknown-linux-gnu`,
# which stops cargo passing RUSTFLAGS to build scripts (verified: pprof's build
# script links clean that way) — is deliberately NOT taken here. It would move
# every artifact path in this crate's Dockerfile, justfile, pre-push gate and
# edge pipeline. That is a build-convention change for the whole crate, not a
# profiling-leg change.
#
# So: pprof supplies the SAMPLER only (`ProfilerGuardBuilder` → `Report`, whose
# `data`/`timing` fields are public), and `pprof_endpoint::profile_proto`
# encodes Google's profile.proto with prost. No build script, no codegen.
#
# default-features = false also drops pprof's default `cpp` feature (the
# symbolic-demangle C++ demangler); Rust symbol demangling is retained via
# symbolic-demangle's `rust` feature, which pprof declares unconditionally.
# nix 0.26 (pprof's signal/timer dep) already resolves at 0.26.4 here.
pprof = { version = "0.15", default-features = false }

# profile.proto encoder for the pprof body above. prost 0.14.1 is ALREADY the
# resolved version in this tree; declaring it direct adds no new package and no
# build script (prost-derive is a proc macro with no getrandom in its tree).
prost = "0.14"

# gzip framing for the pprof body — Go's net/http/pprof returns a
# gzip-compressed profile.proto, and google/pprof (which Pyroscope parses with)
# sniffs the gzip magic. Emitting the same framing keeps the endpoint
# byte-shaped like a Go target. Already in the resolved tree (1.1.5) via zip.
flate2 = "1"

# Cross-platform filesystem free-space probe (peer-stewarded availability heartbeat)
fs4 = "0.8"

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# RFC 5545 RRULE parsing for recurrence schedules (Kairos temporal dimension)
rrule = "0.14"

# ZIP extraction for HTML5 apps
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# rust-libp2p - same P2P foundation as Holochain (via kitsune_p2p)
# https://github.com/libp2p/rust-libp2p
libp2p = { version = "0.54", features = [
    "tcp",              # TCP transport
    "dns",              # DNS resolution for /dns4/... multiaddrs
    "noise",            # Noise protocol encryption
    "yamux",            # Stream multiplexing
    "kad",              # Kademlia DHT
    "gossipsub",        # Pub/sub for recovery invitation broadcast
    "request-response", # Shard transfer protocol
    "mdns",             # Local network discovery
    "relay",            # NAT traversal relay
    "dcutr",            # Direct Connection Upgrade through Relay
    "ping",             # Ping protocol for RTT measurement
    "autonat",          # Automatic NAT detection
    "tokio",            # Async runtime integration
    "macros",           # NetworkBehaviour derive macro
    "identify",         # Protocol identification
    "ed25519",          # Ed25519 key support
    "serde",            # Serialization for PeerId etc
], optional = true }

# Futures for async traits (used by libp2p request-response)
futures = { version = "0.3", optional = true }

# iroh — QUIC-based P2P transport (parallel stack; staged cutover from libp2p).
# Pinned to iroh-blobs 0.94 (Sep 2025) which pulls iroh 0.92. Both use stable
# ed25519-dalek 2.2 + curve25519-dalek 4.1 — versus iroh-blobs 0.95+ which
# moves to a pre-release crypto path (curve25519-dalek 5.0.0-pre.1) that has
# a published-source bug (digest::crypto_common path mismatch). Coexists with
# current holochain dev.5 + multihash-codetable 0.2 — see plan version-pinning
# rationale in genesis/docs/superpowers/plans/2026-05-07-iroh-parallel-stack.md.
# iroh-gossip 0.92 aligns with iroh 0.92's iroh-base; pulled in at Phase 4
# pickup. Verified in isolation 2026-05-08; in-workspace probe pending.
iroh = { version = "=0.92", optional = true }
iroh-blobs = { version = "=0.94", optional = true }
iroh-gossip = { version = "=0.92", optional = true }

# Direct dep on `rand` for iroh SecretKey generation (OsRng).
# Already in the transitive tree; declare direct so call sites can use it.
rand = { version = "0.8", optional = true }

# Optional: Compression for blobs
lz4_flex = { version = "0.11", optional = true }

[features]
default = ["p2p", "graph-native"]
compression = ["lz4_flex"]
graph-native = ["dep:cozo", "dep:async-graphql"]
p2p = ["libp2p", "futures"]
p2p-iroh = ["iroh", "iroh-blobs", "iroh-gossip", "rand", "futures"]
ssr = ["dep:elohim-render", "reqwest/blocking"]

[dev-dependencies]
tempfile = "3"
jsonschema = "0.28"
wiremock = "0.6"
# Adds `test-util` (paused/advanced virtual time, e.g. `#[tokio::test(start_paused = true)]`)
# on top of the main `tokio` dependency's "full" features for tests only — used by
# identity_fill.rs's run_once_bounded timeout tests to prove a 120s budget without a real wait.
tokio = { version = "1", features = ["test-util"] }
# pkarr resolver e2e (gate #10): minimal in-process pkarr relay using
# raw hyper (already a regular dep). Avoids dragging axum's serde >=1.0.220
# transitive constraint, which conflicts with holochain_serialized_bytes
# 0.0.56's exact pin to serde =1.0.219. Requires `pkarr` directly (not
# re-exported through iroh) for SignedPacket / PublicKey types in the test.
n0-future = "0.1"
pkarr = { version = "3.10", default-features = false, features = ["signed_packet"] }
# Benchmark harness for graph traversal (Task 34)
criterion = { version = "0.5", features = ["html_reports"] }
# Turns on the default-OFF `harness` feature (the C2/C3/C6b property + table
# harnesses) on top of the main `elohim-seam-contracts` dependency, for tests
# only — a runtime build never links them. Same shape as `tokio`'s `test-util`
# above. Consumed by `src/liveness_contract.rs` (plan task P2.2).
elohim-seam-contracts = { version = "0.1.0", path = "../../crates/seam-contracts", features = [
    "harness",
] }

[[bench]]
name = "graph_traversal"
harness = false

[[bin]]
name = "elohim-storage"
path = "src/main.rs"


# ---------------------------------------------------------------------------
# Admin-seam unblock (2026-08-07): see vendor/holochain_serialized_bytes-0.0.56/
# VENDOR-NOTE.md. Upstream hsb 0.0.56 pins `serde =1.0.219` and hsb 0.0.57 pins
# `serde =1.0.228`; the sdk domain-types crates hold `holo_hash =0.6.0` (a
# DNA-hash guard — the same crates are compiled into integrity WASM) which drags
# in 0.0.56, while the conductor-fork client family drags in 0.0.57 (both its
# holo_hash 0.6.3 and its holochain_types 0.6.3 require `=0.0.57`; the previous
# 0.9.0-dev.24 pin did the same). Only one serde 1.x can resolve, so the two
# exact pins deadlock the client family that knows the conductor's `relay_url`
# app-manifest field.
#
# This patch harmonises 0.0.56's serde pin onto 0.0.57's. Source is verbatim.
# Scope is this workspace only — the DNA zome workspaces keep their own locks and
# stay on holo_hash 0.6.0, so no DNA hash moves.
