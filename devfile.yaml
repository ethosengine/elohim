# devfile.yaml — the DEFAULT elohim workspace: the LAN node, the x86-64-v3 image.
#
# This file is a CHILD of devfile.base.yaml (everything a workspace needs lives there once).
# It states only what this workspace is: its name, the image tag, the memory/CPU envelope,
# the volume size. A capacity variant is another child of the same base — see
# devfile_x86_v2.yaml for the shem workspace — not a copy of this file.
#
# Overrides of parent components go under `parent.components` (naming the parent's component);
# a top-level `components:` entry with the same name would be a name collision.
schemaVersion: 2.2.0
metadata:
  name: elohim-devspace
  displayName: Holochain + Angular Development Environment
  description: >-
    Full-stack development with Holochain (Rust/Nix) backend and Angular frontend,
    plus Claude AI utilities
  icon: >-
    https://raw.githubusercontent.com/devfile/devfile-web/main/apps/landing-page/public/pwa-192x192.png
  tags:
    - Rust
    - Nix
    - Holochain
    - Angular
    - Node.js
    - Java
    - ubi10
    - Claude
    - mempalace
  projectType: holochain
  language: Polyglot
  version: 2.0.0

parent:
  # The base on the same branch as this file; Che reads it when a workspace is CREATED.
  uri: https://raw.githubusercontent.com/ethosengine/elohim/dev/devfile.base.yaml
  components:
    - name: tools
      container:
        image: harbor.ethosengine.com/devspaces/udi-plus-mem-rust-nix:latest
        memoryLimit: 30Gi
        memoryRequest: 8Gi
        cpuLimit: '10'
        cpuRequest: '6'
    # Single PVC — Che consolidates all volumes into one PVC anyway.
    - name: persistent
      volume:
        size: 220Gi
