server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Storybook static files under /ui-playground
    # Storybook generates fully-qualified asset paths — no SPA fallback needed,
    # but we do need the prefix alias and iframe.html support.
    location /ui-playground/ {
        alias /usr/share/nginx/html/ui-playground/;
        try_files $uri $uri/ /ui-playground/index.html;

        # Never cache index.html or iframe.html
        location ~* /ui-playground/(index|iframe)\.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }
    }

    # Aggressively cache content-hashed static assets
    location ~* ^/ui-playground/.*\.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
