# crates/consent-grant — the rules of asking a controller's consent from a terminal,
# shared by every party to it: the hosted portal (doorway), the native portal
# (elohim-storage) and the terminal that asks. Nested single-crate workspace root
# like its `crates/` siblings; wired by path dependency.
[workspace]

[package]
name = "elohim-consent-grant"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Controller-consent grant for the Elohim Protocol: a terminal asks, a controller approves in a portal, a single-use code returns by loopback or by paste, and the terminal redeems it. Plain-data rules only: no socket, no clock, no store."
authors = ["Elohim Protocol"]
license = "AGPL-3.0"
repository = "https://github.com/ethosengine/elohim"
publish = ["elohim"]

[lib]
name = "consent_grant"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
# The consent record is addressed exactly as every other atom is: canonical
# dag-cbor, CIDv1. `elohim-epr` owns that codec; it is not restated here.
elohim-epr = { path = "../../elohim/epr" }
serde = { version = "1.0", features = ["derive"] }
# The carrier's messages travel as JSON inside whatever the transport frames
# them in, so optional fields keep their meaning under a positional encoding.
serde_json = "1.0"
serde_ipld_dagcbor = "0.6"
sha2 = "0.10"
# Session-key proofs (`dpop`): the two algorithms a browser or a platform key
# store can hold today. ed25519-dalek is already in the tree (elohim-epr);
# p256 is RustCrypto's pure-Rust P-256, verification only.
ed25519-dalek = "2.1"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }

[dev-dependencies]
